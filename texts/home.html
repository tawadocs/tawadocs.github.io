<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tawa Archive | Digital Lexicon</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
:root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --accent: #007aff;
    --border: #e5e5e7;
    --sidebar: #f5f5f7;
    --secondary: #86868b;
    --trans-bg: #fbfbfd;
    --hover: #e8e8ed;
    --modal-bg: rgba(0,0,0,0.4);
}

[data-theme="dark"] {
    --bg: #121212;
    --text: #f5f5f7;
    --accent: #0a84ff;
    --border: #2c2c2e;
    --sidebar: #1c1c1e;
    --secondary: #98989d;
    --trans-bg: #1c1c1e;
    --hover: #2c2c2e;
    --modal-bg: rgba(0,0,0,0.7);
}

* { box-sizing: border-box; }
body { 
    margin: 0; 
    font-family: 'Inter', sans-serif; 
    color: var(--text); 
    background: var(--bg); 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
}

.top-nav { 
    height: 64px; 
    border-bottom: 1px solid var(--border); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 0 24px; 
    background: var(--bg); 
    z-index: 100;
    flex-shrink: 0;
}
.logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }

.app-container {
    display: flex;
    flex: 1;
    overflow: hidden;
}

.sidebar { 
    width: 300px; 
    background: var(--sidebar); 
    border-right: 1px solid var(--border); 
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
}

#searchBar { 
    width: 100%; 
    border: 1px solid var(--border); 
    background: var(--bg); 
    padding: 10px 14px; 
    border-radius: 8px;
    font-size: 0.9rem; 
    color: var(--text); 
    outline: none; 
    margin-bottom: 20px;
}

.nav-list { overflow-y: auto; flex: 1; }
.nav-item { 
    padding: 10px 12px; 
    font-size: 0.9rem; 
    border-radius: 8px; 
    cursor: pointer; 
    color: var(--text); 
    transition: 0.2s; 
    margin-bottom: 4px;
}
.nav-item:hover { background: var(--hover); }
.sidebar-group-title { 
    font-size: 0.7rem; 
    font-weight: 700; 
    color: var(--secondary); 
    margin: 20px 0 8px 12px; 
    text-transform: uppercase; 
    letter-spacing: 1px; 
}

.main-content { 
    flex: 1; 
    overflow-y: auto; 
    padding: 60px 8%; 
    background: var(--bg);
}

.section-tag { color: var(--accent); font-weight: 800; font-size: 0.8rem; margin-bottom: 10px; letter-spacing: 1.5px; }
.article-title { font-family: 'Crimson Pro', serif; font-size: 3.5rem; margin: 0 0 30px 0; font-weight: 700; line-height: 1.1; }
.article-body { font-family: 'Crimson Pro', serif; font-size: 1.5rem; line-height: 1.8; margin-bottom: 50px; }

.clickable-word { 
    cursor: pointer; 
    transition: 0.15s; 
    border-radius: 4px;
    padding: 2px 4px;
    display: inline-block;
}
.clickable-word:hover { background: var(--accent); color: white; }

.clean-translation { 
    background: var(--trans-bg); 
    border-radius: 12px; 
    padding: 30px; 
    border-left: 4px solid var(--accent);
}
.clean-translation h4 { margin: 0 0 10px 0; font-size: 0.7rem; color: var(--accent); text-transform: uppercase; }
.clean-translation p { font-family: 'Crimson Pro', serif; font-style: italic; font-size: 1.3rem; color: var(--secondary); margin: 0; }

.lexicon-panel { 
    width: 340px; 
    border-left: 1px solid var(--border); 
    padding: 40px 30px; 
    background: var(--bg); 
    overflow-y: auto;
}
.ins-word { font-family: 'Crimson Pro', serif; font-size: 2.5rem; font-weight: 700; word-wrap: break-word; }
.ins-ipa { color: var(--accent); font-family: monospace; font-size: 1.1rem; margin: 10px 0; }
.ins-gloss { 
    display: inline-block; 
    padding: 4px 10px; 
    background: rgba(255, 59, 48, 0.1); 
    color: #ff3b30; 
    font-weight: 700; 
    border-radius: 6px; 
    margin: 15px 0;
}
.ins-text { border-top: 1px solid var(--border); padding-top: 20px; color: var(--secondary); line-height: 1.6; white-space: pre-wrap; }

.modal { display: none; position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(10px); z-index: 1000; overflow-y: auto; }
.modal-content { background: var(--bg); width: 90%; max-width: 850px; margin: 40px auto; padding: 50px; border-radius: 24px; }
textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 15px; background: var(--bg); color: var(--text); font-family: monospace; margin-top: 10px; }
.minimal-input { border: none; border-bottom: 2px solid var(--border); width: 100%; outline: none; background: transparent; color: var(--text); padding: 10px 0; margin-bottom: 20px; }
.title-input { font-size: 2rem; font-family: 'Crimson Pro'; font-weight: 700; }

.btn-primary { background: var(--accent); color: white; border: none; padding: 10px 22px; border-radius: 20px; font-weight: 600; cursor: pointer; }
.btn-secondary { background: var(--hover); color: var(--text); border: none; padding: 10px 22px; border-radius: 20px; font-weight: 600; cursor: pointer; }
.static-alert { font-size: 0.8rem; color: var(--secondary); margin-top: 10px; font-style: italic;}
.btn-back {
    background: none;
    border: none;
    color: var(--secondary);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 0 10px;
    margin-right: 5px;
}
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
            <button class="btn-back" onclick="history.back()">←</button>
            <div class="logo">TAWA<span>ARCHIVE</span></div>
        </div>
        <div class="nav-right" style="display:flex; gap:10px;">
            <button class="btn-secondary" onclick="toggleTheme()">Theme</button>
        </div>
    </nav>

<div class="app-container">
    <aside class="sidebar">
        <input type="text" id="searchBar" placeholder="Search archive..." onkeyup="renderSidebar()">
        <div id="sidebar-results" class="nav-list"></div>
    </aside>

    <main class="main-content">
        <div id="article-view">
            <div style="text-align:center; margin-top:100px; color:var(--secondary);">
                <h1>Archive Reader</h1>
                <p>Select a manuscript from the sidebar.</p>
            </div>
        </div>
    </main>

    <aside class="lexicon-panel">
        <div style="font-size:0.65rem; font-weight:800; color:var(--secondary); letter-spacing:1.5px; margin-bottom:30px;">ANALYSIS</div>
        <div id="inspector-body">
            <p style="color:var(--secondary)">Click a word to inspect linguistic data.</p>
        </div>
    </aside>
</div>

<div id="editorModal" class="modal">
    <div class="modal-content">
        <input type="text" id="editTitle" placeholder="Article Title" class="minimal-input title-input">
        <input type="text" id="editSection" placeholder="CATEGORY" class="minimal-input">
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px; margin: 20px 0;">
            <div><label>Native Text</label><textarea id="editRaw" placeholder="Text..."></textarea></div>
            <div><label>IPA</label><textarea id="editIPA" placeholder="/.../"></textarea></div>
            <div><label>Gloss</label><textarea id="editGloss" placeholder="Gloss..."></textarea></div>
        </div>
        <label>Translation</label><textarea id="editTrans" placeholder="Translation..."></textarea>
        <div style="display:flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
            <button class="btn-secondary" onclick="closeEditor()">Cancel</button>
            <button class="btn-primary" onclick="processDraft()">Preview Draft</button>
        </div>
    </div>
</div>
<script>
    let archiveData = [
    {
        "id": 1,
        "title": "Definition of the Uncertainty Principle",
        "section": "Quantum Mechanics",
        "content_raw": "Nemuari Shitei, wa namanai imnyi \"Haizenbuug no Nemuari Shitei,\" ni \"Kwantam Mekanis\" no shi ue. Nemuari Shitei ni fofu mo \"arenenq wano, futa a unsunai ji ni shirennai zuteioe no gayanu kitei, imo (jijinu) jijitei we tawanu-myongu.\" Fofennai dami un: shi wan butei ni daminu nampangutas ue, mo zunu butei ni rra ue.",
        "translation": "The uncertainty principle, also known as Heisenberg's indeterminacy principle, is a fundamental concept in quantum mechanics. It states that there is a limit to the precision with which certain pairs of physical properties, such as position and momentum, can be simultaneously known. In other words, the more accurately one property is measured, the less accurately the other property can be known.",
        "gloss_data": "[{\"w\": \"Nemuari\", \"i\": \"nemua\\u027ai\", \"g\": \"decide-wild\"}, {\"w\": \"Shitei,\", \"i\": \"\\u0255\\u026a\\u0325tei\", \"g\": \"unit-PROD\"}, {\"w\": \"wa\", \"i\": \"wa\", \"g\": \"ADD\"}, {\"w\": \"namanai\", \"i\": \"namanai\", \"g\": \"call-MID\"}, {\"w\": \"imnyi\", \"i\": \"imo\\u0325n\\u02b2i\", \"g\": \"SIM.AUG.SUP\"}, {\"w\": \"\\\"Haizenbuug\", \"i\": \"hai(z,\\u0291)\\u025bmb\\u028a\\u02d0go\\u0325\", \"g\": \"heisenberg\"}, {\"w\": \"no\", \"i\": \"no\", \"g\": \"GEN\"}, {\"w\": \"Nemuari\", \"i\": \"nemua\\u027ai\", \"g\": \"decide-wild\"}, {\"w\": \"Shitei,\\\"\", \"i\": \"\\u0255\\u026a\\u0325tei\", \"g\": \"unit-PROD\"}, {\"w\": \"ni\", \"i\": \"ni\", \"g\": \"TOP\"}, {\"w\": \"\\\"Kwantam\", \"i\": \"k\\u02b7ant\\u0259m\", \"g\": \"quantum\"}, {\"w\": \"Mekanis\\\"\", \"i\": \"m\\u025bk\\u00e6n\\u026aso\\u0325\", \"g\": \"mechanics\"}, {\"w\": \"no\", \"i\": \"no\", \"g\": \"GEN\"}, {\"w\": \"shi\", \"i\": \"\\u0255\\u026a\\u0325\", \"g\": \"unit\"}, {\"w\": \"ue.\", \"i\": \"\\u0294ue\", \"g\": \"COP.POL|\"}, {\"w\": \"Nemuari\", \"i\": \"nemua\\u027ai\", \"g\": \"decide-wild\"}, {\"w\": \"Shitei\", \"i\": \"\\u0255\\u026a\\u0325tei\", \"g\": \"unit-PROD\"}, {\"w\": \"ni\", \"i\": \"ni\", \"g\": \"TOP\"}, {\"w\": \"fofu\", \"i\": \"\\u0278o\\u0325\\u0278u\", \"g\": \"speak.V\"}, {\"w\": \"mo\", \"i\": \"mo\", \"g\": \"QUOT\"}, {\"w\": \"\\\"arenenq\", \"i\": \"a\\u027aene(\\u0274,\\u014b)\", \"g\": \"change-ANT\"}, {\"w\": \"wano,\", \"i\": \"wano\", \"g\": \"time\"}, {\"w\": \"futa\", \"i\": \"\\u0278u\\u0325ta\", \"g\": \"cap\"}, {\"w\": \"a\", \"i\": \"\\u0294a\", \"g\": \"A\"}, {\"w\": \"unsunai\", \"i\": \"\\u0294\\u028ans(u\\u0325,u)nai\", \"g\": \"live.V-MID\"}, {\"w\": \"ji\", \"i\": \"d\\u0361\\u0291i\", \"g\": \"LOC\"}, {\"w\": \"ni\", \"i\": \"ni\", \"g\": \"TOP\"}, {\"w\": \"shirennai\", \"i\": \"\\u0255i\\u027a\\u025bn.nai\", \"g\": \"know.VBZ-MID\"}, {\"w\": \"zuteioe\", \"i\": \"(z,\\u0291)uteioe\", \"g\": \"two-PROD-ACC\"}, {\"w\": \"no\", \"i\": \"no\", \"g\": \"GEN\"}, {\"w\": \"gayanu\", \"i\": \"gayanu\", \"g\": \"physical-MOD\"}, {\"w\": \"kitei,\", \"i\": \"ci\\u0325tei\", \"g\": \"thing\"}, {\"w\": \"imo\", \"i\": \"imo\", \"g\": \"SIM\"}, {\"w\": \"(jijinu)\", \"i\": \"d\\u0361\\u0291id\\u0361\\u0291inu\", \"g\": \"SUP~LOC-MOD\"}, {\"w\": \"jijitei\", \"i\": \"d\\u0361\\u0291id\\u0361\\u0291itei\", \"g\": \"SUP~LOC-PROD\"}, {\"w\": \"we\", \"i\": \"we\", \"g\": \"AND\"}, {\"w\": \"tawanu-myongu.\\\"\", \"i\": \"tawanu-m\\u02b2\\u0254\\u014bu\", \"g\": \"progress-MOD-many-SRC.LEX|\"}, {\"w\": \"Fofennai\", \"i\": \"\\u0278o\\u0325\\u0278\\u025bn.nai\", \"g\": \"speak.VBZ-MID\"}, {\"w\": \"dami\", \"i\": \"dami\", \"g\": \"light\"}, {\"w\": \"un:\", \"i\": \"\\u0294\\u028an\", \"g\": \"INSTR\"}, {\"w\": \"shi\", \"i\": \"\\u0255i\\u0325\", \"g\": \"COND\"}, {\"w\": \"wan\", \"i\": \"wam\", \"g\": \"one\"}, {\"w\": \"butei\", \"i\": \"butei\", \"g\": \"PROP-PROD\"}, {\"w\": \"ni\", \"i\": \"ni\", \"g\": \"TOP\"}, {\"w\": \"daminu\", \"i\": \"dam\\u026anu\", \"g\": \"light-MOD\"}, {\"w\": \"nampangutas\", \"i\": \"namp\\u0259\\u014butaso\\u0325\", \"g\": \"number-SRC.LEX-POT\"}, {\"w\": \"ue,\", \"i\": \"ue\", \"g\": \"COP.POL\"}, {\"w\": \"mo\", \"i\": \"mo\", \"g\": \"SEQ\"}, {\"w\": \"zunu\", \"i\": \"(z,\\u0291)unu\", \"g\": \"two-MOD\"}, {\"w\": \"butei\", \"i\": \"butei\", \"g\": \"PROP-PROD\"}, {\"w\": \"ni\", \"i\": \"ni\", \"g\": \"TOP\"}, {\"w\": \"rra\", \"i\": \"\\u027ea\", \"g\": \"NEG\"}, {\"w\": \"ue.\", \"i\": \"\\u0294ue\", \"g\": \"COP.POL\"}]"
    }
];
    function toggleTheme() {
    const html = document.documentElement;
    const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
}

function renderSidebar() {
    const query = document.getElementById('searchBar').value.toLowerCase();
    const filtered = archiveData.filter(a => a.title.toLowerCase().includes(query));

    const groups = {};
    filtered.forEach((a) => {
        const sec = a.section || "Uncategorized";
        if (!groups[sec]) groups[sec] = [];
        groups[sec].push(a);
    });

    document.getElementById('sidebar-results').innerHTML = Object.keys(groups).map(section => `
        <div class="sidebar-group-title">${section}</div>
        ${groups[section].map(item => `
            <div class="nav-item" onclick="renderArticle(${item.id})">${item.title}</div>
        `).join('')}
    `).join('');
}

function renderArticle(id) {
    const a = archiveData.find(item => item.id === id);
    const glossData = JSON.parse(a.gloss_data);
    
    const wordsHTML = glossData.map(item => {
        const safeW = btoa(unescape(encodeURIComponent(item.w)));
        const safeG = btoa(unescape(encodeURIComponent(item.g)));
        const safeI = btoa(unescape(encodeURIComponent(item.i)));
        return `<span class="clickable-word" onclick="inspectWord('${safeW}', '${safeG}', '${safeI}', true)">${item.w}</span>`;
    }).join(' ');

    document.getElementById('article-view').innerHTML = `
        <div class="section-tag">${a.section.toUpperCase()}</div>
        <h1 class="article-title">${a.title}</h1>
        <div class="article-body">${wordsHTML}</div>
        <div class="clean-translation"><h4>Translation</h4><p>${a.translation}</p></div>
    `;
}

function openEditor() {
    document.getElementById('editorModal').style.display = 'block';
}

function closeEditor() { 
    document.getElementById('editorModal').style.display = 'none'; 
}

function processDraft() {
    const rawText = document.getElementById('editRaw').value.trim();
    const words = rawText.split(/\s+/);
    const ipas = document.getElementById('editIPA').value.trim().split(/\s+/);
    const glosses = document.getElementById('editGloss').value.trim().split(/\s+/);

    const newArt = {
        id: Date.now(),
        title: document.getElementById('editTitle').value || "Untitled Draft",
        section: document.getElementById('editSection').value || "Drafts",
        translation: document.getElementById('editTrans').value,
        gloss_data: JSON.stringify(words.map((w, i) => ({ w, i: ipas[i] || "", g: glosses[i] || "???" })))
    };

    archiveData.push(newArt);
    renderSidebar();
    renderArticle(newArt.id);
    closeEditor();
}

renderSidebar();

async function inspectWord(wEnc, gEnc, iEnc, isEncoded = false) {
    let word = isEncoded ? decodeURIComponent(escape(atob(wEnc))) : wEnc;
    let gloss = isEncoded ? decodeURIComponent(escape(atob(gEnc))) : gEnc;
    let ipa = isEncoded ? decodeURIComponent(escape(atob(iEnc))) : iEnc;

    const cleanWord = word.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");

    new Audio(`static/assets/${cleanWord}.m4a`).play().catch(() => {});

    let explanation = "Dictionary file not found in /lexicon/ folder.";
    try {
        const response = await fetch(`static/lexicon/${cleanWord}.txt`);
        if (response.ok) explanation = await response.text();
    } catch (e) {}

    document.getElementById('inspector-body').innerHTML = `
        <div class="ins-word">${word}</div>
        <div class="ins-ipa">${ipa || '/.../'}</div>
        <div class="ins-gloss">${gloss}</div>
        <div class="ins-text">${explanation}</div>
    `;
}
</script>
</body>
</html>
