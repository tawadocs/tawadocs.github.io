<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tawa no Kanji no ribu</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --accent: #ff77bc;
                --accent-glow: rgba(16, 185, 129, 0.2);
                --bg: #f90090;
                --card-bg: #0f0f12;
                --card-hover: #16161a;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --toki-yellow: #facc15;
                --toki-glow: rgba(250, 204, 21, 0.2);
                --border: rgba(255, 255, 255, 0.08);
                --border-hover: rgba(255, 255, 255, 0.15);
                --sidebar-bg: #0a0a0c;
            }

            * {
                box-sizing: border-box;
            }

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background-color: var(--bg);
                background-image: radial-gradient(
                    circle at 50% -20%,
                    #1e1e2e 0%,
                    #050505 80%
                );
                color: var(--text-main);
                margin: 0;
                padding: 0;
                line-height: 1.6;
                min-height: 100vh;
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            body::-webkit-scrollbar {
                display: none;
            }

            .container {
                max-width: 1000px;
                margin: 0 auto;
                padding: 4rem 2rem;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 4rem;
            }

            .logo-group {
                display: flex;
                gap: 1.5rem;
                align-items: center;
            }
            .logo-link {
                text-decoration: none;
                transition: transform 0.2s ease;
                cursor: pointer;
                user-select: none;
            }
            .logo-link:hover {
                transform: translateY(-1px);
            }
            h1 {
                font-size: 1.25rem;
                font-weight: 800;
                letter-spacing: -0.02em;
                color: white;
                margin: 0;
            }
            h1 span {
                color: var(--accent);
            }

            #search {
                display: block;
                width: 100%;
                max-width: 600px;
                margin: 0 auto 4rem;
                padding: 1.2rem 1.5rem;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid var(--border);
                backdrop-filter: blur(10px);
                border-radius: 16px;
                color: white;
                outline: none;
                font-size: 1.1rem;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            }
            #search:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 4px var(--accent-glow);
            }

            #results {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.5rem;
            }

            .entry {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 20px;
                padding: 1.5rem;
                cursor: pointer;
                transition: all 0.3s ease;
                position: relative;
            }
            .entry:hover {
                transform: translateY(-5px);
                background: var(--card-hover);
                border-color: var(--border-hover);
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            }

            .lang-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 6px 12px;
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--border);
                font-size: 0.7rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--text-muted);
                transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
                margin-bottom: 1.2rem;
                cursor: pointer !important;
                user-select: none;
                min-width: 100px;
            }

            .lang-toggle:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: var(--text-muted);
                color: white;
            }
            .lang-toggle.is-toki {
                background: var(--toki-yellow);
                color: #000;
                border-color: var(--toki-yellow);
                box-shadow: 0 4px 15px var(--toki-glow);
            }

            .word-title,
            .static-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: white;
                margin-bottom: 0.5rem;
                letter-spacing: -0.02em;
                transition:
                    opacity 0.2s ease,
                    transform 0.2s ease,
                    color 0.3s ease;
            }

            .is-shifting {
                opacity: 0;
                transform: translateY(2px);
            }
            .title-toki {
                color: var(--toki-yellow) !important;
            }

            .def-preview {
                font-size: 0.95rem;
                color: var(--text-muted);
                line-height: 1.5;
                pointer-events: none;
            }

            #modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.85);
                backdrop-filter: blur(12px);
                z-index: 1000;
                opacity: 0;
                visibility: hidden;
                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            }
            #modal-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            #modal {
                position: fixed;
                right: 0;
                top: 0;
                background: var(--sidebar-bg);
                width: 100%;
                max-width: 520px;
                height: 100vh;
                padding: 4rem 3rem;
                border-left: 1px solid var(--border);
                box-shadow: -20px 0 60px rgba(0, 0, 0, 0.8);
                display: flex;
                flex-direction: column;
                transform: translateX(100%);
                transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--accent) transparent;
            }

            #modal::-webkit-scrollbar {
                width: 6px;
            }
            #modal::-webkit-scrollbar-track {
                background: transparent;
            }
            #modal::-webkit-scrollbar-thumb {
                background: var(--border-hover);
                border-radius: 10px;
            }

            #modal-overlay.active #modal {
                transform: translateX(0);
            }

            .modal-close {
                position: absolute;
                top: 2rem;
                right: 2.5rem;
                cursor: pointer;
                color: var(--text-muted);
                font-size: 1.5rem;
                transition: 0.2s;
                user-select: none;
                z-index: 10;
            }
            .modal-close:hover {
                color: white;
                transform: rotate(90deg);
            }

            .static-title {
                font-size: 3.5rem;
                font-weight: 800;
                margin-bottom: 0rem;
            }

            .id-container {
                margin-bottom: 1.5rem;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .id-label {
                font-size: 0.65rem;
                font-weight: 800;
                text-transform: uppercase;
                color: var(--toki-yellow);
                opacity: 0.8;
                letter-spacing: 0.05em;
            }
            .static-id {
                background: rgba(250, 204, 21, 0.05);
                border: 1px solid rgba(250, 204, 21, 0.2);
                border-radius: 6px;
                padding: 4px 10px;
                color: var(--toki-yellow);
                font-size: 0.9rem;
                font-weight: 600;
                width: auto;
            }

            .static-defs-div {
                font-size: 1.2rem;
                line-height: 1.8;
                color: var(--text-main);
                padding: 0.5rem 0 1rem 0;
                width: 100%;
            }
            .semantic-title {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.15em;
                color: var(--accent);
                margin: 3rem 0 1rem 0;
                font-weight: 700;
                opacity: 0.8;
            }
            .modal-divider {
                height: 1px;
                background: var(--border);
                margin: 2rem 0;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="logo-group">
                    <a href="#" class="logo-link"
                        ><h1>
                            Tawa no <span>Kanji</span> no <span>ribu</span>
                        </h1></a
                    >
                    <a href="/" class="logo-link"
                        ><h1>ii miri <span>Tawa</span></h1></a
                    >
                </div>
            </header>

            <input
                type="text"
                id="search"
                placeholder="Search the lexicon..."
                autocomplete="off"
            />

            <div id="results"></div>
        </div>

        <div id="modal-overlay" onclick="closeModal()">
            <div id="modal" onclick="event.stopPropagation()">
                <span class="modal-close" onclick="closeModal()">×</span>
                <div id="modal-content"></div>
            </div>
        </div>

        <script>
            const DICTIONARY = [{"word":"kangi","id":"waso telo","definitions":[{"text":"(wild) duck","frequency":100},{"text":"mallard","frequency":100},{"text":"gullible","frequency":100},{"text":"easy to defeat","frequency":100},{"text":"manipulable","frequency":100},{"text":"winter","frequency":100}]},{"word":"kanginq","id":"waso telo pi ala","definitions":[{"text":"(domesticated) duck","frequency":100},{"text":"non-mallard","frequency":100},{"text":"diving duck","frequency":100},{"text":"summer","frequency":100},{"text":"cuddly","frequency":100},{"text":"cute","frequency":100},{"text":"beautiful","frequency":100},{"text":"fluffy","frequency":100},{"text":"rubber duck","frequency":100},{"text":"fattier (duck)","frequency":100}]},{"word":"kangata","id":"duckphoria","definitions":[{"text":"the happiness felt from ducks","frequency":100},{"text":"duckphoria","frequency":100},{"text":"duckhappiness","frequency":100},{"text":"duckhappy","frequency":100}]},{"word":"kowaisoho","id":"akesi linja","definitions":[{"text":"a snake","frequency":100},{"text":"a snake-like reptile","frequency":100},{"text":"backstabber","frequency":100},{"text":"backstabbing","frequency":100},{"text":"(to) rat (out)","frequency":100},{"text":"betray","frequency":100},{"text":"sneaky","frequency":100}]},{"word":"maku","id":"pana e telo","definitions":[{"text":"weep","frequency":100},{"text":"cry","frequency":100},{"text":"shed tears","frequency":100},{"text":"sob","frequency":100},{"text":"whimper","frequency":100},{"text":"wail","frequency":100},{"text":"bawl","frequency":100},{"text":"bellow","frequency":100},{"text":"crying (thing","frequency":100},{"text":"wound)","frequency":100},{"text":"plea","frequency":100},{"text":"plead","frequency":100}]},{"word":"ushikitsu","id":"pilin wile kama","definitions":[{"text":"fun","frequency":100},{"text":"comfort","frequency":100},{"text":"enjoy","frequency":100},{"text":"pleasant","frequency":100},{"text":"delightful","frequency":100},{"text":"anticipation","frequency":100},{"text":"excited","frequency":100}]},{"word":"koibwu","id":"musi ala","definitions":[{"text":"bored","frequency":100},{"text":"disinterested","frequency":100},{"text":"uninspiring","frequency":100},{"text":"worthless","frequency":100},{"text":"exhausted","frequency":100},{"text":"fed up","frequency":100},{"text":"tired","frequency":100},{"text":"loss of interest","frequency":100},{"text":"lethargy","frequency":100},{"text":"burdensome lack of motivation","frequency":100},{"text":"apathy","frequency":100},{"text":"indifference","frequency":100}]},{"word":"maracata","id":"pilin pona mute","definitions":[{"text":"ecstasy","frequency":100},{"text":"ecstatic","frequency":100},{"text":"orgasmic","frequency":100},{"text":"warmth","frequency":100},{"text":"soothing","frequency":100},{"text":"relaxing","frequency":100},{"text":"ejaculate","frequency":100},{"text":"climax","frequency":100},{"text":"spasm (from good feelings)","frequency":100}]},{"word":"hwogimi","id":"pakala li pini","definitions":[{"text":"make whole","frequency":100},{"text":"mend","frequency":100},{"text":"fill (a gap)","frequency":100}]},{"word":"rewaruiki","id":"tame pi len sijelo","definitions":[{"text":"skin cancer","frequency":100},{"text":"mesothelioma","frequency":100}]},{"word":"haginkiswo","id":"pakala lon sijelo","definitions":[{"text":"tumour","frequency":100},{"text":"growth","frequency":100},{"text":"swell","frequency":100},{"text":"swollen","frequency":100},{"text":"inflammation","frequency":100},{"text":"lesion","frequency":100},{"text":"neoplasm","frequency":100},{"text":"boil","frequency":100},{"text":"lump","frequency":100},{"text":"swollen tissue","frequency":100},{"text":"corruption","frequency":100},{"text":"harmful growing","frequency":100}]}];

            const SEMANTIC_SPACE = {"akesi linja":"kowaisoho (kowo+aiso+ho) is the word used for \"snake.\" It can refer to actual snakes (kikitanq kowaisohlóõ (I hate snakes)) or 'snakes' in the figurative sense, like how we use rat in English slang - 'kowaisohychsubekã à' (all snakes! - referring to people as sly, backstabbers, or betrayers). You can use it as a verb, in which it means slither, like 'soa kowaisofu' (he slithered (like a snake)). The verbal meaning can also be figurative, as in betray or backstab. kowaisoho can also be used as a vulgar or crude word for a penis. kowaisohot is the negative form (backstab, betray), and kowaisohóy would be the more 'positive' form (sneaky, sly). Though calling your friend \"kowaisoho\" would be quite rude, so the positive form is mandatory, plus using another word is highly encouraged - 'lilikowaisohóy' or 'sawakowaisohóy' (little sneaky (person) or sweet and cunning respectively). It can also refer to kebab or any item that looks like a snake. Unfortunately, it can also mean poop or turd if implied, and this is generally rude to do, since kowaisoho is also a food term. So be cautious when using kowaisoho as a slang for poop or turd.","pana e telo":"from ma (three drops of water) + ku (stand, rise, establishment), it represents water flowing down a standing person. It refers to crying, sobbing, or severe emotional distress (mamaku / makunyi). Shedding a tear or the lowest form is makusta. it can also refer to pleas, pleading, or 'crying' for help. Depending on how severe it is, maku, mamaku, makunyi, or mamakunyi are used to specify.","waso telo":"from ka (shell, first) + ngi (bird), this refers to wild ducks. so if it's in a pond, it's a kangi. more specifically, it can refer to mallards. When used as an adjective, it can be slightly derogatory or cheeky and playful. So calling someone kangi means that they're gullible or easy to defeat. When used with positive connotations, as in kangioy, it can mean beautiful, cute, or cuddly, though you can also use kanginq for that. Kangi also refers to winter season. When used to describe winter, especially in poetry, it sets the scene for a solemn, cold, quiet, and reflective imagery.","waso telo pi ala":"from kangi + nq (or aiso+kan+gi), this refers to domesticated ducks. so if it's in a farm or house, it's a kanginq. more specifically, it can refer to diving ducks. When used as an adjective, it means cute, beautiful, fluffy, or cuddly. So calling someone kanginq means that they're beautiful, cute, or cuddly. Kanginq also refers to summer season. When used to describe summer, it's imagery contains slice-of-life, warm, emotional, and calm or joyous scenery. The standard Tawish word is \"kanginq,\" but the Modern kanji version is \"aisokangi.\" Only kanginq is important or mandatory to learn.","duckphoria":"from kangi (duck) + ((n)ata(se)), kangata refers to the happiness derived from a duck. it is when you see a duck and become duckhappy. The formal word is kanginirunaiqe (archaic or literary). kangataqe is also an acceptable form, meaning the emotion felt from duckphoria itself. so it refer to the feeling of duckphoria. Very meta!","pilin wile kama":"Ushikitsu possesses a semantic space primarily centered on the concept of enjoyment, fun, and pleasure, but it extends further to describe pleasant experiences and, in related forms, anticipation of the future. It is a broad, subjective adjective describing an experience or state, rather than just a momentary feeling. For example, \"fun time\" is \"ushikitsu(ã) wano\". Heartwarming or comfort is also ushikitsu, like \"sa ni ushikitsua\" (she is heartwarming / ~my comfort-person). As a verb, ushikitsu is about taking pleasure in or enjoying, like in \"ushikitsuru wanosun jiteisanji\" (I enjoyed my time at her place). When passive, it can mean relief, comfort, or easy, like in \"su ni ushikitsunai\" (I am relieved). It can also be used to describe excitedness, like in 'ushikitsu kamu\" (to eat happily / excitedly). you can also use it for \"looking forward to,\" like in \"Ushikitsureu kangiwano\" (~looking forward to winter season).","musi ala":"Koibwu is the stereotypical \"bored\" word. you say it when there's nothing to do, you say it when you're fed up, etc. to better convey this, use the particles -sta, -nyi, and -ie as well as reduplication. Kokoibwu refers to exhaustion, tiredness, and koibwunyi refers to lethargy, apathy, burdensome lack of motivation. Kokoibwunyi would be the ultimate and most strong form, referring something like a total loss of the will to live itself, but context would convey the meaning. In its diminutive forms, as koibwusta, it simply refers to a simple \"eh, nothing to do\" remark. It can also refer to dryness (as in dry people) or blandness. Repetitiveness or overexposure is also koibwu.","pilin pona mute":"Maracata (from maraca (to soothe) + ata (happy)) refers to the happiness that soothing or pleasuring yields. It's other form, maracanyata (maraca+nyu+ata) is used for orgasms or sexual pleasure. The mamaracata and maracatasta forms are used for the superlative (disorienting euphoria, cruising the bliss sea, overwhelming ecstasy) and diminutive (relaxed, soothed) respectively. Why not just use kanata? Maracata implies that the happiness was reached through some sort of relaxing, soothing, or something else, whereas kanata does not. Compare: \"so ni o nuku maracata\" (he soothed me / relaxed me into joy) vs. \"so ni o nuku kanata\" (he made me happy). Superlative and diminutive form exist for the sexual \"maracanyata\" as well. It can also refer to ejaculation if used with the proper case / grammar or in the proper context.","pakala li pini":"hwogimi (from woi + hyo + go + mi) refers to mending something or filling a hole at the core. it is when something missing is made hole again. for example, 'kanatanq honcha ni sua hwogimi' (I helped the sad girl feel better). Hwogimi alone does not have sexual connotations, but as hwogiminyu, it might. Hwogimista is a diminutive form, meaning \"patch (up / together)\" or \"stitch.\" It's different from hwogimi in that patching something up can be rough but mending something isn't. Some tape over a leaking bottle is patching it up, but it does not mean it'll hold. Hwohwogimi would be a superlative, meaning something along the lines of \"complete.\" For monetary or financial compensation, hwaregimi is used (from woi + hyo + (k)are + go + mi).","tame pi len sijelo":"it refers to skin cancer. it's made from re (inside, middle) + awa (skin, hide) + uru (body, meat) + iki (village). Uruiki refers to heaviness, but it means swollen / tumour here. Rewa means inside the skin. Together, rewauruiki refers to mesothelioma.","pakala lon sijelo":"haginkiswo ('a+gyo+hin+iki+swo) refers to any abnormal or non-normal growth anywhere. it can be the spreading of harmful rhetoric through a society (a tumour of society) or it can be malignant cancer. For negatives, usually the haginkiswot form is used (malignant, cancer, harmful). For positives, the haginkiswoy form is used; however, haginkiswoy often does not refer to benign tumours, since those aren't really 'good' or positive. For that, you'll use something like haginkiswotasnh (~benign tumour, harmless growth, useless swelling). haginkiswo can also refer to inflammation, both inside (haginkiswoji) something or outside (haginkiswojinh) something."};

            function handleToggle(event, word, tokiPona) {
                event.stopPropagation();
                const btn = event.currentTarget;
                const container =
                    btn.closest(".entry") || btn.closest("#modal");
                const titleEl =
                    container.querySelector(".word-title") ||
                    container.querySelector(".static-title");

                const isToki = btn.classList.toggle("is-toki");
                titleEl.classList.add("is-shifting");

                setTimeout(() => {
                    btn.innerHTML = isToki
                        ? "<span>Toki Pona</span>"
                        : "<span>Tawa</span>";
                    titleEl.textContent = isToki ? tokiPona : word;

                    if (isToki) titleEl.classList.add("title-toki");
                    else titleEl.classList.remove("title-toki");

                    titleEl.classList.remove("is-shifting");
                }, 150);
            }

            const isCompound = (word) => word.trim().includes(" ");

            const compoundSort = (a, b) => {
                const aComp = isCompound(a.word);
                const bComp = isCompound(b.word);
                if (aComp && !bComp) return 1;
                if (!aComp && bComp) return -1;
                return a.word.localeCompare(b.word);
            };

            function searchDictionary(query) {
                const q = query.toLowerCase();
                if (!q) return [...DICTIONARY].sort(compoundSort);

                let results = DICTIONARY.filter((entry) => {
                    const wordMatch = entry.word.toLowerCase().includes(q);
                    const defMatch = entry.definitions.some((d) =>
                        d.text.toLowerCase().includes(q),
                    );
                    const ssMatch = SEMANTIC_SPACE[entry.id]
                        ?.toLowerCase()
                        .includes(q);
                    return wordMatch || defMatch || ssMatch;
                });

                return results.sort((a, b) => {
                    const wordA = a.word.toLowerCase();
                    const wordB = b.word.toLowerCase();

                    // Priority 1: Exact matches
                    if (wordA === q && wordB !== q) return -1;
                    if (wordB === q && wordA !== q) return 1;

                    // Priority 2: Starts with
                    if (wordA.startsWith(q) && !wordB.startsWith(q)) return -1;
                    if (wordB.startsWith(q) && !wordA.startsWith(q)) return 1;

                    return compoundSort(a, b);
                });
            }

            function renderResults(query = "") {
                const results = searchDictionary(query);
                document.getElementById("results").innerHTML = results
                    .map(
                        (entry) => `
    <div class="entry" onclick="openModal('${entry.word}')">
      <div class="lang-toggle" onclick="handleToggle(event, '${entry.word}', '${entry.id}')">
        <span>Tawa</span>
      </div>
      <div class="word-title">${entry.word}</div>
      <div class="def-preview">${entry.definitions.map((d) => d.text).join(", ")}</div>
    </div>
  `,
                    )
                    .join("");
            }

            function openModal(word) {
                const entry = DICTIONARY.find((e) => e.word === word);
                if (!entry) return;

                const defString = entry.definitions
                    .map((d) => d.text)
                    .join(", ");
                const ssText = SEMANTIC_SPACE[entry.id] || "";

                const modalContent = document.getElementById("modal-content");
                modalContent.innerHTML = `
    <div class="lang-toggle" onclick="handleToggle(event, '${entry.word}', '${entry.id}')">
      <span>Tawa</span>
    </div>
    <div class="static-title">${entry.word}</div>

    <div class="id-container">
      <span class="id-label">Toki Pona</span>
      <div class="static-id">${entry.id}</div>
    </div>

    <div class="static-defs-div">${defString}</div>
    <div class="modal-divider"></div>
    <div class="semantic-title">Semantic space</div>
    <div class="static-defs-div" style="color: var(--text-muted); font-size: 1.1rem;">${ssText}</div>
  `;

                const overlay = document.getElementById("modal-overlay");
                overlay.style.display = "block";
                void overlay.offsetWidth;
                overlay.classList.add("active");

                document.getElementById("modal").scrollTop = 0;
                document.body.style.overflow = "hidden";
            }

            function closeModal() {
                const overlay = document.getElementById("modal-overlay");
                overlay.classList.remove("active");
                document.body.style.overflow = "";
                setTimeout(() => {
                    overlay.style.display = "none";
                }, 400);
            }

            document
                .getElementById("search")
                .addEventListener("input", (e) =>
                    renderResults(e.target.value),
                );

            // Initial load
            renderResults();
        </script>
    </body>
</html>
