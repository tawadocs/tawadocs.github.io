<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tawa Docs</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card-bg: #161b22; --text: #e2e8f0; --accent: #818cf8; --border: rgba(255, 255, 255, 0.06); --sidebar-bg: #0f1319; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 2rem 1.5rem; }
        .sidebar-header h1 { font-size: 1.2rem; margin: 0 0 2rem 0; cursor: pointer; color: white; }
        #doc-search { width: 100%; padding: 0.8rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 1.5rem; outline: none; box-sizing: border-box; }
        .doc-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .doc-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; color: #94a3b8; transition: 0.2s; margin-bottom: 4px; font-size: 0.95rem; }
        .doc-item:hover { background: var(--card-bg); color: white; }
        .doc-item.active { background: var(--accent); color: white; font-weight: 600; }
        #content-area { flex-grow: 1; padding: 4rem; overflow-y: auto; display: flex; justify-content: center; background: var(--bg); }
        .markdown-body { width: 100%; max-width: 750px; line-height: 1.8; color: #cbd5e1; }
        .markdown-body h1 { font-size: 2.8rem; color: white; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
        .markdown-body h2 { color: var(--accent); margin-top: 2rem; }
    </style>
</head>
<body>
<div id="sidebar">
    <div class="sidebar-header"><h1 onclick="location.href='/'">← Tawa</h1></div>
    <input type="text" id="doc-search" placeholder="Search keywords..." oninput="loadList()">
    <ul id="doc-list" class="doc-list"></ul>
</div>
<div id="content-area">
    <div id="view" class="markdown-body">
        <h1>Iyuko ẽ Pamya</h1>
        <p>Select a chapter from the sidebar.</p>
    </div>
</div>

<script>
// bake.js will replace the {} with your markdown content
const DOCS_DATA = {"1 Phonology.md":"## 1.1 Consonant inventory\n|                    | Plosive | Nasal  | Fricative | Affricate | Tap/flap | Glide | Approximant |\n| ------------------ | ------- | ------ | --------- | --------- | -------- | ----- | ----------- |\n| **Bilabial**       | b p     | m m̥͡m | ɸ         |           |          |       |             |\n| **Labiodental**    |         |        |           |           |          |       | ʋ           |\n| **Linguolabial**   |         | n̼     |           |           |          |       |             |\n| **Dentialveolar**  | t tʰ d  |        |           | t͡s d͡z   |          |       | l           |\n| **Alveolar**       |         | n      | s z       |           | ɺ ɾ      |       |             |\n| **Alveolopalatal** |         | nʲ     | ɕ ʑ       | t͡ɕ d͡ʑ   |          |       |             |\n| **Palatal**        |         |        | ç͡j       | c͡ç       |          | j     | ʎ           |\n| **Velar**          | k kʰ g  | ŋ      |           |           |          |       |             |\n| **Labiovelar**     |         |        |           |           |          | w     |             |\n| **Uvular**         |         | ɴ      |           |           |          |       |             |\n| **Glottal**        | ʔ       |        | h         |           |          |       |             |\n\n## 1.2 Vowel inventory\n|               | Front | Near-front | Central | Near-back | Back |\n| ------------- | ----- | ---------- | ------- | --------- | ---- |\n| **High**      | i ĩ  |            |         |           | u ũ |\n| **Near-high** |       | ɪ          |         | ʊ         |      |\n| **Mid**       | e ẽ  |            | ə       |           | o õ |\n| **Low-mid**   |       | ɛ          |         | ʌ         |      |\n| **Near-low**  | æ     |            |         |           | ɔ    |\n| **Low**       |       |            | a ã    |           |      |\n* Vowels are split into these groups:\n\t* Regular: *a i u e o*\n\t* Nasal: *ą į ų ę ǫ*\n\t* Peripheral: *á í ú é ó*\n\t* Neutral: *à ù*\n\n## 1.3 Allophones\n| Phoneme | Allophone | Condition                 |\n| ------- | --------- | ------------------------- |\n| nʲ      | ɲ         | /ɲ/ in consonant clusters |\n| n       | ɲ         | /ɲ/ before [i ĩ ɪ]       |\n| n       | ŋ         | /ŋ/ before velars         |\n| h       | j̊        | /j̊/ before [i ĩ ɪ]      |\n| h       | ɸ         | [ɸ] before [u ũ]         |\n* *n* [n] changes into *m* [m] before bilabials (e.g., *hon* + *ppu* -> *homppu*)\n","2 Script.md":"## 2.1 Basic rules\n* [kʰ] *c* is realised as [c͡ç] before [i ĩ ɪ]\n* So, *ca cu ce co* are simply [kʰa kʰu kʰe kʰo], but *ci* is [c͡çi]\n* The palatalised \"h\" sound *hy* [hʲ] is actually [çj]; but *hyi* is not a valid syllable, instead *hi* [j̊i] is simply used\n* *th* is used instead of *tu* (*tu*->*tsu* now)\n\t* so, *korotu* -> *korothu*\n* So, *katu* becomes *kathu*\n\n### 2.1.2 Writing system\n| Consonant | Grapheme | Consonant | Grapheme |\n| --------- | -------- | --------- | -------- |\n| **b**     | b        | **p**     | p        |\n| **m**     | m        | **m̥͡m**  | mh       |\n| **ɸ**     | f        | **ʋ**     | v        |\n| **ʋ̃**    | v'       | **n̼**    | nh       |\n| **t**     | t        | **tʰ**    | th       |\n| **d**     | d        | **t͡s**   | ts       |\n| **d͡z**   | dz       | **n**     | n        |\n| **s**     | s        | **z**     | z        |\n| **ɺ**     | r        | **ɾ**     | rr       |\n| **nʲ**    | ny       | **ɕ**     | ŝ       |\n| **ʑ**     | ẑ       | **t͡ɕ**   | ĉ       |\n| **d͡ʑ**   | j        | **ç͡j**   | hy       |\n| **c͡ç**   | q        | **j**     | y        |\n| **ʎ**     | ly       | **k**     | k        |\n| **kʰ**    | kh       | **g**     | g        |\n| **w**     | w        | **ɴ**     | nq       |\n| **h**     | h        | **ʔ**     | ′        |\n| **ŋ**     | ng       | -         | -        |\n\n| Grapheme (short) | Grapheme (long) | Phoneme | Phoneme (long) |\n| ---------------- | --------------- | ------- | -------------- |\n| a                | aa              | a       | aː             |\n| i                | ii              | i       | iː             |\n| u                | uu              | u       | uː             |\n| e                | ee              | e       | eː             |\n| o                | oo              | o       | oː             |\n| ą                | ąą              | ã      | ãː            |\n| į                | įį              | ĩ      | ĩː            |\n| ų                | ųų              | ũ      | ũː            |\n| ę                | ęę              | ẽ      | ẽː            |\n| ǫ                | ǫǫ              | õ      | õː            |\n| á               | áá            | æ       | æː             |\n| í               | íí            | ɪ       | -              |\n| ú               | úú            | ʊ       | ʊː             |\n| é               | éé            | ɛ       | ɛː             |\n| ó               | óó            | ɔ       | ɔː             |\n| à               | àà            | ə       | əː             |\n| ù               | ùù            | ʌ       | ʌː             |\n","3 Phonotactics.md":"## 3.1 Syllable structure and stress\n* The syllable structure is simply (C)V(C)\n* Stress always falls on the first syllable, so always ['kanata], never [ka'nata]\n* Roots must follow (C)V(N)\n\n## 3.2 Vowel changes\n* The vowel *o* can drop and the first consonant or vowel of the suffix is simply attached\n* However, if the sound preceding the *o* is *r*, then *o* does not drop, but if the affix starts with an *-r* then the *o* is dropped in favour of *rr* [ɾ]\n* The *o* is not dropped if the verb accepts an affix which has a verbal form\n* The *o* is dropped and replaced with a verb marker if it accepts an object and if the affix does not have a verbal form\n* If the consonant cluster is something like *C* + a liquid, then the *o* is preserved (like *emono* + *l* yields *emonol*)\n* If either plosives or dentialveolars have to cluster with one of their own family, like *senodo* + *to* as *senodto*, then the *o* is also preserved\n* If liquids have to cluster with their own kind, like *karo* + *l* as *karol*, then the *o* is preserved\n\n## 3.3 Banned syllables\n* *t* cannot appear in the forms *ti* *tį* or *tí*; instead, *ĉi ĉį* or *ĉí* is used or *thi thí* or *thį* is used\n* *d* cannot also appear in those forms; instead, *ji jį* or *jí* is used\n* *s* nor *z* cannot appear before *i į* or *í*; instead, *ŝi ŝį ŝí* and *ẑi ẑį ẑí* are used\n\n## 3.4 Morphophonemics\n* The particle *a* does not fuse in any way\n* Like, for example, *so* + *-a* would be *soa* and the *o* wouldn't be dropped\n* If *a* has to appear before another *a*, like in *sa*, then a glottal stop is introduced in-between; therefore, *sa* + *-a* becomes *sa′a*\n* If a nasalised sound, such as *ą*, appears as an affix after a root ending in the same sound - only not nasalised - than simply that sound is nasalised:\n\t* *asa* + *-ą* becomes *asą* simply\n* Grammatical particles must try to maintain as much of their authentic form as possible, so that is why:\n\t* *to* + *icu* is *thiicu*, not *ĉiicu*\n* Particles like reo do not omit the *o* when fusing:\n\t* *reo* + *ppu* -> *reoppu* (**never** reppu/repppu!)\n\n## 3.5 Nasal palatalisation\n* The alveolopalatal nasal *nʲ* becomes a palatal nasal *ɲ* in consonant clusters like *nyĉ* [ɲtɕ]\n\n## 3.6 Bilabials and labiodentals\n* If *v* or *v'* ever cluster with a bilabial, they are realised as [w] and [w̃]\n* So *fva* or *bv'o* becomes [ɸwa] and [bw̃õ]~[bw̃o] respectively\n","4 Writing rules.md":"## 4.1 Main writing rules\n* If a peripheral vowel precedes a liquid, nasal, or, in some contexts, an alveolopalatal, dentialveolar, or velar consonant, then it is not marked but pronounced as peripheral\n\t* *suyet* `1SG-BEN`\n\t* *sanin* `3SG.F-PER`\n\t* *tetezunun* `hand-2SG.POSS-INSTR`\n* *a* does not follow this role, so *san* is still [san] and not [sæn], though in some cases, *a* will be pronounced [æ] because it follows this rule but remains unmarked in especially casual speech\n"}; 

function loadList() {
    const query = document.getElementById('doc-search').value.toLowerCase();
    const listEl = document.getElementById('doc-list');
    
    // Filter logic based on the local DOCS_DATA object
    const files = Object.keys(DOCS_DATA).filter(f => {
        const content = DOCS_DATA[f].toLowerCase();
        return f.toLowerCase().includes(query) || content.includes(query);
    });
    
    listEl.innerHTML = files.map(f => `
        <li class="doc-item" onclick="loadDoc('${f.replace(/'/g, "\\'")}', this)">
            ${f.replace('.md', '')}
        </li>
    `).join('');
}

function loadDoc(filename, element) {
    document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('active'));
    if (element) element.classList.add('active');
    
    const text = DOCS_DATA[filename];
    if (text) {
        document.getElementById('view').innerHTML = marked.parse(text);
        document.getElementById('content-area').scrollTo(0,0);
    }
}

// Kickstart the page
window.onload = loadList;
</script>
</body>
</html>
