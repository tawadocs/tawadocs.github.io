    <script>
        const DOCS_DATA = {"1 Root structure.md":"## 1.1 Sentences\n* Sentence structure is SVO-SOV\n* Modifiers go before the noun\n\t* *meiya (soft) ngoshi (bird)* -> soft bird\n* Modifiers **can** go after the noun:\n\t* *ngoshi meiya* -> soft bird\n\t* *haeku iehatero* -> walk faster\n\t\t* especially if they're marked (explicitly):\n\t\t\t* *jitei asanu* -> a comfortable place / place like home\n* Topic-comment structure\n* Context-first and pro-drop\n\n## 1.2 The nine core particles\n| Particle | IPA       | Gloss   |\n| -------- | --------- | ------- |\n| ni       | `/ni/`    | TOP     |\n| a        | `/a/`     | A       |\n| o        | `/o/`     | U       |\n| nai      | `/nai/`   | MID     |\n| nq       | `/ŋ~ɴ/`   | ANT     |\n| te       | `/te/`    | INF     |\n| no       | `/no/`    | GEN / Q |\n| rra      | `/ɾa~ra/` | NEG     |\n| rri      | `/ɾi~ri/` | AFFIRM  |\n* **ni** marks the topic:\n\t* *atora ni kamu* :: `apple TOP eat.V`\n\t\t* lit. \"As for the apple, (I) eat (it)\"\n\t\t* ~\"I eat the apple\"\n* **a** marks the actor:\n\t* *atora a kamu* :: `apple A eat.V`\n\t\t* \"The apple eats\"\n* **o** marks the undergoer:\n\t* *sa o koru* :: `3SG.F U kill.V`\n\t\t* \"She is killed\"\n* Notice:\n\t* *atora **ni** hon kamu* :: `apple TOP person eat.V`\n\t\t* \"As for the apple, the person eats (it)\"\n\t* *atora **a** hon kamu* :: `apple A person eat.V`\n\t\t* \"The apple humanises food\"\n\t* *atora **o** hon kamu* :: `apple U person eat.V`\n\t\t* \"The person eats the apple\"\n\t\t* ~\"The apple is eaten by the person\"\n* **nai** is the middle voice:\n\t* *sa o korunai* :: `3SG.F U kill.V-MID`\n\t\t* \"She dies\"\n\t\t* no killer is implied, since *nai* reduces the amount of arguments a verb can take, thus decreasing valency\n\t* *omoko o kamunai* :: `chicken U eat.V-MID`\n\t\t* \"The chicken is eaten\"\n* **nq** is used for antonymisation:\n\t* *kamunq* :: `eat.V-ANT`\n\t\t* ~\"Vomit\"\n\t* *kamonq* :: `food-ANT`\n\t\t* ~\"Inedible (substance)\"\n\n### 1.2.1 Focus\n* Usage of **ni**\n\t* It introduces the topic; i.e., what the whole sentence is about\n\t* It focuses the information after the particle\n\t* Example:\n\t\t* *atora ni mafo i* :: `apple TOP red COP`\n\t\t\t* The apple is old news, but the 'red' part is new information\n* Usage of **a**\n\t* It marks the subject performing a deed\n\t* The focus is on the noun before the particle\n\t* Example:\n\t\t* *ngoshi a kamu* :: `bird A eat.V`\n\t\t\t* The eating isn't the news; the fact that a bird doing it is\n* Usage of **o**\n\t* It marks the subject suffering a deed\n\t* Example:\n\t\t* *omoko o kamu* :: `chicken U eat.V`\n\t\t\t* The chicken experiences eating\n\t\t\t* This doesn't mean that the chicken is being eaten (you would use *kamonai* for that), but that 'eating' happens to it\n\n### 1.2.2 Nuances of using **a** / **o**\n* *a* often implies a specific subject (it is X and only X)\n\t* *a kamu* :: `A eat.V`\n\t\t* \"The actor and only the actor eats\"\n* *ni* often implies contrast (as for X, not Y)\n\t* *omoko ni kamu* :: `chicken TOP eat.V`\n\t\t* \"(I usually) eat chicken, (not beef / red meat)\"\n\t* *ryo ni ii, lyo ni iinq* :: `DEM.MED TOP good DEM.DIST TOP good-INV`\n\t\t* This is good, but that isn't good\n\n## 1.3 O-roots\n* For nasal-only clusters, *o-roots* drop the *′o* to take the consonant:\n\t* *kamo* + *-bu* :: *kambu*\n\n## 1.4 Questions and genitive\n* *no* is an interrogative when sentence-final but genitive when non-sentence-final:\n\t* *kanata no hon* :: `happy GEN person`\n\t\t* lit. \"Happy's person\"\n\t\t* ~\"A person who is happy\"\n\t* *hon no kanata* :: `person GEN happy`\n\t\t* lit. \"Person's happiness / the happiness of the person\"\n\t* *haku no kita* :: `truth GEN like`\n\t\t* \"Genuine liking\"\n\t* *jananq no hon* :: `heaven-ANT GEN person`\n\t\t* lit. \"A person of hell\"\n\t\t* ~\"Dweller of hellfire\"\n* some more sentences focusing on noun linking:\n\t* *desga no asa* :: `opposite-side GEN house`\n\t\t* \"House to the opposite side\"\n\t* *asawun ni asanan no desga ue no?* :: `house-3SG.POSS TOP house-1PL.POSS GEN opposite-side COP.POL Q`\n\t\t* lit. \"As for their home, our home's opposite ((it) is)?\"\n\t\t* ~\"Is their house opposite to our home?\"\n\n### 1.4.1 Little note\n* When *no* is forced to appear at the end of a sentence but you aren't asking a question, then tone decides if you're using *no* for marking a noun or asking a question\n* Further, *ng* (often an interjection or filler) can mark it as a non-interrogative:\n\t* *Poki no ng* :: `big NMZ FIL`\n\t\t* lit. \"(A) big thing, so\"\n\t\t* ~\"(A) big thing\"\n\t\t\t* it feels incomplete if read literally, but *ng* is preceded by *no*\n\t\t\t* this is a special case: when *ng* is preceded by *no*, it functions more as a verbal full-stop, unless something else comes after:\n\t\t\t\t* *poki no ngggg... hon* :: `big GEN FIL person`\n\t\t\t\t\t* lit. \"Person of big\"\n\t\t\t\t\t* ~\"(A) big... person\"\n\t\t\t\t\t\t* though this usually wouldn't be a normal sentence that you'd drop, it's fine for the purposes of demonstration\n* But for marking it as a question, use *yo*:\n\t* *poki no yo?* :: `big NMZ Q2`\n\t\t* ~\"(It's) big?\"\n\t\t* or whatever the reading is supposed to be based on the context\n\n## 1.5 Infinitive\n- The infinitive _te_ marks infinitives\n- It's uses are listed here:\n    - **purpose** (intentional infinitive)\n        - _fuyu wante paya no?_ -> `what one-INF study Q`\n            - \"Which one to study?\"\n        - _eate kamu_ -> `MOV-INF eat.V`\n            - \"Go to eat\"\n    - **complement of modal / auxiliary verbs**\n        - _nasute paya_ -> `ability.V-INF study`\n            - \"Can study\"\n        - _anisute paya_ -> `requirement.V-INF study`\n            - \"Must study\"\n        - _subute paya_ -> `desire.V-INF study`\n            - \"Want to study\"\n    - **complement of perception / causative verbs**\n        - _kitate nirute so o korunai_ -> `like-INF see.V-INF 3SG.M U die.V-IV`\n            - \"(I would) like to see him (be) killed / die\"\n        - _rute hashirusun kamu_ -> `CAUS.V-INF child-1SG.POSS eat.V`\n            - \"Make my child eat\"\n    - **subject or object in nominal constructions**\n        - _payate ni ushikitsu i_ -> `study-INF TOP fun COP`\n            - \"Studying is fun / to study is fun\"\n        - _ryo ni payate i_ -> `DEM.MED TOP study-INF COP`\n            - \"This is for studying\"\n        - _ryo ni iite paya i_ -> `DEM.MED TOP good-INF study COP`\n            - \"This is good to study\"\n    - **description**\n        - _ushikitsute paya ita ei_ -> `fun-INF study PRTV ANAPH`\n            - \"(It is) fun to study about this\"\n        - _damite kamu_ -> `easy-INF eat.V`\n            - \"Easy to eat\"\n        - _iite fu_ -> `good-INF ACT`\n            - \"Good to do\"\n- Take a look at these examples:\n\t- *rawanqnaite chihai kofi we eanaite payaen no asa* :: `sleep-REVS-MID-INF water-ANTIPROD.V coffee ADD MOV-MID-INF study-VBZ GEN house`\n\t\t- ~\"I woke up and drank coffee and then went to school\"\n\t- *namekurrate makusutanai, fuka!* :: `mistake.V-NEG-INF cry-DIM.SUP-MID REQ`\n\t\t- ~\"Don't make a mistake and then cry (about it), please!\"\n\n## 1.6 Polarity\n* *ra* and *ri* are both used to negate and affirm, respectively:\n\t* *Yararanai* = did not come\n\t* *Yararinai* = (indeed) came\n* They are not only suffixes:\n\t* *Ri, lyo ni haku i* = yeah, that's true\n\t* *Ra, su fofu eu arene i* = no, what I said is different\n\t* *Ra, su fofura ryoe!* = no, I didn't say this!\n\t\t* for reported speech, what is being reported is nested with **me**\n\t\t* so 'he said he's epic' is *so fofu **me** so ni epiku* (he says (that) he is epic)\n\t\t\t* for quotations, just use *mo*:\n\t\t\t\t* *so fofu mo 'su ni epiku'* (he said, \"I am epic\")\n\t* *Riwakara ita ei, ra...* = didn't think about that, no...\n\n## 1.7 Similatives\n* All similative particles are the same as Ashi Tawa's\n* System is used in the same manner (e.g., *osarara su imnyi so* - 'don't call me him!' is fine in Koyeah Tawa)\n\n## 1.8 Omitting particles\n* Never omit *ni*, but you may omit the topic itself if clear from context:\n\t* *To, ni so a ai* :: `PFV TOP 3SG.M A help`\n\t\t* lit. \"As for (me), he helped\"\n\t\t* ~\"He helped (me)\"\n\t\t\t* the pronoun *su* is omitted, but the topic remains\n* It is only acceptable to omit *ni* in highly frank, intimate, or casual contexts, and only if the context makes parsable the sentence:\n\t* *Asa ii i* :: `house good COP`\n\t\t* \"The house is good\"\n\t\t\t* since there is no other reading with the copular *i* present\n* The actor particle can be omitted many times:\n\t* *To, ni so ai* :: `PFV TOP 3SG.M help`\n\t\t* \"He helped me\"\n\t\t\t* here, there are two things that help ensure the phrase is parsable:\n\t\t\t\t* *so ai* comes before the topic (we now know this is a comment)\n\t\t\t\t* no copular (we now know this is not a description)\n\t\t\t\t* **pronoun + root** construction\n\t\t\t\t\t* a copularless comment comprising of a pronoun + root is, well, very likely an action\n* Bare copular constructions also don't always need particles:\n\t* *Asa ue* :: `house COP.POL`\n\t\t* \"(That/this) is a house\"\n\t\t\t* context fills in the gaps\n\t\t\t* if you said this pointing or out to a stranger, they'd know what you're talking about\n\t* *Onokoizun i* :: `friend-2SG.POSS COP`\n\t\t* \"I'm your friend\"\n\t* *Wam poki, poki ngoshi i* :: `one big big bird COP`\n\t\t* \"That is one big, big bird\"\n","2 Types.md":"## 2.1 Particle table\n| Type      | Particle | IPA        | Gloss |\n| --------- | -------- | ---------- | ----- |\n| **n.**    | **oe**   | `/oe/`     | NM    |\n| **v.**    | **(r)u** | `/(ɺ~ɾ)u/` | V     |\n| **prop.** | **bu**   | `/bu/`     | PROP  |\n| **mod**   | **nu**   | `/nu/`     | MOD   |\n| **mod2**  | **i**    | `/i/`      | ATTR  |\n| **cop.**  | **i**    | `/i/`      | COP   |\n\n### 2.1.1 Verbs\n* Words ending in *-o* end in *-u* when they are in their verbal form:\n\t* *atora ni hon kamu* :: `apple TOP person eat.V`\n\t\t* \"The person eats the apple\"\n* Otherwise, verbs take *-ru* or are unmarked if other particles or context can disambiguate:\n\t* *a kikita ngoshi* :: `A SUP~like bird`\n\t\t* \"(I, and only I) love birds\"\n\t\t* no *(r)u* needed due to **a**\n\t* *so ni iiru* :: `3SG.M TOP good-V`\n\t\t* \"(I) bettered him\"\n\t\t* if you said *so ni ii*, then that would mean 'he is good'\n\n### 2.1.2 Modifying\n* Use *-nu*:\n\t* *su ni iinu i* :: `1SG TOP good-MOD COP`\n\t\t* \"I am good\"\n* Otherwise:\n\t* *su ni mafo i* :: `1SG TOP red COP`\n\t\t* \"I am red\" (would be understood as 'blushing / anger,' but it's less natural)\n\t\t* if you meant to say 'I'm blushing,' try:\n\t\t\t* *su o mafu* :: `1SG U red.V`\n\t\t\t\t* ~\"I blush\" (though this isn't the best translation, per se)\n\t\t\t\t* don't use *mafunai*, since that implies that there's no doer, which leans towards anger\n\t\t\t\t* more often than not, you'd want to say that someone specific is making you blush\n\t* *asa ni kuru i* :: `house TOP black COP`\n\t\t* \"The house is dark / black\"\n* In adjective chains:\n\t* *lili meiya ngoshi* :: `little soft bird`\n\t\t* ~little soft bird\n\t\t* no need for *ngosh**i*** to take the copular, since it ends in *i* already\n\t* *lili meiya asa i* :: `little soft house COP`\n\t\t* ~little soft house\n* As adverbs:\n\t* *hatero hateru* :: `fast run.V`\n\t\t* ~run swiftly\n* In noun compounding or to disambiguate:\n\t* *hateronu hateru* :: `fast-MOD run.V`\n\t* *eanu-natse* :: `MOV-MOD-square`\n\t\t* lit. \"moving square\"\n\t\t* ~\"cart / trolley\"\n\t* *eanu-natsenoe* :: `MOV-MOD-square-NM`\n\t\t* lit. \"moving square (object)\"\n\t\t* ~\"cart / trolly (that is not moving)\"\n* **Sometimes**, the copular **can** be omitted\n* For complex constructions, it usually is not:\n\t* *twana ni lili mani* :: `tool TOP little money`\n\t\t* \"As for the tool, (it) little money\"\n\t\t\t* this could be understood, but it's preferable to say:\n\t\t\t\t* *twana ni lili mani i*\n\n### 2.1.3 Property particle\n* *bu* denotes a property\n* It's like saying 'kind of / sort of / circa' in English\n* For adjectives, it marks approximation:\n\t* *nuku iibu* :: `heart.V good-PROP PROP`\n\t\t* lit. \"(I) feel goodish\"\n\t\t* ~\"(I) sort of feel good\"\n\t* *meiyabu ngoshi* :: `cute-PROP bird`\n\t\t* \"Cuteish bird / softish bird\"\n* For nouns:\n\t* *ryo asabu asasumbu i* :: `DEM.MED house-PROP house-1SG.POSS.PROP COP`\n\t\t* ~\"This kind of house is my kind of house\"\n\t* *ryo kambu ni kita* :: `DEM.MED food.PROP TOP like`\n\t\t* ~\"(I) like this kind of food\"\n* For adverbs:\n\t* *haterobu hateru* :: `fast-PROP run.V`\n\t\t* \"Swiftish / fastish run\"\n\t* Compare with:\n\t\t* *haterubu* :: `run-PROP`\n\t\t\t* \"A run that seems like a run\"\n\t\t\t* \"A runnish run\"\n\t\t\t* \"Kind of running\"\n\n### 2.1.3 Noun or object particle\n* *-oe* denotes the noun\n* It's often always omitted, though it may be used for disambiguation\n* It's real purpose shines in noun-compounding:\n\t* take *eanu*, which describes anything as moving\n\t* *eanu-natse* would mean a 'moving square/block' - could be a trolley or cart\n\t* but what if you want to use this to refer to a cart, like in the sentence *subute harinai eanu-natse!* (I want to buy a trolley!)\n\t\t* using *eanu-natse* is fine but it implies a specifically moving cart or trolley that is in motion\n\t\t* if you want to use it as one concept, you would add *-oe*:\n\t\t\t* *eanu-natseoe* (trolley)\n* For the direct object, just mark the verb as a verb if it's ever ambiguous:\n\t* *koha(ru) poki, poki atora(oe)* :: `gift-(V) big big apple-(NM)`\n\t\t* \"(I) gift a big, big apple (to X)\"\n\t\t\t* even though *oe* just marks *atoraoe* as a noun here, it implies that one root here is a verb (*koha*)\n\t* *sa koha(ru) su ji ii koha(oe)* :: `1SG gift-(V) LOC 1SG good gift-(NM)`\n\t\t* \"She gifted me a good gift\"\n* p.s. marking either the verb as a verb or the object with the noun marker is fine:\n\t* due to the strict **SVO** order, it is normally understood that the last noun will be the object of whatever verb coming before it\n\t* so this is fine:\n\t\t* *sa koha su ji ii koha*\n\n## 2.2 Particle stacking\n* Particles can be stacked to derive a type of a type:\n\t* *hana* (nose, bump, hill)\n\t* *hananu* (smooth, round, curved)\n\t* *hananuoe* (smoothness, round as a noun)\n* ... and so on\n* Ashi Tawa's particles like *-tei* and as such are also available in Koyeah Tawa but they must be avoided unless really necessary\n* Instead, the grammaticalised words of Ashi Tawa (e.g., *sumatà*, written as *sumata* in Koyeah Tawa) are preferred\n* Case roots, like *jitei*, change to *-oe* forms\n\t* you can use *jitei* but it's generally archaic and not preferable in Koyeah Tawa\n\t* so, better to say something like *fuyu ji**oe** no?* than *fuyu ji**tei** no?*\n\n### 2.2.1 Scope\n* Using *-tei* or *-oe* affects scope:\n\t* *gadenigonq* :: `disgusting-cat-REVS`\n\t\t* ~\"disgusting dog\"\n\t* *gadenigooenq* :: `disgusting-cat-N-REVS`\n\t\t* ~\"commendable dog\"\n* In the first example, *-nq* was antonymising the word that was directly before it; however, in the other example, due to the presence of *-oe*, the whole compound *gadenigo* was antonymised as one unit\n\n## 2.3 Natural and unnatural modifiers\n* Remember these rules for the two markers:\n\t* *i* (attributive)\n\t\t1. The root is naturally modifier-adjacent\n\t* *nu* (modifier)\n\t\t1. The root ends in **i**\n\t\t2. The root is strongly non-modifier-adjacent\n* So, use *-nu* on **i-final** roots that are often not used as adjectives\n* *kachi* is the best example of this, as it is focused on biting or nibbling:\n\t* *kachinu hon* :: `bite-MOD person`\n\t\t* ~\"A biting person\"\n\t\t* ~\"A bitey person\"\n* But, *hatero* doesn't take *-nu* because it doesn't end in **i**:\n\t* *hateri hon* :: `run.ATTR person`\n\t\t* ~\"A fast / swift / runny person\"\n* Example chains (with pronunciation - morae and stress unmarked):\n\t* *hateri, ohirai, pokii hon* :: `run.ATTR white-ATTR big-ATTR person`\n\t\t* `/hateɺi ʔoçi̥ɺai poki̥ː hɔn/`\n\t\t\t* also pronounced **/hateɺi ʔoçiɺai pokiː hɔn/**\n\t\t\t* depends on dialect\n\t* *kurui kedesui ngoshi* :: `black-ATTR shame-ATTR bird`\n\t\t* `/kuɺui ce̥tɛ̥su̥i ŋoɕi̥/`\n\t\t\t* also pronounced **/kuɺui kedɛsui ŋoɕi/**\n\t\t\t* depends on dialect\n","3 Recursion and agents.md":"## 3.1 Particle table\n| Particle | IPA     | Gloss |\n| -------- | ------- | ----- |\n| **me**   | `/me/`  | REL   |\n| **eu**   | `/eu/`  | COMP  |\n| **mas**  | `/mas/` | AGNR  |\n\n## 3.2 Nesting\n* Nesting is often just handled by the **X ni Y ga Z** structure:\n\t* *hateri ngoshi ni kamu mafi atora ga unsunai* :: `fast.ATTR bird TOP eat.V red.ATTR apple NOM live.V-MID`\n\t\t* ~\"The fast bird that ate the red apple lives\"\n* Or by the **X a/o Y ga Z** structure, if **X** has to be stated as actor or undergoer:\n\t* *Sa a aishi foshōesun ga paratashimg* :: `3SG.F A hurt friend-N-1SG.POSS NOM tolerate-POT.ATTR-G.REVS`\n\t\t* ~\"The fact that she hurt my friend is intolerable\"\n\t\t\t* *parata* or *paratangu* mean 'rude' (negative toleration)\n\t\t\t\t* *parata* alone is fine, sometimes even *para* can be used depending on context\n\t\t\t* but *paratashimg* means 'intolerable' and is stronger, even though it does not require a degree\n\t\t\t\t* this is fine because 'intolerable' already naturally implies that it is something you cannot let go\n* But **X ga/a/o Y ni Z** is used if **X ga Y** is the topic or theme:\n\t* *hashiru a hahaen haruma ieji ni eǵi* :: `child A entertain-VBZ hole AUG-LOC TOP okay-REVS-ATTR`\n\t\t* ~\"The children playing near the hole is anything but OK\"\n\n## 3.2 Recursion\n* *me/ni* is used for this\n* If there is a *ni* already present, you're forced to use *me*\n\t* *ngoshi ni kamu atora ga nandanai tsu dan me unsunai* :: `bird TOP eat.V apple NOM fall-MID tree ABL REL live.V-MID`\n\t\t* ~\"As for the bird, eat apple fall from tree, as for it, lives\"\n\t* *Maria, Debwa a hangarapai ga naiwanq saoe me eanaite asasan* :: `maria debra A fight-REFL.MID NOM happy-REVS 3SG.F-N REL MOV-MID-INF house-3SG.F.POSS`\n\t\t* lit. \"Maria and Debra fought with each other saddened her that move her home\"\n\t\t* ~\"The fact that Maria and Debra were fighting with each other made her sad enough to go back to her home\"\n* Tawa particularly dislikes this kind of recursion and nesting, so you would say:\n\t* *Sa ni Maria, Debwa a hangarapai ga naiwanqte eanaite asasan* :: `3SG.F TOP maria debra A fight-REFL.MID NOM happy-REVS-INF MOV-MID-INF house-3SG.F.POSS`\n\t\t* lit. \"As for her, Maria and Debra fighting saddened (her) to go to her home\"\n\t\t* ~\"Maria and Debra fighting with each other made her sad, so she went home\"\n\t\t\t* the *-te* here acts as a connective\n\t\t\t* *naiwanqte* means 'made sad, so' or 'made sad to'\n\t\t\t* *eanaite* refers to 'going to'\n\t\t\t* and *asasan* is the ultimate location\n\n\n## 3.3 Clausal description\n* *me* is also used for this, but often paired with a copular:\n\t* *hon me korumasu i* :: `person REL kill.V-AGNR COP`\n\t\t* \"The person that is a killer\"\n\t* *ii hon a kitate yume ribu me iinq i* :: `good person A like-INF read book REL good-ANT COP`\n\t\t* ~\"The person that likes to read books is (actually) bad\"\n\t\t\t* when you declare something as **X** but refer to that thing as **Y** later in the clause with *me*, it implies a surprising contrast\n* Do note that the copular may be omitted in favour of an attributive, so:\n\t* *hon me korumashi*\n* ... is better to say\n\n## 3.4 Embedding\n* Reported speech is always said as a statement followed by a 'speech' verb, like *fofu*:\n\t* *reoyaranai arenei wanō, so fofu* :: `IPFV-come-MID different-ATTR time speak.V`\n\t\t* \"(He) will come at another time, he said\"\n* Use *eu* to indicate second-hand reporting of something:\n\t* *toniru eu asa ni lili mani i* :: `PFV-see.V COMP house TOP little money COP`\n\t\t* \"I saw that the house was of little money\"\n\t\t\t* this implies that you 'saw' it second-hand, so maybe through a picture, maybe indirectly, maybe you imagined it:\n\t\t\t* this is what you might say afterwards if you imagined it:\n\t\t\t\t* *mo mo eirra* :: `but ANAPH-NEG`\n\t\t\t\t\t* '... but it wasn't'\n","4 Postpositions.md":"## 4.1 Core adposition system\n| Case    | Core usage                                                                                                                  |\n| ------- | --------------------------------------------------------------------------------------------------------------------------- |\n| **ji**  | indirect object; location of existence; destination or final arrival point; time; goal of a movement; passive or causative  |\n| **un**  | instrument or means; location of action; material or composition; cause or reason; limit                                    |\n| **do**  | traversal or route of motion; point of detachment                                                                           |\n| **da**  | heading (towards); progression                                                                                              |\n| **dan** | temporospatial starting point or origin; source of material; source of information / giving                                 |\n| **mo**  | comitative; quotation or boundary of thought or sound; comparison; temporal (and spatial) sequentiality; contrasting linker |\n| **we**  | additive (and)                                                                                                              |\n- In Koyeah Tawa, many cases have turned into postpositions\n- They function virtually the same:\n    - **do**\n        - traversal or route of _motion_\n            - flew (through) the _sky_\n                - _kiuku sora do_\n            - walked (along) the _path_\n                - _haeku tachi do_\n        - point of detachment\n            - leave (from) _home_\n                - _kuenau asa do_\n            - get (out of) the _cart_\n                - _ea eanu-natse do_\n    - **ji**\n        - indirect object\n            - give a gift **to** a friend\n                - _koha kohaoe onokoi ji_ -> `gift gift-NM friend DAT`\n        - location of existence\n            - food is **on** the table\n                - _kamo jirei ji_ -> `food.NM TOP table LOC`\n        - destination or final arrival point\n            - we are **at** her home\n                - _na asasan ji_ -> `3SG house-3SG.F.POSS LOC`\n            - we flew **to** London\n                - _na kiuku Landan ji_ -> `3SG fly.V london LOC`\n        - time\n            - writing words **at** 2:55 AM\n                - _payaen kana 0255 AM ji_ -> `write-NMLZ word 0328 am LOC`\n        - goal of a movement\n            - went **out to** shop\n                - _ea hari ji_ -> `MOV buy DAT`\n        - passive or causative\n            - the boss made the employee write the report\n                - _komuni komuninq ji a monu tetoeka_\n                - \"the boss **made** the employee write the report\"\n    - **un**\n        - instrument or means (DON'T confuse with comitative 'mo')\n            - wrote the book **digitally** / **in/via** electronic interface\n                - _paya ribuoe tahete un_ -> `write book-NM electronic INSTR`\n            - ate **with** a spoon\n                - _kamu oho un_ -> `eat-V spoon INSTR`\n        - location of action\n            - had fun **at** her house\n                - _hahaen asasan un_ -> `laugh-NMLZ house-3SG.F.POSS INSTR`\n        - material or composition\n            - made **of / by / with** wood\n                - _ru tsu un_ -> `CAUS.V wood INSTR`\n        - cause or reason\n            - he did not come **as** he was sick\n                - _so yarara mahwa un_ -> `3SG.M come-NEG sick CAUSAL`\n        - limit (time/quantity/scope)\n            - the tool is cheap **for** its high quality\n                - _ryo twana ni lili mani i poki iioe un_ -> `tool TOP little money COP big good-NM LMT`\n                    - lit. \"as for the tool, it is of little money for its big goodness\"\n            - finished work **in** 3 days\n                - _kiwinq irime 3 ko un_ -> `continue-INV work three day PER`\n    - **da**\n        - heading (towards)\n            - heading **towards** the mountains\n                - _ea asasan da_ -> `MOV house-3SG.F.POSS ALL`\n                    - p.s., here, the focus is on 'active direction,' not the destination, unlike _ji_\n        - progression\n            - going **to / progressing** towards London\n                - _ea Landan da_ -> `MOV london ALL`\n    - **dan**\n        - spatial starting point\n            - I came here **from** Canada\n                - _yaranai Canada dan_ -> `come-MID canada ABL`\n        - temporal origin\n            - I started **from** almost 1 to 2 o'clock\n                - _kiwi 1 ato 2 Pi'Em dambu_ -> `continue one or two pm ABL-PROP`\n                    - *dambu* is an approximate point due to presence of **-bu**\n                    - because the following consonant is bilabial, *dan* changes to *dam*\n        - source of material\n            - drug **from** fruits\n                - _kara ba dan_\n                    - p.s., here, it is about transformation or change itself; in _un_, the original material was wood, but with *dan*, the original material has changed (fruits to drugs, seed to plant, etc.)\n        - source of information / giving\n            - heard about it **from** her\n                - _fofunai ryo ita sa dan_ -> `speak.V-IV DEM.PROX PRTV 3SG.F ABL`\n    - **mo**\n        - comitative\n            - I never argue **with** my sister\n                - _shahadara pashachasun mo_ -> `fight-NEG sibling-F-1SG.POSS COM`\n        - quotation or boundary of a thought or sound\n            - the bell rang **with** a ding\n                - _kare iyuku mo 'jing'_ -> `bell sound.V QUOT ding`\n            - he said **that** \"I will come\"\n                - _so fofu mo yaranai_ -> `3SG speak.V QUOT come-MID`\n        - comparison (glossed as `CMPR`)\n            - bigger **than** him\n                - _iepoki mo so_ -> `AUG-big COMP 3SG.M`\n        - temporal sequence or sequentiality\n            - ate **then** went to talk to him\n                - _kamu mo eate fofu ji so_ -> `eat.V SEQ go-INF speak.V DAT 3SG.M`\n        - contrasting linker (as **mo mo**)\n            - **but** I'm eating\n                - _mo mo su kamen_ -> `but 1SG eat.NMLZ`\n            - you can do it **but** only if you pay first\n                - _nasute fu, mo mo wan ji, mani_ -> `ability.V-INF ACT but first LOC money`\n    - **ita**\n        - aboutness, regarding\n            - speak **about** her\n                - _fofu sa ita_ -> `speak.V 3SG.F PRTV`\n        - circumambulate\n            - walk **about / around** a house\n                - _haekukunh asa ita_ -> `walk.V-LIT house PRTV`\n                - p.s. use _haekukunh_ if _haeku_ alone is ambiguous, as _haeku_ can mean to learn as well (e.g., learn about a house)\n        - partitive\n            - drink **some of** this water\n                - _kamu chi no ita_ -> `eat.V water GEN PRTV`\n            - **some of** the people like me\n                - _hon no ita kita su_ -> `person GEN PRTV like 1SG`\n            - **not yet done** sending the picture\n                - _senoden no ita emonoe_ -> `send.NMLZ GEN PRTV picture.NM`\n    - **itan**\n        - avoiding, focusing (away) from the centre\n            - why are you **beating around the bush regarding** her?\n                - _zu fofu sa itan_ -> `2SG speak.V 3SG.F EX`\n        - exclude\n            - walk **avoiding** the house\n                - _haeku asa itan_ -> `walk.V house EX`\n        - totalitive\n            - drink **all of** this water\n                - _kamu chi no itan_ -> `eat.V water GEN TOT`\n            - **all of** the people like me\n                - _hon no itan kita su_ -> `person GEN TOT like 1SG`\n            - **completed / fully done** sending the picture:\n                - _senoden no itan emonoe_ -> `send.NMLZ GEN TOT picture.NM`\n    - **po**\n        - being in favour or supporting\n            - she is for him / for his favour / in favour of him\n                - _sa so po i_ -> `3SG.F FOR 3SG.M COP`\n        - positioned beside or alongside a thing\n            - I am beside the house **(poji)**\n                - _su asa asapoji i_ -> `1SG house FOR-LOC COP`\n    - **bo**\n        - being against\n            - she is against him\n                - _sa so bo i_ -> `3SG.F 3SG.M CNTR COP`\n        - resting against or using a thing as support **(boji)**\n            - I am opposite to / against the house\n                - _su asa boji i_ -> `1SG house CNTR-LOC COP`\n            - I'm resting against the house's walls\n                - _su a rawa asa no ga boji_ -> `1SG A rest side GEN house CNTR-LOC`\n        - acting as substitute (instead of)\n            - we need peace instead of war\n                - _na a anisu ritaruoe shahada boji_ -> `1PL A require.V soft-NM war CNTR-LOC`\n    - **we**\n        - additive\n            - apples **and** bananas (and as such)\n                - _atora we karaba_ -> `apple ADD creamfruit`\n\n## 4.2 Extended system\n| Prep. | Semantic space                                                                                                                                                     | IPA   |\n| ----- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------ | ----- |\n| da    | recipient or destination; ultimately, it is the **purpose** and **target** of any act                                                                              | da    |\n| dan   | **source** or **origin**; the giver as opposed to recipient or the starting point as opposed to destination                                                        | dan   |\n| ye    | anything done for one's **gain** or **benefit** (e.g., running _for_ your body's health)                                                                           | je    |\n| yen   | anything done to one's detriment (e.g., stealing food _for_ your coworker's detriment)                                                                             | jɛn   |\n| ji    | any state of **being**; being **at** or **inside** a coordinate                                                                                                    | d͡ʑi  |\n| jin   | being **out of** or **away** from any state or coordinate; exclusion from a state or coordinate                                                                    | d͡ʑɪn |\n| po    | positioned **beside** or **alongside** a thing; being **in favour** or **supporting**                                                                              | po    |\n| bo    | positioned **opposite** or **facing** something; resting **against** or using a thing as **support**; being **against** or acting as **substitute** (_instead of_) | bo    |\n| ita   | a **piece** or **some** of a thing; _aboutness_ or an _incomplete action_                                                                                          | ita   |\n| itan  | the **entirety** of a thing; _completion_ of an action; _total embodiment_ of a thing                                                                              | itan  |\n| un    | **accompaniment**, **using** a tool; **emotional companionship** or an _internal state that you carry_                                                             | (ʔ)un |\n| nin   | **lacking** or **being without** (a thing)                                                                                                                         | nɪn   |\n\n### 4.2.1 Locative preposition class\n| Prep.     | Semantic space                                                                                                                                                                                                                                                                                                                                                            | IPA       |\n| --------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | --------- |\n| **ji**    | anything located in or contained in something; going into, enter; in, at; state of being; being 'in' any state; headspace; membership, participation; fashion, trend; included, counted; skill (good at, bad at); rate or measurement (at 60BPM); state during activity; targeted or directed action; appearance or form (in pieces, in crystals); lock in                | d͡ʑi      |\n| **jin**   | being out of or away from; going out of, exiting; not in, not at; a state of being one isn't in; exhausted, depleted; revealled, exposed; extinguished, inactive; (removed) from participation; not included, not counted; fall out                                                                                                                                       | d͡ʑɪn     |\n| **jiji**  | exactly at, absolutely at; most at, perfectly in; the absolute truth or bullseye in terms of location or headspace, dead on; precisely (at); interaction point (knock at the door)                                                                                                                                                                                        | d͡ʑid͡ʑi  |\n| **jijin** | nowhere near, way off, completely missing it; not even close; anything but (it/that)                                                                                                                                                                                                                                                                                      | d͡ʑid͡ʑɪn |\n| **jinyi** | above, over, on; positioned above; applied to a target; directed effort towards; active engagement; turned 'on' or online; topical focus; schedule, occurrence (the party is on); dependency, support, codependent; progress, continuation; responsibility; stick on                                                                                                      | d͡ʑinʲi   |\n| **jista** | below, under, beneath, off; positioned below; action directed away; removed form a target; 'off' or offline; ranked below; siphon (off); take (off), cancellation, discontinuation, reduction or discount (30% off), incorrectness (feels off); detach, remove; come off                                                                                                  | d͡ʑisu̥ta |\n| **ieji**  | close; interaction is easy or intermediate; (at a) short distance; association, affiliation (close to him), rank, hierarchical closeness (near the top), proximity (near the department); approximation (nearly the best), almost; close to a limit or boundary (near disaster); low cognitive distance (keep it near your mind, bring near your attention); soon (to be) | ied͡ʑi    |\n| **iejin** | outside the zone of easy interaction; not close; away; increase distance from reference (take away, move away); not present (he is away); difficult to access (help is not near); removed from implication or connection (step away, drift away, fade away)                                                                                                               | ied͡ʑɪn   |\n| **oji**   | distance is lower than a comfortable or safe threshold; crossing boundaries, entering personal space; too close for comfort; insufficient difference (too similar / too close); proximity that risked crossing into failure or harm; clingyness or attachment (she is too close)                                                                                          | ɔd͡ʑi     |\n| **ojin**  | distance is higher than a comfortable or manageable threshold; beyond an expected or needed position; too removed from involvement or connection (he went too far in isolating himself); threshold violation (opposite end of a safety or acceptability boundary (e.g., experiment gone too far)); detachment, isolation (he is too distant)                              | ɔd͡ʑɪn    |\n\n## 4.3 Uses\n* They're essentially used in the same way as described in:\n\t* **Ashi Tawa, Grammar:17-18**\n* You always use the *core* preposition particles and **ONLY IF** nuance is needed, you use the other available ones\n* More often than not, particles like *ye* or *yen* are not needed\n* The only exception to this is *ita* and maybe some of the locative class\n\n## 4.4 The 'wa' word particle\n* Apart from its domains as per Ashi Tawa grammar, it also inherits a domain from the Japanese も (**mo**) particle, like in:\n\t* *ii hon oi wa futa a unsunai* :: `good person EXCESS-COP too cap A live.V-MID`\n\t\t* \"There has to be a limit to being too much of a good person!\"\n\t\t\t* literally, *wa* here is like saying 'there also/even has to be a limit...' / 'there has to be a limit as well / too'\n\t\t\t* however, more properly, it's behaving akin to a comitative\n* The difference between *mo* and *wa*:\n\t* *wa* is an inclusive and additive\n\t\t* *su wa ii* :: ~\"I am also good / I am good too\"\n\t* *mo* is a relational and sequential and has many functions\n\t\t* *su ii mo* :: ~\"Me with good\"\n\t\t* *su mo ii* :: ~\"Me, then good\"\n* Keep this in mind when choosing which to use:\n\t* *mo*: here is how A relates to B\n\t\t* *ii hon oi futa a unsunai mo*\n\t\t\t* being too good comes with a limit that exists\n\t\t* *ii hon oi mo futa a unsunai*\n\t\t\t* being too good, then a limit exists\n\t* *wa*: here is one more thing to consider\n\t\t* *ii hon oi wa futa a unsunai*\n\t\t\t* there has to be a limit to being too good...\n* ... and note that:\n\t* *wa* can replace *a* and *ni* naturally, and it can also topicalise clauses\n\t* *mo* is a postposition and can't do this - and because the language highly prefers SVO (unless it's formal or complex/technical writing), using *mo* actually makes the phrase harder to parse (unless reordered in SOV, which is redundant already) and more redundant\n","5 Aspect.md":"## 5.1 TAM\n* The entire TAM system of Ashi Tawa is used as is\n* The only exception is that aspect usually comes at the start of a sentence:\n\t* *to atora ni kita* :: `PFV apple TOP like`\n\t\t* \"I liked apples\"\n\t* *eru atora ni kita* :: `CONT apple TOP like`\n\t\t* \"I (continue to) like apples\"\n\t* *iro atora ni kita* :: `PRSV apple TOP like`\n\t\t* \"I still like apples\"\n\t* *reo atora ni kita* :: `IPFV apple TOP like`\n\t\t* \"I will like apples\"\n* It also applies to the complex aspects:\n\t* *teruiro atora ni kita* :: `PFV.CONT apple TOP like`\n\t\t* \"I have kept liking apples\"\n* ... though they are less often used\n* Aspect is stated at the start to set the 'stage' for whatever comes later to exist in that specific aspect\n* Otherwise, aspect is usually a prefix:\n\t* *tokamu no?* :: `PFV-eat.V Q`\n\t\t* \"Did (you) eat?\"\n* The *hya/hyo* distinction has been replaced with just *no?*\n\n## 5.2 Stacking aspect\n* Simple aspects (prefixes) can be stacked with complex aspect (suffixes):\n\t* *Ryo ni watada reofutashinata* :: `DEM.MED TOP only IPFV-ACT-POT.ATTR-FUT.CONT`\n\t\t* lit. \"Only this will ever continue to be be actualisable\"\n\t\t\t* it's like saying 'what will stick to happening from now on is this'\n* Here's a reasonably complex sentence to demonstrate it:\n\t* *Fofen no yo? Eiǵ ni watada reofutasunata* :: `speak.GER NMZ Q | ANAPH-REVS TOP only IPFV-ACT-POT-FUT.CONT`\n\t\t* lit. \"Speaking? Only the opposite of that will ever be actualisable (onwards)\"\n\t\t* ~\"Speaking (about it)? I won't even think of it from now on\"\n\t\t\t* it's like saying: 'as for this 'speaking thing' you're suggesting? it will keep on never happening'\n\t\t\t* note that *watada* is an irregular word (**garibankana**) in that it is an innate modifier and does not require *i* nor *nu*\n","6 Grammatical differences.md":"## 6.1 What's gone or changed\n* the vocative *ta* remains (for calling or doing vocative things)\n* *óy*/*óí* and *t* are now *oi* `/ɔɪ/` and *ta* `/tḁ/`\n\t* pronounced roughly the same but the devoiced vowels preserve (C)V(N) structure\n* *mh* `/m̥͡m/` is pronounced `/m̥͡m/`, no difference\n* *q* `/c͡ç/` is pronounced `/ç~x/`, but `/c͡ç/` is also acceptable\n* *r* and *rr* `/ɺ ɾ/` are simply pronounced `/ɺ~ɾ~r/`\n* *nh* is pronounced `/n̥͡n/`, but *mg* `/m͡ŋ~m͡g/` replaced *nh*'s role\n* *nq* `/ɴ/` is pronounced `/ɴ~q~ɢ/`\n\t* it takes the form *-nq* /əɴ/ when it appears before another nasal\n\t* so *hon* + *-nq* is *honnq* /hɔnəɴ/\n\t* this follows for other affixes like *-ngu*\n* *w* `/ʋ/` and *v* `/w/` are simply `/w~ʋ/`\n* *ni* is simply `/ni/` for there is no palatal allophony anymore\n* mono- and direduplication as well as degree remains, but:\n\t* *sta* is written as *suta* (e.g., **nandasuta**) and pronounced `/su̥ta/`\n\t* *ól* is simply *o* now (pronounced `/ɔ/`)\n\t* *stanyi* (*sutanyi*) is a formal, grammaticalised degree, indicating the \"most\" of a \"least\" (e.g., *kitasutanyi* - faintest glimmer of like) (in Ashi Tawa, it wasn't formalised, but was still buildable)\n* *tas* is written and pronounced *tasu* `/tasu̥/`\n* romantic-platonic distinction is preserved but:\n\t* it's not commonly used, if at all\n\t* only *cha/che* and *-(r)u* are commonly used for gender and verb marking respectively\n* no articles nor plurality\n* full relational system is intact\n\t* temporal relations and relations of the like can replace *ni* or *a*, but not *o* if undergoing has to be explicitly marked\n\t* so *sora ze reosowunai* (the skies will shine again) is fine\n* discourse particles are intact but:\n\t* *am* is pronounced `/æn/`, but the nasal becomes bilabial if followed by a bilabial consonant or velar if followed by a velar consonant\n\t* *yad* is pronounced `/jæː/` and written *yada*\n\t* *ani* is simply pronounced `/æni/`\n* conditionality and temporal markers remain intact\n* irrealis is mostly intact; however:\n\t* *eoi* is used for irrealis and is often combined with an aspect:\n\t\t* *teoi kamu* :: `PFV.IRR eat.V`\n\t\t\t* \"Had eaten\"\n\t\t* *subeoite kamu* :: `desire.IRR eat.V`\n\t\t\t* \"Should eat\"\n\t\t\t\t* though Koyeah Tawa prefers *ieiite kamu* (better to eat) and avoids complex particles, like irrealis ones\n\t\t* *so a niruoi su shi a hateru so ji* :: `3SG.M A see.V.IRR 1SG COND A run.V 3SG.M LOC`\n\t\t\t* \"he would see me if I run to him\"\n\t\t\t\t* when it combines with verbs, it takes the *uoi* form (V.IRR)\n\t\t\t\t* the noun form *oei* is also available\n* modal system is the same, but instead of **ũ**, the infinitive *te* is used (e.g., *subute* :: want to (...))\n\n## 6.2 Questions\n* In Koyeah Tawa, *yo* (`Q.ALT`) is another question particle used when *no* nominalises a thing and that nominalisation is marked a question:\n\t* *fuyu no?* :: `what Q`\n\t\t* \"What?\"\n\t* *fuyu no yo?* :: `what NM Q.ALT`\n\t\t* \"What thing? / Which one?\"\n","7 Social hierarchy.md":"## 7.1 Social particles\n| Particle | IPA         | Gloss   |\n| -------- | ----------- | ------- |\n| ue       | `/ue/`      | COP.POL |\n| dae      | `/dae/`     | FORM    |\n| ara      | `/aɾa~aɺa/` | POL     |\n| iku      | `/iku~icu/` | HON     |\n\n## 7.2 Polite copular\n* The copular is mandatory in polite constructions\n* Furthermore, you use the *ue* form:\n\t* *su ni Miku ue*\n* If the root is an adjective, then you mark it:\n\t* *su ni iinu ue* (the *(ii)nu ue* is pronounced **`/nue~nu(h)e~nu(w)e/`** because *iinu* + *ue* assimilate)\n* So, marked root types + *ue* is the most formal, whereas just using *ue* with less marking is polite\n* The bare form *i* is used casually or between friends; it can be ruder or more 'direct'\n* You'd use *ue* when speaking to your elders and also mark all the words when speaking to your boss or teacher\n\n## 7.3 Formal and polite markers\n* Roots take *dae* (prefix) in formal constructions:\n\t* *Daekita ryo itagi* :: `FORM-like DEM.MED idea`\n\t\t* \"(I) like this idea\"\n\t\t\t* this is something you'd say in a (business) meeting\n\t\t\t* it marks a verb as being formal\n\t\t\t* optionally, the sentence may be concluded with a *ya* for emphasis and the extra-formal tone\n* Roots take *ara* (prefix) in polite constructions, though:\n\t* *Arakitanqu ryo itagi* :: `POL-like-ANT-V DEM.MED idea`\n\t\t* lit. \"I dislike your idea\"\n\t\t\t* it's much safer than saying *kitanqu ryo ita*, which can be harsh\n\t\t\t* this is like saying **\"I see what you mean by this, but, in my humble opinion, I would do it this way\"** instead\n* *iku* is an honourific, it comes after a proper noun, like in *Jamuiku* (God) or for softening your tone when speaking to someone\n* It is a term of respect\n","8 Other quirks.md":"## 8.1 Relationals\n* They aren't restricted to verbs:\n\t* *Ze byo i* :: `ITER DEM.PROX COP`\n\t\t* \"(I am) back\"\n\t\t* lit. \"Again here (is / am)\"\n* The copular is a generic *to be* stative:\n\t* *Subute ni wan kita mo i* :: `desire.V-INF TOP one like COM COP`\n\t\t* \"I want to be one with love\"\n\t\t* \"I want to be joined together with love\"\n\n## 8.2 Nominaliser\n* *no*, *oe,* and *en* are distinct, even though they all technically do the same thing:\n\t* *fuyu no* :: `what NM`\n\t\t* \"which one / what thing / what one\"\n\t\t\t* *wu ni fuyu no i yo?* :: `3SG TOP what NM COP Q.ALT`\n\t\t\t\t* \"Which one is it?\"\n\t* *fuyuoe* :: `what-ACC`\n\t\t* \"what (as a noun)\"\n\t\t\t* *wu ni fuyuoe i no?* :: `3SG TOP what-ACC COP Q`\n\t\t\t\t* \"What's it?\"\n\t\t\t\t* \"It's what?\"\n\t* *fuyuen* :: `what-VBZ`\n\t\t* \"what ('verbalised' gerund)\"\n\t\t\t* *wu ni fuyuen no?* :: `3SG TOP what-VBZ Q`\n\t\t\t\t* \"It's what-ing?\"\n\t\t\t\t\t* ~it's doing what?\n* Do note that whilst *oe* also marks an accusative or object, it's often used to mark a root as nominal\n* If you see it with verbs, though, then it would obviously be marking the direct object\n* It is often not really needed\n\n## 8.3 Features from Ashi Tawa\n* Stuff like *butei* (property, from *bu* (PROP) + tei (PROD)) is still possible, even if not formally codified\n\t* *butei* would refer to a property, like in *butei a daminu nampangutas* (a property is easily measurable...)\n* *fu* is also used roughly the same, but it's a little more codified, in that Koyeah Tawa formally allows constructions like these\n\t* *kana me fu kizute no do* :: `word REL ACT spike GEN PER`\n\t\t* lit. \"Words that do spike through(ing)\"\n\t\t* ~\"Words that pierce\"\n\t\t* ~\"Piercing words\"\n\t\t\t* usually, you'd just say ~*kizute no do no kana*, but this is fine for demonstrative purposes\n\n## 8.4 Sentence order\n* Koyeah Tawa has a strong tendency towards SOV in marked or complex constructions\n* So, verb-final order predominates when postpositions, particles, or embedded structures are present:\n\t* *na a ii kamo we pitsa ji ea* :: `1PL A good food ADD pizza LOC MOV`\n\t\t* lit. \"we, good food and pizza in, move\"\n\t\t* ~\"We went out for some good food and pizza\"\n\t* *poki hon me urukuen ryo ji ue niru no?* :: `big person REL stand-VBZ DEM.MED LOC COP.POL see.V Q`\n\t\t* lit. \"Big man that standing this (location is), see?\"\n\t\t* ~\"(Do you) see the big guy (that is) standing over there?\"\n\n## 8.5 Copular modification\n* In some cases, the copular can take morphemes, such as degree markers; however, the copular can never be reduplicated for non-augmentative superlative degree and is forced to take the augmentative superlative:\n\t* *oi* :: `EXCESS-COP`\n\t\t* \"To be too much of something\"\n\t\t* e.g., *hashiru oi* :: `child EXCESS-COP`\n\t\t\t* \"Too childish / (is being / to be) too much of a child\"\n\n## 8.6 Different usages of **ni**\n* The topic particle can be **contrastive** if used more than once:\n\t* *su ni sami ni kita* :: `1SG TOP fish TOP like`\n\t\t* lit. \"As for me, as for fish, like\"\n\t\t* ~\"I like fish, at least\"\n\t\t\t* it implies that you like fish but you might not like other things, like beef\n\t* *su ni kita nigooe, nigonq ni a kitanq* :: `1SG TOP like cat-ACC cat-ANT TOP A like-ANT`\n\t\t* lit. \"As for me, like cat, as for dog, (they) dislike\"\n\t\t* ~\"I like cats, but not dogs\"\n* It can also show **opinion**:\n\t* *su ni o to iinu* :: `1SG TOP U PFV good-MOD`\n\t\t* lit. \"As for me, you experienced good\"\n\t\t* ~\"You were good to me / I thought you were good / For me, you used to be good\"\n\t\t\t* *su ni* sets the stage (i.e., the comment is **in regards to what**)\n\t\t\t* *o to iinu* is the comment\n\t\t\t\t* *o* is the undergoer (`U`) particle\n\t\t\t\t* *to* is the perfective aspect\n\t\t\t\t* *iinu* is the adjective form of 'good' (*ii*)\n\t\t\t\t* *to iinu* would mean 'was good (modifier)'\n\t\t\t\t* adding this (*to iinu*) after *o* would then attribute the predicate 'was good' to *o*, which would be the undergoer\n\t\t\t\t* since context disambiguates the undergoer (*zu*), the undergoer is omitted\n\t\t* you can also phrase it as:\n\t\t\t* *O to iinu* :: `U PFV good-MOD`\n\t\t\t\t* ~\"You were good (to me)\"\n\t\t\t\t\t* no *su ni* needed, as it is inferred from context\n\t\t\t\t\t* if you really wanted to make it explicit that this is regarding *su*, you could say:\n\t\t\t\t\t\t* *Ni o to iinu* :: `TOP U PFV good-MOD`\n\t\t\t\t\t\t\t* ~\"You were good to (me)\"\n\n## 8.7 When to and not to use the copular\n* *su ni o to kitanai* :: `1SG TOP U PFV like-MID`\n\t* lit. \"As for me, (you) were liked\"\n\t* ~\"I liked (you)\"\n\t\t* *o* after the topic marks that something (inferred from context) is 'liked' (kitanai)\n\t\t* the copular is not used, because *o to kitanai* is a verb phrase\n* *ryo ngoshi ni iepokinu* :: `DEM.MED bird TOP AUG~big-MOD`\n\t* \"This bird is quite big\"\n\t\t* *-nu* is a modifier\n\t\t* the modifier inherently carries a 'to be / is'\n\t\t* in such constructions, a copular is often omitted\n\t\t* the copular *ue* can be stated if it is a formal or polite construction\n\t\t* if it is not, either no copular is used or *i* is used to make it 'more casual / intimate'\n* *hon ni meiyanu sami i* :: `person TOP cute-MOD fish COP`\n\t* \"The man is a cute fish\"\n\t\t* an odd sentence, but it's fine for the sake of demonstration\n\t\t* here, the descriptor (the comment) is a modifier chain (*meiya* + *sami*)\n\t\t* if you said *meiyanu saminu*, that might be understood, but it would feel incomplete, awkward, and off\n\t\t* for chains, the copular is always added after the last modifier\n\n## 8.8 Postposition-genitive patterns\n* Postpositions can be paired with genitives in this pattern:\n\t* *X no POST*\n\t\t* X is attributed to the postposition\n* where *POST* is any postposition and *X* is a root\n* For example, take *ita*:\n\t* *hon no ita* :: `person GEN PRTV`\n\t\t* ~\"Somebody / some person / some of the people\"\n* Let's take a look at some basic interrogative examples with each postposition:\n\t* *hon no ji* :: `person GEN LOC`\n\t\t* ~\"Person's location / place\"\n\t\t* often preferred in Koyeah Tawa for describing place\n\t\t\t* *hon no ji ni fuyu i no?* :: `person GEN LOC TOP what COP Q`\n\t\t\t\t* lit. \"As for the place of this person, (it) is what?\"\n\t\t\t\t* ~\"Where is this person?\"\n\t* *hon no un* :: `person GEN INSTR`\n\t\t* ~\"Person's means / way\"\n\t\t* often preferred in Koyeah Tawa for describing manner\n\t\t\t* *kamen no un byo ji ni fuyu i no?* :: `eat.VBZ GEN INSTR DEM.PROX LOC TOP what COP Q`\n\t\t\t\t* lit. \"As for eating's means here, (it) is what?\"\n\t\t\t\t* ~\"Are there any manners regarding eating that I should know about here?\"\n\t* *hon no do* :: `person GEN PER`\n\t\t* ~\"Through / from / out of the person\"\n\t\t* can attribute a 'through' quality to roots\n\t\t\t* *kizute no do no kana* :: `spike GEN PER GEN word`\n\t\t\t\t* lit. \"Words of spike's through\"\n\t\t\t\t* ~\"Piercing words\"\n\t* *hon no da* :: `person GEN ALL`\n\t\t* ~\"Person's progression / towards person\"\n\t\t\t* *ii no da no ni ieii mo iinq ya!* :: `good GEN ALL NMZ TOP AUG-good CMPR good-REVS`\n\t\t\t\t* lit. \"As for good's progression, better than bad - (indeed)!\"\n\t\t\t\t* ~\"(Do make no mistake), good triumphing over evil is better!\"\n\t* *hon no dan* :: `person GEN ABL`\n\t\t* ~\"Person's source / temporospatial starting point or origin\"\n\t\t\t* *hon no dan ni fuyu i no?* :: `person GEN ABL TOP what COP Q`\n\t\t\t\t* lit. \"As for the person's origin, (it) is what?\"\n\t\t\t\t* ~\"Where is the person coming from?\"\n\t\t\t\t* ~\"Where is the person starting out from?\"\n\t\t\t\t* ~\"What level is the person at?\"\n\t\t\t\t* etc.\n\t* *hon no mo* :: `person GEN SEQ`\n\t\t* ~\"Person's continuation / sequentiality\"\n\t\t\t* *hon no mo ni fuyu i no?* :: `person GEN SEQ TOP what COP Q`\n\t\t\t\t* lit. \"As for the person's sequentiality, it is what?\"\n\t\t\t\t* ~\"What is the person going to do next?\"\n\t\t\t\t* ~\"What will the person continue (next)?\"\n\t\t\t\t* ~\"What is the person's next move?\"\n\t* *hon no we* :: `person GEN ADD`\n\t\t* ~\"Person's additivity\"\n\t\t\t* *hon no we ni fuyu i no?* :: `person GEN ADD TOP what COP Q`\n\t\t\t\t* lit. \"As for the person's additivity, (it) is what?\"\n\t\t\t\t* ~\"Who is the person including?\"\n\t\t\t\t* ~\"Who is the person bringing along?\"\n\t\t\t\t* ~\"Who will the person be accompanying?\"\n* You can then scale these modularly:\n\t* *nggg, toriwaka eu wesan ni subeko no na i...* :: `FIL PFV-think COMP ADD-3SG.F.POSS TOP all GEN 1PL COP`\n\t\t* ~\"But, like, I thought that she was going to bring us all...\"\n\t\t\t* did you notice something? instead of the genitive pattern, *we* takes *-san*\n\t\t\t\t* in the case of pronouns, the postposition always take the respective pronominal possessive\n\t\t\t\t* so, for *sa* (she), *-san* is taken\n\t\t\t\t* *wesan*, then, means 'her additivity'\n\n### 8.8.1 Stacking\n* Formally, you'd always use something like:\n\t* *unsen byo no do ji* :: `live.VBZ DEM.PROX GEN PER LOC`\n\t\t* ~\"Living in (and through) the present\"\n* ... but in casual speech, you can just drop the **no**:\n\t* *unsen byo jido* :: `live.VBZ DEM.PROX LOC-PER`\n\t\t* ~\"Living in and through the present\"\n\t\t\t* the stacking order isn't super fixed or strict\n* Note that in the two examples, the proximal demonstrative *byo* was used in its temporal meaning ('now' / 'present' / 'current time'):\n\t* *yaranai byo ji zhi byo, fuka* :: `come-MID DEM.PROX LOC TEMP DEM.PROX REQ`\n\t\t* ~\"come here now, please\"\n\n## 8.9 Repair\n* Because *-ppu* and *-hi* still exist in Koyeah Tawa, even if they are less commonly used, conversational repair is very easy:\n\t* if you forgot to say *eoi* when talking about an irreal event, just add it at the end as *eoihi*\n\t* sometimes, you can even drop the *-hi* if you take a long pause, and it would automatically be interpreted as you conveying that everything you said before *eoi* is irreal\n* This also means that other Ashi Tawa nuances can be borrowed:\n\t* *fuppu* for an explicit 'actually, in reality, even, do:'\n\t\t* *fuppu riwakanai me...*\n\t\t\t* 'I really think...'\n\t\t\t* 'I do think...'\n\t\t\t* 'Indeed, I think...'\n\t\t\t* 'In the end, I think...'\n\n## 8.10 Word particles\n* Word particles like *yaro* always take *-mg* to form their structural opposites\n* This includes *shi* (primordial unit), which takes *-mg* to form *shimg* (complex / developed system)\n* Word particles ending in *-o* have an irregular form with *-nai*:\n\t* *yaro* + *nai* is *yarai*, not *yaronai*\n* *de* isn't a word particle, so don't get confused, even though it can seem like one in:\n\t* *de a toii* (well-received)\n\t\t* this is just a phrase\n\t\t* *de* means 'to receive' and *a* (*de a*) makes *de* a subject\n\t\t* *ii* just means 'well' or 'good' and describes *de*\n\t\t* *toii* is the perfective aspect, meaning 'was good'\n\t\t\t* note: its better to avoid aspect in simple phrases or on simple roots like *ii*\n\t\t\t* either place aspect at the appropriate position in the sentence... or, better yet, just drop it\n\n## 8.11 Irregular aspect and copular quirks\n* The extended aspects, such as *reta*, always go after the root, even though simple aspects, like *to*, are prefixes\n* Extended aspects can be standalone, so you can start with *reta* or end with *retahi* (casually or sometimes *reta* at the end could be okay, if followed by a long pause)\n* *shi* or other functional mood / conditional particles take aspect as a suffix, so say *shito* when starting a past condition (if was...)\n* The copular can carry the predicate and can take a few particles:\n\t* *irra* :: is not / not being\n\t* *irranai* :: is not being\n\t\t* difference:\n\t\t\t* *hon irranai* :: the person does not exist\n\t\t\t\t* *shi hon irranai, su wa irranai*\n\t\t\t\t\t* if the person did not exist, I also would not\n\t\t\t* *hon irra* :: the person is not\n\t\t\t\t* *shi hon irra, su wa irranai*\n\t\t\t\t\t* if there was no person, I would not be\n\t* so:\n\t\t* *irra* is static negation, referring to absence\n\t\t* *irranai* suggests the process of 'being' is non-occurring, since the middle voice indicates that *i* happens back to the subject\n\t\t\t* the grammatical structure for:\n\t\t\t\t* `if no X, Y would not be`\n\t\t\t* ... is *shi ... X irra, ... irranai*\n* The copular taking *-nai* turns it into a 'happen' word:\n\t* *iinq inai* :: bad (things) happened\n\t* *ii no inai* :: good thing happened\n\t* *mo... hashirusan inai* :: then, her child just happened\n* The copular can't take any aspect or usually any other particle, so never say *toinai* or anything, just put the aspect somewhere else\n\n## 8.12 Omission of the temporal relational\n* *zhi* is omitted if you're using a 'time' word, like *ko* (day/tomorrow/yesterday) or *wanō* (time) itself:\n\t* *Ko, reokamu* :: `tomorrow IPFV-eat.V`\n\t\t* ~\"Tomorrow, (we) will eat\"\n\t* *Ryo wanō, namekurrate makusutanai, fukaya!* :: `DEM.MED time mistake.V-NEG-INF cry-DIM.SUP-MID REQ-ASSERT`\n\t\t* ~\"(Maybe) next time, you shouldn't be crying after making such mistakes (please, I mean it)!\"\n\t* *Zuoe, kikitasaru subeko no wanō* :: `2SG-N INTENS~like-PERF.RES all GEN time`\n\t\t* ~\"I have and always will love you forever\"\n* Note that *ni* would usually be used to set the temporal context as the topic\n\t* *ni* is often omitted because 'time clauses' can behave like their own topic, if fronted\n","9 Discourse standard.md":"## 9.1 Usage of **ni**\n*ni* is the topic particle, just like は (wa) in Japanese:\n- **The 'As For' Clause:*\n\t- *ni* is best understood as 'as for [noun]'\n\t- the particle 'sets the stage'\n- **Information Status:**\n\t- it is used for 'Old' or 'Given' information\n\t- but it can introduce a 'New' topic\n\t- *ni* can be used to refer back to aforementioned persons or objects\n- **Scope of Influence:**\n\t- an established topic (with *ni*) remains the topic until a new topic is re-established with *ni*\n- **Contrastive Usage:**\n\t- it often shows a difference between things:\n\t\t- *atora ni mafo i, su ni ohira* :: `apple TOP red 1SG TOP white`\n\t\t\t- ~\"The apple is red, but I am white\"\n- **Generic Statements:**\n\t- used for general truths, definitions, or habitual actions where the subject is a known category\n\t\t- *sowo ni sowu sora ji* :: `sun TOP shine.V sky LOC`\n\t\t\t- ~\"The sun shines in the sky\"\n\n## 9.2 Usage of **a**\n- **The 'Identity' Focus:**\n\t- it answers the question 'Who did it?' or 'Which one?'\n- **Information Status:**\n\t- it gives new information\n\t- when introducing a person or thing for the very first time in a story or report, 'a' would be used\n- **Spontaneous Description:**\n\t- used for reporting immediate, observed events or states that weren't previously being discussed\n\t\t- *ngoshi a kamen* :: `bird A eat.VBZ`\n\t\t\t- ~\"The bird is eating\"\n\t\t- *sora a chien* :: `sky A water-VBZ`\n\t\t\t- lit. \"The sky is watering\"\n\t\t\t- ~\"It is raining\"\n- **Exclusionary Abilities:**\n\t- it carries an inherent sense of 'this one and no other'\n\t\t- *Jon a kamumas i* :: `john A eat.V-AG COP`\n\t\t\t- ~\"John is a gourmand\"\n\t\t\t\t- it implies that it is John (and no other) that is specifically holding the role of being a gourmand\n\n### 9.2.1 Note on the actor particle\n* Whilst *a* is an 'actor' particle that frequently forces even non-verbs appearing after it to be verbalised, it doesn't mean that it can't take non-verbs\n* For example, in the sentence *jon a kamumas i*, *a* takes *kamumas i*, which is a predicate with the *i* copular particle\n* Here, *a* cannot verbalise *kamumas* because it is:\n\t* explicitly a noun (*-mas* is an agentivised noun)\n\t* present with a copular (*i* attributes the predicate to the subject)\n\n## 9.3 New to Old\nIn cohesive discourse, there is a standard 'hand-off' between these two particles to maintain flow.\n- **The Introduction Rule:**\n- A common pattern is to introduce a noun with 'a' and then switch to 'ni' for every subsequent mention.\n\t- *To nigo a kamu kamteisun. Nigo ni iepokinu* :: `PFV cat A eat.V food.PROD-1SG.POSS | cat TOP AUG~big-MOD`\n\t\t- ~\"A cat ate my food. It (the cat) was very big/fat.\"\n- **Question and Answer Logic:**\n* Questions take *a* and answers too:\n    - *fuyu hon a kamu kamsun no?* :: `what person A eat.V food.1SG.POSS Q`\n\t    - ~\"Who (what person) ate my food?\"\n\t- *Honrra ya! Nigo a ei* :: `person-NEG ASSERT | cat A ANAPH`\n\t\t- ~\"Not a person! The cat did / it was a cat\"\n\n## 9.4 Structural Constraints\nThese markers interact differently depending on the complexity of the sentence.\n* Nested clauses take *a* because *ni* would be jarring:\n\t* *ribu me fosho a harinai* :: `book REL boy A exchange-MID`\n\t\t* \"The book that the boy bought\"\n- In casual speech, if the topic is already clear, the entire *noun ni* phrase is often dropped\n\t- *a*, though, is rarely dropped because it provides the essential 'new' identity required to understand the sentence.\n- If you want to make the object of a sentence the main topic (topicalisation), you replace the object marker with 'ni'.\n    - *keka ni kamu* :: `cake TOP eat.V`\n\t    - ~\"I ate the cake\"\n\n### 9.4.1 Why topicalise\n* Let's compare two sentences:\n\t* (topicalised object) *keka ni kamu* :: `cake TOP eat.V`\n\t* (direct object) *kamu keka* :: `eat.V cake`\n* Both translate to:\n\t* \"I ate the cake\"\n* ... but mean something different:\n\t* *keka ni kamu* is like saying: 'as for the cake, I ate it (but maybe not the rest / but I don't know about other food)'\n\t* *kamu keka* is like stating a simple fact: 'I ate the cake'\n\n### 9.4.2 Modifier attribution\n* Because of the way *a* works, constructions like this is fine, and sometimes even natural:\n\t* *ryo kamtei ni kamqe a iewaoioinu* :: `DEM.MED food.PROD TOP food.EMO A AUG-taste-POSITIVE-MOD`\n\t\t* ~\"This food tastes really good\"\n\t\t\t* however, it's a little more poetic than that\n\t\t\t* it's like saying 'the feeling I get from eating this is really pleasing (for me)'\n\n## 9.5 **mo** in reporting speech\n* *mo* has two commonly used degrees:\n\t* *mosuta*\n\t\t* ~'these were **probably/likely** the exact words he said'\n\t\t* ~'I may misremember, but he said something along these lines'\n\t* *mosutanyi*\n\t\t* ~'I have the faintest, most minimal inkling that this is what he said'\n\t\t* ~'If I'm being forced to say that this is what he said, it's by the thinnest margin possible'\n* In any case, you'd often use plain word order or **demonstratives** unless you're writing a story or quoting someone\n* Examples:\n\t* *toriwaka mo, nggggggg, shirerranai* :: `PFV-think QUOT FIL know-NEG-MID`\n\t\t* ~\"I thought exactly... like, uhhh, (never mind), I don't know\"\n\t* *sa a fofu mo 'su a kitanq zuoe'* :: `3SG.F A speak.V QUOT 1SG A like-ANT 2SG-ACC`\n\t\t* lit. \"She says, 'I hate you'\"\n\t\t* ~\"She said that she hates me\"\n\t* *nirunai mosuta so* :: `see.V-MID QUOT-MAX.DIM 3SG.M`\n\t\t* ~\"I'm almost certain I saw him\"\n\t\t* ~\"Pretty sure that I saw him (though I may misremember a little)\"\n\t* *nirunai mosutanyi so* :: `see.V-MID QUOT-MAX.DIM-AUG.SUP 3SG.M`\n\t\t* ~\"I have the faintest glimpse that I thought that I saw him\"\n* Rule of thumb:\n\t* *mo* for any regular quote: a saying of some philosopher or character dialogues\n\t* the other degrees of *mo* for more control over exactness or absoluteness\n* Note that *mo* is very strong: if you misconstrue a person and you used *mo*, then that would be a very big lie\n\n### 9.5.1 Demonstratives\n* Apart from strict word order, you can quote people using demonstratives, but the strength of your reporting depends on the demonstrative used\n* The demonstrative must be in the -oe form:\n\t* *sa fofu byōe: zu ga iinq ue* :: `3SG.F speak.V DEM.PROX-N 2SG NOM good-REVS COP.POL`\n\t\t* lit. \"She politely told me that I was bad\"\n\t\t* ~\"She said right there and right then that I was a pile of shit, politely\"\n\t\t\t* *... iinq ue* is a very sardonic and rude construction, especially when paired with `X ga`, where `X` can be a pronoun like *zu* (you)\n\t* *so fofu ryōe: kita samioe* :: `3SG.M speak.V DEM.MED-N like fish-N`\n\t\t* lit. \"He said this: like fish\"\n\t\t* ~\"He said that he likes fish between us\"\n\t\t\t* compared to *byōe*, *ryōe* is a little more direct, but less strong (in quotations), and always has a 'between us' nuance\n\t* *na fofu lyōe: kitanq samioe* :: `1PL speak.V DEM.DIST-N like-REVS fish-N`\n\t\t* lit. \"We said that there: hate fish\"\n\t\t* ~\"We said that we hate fish\"\n\t\t\t* *lyōe* is the least direct\n\t\t\t* often has a 'back then' or 'then' nuance, like 'we said (then)'\n\n## 9.6 Postposition interaction with **ni**\n* *X ji ni Y*\n\t* X is in/at/to Y (contrast)\n\t* *asasan ji ni reo eanai* :: `house-3SG.F.POSS LOC TOP IPFV go-MID`\n\t\t* ~\"To her house, I will go (e.g., but not his)\"\n* *X un ni Y*\n\t* At X / by X (contrast)\n\t* *byo ni kamenrra un* :: `DEM.PROX TOP eat.VBZ-NEG INSTR`\n\t\t* ~\"I am not eating here (e.g., but I'll eat a home)\"\n* *X mo ni Y*\n\t* With X (relationship), Y (contrast)\n\t* *so mo ni fofurra* :: `3SG.M COM TOP speak.V-NEG`\n\t\t* ~\"I won't talk to him\"\n\t\t\t* implies that you'd talk to others, just not him\n\t* *so mo ni imorranai* :: `3SG.M COM TOP SIM-NEG-MID`\n\t\t* ~\"I am not like him\"\n\t\t\t* if you just said *so ni imorranai*, it would have a different meaning, unless you explicitly compared with yourself\n\t\t\t* instead of overly verbose constructions like that, using the *X mo ni Y* relationship is easier\n\t* *sami mo ni omoko a daeii ue* :: `fish CMPR TOP chicken A FORM-good COP.POL`\n\t\t* ~\"Rather than fish, the chicken is more exquisite\"\n\t\t\t* this is something you'd usually say at a dinner\n\t\t\t* it's formal\n\t\t\t* with friends, you can just say *sami ni ieii mo omoko* :: `fish TOP AUG-good CMPR chicken`\n\t\t\t\t* the copular after *ieii* is omitted here (see **8:8.7**)\n* *X dan ni Y*\n\t* From X, Y (contrast)\n\t* *ko dan ni reo iekitaen hon ji i* :: `tomorrow ABL TOP IPFV AUG-like-VBZ person LOC COP`\n\t\t* \"Starting tomorrow (unlike today), I'll be more loving towards people\"\n* *X da ni Y*\n\t* Towards X, Y (contrast)\n\t* *asasun un ni nanda da ni earranai* :: `house-1SG.POSS INSTR TOP down ALL TOP MOV-NEG-MID`\n\t\t* \"In my house, specifically in the downwards direction, don't go (up may be fine)\"\n\t\t\t* note that *nanda ji* is preferred instead of *nanda da*, since the latter is more 'poetic' than it is conversational\n\t* *so da ni hvaitei a unsunai* :: `3SG.M ALL TOP fear-PROD A live.V-MID`\n\t\t* \"Towards him, fear/monsters live\"\n* *X no ni Y*\n\t* X (phrase, clause, or adjective) (as a thing / noun), Y\n\t* *mafo no ni sa ji ue* :: `red NM TOP 3SG.F LOC COP.POL`\n\t\t* \"the red one is meant for her\"\n* *X do ni Y*\n\t* X (traverses / detaches) (at/from) Y\n\t* *jimei do ni haeku* :: `LOC-ANIM ACC TOP walk.V`\n\t\t* \"Through the land, (I) walk\"\n\t* but note that *X do ni Y* is usually never used\n\t* it's very redundant, and saying *jimei ni haeku* is actually fine 99% of the time\n\n## 9.7 Underspecified subject particle\n* In fast speech, speakers use *ga* over *a* or *o* to mark the subject\n* *ga* is not informal nor is it \"casual,\" but it is modern\n* *a* and *o* would still be used in formal or official documents, even though *ga* is the spoken variant\n* So, you'd say:\n\t* *sa ga au kambu no ng* :: `3SG.F NOM HAVE.V food.PROP NMZ FIL`\n\t\t* ~\"She has something that resembles food\"\n\t\t* ~\"She has (some) kind of food\"\n\t* *sa ga aumg kambu no ng* :: `3SG.F NOM HAVE.V-G.REVS food.PROP NMZ FIL`\n\t\t* ~\"She will get some weird food\"\n\t\t* ~\"She's going to get some type of food\"\n\t\t\t* notice: *aumg* is used\n\t\t\t* *aumg* is the proper variant of *au* used when you want to say 'get' or 'obtain'\n\t\t\t* it is only used when *ga* is also present in the sentence\n\t\t\t* otherwise, if *ga* was not present, you would use *demg*\n","10 Glossing standard.md":"## 10.1 Glossing table\n| Particle | Gloss                         |\n| -------- | ----------------------------- |\n| ni       | **TOP**                       |\n| a        | **A**                         |\n| o        | **U**                         |\n| nai      | **MID**                       |\n| nq       | **REVS**                      |\n| nh / n   | **G.REVS**                    |\n| te       | **INF**                       |\n| yo       | **Q2**                        |\n| rra      | **NEG**                       |\n| rri      | **AFF**                       |\n| no       | **GEN** / **NMZ** / **Q**     |\n| oe       | **N**                         |\n| do       | **PER**                       |\n| nu       | **MOD**                       |\n| bu       | **PROP**                      |\n| (r)u     | **V**                         |\n| mo       | **CMPR** for comparative role |\n| en       | **GER**                       |\n| ake      | **IMP.DIR**                   |\n| aiko     | **IMP.POL**                   |\n| aa       | **CONC**                      |\n| ani      | **PROV-CIRC.PRIV**            |\n| suta     | **MAX.DIM**                   |\n| nyi      | **AUG.SUP**                   |\n| sutanyi  | **MAX.DIM-AUG.SUP**           |\n| cha      | **PLT.F**                     |\n| che      | **PLT.M**                     |\n| nya      | **ROM.F**                     |\n| nye      | **ROM.M**                     |\n| oi       | **MEL**                       |\n| ta       | **PEJ**                       |\n| (r)u     | **PLT.V**                     |\n| nyu      | **ROM.V**                     |\n| masu     | **AGT**                       |\n| masumg   | **AGT-G.REVS**                |\n| qe       | **AFF**                       |\n* Others stay the same, as described\n* Note:\n\t* *aa* also asserts what comes after it as something the two speakers are clear on\n\t* so, for example, if you say:\n\t\t* *Riwaka me rēoi fofenrra ryōe iehaeko un. Aa toshirenai me zu a fofu su ji, eu: sa riwaka me su a tohakennq. Mo mo, todesunai.*\n\t\t\t* ~\"I thought that you would not say this so casually. Even though I knew that you will say to me that she thinks that I was lying. But, the opposite happened.\"\n\t\t\t\t* this means that the listener said it **casually**, not that the listener said something other than 'she thinks that you're lying'\n\t\t\t\t* after *aa*, the statement *(...) me su a tohakennq (...)* (that I was lying) follows\n\t\t\t\t* this sets that statement as a 'fact' that can't be negated by *des* later\n\t\t\t\t* so *des* negates everything except that\n* Superlatives are **INTENS~** now\n* The *en* particle is **GER** (gerund) now\n* *nyu* is an irregular particle, as it drops the *-u* in place of the next affix's vowel (if it begins with a vowel):\n\t* *nyen* :: `ROM.V.GER`\n\t* *nyoi* :: `ROM.V.MEL`\n\t* *nyuta* :: `ROM.V-PEJ` (*u* not dropped, since *ta* does not begin with any vowel)\n* It drops *n* if appearing after an affix:\n\t* *iiǵyu* :: `good-REVS.ROM.V`\n\t\t* 'to badden'\n* With *nai*, the *yai* form is used:\n\t* *iiǵyai* :: `good-REVS.ROM.V.MID`\n\t\t* 'to be baddened'\n* Also, *masumg* is used for patientives:\n\t* *pamyamasu* :: writer\n\t* *pamyamasumg* :: written work / manuscript\n","11 Arguments.md":"## 11.1 The middle voice\n* The middle voice *-nai* can be a very difficult concept to grok, especially when you see it appearing everywhere without understanding what it does:\n\t* *Earranai* :: ~\"I did not go\"\n\t* *Earra* :: ~\"I did not move (something)\"\n\t* *Shirenai no?* :: ~\"Do you know?\"\n\t* *Shire no?* :: ~\"Did you learn?\"\n\t* *Shirenaite kamu* :: ~\"I know how to eat\"\n\t* *Shirete kamu* :: ~\"I have learnt (how) to eat\"\n* Throughout all these examples, one thing remains true:\n\t* *nai* demotes an argument from a verb\n* So:\n\t* *shire* (know) by default means to 'do knowing' of something (e.g., learn)\n\t* *ea* (move) by default means to 'move' something or it marks movement\n* With *-nai*:\n\t* *shirenai* is the knowledge possessed itself:\n\t\t* *ake shire payazun ji!*\n\t\t\t* lit. \"Do knowing (of something) for your exam!\"\n\t\t\t* ~\"Prepare for your test!\"\n\t\t\t* the object of *shire* is implied, as it is omitted\n\t\t\t* you can specify:\n\t\t\t\t* *Senodzu zu ji kiteioe ni, ake, shire paya ji!*\n\t\t\t\t\t* lit. \"I sent to you a thing, as for it, know it for the exam!\"\n\t\t\t\t\t* ~\"Prepare from what I sent you for your exam!\"\n\t* *eanai* is movement concerning the subject:\n\t\t* *to eanai asasan ji*\n\t\t\t* \"I went to her home\"\n* Same rule for infinitives:\n\t* *shirete* -> to do knowing (infinitive)\n\t\t* *shirete au poki riwakango, fuka!*\n\t\t\t* lit. \"Learn to have a big brain, please!\"\n\t\t\t\t* but this is an inaccurate translation\n\t\t\t\t* *shirete*'s direct object is omitted, so it's like saying ~'you need to study to be smart'\n\t* *shirenaite* -> to know\n\t\t* *shirenaite au poki riwakango, fuka!*\n\t\t\t* lit. \"Learn how to have a big brain, please!\"\n\t\t\t\t* no direct object, so 'learn to have a big brain' is accurate here as well\n\n## 11.2 Roles\n* **Verb valency demotion (argument reduction)**\n\t* *hari* -> exchange X in relation to Y (e.g., for)\n\t* *harinai* -> buy X (with optional context; i.e., Y)\n* **Marking intransitivity**\n\t* *shire* -> to do knowing (of) / to learn\n\t\t* *ake shire ryo!* -> learn this!\n\t* *shirenai* -> to know\n\t\t* *shirenai ryo ita no?* -> (do you) know about this?\n* **Middle voice**\n\t* *sa a koru* -> she kills\n\t* *sa a korunai* -> she dies (and it is her fault) / she kills herself\n\t* *sa o korunai* -> she dies\n* **Grammatical valency / argument demotion**\n\t* For example, take the case of *-tenai*\n\t\t* when *-te* (infinitive that must take an argument) is demoted via *-nai*, the 'clause' or 'argument' it takes is also omitted\n\t\t* so, that 'argument' becomes totally dependent on context\n\t\t* if you were having a conversation about pizza and said:\n\t\t\t* *nggggg, na a nasute eanaitenai...* :: `FIL 1PL A ability.V-INF MOV-MID-INF-MID`\n\t\t\t\t* ~\"well, we can go out (to do something)...\"\n\t\t* then it would be clear that you were talking about going out to get pizza\n\t* *Kedesurranaite ukaju aioe* :: `shame-NEG-MID-INF find.V help-N`\n\t\t* ~\"Don't feel that you're singled out to find help\"\n\t\t* ~\"Don't feel ashamed to get help\"\n\t* *Kedesurranaitenai* :: `shame-NEG-MID-INF-MID`\n\t\t* ~\"Don't feel ashamed (to get help / to do this)\"\n\t* *Eanaitenai* :: `MOV-MID-INF-MID`\n\t\t* ~\"Going out (to eat / do something)\"\n\n### 11.2.1 Valency-sensitivity transitivity marking exception\n* Marking **transitivity in valency-sensitive verbs** is skipped\n\t* since *-nai* attaches to even transitive verbs when they omit their object, this can get tricky with *valency-sensitive* verbs\n* Take *fofu*, for example\n* As a verb, it means 'speak X to Y'\n* When demoted, it means 'hear X (context)' or 'ask X (context),' depending on the postposition\n\t* e.g.\n\t\t* *mo fofunai su ji, fuka* means 'then, ask me, please'\n\t\t* *mo fufunai su dan, fuka* means 'then, (why don't you) hear (it) from me, please'\n* So, if *fofu* does not take a direct object, like in:\n\t* *fofu eu...* :: speak / tell / say (that)\n* it still doesn't take *-nai*, because that would change the meaning:\n\t* *fofunai eu...* :: hear (that)... / listen (that)... / know that...\n\n### 11.2.2 Reciprocality\n* Use *pai* (`REFL`) for this:\n\t* *so a jitekupai* :: he pees himself (and it is his fault)\n\t\t* **agentive reflexive**\n\t* *so o jitekupai* :: he pees himself (accidentally)\n\t\t* **patientive reflexive**\n* They can also be used with postpositions, but require an infinitive to link them to the postposition:\n\t* *osaratepai* :: `call-INF-REFL`\n\t\t* ~\"call to (oneself)\"\n\t\t\t* bare infinitives take *-pai* directly on the verb\n\t* *tokamu motepai* :: `PFV-eat.V COM-INF-REFL`\n\t\t* ~\"(I) ate with myself\"\n\t\t\t* the postposition takes the infinitive *-te* to link it to *-pai*\n* They differ from:\n\t* *so a jitekunai* -> peeing happens by him\n\t* *so o jitekunai* -> peeing happens to him\n* Take a look at this with *kamu*:\n\t* *so a kamupai* :: he engages in autocannibalism\n\t* *s
