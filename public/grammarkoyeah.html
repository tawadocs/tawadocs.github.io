R.POT.PLT.V DEM.MED-N`\n\t\t* ~\"He made this edible\"\n\t\t\t* now, *kamumatasu* takes *ryōe* as a direct object\n\t\t\t* no *-matasai* can be used\n\t* *Sa o tokorutashinai* :: `3.SG.F U PFV-kill.PLT.V-POT.ATTR-MID`\n\t\t* ~\"She was able to die\"\n\t\t\t* no direct object\n\t\t* ~\"She was killable (maybe now she isn't)\"\n\t\t\t* less accurate in terms of translation\n\t* *Zu ga kitanagatashai ue* :: `2.SG.AN NOM like-PST.HAB-POT.ROM.V.MID COP.POL`\n\t\t* ~\"You used to be loveable\"\n\t\t\t* *tashai* is used for *tasu* + *nyu* + *nai*\n\t\t\t* otherwise, *tashu* is used for *tasu* + *nyu* (`POT.ROM.V`), since *tasu* alone is (`POT.PLT.V`)\n\t\t\t* note that *tashai* is pronounced like 'tashyai'\n\t\t\t\t* `/'ta.ɕja.i/`\n\t\t\t\t* the full-stops denote morae, not 'breaking up' of the vowels\n\t\t\t\t* so you'd hear it like **taɕjai**\n\t\t\t\t* some dialects or speakers may still pronounce it **taɕai**, but this is not the pronunciation used in NSKT\n* Here's one crazy sentence:\n\t* *Wumei omg kitaivamatashyai ue* :: `3.SG.INAN.NAT.NHUM EXP.NVOL like-FUT.PFV.PROG-TR.POT.ROM.V.MID COP.POL`\n\t\t* ~\"It so just happens to be the case that it will have been accidentally made likeable\"\n\t\t\t* *wumei* (it) refers to a natural, inanimate, non-human thing, such as a random rock or irrelevant dust\n* As a noun, you use *tasugi* or an appropriate radical:\n\t* *Iukorratasugi* :: 'unsoundability' / 'incorrectability'\n\t\t* e.g., *myomg no ga aumg iukorratasugioe no?*\n\t\t\t* 'Is it possible that something is wrong?'\n\t\t\t* 'Could something be wrong?'\n\t* or use these:\n\t\t* *Ipappu*\n\t\t\t* *Ipappu, myomg no ga iukirra no?*\n\t\t\t\t* 'Maybe, something is wrong'\n\t\t\t\t* 'Is something wrong (uncertain)?'\n\t\t\t\t\t* more about doubt, uncertainty, or the speaker's belief\n\t\t* *Shirerranai*\n\t\t\t* *Myomg no ga iukirra, shirerranai no?*\n\t\t\t\t* lit. 'Something is wrong, (we) cannot know'\n\t\t\t\t* ~'Maybe, is something wrong?'\n\t\t\t\t* ~'Something might be wrong'\n\n### 14.1.2 Experiencer particle\n* Koyeah Tawa has two particles that are not commonly used:\n\t* *amg* (`EXP.VOL`)\n\t\t* voluntary experiencer\n\t* *omg* (`EXP.NVOL`)\n\t\t* involuntary experiencer\n* Let's say you want to say:\n\t* 'well, one thing led to another, she slipped, the universe conspired, physics happened, and someone died'\n* You'd say:\n\t* *sa o koru* :: `3SG.F U kill.V`\n\t\t* ~\"She experienced killing\"\n\t\t\t* remember that it doesn't mean she is the one being killed\n* If you want to say 'she was killed:'\n\t* *sa ga tokori no i* :: `3SG.F NOM PFV-kill.ATTR NMZ COP`\n\t\t* ~\"She is the one that was killed\"\n* Or 'she died:'\n\t* *sa o korunai* :: `3SG.F U kill.V-MID`\n\t\t* ~\"She died\"\n* With *amg* or *omg*, you can simply do:\n\t* *sa omg koru* :: `3SG.F EXP.NVOL kill.V`\n\t\t* lit. \"She experiences killing\"\n\t\t* ~\"The universe conspired, physics happened, and someone died accidentally as she was there\"\n\t\t\t* e.g., 'she slipped, the gun went off, total accident'\n\t* *sa omg korunai* :: `3SG.F EXP.NVOL kill.V-MID`\n\t\t* lit. \"She experiences death\"\n\t\t* ~\"At that moment, her heart just happened to decide to cease its beating\"\n\t* *sa amg koru* :: `3SG.F EXP.VOL kill.V`\n\t\t* lit. \"She experiences killing intentionally\"\n\t\t* ~\"The universe conspired in such a way that someone died, as planned by her\"\n\t\t\t* she did choose to do it, but the focus is on **her feeling of doing it**\n\t* *sa amg korunai* :: `3SG.F EXP.VOL kill.V-MID`\n\t\t* lit. \"She chose to pass away\"\n\t\t* ~\"She experienced death willingly\"\n\t\t\t* good for describing suicide, martyrdom, or euthanasia:\n\t\t\t\t* *korutanai* :: `kill.V-NEGATIVE-MID`\n\t\t\t\t\t* negative connotation on *korunai* makes it suicide in this case\n\t\t\t\t* *koruoinai* :: `kill.V-POSITIVE-MID`\n\t\t\t\t\t* to die a martyr or offer sacrifice (by dying)\n\t\t\t\t* *koronyunai* :: `kill-V.ROM-MID`\n\t\t\t\t\t* to be euthanised or mercy-killed\n\n## 14.2 Transitiviser (**NSKT 3.2**)\n* The transitiviser (`TR`) particle *-mai* can be used to transitivise a verb\n\t* it forms the following combinations with postpositions:\n\t\t* *jimai*\n\t\t\t* `LOC-TR`\n\t\t\t* it follows for other forms of postpositions:\n\t\t\t\t* *jinyai* `LOC-AUG.SUP.TR`\n\t\t* *unmai*\n\t\t\t* `INSTR-TR`\n\t\t* *domai*\n\t\t\t* `PER-TR`\n\t\t* *dai*\n\t\t\t* `ALL.TR`\n\t\t* *danmai*\n\t\t\t* `ABL-TR`\n\t\t* *momai*\n\t\t\t* `COM-TR`\n\t\t* *yai*\n\t\t\t* `BEN.TR`\n\t\t* *yenmai*\n\t\t\t* `MAL-TR`\n\t\t* *ninmai*\n\t\t\t* `ABESS-TR`\n* You'd use the middle voice form (`MID.TR`) for something like this:\n\t* *Kamunamai* :: to be fed X\n* You can also turn any noun into a verb of your choice:\n\t* 'I went to the house' :: *toasanadai* `PFV-house-MID.ALL.TR`\n\t\t* here, *-nadai* makes *asa* a middle voice verb, meaning '(I am) heading to the house'\n\t\t* *to-* simply marks this as perfective\n\t\t* together, it means 'I (had) headed to the house'\n* In Tawa, 'hateru' cannot be used for 'run over;' instead, you use:\n\t* *Soraṋjeru* :: to put into the ground\n\t* e.g.,\n\t\t* *O tosoraṋjenai*\n\t\t\t* ~\"I was run over / put into the ground\"\n\n### 14.2.1 Default usage\n* By default, *-mai* marks a causative:\n\t* *kamumai* :: feed\n\t* *korumai* :: execute / make die\n* The postpositional forms aren't necessary to be memorised, you'd often never use them\n* Someone saying *toasanadai* casually was likely trying to be cool or overly poetic and archaic\n\n## 14.3 Degree on each type\n### 14.3.1 Verbs\n* Degrees on verbs behave differently than degree on other word types\n* Here are all the degrees on different verbs:\n\t* **eat**\n\t\t* *kakamu* :: to eat intensely / hard\n\t\t* *kamunyi* :: to eat most intensely / hard / severe\n\t\t* *okamu* :: to eat too much / in excess\n\t\t* *kamusuta* :: to eat too little\n\t\t* *iekamu* :: eat not too much not too little / pretty good eating\n\t* **see**\n\t\t* *niniru* :: to concentrate / focus hard\n\t\t* *nirunyi* :: to strain one's eyes / severely focus\n\t\t* *oniru* :: to see too much\n\t\t* *nirusuta* :: to see too little\n\t\t* *ieniru* :: see fine / see enough\n\t* **run**\n\t\t* *hahateru* :: to run intensely / hard\n\t\t* *haterunyi* :: to run unhealthily / severely\n\t\t* *ohateru* :: to run too much\n\t\t* *haterusuta* :: to run too little\n\t\t* *iehateru* :: run pretty much\n\t* **talk**\n\t\t* *fofofu* :: to speak intensely / harshly (in tone or volume)\n\t\t* *fofunyi* :: to shout / scream\n\t\t* *ofofu* :: to speak too much / blab a lot\n\t\t* *fofusuta* :: to speak too little\n\t\t* *iefofu* :: speak fine / speak enough\n* General rule:\n\t* **moraic reduplication**: intense, harsh, or 'higher'\n\t* **-nyi**: severely, extremely, often in a way that can hurt or be painful\n\t* **-suta**: too little, not enough\n\t* **o-**: too much, in excess\n\t* **ie-**: pretty much, not too little and not too much, enough, fine\n\n### 14.3.2 Nouns\n* Examples:\n\t* **house**\n\t\t* *asasa* :: mansion\n\t\t* *asanyi* :: villa, castle, McMansion\n\t\t* *oasa* :: estate\n\t\t* *asasuta* :: slum house\n\t\t\t* refers to any house that is too little of a home\n\t\t\t* 'to little' means 'less,' not literally 'small'\n\t\t\t* so, a lesser house would be one that doesn't function much like a house\n\t\t\t* this includes slum \"homes\"\n\t\t* *ieasa* :: fine/decent house\n\t* **water**\n\t\t* *chichi* :: lake\n\t\t* *chinyi* :: sea\n\t\t* *ochi* :: ocean\n\t\t* *chisuta* :: too little water\n\t\t\t* *chisusuta* would mean 'drops / a trickle' (the least)\n\t\t\t* *chisutanyi* would mean 'a faint glimmer of a trickle' (most of the least)\n\t\t* *iechi* :: enough water\n\t* **person / human**\n\t\t* *hohon* :: group\n\t\t* *honnyi* :: crowd\n\t\t* *ohon* :: overpopulation / overcrowding / an excess of people\n\t\t* *honsuta* :: sparsely populated / too little people\n\t\t* *iehon* :: enough people / decent amount of people\n* The rule:\n\t* **moraic reduplication**: a bigger / more intense form\n\t* **-nyi**: a grand form\n\t* **-suta**: too little, not enough, sparse\n\t* **o-**: unimaginably huge, too much, copious amounts\n\t* **ie-**: pretty good, decent, enough, OK, fine\n\n### 14.4 Degree degree\n* Degree with degree on it (*degree degree*) can be formed like this:\n\t* *suta* (little) + *nyi* (most) = most of a least (*sutanyi*)\n* And you can reduplicate them too:\n\t* *suta* :: *susuta* (least)\n\n## 14.5 *nai* irregularity\n* *nai* is one of the most (if not the most) irregular particles in Tawa\n* Its form changes a lot:\n\t* *Shirenarra* :: polite\n\t* *Shirerranai* :: casual/direct\n* It goes before affixes but after the verb and loses the *-i* in casual constructions:\n\t* *Kitanarra*\n\t* *Eanarra*\n* But goes after affixes with the *-i* intact for politeness:\n\t* *Kitarranai*\n\t* *Earranai*\n* It does this with aspect too, but can lose the *n* as well:\n\t* *Urukunasaru*\n\t\t* polite\n\t* *Urukusarai*\n\t\t* direct, casual; can be affectionate/intimate (context)\n\t* *Urukunaganai*\n\t\t* if the vowel is *a*, the *n* remains\n\t* *Urukunainaga*\n\t\t* if the affix begins with *na-*, the *na-* in *nai* remains\n\n## 14.6 Modifiers\n* Primarily, *i* (attributive) and *nu* (modifier) are used for a general modifier category\n* There is no distinction of adverbs and adjectives at the base level\n* Tawa strongly prefers that adverbs be either implied or described with postpositions, particles, or tone:\n\t* *Koibwui hateru* :: `bored-ATTR run.PLATONIC.V`\n\t\t* ~\"I ran boredly / in a bored way\"\n\t* *Koibwunate hateru* :: `bored-MID.INF run.PLATONIC.V`\n\t\t* ~\"I was bored and was running\"\n\t\t* ~\"Bored, I ran\"\n* But, an explicit adverb particle *-inu*/*nu* exists\n* Root that don't end in *i*, they take *nu*, and roots that do simply take *inu*\n\t* by the way, look at that sentence in Tawa:\n\t\t* **kiwiṋrra i′oe un woui kanangu ji ni daka nu′oe, kiwiṋ no ji ni inu′oe**\n\t\t* `continue-REVS-NEG i-N.ACC INSTR QUOT3-ATTR word-SRC.LEX LOC TOP steal nu-N.ACC continue-REVS NMZ LOC TOP inu-N.ACC`\n\t\t* lit. \"Not stop 'i' with like roots in (as for them), steal nu, stop one in (as for them) inu\"\n\t\t* ~\"Roots that don't end with 'i' take 'nu,' the ones that do end (take) 'inu\"\n\t\t\t* *′oe* added to mark direct objects and the words as nouns\n\t\t\t* *wou* would not be used because it would feel too overloaded\n\t\t\t* plus, with *′oe*, you can easily add one verb at the start and then omit the verb but mark its objects\n\t\t\t* *ji ni* and *ni* would both be fine, but *ji ni* marks a locative boundary\n\t\t\t\t* it's like saying 'specifically, (at least / contrast) inside the roots...'\n\t\t\t\t* we use another *ji ni* which is the contrast\n* Do note that natural modifiers ending in *i* just take another *i*, not a *nu*:\n\t* *dami* :: easy\n\t* *damii* :: easy (modifier)\n* But a word like *komuni* (control / own) would:\n\t* *komuni asa* :: controlling house? an owner's home?\n\t* *komuninu asa* :: the master house / the governing house\n* With gerunds:\n\t* *komunieni asa* :: the house that controls / the controlling house\n* Example:\n\t* *ukajeni asa* :: the hunting house / house used for hunting\n\t* *toukajunanu asa* :: a found home / home that was hunted\n\t\t* since *toukajunai* (be hunted/found) is not a strong modifier, we use *-nu* (*toukajunanu*)\n\t\t* note that *nai* drops the *i* in agglutination\n* Let's look at some places where *inu* might be required and might not be:\n\t* *Tomoi hateru* :: `fox.ATTR run.PLATONIC.V`\n\t\t* since *tomoi* precedes a verb *hateru*, it is clear that *tomoi* is an adverb, and therefore *-inu* is not needed\n\t\t* ~\"To run like a fox (e.g., steathily)\"\n\t* *Tomoi damii hateru* :: `fox.ATTR easy-ATTR run.PLATONIC.V`\n\t\t* not parseable\n\t\t* it has to be reordered or *tomoi* has to take *tomoinu*\n\t\t* reordering is preferable:\n\t\t\t* *damii tomoi hateru* :: `easy-ATTR fox.ATTR run.PLATONIC.V`\n\t\t\t\t* ~\"To easily run like a fox\"\n\t\t\t* here, the head-directionality is consistent:\n\t\t\t\t* *damii* describes *tomoi* which describes an explicit verb (*hateru*)\n* About unmarked verbs:\n\t* *damii daka* :: `easy-ATTR steal`\n\t\t* ~\"An easy steal\" (noun)\n\t* *damite daka* :: `easy-INF steal`\n\t\t* ~\"Easy to steal (something)\"\n\t* *daminu daka* :: `easy-ATTR-MOD steal`\n\t\t* ~\"To easily steal\"\n* But you'd still mark the verb over the adverb:\n\t* *damii dakaru* :: `easy-ATTR steal-PLATONIC.V`\n\n### 14.6.1 Why does **inu** exist\n* It's an archaic form that survived\n* It is often a repair strategy\n\t* if you begin with adjectives and get lost in the stack, a simple *inu* fixes the mess\n\t* or, if you really get confused and don't know how to handle a thought, especially when talking to someone quickly, just use an *inu*\n* It is used in poetry, especially in terms of rhymes, melody, or structure\n* It is also used in technical manuals or formal settings to kill ambiguity, like in oaths or sermons where misinterpretation can be dangerous\n\n## 14.7 Difference of **mai** and **i-ng**\n* *i-ng*, the native Tanji radical circumfix, literally means 'to prepare / make'\n* But it is different from **mai**\n* Take a look at this example:\n\t* *shiremai* :: to teach (lit. 'make know')\n\t* *ishireng* :: to prepare knowledge\n* And now this example:\n\t* *ikamung* :: cook (to make edible / to make (for) eating)\n\t* *kamumai* :: feed (to make eat)\n* **mai** is a grammatical causative, and **i-ng** is more of a 'semantic' causative\n* **i-ng** refers to preparation, creation, or transformation (grammatically a factitive)\n\n## 14.8 Potentiality\n* *-tasu* adds potential\n* So:\n\t* *Kiuku* :: fly (verb)\n\t* *Kiukutasu* :: potential of flying / can fly\n\t* *Kiukai* :: to fly (normal form used for self-states)\n\t* *Kiukutasai* :: can be flied / flyable\n\t* *Kiukumai* :: to make (something/someone) fly\n\t* *Kiukunamai* :: (made/forced) to be flied\n\t* *Kiukumatasai* :: can be made to be flied\n","15 Reduplication.md":"## 15.1 Simple palatalisation rule\n- **D + i** -> **Ji**\n- **T + i** -> **Chi**\n\n## 15.2 Generalisation\n\n**Marker:** **P-** (Backup: **M-**)\n- **Kitei** -> **Kitei pitei** (Things and such)\n- **Irime** -> **Irime pirime** (Work and whatever)\n- **Pamu** -> **Pamu mamu** (Snacking/nibbling)\n\t- *p* to *m*\n\n## 15.2 Pejorative\n| **Root**      | **Reduplicated Form** | **Notes**                        |\n| ------------- | --------------------- | -------------------------------- |\n| **Kamōe**     | **Kamōe damōe**       | Food and crap!                   |\n| **Ii** (Good) | **ii jii**            | _D + i_ becomes **Jii**          |\n| **Irime**     | **Irime jirime**      | _D + i(rime)_ becomes **Jirime** |\n| **Dasi**      | **Dasi sasi**         | **S** backup                     |\n| **Taki**      | **Taki daki**         | -                                |\n* Marker: **d[ə]-** (Backup: **s[ə]-**)\n* For **i**, *j* will be used, so:\n\t* *ii jii*, *irime jirime*\n\t\t* *ii jii* is like saying 'yeah, \"good,\" sure'\n\t\t* *irime jirime* means 'work and all that bullcrap'\n* **i** is the only case where the vowel remains the same\n* So if the vowel is not **i**, like *ga*, then:\n\t* *ga da*\n\t* *ai dai*\n\t* *ainawa dainawa*\n\t* *aiu daiu*\n\t* *ba da*\n\t* *bobo dabo*\n\t* *de se*\n\n## 15.3 Examples\n| **Word Type**       | **Root** | **Generaliser (P/M)** | **Pejorative (D/S)**        |\n| ------------------- | -------- | --------------------- | --------------------------- |\n| **Standard**        | _Kanu_   | Kanu **p**anu         | Kanu **d[ə]**nu             |\n| **Vowel-Initial**   | _Ume_    | Ume **p**ume          | Ume **d[ə]**me              |\n| **High Vowel (i)**  | _Ichie_  | Ichie **p**ichie      | Ichie **j[ə]**chie (D -> J) |\n| **P-Initial**       | _Pone_   | Pone **m**one         | Pone **d[ə]**ne             |\n| **D-Initial**       | _Dako_   | Dako **p**ako         | Dako **s[ə]**ko             |\n| **T-Initial (Chi)** | _Chita_  | Chita **p**ita        | Chita **ch[ə]**ta           |\n* The schwa isn't marked, so just writing *pone dane* is fine\n* For the pejorative, both the consonant and vowel changes:\n\t* *kamu* -> *pamu* /pəmu/\n\t* *kitei* -> *patei* /pətei/\n\t* ... etc.\n\n## 15.4 Semantic pairing\n- **Kamen chihaien** (Eating + Drinking = Dining/Meals)\n\t- _Eanaite kamen chihaien._\n\t\t- ~\"We went out for dining\"\n\t\t- ~\"We went out to eat a meal\"\n- **Irimen asahaien** (Working + Residing = Lifestyle/Living)\n- **Harinaien eanaien** (Buying + Going = Running errands/Shopping)\n\n## 15.5 Glossing\n* **nouns**:\n\t* *kamōe pamōe* :: `eat-N RED:ASSOC-N`\n\t\t* ~\"Foodstuffs\"\n\t\t* ~\"Food and whatever\"\n\t* *kamōe damōe* :: `eat-N RED:PEJ-N`\n\t\t* ~\"Food and shit\"\n\t\t* ~\"Food and crap\"\n* **verbs**:\n\t* *kamu pamu* :: `eat.V RED.PLUR:ASSOC`\n\t\t* ~\"To snack mindlessly\"\n\t\t* ~\"To eat whatever\"\n\t* *kamu damu* :: `eat.V RED.PLUR:PEJ`\n\t\t* ~\"To eat whatever shit\"\n\t\t* ~\"To eat and shit\"\n\t\t* ~\"To eat whatever crap one is offered\"\n* **modifier** (same for both *nu* and *i* modifiers):\n\t* *kamoi pamoi* :: `food-ATTR RED:ASSOC-ATTR`\n\t\t* ~\"Like edible and all that\"\n\t* *kamoi damoi* :: `food-ATTR RED:PEJ-ATTR`\n\t\t* ~\"Like food and shit\"\n\t\t* ~\"Edible and all that crap\"\n* **adverbs**:\n\t* *haterui paterui* :: `run.V-ATTR RED:ASSOC.V-ATTR`\n\t\t* ~\"Like swiftly and stuff\"\n\t* *haterui daterui* :: `run.V-ATTR RED:PEJ.V-ATTR`\n\t\t* ~\"Like fast and shit\"\n\n## 15.6 Whole-root reduplication\n* Whole-root reduplication softens and thins words (reducing intensity, not increasing it!)\n* These are often connected with hyphens\n* For infinitive words (e.g., *honte* (for a person / to personify)), doubling them makes it 'intermittent:'\n\t* *Wanōte-wanō* :: hour to hour / time to time / sometimes\n\t* *Honte-hon* :: some people / people here and there\n\t* *Kiteite-kitei* :: some things here, some things there\n* For question words, it asks for lists:\n\t* *Otōe-otōe* :: what items / list of things\n\t* *Otoji-otoji* :: which different places\n\t* *Otowanō-otowanō* :: at which times\n\t* *Ochi-ochi* :: which (kinds of) things\n* With adjectives, it intensifies them, but this is very 'cute' (feminine) and not formal:\n\t* *Damii-damii* :: really easy\n\t* *Retei-retei* :: really cold\n\t* *Nashitai-nashitai* :: piping hot\n* Doubling locations means 'every single one:'\n\t* *Asa-asa* :: house to house / every house\n\t* *Gai-gai* :: side to side / every side\n* Doubling regular roots makes them exclusive:\n\t* *Onokoi-onokoi* :: only friends / restricted to friends\n\t* *Chi-chi* :: nothing but water / all water\n\t* *Fofu-fofu* :: nothing but (to) speak / blabber\n\t\t* e.g., *fofo-fofo, riwakangorra* (all talk (but) no brain - speaking to sound smart when one really is dumb)\n* Rule of thumb:\n\t* **is it a question?** then it means '(what) all?'\n\t\t* *ochi-ochi yo?* :: which (kinds of) things?\n\t\t* *otōe-otōe ue yo?* :: is it something?\n\t\t\t* note that this still literally means '(what) all is it?' but is like saying 'anything up?' / 'something up?'\n\t\t\t* often times, reduplication for question words often blurs the lines between something/anything/everything\n\t\t\t* for example:\n\t\t\t\t* *kitei ni otōe-otōe ue yo?* :: what things / what list of things / what are all the things (there)?\n\t\t\t\t* it can't ever mean 'what are some of the things there'\n\t\t\t\t* for that, you would say:\n\t\t\t\t\t* *Myimg kitei ni otōe-otōe ue yo?*\n\t\t\t\t\t* lit. \"As for some things, what is the list?\"\n\t\t\t\t\t* ~\"What are some of the things there\"\n\t\t\t* it has to be interpreted based on context\n\t\t\t* so it technically always means '(what/X) all,' even in *otōe-otōe ue yo?* (lit. what is all of it?), but socially, it's better to translate it as 'anything going on?'\n\t* **is it a description?** then it means 'extra'\n\t\t* *waoii-waoii kantei* :: the food is so delicious\n\t* **is it a location?** then it means 'everywhere'\n\t\t* *asa-asa* :: every house\n\t* **is it an infinitive?** then it means 'bits and pieces'\n\t\t* *asate-asa* :: some homes here, some there\n\t\t* *wanōte-wanō* :: time to time\n\t\t* *honte-hon* :: person to person / some people here, some there\n\t* **is it anything else?** then it means 'nothing but'\n\t\t* *onokoi-onokoi* :: only (limited to) friends\n\t\t* *chi-chi* :: nothing but water\n\t\t* *chiṋ-chiṋ* :: everything but water\n\t\t\t* when negated or reversed roots are used, it shifts to **everything but**!\n","16 Animacy and pronouns.md":"## 16.1 Root preference\n* The root usually changes depending on animacy:\n\t* *Nemurra payaennai boji hakashisun ye* :: `choice-NEG study-GER-MID AGST-LOC family-1SG.POSS BEN`\n\t\t* ~\"No choice but to study for my family\"\n\t\t\t* here, *hakashisun* likely refers to parents\n\t* *Karisun a payanamai suoe* :: `parent-1SG.POSS A study-MID.TR 1SG-N`\n\t\t* ~\"My parents made me study\"\n\t\t\t* here, *karisun* refers to parents\n\t\t\t* but since *kari* is also a transitive, active verb and animate noun, it must be used\n\t\t\t* saying *hakashi a* would refer to something your family (including siblings and even cousins depending on interpretation or context) decided to do\n\n### 16.1.1 Natural constructions\n* If you said:\n\t* *Irimen kama ji* :: working on the moon\n* ... it would sound very weird and off\n* If you're an astronomer working on the moon (English way of phrasing it), your job isn't 'the moon'\n* *irime* (job/work) is a human-centric word, about human jobs, like a desk job or being a waitress\n* The moon is not a job nor a chore\n\t* rather, the moon is beauty that is studied, as the moon is the reason for the stability and complexity of life we are lucky enough to experience\n\t* studying the moon is just one way of connecting with nature\n* For this, you use a neutral word like 'paya' (study):\n\t* *Payaen kamaoe* :: studying the moon\n\n## 16.2 Pronoun preference\n* *wu* is the only inanimate pronoun in Koyeah Tawa\n\t* it isn't nice to say *chiwun* if you don't know someone's gender\n\t* instead, you use *so* (3SG.M) until you learn their sex\n* *wu* also can't be used for any living thing:\n\t* for nature, you use *sa* (3SG.F), unless you know the animal's sex\n\t\t* ungendered organisms like plants are always *sa*\n\t* using *wu/wun* for living things like birds or plants is an insult to nature, which is a severe, extreme taboo\n\t* *wu* refers to things humans have made artificially, like a plastic water bottle\n\t\t* for things that humans didn't make, like mountains, *wumei* or *sa* is still used\n\t\t* if the mountain has significance or isn't neutral (e.g., 'just a random mountain'), you use *sa*\n\t\t* if you're talking about a random rock on the street, you use *wumei*\n\n### 16.2.1 *mei* exception\n* *wu* is innately inanimate (`3SG.INAN`)\n* So when you make it animate *wumei* (`3SG-AN`), it doesn't actually refer to any animate being\n* It refers to objects that have had 'nature's' spark in them\n* A rock was not crafted by man, it was crafted by her (i.e., nature)\n* This is also why *wumei* is used for random, everyday, natural objects, like rocks, but *sa* is used for exalted or revered mountains\n\n## 16.3 Pronoun system\n| Pronoun | Animacy                         | Gloss                  |\n| ------- | ------------------------------- | ---------------------- |\n| *su*    | **animate**                     | **1.SG.AN**            |\n| *sa*    | **unspecified**                 | **3.SG.F**             |\n| *so*    | **animate**                     | **3.SG.M.AN**          |\n| *zu*    | **animate**                     | **2.SG.AN**            |\n| *za*    | **animate**                     | **2.PL.AN**            |\n| *na*    | **animate**                     | **1.PL.AN**            |\n| *wu*    | **inanimate**                   | **3.SG.INAN**          |\n| *wumei* | **natural non-human inanimate** | **3.SG.INAN.NAT.NHUM** |\n| *amu*   | -                               | **ULT.SG.DEF**         |\n* Which pronoun would be used depending on type:\n\t* **artificial inanimate**\n\t\t* *wu* is used\n\t\t\t* plastic water bottles, an aeroplane, or a train\n\t* **natural inanimate**\n\t\t* *wumei* is used\n\t\t\t* a random rock, dust, dirt\n\t* **natural animate & inanimate**\n\t\t* *sa* is used for **natural animate**\n\t\t\t* birds, plants, any living thing\n\t\t* but it also used for specific types of **natural inanimate**\n\t\t\t* great mountains, stars, planets, the Earth's dirt and natural materials, oceans, water\n\t\t\t* gold, silver, diamonds\n\t\t\t* the sun and moon\n\t* **human (animate)**\n\t\t* *su* (me)\n\t\t* *zu* (you)\n\t\t* *za* (you all)\n\t\t* *so* (he)\n\t\t* *sa* (she)\n\t\t* *na* (we)\n\t* **unknown biological sex**\n\t\t* *so* is used generally until the biological sex of the person is learnt\n\t\t* or a demonstrative pair is used:\n\t\t\t* *lyo hon* :: that person (far from us both)\n\t\t\t* *ryo hon* :: this person (near us both)\n\t\t\t* *byo hon* :: this person here (near me)\n\t\t* you may also just refer to them by name\n\t\t\t* *Aiuiku* :: Aiu\n\n### 16.3.1 *sa* vs. *wumei*\n* *wumei* is used for random, everyday inanimate natural objects\n* If a rock fell on you, you'd use *wumei*, because:\n\t* a random rock is not significant, especially not to you in such a circumstance\n* But for Mt. Fuji and Everest, you'd use *sa*, because:\n\t* they're beautiful scenic creations of nature\n\t* they **are** significant and revered\n* *sa* is also used for other natural creations which are vital directly to or in supporting life:\n\t* water, dirt, and other resources\n* Use *wunmei* for the possessive variant\n\n## 16.4 Figurativeness\n* *ku* is used for figurative roots:\n\t* *dekumg* :: to get (figuratively)\n* *gu* is used for literal roots:\n\t* *degumg* :: to get (literally, as in 'receive')\n\t\t* often a sexual euphemism: *reodegumg* ((I) will physically/literally get (you))\n\n## 16.5 Third person pronoun\n* Tawa does not have a generic 'it'\n* *wumei* refers to inanimate things like 'rocks,' often to express annoyance (it hit me (that rock)!) or simple insignificance without being insulting or derogatory\n* *wu* refers to artificial human-made things\n* *sa* refers to female humans but also nature around us, but it also refers to inanimate but significant things like beautiful mountains\n* So, you don't say:\n\t* 'it is raining,'\n* you say:\n\t* 'rain happens' / 'raining (is)'\n* You also use demonstratives since there is no dummy pronoun:\n\t* *Ryo ni ii ue* (~this is good)\n\t\t* somewhat like saying ~\"it's good\"\n\n## 16.6 Assuming intent\n* Usually, you say:\n\t* *Na o aen chioe hahana dan* :: `1.PL U HAVE.GER water-N INTENS~hill ABL`\n\t\t* lit. \"We experience having water from mountain\"\n\t\t* ~\"We are given water from the mountain\"\n* Because saying:\n\t* *Hahana a demgen chioe na ji* :: `INTENS~hill A REC-G.REVS-GER water-N 1.PL LOC`\n\t\t* ~\"The mountain gives us water\"\n* ... would be assuming the intent of the mountain\n* The mountain does not know she's keeping you alive, God just made her beauty in that way\n\t* the mountain gives water to fulfil her true nature, to exist as she is, and does so without seeking approval or human appreciation\n* For the lesser sacred or significant, such as man-made creations (e.g., the internet), you may use *ni* or less intent-focused particles (*ga*):\n\t* *Yada, genrwankuta ni fofu su ji!* :: well, the internet told me!\n\t\t* or *genrwankuta ga fofu su ji*\n* Even for *wumeibu* objects, like rocks, you can assume intent, since they are not significant\n* For a mountain, though? **Never**\n* You also shouldn't say:\n\t* *Sa ni naiwai ue* :: she is happy\n* You say:\n\t* *Sa a naiwa inai* :: she is being happy\n* Here's the difference:\n\t* *inai* is like 'exists / being'\n\t* so *naiwa inai* is like saying 'happiness exists'\n\t* framing her as an actor *sa a* creates a **dangling clause**\n\t\t* see **13:13.15** for more information on what a dangling clause in Tawa is\n\t* this is like saying: 'she's acting like she's happy,' or 'she looks like she's being happy'\n* If you said that 'she is happy,' you'd sound like a doctor assessing his patient:\n\t* *So ga iuki zhi byo*\n\t\t* ~he is now sane\n* Or like someone who's judging or objectifying someone\n* Or worse, 'studying,' maybe even 'stalking' them\n\n### 16.6.1 Significance hierarchy\n* Your house would be *wumei* to you, but probably *wu* to someone else\n* But a mountain would be universally *sa*\n* But chemicals like propofol or atropine are *wumei*, even if some of them (e.g., propofol) are purely synthetic\n* This is why:\n\t* the synthesis of **propofol** was always possible, since it was written by God\n\t* one just 'discovers' it\n\t* so, chemical syntheses and reactions are never artificial (that would be very degrading and highly arrogant)\n\t* since it was not for man to 'create' a synthesis, it was just for man to 'discover' it\n* So:\n\t* a **robot** is *wu* but may be *wumei* to his creator (he thinks it is significant)\n\t* **propofol** will be *wumei* to everyone\n\t* so will **atropine**\n\t* but **atropa belladonna** will likely be *sa* because of her beauty and significance\n* This is how artificiality is classified:\n\t* a house was always buildable, but there was no Law from God on how to build one\n\t* a victorian-style window is completely man-made\n\t* the paint and floor plans are also man-made\n* But what about plastics?\n\t* the plastic molecule remains *wumei*\n\t* but when it is used in inventions like the bottle, it becomes *wu* again, because the molecule's significance becomes secondary to the man-made creation\n* And what about phones?\n\t* is a phone essential, like a home? no\n\t* is it significant to you? not inherently to you, but it might be significant to your life\n\t\t* conclusion: it is categorically, immutably **wu**\n* And if you use *wumei* for phone:\n\t* it's like referring to CPR as 'she' in English\n\t\t* 'she saved me!'\n\t* it can be cringe and sound like you're overpersonifying like in English\n\t\t* in Tawa, this can be called 'supersignifying'\n\n## 16.7 The God pronoun\n* To reference God, the *amu* (`ULT.SG.DEF`) pronoun is used\n* It can never be applied to human categories, so:\n\t* *amu a/o/ni/ga...*\n* ... cannot be used\n* If you want to say 'God is One,' you say:\n\t* *Wan no o Amu* :: `one NMZ U ULT.SG.DEF`\n\t\t* ~\"Oneness experiences God / God is One\"\n* In standard grammar, this wouldn't work or would be entirely rephrased\n* But for God (*amu*, *jamu*), the grammar changes a lot\n* You may also say:\n\t* *Wani Jamu(iku)...* :: `one-ATTR one.god-(HON)`\n\t\t* ~\"The One God...\"\n* ... like in this sentence:\n\t* *Na o makueni nuko, Wani Jamuiku momg* :: `1.PL U cry-GER-ATTR heart one-ATTR one.god-HON SEQ-G.REVS`\n\t\t* ~\"We have crying hearts because of The One and Only God\"\n\t\t\t* note: *makueni* makes it so that the gerundive *makuen* (crying) modifies *nuko* (heart)\n\t\t\t* if you said *makui nuko*, it would be like saying 'hearts that cry / teary hearts'\n\t\t\t* it would not express a concrete action 'sobbing / wailing,' which *makuen* does\n* Note that you can't say *Wani Amu* or *Amuiku,* since *amu* **is** a pronoun\n\n## 16.8 On **oto**\n* *oto* combines with roots to yield 'question' words:\n\t* *otohon* :: who\n\t* *ototan* :: why\n\t* *otoji* :: where\n\t\t* sometimes *otodan* (from where / what source) may be used\n\t* *otowanō* :: when\n\t* *otoun* :: how\n\t* *otōe* :: what (casual/modern form of *fuyu*)\n* For example:\n\t* *Otohon a fu ryōe no?* :: who did this\n\t* *Ototan ue no?* :: why is that? / why?\n\t\t* a softer form is *otoun ue yo?* (\"could it be that way?\")\n\t\t* for example:\n\t\t\t* *So a iuki, otoun ue yo?*\n\t\t\t\t* ~\"He's seems sound/fine. (Do you) think that it could be that way?\"\n\t\t\t\t\t* but more properly, it's like asking:\n\t\t\t\t\t\t* ~\"he seems sound/fine, is that right?\"\n\t\t\t\t\t\t* it **almost always** hints at explanation, just more softly\n\t\t\t\t\t\t* so the person would say 'yeah, I think he is, because...'\n\t* *Ototan yaranai no?* :: why (did you) come?\n\t\t* topic here was omitted (*ototan ni*)\n\t\t* you almost always would omit the topic\n\t\t* including the topic can sound rude, condescending, or even authoritative, especially if you're talking to a friend\n\t\t* to your boss, saying *ototan yaranai no?* would be very rude, so you'd say:\n\t\t\t* *Rri ue no?* :: `AFFIRM COP.POL Q`\n\t\t\t\t* ~\"(Is) it true?\"\n\t\t\t\t* ~\"Really?\"\n\t\t* but *rri ue no?* is like saying 'what is it? / what's up? / why are you here' in a very respectful way\n\t\t* it doesn't literally mean 'is it affirmed?'\n\t* *Otoun yaranai no?* :: how (did you) come?\n\t* *Chi ni otoji ue no?* :: where is the water?\n\t* *Fofen otōe no?* :: (you) are saying what?\n\t* *Ototan zu a kamen no?* :: why are you eating?\n* But it is also used as a general filler or interjection of sorts:\n\t* *Otoun...?* :: how come? / I don't understand\n\t* *Oto...?* :: huh? / what?\n\t* *Oto!!* :: that makes no sense / I'm confused\n\t* *Oto ya* :: I'm confused, you know\n\t* *Oto ana* :: (Sorry), I don't understand\n\t* *Oto.* :: I guess / I think / maybe\n\t* *Otoooo* :: what?? / why?? / come on!\n* Examples:\n\t* *Wanōte eanaite makebasun, oto...* :: `time-INF MOV-MID-INF room-1SG.POSS INTERJ`\n\t\t* ~\"Time to go to my room, I guess\"\n\t\t* ~\"It's about time I head to my room, I guess\"\n\t* *Be, reoeanaite makeba, oto...* :: `PROX IPFV-MOV-MID-INF room INTERJ`\n\t\t* ~\"I'll soon go to my room, (oh well)\"\n\t\t\t* better to use *bebu* (soon-ish / around imminently)\n\t\t\t* *bebu eanaite makeba, oto...*\n\t\t\t\t* sounds more natural\n\t\t\t\t* it's like saying 'it is about time I head to my room, I guess'\n\t* *Oto...? Ryo ga imahwangi uerra no?* :: `INTERJ DEM.MED NOM MAKE-ill-MAKE-ATTR COP.POL-NEG Q`\n\t\t* lit. \"What? This ill-making-y is not?\"\n\t\t* ~\"Huh...? Doesn't that make you ill?\"\n* With the *yo* interrogative (often used for turning something nominalised with *no* into a question), it acts as a softener:\n\t* *Oto yo?* :: `INTERJ Q2`\n\t\t* ~\"You know?\"\n\t\t* ~\"Could it be?\"\n\t\t* ~\"Do you think?\"\n\t\t* ~\"Huh, really?\"\n* With *ng* and depending on tone (e.g., intonation), it can function like this:\n\t* flat tone / sentence-ending tone\n\t\t* *Oto ng* :: `INTERJ SFP.DECL`\n\t\t\t* ~\"Huh. Weird.\"\n\t\t\t* ~\"Oh well.\"\n\t\t\t* ~\"Anyway.\"\n\t* interrogative tone\n\t\t* *Oto ng*\n\t\t\t* ~\"(Oh), is that so?\"\n\t\t\t* ~\"Really? (Weird)\"\n\t\t\t* ~\"Should I do it?\"\n\t\t\t* ~\"Is it okay?\"\n\t\t\t* ~\"Is this fine?\"\n\t\t\t* ~\"Are you sure\"\n\t* stern tone\n\t\t* *Oto ng*\n\t\t\t* ~\"What the Hell!\"\n\t\t\t* ~\"Huh? What!\"\n\t\t\t* ~\"Seriously, what?\"\n\t\t\t* ~\"No way (in Hell)!\"\n\t\t\t* ~\"Are you serious?!\"\n\t* confused tone / hiatus tone\n\t\t* *Oto ng*\n\t\t\t* ~\"Oh, um...\"\n\t\t\t* ~\"Umm?\"\n\t\t\t* ~\"Oh...?\"\n\t\t\t* ~\"Huh? Umm...\"\n\n## 16.9 Animacy and artificialness\n* **rei** (INAN) and **mei** (AN) are used the same as they are in Ashi Tawa\n* But, in Koyeah Tawa, there is a third one called **et(e)** (`ARTF`) which refers to unnatural or artificial inventions:\n\t* *Etegana* :: constructed language\n\t* *Etainawa* :: fake smile\n\t* *Etenki* :: fake friend\n\t* *Etase* :: artificial joy\n* It differs from *rwanka-* (electric/electronic) in that it marks something as innately constructed, made, created, fake, or unnatural:\n\t* *Rwankahon* :: cyborg\n\t\t* there still is humanity\n\t* *Etehon* :: robot / artificial intelligence\n\t\t* it is devoid of soul\n* Same for 'electric' languages vs. constructed languages:\n\t* *Rwankagana* :: electric language\n\t\t* could refer to the slang or register used on the internet vs. in real life\n\t* *Etegana* :: constructed language\n\t\t* it was made intentionally\n\n## 16.10 Nominal forms\n* These forms are the ones you'll hear in 90% of conversation:\n\t* *sano* :: `3SG.F.POL`\n\t* *sono* :: `3SG.M.AN.POL`\n\t* *zuno* :: `2SG.AN.POL`\n\t* *zano* :: `2PL.AN.POL`\n\t* *nano* :: `1PL.AN.POL`\n\t* they are also pronounced without the lax/peripheral vowels, and /u/, /o/, /a/ normally, unlike the possessives\n* For *amu* and *wumei*, there is no polite form\n* The *wuno* form (`3SG.INAN.POL`) is often sarcastically used; you'd just say *wu* for most things\n* For *su*:\n\t* *su* with friends is fine and it is quite masculine or 'tough'\n\t* *suno* is used with respected people, like family, elders, bosses, etc.\n* There are no polite possessor suffixes\n* When you don't use the polite form, you essentially distance yourself from the referent\n* It's a middle-ground between the vulgar *-rei* forms, like *sorei*, and the polite forms like *sono*\n* So, it's more common for a speaker to say:\n\t* *Sa a esaceru ngopōe* :: `3SG.F A twist-PLATONIC.V intestine-N.ACC`\n\t\t* lit. \"She twisted the intestines\"\n\t\t* ~\"She gutted me\"\n* ... because there's nothing 'polite' about that\n* You can't also use *sano* to be sarcastic, because it would be unable to convey the heartbreak or betrayal\n* *Sano a esaceru ngopōe* would be saying 'she gutted me, politely,' but it instantly becomes less serious and actually more jarring (due to *esace*, an extreme word)\n* But polite forms likely won't be used in things such as manuals, grammar explanations, technical documents, law, etc. (since they are meant to be detached)\n* With friends, impolite forms **could be** okay but it would depend on the friendship and how the people are comfortable with impoliteness or curses\n* In Tawa, it is generally uncomfortable to be very impolite with friends\n\t* so, it's fine to use casual/direct particles, but it isn't usually fine to use impolite pronouns like *sa* (directly)\n* With loved ones, including romantic partners, you would never use direct forms\n\n### 16.10.1 Nuance\n* If you say:\n\t* *Suno a shirenai wou zuno a shirenai wou su a shirenai*\n\t* `1SG.POL A know-MID QUOT3 2SG.POL A know-MID QUOT3 1SG A know-MID`\n\t* ~\"I (polite) know- this, you (polite) know- this, I know\"\n* Then it actually carries this nuance:\n\t* ~\"You think I'm so oblivious and clueless and polite, but, no, I know that you know that I know\"\n* This is because *suno a shirenai wou* is the 'knowing' of *zuno* (you)\n* When used this way, it makes it feel like that *zuno* believes that me (as *suno*) is very polite or oblivious, depending on context\n* When you establish yourself as *su* later (tough/masculine), it carries that tone\n","17 Anaphoric reference.md":"## 17.1 Anaphoric reference\n* NSKT is simple and easy, but this topic is, no doubt, quite complex\n* In Tawa, a particle *ei* exists to refer to the latest or most relevant proposition:\n\t* *Kita nigōe* :: I like cats\n\t* *Ei wa* :: Me too / I also like cats\n\n## 17.2 Basics\n* Think of *ei* as a mental shortcut that expands to:\n\t* 'whatever was just said' / 'do'\n* So:\n\t* *Kopa we tein no ohira ga buronzhi* :: the alloy of copper and tin is bronze\n\t\t* note: *ohira* is the default classifier for mixture, which includes, but is not limited to:\n\t\t\t* cocktails\n\t\t\t* smoothies\n\t\t\t* alloys\n\t* *Kitarra eioe* :: (I) dislike whatever I just said\n* Without reading what I wrote below, try to guess what it means\n* Here's what it means:\n\t* I dislike bronze (which is the alloy of copper and tin)\n* If you guessed correctly, you've grokked anaphoric reference\n* Another example:\n\t* *Mo mo, sa ga korumasu, shirenai no?* :: But I think she's a murderer\n\t* *Sa no yo? Eeeeeh! Watada einq ni haki unsonan ji* :: Her? Ha! Only anything but that is true in our lives\n\t\t* lit. 'Her? Ha! Only the opposite of what you just said is true in our life'\n\n## 17.2 Anaphoric negation\n* You only need to negate the correct part of the phrase:\n\t* *Kikita nigōe!* :: (I) love cats\n\t* *(Su ni) eirra* :: I don't\n\t\t* lit. 'whatever was just said is negated for me'\n* Some examples:\n\t* *Kama no hataka ga makumatasu* :: The moon is beautiful\n\t\t* lit. 'The face of the moon can make (me) cry'\n\t\t\t* *-matasu* is used since *maku* (cry)\n\t* *Ei wa!* :: Me too!\n\t\t* lit. 'As for whatever you said, also'\n\t* *Aa kitanyu sa, sa ga iirra ue* :: Even though I love her, she isn't good for me\n\t* *Rri, eirri*\n\t\t* lit. 'Yes, as for what was just said (it is affirmable)'\n\n### 17.2.1 Practicality\n* Anaphoric reference isn't always practical, especially in fast-paced talks or debates (e.g., polemics)\n* *ei* is like a mental shortcut that expands to: **whatever I just said that was most relevant**\n* So:\n\t* *Ei ni...* :: as for whatever I just said (that was most relevant)... (X)\n\t* *Ei ga...* :: whatever I just said (that was most relevant)... (X)\n\t* *Eiǵ* :: the opposite of whatever I just said\n* ... can be very taxing for learners or even seasoned speakers when they are used a lot, especially in complex clauses\n* Also, these shortcuts are usually considered rude with strangers, so:\n\t* *fui kitarra ryo chingu no waoi, oto yo?* :: `ACT-ATTR like-NEG DEM.MED water-SRC.LEX GEN appease WH Q2`\n\t\t* ~\"Could it be that (you) really don't like the taste of this drink?\"\n\t* *Eirri* :: `ANAPH-AFFIRM`\n\t\t* this is rude, impolite, and immature\n\t\t* it can also be severely hurtful, as the speaker used *oto yo?*, which is an extremely polite softener\n\t\t* it is better to say:\n\t\t\t* *Rra, tanoe uerra. watada... mha amgchi, ngopo o nukunai.*\n\t\t\t\t* `NEG reason-N COP.POL-NEG | ONLY PRF FULL-water intestine U heart.PLAT.V-MID`\n\t\t\t\t* ~\"No, (that) isn't the reason. I just feel like my insides are already full of water\"\n\t\t\t\t\t* copular negation is better than directly negating *tanoe* (reason)\n\t\t\t\t\t* if you said *tanoerra*, it would sound less polite, and more like a 'you're wrong'\n\t\t\t\t\t* when you say *tanoe uerra*, you're essentially saying 'the reason doesn't exist'\n\t\t\t\t\t* it may feel grammatically off but it is more of an idiomatic shortcut\n\t\t\t\t\t* secondly, using *ngopo o nukunai* softens the reason, since it is the intestines (your gut) that is 'full of water'\n\t\t\t\t\t* here, *amgchi* (full of water) means that you're fully satiated or that you don't want to drink anymore\n\t\t\t\t\t* it has a slight 'I feel like I drank too much' feeling (depending on tone and context, of course!)\n\t\t\t\t\t* it describes the feeling when one drinks **too much water** or when one doesn't feel like drinking anything\n\t\t\t\t\t* of course, if you were actually sick, you'd say:\n\t\t\t\t\t\t* *ochi a, ngopo o aishinai, wou yoe!*\n\t\t\t\t\t\t\t* ~\"The bloating is really hurting my intestines!\"\n\t\t\t\t\t\t\t* *wou yoe!* is what adds the expression of unexpected pain\n\n## 17.3 NSKT rules\n* *ei* means '[that] proposition'\n* *eirra* just means '(as for X) [that] proposition is not true (negated)'\n\t* *Su a kikita nigōe* :: I like cats\n\t* *Eirra* :: I don't\n\t\t* though *su ni eirra* (as for me, [that] proposition is negated) is the full form, you often drop what is understood from context\n\t\t* if you wanted to say 'I don't think that you do,' you would say:\n\t\t\t* *zu ni eirra, riwakanai* :: to me, it seems that you (actually) don't\n\t\t\t* remember that it creates an 'actually' nuance when you negate what was affirmed\n* *eirri* means '(as for X) [that] proposition is true (affirmed)'\n* *eimg* means 'the opposite of [that] proposition'\n\t* we use *eimg* for opposites over the old *eiṋ/einq* form\n\t* *sano ni korumashi ue yo?* :: is she a murderer?\n\t* *watada eimg ni nasu haki ue* :: only the opposite of [that] proposition is allowed to be true\n\t\t* not as serious as it sounds\n\t\t* it's like saying, 'ha! no way'\n\t\t* though you'd spice it up with the proper tones, particles, interjections, etc.\n* *ei* is different from the dummy noun *ngoe*:\n\t* *ii ngoe* :: a good (thing / matter)\n\t* e.g.,\n\t\t* *kita sanōe* :: I like her\n\t\t* *ii ngoe* :: that's a good thing\n* Often, you use **zero anaphora** and rely on context, because Tawa is pro-drop\n* So:\n\t* *sano ni korumashi ue yo?* :: is she a murderer?\n\t* *subeko no wanō hakiṋ ue* :: that could never be true\n\t\t* lit. \"For all of time, irreality is\"\n\t\t* ~\"That could never be true\"\n\t* *wa kikita nigōe yo?* :: do you love cats as well?\n\t\t* lit. 'also love cats?'\n\t* *wa!* :: I do too!\n\t\t* lit. 'also'\n","18 Interrogatives.md":"## 18.1 Universal marker *no*\n* It is used to ask questions:\n\t* *Ue* :: it is\n\t\t* *Ue no?* :: is it?\n* Casually, it is dropped in favour of a rising intonation:\n\t* *Ryo i* :: it is this\n\t\t* *Ryo?* :: this?\n* *yo* is just a more polite and sometimes more intimate particle (depending on context)\n* *no* can be casual and informal, especially in non-polar questions or questions that use any *oto(-)* particle\n* Still, you'd use *yo* for softness, politeness, and intimacy (depending on context)\n\t* so if you're talking to an elder or a boss or a stranger, *yo* is the one you need\n* For friends or non-strangers, *no* can be fine, but it depends on context\n* For nominalised questions, *no yo* is used (and it can't be harshened)\n* If you want a harsh nominalised question, end it with *ng (e)*\n\t* it creates a 'huh? / you think so? / yeah? / come on! / try me! / bite me!' tone\n\t* there is a tone on it too\n\t* with the *e* (as *ng e?*), it makes it more condescending, like saying 'bring it on, (OK?)!' but approximating it to 'bring it on' is bad\n\t* you'd never use it with a friend challenging you to a duel in, say, a game, because it would be rude and harsh\n\t* you'd say: *ake ete yaranai, lilii nigo ana!*\n\t\t* ~\"(It is) okay to come, little cat, (you know?)\"\n\t\t* ~\"Why? Are you afraid? Bring it on!\"\n\t* or even: *ake yaranai ana!*\n\t\t* ~\"Come (then)!\"\n\t\t* ~\"Come!\"\n\t\t* but it captures the 'bring it on / bite me' nuance\n* Note that you can ask a question about a topic like this:\n\t* *Sano ni no/yo?* :: who is she?\n\t\t* *yo?* would make it more polite and soft, whereas *no?* would be casual\n\t\t* also, due to the genderlectical differences, males cannot just say *sano ni?*, even though dropping question particles is a common occurrence in Tawa\n\t\t\t* this is because *ni* is also a feminine sentence-final particle and softener\n\t\t\t* men using it could be cringe and even derogatory\n\t\t* a female could say *sano ni?* though\n\t\t* this difference is covered in Ashi Tawa's grammar\n\n## 18.2 **Wh-** interrogatives\n| English | Tawa                    |\n| ------- | ----------------------- |\n| Who     | **otohon**              |\n| What    | **otōe** / **fuyu**    |\n| Where   | **otoji**               |\n| When    | **otowanō**            |\n| Why     | **ototan** / **otodan** |\n| Which   | **ochi (X)**            |\n| How     | **otoun**               |\n* These are formed with *oto*\n* *oto no* is often casually contracted as *otono*\n\n### 18.2.1 Polar\n* Statement + no?\n\t* *Kamu no?*\n\t\t* ~\"Will you eat?\"\n\n### 18.2.2 Content questions\n* The question word goes exactly where your answer would sit\n\t* *Nama ni otōe ue no?*\n\t\t* ~\"What is your name?\"\n\n### 18.2.3 Choice questions\n* *oto* is added after each choice given:\n\t* *Atora ue oto, arenki ba ue oto no?*\n\t\t* ~\"Is it an apple or is it just another sweet fruit?\"\n\t\t* note: you'd write *otono?* casually (contraction)\n* or *ato* is used:\n\t* *Atora ue ato arenki ba no?*\n\t\t* ~\"Is it an apple or is it just another sweet fruit?\"\n* Difference between *oto* and *ato*:\n\t* *ato* is a literal 'or' and gives you choices\n\t* it is used in formal contexts, like sermons, speeches, or examinations\n\n### 18.2.4 Explanatory questions\n* To seek an explanation, you use *ue ototan no?*\n* Note that *ototan no* is almost always as *ototano*\n\t* *Makuen ototan no?*\n\t\t* ~\"Why are (you) crying?\"\n\t\t* ~\"For what reason are you crying?\"\n* You usually use *otoun* to ask the 'how:'\n\t* *Otoun makuen ototan yo?*\n\t\t* ~\"Why is it that you are crying?\"\n\t\t* *yo* is much softer as an interrogative than *no*\n\n### 18.2.5 Rhetorical & softened questions\n* Questions can be used to make suggestions or show doubt\n* *yo* is used for this\n\t* *Eanarra yo?*\n\t\t* ~\"Won't you go?\"\n\t\t* ~\"Let's go\"\n* *oto* + pronominal + *yo/no* for doubt\n* mostly *yo* is used; *no* is often rude in these constructions, unless addressing yourself\n\t* *Reosoramanai, otsu no?*\n\t\t* ~\"I'm so silly, I don't even know if it will rain or not\"\n\t* *Reosoramanai otsu yo?*\n\t\t* ~\"I'm unsure if it will rain\"\n\t\t* ~\"I wonder if it will rain\"\n\t* *Reosoramanai, odzu yo?*\n\t\t* ~\"Do you wonder if it will rain?\"\n\t\t* ~\"Do you think that it will rain?\"\n\t\t* ~\"Do you doubt it will rain?\"\n\t* *Reosoramanai otona yo?*\n\t\t* ~\"Do we think that it is going to rain?\"\n\t* *Fui reosoramanai odza ya no!?*\n\t\t* ~\"Do all of you (idiots) genuinely think it is going to rain?\"\n\t\t\t* you might say this if it's sunny outside!\n* Here's a playful example:\n\t* *Atora ni otoun mafi odzu yo?* :: `apple TOP WH-INSTR red.ATTR WH.2SG Q2`\n\t\t* ~\"Why do you think that apples are red?\"\n\t\t\t* it feels like a playful invitation to a riddle\n\t\t\t* *odzu yo?* is quite soft\n* If you said:\n\t* *Atora ni otoun mafi odzu no?*\n\t\t* ~\"Idiot, why are apples red then?\"\n\t\t* ~\"Do you seriously believe apples are red?\"\n* Which isn't very playful after all!\n\n#### 18.2.5.1 Pronominal questions\n* Use the format:\n\t* `oto + Q.pron + postp.`\n* ... for directing a question with doubt\n* For example:\n\t* *Eanai odzu-ji yo?* :: `MOV-MID WH.2SG-LOC Q.POL`\n\t\t* lit. \"Being gone you in?\"\n\t\t* ~\"Aren't you wondering where we're headed?\"\n\t\t* ~\"Do you want to guess where we're going?\"\n\t\t* ~\"I bet you don't know where we're going!\"\n\t\t\t* depending on tone, particles, etc., that base statement yields a lot\n\t* *Eanai otona-ji yo?*\n\t\t* ~\"Where do we want to go?\"\n\t\t* ~\"Where do we think that we will be going\"\n\t* *Eanai otsu-ji yo?*\n\t\t* ~\"I wonder where I'm going...\"\n\t* *Eanai odza-ji yo?*\n\t\t* ~\"Do all of you doubt where we are going?\"\n* With *no*, it would be harshened:\n\t* *Eanai odza-ji no?!*\n\t\t* ~\"Do all of you even know where we are going?\"\n\t\t* ~\"Do you all have any idea where we are headed?\"\n\t\t\t* something a teacher might say to kids goofing around during a trip to a factory\n\n## 18.3 Extended uses\n* See **16:16.8** until the end of **16.8**; it covers all the uses of *oto* and nuances\n\n## 18.4 Asking different types of questions\n* Method\n\t* *Otounte eanarra yo?* :: `WH-INSTR-INF MOV-MID.NEG Q2`\n\t\t* ~\"How do I get there?\"\n* State/opinion\n\t* *Kanteisan ni otoun ue yo?* :: `food.N.PAT-3SG.F.POSS TOP WH-INSTR COP.POL Q2`\n\t\t* ~\"How was her food?\"\n\t\t* a very polite construction\n* Quantity\n\t* Price: *Otomani ue yo?* :: `WH-money COP.POL Q2`\n\t\t* ~\"How much is it?\"\n\t\t* ~\"What's the price\"\n\t* Number: *Otomyo subi ue yo?* :: `WH-MANY desire.ATTR COP.POL Q2`\n\t\t* lit. \"How much is desired (as for you)?\"\n\t\t* ~\"How much do you want?\"\n\t\t* ~\"How many do you want?\"\n\t* Specific time: *otowanō-ji ue yo?* :: `WH-time-LOC COP.POL Q2`\n\t\t* ~\"What hour/minute is it?\"\n\t\t* tip:\n\t\t\t* *otosejou* for hours (lit. 'which sixty')\n\t\t\t* *otomi* for minutes (lit. 'which fifth')\n\t\t\t* *otosu* for seconds (lit. 'which first')\n\t\t\t* for maximum specificity, add *-ji*:\n\t\t\t\t* e.g., *otosejou-ji i no?!* (exactly which hour is it?)\n\t\t\t\t* here, the *no* paired with the direct *i* copular adds more of a 'tell me!' or 'what do you think, huh?' tone\n\t\t\t\t* if a mother caught her son awake, this would be something she'd say\n\t* General time: *otowanō ue yo?* :: `WH-time COP.POL Q2`\n\t\t* ~\"What hour is it?\"\n\t\t* tip:\n\t\t\t* specific time uses *otowanō-ji*\n\t\t\t* general time simply uses *otowanō*\n\t\t\t* spelt with a hyphen because these have been lexicalised that way, even though they are postpositional phrases\n* Identification\n\t* What kind: *Kita otobu kanteioe yo?* :: `like WH-PROP food.N.PAT-N.ACC Q2`\n\t\t* ~\"What kind of food do you prefer?\"\n\t* What happened / was done: *Otofunai yo?* :: `WH-ACT-MID Q2`\n\t\t* lit. \"What was done?\"\n\t\t* you'd say it to a friend who was sad\n\t* What did (someone) do: *Otofu yo?* :: `WH-ACT Q2`\n\t\t* lit. \"What happened / what did (one) do?\"\n\t\t* if your friend told you that someone ate raw chicken for challenge, you'd exclaim:\n\t\t\t* *otofu no?!*\n\t\t* meaning, 'what the hell (he really did that)?!'\n\t* What is (it): *Ryo no ni otōe ue yo?* :: `DEM.MED NMZ TOP WH-N.ACC COP.POL Q2`\n\t\t* ~\"What is this (thing)?\"\n* Meanings, definitions, etc.\n\t* How to (do X): *'Chiken' ni otounte fofu Tawa un yo?* :: `chicken TOP WH-INSTR-INF speak.PLATONIC.V tawa INSTR Q2`\n\t\t* ~\"How do (I) say chicken in Tawa?\"\n\t* What does it mean: *Omoko wou ni otounte shirenai yo?* :: `chicken QUOT3 TOP WH-INSTR-INF know-MID Q2`\n\t\t* lit. \"As for 'omoko,' how to understand (it)?\"\n\t\t* ~\"What does 'omoko' mean?\"\n\t\t* this is a highly polite construction\n\t\t* casually, you'd say:\n\t\t\t* *omoko wou ni haki otōe no?*\n\t\t\t* lit. \"As for 'omoko,' its really what?\"\n\t\t\t* ~\"What is 'omoko' in reality\"\n\t\t\t\t* you could soften it and/or make it polite with the appropriate particles\n* Here is an example of something you'd hear in conversation:\n\t* *Yoiirekai ue yo?* :: `spirit<good-inner> COP.POL Q2`\n\t\t* lit. 'The good inner spirit is?'\n\t\t* ~\"How are you?\"\n\t\t* ~\"Are you in good spirits?\"\n\t\t\t* it would be very sarcastic to someone obviously sad\n\t\t\t* when you don't want to assume state and want to be respectful, you would be indirect:\n\t\t\t\t* *Riwakaen otōe yo?* :: `think-GER WH-N.ACC Q2`\n\t\t\t\t* ~\"What are you thinking about?\"\n\t\t\t* though, the more preferable one would be:\n\t\t\t\t* *Ng no ue yo?* :: `DUM NMZ COP.POL Q2`\n\t\t\t\t* lit. \"A thing is?\"\n\t\t\t\t* ~\"Is a thing there? / what's going on?\"\n\t\t\t* or, with people you're closer to (not strangers):\n\t\t\t\t* *Otōe-otōe ue yo?* :: `DUM NMZ COP.POL Q2`\n\t\t\t\t* lit. \"What-what is?\"\n\t\t\t\t* ~\"(Is it) something?\"\n\t\t\t\t\t* though it just means 'some what is?' or 'is it something?' literally, in Tawa, this is like the English 'what's up'\n\t\t\t\t\t* remember that this version is soft (friends and family) and intimate if used with a romantic partner (context disambiguates everything in the end!)\n* The simple question words just go at the start or at the appropriate place:\n\t* *Kamu otoji-un yo?* :: where will we be eating?\n\t* *Eanate otoji yo?* :: where will we be going?\n\t* *Haterute otoji yo?* :: where will we be running to?\n\t\t* note that the infinitive form (*-te*) is used instead of *ji* for questions like this\n\t\t* so, *hateru otoji-ji yo?* is less preferable over *haterute otoji yo?*\n\t\t* this rule usually only applies to *otoji*, not other question particles\n\t* *Ochi no ue yo?* :: which (one/thing) is it?\n\t* *Nemu otōe yo?* :: what should I choose?\n\t* *Otowanō, eanai* :: when are we going?\n\t\t* *wanō* (and *wanō*-words) and other time words like *ko* don't require *zhi*\n\t* *Ototan ryo ga iuki nemuoe ue yo?* :: why is this the (most) sound choice?\n\t* *Ototan ue yo?* :: why is it? / (why) is that (so)?\n\t* *Ototante nemu genryōe no yo?* :: how do I choose between these things? / by what way do I choose through these things\n\t\t* can sound formal\n"}; 

        const navList = document.getElementById('nav-list');
        const contentArea = document.getElementById('doc-content');
        const searchInput = document.getElementById('search');

        function cleanName(name) {
            return name.replace(/^\d+\s*/, '').replace('.md', '').replace(/-/g, ' ');
        }

        function renderDoc(filename, highlightTerm = null) {
            const rawContent = DOCS_DATA[filename];
            if(!rawContent) return;

            contentArea.innerHTML = marked.parse(rawContent);
            
            if (highlightTerm && highlightTerm.trim() !== "") {
                const walker = document.createTreeWalker(contentArea, NodeFilter.SHOW_TEXT, null, false);
                const nodes = [];
                while(walker.nextNode()) nodes.push(walker.currentNode);

                nodes.forEach(node => {
                    const text = node.textContent;
                    const regex = new RegExp(`(${highlightTerm})`, 'gi');
                    if(regex.test(text)) {
                        const span = document.createElement('span');
                        span.innerHTML = text.replace(regex, '<mark>$1</mark>');
                        node.parentNode.replaceChild(span, node);
                    }
                });

                const firstMark = contentArea.querySelector('mark');
                if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === filename);
            });
        }

        function handleSearch(query) {
            const term = query.toLowerCase().trim();
            navList.innerHTML = '';
            
            if (!term) {
                initDefaultSidebar();
                return;
            }

            let resultsFound = false;
            Object.keys(DOCS_DATA).forEach(filename => {
                const content = DOCS_DATA[filename];
                const chapterName = cleanName(filename);
                const lowerContent = content.toLowerCase();

                if (chapterName.toLowerCase().includes(term) || lowerContent.includes(term)) {
                    resultsFound = true;
                    const resDiv = document.createElement('div');
                    resDiv.className = 'search-result';
                    
                    let snippet = "";
                    const index = lowerContent.indexOf(term);
                    if (index !== -1) {
                        const start = Math.max(0, index - 30);
                        const end = Math.min(content.length, index + 50);
                        snippet = content.substring(start, end).trim().replace(/\n/g, ' ') + "...";
                    } else {
                        snippet = "Match in title";
                    }

                    resDiv.innerHTML = `
                        <div class="result-chapter">${chapterName}</div>
                        <div class="result-snippet">${snippet}</div>
                    `;
                    resDiv.onclick = () => renderDoc(filename, term);
                    navList.appendChild(resDiv);
                }
            });

            if (!resultsFound) {
                navList.innerHTML = '<div style="padding:1rem; opacity:0.4; font-size:0.8rem; text-align:center;">No results found ✨</div>';
            }
        }

        function initDefaultSidebar() {
            navList.innerHTML = '';
            Object.keys(DOCS_DATA).forEach((filename, index) => {
                const btn = document.createElement('div');
                btn.className = 'nav-item';
                btn.dataset.file = filename;
                btn.textContent = cleanName(filename);
                btn.onclick = () => renderDoc(filename);
                navList.appendChild(btn);
                if (index === 0 && contentArea.innerHTML === "") renderDoc(filename);
            });
        }

        searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
        initDefaultSidebar();
    </script>
</body>
</html>
