o o kamupai* :: he accidentally ate himself\n\t* *so a kamunai* :: eating is done by him (and it is his fault)\n\t* *so o kamunai* :: eating happens to him\n\t\t* here, **eating happens to him** means he is eaten\n\t\t* you can state the actor:\n\t\t\t* *sa a, so o kamunai* :: `3SG.F A 3SG.M U eat.V-MID`\n\t\t\t\t* \"He is eaten by her\"\n* *pai* is better glossed `REFL.MID`\n\n### 11.2.3 Examples\n* **ex. 1 (compare)**\n\t* *ryo ni toshirenai sa dan*\n\t\t* `DEM.MED TOP PFV-know-MID 3SG.F ABL`\n\t\t\t* lit. \"As for this, (I) know from her\"\n\t\t\t* ~\"I learnt this from her\"\n\t* *toshire ryōe sa dan*\n\t\t* `PFV-know DEM.MED-N 3SG.F ABL`\n\t\t\t* ~\"(I) learnt this from her\"\n* in the former sentence, because *toshire* (learnt) takes no direct object, the *toshirenai* (know) form is used\n* **ex. 2 (compare)**\n\t* *ryo ni toshirenaimgai sa ji*\n\t\t* `DEM.MED TOP PFV-know-MID-G.REVS.MID 3SG.F LOC`\n\t\t\t* lit. \"As for this, (I) taught to her\"\n\t\t\t* ~\"(I) taught this to her\"\n\t* *toshirenaimg ryōe sa ji*\n\t\t* `PFV-know-MID-G.REVS DEM.MED-N 3SG.F LOC`\n\t\t\t* ~\"(I) taught this to her\"\n* the preferable construction is the latter one, as it avoids the *mgai* redundancy\n\t* note: *mgai* is an irregular form formed when *nai* appears after *mg* for whatever reason\n* **ex. 3 (compare)**\n\t* *sa a kedesu sōe*\n\t\t* `3SG.F A shame 3SG.M-N`\n\t\t\t* ~\"She shamed him / made him feel ashamed\"\n\t* *sa o kedesunai*\n\t\t* `3SG.F U shame-MID`\n\t\t\t* ~\"She was ashamed / felt ashamed\"\n\n## 11.3 Promotion\n* General valency or arguments can be promoted with *naimg*:\n\t* *Shirenaimg* :: teach (`know-MID-G.REVS`)\n\t\t* *Shirenaimgai sa ji* :: `know-MID-G.REVS 3SG.F LOC`\n\t\t\t* ~\"I taught (something) to her\"\n\t\t\t\t* the object is omitted\n\t* *Kanatanaimg* :: happy with / make happy (`happy-MID-G.REVS`)\n\t\t* *Asasun a kanatanaimg* :: `house-1SG.POSS A happy-MID-G.REVS`\n\t\t\t* ~\"My house makes (me) happy\"\n\t\t* *Sa a kanatanaimgai* :: `3SG.F A happy-MID-G.REVS.MID`\n\t\t\t* ~\"She is cheered up / made happy\"\n","12 Numbering system.md":"## 12.1 The ten numbers\n| Number   | IPA            | Gloss     | English number       |\n| -------- | -------------- | --------- | -------------------- |\n| **na**   | `na`           | `0`       | zero                 |\n| **su**   | `su`           | `1`       | one                  |\n| **zu**   | `zu`           | `2`       | two                  |\n| **wu**   | `wu`           | `3`       | three                |\n| **′iyo** | `ʔijo`         | `4`       | four                 |\n| **mi**   | `mi`           | `5`       | five                 |\n| **se**   | `se`           | `6`       | six                  |\n| **ki**   | `ki~ci̥`       | `7`       | seven                |\n| **rre**  | `(ɾ,r)e`       | `8`       | eight                |\n| **ni**   | `(ɲ,n)i`       | `9`       | nine                 |\n| **jou**  | `d͡ʑoʊ`        | `10`      | ten                  |\n| **mga**  | `m͡ŋa`         | `100`     | one hundred          |\n| **ga**   | `ga`           | `1000`    | one thousand         |\n| **ca**   | `cʰa`          | `10000`   | ten thousand         |\n| **awi**  | `awi`          | `100000`  | one hundred thousand |\n| **eku**  | `ɛ(k,c)(u,u̥)` | `1000000` | one million          |\n\n## 12.2 Operation\n* *jou* or other place numbers are either multiplicative or additive, depending on placement:\n\t* *zu**jou*** :: **2x10** (20)\n\t* ***ji**zu* :: **10+2** (12)\n* *′iyo* + *jou* forms *′ijou*, not *′iyojou*, so keep this in mind\n\t* it does this for other multiplicative structures too (e.g., *mga* :: *′imga*)\n* In the *jiyo* form, it wouldn't do this, so, for instance, *jiyo* + *rre* would always be *jiyorre*\n\n## 12.3 Series\n### 12.3.1 Tens\n* *jisu* :: **10+1** (11)\n\t* `/d͡ʑ(ɪ̥,ɪ)su/`\n* *jizu* :: **10+2** (12)\n\t* `/d͡ʑɪzu/`\n* *jwu* :: **10+3** (13)\n\t* `/(t͡ɕ,d͡ʑ)(w̥,ʷ)u/`\n* *jiyo* :: **10+4** (14)\n\t* `/(t͡ɕ,d͡ʑ)(i̥,i)jo/`\n* *jimi* :: **10+5** (15)\n\t* `/d͡ʑimi/`\n* *jise* :: **10+6** (16)\n\t* `/(t͡ɕ,d͡ʑ)(i̥,i)se/`\n* *jiki* :: **10+7** (17)\n\t* `/(t͡ɕ,d͡ʑ)(i̥,i)(k,k,c,c)(i,i̥,i,i̥)/`\n* *jirre* :: **10+8** (18)\n\t* `/d͡ʑi(ɾ,r,ɺ)e/`\n* *jini* :: **10+9** (19)\n\t* ``/d͡ʑi(ɲ,n)i/``\n\n### 12.3.2 Beyond the simple tens\n* Simply add *jou* to the end of the appropriate number:\n\t* *zujou* :: **2x10** (20)\n\t\t* `/zu(t͡ɕ,d͡ʑ)(u̥,u)/`\n\t* and use the *ji* form for numbers within the series:\n\t\t* *zujisu* (21)\n\t\t* *zujizu* (22)\n\t\t* *zujwu* (23)\n\t\t* *sejini* (69)\n\t\t* *nijwu* (93)\n\t\t* *nijini* (99)\n* Note that when *jou* is used as a suffix, it is usually pronounced\n\t* `/t͡ɕu̥/`\n\t\t* some speakers may pronounce it as `/d͡ʑu/`, which is fine\n* For hundredths:\n\t* *mga* (100)\n\t* *mgasu* (101)\n\t* *mgajizu* (112)\n\t* *mgajwu* (113)\n\t* *wumgajirre* (318)\n\t* *mimgasejiki* (567)\n\t* *nimgajini* (999)\n* For thousandths:\n\t* *ga* (1,000)\n\t* *gasu* (1,001)\n\t* *gajizu* (1,012)\n\t* *gamgajizu* (1,112)\n\t* *ganimga* (1,900)\n\t* *ganimganijini* (1,999)\n\t* *ganimgajini* (1,990)\n\t* *migajise* (5,016)\n\t* *migawujise* (5,316)\n\t* *niga* (9,000)\n\t* *nigami* (9,005)\n* For ten thousandths:\n\t* *ca* (10,000)\n\t* *casu* (10,001)\n\t* *cajisu* (10,011)\n\t* *cazujwu* (10,023)\n\t* *camga* (10,100)\n\t* *ca′imgasejini* (10,469)\n\t* *camimga* (10,500)\n\t* *camimgasu* (10,501)\n\t* *camimgajisu* (10,511)\n\t* *camimganijini* (10,599)\n\t* *canimga* (10,900)\n\t* *caga* (11,000)\n\t* *caniga* (19,000)\n\t* *zuca* (20,000)\n\t* *wuca* (30,000)\n\t* *sejinica* (69,000)\n\t* *sejinica′imgazujou* (69,420)\n\t* *nica* (90,000)\n* For one hundred thousandths:\n\t* *awi* (100,000)\n\t* *awisu* (100,001)\n\t* *awiki* (100,007)\n\t* *awijisu* (100,011)\n\t* *awikijiwu* (100,073)\n\t* *awimga* (100,100)\n\t* *awinimga* (100,900)\n\t* *zawi* (200,000)\n\t\t* for 200,000-900,000, the series are as follows:\n\t\t\t* *zawi* (200,000)\n\t\t\t\t* *zawinimganijini* (200,999)\n\t\t\t* *wawi* (300,000)\n\t\t\t* *yawi* (400,000)\n\t\t\t* *mawi* (500,000)\n\t\t\t* *sawi* (600,000)\n\t\t\t\t* *sawinicasega-nimgasejini* (696,969)\n\t\t\t\t\t* *sawinicasega* is 696,000\n\t\t\t\t\t* *nimgasejini* is 969\n\t\t\t* *kawi* (700,000)\n\t\t\t\t* *kawinica* (790,000)\n\t\t\t\t* *kawinica-nijini* (790,099)\n\t\t\t* *rrawi* (800,000)\n\t\t\t\t* *rrawiga* (801,000)\n\t\t\t* *nawi* (900,000)\n\t\t\t\t* *nawi-nigani* 909,909\n* For millionths:\n\t* *eku* (1,000,000)\n\t* *ekusu* (1,000,001)\n\t* *zeku* (2,000,000)\n\t\t* *eku* also has forms like *awi*:\n\t\t\t* *zeku* (2,000,000)\n\t\t\t* *weku* (3,000,000)\n\t\t\t* *yeku* (4,000,000)\n\t\t\t* *meku* (5,000,000)\n\t\t\t* *seku* (6,000,000)\n\t\t\t* *keku* (7,000,000)\n\t\t\t* *rreku* (8,000,000)\n\t\t\t* *neku* (9,000,000)\n\t\t\t* *jeku* (10,000,000)\n\t\t\t\t* pronounced ~`/(t͡ɕ,d͡ʑ)(ɛ̥,ɛ)(k,c)(u,u̥)/`\n\t\t\t* *mgeku* (100,000,000)\n\t\t\t\t* pronounced ~`/m͡ŋɛ(k,c)(u,u̥)/`\n\n## 12.4 Format\n* The format for writing the compounds for numbers is as follows:\n\t* `[PARENT]-[CHILD]'([CHILD2])...)`\n\t\t* let's apply it to *sawinicasega-nimgasejini*:\n\t\t\t* *sawi* :: parent (600K)\n\t\t\t* *nica* :: child descriptor 1 (90,000)\n\t\t\t* *sega* :: child descriptor 2 (6,000)\n\t\t\t* *nimga* :: parent 2 (900)\n\t\t\t* *sejini* :: child 1 of p2 (69)\n\t\t\t\t* *sejini* cannot be broken down further\n\t\t\t\t* *jini* alone means 19\n\t\t\t\t* *se* just means 6\n\t\t\t\t* if interpreted literally, this would be 619, but according to the rules of the system as previously described, *sejini* is 69\n\t\t\t\t\t* the pattern is **X-ji-Y**, where *X-* is the first tenth and *-Y* is the final\n\t\t\t\t\t* **-ji-** just connects *X-* to *-Y*\n\t\t\t* here:\n\t\t\t\t* *sawi* takes *nica, sega* as children\n\t\t\t\t* *nimga* takes *sejini* as a child\n\t\t\t* so:\n\t\t\t\t* *sawi-nica'sega nimga-sejini*\n\n## 12.5 Morphosyntactic category\n* A number can be:\n\t* **cardinal**\n\t\t* `number [appropriate linking particle] (...)`\n\t\t\t* in sets, *no* is used (X's Y / Y of X)\n\t\t\t\t* *watada... jou no zu no ni ii ue...*\n\t\t\t\t\t* only... two of/from the ten are good\n\t\t\t* for approximate quantities, *-bu* is used\n\t\t\t\t* *nggg, zubu... no?*\n\t\t\t\t\t* like... (is it) two-ish?\n\t\t\t* for exact quantities, *-te* is used\n\t\t\t\t* *kite nigo*\n\t\t\t\t\t* seven cats\n\t* **ordinal**\n\t\t* `([appropriate determiner]) number ([nu]) (...)`\n\t\t\t* usually, *ryo* is used unless the distal (*lyo*) or proximal (*byo*) aspect has to be emphasised\n\t\t\t\t* *ryo wan nigo ni subunai, fuka!* :: `DEM.MED one cat TOP desire.V-MID`\n\t\t\t\t\t* ~\"I want the first cat, please!\"\n\t\t\t* otherwise, *-nu* can be used to assign the number as a fixed property or title\n\t\t\t\t* *subute arenenai nemusunoe zhi byo... wannu nigo a ushikitsurra ue* :: `desire.V-INF change-MID decide-1SG.POSS-N TEMP DEM.PROX one-MOD cat A fun-NEG COP.POL`\n\t\t\t\t\t* ~\"Never mind, the first cat wasn't all that fun\"\n\t\t\t\t\t* lit. \"(I) want to change my mind now, first cat is not fun\"\n\t\t\t\t* *kinu nigo* :: `seven-MOD cat`\n\t\t\t\t\t* \"The seven-cat\"\n\t\t\t\t\t\t* maybe it has seven paws\n\t\t\t\t\t\t* maybe this cat is a part of a band named *ki* (seven)\n\t\t\t\t\t\t* or maybe you just want to vaguely characterise it by the number seven\n\t\t\t\t\t* \"The seventh cat / cat #7\"\n\t* **nominal**\n\t\t* `number + (vowel)n`\n\t\t\t* a doubled vowel plus *n* at the end of a number makes it a proper noun representing the digit\n\t\t\t\t* *kiwinq aiko! jiennai wan-zūn-kīn-awīn...* :: `continue-REVS IMP.POL LOC-VBZ-MID one-two.N-seven.N-one.hundred.thousand.N`\n\t\t\t\t\t* ~\"Wait! (I'm) putting (the number) 1-2-7-100,000 (in)...\"\n\n## 12.6 Irregular number\n* The most irregular number is one\n* It has two forms:\n\t* *su*\n\t* *wan*\n* *wan* can be used as a verb, noun, cardinal, ordinal - you name it\n\t* *so we sa ni su a wanunai* :: `3SG.M ADD 3SG.F TOP 1SG A unite.V-MID`\n\t\t* lit. \"As for him and her, I united (them)\"\n\t\t* ~\"I (was the one that) united him and her\"\n* *su* can only be used as a digit noun, cardinal, and ordinal\n* However, depending on the following cases, you'll have to choose *wan* over *su* or vice versa:\n\t* **digit proper nouns**\n\t\t* *wan* is used\n\t\t\t* *wan, zūn, wūn* (one, two, three)\n\t* **cardinals**\n\t\t* *wan* is used both in sets (with *no*) and approximates (*wambu*)\n\t\t* for exact quantities (with *-te*), *su* is used (*sute*)\n\t\t\t* *sute nigo* (one cat)\n\t* **ordinals**\n\t\t* *wan* is used (e.g., **ryo wan**)\n\t\t\t* *ryo wan nigo* (the first cat)\n\n## 12.7 Shorthand number compounds\n* Instead of complex number compounds, such as *sawi-nica'sega nimga-sejini* (696,969), you can:\n\t1. **break them up into digestible chunks**\n\t\t* *696,969* becomes *69-69-69*:\n\t\t\t* *sejini-sejini-sejini* (sixty-nine-sixty-nine-sixty-nine)\n\t\t\t* *sejini no wūn* (three of sixty-nines)\n\t\t\t* *wute sēnjinīn* (three sixty-nines)\n\t\t\t* *wute sēn-nīn* (three six-nines)\n\t\t\t\t* better to avoid this; it can be ambiguous\n\t2. **nominalise**\n\t\t* you can use *oe*, *no*, and the standard digit nominalisation methods:\n\t\t\t* *wute sēnjinīn* :: three sixty-nines\n\t\t\t* *wute sējinīn* :: three sixty-nines\n\t\t\t\t* both are fine, they vary speaker-to-speaker\n\t\t\t\t* this is the formal and polite method\n\t\t\t\t* you'd use this with strangers, higher-ups, sometimes even your elders\n\t\t\t* *wute sejinioe* :: three sixty-nines\n\t\t\t\t* less preferable than formal nominalisation\n\t\t\t\t* if saving time, this can be used\n\t\t\t\t* it is polite but slightly less formal than the former method\n\t\t\t* *wute sejini no* :: three sixty-nines\n\t\t\t\t* most informal method\n\t\t\t\t* can be jarring or impolite to strangers\n","13 Advanced grammar.md":"## 13.1 Topic-comment structure\n* Generally, this structure is used for complex thought:\n\t* `TOPIC COMMENT (CLAUSE / OPINION)`\n\t\t* *Subeki ryo komunishimg ni ieiukonq, riwakanai* :: `all.ATTR DEM.MED policy-unit-G.REVS TOP AUG-sound-REVS think-MID`\n\t\t\t* lit. \"All this policy, as for (it), unsounder, think\"\n\t\t\t* ~\"I think that all of these policies are quite unfair\"\n* Examples:\n\t* *Sa no ni, hakuhwo i no?* :: `3SG NMZ TOP real-essence COP Q`\n\t\t* lit. \"As for her, the reality is...?\"\n\t\t* ~\"How serious are you about her?\"\n\t\t\t* *sa no* is used to turn *sa* (she) into an entire 'person'\n\t\t\t* saying *sa ni hakuhwo...* could be rude/degrading, since you're treating *sa* as a 'part' of a 'whole'\n\t* *Yada, fofu no?* :: `so speak.V Q`\n\t\t* lit. \"So, speak?\"\n\t\t* ~\"Well, then do you wanna talk?\"\n\t\t* ~\"We should talk\"\n\t\t* ~\"Come on, I think we should talk\"\n\t\t\t* you can drop entire clauses, postpositional phrases, or purposives as long as context makes it clear\n\t* *Ngggg, hakunu no?* :: `FIL real-MOD Q`\n\t\t* lit. \"Hmmm, really?\"\n\t\t* ~\"Hmmmm, is that true?\"\n\t\t* ~\"Are you sure?\"\n\t\t* ~\"You for real?\"\n\t\t\t* *hakui* is avoided since *hakui no* is actually a nominalised adjective, meaning 'the truthful thing / the real thing / thing of reality'\n\t\t\t* this is a rule for attributives\n\t\t\t* *-nu* does not form this with *no*\n\t\t\t* so instead of *hakui no yo?* (not preferred), you say *hakunu no?*\n\t\t\t\t* the former reads more literal, whereas the latter is more fluent and natural\n\t* *Zu a fofu no ni, arene i, toshire* :: `2SG A speak.V NMZ TOP different COP PFV-learn`\n\t\t* lit. \"You said (as a thing), different is, learnt\"\n\t\t* ~\"I realised that what you said is different\"\n\t\t* ~\"I've learnt that what you said was different\"\n\n### 13.1.1 Experience or judgement\n* Compare:\n\t* *Su ni, lyo a toii ue, riwakarranai* :: `1SG TOP DEM.DIST A PFV-good COP.POL think-NEG-MID`\n\t\t* lit. \"As for me, that was good, (I) don't think so\"\n\t\t* ~\"I don't think that did good regarding me\"\n\t* *Su ni, lyo o toii ue, riwakarranai* :: `1SG TOP DEM.DIST U PFV-good COP.POL think-NEG-MID`\n\t\t* lit. \"As for me, that didn't undergo good, (I) don't think so\"\n\t\t* ~\"I didn't think that was good\"\n* So, what's the difference? Let's look at a simpler sentence:\n\t* *Lyo (a/o) toii, riwakanai* :: `DEM.DIST A/U PFV-good think-MID`\n\t\t* ~\"That was good, I think\"\n* Dissecting it...\n\t* *lyo a toii, riwakanai*\n\t\t* that (thing) is good (as a property of it), I think\n\t\t* the comment *toii* is a property of *lyo*\n\t\t* you're judging *lyo*, the thing, itself\n\t* *lyo o toii, riwakanai*\n\t\t* that (thing) suffers good / is good, I think\n\t\t* the comment is about undergoing or experiencing *toii*\n* Look at it in another example:\n\t* *sa o ii* :: `3SG.F U good COP.POL`\n\t\t* ~\"She is good\"\n\t\t\t* here, *o ii* implies:\n\t\t\t\t* she's naturally a good person\n\t* *sa a ii* :: `3SG.F A good`\n\t\t* ~\"She is good\"\n\t\t\t* here, *a ii* implies:\n\t\t\t\t* she's making a conscious effort of being good\n\t\t\t\t* she is continuously 'being good'\n\n### 13.1.2 Anaphoric negation\n* *einq ni nqi* :: `ANAPH-REVS TOP REVS-ATTR`\n\t* this is like saying, \"as for whatever I just said before, (but) the opposite\"\n\t* or \"as for whatever is most relevant most pertaining to this conversation, this is the opposite contrast\"\n* Example:\n\t* *nigo ni kita, ei ni nqi* :: `cat TOP like ANAPH TOP REVS-ATTR`\n\t\t* ~\"I like cats, but not dogs\"\n\t* *kita zu, ei ni nqi* :: `like 2SG ANAPH TOP REVS-ATTR`\n\t\t* ~\"(I) like you, but I dislike myself\"\n* You can also use it in constructions like:\n\t* *Wan teteson ga iinq i, einq ni ieiibu* :: `one hand-3SG.M.POSS NOM good-REVS COP ANAPH-REVS TOP AUG-good-PROP`\n\t\t* lit. \"One hand of his is bad, the opposite of what I just said, as for it, kind of better\"\n\t\t* ~\"One of his hands is bad but the other one is a little bit better\"\n* Remember, *einq* reverses the whole *wan teteson ga iinq i*, so it becomes:\n\t* the other hand of his is good\n* but when we restate *ni ieiibu*, it changes the state from *iinq i* to *ieiibu* (a little bit / kind of better)\n\n### 13.1.3 Copular predicates\n* The copula can carry predicates\n* For example:\n\t* *so ni sarei i* :: `3SG.M TOP 3SG.F-INANIM COP`\n\t\t* lit. ~\"As for him, dead she is\"\n\t\t* ~\"She's dead to him\"\n\t\t\t* more idiomatically, it reads as 'he does not think she deserves to be acknowledged as a living person'\n* If you were to try to translate it directly from English:\n\t* *so ni sa ga sarei i* :: `3SG.M TOP 3SG.F NOM 3SG.F-INANIM COP`\n\t\t* ~\"To him, she is who is a dead she\"\n\t\t\t* a literal, descriptive fact\n\t\t\t* it treats her as a living subject (due to *sa*) who is an inanimate subject (*sarei*)\n* The latter is redundant and much less punchy or hurtful than *so ni sarei i*, because the former uses an inanimate pronoun\n* More examples:\n\t* *so ni su i, riwakanai* :: `3SG.M TOP 1SG COP think-MID`\n\t\t* ~\"He acknowledges me, I think\"\n\t\t\t* recommended to construct it as *so ni su inai, riwakanai*\n\t\t\t\t* this is like saying 'as for him, I (do) happen, I think'\n\t\t\t\t* the former one is like saying 'as for him, I am, I think'\n\t* *to, byo asa i* :: `PFV DEM.PROX house COP`\n\t\t* lit. \"Was, here house is\"\n\t\t* ~\"There used to be a house over here\"\n\t* *toii* :: `PFV-good`\n\t\t* lit. \"Was good\"\n\t\t* ~\"(I) was good\"\n\t\t\t* *ii* ends in *i* and is already a strong modifier\n\t\t\t* it does not need take the copular\n\t\t\t* depending on context, *toii* can mean:\n\t\t\t\t* that was good\n\t\t\t\t* I was good\n\t\t\t\t* she was good\n\t\t\t* ... etc.\n\t* *wurei inai zhi byo* :: `3SG-INANIM COP-MID TEMP DEM.PROX`\n\t\t* lit. \"Dead-they happened when here\"\n\t\t* ~\"They are dead now\"\n\t\t\t* note, *byo* (proximal demonstrative) is used like the English 'now' when appearing after *zhi*\n\t\t\t\t* similar to how *lyo* (distal demonstrative) is used like the English 'back then' / 'then' when appearing after *zhi*\n\t\t\t* it does not mean 'just now,' it just refers to current time\n\t\t\t* for 'just now:'\n\t\t\t\t* *wurei he inai* :: `3SG-INANIM RECP COP-MID`\n\t\t\t\t\t* ~\"They just died\"\n* Note that these sentences can be highly offensive, especially due to the inanimate pronouns\n* It is better to avoid saying things so directly:\n\t* *Wu ni Jamuiku ga osaratepai* :: `3SG TOP one.god-HON NOM call-INF-REFL LOC`\n\t\t* ~\"They were called by God to Himself\"\n\t\t* even here, *jamuiku ga* is not preferable\n\t\t* see **13.12**\n\n## 13.2 Clausal actors\n* A whole predicate can be an 'actor:'\n\t* *kanatashimg makure a fofu hakuhwōe* :: `word-POT.ATTR-G.REVS emotion A speak.V real-essence-N`\n\t\t* lit. \"Wordable emotion speaks truth\"\n\t\t* ~\"Emotions that can't be put into words are the most truthful / genuine\"\n\t\t\t* notice: *tasu* + *mg* forms *tasumg* (negative potential)\n\t\t\t* *tasu* + *i* forms *tashi* (potential attributive)\n\t\t\t* *tasu* + *i* + *mg* forms *tashimg* (negative potential attributive)\n\t\t\t* since *i* (the attributive) can't take *mg*, *mg* grammatically reverses *tasu*\n\t\t\t* this is an exception you have to remember\n\n## 13.3 Clausal modification\n* *no*, the genitive, can be used to modify clauses:\n\t* *Jijinu makure no futasumg kana ji a fofu hakuhwōe imnyi hon*\n\t\t* `INTENS~LOC-MOD emotion GEN ACT-POT-G.REVS word LOC A speak.V real-essence-N SIM.AUG.SUP person `\n\t\t* lit. \"Undoable in words of absolute emotion speaks reality the same as a person\"\n\t\t* ~\"Emotions that cannot be put into words are the very things that tell the truth of what it means to be human\"\n\t\t\t* *hakuhwōe imnyi hon* means 'reality the same as a person' (i.e., what it means to be human)\n\t\t\t* here, *jijinu makure* is a phrase meaning 'exact/precise emotion'\n\t\t\t* *no* after *jijinu makure* allows it to modify *futasumg kana ji* (undoable in words / cannot put into words)\n\t\t\t* so *jijinu makure no futasumg kana ji* means 'precisely the emotions that cannot be put into words'\n\t\t\t\t* more literally: **precise emotions' undoable/undoability in words**\n\n## 13.4 Postpositional infinitives\n* Verbs like *ea* hate postpositions in their middle voice form:\n\t* *eanaite kamu* :: (I) go out to eat\n\t\t* but if you said:\n\t\t\t* *eanai kam**u** ji*\n\t\t* then this doesn't parse well because *kamu* is a verb (to eat)\n\t\t* you'd use *eanai kam**en** ji* (I went out for eating)\n\t\t\t* this is formal, and not something you'd say with a friend or acquaintance\n\t\t* you could also say *eanai kamu un ji* (I went for at eating), which is grammatically correct, **but its a bit like saying something like such as similar to like what I just said**\n* *-te* is especially even more preferable when you need to use a clause as the purposive of another:\n\t* *Tosubute eanai hariasa jite nirunaimg ryo honoe, lyo atora ji* :: `PFV-desire.V-MID MOV-MID exchange-house LOC-INF show.V-MID-G.REVS DEM.MED person-N DEM.DIST apple LOC`\n\t\t* ~\"I waned to go to the store to show this person that apple over there\"\n\t\t\t* here, *ji* marks *tosubute eanai hariasa* as the purposive, and *te* attributes it to *niru ryo honoe lyo atora ji*\n\n## 13.5 Demonstratives and postpositions\n* Use *un* for location of action:\n\t* *urukuennnai lyo un* :: `stand-VBZ-MID DEM.DIST INSTR`\n\t\t* ~\"Standing over there\"\n* Use *ji* for location of existence:\n\t* *urukuennai lyo ji* :: `stand-VBZ-MID DEM.DIST LOC`\n\t\t* ~\"Standing in (over) there\"\n* Or omit the case and let context do the work, since *uruku* by default accepts another argument that describes the **where**:\n\t* *urukuen byōe* :: `stand-VBZ DEM.PROX-N`\n\t\t* ~\"Standing here\"\n\t* *urukuen ryōe* :: `stand-VBZ DEM.MED-N`\n\t\t* ~\"Standing at this point / there (near us)\"\n\n## 13.6 **au** constructions\n* *au* affects the subject, but it is never marked with *-nai*, since it is irregular\n* Partially, this is a reason that *o* is used over *o* with *au* if *au* is marking existence, like:\n\t* *O au sa...* :: `U HAVE.V 3SG.F`\n\t\t* ~\"I have her...\"\n* But *a* is used if this 'existence' becomes active:\n\t* *Su a reoau subeko no mani hiroga do* :: `1SG A HAVE.V all GEN money world PER`\n\t\t* ~\"I will get all the money in the world!\"\n\t* *Su a subute au epikui tahete!* :: `1SG A desire.V-INF HAVE.V epic-ATTR electronic`\n\t\t* ~\"I want to get an epic electronic\"\n* You can also use *ni* without *a*:\n\t* *ngoshi ni au kamo* :: the bird has food\n* But as soon as you want to say 'get,' you use *a*:\n\t* *ngoshi a au kamo* :: the bird gets / obtains food\n* Or you could use the modern / informal term *demg*:\n\t* *ngoshi ni demg kamo* :: the bird gets food\n\t\t* *demg* (formerly *denh*) is formed from *de*, which is the receiving relational, and the grammatical reverser *-mg*\n\t\t* *aumg* is the proper Koyeah Tawa variant, but *aumg* can only be used with *ga*\n\t\t\t* use *demg* when you also aren't using *ga*\n\t\t\t* use *aumg* when you are using *ga*\n* Here are some constructions where *au* does something unique:\n\t* *Sa o au iitasu* :: `3SG.F U HAVE.V good-POT`\n\t\t* lit. \"She has goodability\"\n\t\t* ~\"She might be good ((after all), you never know)\"\n\t* *Shirerranai, ya! So o au korumasutasu* :: `know-NEG-MID ASSERT | 3SG.M U HAVE.V kill.V-AG-POT`\n\t\t* ~\"I don't know! He might be a killer for all you know\"\n\n## 13.7 Mood copular constructions\n* Also a part of advanced grammar, the mood copular constructions, such as:\n\t* *itai*\n\t* *iare*\n\t* *inatai*\n\t\t* want / simply long, less stronger due to diminutive *-suta*\n\t* *irranatai*\n\t\t* note: *nai* drops the *i* when pairing with *atai*, which drops its *a*\n\t\t* the copular also connects to *atai* as *itai*, where *atai* drops the *a*\n* ... are used for highly romantic or emotional constructions\n* For example:\n\t* *zu ni su mo inatai anano?* :: `2SG TOP 1SG COM COP-MID.DES AFFEC-Q`\n\t\t* ~\"Do you emotionally long for us to be together?\"\n\t\t* ~\"I want you and me to be together\"\n\t\t\t* but its more emotional than that\n\t* *zu ni su mo iare no?* :: `2SG TOP 1SG COM COP-OPT Q`\n\t\t* ~\"Don't you wish that we were together?\"\n\t\t* ~\"Shouldn't we be together?\"\n\t\t* ~\"Isn't it better if we were together?\"\n\t\t* ~\"Ever wish that you and I were together?\"\n\n## 13.8 Determiners\n### 13.8.1 **Many** and **some**\n* **Pattern**\n\t* `myo no X` = many X\n\t\t* `mymyo no X` = most (of) X\n\t* `myomg no X` = some X\n\t\t* `mymyomg no X` = least (of) X\n* Examples:\n\t* *Myo no atora* :: many apples\n\t* *Myomg no atora* :: a few / some apples\n\n### 13.8.2 **Any** and **little**\n* **Pattern for any**\n\t* `we no X` = any (of) X\n\t\t* *byo ji ni we no ng i*\n\t\t\t* ~\"you can find anything here\"\n\t\t* *earranaite we no ng*\n\t\t\t* ~\"I'm not going anywhere\"\n\t* `wewe no X` = every nook and cranny of X\n\t* `wemg no X` = none (of) X\n\t\t* *byo ji ni wemg no ng i*\n\t\t\t* ~\"there is nothing here\"\n\t\t* *eanaite wemg no ng*\n\t\t\t* ~\"I'm going to the middle of nowhere\"\n\t\t\t* ~\"I'm going to a place nobody knows about\"\n\t\t\t* ~\"Where I'm going is none of your business\"\n\t* `wewemg no X` = not a single trace of X\n* **Pattern for little**\n\t* `lili no X` = a little X\n\t\t* e.g., *lili mani no X* = poor/impoverished X\n\n### 13.8.3 **Wh-ever** words\n* **Whatever, whichever, whenever, wherever**\n\t* `we no ng` (whatever/whichever)\n\t\t* *fu we no ng* :: do whatever\n\t\t* *kamu we no ng* :: eat whatever/whichever\n\t* `zhi we no ng` or `we no wanō` (whenever)\n\t\t* *kamu zhi we no ng* :: eat whenever/anytime\n\t\t* *fu yaranai, we no wanō* :: do come, anytime\n\t* `-te/(jite) we no ng` (wherever)\n\t\t* *kamute we no ng* :: eat wherever\n\t\t* *haterunaite we no ng* :: run wherever\n\t\t\t* note: *haterunai* is used because *hateru* means **to trample**\n\t\t\t* so:\n\t\t\t\t* *sorama a hateru sōe* :: rain trampled over him / ran him over\n\t\t\t\t* *sorama a haterunai* :: the rain runs\n\t\t\t\t* *sa a haterunaite sōe* :: she ran after him\n* The same patterns are used for:\n\t* **anyone, anything, anywhere, anytime**\n\n### 13.8.4 **Every** and **all**\n* **Patterns for every and all**\n\t* `subeko no X` :: all (of) X\n\t\t* *subeko no wanō* :: eternity / forever (literally 'all of time')\n\t\t\t* cf. *we no wanō* :: anytime\n\t\t* *subeko no hon* :: all humans\n\t\t* *subeko no kitei* :: all things\n\t* `subeki X` :: every X\n\t\t* *subeki ribu* :: every book\n\t\t* *subeki hon* :: every human\n\t\t* *subeki kitei* :: everything\n\t* `subekinu X` :: all pertaining to X\n\t\t* *subekinu ribu* :: anything related to books (e.g., pens and paper)\n\t\t* *subekinu hon* :: anything related to humans (e.g., life, organs)\n\t\t* *subekinu chi* :: anything related to water (e.g., liquid, drinks, solvent, cups)\n\n## 13.9 Occurrence\n* The middle voice form of *fu* (*funai*) is used to denote the 'happening' of an event:\n\t* *Itagi o funai* :: `idea U ACT-MID`\n\t\t* ~\"An idea occurred\"\n\t\t* ~\"An idea actualised\"\n* It is particularly useful in constructions like\n\t* *Su ni itagi o funai* :: `1SG TOP idea U ACT-MID`\n\t\t* lit. \"As for me, an idea actualised\"\n\t\t* ~\"I just thought of something\"\n\t\t* ~\"I have an idea\"\n\t\t\t* you can omit *su*:\n\t\t\t\t* *a, itagi o funai* :: `A idea U ACT-MID`\n\t\t\t\t\t* depending on context, *a* can mean 'I/me'\n* Compare with *inai*:\n\t* *Su ni itagi inai* :: `1SG TOP idea COP-MID`\n\t\t* ~\"An idea exists for me / an idea is being for me\"\n\t* *Itagi inai* :: `idea COP-MID`\n\t\t* ~\"An idea exists\"\n\t\t* ~\"An idea happens\"\n\n## 13.10 Usage of **ga**\n* *ga* marks the subject of a sentence\n* It is used in place of *a* or *o* in fast speech\n\t* in spoken language, *ga* **does not** feel informal nor impolite\n* It is not as commonly used in written language, unless between close friends\n\t* in written language, substituting *a/o* (and sometimes even *ni*, though that could be incorrect) for *ga* **does** feel very informal and impolite (to strangers or elders)\n\t\t* so, saying:\n\t\t\t* *ryo ga ii* (this is good)\n\t\t\t* *su ga kamu* (I eat)\n\t\t* can be impolite or jarring in written form\n\t\t* even for complex sentences:\n\t\t\t* *Kamen ga, su o rawaretanai*\n\t\t\t* *Motore ga, o rawanq zhi kamen*\n\t\t* there, you would use respectively:\n\t\t\t* *kamen a*\n\t\t\t* *motore a*\n* It is not a dummy pronoun:\n\t* *a, itagi o funai* :: I had an idea\n\t\t* the actor before *a* is omitted if context is clear\n\t* *ga, itagi o funai* :: the idea which happened...\n\t\t* incomplete sentence\n\t\t* comma is misleading and feels jarring to parse as well\n* It can promote topics to subjects (poetic and literary):\n\t* *Sa ni, wan niro o nirutashimgai ga naiwanqtasu* :: `3SG.F TOP one eye U see.V-POT.ATTR-G.REVS.MID NOM happy-REVS-POT`\n\t\t* lit. \"As for her one eye suffering non-seeing-ability able to sadden\"\n\t\t* ~\"The fact that she can't see in one eye makes me sad\"\n\n### 13.10.1 **ga** stacking with other particles\n* This is where *ga* shines\n* It can exist with *a* and *o* to layer meaning\n* For example:\n\t* *Kamen ga su o rawaretanai* :: `eat.VBZ NOM 1SG U sleep-RESL-MID`\n\t\t* ~\"Oops, eating made me pass out\"\n\t\t\t* or just drop the pronoun:\n\t\t\t\t* *kamen ga, o rawaretanai*\n\t\t\t\t\t* ~\"Oops, eating made (me) pass out (unintentionally)\"\n\t* *Kamen ga rawareta suoe* :: `eat.VBZ NOM sleep-RESL 1SG-N`\n\t\t* ~\"Eating ended up making me sleep\"\n\t\t\t* and you can drop *suoe*:\n\t\t\t\t* *kamen ga rawareta*\n\t\t\t\t\t* ~\"Oops, eating made me sleep\"\n\t\t\t\t\t* here, intent (intentionality) is underspecified, since no *a* or *o* exists to hint at it\n* Here is a slightly more complex sentence:\n\t* *Su a rawanqpai moto mo zhi kamen* :: `1SG A sleep-REVS-REFL strength COM TEMP eat.VBZ`\n\t\t* lit. \"My strength and I stayed awake whilst eating / I stayed awake with strength when eating\"\n\t\t* ~\"It took strength to stay awake when eating\"\n* But more naturally, you'd say:\n\t* *Motore ga, o rawanq zhi kamen* :: `strength-inner NOM U sleep-REVS TEMP eat.VBZ`\n\t\t* lit. \"Inner strength naturally made stay awake (me) when eating\"\n\t\t* ~\"The inner reserve of strength is what kept me awake when eating\"\n\t\t\t* here, *o rawanq* is like saying 'my inner strength just naturally makes me stay awake'\n\t\t\t* if it's more about strength needed to stay awake:\n\t\t\t\t* *motore ga rawanq zhi kamen* :: `strength-inner NOM sleep-REVS TEMP eat.VBZ`\n\t\t\t\t\t* lit. \"Inner reserve of strength stayed someone awake when eating\"\n\t\t\t\t\t* ~\"When I was eating, it was my inner reserve of strength that kept me awake\"\n\t\t\t\t\t\t* *rawanq* strongly is transitive, so when dropping an object or topic, it is understood that **something or someone** is being acted upon\n\t\t\t\t\t\t* otherwise, just add *su ni* to the start if you want to explicitly state the topic or what *rawanq* is affecting\n\n## 13.11 Inanimate pronouns\n* Inanimate pronouns are a part of advanced grammar and using them for a person can be highly vulgar:\n\t* *mo, fofu sorei ji eu ake utari, fukano?* :: `SEQ speak.V 3SG.M-INANIM LOC COMP IMP.DIR sing REQ-Q`\n\t\t* lit. \"Then, tell dead him to sing, (pretty) please?\"\n\t\t* ~\"Then, why (don't you) tell that useless sack of shit (him) to sing (like a canary), please?\"\n\t\t\t* the *fukano?* contrasts with the harsh and vulgar tone of *sorei* paired with the direct imperative *ake*\n\t\t\t* it creates a highly sardonic sentence\n\n## 13.12 Politeness\n* Never be direct:\n\t* **ryo ga iinq ue**\n\t\t* the polite copular *ue* makes this even worse\n\t\t* it's like saying 'this is shit, politely'\n\t\t* it's the opposite of polite and can feel sardonic or sarcastic\n* You have to read the room and choose the appropriate response:\n\t* *tokuenanqai jamuiku ji* :: `PFV-lose.REVS.MID one.god-HON LOC`\n\t\t* ~\"Returned to the God\"\n\t\t\t* often synonymous with the English 'passing away'\n\t\t\t* very respectful\n\t\t\t* saying something like *jamuiku a* or to state *jamuiku* as an actor is generally avoided, since one cannot certainly know that God did exactly that\n\t\t\t* so, we use passive constructions, where *jamuiku* is the ultimate location or goal\n* Here are some situations and example responses:\n\t* **you had a drink at a family dinner before, but now the drink doesn't taste that good**\n\t\t* *Lyo konga, chingu ga waoi. Myomg no ng ni arene ue ga futasu, arariwakanai no?*\n\t\t\t* `DEM.DIST day-SRC.PART water-SRC.LEX NOM appeasing | QNT-G.REVS NMZ FIL TOP different COP.POL NOM ACT-POT POL-think-MID Q`\n\t\t\t\t* lit. \"That time of day, drink elicited a positive sensory feeling (i.e., was appeasing). As for some, different is possible, think?\"\n\t\t\t\t* ~\"That time of day, the drink was appeasing to me. Do you think that it's possible that maybe something is different today?\"\n\t* **an itchy, ugly shirt was given to you as a gift**\n\t\t* *eeeehh! araii riwakaen. Iehaku ue, hakuǵrra ue. Ryo ga ieashi. Yadaaa, aumg gayasun ji myomg no wanōete damiyaru kohazun mo, fukāna*\n\t\t\t* `hey POL-good think-VBZ | AUG-truth COP.POL truth-REVS-NEG COP.POL | DEM.MED NOM AUG-new | so HAVE.V-G.REVS body-1SG.POSS LOC QNT-G.REVS GEN time-N-INF easy-become.V gift-2SG.POSS COM REQ-AFFEC`\n\t\t\t\t* lit. \"Eyyyy, good thinking. Really is, lie isn't. This newer. Soooo, give my body to some time easy become your gift with, please, (you know)\"\n\t\t\t\t* ~\"Eyyyy, good thinking! Really, I mean it. This is quite new. Sooo, please give my body some time to ease into your gift.\"\n\t\t\t\t\t* *aumg* is more polite than using *demg*\n\t\t\t\t\t* *fukāna* is an affectionate request\n\t\t\t\t\t* *gayasun* diverts attention from **you** (I) as the actor or active agent\n\t\t\t\t\t* *damiyaru* is the verb form of the *damiyaro* (become easy) compound\n\t* **you want to end a boring conversation**\n\t\t* *Yada, aa arapara no nampangu, shirenai, (...), iehakui riwakanai*\n\t\t\t* `so CONC POL-tolerate GEN number-SRC.LEX know-MID ... AUG-true-ATTR think-MID`\n\t\t\t\t* lit. \"Well, even though tolerance's measure, (I) know, ... really true, (I) think\"\n\t\t\t\t* ~\"Well, even though this could feel jarring, I think ... is true\"\n\t\t\t\t\t* here, *(...)* can be a genuine reason, the most common of which being:\n\t\t\t\t\t\t* *riwakangosun no miri o myo no ng a itanai*\n\t\t\t\t\t\t\t* `think-SRC.WHOLE-1SG.POSS GEN middle U QNT NMZ FIL A PRTV-MID`\n\t\t\t\t\t\t\t\t* lit. \"My mind's middle experiences many things circumambulating\"\n\t\t\t\t\t\t\t\t* ~\"I've got a lot on my mind\"\n\t\t\t\t\t\t\t\t* ~\"There's a lot going round my mind\"\n* Abrupt vs. flow:\n\t* *yaro* does not imply natural or abrupt transitions, it only implies some sort of becoming\n\t* with *dami* or words that sound soft, it can have a natural, slowly adjusting connotation:\n\t\t* *damiyaru* :: to ease (into)...\n\t* other words, like *tahete*, which sound sharp, usually mean 'fast' or unnatural changes:\n\t\t* *taheteyaru* :: digitise\n\t\t\t* since *tahete* is also a word opposed to nature (it refers to non-natural, digital things, like electronics), the 'transition' is also unnatural\n\t* to soften 'digitise,' you use *damiyarute* compounds:\n\t\t* *damiyarute tahete...* :: to ease into digital...\n","14 Types of verbs.md":"## 14.1 Basic types\n* There are three, basic types of verbs in Koyeah Tawa:\n\t* **Performed** (they are indifferent to the actor or undergoer)\n\t* **Experienced** (they directly affect the actor or undergoer)\n\t* **Underspecified** (if unmarked, their affect is ambiguous)\n\n### 14.1.1 Basic patterns\n* **Performed**\n\t* `X a Y` :: X does Y\n\t\t* *su a kamu* :: I eat\n\t\t* *su a rawa* :: I made (someone) sleep\n\t* `X o Y` :: X experiences Y\n\t\t* *su o kamu* :: I experienced eating\n\t\t* *su o rawa* :: I was made to sleep\n* **Experienced**\n\t* `X a Y-nai` :: X experiences Y (intentionally)\n\t\t* *su a kamunai* :: I am eaten (and it is my fault)\n\t\t* *su a rawanai* :: I slept\n\t* `X o Y-nai` :: X experiences Y (unintentionally)\n\t\t* *su o kamunai* :: I am eaten\n\t\t* *su o rawanai* :: I passed out\n* **Underspecified**\n\t* *ga* and *ni* usually don't encode undergoing nor acting without more context\n\t* there are some underspecified verbs, like *fofu* and *yara*:\n\t\t* **fofu**\n\t\t\t* *su o fofu* :: I experience speaking / speaking was done by me\n\t\t\t* *su o fofunai* :: I was heard\n\t\t\t* *su a fofu* :: I was the one that spoke\n\t\t\t* *su a fofunai* :: I was told\n\t\t\t* *su ga fofu* :: I speak\n\t\t\t* *su ga fofunai* :: I hear\n\t\t* **yara**\n\t\t\t* *su a yaranai* :: I came\n\t\t\t* *su a yara* :: I made (X) become (Y)\n\t\t\t* *su o yara* :: I became (X)\n\n### 14.1.2 Experiencer particle\n* Koyeah Tawa has two particles that are not commonly used:\n\t* *amg* (`EXP.VOL`)\n\t\t* voluntary experiencer\n\t* *omg* (`EXP.NVOL`)\n\t\t* involuntary experiencer\n* Let's say you want to say:\n\t* 'well, one thing led to another, she slipped, the universe conspired, physics happened, and someone died'\n* You'd say:\n\t* *sa o koru* :: `3SG.F U kill.V`\n\t\t* ~\"She experienced killing\"\n\t\t\t* remember that it doesn't mean she is the one being killed\n* If you want to say 'she was killed:'\n\t* *sa ga tokori no i* :: `3SG.F NOM PFV-kill.ATTR NMZ COP`\n\t\t* ~\"She is the one that was killed\"\n* Or 'she died:'\n\t* *sa o korunai* :: `3SG.F U kill.V-MID`\n\t\t* ~\"She died\"\n* With *amg* or *omg*, you can simply do:\n\t* *sa omg koru* :: `3SG.F EXP.NVOL kill.V`\n\t\t* lit. \"She experiences killing\"\n\t\t* ~\"The universe conspired, physics happened, and someone died accidentally as she was there\"\n\t\t\t* e.g., 'she slipped, the gun went off, total accident'\n\t* *sa omg korunai* :: `3SG.F EXP.NVOL kill.V-MID`\n\t\t* lit. \"She experiences death\"\n\t\t* ~\"At that moment, her heart just happened to decide to cease its beating\"\n\t* *sa amg koru* :: `3SG.F EXP.VOL kill.V`\n\t\t* lit. \"She experiences killing intentionally\"\n\t\t* ~\"The universe conspired in such a way that someone died, as planned by her\"\n\t\t\t* she did choose to do it, but the focus is on **her feeling of doing it**\n\t* *sa amg korunai* :: `3SG.F EXP.VOL kill.V-MID`\n\t\t* lit. \"She chose to pass away\"\n\t\t* ~\"She experienced death willingly\"\n\t\t\t* good for describing suicide, martyrdom, or euthanasia:\n\t\t\t\t* *korutanai* :: `kill.V-NEGATIVE-MID`\n\t\t\t\t\t* negative connotation on *korunai* makes it suicide in this case\n\t\t\t\t* *koruoinai* :: `kill.V-POSITIVE-MID`\n\t\t\t\t\t* to die a martyr or offer sacrifice (by dying)\n\t\t\t\t* *koronyunai* :: `kill-V.ROM-MID`\n\t\t\t\t\t* to be euthanised or mercy-killed\n\n## 14.2 Transitiviser (**NSKT 3.2**)\n* The transitiviser (`TR`) particle *-mai* can be used to flip transitivity\n* It has been introduced in **New Standard Koyeah Tawa 03020** (*v3.2*)\n* It is virtually the same as *naimg*:\n\t* *kamunaimg* :: to feed X / to make X eat Y\n\t* *kamumai* :: to feed X Y\n\t\t* NSKT 3.2 prefers *mai* over *naimg*\n* You'd use the middle voice form (`MID.TR`) for something like this:\n\t* *Kamunamai* :: to be fed X\n\t\t* this is the same as *naimgai*\n* More examples:\n\t* *hateru* :: run\n\t* *haterunai* :: be run (like a program)\n\t\t* *su o haterunai* means 'I am run (like a tool)' / 'they really made a fool out of me'\n\t\t\t* if you want to say 'run over,' consider:\n\t\t\t\t* *su o haterunai jinyi* :: I was trampled / I was run above\n\t\t\t\t* *su o haterunai do* :: I was run through / run over\n\t\t\t\t\t* the more formal form would be *jinyisun o haterunai* or *dosun o haterunai*, but using elipsis with a postposition works fine in such constructions\n\t\t\t\t\t* so remember the template, as it follows for other similar verbs\n\t* *haterumai* :: make X run\n\t* *haterunamai* :: be made to run\n\t* *naiwa* :: happy\n\t* *naiwamai* :: make X happy\n\t* *naiwanamai* :: to be made happy\n* ... and so on\n","15 Echo reduplication.md":"## 15.1 Simple palatalisation rule\n- **D + i** -> **Ji**\n- **T + i** -> **Chi**\n\n## 15.2 Generalisation\n\n**Marker:** **P-** (Backup: **M-**)\n- **Kitei** -> **Kitei pitei** (Things and such)\n- **Irime** -> **Irime pirime** (Work and whatever)\n- **Pamu** -> **Pamu mamu** (Snacking/nibbling)\n\t- *p* to *m*\n\n## 15.2 Pejorative\n| **Root**      | **Reduplicated Form** | **Notes**                        |\n| ------------- | --------------------- | -------------------------------- |\n| **Kamōe**     | **Kamōe damōe**       | Food and crap!                   |\n| **Ii** (Good) | **ii jii**            | _D + i_ becomes **Jii**          |\n| **Irime**     | **Irime jirime**      | _D + i(rime)_ becomes **Jirime** |\n| **Dasi**      | **Dasi sasi**         | **S** backup                     |\n| **Taki**      | **Taki daki**         | -                                |\n* Marker: **d[ə]-** (Backup: **s[ə]-**)\n* For **i**, *j* will be used, so:\n\t* *ii jii*, *irime jirime*\n\t\t* *ii jii* is like saying 'yeah, \"good,\" sure'\n\t\t* *irime jirime* means 'work and all that bullcrap'\n* **i** is the only case where the vowel remains the same\n* So if the vowel is not **i**, like *ga*, then:\n\t* *ga da*\n\t* *ai dai*\n\t* *ainawa dainawa*\n\t* *aiu daiu*\n\t* *ba da*\n\t* *bobo dabo*\n\t* *de se*\n\n## 15.3 Examples\n| **Word Type**       | **Root** | **Generaliser (P/M)** | **Pejorative (D/S)**        |\n| ------------------- | -------- | --------------------- | --------------------------- |\n| **Standard**        | _Kanu_   | Kanu **p**anu         | Kanu **d[ə]**nu             |\n| **Vowel-Initial**   | _Ume_    | Ume **p**ume          | Ume **d[ə]**me              |\n| **High Vowel (i)**  | _Ichie_  | Ichie **p**ichie      | Ichie **j[ə]**chie (D -> J) |\n| **P-Initial**       | _Pone_   | Pone **m**one         | Pone **d[ə]**ne             |\n| **D-Initial**       | _Dako_   | Dako **p**ako         | Dako **s[ə]**ko             |\n| **T-Initial (Chi)** | _Chita_  | Chita **p**ita        | Chita **ch[ə]**ta           |\n* The schwa isn't marked, so just writing *pone dane* is fine\n* For the pejorative, both the consonant and vowel changes:\n\t* *kamu* -> *pamu* /pəmu/\n\t* *kitei* -> *patei* /pətei/\n\t* ... etc.\n\n## 15.4 Semantic pairing\n- **Kamen chihaien** (Eating + Drinking = Dining/Meals)\n\t- _Eanaite kamen chihaien._\n\t\t- ~\"We went out for dining\"\n\t\t- ~\"We went out to eat a meal\"\n- **Irimen asahaien** (Working + Residing = Lifestyle/Living)\n- **Harinaien eanaien** (Buying + Going = Running errands/Shopping)\n\n## 15.5 Glossing\n* **nouns**:\n\t* *kamōe pamōe* :: `eat-N RED:ASSOC-N`\n\t\t* ~\"Foodstuffs\"\n\t\t* ~\"Food and whatever\"\n\t* *kamōe damōe* :: `eat-N RED:PEJ-N`\n\t\t* ~\"Food and shit\"\n\t\t* ~\"Food and crap\"\n* **verbs**:\n\t* *kamu pamu* :: `eat.V RED.PLUR:ASSOC`\n\t\t* ~\"To snack mindlessly\"\n\t\t* ~\"To eat whatever\"\n\t* *kamu damu* :: `eat.V RED.PLUR:PEJ`\n\t\t* ~\"To eat whatever shit\"\n\t\t* ~\"To eat and shit\"\n\t\t* ~\"To eat whatever crap one is offered\"\n* **modifier** (same for both *nu* and *i* modifiers):\n\t* *kamoi pamoi* :: `food-ATTR RED:ASSOC-ATTR`\n\t\t* ~\"Like edible and all that\"\n\t* *kamoi damoi* :: `food-ATTR RED:PEJ-ATTR`\n\t\t* ~\"Like food and shit\"\n\t\t* ~\"Edible and all that crap\"\n* **adverbs**:\n\t* *haterui paterui* :: `run.V-ATTR RED:ASSOC.V-ATTR`\n\t\t* ~\"Like swiftly and stuff\"\n\t* *haterui daterui* :: `run.V-ATTR RED:PEJ.V-ATTR`\n\t\t* ~\"Like fast and shit\"\n"}; 

        const navList = document.getElementById('nav-list');
        const contentArea = document.getElementById('doc-content');
        const searchInput = document.getElementById('search');

        function cleanName(name) {
            return name.replace(/^\d+\s*/, '').replace('.md', '').replace(/-/g, ' ');
        }

        function renderDoc(filename, highlightTerm = null) {
            const rawContent = DOCS_DATA[filename];
            if(!rawContent) return;

            contentArea.innerHTML = marked.parse(rawContent);
            
            if (highlightTerm && highlightTerm.trim() !== "") {
                const walker = document.createTreeWalker(contentArea, NodeFilter.SHOW_TEXT, null, false);
                const nodes = [];
                while(walker.nextNode()) nodes.push(walker.currentNode);

                nodes.forEach(node => {
                    const text = node.textContent;
                    const regex = new RegExp(`(${highlightTerm})`, 'gi');
                    if(regex.test(text)) {
                        const span = document.createElement('span');
                        span.innerHTML = text.replace(regex, '<mark>$1</mark>');
                        node.parentNode.replaceChild(span, node);
                    }
                });

                const firstMark = contentArea.querySelector('mark');
                if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === filename);
            });
        }

        function handleSearch(query) {
            const term = query.toLowerCase().trim();
            navList.innerHTML = '';
            
            if (!term) {
                initDefaultSidebar();
                return;
            }

            let resultsFound = false;
            Object.keys(DOCS_DATA).forEach(filename => {
                const content = DOCS_DATA[filename];
                const chapterName = cleanName(filename);
                const lowerContent = content.toLowerCase();

                if (chapterName.toLowerCase().includes(term) || lowerContent.includes(term)) {
                    resultsFound = true;
                    const resDiv = document.createElement('div');
                    resDiv.className = 'search-result';
                    
                    let snippet = "";
                    const index = lowerContent.indexOf(term);
                    if (index !== -1) {
                        const start = Math.max(0, index - 30);
                        const end = Math.min(content.length, index + 50);
                        snippet = content.substring(start, end).trim().replace(/\n/g, ' ') + "...";
                    } else {
                        snippet = "Match in title";
                    }

                    resDiv.innerHTML = `
                        <div class="result-chapter">${chapterName}</div>
                        <div class="result-snippet">${snippet}</div>
                    `;
                    resDiv.onclick = () => renderDoc(filename, term);
                    navList.appendChild(resDiv);
                }
            });

            if (!resultsFound) {
                navList.innerHTML = '<div style="padding:1rem; opacity:0.4; font-size:0.8rem; text-align:center;">No results found ✨</div>';
            }
        }

        function initDefaultSidebar() {
            navList.innerHTML = '';
            Object.keys(DOCS_DATA).forEach((filename, index) => {
                const btn = document.createElement('div');
                btn.className = 'nav-item';
                btn.dataset.file = filename;
                btn.textContent = cleanName(filename);
                btn.onclick = () => renderDoc(filename);
                navList.appendChild(btn);
                if (index === 0 && contentArea.innerHTML === "") renderDoc(filename);
            });
        }

        searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
        initDefaultSidebar();
    </script>
</body>
</html>
