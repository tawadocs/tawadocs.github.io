*\n\t- used for reporting immediate, observed events or states that weren't previously being discussed\n\t\t- *ngoshi a kamen* :: `bird A eat.VBZ`\n\t\t\t- ~\"The bird is eating\"\n\t\t- *sora a chien* :: `sky A water-VBZ`\n\t\t\t- lit. \"The sky is watering\"\n\t\t\t- ~\"It is raining\"\n- **Exclusionary Abilities:**\n\t- it carries an inherent sense of 'this one and no other'\n\t\t- *Jon a kamumas i* :: `john A eat.V-AG COP`\n\t\t\t- ~\"John is a gourmand\"\n\t\t\t\t- it implies that it is John (and no other) that is specifically holding the role of being a gourmand\n\n### 9.2.1 Note on the actor particle\n* Whilst *a* is an 'actor' particle that frequently forces even non-verbs appearing after it to be verbalised, it doesn't mean that it can't take non-verbs\n* For example, in the sentence *jon a kamumas i*, *a* takes *kamumas i*, which is a predicate with the *i* copular particle\n* Here, *a* cannot verbalise *kamumas* because it is:\n\t* explicitly a noun (*-mas* is an agentivised noun)\n\t* present with a copular (*i* attributes the predicate to the subject)\n\n## 9.3 New to Old\nIn cohesive discourse, there is a standard 'hand-off' between these two particles to maintain flow.\n- **The Introduction Rule:**\n- A common pattern is to introduce a noun with 'a' and then switch to 'ni' for every subsequent mention.\n\t- *To nigo a kamu kamteisun. Nigo ni iepokinu* :: `PFV cat A eat.V food.PROD-1SG.POSS | cat TOP AUG~big-MOD`\n\t\t- ~\"A cat ate my food. It (the cat) was very big/fat.\"\n- **Question and Answer Logic:**\n* Questions take *a* and answers too:\n    - *fuyu hon a kamu kamsun no?* :: `what person A eat.V food.1SG.POSS Q`\n\t    - ~\"Who (what person) ate my food?\"\n\t- *Honrra ya! Nigo a ei* :: `person-NEG ASSERT | cat A ANAPH`\n\t\t- ~\"Not a person! The cat did / it was a cat\"\n\n## 9.4 Structural Constraints\nThese markers interact differently depending on the complexity of the sentence.\n* Nested clauses take *a* because *ni* would be jarring:\n\t* *ribu me fosho a harinai* :: `book REL boy A exchange-MID`\n\t\t* \"The book that the boy bought\"\n- In casual speech, if the topic is already clear, the entire *noun ni* phrase is often dropped\n\t- *a*, though, is rarely dropped because it provides the essential 'new' identity required to understand the sentence.\n- If you want to make the object of a sentence the main topic (topicalisation), you replace the object marker with 'ni'.\n    - *keka ni kamu* :: `cake TOP eat.V`\n\t    - ~\"I ate the cake\"\n\n### 9.4.1 Why topicalise\n* Let's compare two sentences:\n\t* (topicalised object) *keka ni kamu* :: `cake TOP eat.V`\n\t* (direct object) *kamu keka* :: `eat.V cake`\n* Both translate to:\n\t* \"I ate the cake\"\n* ... but mean something different:\n\t* *keka ni kamu* is like saying: 'as for the cake, I ate it (but maybe not the rest / but I don't know about other food)'\n\t* *kamu keka* is like stating a simple fact: 'I ate the cake'\n\n### 9.4.2 Modifier attribution\n* Because of the way *a* works, constructions like this is fine, and sometimes even natural:\n\t* *ryo kamtei ni kamqe a iewaoioinu* :: `DEM.MED food.PROD TOP food.EMO A AUG-taste-POSITIVE-MOD`\n\t\t* ~\"This food tastes really good\"\n\t\t\t* however, it's a little more poetic than that\n\t\t\t* it's like saying 'the feeling I get from eating this is really pleasing (for me)'\n\n## 9.5 **mo** in reporting speech\n* *mo* has two commonly used degrees:\n\t* *mosuta*\n\t\t* ~'these were **probably/likely** the exact words he said'\n\t\t* ~'I may misremember, but he said something along these lines'\n\t* *mosutanyi*\n\t\t* ~'I have the faintest, most minimal inkling that this is what he said'\n\t\t* ~'If I'm being forced to say that this is what he said, it's by the thinnest margin possible'\n* In any case, you'd often use plain word order or **demonstratives** unless you're writing a story or quoting someone\n* Rule of thumb:\n\t* *mo* for any regular quote: a saying of some philosopher or character dialogues\n\t* the other degrees of *mo* for more control over exactness or absoluteness\n* Note that *mo* is very strong: if you misconstrue a person and you used *mo*, then that would be a very big lie\n\n### 9.5.1 Demonstratives\n* Apart from strict word order, you can quote people using demonstratives, but the strength of your reporting depends on the demonstrative used\n* The demonstrative must be in the -oe form:\n\t* *sa fofu byōe: zu ga iinq ue* :: `3SG.F speak.V DEM.PROX-N 2SG NOM good-REVS COP.POL`\n\t\t* lit. \"She politely told me that I was bad\"\n\t\t* ~\"She said right there and right then that I was a pile of shit, politely\"\n\t\t\t* *... iinq ue* is a very sardonic and rude construction, especially when paired with `X ga`, where `X` can be a pronoun like *zu* (you)\n\t* *so fofu ryōe: kita samioe* :: `3SG.M speak.V DEM.MED-N like fish-N`\n\t\t* lit. \"He said this: like fish\"\n\t\t* ~\"He said that he likes fish between us\"\n\t\t\t* compared to *byōe*, *ryōe* is a little more direct, but less strong (in quotations), and always has a 'between us' nuance\n\t* *na fofu lyōe: kitanq samioe* :: `1PL speak.V DEM.DIST-N like-REVS fish-N`\n\t\t* lit. \"We said that there: hate fish\"\n\t\t* ~\"We said that we hate fish\"\n\t\t\t* *lyōe* is the least direct\n\t\t\t* often has a 'back then' or 'then' nuance, like 'we said (then)'\n\n## 9.6 Postposition interaction with **ni**\n* *X ji ni Y*\n\t* X is in/at/to Y (contrast)\n\t* *asasan ji ni reo eanai* :: `house-3SG.F.POSS LOC TOP IPFV go-MID`\n\t\t* ~\"To her house, I will go (e.g., but not his)\"\n* *X un ni Y*\n\t* At X / by X (contrast)\n\t* *byo un ni kamenrra* :: `DEM.PROX INSTR TOP eat.VBZ-NEG`\n\t\t* ~\"I am not eating here (e.g., but I'll eat at home)\"\n\t* *pokii asa un ni kamen* :: `big-ATTR house INSTR TOP eat.GER`\n\t\t* ~\"I'll be eating at the big house (but maybe not the small one)\"\n* *X mo ni Y*\n\t* With X (relationship), Y (contrast)\n\t* *so mo ni fofurra* :: `3SG.M COM TOP speak.V-NEG`\n\t\t* ~\"I won't talk to him\"\n\t\t\t* implies that you'd talk to others, just not him\n\t* *so mo ni imorranai* :: `3SG.M COM TOP SIM-NEG-MID`\n\t\t* ~\"I am not like him\"\n\t\t\t* if you just said *so ni imorranai*, it would have a different meaning, unless you explicitly compared with yourself\n\t\t\t* instead of overly verbose constructions like that, using the *X mo ni Y* relationship is easier\n\t* *sami mo ni omoko a daeii ue* :: `fish CMPR TOP chicken A FORM-good COP.POL`\n\t\t* ~\"Rather than fish, the chicken is more exquisite\"\n\t\t\t* this is something you'd usually say at a dinner\n\t\t\t* it's formal\n\t\t\t* with friends, you can just say *sami ni ieii mo omoko* :: `fish TOP AUG-good CMPR chicken`\n\t\t\t\t* the copular after *ieii* is omitted here (see **8:8.7**)\n* *X dan ni Y*\n\t* From X, Y (contrast)\n\t* *ko dan ni reo iekitaen hon ji i* :: `tomorrow ABL TOP IPFV AUG-like-VBZ person LOC COP`\n\t\t* \"Starting tomorrow (unlike today), I'll be more loving towards people\"\n* *X da ni Y*\n\t* Towards X, Y (contrast)\n\t* *asasun un ni nanda da ni earranai* :: `house-1SG.POSS INSTR TOP down ALL TOP MOV-NEG-MID`\n\t\t* \"In my house, specifically in the downwards direction, don't go (up may be fine)\"\n\t\t\t* note that *nanda ji* is preferred instead of *nanda da*, since the latter is more 'poetic' than it is conversational\n\t* *so da ni hvaitei a unsunai* :: `3SG.M ALL TOP fear-PROD A live.V-MID`\n\t\t* \"Towards him, fear/monsters live\"\n* *X no ni Y*\n\t* X (phrase, clause, or adjective) (as a thing / noun), Y\n\t* *mafo no ni sa ji ue* :: `red NM TOP 3SG.F LOC COP.POL`\n\t\t* \"the red one is meant for her\"\n* *X do ni Y*\n\t* X (traverses / detaches) (at/from) Y\n\t* *jimei do ni haeku* :: `LOC-ANIM ACC TOP walk.V`\n\t\t* \"Through the land, (I) walk\"\n\t* but note that *X do ni Y* is usually never used\n\t* it's very redundant, and saying *jimei ni haeku* is actually fine 99% of the time\n\n## 9.7 Underspecified subject particle\n* In fast speech, speakers use *ga* over *a* or *o* to mark the subject\n* *ga* is not informal nor is it \"casual,\" but it is modern\n* *a* and *o* would still be used in formal or official documents, even though *ga* is the spoken variant\n* So, you'd say:\n\t* *sa ga au kambu no ng* :: `3SG.F NOM HAVE.V food.PROP NMZ FIL`\n\t\t* ~\"She has something that resembles food\"\n\t\t* ~\"She has (some) kind of food\"\n\t* *sa ga aumg kambu no ng* :: `3SG.F NOM HAVE.V-G.REVS food.PROP NMZ FIL`\n\t\t* ~\"She will get some weird food\"\n\t\t* ~\"She's going to get some type of food\"\n\t\t\t* notice: *aumg* is used\n\t\t\t* *aumg* is the proper variant of *au* used when you want to say 'get' or 'obtain'\n\t\t\t* it is only used when *ga* is also present in the sentence\n\t\t\t* otherwise, if *ga* was not present, you would use *demg*\n","10 Glossing standard.md":"## 10.1 Glossing table\n| Particle | Gloss                                   |\n| -------- | --------------------------------------- |\n| ni       | **TOP**                                 |\n| a        | **A**                                   |\n| o        | **U**                                   |\n| nai      | **MID**                                 |\n| nq       | **REVS**                                |\n| nh / n   | **G.REVS**                              |\n| te       | **INF**                                 |\n| yo       | **Q2**                                  |\n| rra      | **NEG**                                 |\n| rri      | **AFF**                                 |\n| no       | **GEN** / **NMZ** / **Q**               |\n| oe       | **N.ACC**                               |\n| do       | **PER**                                 |\n| nu       | **MOD**                                 |\n| bu       | **PROP**                                |\n| (r)u     | **V**                                   |\n| mo       | **CMPR** for comparative role           |\n| en       | **GER**                                 |\n| ake      | **IMP.DIR**                             |\n| aiko     | **IMP.POL**                             |\n| aa       | **CONC**                                |\n| ani      | **PROV-CIRC.PRIV**                      |\n| suta     | **MAX.DIM**                             |\n| nyi      | **AUG.SUP**                             |\n| sutanyi  | **MAX.DIM-AUG.SUP**                     |\n| cha      | **F**                                   |\n| che      | **M**                                   |\n| nya      | **ROMANTIC.F**                          |\n| nye      | **ROMANTIC.M**                          |\n| oi       | **MEL**                                 |\n| ta       | **PEJ**                                 |\n| (r)u     | **V**                                   |\n| nyu      | **V**                                   |\n| masu     | **AGT**                                 |\n| masumg   | **AGT-G.REVS**                          |\n| qe       | **AFF**                                 |\n| ng       | **FIL / DUM / SFP.DECL**                |\n| po       | **BESIDE**                              |\n| bo       | **AGST**                                |\n| mei      | **AN**                                  |\n| rei      | **INAN**                                |\n| hamasu   | **ANTIPROD.V.AGT**                      |\n| enai     | **GER.MID**                             |\n| yo       | **Q.POL**                               |\n| tei      | **N.PAT**                               |\n| mai      | **TR** (but use **TR.CAUS** as default) |\n| myu      | **INTIM.V**                             |\n| mya      | **INTIM.F**                             |\n| mye      | **INTIM.M**                             |\n* Others stay the same, as described\n* *yo* is now **Q.POL** and not **Q2** (old label!)\n* *ng* is a dummy if it marks *no* as nominaliser\n* Note:\n\t* *aa* also asserts what comes after it as something the two speakers are clear on\n\t* so, for example, if you say:\n\t\t* *Riwaka me rēoi fofenrra ryōe iehaeko un. Aa toshirenai me zu a fofu su ji, eu: sa riwaka me su a tohakennq. Mo mo, todesunai.*\n\t\t\t* ~\"I thought that you would not say this so casually. Even though I knew that you will say to me that she thinks that I was lying. But, the opposite happened.\"\n\t\t\t\t* this means that the listener said it **casually**, not that the listener said something other than 'she thinks that you're lying'\n\t\t\t\t* after *aa*, the statement *(...) me su a tohakennq (...)* (that I was lying) follows\n\t\t\t\t* this sets that statement as a 'fact' that can't be negated by *des* later\n\t\t\t\t* so *des* negates everything except that\n* Superlatives are **INTENS~** now\n* Interjections are **INTJ** now\n* Pronouns' proper glosses are reflected in **16:16.3**\n* The *en* particle is **GER** (gerund) now\n\t* when *-nai* appears after *-en*, *enai* is formed\n* *nyu* is an irregular particle, as it drops the *-u* in place of the next affix's vowel (if it begins with a vowel):\n\t* *nyen* :: `ROM.V.GER`\n\t* *nyoi* :: `ROM.V.MEL`\n\t* *nyuta* :: `ROM.V-PEJ` (*u* not dropped, since *ta* does not begin with any vowel)\n* It drops *n* if appearing after an affix:\n\t* *iiǵyu* :: `good-REVS.ROM.V`\n\t\t* 'to badden'\n* With *nai*, the *yai* form is used:\n\t* *iiǵyai* :: `good-REVS.ROM.V.MID`\n\t\t* 'to be baddened'\n* Also, *masumg* is used for patientives:\n\t* *pamyamasu* :: writer\n\t* *pamyamasumg* :: written work / manuscript\n* But, the preferred form is *tei* (from Ashi Tawa, glossed as `PAT` in Koyeah Tawa) suffix:\n\t* *pamyatei* :: written work\n\t* *haterotei* :: the path run on / running path\n\t* *rawatei* :: the dream\n\t* *riwakatei* :: a thought\n\t* *fofotei* :: the spoken words / speech\n* A lot of these can just take *-oe* instead:\n\t* *pamyaoe* :: the writing\n\t* *fofōe* :: speech / speaking\n\t* *riwakaoe* :: thought / thinking\n\t* *kamōe* :: an 'eat' (meal, food)\n* But *haterōe* or *rawaoe* would not imply 'running path' or 'dream,' since *oe* is a noun suffix, not patientive\n* Notes:\n\t* *masumg* is an older variant\n\t* *tei* for 'the thing that is [verb]'d'\n\t\t* e.g., *pamya* is write, then *pamyatei* is manuscript (the thing that is written)\n\t\t* if *jitei* is used, it would mean 'the location that is located' (which is fine, but preferably, one would use *jioe* over *jitei*)\n\t* *miri* as a prefix for\n\t* *oe* for simple nouns\n\t\t* if *ji* is a locative then *jioe* would be location/position/place\n* Here is a better example:\n\t* *pen* refers to a pen\n\t* *pentei* would be paper (the thing that is penned)\n\t* *penmiri* would be ink (the medium of penning)\n\t\t* *mirii pen* would just mean 'average/medium pen'\n","11 Arguments.md":"# OUTDATED\n* In **NSKT 3.3**, the voice system is quite different\n* **Do not use anything below the following as a reference**\n\n# NSKT 3.3\n## 11.1 Modifiers\n* Modifiers are used for state:\n\t* *Naiwa ue* :: `happy COP.POL`\n\t\t* ~\"I am happy\"\n* With **a/o** distinction:\n\t* *O naiwa ue* :: `U happy COP.POL`\n\t\t* ~\"I experience happiness / I am naturally happy\"\n\t* *A naiwa ue* :: `A happy COP.POL`\n\t\t* ~\"I am actively being happy / I am the actor of my happiness\"\n\t\t* ~\"I'm being happy\"\n\t\t* ~\"I'm doing something that makes me happy\"\n\n## 11.2 Verbs\n* *-nai* simply kills the direct object (not always):\n\t* *A rawanai* :: `A sleep-MID`\n\t\t* ~\"I am actively sleeping / I sleep\"\n\t\t\t* *a rawa* can be used in casual chatter\n\t* *O rawanai* :: `U sleep-MID`\n\t\t* ~\"I fell asleep / I unintentionally slept\"\n* *-nai* can be omitted in highly informal contexts:\n\t* *su a rawa*\n\t\t* can be impolite\n\t\t* between friends, it could be fine\n* Also, note:\n\t* *Su a, so o rawanai*\n\t\t* I made him pass out\n\t\t\t* you did it intentionally (making him sleep), but his sleeping was unintentional\n\t* *Su a rawamai sōe*\n\t\t* I put him to sleep\n\t\t\t* *rawamai* is the explicit transitivised form of *rawa*\n* But non-affective verbs usually don't do this:\n\t* *A fofu* :: I speak (actively)\n\t* *O fofu* :: I speak (accidentally)\n\t* *A fofunai* :: I hear (actively)\n\t* *O fofunai* :: I heard / unintentionally heard\n\t* *A hateru* :: I run\n\t* *O hateru* :: I accidentally ran\n\t* *A haterunai* :: I am intentionally run (like a program)\n\t* *O haterunai* :: I was accidentally run (like a program)\n* You could then use *haterumai* (make X run) and other forms\n* Since 'running' doesn't happen to you (you do it), it's a non-affective verb, whereas sleep is an affective verb, because it happens to you\n* Simple test for you:\n\t* I go to the store :: will *ea* be used or *eanai*\n\t* I moved the item to the store :: will *ea* be used or *eanai*\n* Here's the answer:\n\t* former sentence uses *eanai*, since **you** are going\n\t* second one uses *ea*, since it takes an object and you're doing it\n* Same for *anana*:\n\t* *Anana* (to meet)\n\t* *Su a anana saoe* :: I actively meet her\n\t* *Su o anananai saoe* :: I ran into her / accidentally met her\n\t\t* total accident\n\t* *Su o anana saoe* :: I was met by her / accidentally actively ran into her\n\t* *Su a anananai saoe* :: I actively ran into her / actively 'accidentally' ran into her\n\t\t* maybe you made it look like an accident, when it was what you wanted?\n* It's better to just use *amg* or *omg* instead of these complex combinations\n\n## 11.3 Reflexives\n* So, let's look at:\n\t* I ate myself intentionally\n\t* I accidentally ate myself\n* And translate them:\n\t* *Su a kamu* :: `1.SG A eat.PLT.V`\n\t\t* ~\"I eat (intentionally)\"\n\t* *Su a kamunai* :: `1.SG A eat.PLT.V-MID`\n\t\t* ~\"I am eaten (intentionally)\"\n\t\t\t* if no other subjects are given, it's parsed as if you said, 'I intentionally practised autocannibalism'\n\t* *Su o kamu* :: `1.SG U eat.PLT.V`\n\t\t* ~\"I eat (unintentionally)\"\n\t* *Su o kamunai* :: `1.SG U eat.PLT.V-MID`\n\t\t* ~\"I am eaten (unintentionally)\"\n\t\t\t* same logic, without more context, default parsing is that you accidentally ate yourself\n* With *koru*, the logic becomes clearer:\n\t* *Su a koru* :: I kill\n\t* *Su a korunai* :: I kill myself / I die intentionally\n\t* *Su o koru* :: I accidentally kill\n\t* *Su o korunai* :: I accidentally die / I died (unintentionally)\n* If you wanted to imply an actor:\n\t* *Su a korunamai* :: I was murdered / killed\n\t\t* *-namai* turns *koru* into a transitivised middle voice\n\t\t* so *korunai* means die, but *korunamai* means 'cause to die' (i.e., to execute or kill someone)\n\t* *Su a kamunamai* :: I was eaten (by someone)\n* Archaic or poetic constructions can be done with *-pai* (`REFL`):\n\t* *Su a kamupai* :: I eat myself\n\t\t* but it's archaic, literary, and poetic\n\n\n---\n\n## 11.1 The middle voice\n* The middle voice *-nai* can be a very difficult concept to grok, especially when you see it appearing everywhere without understanding what it does:\n\t* *Earranai* :: ~\"I did not go\"\n\t* *Earra* :: ~\"I did not move (something)\"\n\t* *Shirenai no?* :: ~\"Do you know?\"\n\t* *Shire no?* :: ~\"Did you learn?\"\n\t* *Shirenaite kamu* :: ~\"I know how to eat\"\n\t* *Shirete kamu* :: ~\"I have learnt (how) to eat\"\n* Throughout all these examples, one thing remains true:\n\t* *nai* demotes an argument from a verb\n* So:\n\t* *shire* (know) by default means to 'do knowing' of something (e.g., learn)\n\t* *ea* (move) by default means to 'move' something or it marks movement\n* With *-nai*:\n\t* *shirenai* is the knowledge possessed itself:\n\t\t* *ake shire payazun ji!*\n\t\t\t* lit. \"Do knowing (of something) for your exam!\"\n\t\t\t* ~\"Prepare for your test!\"\n\t\t\t* the object of *shire* is implied, as it is omitted\n\t\t\t* you can specify:\n\t\t\t\t* *Senodzu zu ji kiteioe ni, ake, shire paya ji!*\n\t\t\t\t\t* lit. \"I sent to you a thing, as for it, know it for the exam!\"\n\t\t\t\t\t* ~\"Prepare from what I sent you for your exam!\"\n\t* *eanai* is movement concerning the subject:\n\t\t* *to eanai asasan ji*\n\t\t\t* \"I went to her home\"\n* Same rule for infinitives:\n\t* *shirete* -> to do knowing (infinitive)\n\t\t* *shirete au poki riwakango, fuka!*\n\t\t\t* lit. \"Learn to have a big brain, please!\"\n\t\t\t\t* but this is an inaccurate translation\n\t\t\t\t* *shirete*'s direct object is omitted, so it's like saying ~'you need to study to be smart'\n\t* *shirenaite* -> to know\n\t\t* *shirenaite au poki riwakango, fuka!*\n\t\t\t* lit. \"Learn how to have a big brain, please!\"\n\t\t\t\t* no direct object, so 'learn to have a big brain' is accurate here as well\n\n## 11.2 Roles\n* **Verb valency demotion (argument reduction)**\n\t* *hari* -> exchange X in relation to Y (e.g., for)\n\t* *harinai* -> buy X (with optional context; i.e., Y)\n* **Marking intransitivity**\n\t* *shire* -> to do knowing (of) / to learn\n\t\t* *ake shire ryo!* -> learn this!\n\t* *shirenai* -> to know\n\t\t* *shirenai ryo ita no?* -> (do you) know about this?\n* **Middle voice**\n\t* *sa a koru* -> she kills\n\t* *sa a korunai* -> she dies (and it is her fault) / she kills herself\n\t* *sa o korunai* -> she dies\n* **Grammatical valency / argument demotion**\n\t* For example, take the case of *-tenai*\n\t\t* when *-te* (infinitive that must take an argument) is demoted via *-nai*, the 'clause' or 'argument' it takes is also omitted\n\t\t* so, that 'argument' becomes totally dependent on context\n\t\t* if you were having a conversation about pizza and said:\n\t\t\t* *nggggg, na a nasute eanaitenai...* :: `FIL 1PL A ability.V-INF MOV-MID-INF-MID`\n\t\t\t\t* ~\"well, we can go out (to do something)...\"\n\t\t* then it would be clear that you were talking about going out to get pizza\n\t* *Kedesurranaite ukaju aioe* :: `shame-NEG-MID-INF find.V help-N`\n\t\t* ~\"Don't feel that you're singled out to find help\"\n\t\t* ~\"Don't feel ashamed to get help\"\n\t* *Kedesurranaitenai* :: `shame-NEG-MID-INF-MID`\n\t\t* ~\"Don't feel ashamed (to get help / to do this)\"\n\t* *Eanaitenai* :: `MOV-MID-INF-MID`\n\t\t* ~\"Going out (to eat / do something)\"\n* **NOTE:** in the latest NSKT iteration, we say:\n\t* *Kedeshitenarra* :: `shame.ATTR-INF-MID.NEG`\n\t\t* ~\"Don't feel ashamed to get help\"\n\t\t\t* since *kedesu* is now *kedeso* (still sounds the same, since the last vowel is devoiced)\n\t\t\t* the romantic form would be *kedeshu*, from *kedes-* + *yu*\n\t\t\t* since *sy* is *sh*, it becomes *shu* (*s+yu*)\n\t\t\t* in some forms or depending on dialect, it may be *shu*\n\t\t\t* such forms are always pronounced with the **y** /j/ preserved:\n\t\t\t\t* ~**kedɛɕju**\n\t\t\t\t* some dialects or speakers may say **kedɛɕu**, but this is not the pronunciation used in NSKT\n\t\t\t* it follows for stuff like *oto* + *nya* :: *ocha*:\n\t\t\t\t* ~**ot͡ɕjai**\n\t\t\t* in variant spellings, you'd see stuff like *ochya*, *kedeshyu*, and *kitatashyu*, which is fine\n\t\t\t* these spellings are becoming increasingly common, even though NSKT prefers *ocha/kedeshu/kitatashu*, etc.\n* Note that:\n\t* *Kedeshi* is the attributive form; i.e., adjective form\n\t* so, a *kedeshi hon* is a person who feels singled out or ashamed or embarrassed\n\t* *Kedeshite* is 'ashamed to...'\n\t\t* the 'thing' that *kedeshi* is describing is dropped since it is usually understood from context\n\t* *Kedeshitenai* kills *te*'s ability to take something\n\t* adding *-rra* negates the whole word\n\t* so, *kedeshitenarra* means 'do not feel ashamed (to seek help),' for example\n\t* if you see it on a self-help website, maybe a hotline, your brain is almost always smart enough to do the maths\n* You often use the *tashitenai* form for other implied stative-attributives:\n\t* *Kikitatashitenai ue* :: `INTENS~like-POT.ATTR-INF-MID COP.POL`\n\t\t* ~\"This is why I'm so loveable\"\n\t\t* after you helped a woman to water, your saying this would convey 'and, that is why I'm a ladies man / that is why the ladies love me'\n* You may use it with direct verbs, though modifiers are preferred (as *itenai*/*itenarra* or *tashitenai*/*tashitenarra*):\n\t* *Kikitanatenai* :: `INTENS~like-MID.INF-MID`\n\t\t* ~\"(I am) so loved (to...)\"\n\t\t* same meaning, just a little more direct and a little less 'poetic'\n\t\t* it has less flair than *kikitatashitenai (ue)*\n\t\t* you'd usually want flair if you were trying to act all 'tough' or 'cool'\n* And, according to *nai*'s rules:\n\t* *iterranai* is less polite and more casual (than *itenarra*)\n\t* and the same follows for *tashitenairra* (more casual) (than *tashitenarra*)\n* Also, remember that:\n\t* *Kedesu* refers to general embarrassing, singling out, or shaming\n\t* *Kedeshu* refers to betraying or backstabbing, because it has intimacy baked in\n\t\t* for a friend backstabbing you, you'd use *kekedesu*\n* A rarer form is *-natenate* or *-tenate*\n* It is used to connect the previous verb taking an implied purposive with a new purposive\n* Let's say you broke a vase:\n\t* *Kedesatenai* :: (I) was ashamed (to face them / say sorry)\n* But if you say:\n\t* *Kedesaitenate oto, ya*\n\t\t* I was ashamed to say sorry and I'm just really confused / I don't know what to do, (you know)?\n\t* *-tenai* seals *kedesai* (be singled out) with the implied or relevant purposive (to say sorry)\n\t* *-te* adds an additive or new purposive *oto, ya* (for (that), I don't know what to do / I'm bewildered)\n\t* note that *kedesunatenate* would likely be more common, especially in terms of softness or cuteness/femininity\n\t* *kedesai* is less common than *kedesunai* and is an informal contraction\n\t* note that *-nai* attaches as *-ai* strictly if *-n* is omitted:\n\t\t* *kedesu* + *nai* :: informal *kedesai*\n\t\t* *kedesai* + *tenate* :: *kedesaitenate*\n\n### 11.2.1 Valency-sensitivity transitivity marking exception\n* Marking **transitivity in valency-sensitive verbs** is skipped\n\t* since *-nai* attaches to even transitive verbs when they omit their object, this can get tricky with *valency-sensitive* verbs\n* Take *fofu*, for example\n* As a verb, it means 'speak X to Y'\n* When demoted, it means 'hear X (context)' or 'ask X (context),' depending on the postposition\n\t* e.g.\n\t\t* *mo fofunai su ji, fuka* means 'then, ask me, please'\n\t\t* *mo fofunai su dan, fuka* means 'then, (why don't you) hear (it) from me, please'\n* So, if *fofu* does not take a direct object, like in:\n\t* *fofu eu...* :: speak / tell / say (that)\n* it still doesn't take *-nai*, because that would change the meaning:\n\t* *fofunai eu...* :: hear (that)... / listen (that)... / know that...\n\n### 11.2.2 Reciprocality\n* Use *pai* (`REFL`) for this:\n\t* *so a jitekupai* :: he pees himself (and it is his fault)\n\t\t* **agentive reflexive**\n\t* *so o jitekupai* :: he pees himself (accidentally)\n\t\t* **patientive reflexive**\n* They can also be used with postpositions, but require an infinitive to link them to the postposition:\n\t* *osaratepai* :: `call-INF-REFL`\n\t\t* ~\"call to (oneself)\"\n\t\t\t* bare infinitives take *-pai* directly on the verb\n\t* *tokamu motepai* :: `PFV-eat.V COM-INF-REFL`\n\t\t* ~\"(I) ate with myself\"\n\t\t\t* the postposition takes the infinitive *-te* to link it to *-pai*\n* They differ from:\n\t* *so a jitekunai* -> peeing happens by him\n\t* *so o jitekunai* -> peeing happens to him\n* Take a look at this with *kamu*:\n\t* *so a kamupai* :: he engages in autocannibalism\n\t* *so o kamupai* :: he accidentally ate himself\n\t* *so a kamunai* :: eating is done by him (and it is his fault)\n\t* *so o kamunai* :: eating happens to him\n\t\t* here, **eating happens to him** means he is eaten\n\t\t* you can state the actor:\n\t\t\t* *sa a, so o kamunai* :: `3SG.F A 3SG.M U eat.V-MID`\n\t\t\t\t* \"He is eaten by her\"\n* *pai* is better glossed `REFL.MID`\n\n### 11.2.3 Examples\n* **ex. 1 (compare)**\n\t* *ryo ni toshirenai sa dan*\n\t\t* `DEM.MED TOP PFV-know-MID 3SG.F ABL`\n\t\t\t* lit. \"As for this, (I) know from her\"\n\t\t\t* ~\"I learnt this from her\"\n\t* *toshire ryōe sa dan*\n\t\t* `PFV-know DEM.MED-N 3SG.F ABL`\n\t\t\t* ~\"(I) learnt this from her\"\n* in the former sentence, because *toshire* (learnt) takes no direct object, the *toshirenai* (know) form is used\n* **ex. 2 (compare)**\n\t* *ryo ni toshirenaimgai sa ji*\n\t\t* `DEM.MED TOP PFV-know-MID-G.REVS.MID 3SG.F LOC`\n\t\t\t* lit. \"As for this, (I) taught to her\"\n\t\t\t* ~\"(I) taught this to her\"\n\t* *toshirenaimg ryōe sa ji*\n\t\t* `PFV-know-MID-G.REVS DEM.MED-N 3SG.F LOC`\n\t\t\t* ~\"(I) taught this to her\"\n* the preferable construction is the latter one, as it avoids the *mgai* redundancy\n\t* note: *mgai* is an irregular form formed when *nai* appears after *mg* for whatever reason\n* **ex. 3 (compare)**\n\t* *sa a kedesu sōe*\n\t\t* `3SG.F A shame 3SG.M-N`\n\t\t\t* ~\"She shamed him / made him feel ashamed\"\n\t* *sa o kedesunai*\n\t\t* `3SG.F U shame-MID`\n\t\t\t* ~\"She was ashamed / felt ashamed\"\n\n## 11.3 Promotion\n* General valency or arguments can be promoted with *naimg*:\n\t* *Shirenaimg* :: teach (`know-MID-G.REVS`)\n\t\t* *Shirenaimgai sa ji* :: `know-MID-G.REVS 3SG.F LOC`\n\t\t\t* ~\"I taught (something) to her\"\n\t\t\t\t* the object is omitted\n\t* *Kanatanaimg* :: happy with / make happy (`happy-MID-G.REVS`)\n\t\t* *Asasun a kanatanaimg* :: `house-1SG.POSS A happy-MID-G.REVS`\n\t\t\t* ~\"My house makes (me) happy\"\n\t\t* *Sa a kanatanaimgai* :: `3SG.F A happy-MID-G.REVS.MID`\n\t\t\t* ~\"She is cheered up / made happy\"\n","12 Numbering system.md":"## 12.1 The ten numbers\n| Number   | IPA            | Gloss     | English number       |\n| -------- | -------------- | --------- | -------------------- |\n| **na**   | `na`           | `0`       | zero                 |\n| **su**   | `su`           | `1`       | one                  |\n| **zu**   | `zu`           | `2`       | two                  |\n| **wu**   | `wu`           | `3`       | three                |\n| **′iyo** | `ʔijo`         | `4`       | four                 |\n| **mi**   | `mi`           | `5`       | five                 |\n| **se**   | `se`           | `6`       | six                  |\n| **ki**   | `ki~ci̥`       | `7`       | seven                |\n| **rre**  | `(ɾ,r)e`       | `8`       | eight                |\n| **ni**   | `(ɲ,n)i`       | `9`       | nine                 |\n| **jou**  | `d͡ʑoʊ`        | `10`      | ten                  |\n| **mga**  | `m͡ŋa`         | `100`     | one hundred          |\n| **ga**   | `ga`           | `1000`    | one thousand         |\n| **ca**   | `cʰa`          | `10000`   | ten thousand         |\n| **awi**  | `awi`          | `100000`  | one hundred thousand |\n| **eku**  | `ɛ(k,c)(u,u̥)` | `1000000` | one million          |\n\n## 12.2 Operation\n* *jou* or other place numbers are either multiplicative or additive, depending on placement:\n\t* *zu**jou*** :: **2x10** (20)\n\t* ***ji**zu* :: **10+2** (12)\n* *′iyo* + *jou* forms *′ijou*, not *′iyojou*, so keep this in mind\n\t* it does this for other multiplicative structures too (e.g., *mga* :: *′imga*)\n* In the *jiyo* form, it wouldn't do this, so, for instance, *jiyo* + *rre* would always be *jiyorre*\n\n## 12.3 Series\n### 12.3.1 Tens\n* *jisu* :: **10+1** (11)\n\t* `/d͡ʑ(ɪ̥,ɪ)su/`\n* *jizu* :: **10+2** (12)\n\t* `/d͡ʑɪzu/`\n* *jwu* :: **10+3** (13)\n\t* `/(t͡ɕ,d͡ʑ)(w̥,ʷ)u/`\n* *jiyo* :: **10+4** (14)\n\t* `/(t͡ɕ,d͡ʑ)(i̥,i)jo/`\n* *jimi* :: **10+5** (15)\n\t* `/d͡ʑimi/`\n* *jise* :: **10+6** (16)\n\t* `/(t͡ɕ,d͡ʑ)(i̥,i)se/`\n* *jiki* :: **10+7** (17)\n\t* `/(t͡ɕ,d͡ʑ)(i̥,i)(k,k,c,c)(i,i̥,i,i̥)/`\n* *jirre* :: **10+8** (18)\n\t* `/d͡ʑi(ɾ,r,ɺ)e/`\n* *jini* :: **10+9** (19)\n\t* ``/d͡ʑi(ɲ,n)i/``\n\n### 12.3.2 Beyond the simple tens\n* Simply add *jou* to the end of the appropriate number:\n\t* *zujou* :: **2x10** (20)\n\t\t* `/zu(t͡ɕ,d͡ʑ)(u̥,u)/`\n\t* and use the *ji* form for numbers within the series:\n\t\t* *zujisu* (21)\n\t\t* *zujizu* (22)\n\t\t* *zujwu* (23)\n\t\t* *sejini* (69)\n\t\t* *nijwu* (93)\n\t\t* *nijini* (99)\n* Note that when *jou* is used as a suffix, it is usually pronounced\n\t* `/t͡ɕu̥/`\n\t\t* some speakers may pronounce it as `/d͡ʑu/`, which is fine\n* For hundredths:\n\t* *mga* (100)\n\t* *mgasu* (101)\n\t* *mgajizu* (112)\n\t* *mgajwu* (113)\n\t* *wumgajirre* (318)\n\t* *mimgasejiki* (567)\n\t* *nimgajini* (999)\n* For thousandths:\n\t* *ga* (1,000)\n\t* *gasu* (1,001)\n\t* *gajizu* (1,012)\n\t* *gamgajizu* (1,112)\n\t* *ganimga* (1,900)\n\t* *ganimganijini* (1,999)\n\t* *ganimgajini* (1,990)\n\t* *migajise* (5,016)\n\t* *migawujise* (5,316)\n\t* *niga* (9,000)\n\t* *nigami* (9,005)\n* For ten thousandths:\n\t* *ca* (10,000)\n\t* *casu* (10,001)\n\t* *cajisu* (10,011)\n\t* *cazujwu* (10,023)\n\t* *camga* (10,100)\n\t* *ca′imgasejini* (10,469)\n\t* *camimga* (10,500)\n\t* *camimgasu* (10,501)\n\t* *camimgajisu* (10,511)\n\t* *camimganijini* (10,599)\n\t* *canimga* (10,900)\n\t* *caga* (11,000)\n\t* *caniga* (19,000)\n\t* *zuca* (20,000)\n\t* *wuca* (30,000)\n\t* *sejinica* (69,000)\n\t* *sejinica′imgazujou* (69,420)\n\t* *nica* (90,000)\n* For one hundred thousandths:\n\t* *awi* (100,000)\n\t* *awisu* (100,001)\n\t* *awiki* (100,007)\n\t* *awijisu* (100,011)\n\t* *awikijiwu* (100,073)\n\t* *awimga* (100,100)\n\t* *awinimga* (100,900)\n\t* *zawi* (200,000)\n\t\t* for 200,000-900,000, the series are as follows:\n\t\t\t* *zawi* (200,000)\n\t\t\t\t* *zawinimganijini* (200,999)\n\t\t\t* *wawi* (300,000)\n\t\t\t* *yawi* (400,000)\n\t\t\t* *mawi* (500,000)\n\t\t\t* *sawi* (600,000)\n\t\t\t\t* *sawinicasega-nimgasejini* (696,969)\n\t\t\t\t\t* *sawinicasega* is 696,000\n\t\t\t\t\t* *nimgasejini* is 969\n\t\t\t* *kawi* (700,000)\n\t\t\t\t* *kawinica* (790,000)\n\t\t\t\t* *kawinica-nijini* (790,099)\n\t\t\t* *rrawi* (800,000)\n\t\t\t\t* *rrawiga* (801,000)\n\t\t\t* *nawi* (900,000)\n\t\t\t\t* *nawi-nigani* 909,909\n* For millionths:\n\t* *eku* (1,000,000)\n\t* *ekusu* (1,000,001)\n\t* *zeku* (2,000,000)\n\t\t* *eku* also has forms like *awi*:\n\t\t\t* *zeku* (2,000,000)\n\t\t\t* *weku* (3,000,000)\n\t\t\t* *yeku* (4,000,000)\n\t\t\t* *meku* (5,000,000)\n\t\t\t* *seku* (6,000,000)\n\t\t\t* *keku* (7,000,000)\n\t\t\t* *rreku* (8,000,000)\n\t\t\t* *neku* (9,000,000)\n\t\t\t* *jeku* (10,000,000)\n\t\t\t\t* pronounced ~`/(t͡ɕ,d͡ʑ)(ɛ̥,ɛ)(k,c)(u,u̥)/`\n\t\t\t* *mgeku* (100,000,000)\n\t\t\t\t* pronounced ~`/m͡ŋɛ(k,c)(u,u̥)/`\n\n## 12.4 Format\n* The format for writing the compounds for numbers is as follows:\n\t* `[PARENT]-[CHILD]'([CHILD2])...)`\n\t\t* let's apply it to *sawinicasega-nimgasejini*:\n\t\t\t* *sawi* :: parent (600K)\n\t\t\t* *nica* :: child descriptor 1 (90,000)\n\t\t\t* *sega* :: child descriptor 2 (6,000)\n\t\t\t* *nimga* :: parent 2 (900)\n\t\t\t* *sejini* :: child 1 of p2 (69)\n\t\t\t\t* *sejini* cannot be broken down further\n\t\t\t\t* *jini* alone means 19\n\t\t\t\t* *se* just means 6\n\t\t\t\t* if interpreted literally, this would be 619, but according to the rules of the system as previously described, *sejini* is 69\n\t\t\t\t\t* the pattern is **X-ji-Y**, where *X-* is the first tenth and *-Y* is the final\n\t\t\t\t\t* **-ji-** just connects *X-* to *-Y*\n\t\t\t* here:\n\t\t\t\t* *sawi* takes *nica, sega* as children\n\t\t\t\t* *nimga* takes *sejini* as a child\n\t\t\t* so:\n\t\t\t\t* *sawi-nica'sega nimga-sejini*\n\n## 12.5 Morphosyntactic category\n* A number can be:\n\t* **cardinal**\n\t\t* `number [appropriate linking particle] (...)`\n\t\t\t* in sets, *no* is used (X's Y / Y of X)\n\t\t\t\t* *watada... jou no zu no ni ii ue...*\n\t\t\t\t\t* only... two of/from the ten are good\n\t\t\t* for approximate quantities, *-bu* is used\n\t\t\t\t* *nggg, zubu... no?*\n\t\t\t\t\t* like... (is it) two-ish?\n\t\t\t* for exact quantities, *-te* is used\n\t\t\t\t* *kite nigo*\n\t\t\t\t\t* seven cats\n\t* **ordinal**\n\t\t* `([appropriate determiner]) number ([nu]) (...)`\n\t\t\t* usually, *ryo* is used unless the distal (*lyo*) or proximal (*byo*) aspect has to be emphasised\n\t\t\t\t* *ryo wan nigo ni subunai, fuka!* :: `DEM.MED one cat TOP desire.V-MID`\n\t\t\t\t\t* ~\"I want the first cat, please!\"\n\t\t\t* otherwise, *-nu* can be used to assign the number as a fixed property or title\n\t\t\t\t* *subute arenenai nemusunoe zhi byo... wannu nigo a ushikitsurra ue* :: `desire.V-INF change-MID decide-1SG.POSS-N TEMP DEM.PROX one-MOD cat A fun-NEG COP.POL`\n\t\t\t\t\t* ~\"Never mind, the first cat wasn't all that fun\"\n\t\t\t\t\t* lit. \"(I) want to change my mind now, first cat is not fun\"\n\t\t\t\t* *kinu nigo* :: `seven-MOD cat`\n\t\t\t\t\t* \"The seven-cat\"\n\t\t\t\t\t\t* maybe it has seven paws\n\t\t\t\t\t\t* maybe this cat is a part of a band named *ki* (seven)\n\t\t\t\t\t\t* or maybe you just want to vaguely characterise it by the number seven\n\t\t\t\t\t* \"The seventh cat / cat #7\"\n\t* **nominal**\n\t\t* `number + (vowel)n`\n\t\t\t* a doubled vowel plus *n* at the end of a number makes it a proper noun representing the digit\n\t\t\t\t* *kiwinq aiko! jiennai wan-zūn-kīn-awīn...* :: `continue-REVS IMP.POL LOC-VBZ-MID one-two.N-seven.N-one.hundred.thousand.N`\n\t\t\t\t\t* ~\"Wait! (I'm) putting (the number) 1-2-7-100,000 (in)...\"\n\n### 12.5.1 Unmarked modification\n* Especially after Tanji (including both Native Tanji and Kanji relexifications), numbers can function similarly to the English borrowed affixes like **mono**, **bi/di**, etc.:\n\t* *pan* (bread) + *zu* (two) :: *panzu* (sandwich)\n\t* *panwu*, similarly, would be a clubhouse sandwich\n* Ashi Tawa prefixing for numbers is no longer used, so:\n\t* *Nyanguzu* :: `ROM.F-SRC.LEX-two`\n\t\t* lit. \"bi-gendered romance\"\n\t\t\t* *nyangu* refers to romantic gender (sexual attraction)\n\t\t\t* *zu* means 'two'\n\t\t\t* together, this means 'two romantic genders' or 'bisexual'\n\t* is used instead of older constructions\n\t* You could also stack Tanji:\n\t\t* *Manyangu* :: `three.drops.of.water-ROM.F-SRC.LEX`\n\t\t\t* lit. \"three drops of water romantic gender\"\n\t\t\t* ~\"Fluid sexuality\"\n\t\t\t\t* it can refer to pansexuality or sexualities that aren't consistent / rigid\n* **Note:**\n\t* sexuality terms in Tawa are modern approximations\n\t\t* you'd use them in modern discourse if required, otherwise you usually never would\n\t* in Tawish culture, sexuality is not recognised as a social construct (i.e., a gay man simply *is*, and he is not put into a 'label' known as a gay)\n\n## 12.6 Irregular number\n* The most irregular number is one\n* It has two forms:\n\t* *su*\n\t* *wan*\n* *wan* can be used as a verb, noun, cardinal, ordinal - you name it\n\t* *so we sa ni su a wanunai* :: `3SG.M ADD 3SG.F TOP 1SG A unite.V-MID`\n\t\t* lit. \"As for him and her, I united (them)\"\n\t\t* ~\"I (was the one that) united him and her\"\n* *su* can only be used as a digit noun, cardinal, and ordinal\n* However, depending on the following cases, you'll have to choose *wan* over *su* or vice versa:\n\t* **digit proper nouns**\n\t\t* *wan* is used\n\t\t\t* *wan, zūn, wūn* (one, two, three)\n\t* **cardinals**\n\t\t* *wan* is used both in sets (with *no*) and approximates (*wambu*)\n\t\t* for exact quantities (with *-te*), *su* is used (*sute*)\n\t\t\t* *sute nigo* (one cat)\n\t* **ordinals**\n\t\t* *wan* is used (e.g., **ryo wan**)\n\t\t\t* *ryo wan nigo* (the first cat)\n\n## 12.7 Shorthand number compounds\n* Instead of complex number compounds, such as *sawi-nica'sega nimga-sejini* (696,969), you can:\n\t1. **break them up into digestible chunks**\n\t\t* *696,969* becomes *69-69-69*:\n\t\t\t* *sejini-sejini-sejini* (sixty-nine-sixty-nine-sixty-nine)\n\t\t\t* *sejini no wūn* (three of sixty-nines)\n\t\t\t* *wute sēnjinīn* (three sixty-nines)\n\t\t\t* *wute sēn-nīn* (three six-nines)\n\t\t\t\t* better to avoid this; it can be ambiguous\n\t2. **nominalise**\n\t\t* you can use *oe*, *no*, and the standard digit nominalisation methods:\n\t\t\t* *wute sēnjinīn* :: three sixty-nines\n\t\t\t* *wute sējinīn* :: three sixty-nines\n\t\t\t\t* both are fine, they vary speaker-to-speaker\n\t\t\t\t* this is the formal and polite method\n\t\t\t\t* you'd use this with strangers, higher-ups, sometimes even your elders\n\t\t\t* *wute sejinioe* :: three sixty-nines\n\t\t\t\t* less preferable than formal nominalisation\n\t\t\t\t* if saving time, this can be used\n\t\t\t\t* it is polite but slightly less formal than the former method\n\t\t\t* *wute sejini no* :: three sixty-nines\n\t\t\t\t* most informal method\n\t\t\t\t* can be jarring or impolite to strangers\n","13 Advanced grammar.md":"## 13.1 Topic-comment structure\n* Generally, this structure is used for complex thought:\n\t* `TOPIC COMMENT (CLAUSE / OPINION)`\n\t\t* *Subeki ryo komunishimg ni ieiukonq, riwakanai* :: `all.ATTR DEM.MED policy-unit-G.REVS TOP AUG-sound-REVS think-MID`\n\t\t\t* lit. \"All this policy, as for (it), unsounder, think\"\n\t\t\t* ~\"I think that all of these policies are quite unfair\"\n* Examples:\n\t* *Sa no ni, hakuhwo i no?* :: `3SG NMZ TOP real-essence COP Q`\n\t\t* lit. \"As for her, the reality is...?\"\n\t\t* ~\"How serious are you about her?\"\n\t\t\t* *sa no* is used to turn *sa* (she) into an entire 'person'\n\t\t\t* saying *sa ni hakuhwo...* could be rude/degrading, since you're treating *sa* as a 'part' of a 'whole'\n\t* *Yada, fofu no?* :: `so speak.V Q`\n\t\t* lit. \"So, speak?\"\n\t\t* ~\"Well, then do you wanna talk?\"\n\t\t* ~\"We should talk\"\n\t\t* ~\"Come on, I think we should talk\"\n\t\t\t* you can drop entire clauses, postpositional phrases, or purposives as long as context makes it clear\n\t* *Ngggg, hakunu no?* :: `FIL real-MOD Q`\n\t\t* lit. \"Hmmm, really?\"\n\t\t* ~\"Hmmmm, is that true?\"\n\t\t* ~\"Are you sure?\"\n\t\t* ~\"You for real?\"\n\t\t\t* *hakui* is avoided since *hakui no* is actually a nominalised adjective, meaning 'the truthful thing / the real thing / thing of reality'\n\t\t\t* this is a rule for attributives\n\t\t\t* *-nu* does not form this with *no*\n\t\t\t* so instead of *hakui no yo?* (not preferred), you say *hakunu no?*\n\t\t\t\t* the former reads more literal, whereas the latter is more fluent and natural\n\t* *Zu a fofu no ni, arene i, toshire* :: `2SG A speak.V NMZ TOP different COP PFV-learn`\n\t\t* lit. \"You said (as a thing), different is, learnt\"\n\t\t* ~\"I realised that what you said is different\"\n\t\t* ~\"I've learnt that what you said was different\n* Ashi Tawa's backshift *hi* is not a bound morpheme and is usually written with a hyphen or freeform\n* In the case of *seka* (so/that way), *hi* makes the previous clause a 'reason:'\n\t* *Damiite ieinashitang seka hi..*\n\t\t* ~\"So that it is easier to heat it up...\"\n\n### 13.1.1 Experience or judgement\n* Compare:\n\t* *Su ni, lyo a toii ue, riwakarranai* :: `1SG TOP DEM.DIST A PFV-good COP.POL think-NEG-MID`\n\t\t* lit. \"As for me, that was good, (I) don't think so\"\n\t\t* ~\"I don't think that did good regarding me\"\n\t* *Su ni, lyo o toii ue, riwakarranai* :: `1SG TOP DEM.DIST U PFV-good COP.POL think-NEG-MID`\n\t\t* lit. \"As for me, that didn't undergo good, (I) don't think so\"\n\t\t* ~\"I didn't think that was good\"\n* So, what's the difference? Let's look at a simpler sentence:\n\t* *Lyo (a/o) toii, riwakanai* :: `DEM.DIST A/U PFV-good think-MID`\n\t\t* ~\"That was good, I think\"\n* Dissecting it...\n\t* *lyo a toii, riwakanai*\n\t\t* that (thing) is good (as a property of it), I think\n\t\t* the comment *toii* is a property of *lyo*\n\t\t* you're judging *lyo*, the thing, itself\n\t* *lyo o toii, riwakanai*\n\t\t* that (thing) suffers good / is good, I think\n\t\t* the comment is about undergoing or experiencing *toii*\n* Look at it in another example:\n\t* *sa o ii* :: `3SG.F U good COP.POL`\n\t\t* ~\"She is good\"\n\t\t\t* here, *o ii* implies:\n\t\t\t\t* she's naturally a good person\n\t* *sa a ii* :: `3SG.F A good`\n\t\t* ~\"She is good\"\n\t\t\t* here, *a ii* implies:\n\t\t\t\t* she's making a conscious effort of being good\n\t\t\t\t* she is continuously 'being good'\n\n### 13.1.2 Anaphoric negation\n* Please see **17 Anaphoric Reference**\n\n### 13.1.3 Copular predicates\n* The copula can carry predicates\n* For example:\n\t* *so ni sarei i* :: `3SG.M TOP 3SG.F-INANIM COP`\n\t\t* lit. ~\"As for him, dead she is\"\n\t\t* ~\"She's dead to him\"\n\t\t\t* more idiomatically, it reads as 'he does not think she deserves to be acknowledged as a living person'\n* If you were to try to translate it directly from English:\n\t* *so ni sa ga sarei i* :: `3SG.M TOP 3SG.F NOM 3SG.F-INANIM COP`\n\t\t* ~\"To him, she is who is a dead she\"\n\t\t\t* a literal, descriptive fact\n\t\t\t* it treats her as a living subject (due to *sa*) who is an inanimate subject (*sarei*)\n* The latter is redundant and much less punchy or hurtful than *so ni sarei i*, because the former uses an inanimate pronoun\n* More examples:\n\t* *so ni su i, riwakanai* :: `3SG.M TOP 1SG COP think-MID`\n\t\t* ~\"He acknowledges me, I think\"\n\t\t\t* recommended to construct it as *so ni su inai, riwakanai*\n\t\t\t\t* this is like saying 'as for him, I (do) happen, I think'\n\t\t\t\t* the former one is like saying 'as for him, I am, I think'\n\t* *to, byo asa i* :: `PFV DEM.PROX house COP`\n\t\t* lit. \"Was, here house is\"\n\t\t* ~\"There used to be a house over here\"\n\t* *toii* :: `PFV-good`\n\t\t* lit. \"Was good\"\n\t\t* ~\"(I) was good\"\n\t\t\t* *ii* ends in *i* and is already a strong modifier\n\t\t\t* it does not need take the copular\n\t\t\t* depending on context, *toii* can mean:\n\t\t\t\t* that was good\n\t\t\t\t* I was good\n\t\t\t\t* she was good\n\t\t\t* ... etc.\n\t* *wurei inai zhi byo* :: `3SG-INANIM COP-MID TEMP DEM.PROX`\n\t\t* lit. \"Dead-they happened when here\"\n\t\t* ~\"They are dead now\"\n\t\t\t* note, *byo* (proximal demonstrative) is used like the English 'now' when appearing after *zhi*\n\t\t\t\t* similar to how *lyo* (distal demonstrative) is used like the English 'back then' / 'then' when appearing after *zhi*\n\t\t\t* it does not mean 'just now,' it just refers to current time\n\t\t\t* for 'just now:'\n\t\t\t\t* *wurei he inai* :: `3SG-INANIM RECP COP-MID`\n\t\t\t\t\t* ~\"They just died\"\n* Note that these sentences can be highly offensive, especially due to the inanimate pronouns\n* It is better to avoid saying things so directly:\n\t* *Wu ni Jamuiku ga osaratepai* :: `3SG TOP one.god-HON NOM call-INF-REFL LOC`\n\t\t* ~\"They were called by God to Himself\"\n\t\t* even here, *jamuiku ga* is not preferable\n\t\t* see **13.12**\n\n### 13.1.4 Double subjects\n* In Tawa, we use *X a/o/ni/ga Y a/o/ga X* instead of the rarely used 'X is Y' (or with have/possessives) for these constructions\n* Examples:\n\t* *Tomoe ni gaya ga ritari* :: `fox TOP body NOM soft.ATTR`\n\t\t* lit. \"As for foxes, (their) body is soft\"\n\t\t* ~\"Foxes have soft bodies\"\n\t* *So no ga kari o osaranate Jamuiku* :: `3SG.M NMZ NOM father U call-MID.INF one.god-HON`\n\t\t* lit. \"It is he who's father was called to God\"\n\t\t* ~\"His father was called to God (i.e., passed away)\"\n\t\t* but, it is better to say:\n\t\t\t* *Karison o osaranate Jamuiku* :: `father-1SG.M.POSS U call-MID.INF one.god-HON`\n\t\t\t* ~\"His father was called to God\"\n\t\t\t* pronominal possessors are used over *pronoun a/o/ni/ga X...* (exception to the general rule)\n\t* *Maika ni hana ga napii* :: `mica TOP nose NOM thread-ATTR`\n\t\t* lit. \"As for Mica, (his/her) nose is a line/threaded\"\n\t\t* ~\"Mica's nose is long\" (i.e., he is a liar)\n\t\t\t* when you describe something as *napii*, it means that it has line qualities; e.g., length\n\n## 13.2 Clausal actors\n* A whole predicate can be an 'actor:'\n\t* *kanatashimg makure a fofu hakuhwōe* :: `word-POT.ATTR-G.REVS emotion A speak.V real-essence-N`\n\t\t* lit. \"Wordable emotion speaks truth\"\n\t\t* ~\"Emotions that can't be put into words are the most truthful / genuine\"\n\t\t\t* notice: *tasu* + *mg* forms *tasumg* (negative potential)\n\t\t\t* *tasu* + *i* forms *tashi* (potential attributive)\n\t\t\t* *tasu* + *i* + *mg* forms *tashimg* (negative potential attributive)\n\t\t\t* since *i* (the attributive) can't take *mg*, *mg* grammatically reverses *tasu*\n\t\t\t* this is an exception you have to remember\n\n## 13.3 Clausal modification\n* *no*, the genitive, can be used to modify clauses:\n\t* *Jijinu makure no futasumg kana ji a fofu hakuhwōe imnyi hon*\n\t\t* `INTENS~LOC-MOD emotion GEN ACT-POT-G.REVS word LOC A speak.V real-essence-N SIM.AUG.SUP person `\n\t\t* lit. \"Undoable in words of absolute emotion speaks reality the same as a person\"\n\t\t* ~\"Emotions that cannot be put into words are the very things that tell the truth of what it means to be human\"\n\t\t\t* *hakuhwōe imnyi hon* means 'reality the same as a person' (i.e., what it means to be human)\n\t\t\t* here, *jijinu makure* is a phrase meaning 'exact/precise emotion'\n\t\t\t* *no* after *jijinu makure* allows it to modify *futasumg kana ji* (undoable in words / cannot put into words)\n\t\t\t* so *jijinu makure no futasumg kana ji* means 'precisely the emotions that cannot be put into words'\n\t\t\t\t* more literally: **precise emotions' undoable/undoability in words**\n\n## 13.4 Postpositional infinitives\n* Verbs like *ea* hate postpositions in their middle voice form:\n\t* *eanaite kamu* :: (I) go out to eat\n\t\t* but if you said:\n\t\t\t* *eanai kam**u** ji*\n\t\t* then this doesn't parse well because *kamu* is a verb (to eat)\n\t\t* you'd use *eanai kam**en** ji* (I went out for eating)\n\t\t\t* this is formal, and not something you'd say with a friend or acquaintance\n\t\t* you could also say *eanai kamu un ji* (I went for at eating), which is grammatically correct, **but its a bit like saying something like such as similar to like what I just said**\n* *-te* is especially even more preferable when you need to use a clause as the purposive of another:\n\t* *Tosubute eanai hariasa jite nirunaimg ryo honoe, lyo atora ji* :: `PFV-desire.V-MID MOV-MID exchange-house LOC-INF show.V-MID-G.REVS DEM.MED person-N DEM.DIST apple LOC`\n\t\t* ~\"I waned to go to the store to show this person that apple over there\"\n\t\t\t* here, *ji* marks *tosubute eanai hariasa* as the purposive, and *te* attributes it to *niru ryo honoe lyo atora ji*\n\n## 13.5 Demonstratives and postpositions\n* Use *un* for location of action:\n\t* *urukuennnai lyo un* :: `stand-VBZ-MID DEM.DIST INSTR`\n\t\t* ~\"Standing over there\"\n* Use *ji* for location of existence:\n\t* *urukuennai lyo ji* :: `stand-VBZ-MID DEM.DIST LOC`\n\t\t* ~\"Standing in (over) there\"\n* Or omit the case and let context do the work, since *uruku* by default accepts another argument that describes the **where**:\n\t* *urukuen byōe* :: `stand-VBZ DEM.PROX-N`\n\t\t* ~\"Standing here\"\n\t* *urukuen ryōe* :: `stand-VBZ DEM.MED-N`\n\t\t* ~\"Standing at this point / there (near us)\"\n\n## 13.6 **au** constructions\n* *au* affects the subject, but it is never marked with *-nai*, since it is irregular\n* Partially, this is a reason that *o* is used over *o* with *au* if *au* is marking existence, like:\n\t* *O au sa...* :: `U HAVE.V 3SG.F`\n\t\t* ~\"I have her...\"\n* But *a* is used if this 'existence' becomes active:\n\t* *Su a reoau subeko no mani hiroga do* :: `1SG A HAVE.V all GEN money world PER`\n\t\t* ~\"I will get all the money in the world!\"\n\t* *Su a subute au epikui tahete!* :: `1SG A desire.V-INF HAVE.V epic-ATTR electronic`\n\t\t* ~\"I want to get an epic electronic\"\n* You can also use *ni* without *a*:\n\t* *ngoshi ni au kamo* :: the bird has food\n* But as soon as you want to say 'get,' you use *a*:\n\t* *ngoshi a au kamo* :: the bird gets / obtains food\n* Or you could use the modern / informal term *demg*:\n\t* *ngoshi ni demg kamo* :: the bird gets food\n\t\t* *demg* (formerly *denh*) is formed from *de*, which is the receiving relational, and the grammatical reverser *-mg*\n\t\t* *aumg* is the proper Koyeah Tawa variant, but *aumg* can only be used with *ga*\n\t\t\t* use *demg* when you also aren't using *ga*\n\t\t\t* use *aumg* when you are using *ga*\n* Here are some constructions where *au* does something unique:\n\t* *Sa o au iitasu* :: `3SG.F U HAVE.V good-POT`\n\t\t* lit. \"She has goodability\"\n\t\t* ~\"She might be good ((after all), you never know)\"\n\t* *Shirerranai, ya! So o au korumasutasu* :: `know-NEG-MID ASSERT | 3SG.M U HAVE.V kill.V-AG-POT`\n\t\t* ~\"I don't know! He might be a killer for all you know\"\n\n## 13.7 Mood copular constructions\n* Also a part of advanced grammar, the mood copular constructions, such as:\n\t* *itai*\n\t* *iare*\n\t* *inatai*\n\t\t* want / simply long, less stronger due to diminutive *-suta*\n\t* *irranatai*\n\t\t* note: *nai* drops the *i* when pairing with *atai*, which drops its *a*\n\t\t* the copular also connects to *atai* as *itai*, where *atai* drops the *a*\n* ... are used for highly romantic or emotional constructions\n* For example:\n\t* *zu ni su mo inatai anano?* :: `2SG TOP 1SG COM COP-MID.DES AFFEC-Q`\n\t\t* ~\"Do you emotionally long for us to be together?\"\n\t\t* ~\"I want you and me to be together\"\n\t\t\t* but its more emotional than that\n\t* *zu ni su mo iare no?* :: `2SG TOP 1SG COM COP-OPT Q`\n\t\t* ~\"Don't you wish that we were together?\"\n\t\t* ~\"Shouldn't we be together?\"\n\t\t* ~\"Isn't it better if we were together?\"\n\t\t* ~\"Ever wish that you and I were together?\"\n\n## 13.8 Determiners\n* The default `DET no / DET-ATTR/MOD ng` construction resolves to:\n\t* **DET-thing**\n* So if you said *subeki ng*, it would mean:\n\t* **everything**\n* If you want to say 'rest of...' you'd actually use:\n\t* *arenki* (the others / rest of)\n\n### 13.8.1 **Many** and **some**\n* **Pattern**\n\t* `myo no X` = many X\n\t\t* `mymyo no X` = most (of) X\n\t* `myomg no X` = some X\n\t\t* `mymyomg no X` = least (of) X\n* Examples:\n\t* *Myo no atora* :: many apples\n\t* *Myomg no atora* :: a few / some apples\n* Casually:\n\t* *myi* and its variants are used\n* As an augmentative:\n\t* *Nuko ni tawa funai ya, iemyi we iemyi* :: `heart TOP progress ACT-MID ASSERT AUG-MANY.ATTR ADD AUG-MANY.ATTR`\n\t\t* ~\"The heart evolves (you know?), more and more\"\n\t* *myimg hateru* :: run a little\n\t* *iemyimg hateru* :: run less\n* Don't use it to mean 'enough,' *yadoi* or *yadoeta*:\n\t* *watada niren saoe ga (myi) yadoi ue* :: `just see.GER 3SG.F-N NOM (MANY.ATTR) well.N-MEL COP.POL`\n\t\t* ~\"Just watching her is (much) remarkable\"\n\t\t\t* *myi yadoi* would explicitly say 'is enough / beautiful enough (to not want more)'\n\t\t\t* it is usually omitted since context communicates it or *ieyadoi/ieyadoeta* is used\n\t\t\t* you'd use *yadoeta* if it was negative\n\n### 13.8.2 **Any** and **little**\n* **Pattern for any**\n\t* `we no X` = any (of) X\n\t\t* *byo ji ni we no ng i*\n\t\t\t* ~\"you can find anything here\"\n\t\t* *earranaite we no ng*\n\t\t\t* ~\"I'm not going anywhere\"\n\t* `wewe no X` = every nook and cranny of X\n\t* `wemg no X` = none (of) X\n\t\t* *byo ji ni wemg no ng i*\n\t\t\t* ~\"there is nothing here\"\n\t\t* *eanaite wemg no ng*\n\t\t\t* ~\"I'm going to the middle of nowhere\"\n\t\t\t* ~\"I'm going to a place nobody knows about\"\n\t\t\t* ~\"Where I'm going is none of your business\"\n\t* `wewemg no X` = not a single trace of X\n* **Pattern for little**\n\t* `lili no X` = a little X\n\t\t* e.g., *lili mani no X* = poor/impoverished X\n* Casually:\n\t* *lilii* is used\n\t* *wenu* is used\n* Note that *we ng* (casually contracted as *weng*) means 'and (among others)'\n* If you said 'I'm lonely because of X,' you may add *weng* to hint at other reasons\n\n### 13.8.3 **Wh-ever** words\n* **Whatever, whichever, whenever, wherever**\n\t* `we no ng` (whatever/whichever)\n\t\t* *fu we no ng* :: do whatever\n\t\t* *kamu we no ng* :: eat whatever/whichever\n\t* `zhi we no ng` or `we no wanō` (whenever)\n\t\t* *kamu zhi we no ng* :: eat whenever/anytime\n\t\t* *fu yaranai, we no wanō* :: do come, anytime\n\t* `-te/(jite) we no ng` (wherever)\n\t\t* *kamute we no ng* :: eat wherever\n\t\t* *haterunaite we no ng* :: run wherever\n\t\t\t* note: *haterunai* is used because *hateru* means **to trample**\n\t\t\t* so:\n\t\t\t\t* *sorama a hateru sōe* :: rain trampled over him / ran him over\n\t\t\t\t* *sorama a haterunai* :: the rain runs\n\t\t\t\t* *sa a haterunaite sōe* :: she ran after him\n* The same patterns are used for:\n\t* **anyone, anything, anywhere, anytime**\n* Casually:\n\t* use *wenu ng* or *wenu X*\n\n### 13.8.4 **Every** and **all**\n* **Patterns for every and all**\n\t* `subeko no X` :: all (of) X\n\t\t* *subeko no wanō* :: eternity / forever (literally 'all of time')\n\t\t\t* cf. *we no wanō* :: anytime\n\t\t* *subeko no hon* :: all humans\n\t\t* *subeko no kitei* :: all things\n\t* `subeki X` :: every X\n\t\t* *subeki ribu* :: every book\n\t\t* *subeki hon* :: every human\n\t\t* *subeki kitei* :: everything\n\t* `subekinu X` :: all pertaining to X\n\t\t* *subekinu ribu* :: anything related to books (e.g., pens and paper)\n\t\t* *subekinu hon* :: anything related to humans (e.g., life, organs)\n\t\t* *subekinu chi* :: anything related to water (e.g., liquid, drinks, solvent, cups)\n\n## 13.9 Occurrence\n* The middle voice form of *fu* (*funai*) is used to denote the 'happening' of an event:\n\t* *Itagi o funai* :: `idea U ACT-MID`\n\t\t* ~\"An idea occurred\"\n\t\t* ~\"An idea actualised\"\n* It is particularly useful in constructions like\n\t* *Su ni itagi o funai* :: `1SG TOP idea U ACT-MID`\n\t\t* lit. \"As for me, an idea actualised\"\n\t\t* ~\"I just thought of something\"\n\t\t* ~\"I have an idea\"\n\t\t\t* you can omit *su*:\n\t\t\t\t* *a, itagi o funai* :: `A idea U ACT-MID`\n\t\t\t\t\t* depending on context, *a* can mean 'I/me'\n* Compare with *inai*:\n\t* *Su ni itagi inai* :: `1SG TOP idea COP-MID`\n\t\t* ~\"An idea exists for me / an idea is being for me\"\n\t* *Itagi inai* :: `idea COP-MID`\n\t\t* ~\"An idea exists\"\n\t\t* ~\"An idea happens\"\n\n## 13.10 Usage of **ga**\n* *ga* marks the subject of a sentence\n* It is used in place of *a* or *o* in fast speech\n\t* in spoken language, *ga* **does not** feel informal nor impolite\n* It is not as commonly used in written language, unless between close friends\n\t* in written language, substituting *a/o* (and sometimes even *ni*, though that could be incorrect) for *ga* **does** feel very informal and impolite (to strangers or elders)\n\t\t* so, saying:\n\t\t\t* *ryo ga ii* (this is good)\n\t\t\t* *su ga kamu* (I eat)\n\t\t* can be impolite or jarring in written form\n\t\t* even for complex sentences:\n\t\t\t* *Kamen ga, su o rawaretanai*\n\t\t\t* *Motore ga, o rawanq zhi kamen*\n\t\t* there, you would use respectively:\n\t\t\t* *kamen a*\n\t\t\t* *motore a*\n* It is not a dummy pronoun:\n\t* *a, itagi o funai* :: I had an idea\n\t\t* the actor before *a* is omitted if context is clear\n\t* *ga, itagi o funai* :: the idea which happened...\n\t\t* incomplete sentence\n\t\t* comma is misleading and feels jarring to parse as well\n* It can promote topics to subjects (poetic and literary):\n\t* *Sa ni, wan niro o nirutashimgai ga naiwanqtasu* :: `3SG.F TOP one eye U see.V-POT.ATTR-G.REVS.MID NOM happy-REVS-POT`\n\t\t* lit. \"As for her one eye suffering non-seeing-ability able to sadden\"\n\t\t* ~\"The fact that she can't see in one eye makes me sad\"\n\n### 13.10.1 **ga** stacking with other particles\n* This is where *ga* shines\n* It can exist with *a* and *o* to layer meaning\n* For example:\n\t* *Kamen ga su o rawaretanai* :: `eat.VBZ NOM 1SG U sleep-RESL-MID`\n\t\t* ~\"Oops, eating made me pass out\"\n\t\t\t* or just drop the pronoun:\n\t\t\t\t* *kamen ga, o rawaretanai*\n\t\t\t\t\t* ~\"Oops, eating made (me) pass out (unintentionally)\"\n\t* *Kamen ga rawareta suoe* :: `eat.VBZ NOM sleep-RESL 1SG-N`\n\t\t* ~\"Eating ended up making me sleep\"\n\t\t\t* and you can drop *suoe*:\n\t\t\t\t* *kamen ga rawareta*\n\t\t\t\t\t* ~\"Oops, eating made me sleep\"\n\t\t\t\t\t* here, intent (intentionality) is underspecified, since no *a* or *o* exists to hint at it\n* Here is a slightly more complex sentence:\n\t* *Su a rawanqpai moto mo zhi kamen* :: `1SG A sleep-REVS-REFL strength COM TEMP eat.VBZ`\n\t\t* lit. \"My strength and I stayed awake whilst eating / I stayed awake with strength when eating\"\n\t\t* ~\"It took strength to stay awake when eating\"\n* But more naturally, you'd say:\n\t* *Motore ga, o rawanq zhi kamen* :: `strength-inner NOM U sleep-REVS TEMP eat.VBZ`\n\t\t* lit. \"Inner strength naturally made stay awake (me) when eating\"\n\t\t* ~\"The inner reserve of strength is what kept me awake when eating\"\n\t\t\t* here, *o rawanq* is like saying 'my inner strength just naturally makes me stay awake'\n\t\t\t* if it's more about strength needed to stay awake:\n\t\t\t\t* *motore ga rawanq zhi kamen* :: `strength-inner NOM sleep-REVS TEMP eat.VBZ`\n\t\t\t\t\t* lit. \"Inner reserve of strength stayed someone awake when eating\"\n\t\t\t\t\t* ~\"When I was eating, it was my inner reserve of strength that kept me awake\"\n\t\t\t\t\t\t* *rawanq* strongly is transitive, so when dropping an object or topic, it is understood that **something or someone** is being acted upon\n\t\t\t\t\t\t* otherwise, just add *su ni* to the start if you want to explicitly state the topic or what *rawanq* is affecting\n\n## 13.11 Inanimate pronouns\n* Inanimate pronouns are a part of advanced grammar and using them for a person can be highly vulgar:\n\t* *mo, fofu sorei ji eu ake utari, fukano?* :: `SEQ speak.V 3SG.M-INANIM LOC COMP IMP.DIR sing REQ-Q`\n\t\t* lit. \"Then, tell dead him to sing, (pretty) please?\"\n\t\t* ~\"Then, why (don't you) tell that useless sack of shit (him) to sing (like a canary), please?\"\n\t\t\t* the *fukano?* contrasts with the harsh and vulgar tone of *sorei* paired with the direct imperative *ake*\n\t\t\t* it creates a highly sardonic sentence\n\n## 13.12 Politeness\n* Never be direct:\n\t* **ryo ga iinq ue**\n\t\t* the polite copular *ue* makes this even worse\n\t\t* it's like saying 'this is shit, politely'\n\t\t* it's the opposite of polite and can feel sardonic or sarcastic\n* You have to read the room and choose the appropriate response:\n\t* *tokuenanqai jamuiku ji* :: `PFV-lose.REVS.MID one.god-HON LOC`\n\t\t* ~\"Returned to the God\"\n\t\t\t* often synonymous with the English 'passing away'\n\t\t\t* very respectful\n\t\t\t* saying something like *jamuiku a* or to state *jamuiku* as an actor is generally avoided, since one cannot certainly know that God did exactly that\n\t\t\t* so, we use passive constructions, where *jamuiku* is the ultimate location or goal\n* Here are some situations and example responses:\n\t* **you had a drink at a family dinner before, but now the drink doesn't taste that good**\n\t\t* *Lyo konga, chingu ga waoi. Myomg no ng ni arene ue ga futasu, arariwakanai no?*\n\t\t\t* `DEM.DIST day-SRC.PART water-SRC.LEX NOM appeasing | QNT-G.REVS NMZ FIL TOP different COP.POL NOM ACT-POT POL-think-MID Q`\n\t\t\t\t* lit. \"That time of day, drink elicited a positive sensory feeling (i.e., was appeasing). As for some, different is possible, think?\"\n\t\t\t\t* ~\"That time of day, the drink was appeasing to me. Do you think that it's possible that maybe something is different today?\"\n\t* **an itchy, ugly shirt was given to you as a gift**\n\t\t* *eeeehh! araii riwakaen. Iehaku ue, hakuǵrra ue. Ryo ga ieashi. Yadaaa, aumg gayasun ji myomg no wanōete damiyaru kohazun mo, fukāna*\n\t\t\t* `hey POL-good think-VBZ | AUG-truth COP.POL truth-REVS-NEG COP.POL | DEM.MED NOM AUG-new | so HAVE.V-G.REVS body-1SG.POSS LOC QNT-G.REVS GEN time-N-INF easy-become.V gift-2SG.POSS COM REQ-AFFEC`\n\t\t\t\t* lit. \"Eyyyy, good thinking. Really is, lie isn't. This newer. Soooo, give my body to some time easy become your gift with, please, (you know)\"\n\t\t\t\t* ~\"Eyyyy, good thinking! Really, I mean it. This is quite new. Sooo, please give my body some time to ease into your gift.\"\n\t\t\t\t\t* *aumg* is more polite than using *demg*\n\t\t\t\t\t* *fukāna* is an affectionate request\n\t\t\t\t\t* *gayasun* diverts attention from **you** (I) as the actor or active agent\n\t\t\t\t\t* *damiyaru* is the verb form of the *damiyaro* (become easy) compound\n\t* **you want to end a boring conversation**\n\t\t* *Yada, aa arapara no nampangu, shirenai, (...), iehakui riwakanai*\n\t\t\t* `so CONC POL-tolerate GEN number-SRC.LEX know-MID ... AUG-true-ATTR think-MID`\n\t\t\t\t* lit. \"Well, even though tolerance's measure, (I) know, ... really true, (I) think\"\n\t\t\t\t* ~\"Well, even though this could feel jarring, I think ... is true\"\n\t\t\t\t\t* here, *(...)* can be a genuine reason, the most common of which being:\n\t\t\t\t\t\t* *riwakangosun no miri o myo no ng a itanai*\n\t\t\t\t\t\t\t* `think-SRC.WHOLE-1SG.POSS GEN middle U QNT NMZ FIL A PRTV-MID`\n\t\t\t\t\t\t\t\t* lit. \"My mind's middle experiences many things circumambulating\"\n\t\t\t\t\t\t\t\t* ~\"I've got a lot on my mind\"\n\t\t\t\t\t\t\t\t* ~\"There's a lot going round my mind\"\n* Abrupt vs. flow:\n\t* *yaro* does not imply natural or abrupt transitions, it only implies some sort of becoming\n\t* with *dami* or words that sound soft, it can have a natural, slowly adjusting connotation:\n\t\t* *damiyaru* :: to ease (into)...\n\t* other words, like *tahete*, which sound sharp, usually mean 'fast' or unnatural changes:\n\t\t* *taheteyaru* :: digitise\n\t\t\t* since *tahete* is also a word opposed to nature (it refers to non-natural, digital things, like electronics), the 'transition' is also unnatural\n\t* to soften 'digitise,' you use *damiyarute* compounds:\n\t\t* *damiyarute tahete...* :: to ease into digital...\n\n## 13.13 Expletives (profanities)\n* Tawa handles profanities:\n\t* `profanity [reason]`\n* So, English-like constructions, such as 'damn me,' don't exist\n* If you want to express 'damn me! everything's gone to shit,' you'd say:\n\t* *yawa a dakata subeki ngoe, n!* :: `demon A steal-PEJ total.ATTR DUM-N EXPL.VULG`\n\t\t* ~\"The demon stole everything!\"\n\t\t\t* *n* is an expletive or profane interjection\n\t\t\t* if *n* is used without a profanity or expletive, it isn't vulgar and just expresses anger or frustration:\n\t\t\t\t* *Nnn, baka!* :: `EXPL\\EMPH fool`\n\t\t\t\t\t* \"AAAAAA, you idiot!\"\n* Rule:\n\t* if *n* is in a vulgar or profane sentence, it intensifies vulgarity or expression (not anger, unless it is lengthened)\n\t\t* `EXPL.VULG`\n\t\t* `EXPL.VULG\\EMPH` (**if lengthened**)\n\t* otherwise, *n* marks anger:\n\t\t* `EXPL` (ugh, whatever, blah blah blah, shit)\n\t\t\t* if someone says 'can you get the water?' and you say '*n*,' it's like conveying 'whatever dude / shut up man (i'll do it)'\n\t\t* `EXPL\\EMPH` (anger)\n\t\t\t* saying *nnnn!* to 'can you get water?' is like saying 'shut up / leave me alone / go away!' but still implies that you'll begrudgingly do it (since *n* is not a no/yes)\n\n### 13.13.1 Oaths or swears\n* General swears or oaths are done with the generic deity word *zhamu*:\n\t* *Tete daru zhamu, reofunai!* :: `hand ALL-PLT.V god IPFV-ACT-MID`\n\t\t* ~\"Hand to God (it) will happen!\"\n\t\t* ~\"Hand to God I'll do it!\"\n\t\t\t* **never** use the romantic form (e.g., *llanyu* (`ALL-ROM.V`)) involving *zhamu*\n\t\t\t* it would come off as crass, since then it would imply you're praying to some sort of deity\n\t\t\t* saying this is also a promise, so if you didn't do whatever you said you would, it would be the equivalent of breaking a promise and probably someone's trust\n\t\t\t* note that *daru/danyu* are the verb forms of the allative postposition\n* Use *Jamu* (The God) for serious, religious oaths:\n\t* *Teteara daellāranyai Jamuiku ji, reofunai ng* :: `hand-POL FORM-ALL-POL-ROM.V.MID one.god-HON LOC IPFV-ACT-MID SFP.DECL`\n\t\t* ~\"My right hand to God that I will do it / it will happen\"\n\t\t\t* this is a highly serious, extremely religious commitment\n\t\t\t* breaking it would likely have high social consequences\n\t\t\t* it is a taboo (slur-level) to use it as a general oath\n\t\t\t* note that *ji* is added after *Jamuiku* to explicitly mark *Jamu* (God) as the ultimate destination / goal of *daellāranyai* (also why the middle voice is used, since *lla(ru/nyu)* encodes a 'destination' or 'towards' innately)\n\t\t\t* the dummy particle *ng* marks the end of the sentence\n\t\t\t\t* used in formal constructions like serious oaths to explicitly mark when said oath ends to kill exploitation of issues like ambiguity\n\n## 13.14 Register\n* Register shifts depending on tone (e.g., intonation), particles (e.g., *dae*, *ara*), and grammar\n* For example, you'd never say:\n\t* *ii lyo i* :: `good DEM.DIST COP`\n\t\t* lit. \"Good that is / exists\"\n\t\t* ~\"That's good\"\n* ... to your boss\n* You'd say:\n\t* *Lyo ni daeii ue* :: `DEM.DIST TOP FORM-good COP.POL`\n* For elders and respected people, you refer to them by *-honiku*:\n\t* *Jon'honiku* :: `john-person-HON`\n* For family, *'iku* can be fine\n* Parents are never referred to by real name\n* Parents often talk to children by their role:\n\t* *Karicha ga eanaite hariasa*\n\t\t* ~\"Mommy is going to the store\"\n* Young children or women use their real name instead of a pronoun\n\t* boys can, but they often grow out of it\n\t* younger siblings usually use their name in place of a pronoun when talking to older siblings\n* A name may be used in place of a pronoun in especially flirtatious/spoiled (but in a charming/sweet way) settings or within family:\n\t* *Sumi ga subu ryōe!* :: `sumi NOM desire.V DEM.MED-N`\n\t\t* ~\"Sumi (I) wants this!\"\n* But outside of those settings, it would likely come off as incredibly immature, unprofessional, and crass\n\t* between friends, a young woman could, but it would depend on level of closeness and social dynamic\n* A man (not a child) referring to himself by name would almost always carry a specific ('cringe') vibe\n\n## 13.15 Dangling clauses\n* A dangling clause is a clause without any explicit connection or verb, like:\n\t* *Su a, kamtei ga iewaoii ikamebang ji* :: `1.SG A food-PAT NOM AUG-appease-ATTR kitchen LOC`\n* Literally, it reads:\n\t* ~\"I, pizza is yummier in kitchen\"\n* But it actually means:\n\t* ~\"I made the pizza more appeasing / yummier in the kitchen\"\n* This is because:\n\t* *su a* sets *su* (me) as the actor (so something is happening)\n\t* *kamtei ga* makes *iewaoii* the attributive/state of the food (assumed to be a pizza for our case)\n\t* and *ikamebang ji* is irrelevant, just describes where (in the kitchen)\n* Together:\n\t* *su a* (I) did the action *kamtei ga iewaoii* (pizza is yummier)\n* It may be hard to grok initially, but practice makes perfect\n\n## 13.16 Ambiguity\n* Let's handle:\n\t* John told him about him\n\t\t* about him and him (the same him)\n\t\t\t* *Jon ni tofofu so ji ita*\n\t\t\t\t* \"John spoke to him (about him)\"\n\t\t\t\t\t* the him is the same person\n\t\t\t\t\t* so John talked about X to X (maybe stuff he's heard)\n\t\t* about him to another him\n\t\t\t* *Jon ni tofofu so ji so no ng ita*\n\t\t\t\t* lit. \"John spoke to him about him\"\n\t\t\t\t* except, *so no ng ita* specifically refers to a different, entire person, about which the conversation is\n\t\t* about John (himself) to him (not John)\n\t\t\t* *Jon ni tofofunsu so ji *\n\t\t\t\t* lit. \"John self-spoke to him\"\n\t\t\t\t* *-nsu* on *tofofu* refers back to John's 'self'\n\n## 13.17 On **ya**\n* *ya* is an assertive marker\n* It is loosely translated as 'make no mistake,' but this is often not the best translation\n* It is often used for drawing attention:\n\t* *Yaranai ya!* :: `come-MID ASSERT`\n\t\t* ~\"Oh, come!\"\n\t\t* ~\"Come, come!\"\n\t\t* ~\"Come here!\"\n\t\t* ~\"Yeah, come!\"\n* or for other sorts of invokings:\n\t* *Sorama ya!* :: `rain ASSERT`\n\t\t* ~\"O rain!\"\n\t\t* ~\"Rain, come!\"\n\t* *Zhamu ya!* :: `deity ASSERT`\n\t\t* ~\"Dang it!\"\n\t\t* ~\"Oh, God!\"\n\t\t* ~\"God help me!\"\n\t\t\t* **never** use it with *Jamu* like this, for it is a slur-level taboo\n* But it doesn't replace the vocative *ta*:\n\t* *Onokoi ya!* :: `friend ASSERT`\n\t\t* ~\"Yes, friend!\"\n\t\t* ~\"Indeed, friend!\"\n\t\t* ~\"Friend!\"\n\t\t\t* you can't 'assert' the word friend\n\t\t\t* in the other examples, you weren't literally 'calling' someone, you were just drawing attention\n\t\t\t* so this would draw attention to the word 'friend,' not your friend\n\t\t\t* you would say:\n\t\t\t\t* *ta onokoi!* :: `VOC friend`\n\t\t\t\t\t* ~\"Hey, friend! / friend, come!\"\n* Depending on tone, it can, of course, mean something along the lines of 'make no mistake:'\n\t* *Haterurra asasun ieji ya.* :: `run.PLAT.V-NEG house-1SG.POSS AUG-LOC ASSERT`\n\t\t* ~\"I'm not joking: do not run near my house\"\n\t\t* ~\"You must not run around my house, do you understand?\"\n\t\t* ~\"Make no mistake, running near my house is prohibited\"\n* Especially with *ng*:\n\t* *kamen byo un ni futashimg ue ya ng* :: `eat.GER DEM.PROX INSTR TOP ACT-POT.ATTR-G.REVS COP.POL ASSERT SFP.DECL`\n\t\t* ~\"To eat here is strictly banned\"\n\t\t* ~\"It is prohibited to eat here\"\n\t\t* ~\"Make no mistake, eating here is strictly banned (and doing so will result in consequences)\"\n\n## 13.18 Comparisons\n* The 'original' way of handling comparisons was with *mo*:\n\t* *(ie)X mo (ie)Y*\n\t* e.g.,\n\t\t* *ieii mo ryo* :: better than this\n\t\t* *ii mo ieryo* :: worse than this / more of this than good\n* Whilst this is allowed, NSKT recommends:\n\t* `X ni (ie)Y (ga (ie)Z)`\n\t* e.g.,\n\t\t* *ryo ni atora ga ieii ue* :: the apple is better than this\n\t\t* *ryo ni ieatora ga ii ue* :: the apple is worse than this\n* The simplest one is:\n\t* *ryo ni ieii mo atora ue* :: this is better than the apple\n\t* *ryo ni ieiiṋ mo atora ue* :: this is worse than the apple\n* But *ieiiṋ* is unusual in Tawish grammar and also unintentionally rude\n* You can just use normal negation:\n\t* *ryo ni ieiirra mo atora ue* :: this is not better than the apple\n\n## 13.19 Conditionals\n* **3 Recursion and agents** explains it pretty well\n\t* *Yumerra ryo ribuoe, oto ga hakōete anghakōe odzu reoshirenarratashi ya*\n\t\t* `read-NEG DEM.MED book-N WH NOM real-N-INF PRIV-real-N WH.2SG IPFV-know-MID.NEG-POT.ATTR ASSERT`\n\t\t* lit. \"Not read this book, what is true to without truth? you doubt, it will be unknowable, indeed\"\n\t\t* ~\"Really, if you don't actually read this book, then you won't be able to distinguish reality from fiction, (you know!)\"\n\t\t\t* *odzu* is a doubt marker and can connect the previous phrase to the verb that follows\n\t\t\t* *anghakōe odzu reoshirenarratashi* alone means 'a lie that you will doubt, it won't be knowable to you'\n\t\t\t\t* *odzu* alone can't mark a question without *no/yo*\n\t\t\t\t* if you said *anghakōe odzu yo(?) reoshirenarratashi*...\n\t\t\t\t\t* it would mean 'do you wonder if that doesn't truly reflect reality? I won't be able to know'\n\t\t\t\t\t* or something along those lines, depending on context\n\t\t\t\t\t* a question mark would be inserted for cleaner separation\n\t\t\t* though Tawa always places modifiers before nouns or uses the a copular after to for a stative-modifier, in the case of *i* modifiers, a copular is often omitted, especially when talking to a friend\n* For irreal conditionals, the *then* takes irrealis:\n\t* *Yumerra ryo ribuoe, shirenarrareteoi iuki hakōe* :: `read-NEG DEM.MED book-N.ACC know-MID.NEG-RESL.IRR sound-ATTR real-N`\n\t\t* lit. \"Did not read this book, would not have ended up knowing the sound realness\"\n\t\t* ~\"If I had not read this book, then I would not have regrettably ended up learning the truth\"\n* Note that *mai* can appear as *ma-*:\n\t* *Shiremarra...* :: did not learn / (to) not learn\n\t* *Shirerramai* :: same thing but more casual / direct (can be rude in contexts like speaking to your elders (e.g., family, bosses) or respected people (e.g., teachers))\n* **Don't confuse:**\n\t* *Shireretai* :: ended up regrettably knowing / learning (casual)\n\t* *Shirenareta* :: ended up regrettably knowing (formal/polite)\n\t* *Shiremareta* :: ended up regrettably teaching (formal)\n\t* *Shireretamai* :: ended up regrettably teaching (casual/direct)\n* Tawa does have a word for *if* (**shi**) but you'll see it in scientific texts, sermons, oaths, but not a family dinner:\n\t* *shi iejijiinu shire ryo wan butei, mo arenki butei ni yara angarenebuoe* :: `COND AUG-INTENS~LOC-ATTR-MOD know DEM.MED one PROP-N.PAT SEQ different.ATTR PROP-N.PAT TOP become PRIV-different-PROP-N.ACC`\n\t\t* lit. \"If more exactly know this one property, then different property (as for it) become a type of indifference\"\n\t\t* ~\"The more accurately one property is measured, the less accurately the other property can be known\"\n\t\t\t* *angarenebuoe* means 'indistinct' or 'unclear'\n\t\t\t* in Tawa, we use *yara...* (becomes...) to connect it with the statement properly\n\t\t\t* *iejijinu* literally can be translated as 'more exactly nearly'\n\t\t\t* the word know (*shire*) is used over a literal translation for 'measure,' because we are 'knowing' or 'learning' properties here (i.e., measuring them)\n\t\t\t\t* it isn't about using a ruler or clock, it's about the information physically available to the universe\n\t\t\t\t* in quantum mechanics, the position is determined (**known**), not 'read' by poking at it with some tool\n\n## 13.20 Topic extension\n* In Tawa, such is possible:\n\t* *hon ni nigoṋ ga tokachi nigōe* :: `person TOP cat-REVS NOM PFV-bite cat-N.ACC`\n\t\t* ~\"As for the man, the cat bites the dog\"\n\t\t* ~\"The man saw the cat bite the dog\"\n* It can be perfectly fine\n* If you wanted a low-context alternative:\n\t* *Nigoṋ ga tokachi nigōe wou hon a tonirunai* :: `cat-REVS NOM PFV-bite cat-N.ACC QUOT3 person A PFV-see.PLATONIC.V-MID`\n\t\t* ~\"The man saw the dog bit the cat\"\n\t\t* *-tonirunai* is used because *niru* points back to *wou* (in the *nirunai*) form\n\t\t\t* of course, this is not absolute, as some valency-sensitive verbs, like *fofu*, don't take the middle voice\n\t\t\t* in casual speech, you might even see *-nai* fully be omitted (so *hon a toniru*), which is also fine\n","14 Types in depth.md":"## 14.1 Basic types\n* There are three, basic types of verbs in Koyeah Tawa:\n\t* **Performed** (they are indifferent to the actor or undergoer)\n\t* **Experienced** (they directly affect the actor or undergoer)\n\t* **Underspecified** (if unmarked, their affect is ambiguous)\n\n### 14.1.1 Basic patterns\n* **Underspecified**\n\t* *ga* and *ni* usually don't encode undergoing nor acting without more context\n\t* there are some underspecified verbs, like *fofu* and *yara*:\n\t\t* **fofu**\n\t\t\t* *su o fofu* :: I experience speaking / speaking was done by me\n\t\t\t* *su o fofunai* :: I was heard\n\t\t\t* *su a fofu* :: I was the one that spoke\n\t\t\t* *su a fofunai* :: I was told\n\t\t\t* *su ga fofu* :: I speak\n\t\t\t* *su ga fofunai* :: I hear\n\t\t* **yara**\n\t\t\t* *su a yaranai* :: I came\n\t\t\t* *su a yara* :: I made (X) become (Y)\n\t\t\t* *su o yara* :: I became (X)\n\n#### 14.1.1.1 *tasu* and *nai*\n* Whenever 'X-able' is attributed to or modifies anything, you use the *tashi* form:\n\t* *Kitatashi hon* :: likeable person\n* Otherwise, the *-tasu* form is fine:\n\t* *Sa ga kitatasu i* :: she is likeable\n\t* or *sa ga kitatashi* if omitting copular\n* As a verb, the bare *tasu* form is also used, but it's often transitive as *matasu*:\n\t* *Fumatasu* :: `ACT-TR.POT.PLT.V`\n\t\t* ~\"To make X doable\"\n\t* *Kamumatasu* :: `eat.PLT.V-TR.POT.PLT.V`\n\t\t* ~\"To make (something) edible\"\n* Examples:\n\t* *Ryōe o kamumatasai, so a* :: `DEM.MED-N U eat.PLT.V-TR.POT.MID 3.SG.M A`\n\t\t* ~\"This was made edible by him\"\n\t\t\t* *-tasai* is from *tasu* + *nai*\n\t\t\t* it is used when there is no direct object or when the verb goes back onto the subject\n\t* *So a kamumatasu ryōe* :: `3.SG.M A eat.PLT.V-T
