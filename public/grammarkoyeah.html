    <script>
        const DOCS_DATA = {"1 Root structure.md":"## 1.1 Sentences\n* Sentence structure is SVO\n* Modifiers go before the noun\n\t* *meiya (soft) ngoshi (bird)* -> soft bird\n* Topic-comment structure\n* Context-first and pro-drop\n\n## 1.2 The nine core particles\n| Particle | IPA       | Gloss   |\n| -------- | --------- | ------- |\n| ni       | `/ni/`    | TOP     |\n| a        | `/a/`     | A       |\n| o        | `/o/`     | U       |\n| nai      | `/nai/`   | MID     |\n| nq       | `/ŋ~ɴ/`   | ANT     |\n| te       | `/te/`    | INF     |\n| no       | `/no/`    | GEN / Q |\n| ra       | `/ɺa~ɾa/` | NEG     |\n| ri       | `/ɺi~ɾi/` | AFFIRM  |\n* **ni** marks the topic:\n\t* *atora ni kamu* :: `apple TOP eat.V`\n\t\t* lit. \"As for the apple, (I) eat (it)\"\n\t\t* ~\"I eat the apple\"\n* **a** marks the actor:\n\t* *atora a kamu* :: `apple A eat.V`\n\t\t* \"The apple eats\"\n* **o** marks the undergoer:\n\t* *sa o koru* :: `3SG.F U kill.V`\n\t\t* \"She is killed\"\n* Notice:\n\t* *atora **ni** hon kamu* :: `apple TOP person eat.V`\n\t\t* \"As for the apple, the person eats (it)\"\n\t* *atora **a** hon kamu* :: `apple A person eat.V`\n\t\t* \"The apple humanises food\"\n\t* *atora **o** hon kamu* :: `apple U person eat.V`\n\t\t* \"The person eats the apple\"\n\t\t* ~\"The apple is eaten by the person\"\n* **nai** is the middle voice:\n\t* *sa o korunai* :: `3SG.F U kill.V-MID`\n\t\t* \"She dies\"\n\t\t* no killer is implied, since *nai* reduces the amount of arguments a verb can take, thus decreasing valency\n\t* *omoko o kamunai* :: `chicken U eat.V-MID`\n\t\t* \"The chicken is eaten\"\n* **nq** is used for antonymisation:\n\t* *kamunq* :: `eat.V-ANT`\n\t\t* ~\"Vomit\"\n\t* *kamonq* :: `food-ANT`\n\t\t* ~\"Inedible (substance)\"\n\n### 1.2.1 Focus\n* Usage of **ni**\n\t* It introduces the topic; i.e., what the whole sentence is about\n\t* It focuses the information after the particle\n\t* Example:\n\t\t* *atora ni mafo i* :: `apple TOP red COP`\n\t\t\t* The apple is old news, but the 'red' part is new information\n* Usage of **a**\n\t* It marks the subject performing a deed\n\t* The focus is on the noun before the particle\n\t* Example:\n\t\t* *ngoshi a kamu* :: `bird A eat.V`\n\t\t\t* The eating isn't the news; the fact that a bird doing it is\n* Usage of **o**\n\t* It marks the subject suffering a deed\n\t* Example:\n\t\t* *omoko o kamu* :: `chicken U eat.V`\n\t\t\t* The chicken experiences eating\n\t\t\t* This doesn't mean that the chicken is being eaten (you would use *kamonai* for that), but that 'eating' happens to it\n\n### 1.2.2 Nuances of using **a** / **o**\n* *a* often implies a specific subject (it is X and only X)\n\t* *a kamu* :: `A eat.V`\n\t\t* \"The actor and only the actor eats\"\n* *ni* often implies contrast (as for X, not Y)\n\t* *omoko ni kamu* :: `chicken TOP eat.V`\n\t\t* \"(I usually) eat chicken, (not beef / red meat)\"\n\t* *ryo ni ii, lyo ni iinq* :: `DEM.MED TOP good DEM.DIST TOP good-INV`\n\t\t* This is good, but that isn't good\n\n## 1.3 O-roots\n* For nasal-only clusters, *o-roots* drop the *′o* to take the consonant:\n\t* *kamo* + *-bu* :: *kambu*\n\n## 1.4 Questions and genitive\n* *no* is an interrogative when sentence-final but genitive when non-sentence-final:\n\t* *kanata no hon* :: `happy GEN person`\n\t\t* lit. \"Happy's person\"\n\t\t* ~\"A person who is happy\"\n\t* *hon no kanata* :: `person GEN happy`\n\t\t* lit. \"Person's happiness / the happiness of the person\"\n\t* *haku no kita* :: `truth GEN like`\n\t\t* \"Genuine liking\"\n\t* *jananq no hon* :: `heaven-ANT GEN person`\n\t\t* lit. \"A person of hell\"\n\t\t* ~\"Dweller of hellfire\"\n\n## 1.5 Infinitive\n- The infinitive _te_ marks infinitives\n- It's uses are listed here:\n    - **purpose** (intentional infinitive)\n        - _fuyu wante paya no?_ -> `what one-INF study Q`\n            - \"Which one to study?\"\n        - _eate kamu_ -> `MOV-INF eat.V`\n            - \"Go to eat\"\n    - **complement of modal / auxiliary verbs**\n        - _nasute paya_ -> `ability.V-INF study`\n            - \"Can study\"\n        - _anisute paya_ -> `requirement.V-INF study`\n            - \"Must study\"\n        - _subute paya_ -> `desire.V-INF study`\n            - \"Want to study\"\n    - **complement of perception / causative verbs**\n        - _kitate nirute so o korunai_ -> `like-INF see.V-INF 3SG.M U die.V-IV`\n            - \"(I would) like to see him (be) killed / die\"\n        - _rute hashirusun kamu_ -> `CAUS.V-INF child-1SG.POSS eat.V`\n            - \"Make my child eat\"\n    - **subject or object in nominal constructions**\n        - _payate ni ushikitsu i_ -> `study-INF TOP fun COP`\n            - \"Studying is fun / to study is fun\"\n        - _ryo ni payate i_ -> `DEM.MED TOP study-INF COP`\n            - \"This is for studying\"\n        - _ryo ni iite paya i_ -> `DEM.MED TOP good-INF study COP`\n            - \"This is good to study\"\n    - **description**\n        - _ushikitsute paya ita ei_ -> `fun-INF study PRTV ANAPH`\n            - \"(It is) fun to study about this\"\n        - _damite kamu_ -> `easy-INF eat.V`\n            - \"Easy to eat\"\n        - _iite fu_ -> `good-INF ACT`\n            - \"Good to do\"\n\n## 1.6 Polarity\n* *ra* and *ri* are both used to negate and affirm, respectively:\n\t* *Yararanai* = did not come\n\t* *Yararinai* = (indeed) came\n* They are not only suffixes:\n\t* *Ri, lyo ni haku i* = yeah, that's true\n\t* *Ra, su fofu me arene i* = no, what I said is different\n\t* *Ra, su fofura ryoe!* = no, I didn't say this!\n\t\t* for reported speech, what is being reported is the 'direct object' of the verb (e.g., speak (fofu))\n\t\t* so 'he said he's epic' is *so fofu ryoe: so ni epiku* (he says this: he is epic)\n\t\t\t* for quotations, just use *mo*:\n\t\t\t\t* *so fofu mo 'su ni epiku'* (he said, \"I am epic\")\n\t* *Riwakara ita ei, ra...* = didn't think about that, no...\n","2 Types.md":"## 2.1 Particle table\n| Type      | Particle | IPA        | Gloss |\n| --------- | -------- | ---------- | ----- |\n| **n.**    | **oe**   | `/oe/`     | NM    |\n| **v.**    | **(r)u** | `/(ɺ~ɾ)u/` | V     |\n| **mod**   | **nu**   | `/nu/`     | MOD   |\n| **prop.** | **bu**   | `/bu/`     | PROP  |\n| **cop.**  | **i**    | `/i/`      | COP   |\n\n### 2.1.1 Verbs\n* Words ending in *-o* end in *-u* when they are in their verbal form:\n\t* *atora ni hon kamu* :: `apple TOP person eat.V`\n\t\t* \"The person eats the apple\"\n* Otherwise, verbs take *-ru* or are unmarked if other particles or context can disambiguate:\n\t* *a kikita ngoshi* :: `A SUP~like bird`\n\t\t* \"(I, and only I) love birds\"\n\t\t* no *(r)u* needed due to **a**\n\t* *so ni iiru* :: `3SG.M TOP good-V`\n\t\t* \"(I) bettered him\"\n\t\t* if you said *so ni ii*, then that would mean 'he is good'\n\n### 2.1.2 Modifying\n* Modifiers don't take the *i* copular if they end in *i*:\n\t* *su ni ii* :: `1SG TOP good`\n\t\t* \"I am good\"\n* Otherwise:\n\t* *su ni mafo i* :: `1SG TOP red COP`\n\t\t* \"I am red\" (would be understood as 'blushing / anger,' but it's less natural)\n\t\t* if you meant to say 'I'm blushing,' try:\n\t\t\t* *su o mafu* :: `1SG U red.V`\n\t\t\t\t* ~\"I blush\" (though this isn't the best translation, per se)\n\t\t\t\t* don't use *mafunai*, since that implies that there's no doer, which leans towards anger\n\t\t\t\t* more often than not, you'd want to say that someone specific is making you blush\n\t* *asa ni kuru i* :: `house TOP black COP`\n\t\t* \"The house is dark / black\"\n* In adjective chains:\n\t* *lili meiya ngoshi* :: `little soft bird`\n\t\t* ~little soft bird\n\t\t* no need for *ngosh**i*** to take the copular, since it ends in *i* already\n\t* *lili meiya asa i* :: `little soft house COP`\n\t\t* ~little soft house\n* As adverbs:\n\t* *hatero hateru* :: `fast run.V`\n\t\t* ~run swiftly\n* In noun compounding or to disambiguate:\n\t* *hateronu hateru* :: `fast-MOD run.V`\n\t* *eanu-natse* :: `MOV-MOD-square`\n\t\t* lit. \"moving square\"\n\t\t* ~\"cart / trolley\"\n\t* *eanu-natsenoe* :: `MOV-MOD-square-NM`\n\t\t* lit. \"moving square (object)\"\n\t\t* ~\"cart / trolly (that is not moving)\"\n* **Sometimes**, the copular **can** be omitted\n* For complex constructions, it usually is not:\n\t* *twana ni lili mani* :: `tool TOP little money`\n\t\t* \"As for the tool, (it) little money\"\n\t\t\t* this is fine, but it's preferable to say:\n\t\t\t\t* *twana ni lili mani i*\n\n### 2.1.3 Property particle\n* *bu* denotes a property\n* It's like saying 'kind of / sort of / circa' in English\n* For adjectives, it marks approximation:\n\t* *nuku iibu* :: `heart.V good-PROP PROP`\n\t\t* lit. \"(I) feel goodish\"\n\t\t* ~\"(I) sort of feel good\"\n\t* *meiyabu ngoshi* :: `cute-PROP bird`\n\t\t* \"Cuteish bird / softish bird\"\n* For nouns:\n\t* *ryo asabu asasumbu i* :: `DEM.MED house-PROP house-1SG.POSS.PROP COP`\n\t\t* ~\"This kind of house is my kind of house\"\n\t* *ryo kambu ni kita* :: `DEM.MED food.PROP TOP like`\n\t\t* ~\"(I) like this kind of food\"\n* For adverbs:\n\t* *haterobu hateru* :: `fast-PROP run.V`\n\t\t* \"Swiftish / fastish run\"\n\t* Compare with:\n\t\t* *haterubu* :: `run-PROP`\n\t\t\t* \"A run that seems like a run\"\n\t\t\t* \"A runnish run\"\n\t\t\t* \"Kind of running\"\n\n### 2.1.3 Noun or object particle\n* *-oe* denotes the noun\n* It's often always omitted, though it may be used for disambiguation\n* It's real purpose shines in noun-compounding:\n\t* take *eanu*, which describes anything as moving\n\t* *eanu-natse* would mean a 'moving square/block' - could be a trolley or cart\n\t* but what if you want to use this to refer to a cart, like in the sentence *subute harinai eanu-natse!* (I want to buy a trolley!)\n\t\t* using *eanu-natse* is fine but it implies a specifically moving cart or trolley that is in motion\n\t\t* if you want to use it as one concept, you would add *-oe*:\n\t\t\t* *eanu-natseoe* (trolley)\n* It can also be used for the direct object:\n\t* *koha poki, poki atoraoe* :: `gift big big apple-NM`\n\t\t* \"(I) gift a big, big apple (to X)\"\n\t\t\t* even though *oe* just marks *atoraoe* as a noun here, it implies that one root here is a verb (*koha*)\n\t* *sa koha ji su ii kohaoe* :: `1SG gift LOC 1SG good gift-NM`\n\t\t* \"She gifted me a good gift\"\n","3 Recursion and agents.md":"## 3.1 Particle table\n| Particle | IPA     | Gloss |\n| -------- | ------- | ----- |\n| **me**   | `/me/`  | REL   |\n| **mas**  | `/mas/` | AGNR  |\n\n## 3.2 Nesting\n* Nesting is often just handled by **me**:\n\t* *hatero ngoshi a kamu mafo atora me unsu* :: `fast bird A eat.V red apple REL live.V`\n\t\t* lit. \"Fast bird eats red apple - lives\"\n\t\t* ~\"The fast bird that ate the red apple lives\"\n\n## 3.2 Recursion\n* Just embed a *me-clause* into a *me-clause*:\n\t* *ngoshi a kamu atora me nandanai ika tsu me unsu* :: `bird A eat.V apple REL down-MID ABL tree REL live.V`\n\t\t* The bird that ate the apple that fell from the tree lives\n\n## 3.3 Clausal description\n* *me* is also used for this, but often paired with a copular:\n\t* *hon me korumas i* :: `person REL kill.V-AGNR COP`\n\t\t* \"The person that is a killer\"\n\t* *ii hon a kitate yume ribu me iinq i* :: `good person A like-INF read book REL good-ANT COP`\n\t\t* ~\"The person that likes to read books is (actually) bad\"\n* Do note that the copular may be omitted, so:\n\t* *hon me korumas*\n* ... is fine\n","4 Adpositions.md":"## 4.1 Core preposition system\n| Case    | Core usage                                                                                                                  |\n| ------- | --------------------------------------------------------------------------------------------------------------------------- |\n| **ji**  | indirect object; location of existence; destination or final arrival point; time; goal of a movement; passive or causative  |\n| **un**  | instrument or means; location of action; material or composition; cause or reason; limit                                    |\n| **do**  | traversal or route of motion; point of detachment                                                                           |\n| **da**  | heading (towards); progression                                                                                              |\n| **dan** | temporospatial starting point or origin; source of material; source of information / giving                                 |\n| **mo**  | comitative; quotation or boundary of thought or sound; comparison; temporal (and spatial) sequentiality; contrasting linker |\n| **we**  | additive (and)                                                                                                              |\n- In Koyeah Tawa, many cases have multiple functions:\n    - **do**\n        - traversal or route of _motion_\n            - flew (through) the _sky_\n                - _kiuku do sora_\n            - walked (along) the _path_\n                - _haeku do tachi_\n        - point of detachment\n            - leave (from) _home_\n                - _kuenau do asa_\n            - get (out of) the _cart_\n                - _ea do eanu-natse_\n    - **ji**\n        - indirect object\n            - give a gift **to** a friend\n                - _koha kohaoe ji onokoi_ -> `gift gift-NM DAT friend`\n        - location of existence\n            - food is **on** the table\n                - _kamo ji jirei_ -> `food.NM TOP LOC table`\n        - destination or final arrival point\n            - we are **at** her home\n                - _na ji asasan_ -> `3SG LOC house-3SG.F.POSS`\n            - we flew **to** London\n                - _na kiuku ji Landan_ -> `3SG fly.V LOC london`\n        - time\n            - writing words **at** 2:55 AM\n                - _payaen kana ji 0255 AM_ -> `write-NMLZ word LOC 0328 am`\n        - goal of a movement\n            - went **out to** shop\n                - _ea ji hari_ -> `MOV DAT buy`\n        - passive or causative\n            - the boss made the employee write the report\n                - _komuni ji komuninq a monu tetoeka_\n                - \"the boss **made** the employee write the report\"\n    - **un**\n        - instrument or means (DON'T confuse wth comitative 'mo')\n            - wrote the book **digitally** / **in/via** electronic interface\n                - _paya ribuoe un tahete_ -> `write book-NM INSTR electronic`\n            - ate **with** a spoon\n                - _kamu un oho_ -> `eat-V INSTR spoon`\n        - location of action\n            - had fun **at** her house\n                - _hahaen un asasan_ -> `laugh-NMLZ INSTR house-3SG.F.POSS`\n        - material or composition\n            - made **of / by / with** wood\n                - _ru un tsu_ -> `CAUS.V INSTR wood`\n        - cause or reason\n            - he did not come **as** he was sick\n                - _so yarara un mahwa_ -> `3SG.M come-NEG CAUSAL sick`\n        - limit (time/quantity/scope)\n            - the tool is cheap **for** its high quality\n                - _ryo twana ni lili mani i un poki iioe_ -> `tool TOP little money COP LMT big good-NM`\n                    - lit. \"as for the tool, it is of little money for its big goodness\"\n            - finished work **in** 3 days\n                - _kiwinq irime un 3 ko_ -> `continue-INV work PER three day`\n    - **da**\n        - heading (towards)\n            - heading **towards** the mountains\n                - _ea da asasan_ -> `MOV ALL house-3SG.F.POSS`\n                    - p.s., here, the focus is on 'active direction,' not the destination, unlike _ji_\n        - progression\n            - going **to / progressing** towards London\n                - _ea da Landan_ -> `MOV ALL london`\n    - **dan**\n        - spatial starting point\n            - I came here **from** Canada\n                - _yaranai dan Canada_ -> `come-MID ABL canada`\n        - temporal origin\n            - I started **from** almost 1 to 2 o'clock\n                - _kiwi dambu 1 ato 2 Pi'Em_ -> `continue ABL-PROP one or two pm`\n                    - *dambu* is an approximate point due to presence of **-bu**\n        - source of material\n            - drug **from** fruits\n                - _kara dam ba_\n                    - p.s., here, it is about transformation or change itself; in _un_, the original material was wood, but with *dan*, the original material has changed (fruits to drugs, seed to plant, etc.)\n                    - because the following consonant is bilabial, *dan* changes to *dam*\n        - source of information / giving\n            - heard about it **from** her\n                - _fofunai ita ryo dan sa_ -> `speak.V-IV PRTV DEM.PROX ABL 3SG.F`\n    - **mo**\n        - comitative\n            - I never argue **with** my sister\n                - _shahadara mo pashachasun_ -> `fight-NEG COM sibling-F-1SG.POSS`\n        - quotation or boundary of a thought or sound\n            - the bell rang **with** a ding\n                - _kare iyuku mo 'jing'_ -> `bell sound.V COM ding`\n            - he said **that** he will come\n                - _so fofu mo yaranai_ -> `3SG speak.V QUOT come-MID`\n        - comparison\n            - bigger **than** him\n                - _iepoki mo so_ -> `AUG-big COMP 3SG.M`\n        - temporal sequence or sequentiality\n            - ate **then** went to talk to him\n                - _kamu mo eate fofu ji so_ -> `eat.V SEQ go-INF speak.V DAT 3SG.M`\n        - contrasting linker (as **mo mo**)\n            - **but** I'm eating\n                - _mo mo su kamen_ -> `but 1SG eat.NMLZ`\n            - you can do it **but** only if you pay first\n                - _nasute fu, mo mo ji wan, mani i_ -> `ability.V-INF ACT but LOC first money COP`\n    - **ita**\n        - aboutness, regarding\n            - speak **about** her\n                - _fofu ita sa_ -> `speak.V PRTV 3SG.F`\n        - circumambulate\n            - walk **about / around** a house\n                - _haekukunh ita asa_ -> `walk.V-LIT PRTV house`\n                - p.s. use _haekukunh_ if _haeku_ alone is ambiguous, as _haeku_ can mean to learn as well (e.g., learn about a house)\n        - partitive\n            - drink **some of** this water\n                - _kamu chi no ita_ -> `eat.V water GEN PRTV`\n            - **some of** the people like me\n                - _hon no ita kita su_ -> `person GEN PRTV like 1SG`\n            - **not yet done** sending the picture\n                - _senoden no ita emonoe_ -> `send.NMLZ GEN PRTV picture.NM`\n    - **itan**\n        - avoiding, focusing (away) from the centre\n            - why are you **beating around the bush regarding** her?\n                - _zu fofu itan sa_ -> `2SG speak.V EX 3SG.F`\n        - exclude\n            - walk **avoiding** the house\n                - _haeku itan asa_ -> `walk.V EX house`\n        - totalitive\n            - drink **all of** this water\n                - _kamu chi no itan_ -> `eat.V water GEN TOT`\n            - **all of** the people like me\n                - _hon no itan kita su_ -> `person GEN TOT like 1SG`\n            - **completed / fully done** sending the picture:\n                - _senoden no itan emonoe_ -> `send.NMLZ GEN TOT picture.NM`\n    - **po**\n        - being in favour or supporting\n            - she is for him / for his favour / in favour of him\n                - _sa po so_ -> `3SG.F FOR 3SG.M`\n        - positioned beside or alongside a thing\n            - I am beside the house **(poji)**\n                - _su poji asa_ -> `1SG FOR-LOC house`\n    - **bo**\n        - being against\n            - she is against him\n                - _sa bo so_ -> `3SG.F CNTR 3SG.M`\n        - resting against or using a thing as support **(boji)**\n            - I am opposite to / against the house\n                - _su boji asa_ -> `1SG CNTR-LOC house`\n            - I'm resting against the house's walls\n                - _su a rawa boji ga no asa_ -> `1SG A rest CNTR-LOC side GEN house`\n        - acting as substitute (instead of)\n            - we need peace instead of war\n                - _na a anisu ritaruoe boji shahada_ -> `1PL A require.V soft-NM CNTR-LOC war`\n    - **we**\n        - additive\n            - apples **and** bananas (and as such)\n                - _atora we karaba_ -> `apple ADD creamfruit`\n\n## 4.2 Extended preposition system\n| Prep. | Semantic space                                                                                                                                                     | IPA   |\n| ----- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------ | ----- |\n| da    | recipient or destination; ultimately, it is the **purpose** and **target** of any act                                                                              | da    |\n| dan   | **source** or **origin**; the giver as opposed to recipient or the starting point as opposed to destination                                                        | dan   |\n| ye    | anything done for one's **gain** or **benefit** (e.g., running _for_ your body's health)                                                                           | je    |\n| yen   | anything done to one's detriment (e.g., stealing food _for_ your coworker's detriment)                                                                             | jɛn   |\n| ji    | any state of **being**; being **at** or **inside** a coordinate                                                                                                    | d͡ʑi  |\n| jin   | being **out of** or **away** from any state or coordinate; exclusion from a state or coordinate                                                                    | d͡ʑɪn |\n| po    | positioned **beside** or **alongside** a thing; being **in favour** or **supporting**                                                                              | po    |\n| bo    | positioned **opposite** or **facing** something; resting **against** or using a thing as **support**; being **against** or acting as **substitute** (_instead of_) | bo    |\n| ita   | a **piece** or **some** of a thing; _aboutness_ or an _incomplete action_                                                                                          | ita   |\n| itan  | the **entirety** of a thing; _completion_ of an action; _total embodiment_ of a thing                                                                              | itan  |\n| un    | **accompaniment**, **using** a tool; **emotional companionship** or an _internal state that you carry_                                                             | (ʔ)un |\n| nin   | **lacking** or **being without** (a thing)                                                                                                                         | nɪn   |\n\n### 4.2.1 Locative preposition class\n| Prep.     | Semantic space                                                                                                                                                                                                                                                                                                                                                            | IPA       |\n| --------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | --------- |\n| **ji**    | anything located in or contained in something; going into, enter; in, at; state of being; being 'in' any state; headspace; membership, participation; fashion, trend; included, counted; skill (good at, bad at); rate or measurement (at 60BPM); state during activity; targeted or directed action; appearance or form (in pieces, in crystals); lock in                | d͡ʑi      |\n| **jin**   | being out of or away from; going out of, exiting; not in, not at; a state of being one isn't in; exhausted, depleted; revealled, exposed; extinguished, inactive; (removed) from participation; not included, not counted; fall out                                                                                                                                       | d͡ʑɪn     |\n| **jiji**  | exactly at, absolutely at; most at, perfectly in; the absolute truth or bullseye in terms of location or headspace, dead on; precisely (at); interaction point (knock at the door)                                                                                                                                                                                        | d͡ʑid͡ʑi  |\n| **jijin** | nowhere near, way off, completely missing it; not even close; anything but (it/that)                                                                                                                                                                                                                                                                                      | d͡ʑid͡ʑɪn |\n| **jinyi** | above, over, on; positioned above; applied to a target; directed effort towards; active engagement; turned 'on' or online; topical focus; schedule, occurrence (the party is on); dependency, support, codependent; progress, continuation; responsibility; stick on                                                                                                      | d͡ʑinʲi   |\n| **jista** | below, under, beneath, off; positioned below; action directed away; removed form a target; 'off' or offline; ranked below; siphon (off); take (off), cancellation, discontinuation, reduction or discount (30% off), incorrectness (feels off); detach, remove; come off                                                                                                  | d͡ʑisu̥ta |\n| **ieji**  | close; interaction is easy or intermediate; (at a) short distance; association, affiliation (close to him), rank, hierarchical closeness (near the top), proximity (near the department); approximation (nearly the best), almost; close to a limit or boundary (near disaster); low cognitive distance (keep it near your mind, bring near your attention); soon (to be) | ied͡ʑi    |\n| **iejin** | outside the zone of easy interaction; not close; away; increase distance from reference (take away, move away); not present (he is away); difficult to access (help is not near); removed from implication or connection (step away, drift away, fade away)                                                                                                               | ied͡ʑɪn   |\n| **oji**   | distance is lower than a comfortable or safe threshold; crossing boundaries, entering personal space; too close for comfort; insufficient difference (too similar / too close); proximity that risked crossing into failure or harm; clingyness or attachment (she is too close)                                                                                          | ɔd͡ʑi     |\n| **ojin**  | distance is higher than a comfortable or manageable threshold; beyond an expected or needed position; too removed from involvement or connection (he went too far in isolating himself); threshold violation (opposite end of a safety or acceptability boundary (e.g., experiment gone too far)); detachment, isolation (he is too distant)                              | ɔd͡ʑɪn    |\n\n## 4.3 Uses\n* They're essentially used in the same way as described in:\n\t* **Ashi Tawa, Grammar:17-18**\n* You always use the *core* preposition particles and **ONLY IF** nuance is needed, you use the other available ones\n* More often than not, particles like *ye* or *yen* are not needed\n* The only exception to this is *ita* and maybe some of the locative class\n","5 Aspect.md":"## 5.1 TAM\n* The entire TAM system of Ashi Tawa is used as is\n* The only exception is that aspect always comes at the start of a sentence:\n\t* *to atora ni kita* :: `PFV apple TOP like`\n\t\t* \"I liked apples\"\n\t* *eru atora ni kita* :: `CONT apple TOP like`\n\t\t* \"I (continue to) like apples\"\n\t* *iro atora ni kita* :: `PRSV apple TOP like`\n\t\t* \"I still like apples\"\n\t* *reo atora ni kita* :: `IPFV apple TOP like`\n\t\t* \"I will like apples\"\n* It also applies to the complex aspects:\n\t* *teruiro atora ni kita* :: `PFV.CONT apple TOP like`\n\t\t* \"I have kept liking apples\"\n* ... though they are less often used\n* The *hya/hyo* distinction has been replaced with just *no?*\n","6 Grammatical differences.md":"## 6.1 What's gone or changed\n* the vocative *ta* is gone (just use 'waka' combined with hon/'iku/hon'iku)\n* *óy* and *t* are now *oy* `/ɔjḁ/` and `/tḁ/`\n\t* pronounced roughly the same but the devoiced vowels preserve (C)V(N) structure\n* *mh* `/m̥͡m/` is pronounced `/mʲ/`\n* *q* `/c͡ç/` is pronounced `/x~ħ/`, but `/c͡ç/` can be acceptable\n* *r* and *rr* `/ɺ ɾ/` are simply pronounced `/ɺ~ɾ~r/`\n* *nh*, *ng*, and *nq* `/n̼ ŋ ɴ/` are simply pronounced `/ŋ~ɴ/`\n* *w* and *v* `/w ʋ/` are simply `/w~ʋ/`\n* *ni* is simply `/ni/`, there is no palatal allophony anymore\n* mono- and direduplication as well as degree remains, but:\n\t* *sta* is pronounced `/su̥ta/`\n* romantic-platonic distinction is preserved but:\n\t* it's not commonly used, if at all\n\t* only *cha/che* and *-(r)u* are commonly used for gender and verb marking respectively\n* no articles nor plurality\n* full relation system is intact\n* discourse particles are intact but:\n\t* *am* is pronounced `/æn/`\n\t* *yad* is pronounced `/jæː/`\n\t* *ani* is simply pronounced `/æni/`\n* conditionality and temporal markers remain intact\n* irrealis is mostly intact; however:\n\t* *eoi* is used for irrealis and is often combined with an aspect:\n\t\t* *teoi kamu* :: `PFV.IRR eat.V`\n\t\t\t* \"Had eaten\"\n\t\t* *subeoite kamu* :: `desire.IRR eat.V`\n\t\t\t* \"Should eat\"\n\t\t\t\t* though Koyeah Tawa prefers *ieiite kamu* (better to eat) and avoids complex particles, like irrealis ones\n\t\t* *so a niruoi su shi a hateru ji so* :: `3SG.M A see.V.IRR 1SG COND A run.V LOC 3SG.M`\n\t\t\t* \"he would see me if I run to him\"\n\t\t\t\t* when it combines with verbs, it takes the *uoi* form (V.IRR)\n\t\t\t\t* the noun form *oei* is also available\n* modal system is the same, but instead of **ũ**, the infinitive *te* is used (e.g., *subute* :: want to (...))\n"}; 

        const navList = document.getElementById('nav-list');
        const contentArea = document.getElementById('doc-content');
        const searchInput = document.getElementById('search');

        function cleanName(name) {
            return name.replace(/^\d+\s*/, '').replace('.md', '').replace(/-/g, ' ');
        }

        function renderDoc(filename, highlightTerm = null) {
            const rawContent = DOCS_DATA[filename];
            if(!rawContent) return;

            contentArea.innerHTML = marked.parse(rawContent);
            
            if (highlightTerm && highlightTerm.trim() !== "") {
                const walker = document.createTreeWalker(contentArea, NodeFilter.SHOW_TEXT, null, false);
                const nodes = [];
                while(walker.nextNode()) nodes.push(walker.currentNode);

                nodes.forEach(node => {
                    const text = node.textContent;
                    const regex = new RegExp(`(${highlightTerm})`, 'gi');
                    if(regex.test(text)) {
                        const span = document.createElement('span');
                        span.innerHTML = text.replace(regex, '<mark>$1</mark>');
                        node.parentNode.replaceChild(span, node);
                    }
                });

                const firstMark = contentArea.querySelector('mark');
                if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === filename);
            });
        }

        function handleSearch(query) {
            const term = query.toLowerCase().trim();
            navList.innerHTML = '';
            
            if (!term) {
                initDefaultSidebar();
                return;
            }

            let resultsFound = false;
            Object.keys(DOCS_DATA).forEach(filename => {
                const content = DOCS_DATA[filename];
                const chapterName = cleanName(filename);
                const lowerContent = content.toLowerCase();

                if (chapterName.toLowerCase().includes(term) || lowerContent.includes(term)) {
                    resultsFound = true;
                    const resDiv = document.createElement('div');
                    resDiv.className = 'search-result';
                    
                    let snippet = "";
                    const index = lowerContent.indexOf(term);
                    if (index !== -1) {
                        const start = Math.max(0, index - 30);
                        const end = Math.min(content.length, index + 50);
                        snippet = content.substring(start, end).trim().replace(/\n/g, ' ') + "...";
                    } else {
                        snippet = "Match in title";
                    }

                    resDiv.innerHTML = `
                        <div class="result-chapter">${chapterName}</div>
                        <div class="result-snippet">${snippet}</div>
                    `;
                    resDiv.onclick = () => renderDoc(filename, term);
                    navList.appendChild(resDiv);
                }
            });

            if (!resultsFound) {
                navList.innerHTML = '<div style="padding:1rem; opacity:0.4; font-size:0.8rem; text-align:center;">No results found ✨</div>';
            }
        }

        function initDefaultSidebar() {
            navList.innerHTML = '';
            Object.keys(DOCS_DATA).forEach((filename, index) => {
                const btn = document.createElement('div');
                btn.className = 'nav-item';
                btn.dataset.file = filename;
                btn.textContent = cleanName(filename);
                btn.onclick = () => renderDoc(filename);
                navList.appendChild(btn);
                if (index === 0 && contentArea.innerHTML === "") renderDoc(filename);
            });
        }

        searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
        initDefaultSidebar();
    </script>
</body>
</html>
