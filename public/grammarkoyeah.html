    <script>
        const DOCS_DATA = {"1 Register basics.md":"## 1.1 Fundamentals\n* Sentence structure is **SVO** only\n* Language is **pro-drop**\n\t* *yarate kita* for \"come to like you\" is fine if you're looking at the person and saying it\n* Root ending decides word type:\n\t* ′o-ending -> noun\n\t* ′bu-ending -> approximate modifier\n\t* any other ending -> verb (esp. ru/u) or modifier depending on context\n\n## 1.2 Word types\n* Each word type is marked:\n\t* *-o* for nouns\n\t\t* **hono**\n\t\t* **kamo**\n\t\t* **unso**\n\t\t* **sorao**\n\t* *-(r)u* for verbs or unmarked:\n\t\t* **kamu**\n\t\t\t* if the root ends in *-o*, inflect to *-u*\n\t\t* **kitaru**\n\t\t\t* only mark if ambiguous\n\t* unmarked for modifiers:\n\t\t* **ii kamo** -> good food\n\t\t* **kamonq kamo** -> inedible food\n\t* *-bu* for weak modifiers:\n\t\t* **iibu kamo** -> good-ish food\n\t\t* **kambu kamo** -> (kind of / sort of) edible food\n\n### 1.2.1 Sentence examples\n* *su kita zu* -> `1SG like 2SG`\n\t* \"I like you\"\n* *su myo kita zu* -> `1SG QNT like 2SG`\n\t* \"I like you a lot\"\n\t* \"I like you much\"\n* *zu myobu kita su* -> `2SG QNT-PROP like 1SG`\n\t* \"You kind of like me a lot\"\n\n### 1.2.2 Modifying\n* Use *te* and *tebu* as an infinitive and approximate infinitive:\n\t* *su yarate kita zu* -> `1SG come-INF like 2SG`\n\t\t* \"I (have) come to like you\"\n\t* *su yaratebu kita zu* -> `1SG come-PROP-INF like 2SG`\n\t\t* \"I (have) kind of come to like you\"\n\n## 1.3 Negation and affirmation\n* Use *ra* to negate and *ri* to affirm as well as emphasise:\n\t* *Kitari* -> `like-AFFIRM`\n\t\t* \"(Yes), I really do like you\"\n\t\t* \"I genuinely like you\"\n\t\t* \"I actually like you\"\n\t* *Kitara* -> `like-NEG`\n\t\t* \"I don't like you\"\n\t* *Ri, ii kamo* -> `AFFIRM good food.NM`\n* Use *riyi* (AFFIRM2) or *raya* (NEG2) in noisy environments to distinguish between the two\n\n## 1.4 Particle table\n| Particle | IPA    | Function                       | Gloss   |\n| -------- | ------ | ------------------------------ | ------- |\n| **o**    | `o`    | Marks nouns                    | NM      |\n| **(r)u** | `(ɾ)u` | Marks verbs if ambiguous       | V       |\n| **bu**   | `bu`   | Marks approximate modification | PROP    |\n| **te**   | `te`   | Description and adverb         | INF     |\n| **ra**   | `ɾa`   | Negates                        | NEG     |\n| **ri**   | `ɾi`   | Affirms and emphasises         | AFFIRM  |\n| **riyi** | `ɾiji` | -                              | AFFIRM2 |\n| **raya** | `ɾaja` | -                              | NEG2    |\n* **NOTE:**\n\t* use the *-ute* form of the infinitive for marked verbs, especially for modals like *subute* **(want to)**\n\t* the noun marker *-o* does not strictly have to be used; it is often omitted when context or word order makes it clear\n","2 Cases.md":"## 2.1 Kakatte Koyeah case system\n| Case      | Modern / simplified domain                                                                                                               |\n| --------- | ---------------------------------------------------------------------------------------------------------------------------------------- |\n| **õ**    | direct object; traversal or route of motion; point of detachment                                                                         |\n| **ji**    | indirect object; location of existence; destination or final arrival point; time; goal of a movement; passive or causative               |\n| **un**    | instrument or means; location of action; material or composition; cause or reason; limit                                                 |\n| **lla**   | heading (towards); progression                                                                                                           |\n| **llanh** | temporospatial starting point or origin; source of material; source of information / giving                                              |\n| **mo**    | comitative; additive; quotation or boundary of thought or sound;  comparison; temporal (and spatial) sequentiality; contrasting linker   |\n| **ita**   | a piece or some of a thing; aboutness or an incomplete action                                                                            |\n| **itanh** | the entirety of a thing; completion of an action; total embodiment of a thing                                                            |\n| **po**    | positioned beside or alongside a thing; being in favour or supporting                                                                    |\n| **bo**    | positioned opposite or facing something; resting against or using a thing as support; being against or acting as substitute (instead of) |\n\n### 2.2 Explanation and definition\n* In Kakatte Koyeah, many cases have multiple functions:\n\t* **o**\n\t\t* direct object\n\t\t* often left unmarked\n\t\t\t* read the *book*\n\t\t\t\t* *ake paya ribuo*\n\t\t\t\t* *ake paya o ribuo*\n\t\t\t\t\t* ~\"Oh, damn it, just read the book!\"\n\t\t* traversal or route of *motion*\n\t\t\t* flew (through) the *sky*\n\t\t\t\t* *kiuku o sorao*\n\t\t\t* walked (along) the *path*\n\t\t\t\t* *haeku o tachio*\n\t\t* point of detachment\n\t\t\t* leave (from) *home*\n\t\t\t\t* *kuenau o asao*\n\t\t\t* step (off) the *bus*\n\t* **ji**\n\t\t* indirect object\n\t\t\t* give a gift **to** a friend\n\t\t\t\t* *koha o kohao ji onokoi* -> `gift ACC gift-NM DAT friend`\n\t\t* location of existence\n\t\t\t* food is **on** the table\n\t\t\t\t* *kamo ji jirei* -> `food.NM TOP LOC LOC-INANIM`\n\t\t* destination or final arrival point\n\t\t\t* we are **at** her home\n\t\t\t\t* *na ji asasan* -> `3SG LOC house-3SG.F.POSS`\n\t\t\t* we flew **to** London\n\t\t\t\t* *na kiuku ji Landan* -> `3SG fly.V LOC london`\n\t\t* time\n\t\t\t* writing words **at** 3:27 PM\n\t\t\t\t* *payaen kana ji 0328 PM* -> `write-NMLZ word LOC 0328 PM`\n\t\t* goal of a movement\n\t\t\t* went **out to** shop\n\t\t\t\t* *ea ji hari* -> `MOV DAT buy`\n\t\t* passive or causative\n\t\t\t* the boss made the employee write the report\n\t\t\t\t* *komuni komuninqji monu tetoka*\n\t\t\t\t* \"the boss **made** the employee write the report\"\n\t* **un**\n\t\t* instrument or means\n\t\t\t* wrote the book **digitally** / **in/via** electronic interface\n\t\t\t\t* *paya o ribuo un tahete* -> `write ACC book-NM INSTR electronic`\n\t\t\t* ate **with** a spoon\n\t\t\t\t* *kamu un oho* -> `eat-V INSTR spoon`\n\t\t* location of action\n\t\t\t* had fun **at** her house\n\t\t\t\t* *hahaen un asasan* -> `laugh-NMLZ INSTR house-3SG.F.POSS`\n\t\t* material or composition\n\t\t\t* made **of / by / with** wood\n\t\t\t\t* *ru un tsu* -> `CAUS.V INSTR wood`\n\t\t* cause or reason\n\t\t\t* he did not come **as** he was sick\n\t\t\t\t* *so yarara un mahwa* -> `3SG.M come-NEG CAUSAL sick`\n\t\t* limit (time/quantity/scope)\n\t\t\t* the tool is cheap **for** its high quality\n\t\t\t\t* *twana ni lili mani un poki iio* -> `tool TOP little money LMT big good-NM`\n\t\t\t\t\t* lit. \"as for the tool, it is of little money for its big goodness\"\n\t\t\t* finished work **in** 3 days\n\t\t\t\t* *kiwinq irime un 3 ko* -> `continue-INV work PER three day`\n\t* **lla**\n\t\t* heading (towards)\n\t\t\t* heading **towards** the mountains\n\t\t\t\t* *ea lla asasan* -> `MOV ALL house-3SG.F.POSS`\n\t\t\t\t\t* p.s., here, the focus is on 'active direction,' not the destination, unlike *ji*\n\t\t* progression\n\t\t\t* going **to / progressing** towards London\n\t\t\t\t* *ea lla Landan* -> `MOV ALL london`\n\t* **llanh**\n\t\t* spatial starting point\n\t\t\t* I came here **from** Canada\n\t\t\t\t* *yara llanh Canada* -> `come ABL canada`\n\t\t* temporal origin\n\t\t\t* I started **from** almost 1 to 2 o'clock\n\t\t\t\t* *kiwi llambu 1 ato 2 Pi'Em* -> `continue ABL-PROP one or two pm`\n\t\t\t\t\t* *llambu* is an approximate point due to presence of **-bu**\n\t\t* source of material\n\t\t\t* drug **from** fruits\n\t\t\t\t* *kara llanh ba*\n\t\t\t\t\t* p.s., here, it is about transformation or change itself; in *un*, the original material was wood, but with *llanh*, the original material has changed (fruits to drugs, seed to plant, etc.)\n\t\t* source of information / giving\n\t\t\t* heard about it **from** her\n\t\t\t\t* *fofunai ita ryo llanh sa* -> `speak.V-IV PRTV DEM.PROX ABL 3SG.F`\n\t* **mo**\n\t\t* comitative\n\t\t\t* I never argue **with** my sister\n\t\t\t\t* *shahadara mo pashachasun* -> `fight-NEG COM sibling-F-1SG.POSS`\n\t\t* as an additive\n\t\t\t* apples **and** bananas (and as such)\n\t\t\t\t* *atora mo karaba* -> `apple ADD creamfruit`\n\t\t* quotation or boundary of a thought or sound\n\t\t\t* the bell rang **with** a ding\n\t\t\t\t* *kare iyuku mo 'jing'* -> `bell sound.V COM ding`\n\t\t\t* he said **that** he will come\n\t\t\t\t* *so fofu mo yara* -> `3SG speak.V QUOT come`\n\t\t* comparison\n\t\t\t* bigger **than** him\n\t\t\t\t* *iepoki mo so* -> `AUG-big COMP 3SG.M`\n\t\t* temporal sequence or sequentiality\n\t\t\t* ate **then** went to talk to him\n\t\t\t\t* *kamu mo ea ji fofu ji so* -> `eat.V SEQ go DAT speak.V DAT 3SG.M`\n\t\t* contrasting linker (as **mo mo**)\n\t\t\t* **but** I'm eating\n\t\t\t\t* *mo mo su kamen* -> `but 1SG eat.NMLZ`\n\t\t\t* you can do it **but** only if you pay first\n\t\t\t\t* *nasute fu, mo mo mani shi wan* -> `ability.V-INF ACT CONT money COND first`\n\t* **ita**\n\t\t* aboutness, regarding\n\t\t\t* speak **about** her\n\t\t\t\t* *fofu ita sa* -> `speak.V PRTV 3SG.F`\n\t\t* circumambulate\n\t\t\t* walk **about / around** a house\n\t\t\t\t* *haekukun ita asa* -> `walk.V-LIT PRTV house`\n\t\t\t\t* p.s. use *haekukun* if *haeku* alone is ambiguous, as *haeku* can mean to learn as well (e.g., learn about a house)\n\t\t* partitive\n\t\t\t* drink **some of** this water\n\t\t\t\t* *kamu chi no ita* -> `eat.V water GEN PRTV`\n\t\t\t* **some of** the people like me\n\t\t\t\t* *hon no ita kita su* -> `person GEN PRTV like 1SG`\n\t\t\t* **not yet done** sending the picture\n\t\t\t\t* *senoden o no ita emono* -> `send.NMLZ ACC GEN PRTV picture`\n\t* **itanh**\n\t\t* avoiding, focusing (away) from the centre\n\t\t\t* why are you **beating around the bush regarding** her?\n\t\t\t\t* *zu fofu itanh sa* -> `2SG speak.V EX 3SG.F`\n\t\t* exclude\n\t\t\t* walk **avoiding** the house\n\t\t\t\t* *haeku itanh asa* -> `walk.V EX house`\n\t\t* totalitive\n\t\t\t* drink **all of** this water\n\t\t\t\t* *kamu chi no itanh* -> `eat.V water GEN TOT`\n\t\t\t* **all of** the people like me\n\t\t\t\t* *hon no itanh kita su* -> `person GEN TOT like 1SG`\n\t\t\t* **completed / fully done** sending the picture:\n\t\t\t\t* *senoden o no itanh emono* -> `send.NMLZ ACC GEN TOT picture`\n\t* **po**\n\t\t* being in favour or supporting \n\t\t\t* she is for him / for his favour / in favour of him\n\t\t\t\t* *sa po so* -> `3SG.F FOR 3SG.M`\n\t\t* positioned beside or alongside a thing\n\t\t\t* I am beside the house **(poji)**\n\t\t\t\t* *su poji asa* -> `1SG FOR-LOC house`\n\t* **bo**\n\t\t* being against\n\t\t\t* she is against him\n\t\t\t\t* *sa bo so* -> `3SG.F CNTR 3SG.M`\n\t\t* resting against or using a thing as support **(boji)**\n\t\t\t* I am opposite to / against the house\n\t\t\t\t* *su boji asa* -> `1SG CNTR-LOC house`\n\t\t\t* I'm resting against the house's walls\n\t\t\t\t* *sua rawa boji ga no asa* -> `1SG-A rest CNTR-LOC side GEN house`\n\t\t* acting as substitute (instead of)\n\t\t\t* we need peace instead of war\n\t\t\t\t* *na′a anisu o ritarusumata boji shahada* -> `1PL-A need.V soft-essence CNTR-LOC war`\n","3 Pronouns and topic.md":"## 3.1 Table\n| Pronoun | IPA  | English equivalent | Gloss |\n| ------- | ---- | ------------------ | ----- |\n| *su*    | `su` | I                  | 1SG   |\n| *sa*    | `sa` | she                | 3SG.F |\n| *so*    | `so` | he                 | 3SG.M |\n| *wu*    | `ʋu` | it                 | 3SG   |\n| *na*    | `na` | we                 | 1PL   |\n| *zu*    | `zu` | you                | 2SG   |\n| *za*    | `za` | you (pl.)          | 2PL   |\n| *ei*    | `ei` | that (proposition) | ANAPH |\n| *ni*    | `ɲi` | As for (...)       | TOP   |\n* Make any pronoun a genitive by appending **-n**:\n\t* *san* -> hers (**asasan** - `house-3SG.F.POSS`, her house)\n* Possession markers take a *t/d* form if the word ends in the same sequence:\n\t* *Dasun* + *-sun* -> *dasuntsun*\n\t* *Dazun* + *-zun* -> *dasundzun*\n* Pronunciation is self-explanatory\n* They can be dropped, since much of **Kakatte Koyeah** is a register of **Modern Tawa**, which is a register of **Southern Tawa**\n* Use *a* (dummy pronoun) to refer to a subject:\n\t* *sa ni a kita* -> `3SG TOP A like`\n\t\t* \"(As for) her, I like (her)\"\n\t* if you did not use *a*:\n\t\t* *sa ni kita* -> `3SG TOP like`\n\t\t\t* \"(As for her), she likes...\"\n","4 Other grammar.md":"## 4.1 **Ashi Tawa** and **Koyeah Tawa**\n* *Ashi Tawa* (Modern Tawa) and *Koyeah Tawa* are registers of the same language, *Sowãnqku Tawa* (Southern Tawa)\n* Koyeah Tawa's grammar is the same as Ashi Tawa's, except for some differences at the fundamental level, which have been listed in:\n\t* **1 Register basics**\n\t* **2 Cases**\n\t* **3 Pronouns and topic**\n* This means that Koyeah Tawa has the same *similative family* (imo, im, imnyi...), the same *Actor-Undergoer distinction*, and even the same *clausal features*:\n\t* **honeu haha** -> `person-REL.COP funny`\n\t\t* \"The person that is funny\"\n\t* **so′o korunai** -> `3SG.M-U die.V-IV`\n\t\t* \"He died\"\n\n## 4.2 What **Koyeah Tawa** lacks\n* Koyeah Tawa primarily lacks:\n\t* *advanced aspect*\n\t\t* it only has: **tohi/toppu** and **rehi/reppu**\n\t\t* aspect are unbound morphemes in Koyeah Tawa:\n\t\t\t* *su kamu myo atora tohi* -> `1SG eat.V QNT apple PFV-BACK`\n\t\t\t\t* \"I ate many apples\"\n\t* *articles*\n\t* *plural articles*\n\t* *augmentative-superlatives*\n\t\t* it only uses reduplication\n\t\t\t* **ii** (good) -> **ii'ii** (best)\n\t\t\t* **kanata** (happy) -> **kakanata** (happiest)\n\t\t* it does retain *ie*, *sta*, and *ol*:\n\t\t\t* **olii** -> too good\n\t\t\t* **iista** -> least good\n\t\t\t* **ieii** -> better / (more) good / pretty good / decent\n\t* *vocatives*\n\t\t* only the interjection *à* or word *waka* are used for calling\n\t* *platonic-romantic distinctions*\n\t* *advanced mood*\n\t\t* there is only one imperative **ake** and one request **fuka** marker\n\t\t* the assertion or emphatic particle **ya** is retained\n\t\t* grammaticalised evidentiality (**ipappu** / **ipa-**), desideratives (**atai**), and optatives (**are**) remain\n\t\t* only one way to ask questions, it is by adding *no?* to the end\n\t* *modal particles*\n\t\t* the modal particle *ũ* has been turned into an infinitive *te* here\n\t\t* *te* functions the same as the English **to** in terms of modifying verbs, like in *kitate riwaka* (like **to** think)\n\t* *noun-compounding marker*\n\t\t* **ce** does not exist\n\t* *advanced conditionality particles*\n\t\t* there is only **shi** to mark context\n\t\t* both *irreal verbs* and *irreal nouns* have been pruned\n\t\t\t* e.g., you'd say *ieiite kamu* -> `AUG-good-INF eat.V`\n\t\t\t\t* \"better to eat\"\n\t\t\t\t* ~\"I should eat\"\n\t\t* cases or other particles can specify the type of context (no **zhi/shi** distinction)\n\t\t\t* do note that the entire relationship system, apart from **zhi**, is intact (e.g., **ze**, **ho**, etc.)\n\n## 4.3 Ashi Tawa phonological complexity\n* There is no vowel devoicing in Koyeah Tawa, so:\n\t* *fofunai*\n\t* *subunai*\n\t* *fofoku*\n* ... are all pronounced as they are pronounced\n* ′o-root rules and garibankana rules also no longer apply\n* Garibankana ending in two *o*'s are simply spelt with **one ′o** in Koyeah Tawa:\n\t* *itsukoo* -> *itsuko*\n* Though many simple rules, such as *n* -> *m* before bilabials or *n* -> *ŋ* before velars apply.\n"}; 

        const navList = document.getElementById('nav-list');
        const contentArea = document.getElementById('doc-content');
        const searchInput = document.getElementById('search');

        function cleanName(name) {
            return name.replace(/^\d+\s*/, '').replace('.md', '').replace(/-/g, ' ');
        }

        function renderDoc(filename, highlightTerm = null) {
            const rawContent = DOCS_DATA[filename];
            if(!rawContent) return;

            contentArea.innerHTML = marked.parse(rawContent);
            
            if (highlightTerm && highlightTerm.trim() !== "") {
                const walker = document.createTreeWalker(contentArea, NodeFilter.SHOW_TEXT, null, false);
                const nodes = [];
                while(walker.nextNode()) nodes.push(walker.currentNode);

                nodes.forEach(node => {
                    const text = node.textContent;
                    const regex = new RegExp(`(${highlightTerm})`, 'gi');
                    if(regex.test(text)) {
                        const span = document.createElement('span');
                        span.innerHTML = text.replace(regex, '<mark>$1</mark>');
                        node.parentNode.replaceChild(span, node);
                    }
                });

                const firstMark = contentArea.querySelector('mark');
                if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === filename);
            });
        }

        function handleSearch(query) {
            const term = query.toLowerCase().trim();
            navList.innerHTML = '';
            
            if (!term) {
                initDefaultSidebar();
                return;
            }

            let resultsFound = false;
            Object.keys(DOCS_DATA).forEach(filename => {
                const content = DOCS_DATA[filename];
                const chapterName = cleanName(filename);
                const lowerContent = content.toLowerCase();

                if (chapterName.toLowerCase().includes(term) || lowerContent.includes(term)) {
                    resultsFound = true;
                    const resDiv = document.createElement('div');
                    resDiv.className = 'search-result';
                    
                    let snippet = "";
                    const index = lowerContent.indexOf(term);
                    if (index !== -1) {
                        const start = Math.max(0, index - 30);
                        const end = Math.min(content.length, index + 50);
                        snippet = content.substring(start, end).trim().replace(/\n/g, ' ') + "...";
                    } else {
                        snippet = "Match in title";
                    }

                    resDiv.innerHTML = `
                        <div class="result-chapter">${chapterName}</div>
                        <div class="result-snippet">${snippet}</div>
                    `;
                    resDiv.onclick = () => renderDoc(filename, term);
                    navList.appendChild(resDiv);
                }
            });

            if (!resultsFound) {
                navList.innerHTML = '<div style="padding:1rem; opacity:0.4; font-size:0.8rem; text-align:center;">No results found ✨</div>';
            }
        }

        function initDefaultSidebar() {
            navList.innerHTML = '';
            Object.keys(DOCS_DATA).forEach((filename, index) => {
                const btn = document.createElement('div');
                btn.className = 'nav-item';
                btn.dataset.file = filename;
                btn.textContent = cleanName(filename);
                btn.onclick = () => renderDoc(filename);
                navList.appendChild(btn);
                if (index === 0 && contentArea.innerHTML === "") renderDoc(filename);
            });
        }

        searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
        initDefaultSidebar();
    </script>
</body>
</html>
