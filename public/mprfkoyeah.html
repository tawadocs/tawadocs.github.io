<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iyuklú | KOYEAH</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0d0a15;
            --sidebar-bg: rgba(20, 15, 35, 0.8);
            --accent: #d4b7ff;
            --accent-hot: #b485ff;
            --text: #f5f5ff;
            --card-border: rgba(180, 133, 255, 0.2);
            --sidebar-width: 300px;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 100% 100%, #1e153d 0%, transparent 60%);
            color: var(--text);
            font-family: "Plus Jakarta Sans", sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            backdrop-filter: blur(40px);
            border-right: 1px solid var(--card-border);
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        /* Back Button Styling */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            transition: 0.3s;
            width: fit-content;
        }

        .back-btn:hover {
            background: rgba(180, 133, 255, 0.1);
            color: white;
            border-color: var(--accent-hot);
        }

        .sidebar-header {
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            color: white;
            letter-spacing: 0.1em;
            text-align: center;
        }

        .nav-item {
            padding: 1rem 1.2rem;
            margin-bottom: 0.5rem;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            color: var(--accent);
            font-weight: 600;
        }

        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .nav-item.active { background: var(--accent-hot); color: white; box-shadow: 0 10px 20px rgba(180, 133, 255, 0.3); }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 6rem 4rem;
            max-width: 1200px;
        }

        #doc-content {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 5rem;
            line-height: 1.8;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* Technical MD Styling */
        h1, h2 { color: var(--accent-hot); border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin: 2rem 0; background: rgba(255,255,255,0.02); border-radius: 15px; overflow: hidden; }
        th { background: var(--accent-hot); color: white; padding: 1rem; text-align: left; }
        td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </a>

        <div class="sidebar-header">Morphology</div>
        <div id="nav-list"></div>
    </div>
    <div class="main-content">
        <article id="doc-content"></article>
    </div>

    <script>
        // Placeholder data for demonstration - Replace with your build script injection
        const DOCS_DATA = {"1 Phonetics.md":"## 1.1 Consonant inventory\n|                    | Plosive | Nasal      | Fricative | Affricate | Tap/flap | Approximant |\n| ------------------ | ------- | ---------- | --------- | --------- | -------- | ----------- |\n| **Bilabial**       | b p     | m m̥͡m m͡n | ɸ         |           |          |             |\n| **Dentialveolar**  | t d     |            |           | t͡s d͡z   |          |             |\n| **Alveolar**       |         | n n̥͡n     | s z       |           | ɺ ɾ      |             |\n| **Alveolopalatal** |         | nʲ         | ɕ ʑ       | t͡ɕ d͡ʑ   |          |             |\n| **Palatal**        | cʰ      | ɲ          |           |           |          | j           |\n| **Velar**          | k g     | ŋ          |           |           |          |             |\n| **Labiodental**    |         |            |           |           |          | ʋ           |\n| **Labiovelar**     |         | m͡ŋ        |           |           |          | w           |\n| **Uvular**         |         | ɴ          |           |           |          |             |\n| **Glottal**        | ʔ       |            | h         |           |          |             |\n* Note the differences from Ashi Tawa (see full differences in **6 Grammatical Differences** in *KOYEAH grammar* documentation)\n* And other than that, there's voiceless vowels and a few other quirks\n* *hy* is always pronounced /ç͡j/ or just /çj/ for simplicity\n* Note that:\n\t* *m͡ŋ* can also be pronounced `/m͡g~məgu̥/`\n\t\t* so *mga* can be:\n\t\t\t* `/m͡ŋa~m͡ga~məga/`\n\t\t* the `/u̥/` is omitted if something comes after *mg* in the velar pronunciation\n* The vowel system is basically the same as Ashi Tawa\n* Labio-velar/dental-isation rules remain the same:\n\t* e.g., *rw* :: *ɺʷ*\n\t\t* **ʷ**\n\t\t\t* for labiovelarisation\n\t\t* **ᶹ**\n\t\t\t* for labiodentalisation\n* Note that:\n\t* *mn* **can** be realised as:\n\t\t* `/m͡ɲ/`\n\t* but this only happens before bilabial and velar consonants, so:\n\t\t* *amnkita* is:\n\t\t\t* `/'a.m͡ɲ.'ci̥.ta/`\n\t\t* and *amnbaka* is:\n\t\t\t* `/'a.m͡ɲ.'ba.ka/`\n\t* some speakers may still pronounce it as `/m͡n/`, regardless of the fact\n\n## 1.2 Vowel inventory\n|               | Front | Near-front | Central | Near-back | Back |\n| ------------- | ----- | ---------- | ------- | --------- | ---- |\n| **High**      | i ĩ  |            |         |           | u ũ |\n| **Near-high** |       | ɪ          |         | ʊ         |      |\n| **Mid**       | e ẽ  |            | ə       |           | o õ |\n| **Low-mid**   |       | ɛ          |         |           |      |\n| **Near-low**  | æ     |            |         |           | ɔ    |\n| **Low**       |       |            | a ã    |           |      |\n* The nasalised **ã** /ã/ and **h** /h/ are actually pronounced differently when functioning as the modern semantic reverser\n* Read **4:4.1.1** (**4 Irregularities**)\n","2 Basic phonotactics.md":"* In y-consonantal clusters yielded from reduplication, such as *mymyo* (most), an *[ɪ]* is inserted before the subsequent mora:\n\t* *mymyo* -> [mʲɪmʲo]\n","3 Orthography.md":"## 3.1 Standardised Tawish orthography\n* The Standardised Modern Tawish (post-Tawaistãnq standardisation but pre-Tawaistãnq register split) orthography is used\n* This means each word is written as it is pronounced in Ashi Tawa, even though it isn't pronounced that way in Koyeah Tawa\n* In the new orthography, note these changes:\n\t* *rh* for *rr*\n\n## 3.2 New reform\n* Now, orthographically, you still write:\n\t* *Wanbu*\n* ... but it is obviously pronounced as:\n\t* *wambu*\n* Before, Tawish orthography used *wambu*, but, now, you only use the regular nasal\n* Same with something like *un fu*, which is actually pronounced (in NSKT) like this:\n\t* `/ũᵝm ɸu̥/`\n","4 Irregularities.md":"## 4.1 Consonants\n* Note that some consonants have many variants due to dialects or speaker:\n\t* *mg* :: `/m͡ŋ~m͡g~ʘ͡ŋ/`\n\t\t* yes, that is a click!\n\t\t* in some Tawish dialects, *mg* is actually a bilabial click (prominent) coarticulated with the velar nasal\n\t\t* in NSKT, it is simply `/m͡ŋ/`\n\t\t* note that the click is **actually** pronounced:\n\t\t\t* `/ᵐʘ͡ŋ/`\n\t\t\t* it starts with an *m-hum* but immediately switches to a coarticulated bilabial click with velar release\n\t\t\t* so, for a split second, you may hear a *m-*\n\t* *N* :: `/ɴ~ɢ~q/`\n\t\t* it is written as: *hg*, *h*, or *nq*\n\t\t* it is pronounced `/ãõ̯/` if written as *nq*\n\t\t\t* note that the pronunciation of this diphthong varies speaker-to-speaker\n\t\t\t* some pronounce it in one beat (so it is one mora), whereas others may pronounce it as two morae:\n\t\t\t\t* `/ã.õ̯/`\n\t\t\t\t* in NSKT, this diphthong (the only diphthong in Tawa) is usually one mora\n\n### 4.1.1 More on the uvular nasal\n* If *nq* is in a non-word-final position, it becomes a bare vowel sequence and loses its gliding property, pronounced only as:\n\t* `/ã.õ/`\n* So:\n\t* *Nqoro* is `/'ã.õ.'o.ɺo/`\n\t\t* note that the /ã.õ/ sequence either gets **no stress** or whatever follows it gets stressed again\n\t\t* so both are valid:\n\t\t\t* `/ã.õ.'o.ɺo/`\n\t\t\t* `/'ã.õ.'o.ɺo/`\n* But in word-final positions, for example:\n\t* *Kamunq* is `/'ka.mu.'ãõ̯/`~`/'ka.mu.'ã.õ̯/`\n* As the uvular nasal, it is written as *h* or *hg*\n* These are the rules:\n\t* before the vowel **/u/**\n\t\t* use *h*\n\t* non-word-final position\n\t\t* use *hg*\n\t* word-final position\n\t\t* use *h* (it becomes a diphthong again)\n* So:\n\t* *Hgopo* is `/'ɴo.po/`\n\t* *Hupo* is `/'ɴu.po/`\n\t* *Pohuhgo* is `/'po.ɴu.ɴo/`\n* The *h-final* ending is realised as the diphthong `/ãõ̯~ã.õ̯/` though:\n\t* *Iah* :: `/'i.a.'ãõ̯/~/'i.a.'ã.õ̯/`\n* At the end of consonants, the semantic inverser uses the *ã* form:\n\t* *Honã* :: `/'hɔ.'nãõ̯/~/'hɔ.'nã.õ̯/`\n* Monomoraic words take *ã*:\n\t* *Huã* :: `/'ɴu.'ãõ̯/~/'ɴu.'ã.õ̯/`\n\t* *Uã* :: `/'u.ãõ̯/~/'u.'ã.õ̯/`\n* Before any **h**-syllable, *ã* is used:\n\t* *Hhuã* :: `/'ɴ.ɴu.'ãõ̯/~/'ɴ.ɴu.'ã.õ̯/`\n\t* *Kohaã* :: `/'ko.ha.'ãõ̯/~/'ko.ha.'ã.õ̯/`\n* Between vowels or valid **h-syllables**, you use *ã*:\n\t* *Aishiãioe*\n\t* *Aishiãyaru*\n* But, for invalid syllables (plus bimoraic or greater, non-preceding-h-syllable, non-consonantal-final), you use *h*:\n\t* *Aishihta*\n\n### 4.1.2 The Tawish diphthong\n* All of this also explains why Tawa only has one, singular diphthong\n* The diphthong comes from the uvular nasal itself, as the nasal was vocalised\n\n## 4.2 Depalatalisation\n* Almost all palatalised consonants have turned into:\n\t* **C** + **i**\n\t* e.g.,\n\t\t* *mya* is actually pronounced `/mia/`\n\t\t* *myia* is different, pronounced `/mʲia/`\n* Even *hy* sequences are just *hi* now:\n\t* *hyako* (clothes), now spelt *hiako*\n* So, a palatalised consonant like *ky* is always pronounced like *ki*\n* Keep these patterns in mind:\n\t* usually, the *y* is replaced with a simple *i* in most words now\n\t\t* it is the older words like *myo* which have survived this\n\t* a consonant plus *yi* sequence always results in palatalisation, not a double *i* vowel\n\t\t* *m* + *yi* :: *myi* `/mʲi/`\n"}; 

        const navList = document.getElementById('nav-list');
        const contentArea = document.getElementById('doc-content');

        function renderDoc(filename) {
            contentArea.innerHTML = marked.parse(DOCS_DATA[filename] || "");
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.file === filename));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        Object.keys(DOCS_DATA).forEach((filename, index) => {
            const btn = document.createElement('div');
            btn.className = 'nav-item';
            btn.dataset.file = filename;
            btn.textContent = filename.replace(/^\d+\s*/, '').replace('.md', '');
            btn.onclick = () => renderDoc(filename);
            navList.appendChild(btn);
            if (index === 0) renderDoc(filename);
        });
    </script>
</body>
</html>
