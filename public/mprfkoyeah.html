<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iyuklú | KOYEAH</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0d0a15;
            --sidebar-bg: rgba(20, 15, 35, 0.8);
            --accent: #d4b7ff;
            --accent-hot: #b485ff;
            --text: #f5f5ff;
            --card-border: rgba(180, 133, 255, 0.2);
            --sidebar-width: 300px;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 100% 100%, #1e153d 0%, transparent 60%);
            color: var(--text);
            font-family: "Plus Jakarta Sans", sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            backdrop-filter: blur(40px);
            border-right: 1px solid var(--card-border);
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        /* Back Button Styling */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            transition: 0.3s;
            width: fit-content;
        }

        .back-btn:hover {
            background: rgba(180, 133, 255, 0.1);
            color: white;
            border-color: var(--accent-hot);
        }

        .sidebar-header {
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            color: white;
            letter-spacing: 0.1em;
            text-align: center;
        }

        .nav-item {
            padding: 1rem 1.2rem;
            margin-bottom: 0.5rem;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            color: var(--accent);
            font-weight: 600;
        }

        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .nav-item.active { background: var(--accent-hot); color: white; box-shadow: 0 10px 20px rgba(180, 133, 255, 0.3); }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 6rem 4rem;
            max-width: 1200px;
        }

        #doc-content {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 5rem;
            line-height: 1.8;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* Technical MD Styling */
        h1, h2 { color: var(--accent-hot); border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin: 2rem 0; background: rgba(255,255,255,0.02); border-radius: 15px; overflow: hidden; }
        th { background: var(--accent-hot); color: white; padding: 1rem; text-align: left; }
        td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </a>

        <div class="sidebar-header">Morphology</div>
        <div id="nav-list"></div>
    </div>
    <div class="main-content">
        <article id="doc-content"></article>
    </div>

    <script>
        // Placeholder data for demonstration - Replace with your build script injection
        const DOCS_DATA = {"1 Phonetics.md":"## 1.1 Consonant inventory\n|                    | Plosive | Nasal  | Fricative | Affricate | Tap/flap | Glide | Approximant |\n| ------------------ | ------- | ------ | --------- | --------- | -------- | ----- | ----------- |\n| **Bilabial**       | b p     | m m̥͡m | ɸ         |           |          |       |             |\n| **Labiodental**    |         |        |           |           |          |       |             |\n| **Linguolabial**   |         | n̼     |           |           |          |       |             |\n| **Dentialveolar**  | t tʰ d  |        |           | t͡s d͡z   |          |       | l           |\n| **Alveolar**       |         | n      | s z       |           | ɾ        |       |             |\n| **Alveolopalatal** |         | nʲ     | ɕ ʑ       | t͡ɕ d͡ʑ   |          |       |             |\n| **Palatal**        |         |        |           | c͡ç       |          | j     |             |\n| **Velar**          | k kʰ g  | ŋ      |           |           |          |       |             |\n| **Labiovelar**     |         |        |           |           |          | w     |             |\n| **Uvular**         |         | ɴ      |           |           |          |       |             |\n| **Glottal**        | ʔ       |        | h         |           |          |       |             |\n* Koyeah Tawa lost:\n\t* /ɺ ʋ ʎ/\n* and it does not distinguish:\n\t* /ɺ/ or /ɾ/\n\t* /ʋ/ or /w/\n\t* /ʎ/ or /lʲ/\n* Note: **Koyeah** is pronounced ['ko.je.a(h)]\n\n## 1.2 Vowel inventory\n|               | Front | Near-front | Central | Near-back | Back |\n| ------------- | ----- | ---------- | ------- | --------- | ---- |\n| **High**      | i     |            |         |           | u    |\n| **Near-high** |       | ɪ          |         | ʊ         |      |\n| **Mid**       | e     |            | (ə)     |           | o    |\n| **Low-mid**   |       | ɛ          |         | (ʌ)       |      |\n| **Near-low**  | æ     |            |         |           | ɔ    |\n| **Low**       |       |            | a       |           |      |\n* Vowels are split into these groups:\n\t* Regular: *a i u e o*\n\t* Peripheral: *á í ú é ó*\n\t* Neutral vowels are not marked and are non-distinctive\n\n## 1.3 Allophones\n| Phoneme | Allophone | Condition                 |\n| ------- | --------- | ------------------------- |\n| nʲ      | ɲ         | /ɲ/ in consonant clusters |\n| n       | ŋ         | /ŋ/ before velars         |\n| h       | ç         | /ç/ before [i ɪ]          |\n| h       | ɸ         | [ɸ] before [u]            |\n* *n* [n] changes into *m* [m] before bilabials (e.g., *hon* + *ppu* -> *homppu*)\n"}; 

        const navList = document.getElementById('nav-list');
        const contentArea = document.getElementById('doc-content');

        function renderDoc(filename) {
            contentArea.innerHTML = marked.parse(DOCS_DATA[filename] || "");
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.file === filename));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        Object.keys(DOCS_DATA).forEach((filename, index) => {
            const btn = document.createElement('div');
            btn.className = 'nav-item';
            btn.dataset.file = filename;
            btn.textContent = filename.replace(/^\d+\s*/, '').replace('.md', '');
            btn.onclick = () => renderDoc(filename);
            navList.appendChild(btn);
            if (index === 0) renderDoc(filename);
        });
    </script>
</body>
</html>
