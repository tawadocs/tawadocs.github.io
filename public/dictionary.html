<html lang="en">

        <link

        <style>
            :root {
                --bg: #050505;
                --card-bg: #0f0f12;
                --card-hover: #16161a;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #6366f1;
                --accent-glow: rgba(99, 102, 241, 0.2);
                --toki-yellow: #facc15;
                --toki-glow: rgba(250, 204, 21, 0.2);
                --border: rgba(255, 255, 255, 0.08);
                --border-hover: rgba(255, 255, 255, 0.15);
                --sidebar-bg: #0a0a0c;
            }

            * {
                box-sizing: border-box;
            }

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background-color: var(--bg);
                background-image: radial-gradient(
                    circle at 50% -20%,
                    #1e1e2e 0%,
                    #050505 80%
                );
                color: var(--text-main);
                margin: 0;
                padding: 0;
                line-height: 1.6;
                min-height: 100vh;
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            body::-webkit-scrollbar {
                display: none;
            }

            .container {
                max-width: 1000px;
                margin: 0 auto;
                padding: 4rem 2rem;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 4rem;
            }

            .logo-group {
                display: flex;
                gap: 1.5rem;
                align-items: center;
            }
            .logo-link {
                text-decoration: none;
                transition: transform 0.2s ease;
                cursor: pointer;
                user-select: none;
            }
            .logo-link:hover {
                transform: translateY(-1px);
            }
            h1 {
                font-size: 1.25rem;
                font-weight: 800;
                letter-spacing: -0.02em;
                color: white;
                margin: 0;
            }
            h1 span {
                color: var(--accent);
            }

            #search {
                display: block;
                width: 100%;
                max-width: 600px;
                margin: 0 auto 4rem;
                padding: 1.2rem 1.5rem;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid var(--border);
                backdrop-filter: blur(10px);
                border-radius: 16px;
                color: white;
                outline: none;
                font-size: 1.1rem;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            }
            #search:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 4px var(--accent-glow);
            }

            #results {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.5rem;
            }

            .entry {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 20px;
                padding: 1.5rem;
                cursor: pointer;
                transition: all 0.3s ease;
                position: relative;
            }
            .entry:hover {
                transform: translateY(-5px);
                background: var(--card-hover);
                border-color: var(--border-hover);
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            }

            .lang-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 6px 12px;
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--border);
                font-size: 0.7rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--text-muted);
                transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
                margin-bottom: 1.2rem;
                cursor: pointer !important;
                user-select: none;
                min-width: 100px;
            }

            .lang-toggle:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: var(--text-muted);
                color: white;
            }
            .lang-toggle.is-toki {
                background: var(--toki-yellow);
                color: #000;
                border-color: var(--toki-yellow);
                box-shadow: 0 4px 15px var(--toki-glow);
            }

            .word-title,
            .static-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: white;
                margin-bottom: 0.5rem;
                letter-spacing: -0.02em;
                transition:
                    opacity 0.2s ease,
                    transform 0.2s ease,
                    color 0.3s ease;
            }

            .is-shifting {
                opacity: 0;
                transform: translateY(2px);
            }
            .title-toki {
                color: var(--toki-yellow) !important;
            }

            .def-preview {
                font-size: 0.95rem;
                color: var(--text-muted);
                line-height: 1.5;
                pointer-events: none;
            }

            #modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.85);
                backdrop-filter: blur(12px);
                z-index: 1000;
                opacity: 0;
                visibility: hidden;
                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            }
            #modal-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            #modal {
                position: fixed;
                right: 0;
                top: 0;
                background: var(--sidebar-bg);
                width: 100%;
                max-width: 520px;
                height: 100vh;
                padding: 4rem 3rem;
                border-left: 1px solid var(--border);
                box-shadow: -20px 0 60px rgba(0, 0, 0, 0.8);
                display: flex;
                flex-direction: column;
                transform: translateX(100%);
                transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--accent) transparent;
            }

            #modal::-webkit-scrollbar {
                width: 6px;
            }
            #modal::-webkit-scrollbar-track {
                background: transparent;
            }
            #modal::-webkit-scrollbar-thumb {
                background: var(--border-hover);
                border-radius: 10px;
            }

            #modal-overlay.active #modal {
                transform: translateX(0);
            }

            .modal-close {
                position: absolute;
                top: 2rem;
                right: 2.5rem;
                cursor: pointer;
                color: var(--text-muted);
                font-size: 1.5rem;
                transition: 0.2s;
                user-select: none;
                z-index: 10;
            }
            .modal-close:hover {
                color: white;
                transform: rotate(90deg);
            }

            .static-title {
                font-size: 3.5rem;
                font-weight: 800;
                margin-bottom: 0rem;
            }

            .id-container {
                margin-bottom: 1.5rem;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .id-label {
                font-size: 0.65rem;
                font-weight: 800;
                text-transform: uppercase;
                color: var(--toki-yellow);
                opacity: 0.8;
                letter-spacing: 0.05em;
            }
            .static-id {
                background: rgba(250, 204, 21, 0.05);
                border: 1px solid rgba(250, 204, 21, 0.2);
                border-radius: 6px;
                padding: 4px 10px;
                color: var(--toki-yellow);
                font-size: 0.9rem;
                font-weight: 600;
                width: auto;
            }

            .static-defs-div {
                font-size: 1.2rem;
                line-height: 1.8;
                color: var(--text-main);
                padding: 0.5rem 0 1rem 0;
                width: 100%;
            }
            .semantic-title {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.15em;
                color: var(--accent);
                margin: 3rem 0 1rem 0;
                font-weight: 700;
                opacity: 0.8;
            }
            .modal-divider {
                height: 1px;
                background: var(--border);
                margin: 2rem 0;
            }
        </style>

},{"text":"coming","frequency":100},{"text":"future","frequency":100},{"text":"summoned","frequency":100},{"text":"become","frequency":100},{"text":"upcoming","frequency":100},{"text":"emerging","frequency":100},{"text":"emerge","frequency":100},{"text":"happen","frequency":100},{"text":"occur","frequency":100}]},{"word":"yawa","id":"pakala a","definitions":[{"text":"devil","frequency":100},{"text":"evil","frequency":100},{"text":"demon","frequency":100},{"text":"bad spirit","frequency":100},{"text":"monster","frequency":100},{"text":"bad luck","frequency":100}]},{"word":"yowa","id":"poki","definitions":[{"text":"container","frequency":100},{"text":"holder","frequency":100},{"text":"part of a whole","frequency":100},{"text":"subset","frequency":100},{"text":"containment","frequency":100},{"text":"include","frequency":100},{"text":"contain","frequency":100},{"text":"comprise","frequency":100},{"text":"enter","frequency":100},{"text":"fit inside","frequency":100},{"text":"hide","frequency":100},{"text":"harbour","frequency":100},{"text":"wrap","frequency":100},{"text":"enclose","frequency":100}]},{"word":"yume","id":"lukin, kama sona","definitions":[{"text":"read","frequency":100},{"text":"read (the room)","frequency":100},{"text":"read (intentions)","frequency":100},{"text":"read (one's face)","frequency":100},{"text":"fortune telling","frequency":100},{"text":"read (palms)","frequency":100},{"text":"read (omens","frequency":100},{"text":"tarots)","frequency":100},{"text":"read (for learning)","frequency":100},{"text":"study","frequency":100},{"text":"interpret","frequency":100},{"text":"silent reading","frequency":100},{"text":"read (performance or presentation)","frequency":100},{"text":"analysis","frequency":100},{"text":"load data","frequency":100},{"text":"pronounce","frequency":100},{"text":"literate","frequency":100},{"text":"knowledgeable","frequency":100},{"text":"literature","frequency":100},{"text":"story","frequency":100}]},{"word":"zhamu","id":"sewi, jan sewi","definitions":[{"text":"God","frequency":100},{"text":"deity","frequency":100}]},{"word":"zhupi","id":"pipi","definitions":[{"text":"bug","frequency":100},{"text":"insect","frequency":100},{"text":"spider","frequency":100}]},{"word":"zu","id":"tu","definitions":[{"text":"two","frequency":100},{"text":"pair","frequency":100},{"text":"double","frequency":100},{"text":"both","frequency":100},{"text":"twice","frequency":100},{"text":"couple","frequency":100},{"text":"(pronoun) you","frequency":100}]}];

            const SEMANTIC_SPACE = {"akesi":"teiya are creatures. they tend to be cold to the touch. When they move quickly, they go back and forth on sprawling legs or slither or squirm back and forth across the ground if they lack legs. They're close to the ground. They usually lay eggs. The contents of this semantic space is based off of a pilot study I conducted in 2023 with sample size 98 about the lexical semantics of teiya.","ala":"the semantic space of rra contains nothing. But don't be fooled, it isn't void of information. \"rra′a niru eaucal\" can be \"nobody's looking at the fruit.\" \"honíla kamu rraĉ\" can mean \"the person ate nothing.\" as a modifier, it actually reverses the semantic space of whatever words come before it, which no other content word does. \"honqíla ukajurra eaucal\" can mean \"the animal doesn't hunt for fruit.\" A 'twanarra' is never a type of twana. it does not need to be a modifier, like rrą, to negate. as a verb, rra can mean \"erase\" or \"delete.\" see Grammar:11 for more information.","alasa":"ukajo refers to hunting and foraging. Searching for a lost object is ukajo. Searching for something on a web browser is ukajo. Throwing a spear into the side of a bison could be ukajo because it is part of hunting, as can the act of picking berries, but the core of ukajo is the trying to find. Recently (as in during the past half a decade), usage of ukajo to refer to attempting or trying has become very common. So trying to knit could be a type of ukajo. Trying to sprint could be a type of ukajo. Trying to look larger than you actually are to scare off a predator could be ukajo.","ale":"subeko is everything. this can be either everything ever or a smaller subset of everything. If you modify subeko with another word, it is limited to objects that have that word's quality, or an entirety of said word. For example, \"mafssubeką\" for \"the whole 'red'.\" \"ribusubeką\" could mean \"the entirety of the book.\" \"irimesubeką\" can mean \"the entirety of a job.\" This is often similar to 'subeko no' constructions, but it's not exactly the same. for example, \"subeko no mafo\" is all 'reds', not the whole 'red', \"subeko no ribu\" is all books, not 'the whole book.' compare these two sentence: 'denh sulla subeko no ribu' (give me all of the books) and 'denh sulla ribusubeką' (give me the entire book). to add an '(all) things related to' nuance, you may use a case or alternative constructions 'denh sulla subekyĉ ribuita' (get me everything related to books (e.g., papers, pens, etc.))","anpa":"nanda refers to the space (or sometimes object) below something. For example, in Toki Pona, \"anpa supa\" is the space under a table. \"anpa kasi\" is the space under a plant. nanda can also refer to qualities of defeat and shame, such as beating someone in a game of chess. You can describe the loser as nanda, and you can use nanda as a verb to mean \"beat.\" nanda can also talk about social stratification and hierarchy. A lower class person can be a nanda hon, but that can also refer to a humble person.","ante":"arene describes a different thing. there are loads of things in the world, and every thing has similarities and differences to other things. In a specific context, if one wishes to frame the differences between objects, arene is incredibly useful. It can refer to the different object itself, qualities of difference, or the concept of change itself. It can also be used as a verb to mean \"alter\" or \"change.\" if it is ambiguous what you mean, use 'imnyiteirra' (not the same) to explicitly say 'different.'","awen":"kiwi refers to inertia itself. so something resisting change or 'continuing' is kiwi. Kiwinq would be the opposite, often translated as 'stop' or 'wait!'","esun":"hari is a type of exchange. Usually it's used to mean \"buy,\" \"sell,\" or \"trade.\" The use of a currency isn't required for something to be hari. Trading baseball cards is hari. hari doesn't imply that both parties lose something. Exchanging knowledge is hari, even though neither party loses knowledge. Some interesting extensions of hari I've seen include using hari for breathing, where one trades the air inside them with the outside world. Seeing hari as a swap more than as a type of buying has had it being used far more often these days in my experience, potentially due to anticapitalist values, and potentially because of natural semantic shift. Some people like this usage because it makes hari more useful. It's far from universal though, and many speakers only use hari to mean something like \"trade\" where two participatory parties exchange items.","ijo":"Everything is within the semantic space of kitei. If a thing is a thing, it is an kitei. This could be anything or something. This could be a physical object, an idea, an action, a place, a sentient being, or any other thing. You are in the semantic space of kitei.","ike":"ike is any negative quality. Anything can be ike. ike is a judgement call. what one person considers ike can be pona to another. For example, the complexity of computer coding is not a good thing for me, so I'd call it ike. But for a lot of my friends, that same complexity is pona! the simple melody of \"mary had a little lamb\" is boring to many people on its own, so they might call it ike. But a baby might enjoy it a lot, so despite being potentially overly simple for adults, it's just right for that baby, i.e. pona. Though of course some babies may like twelve tone rows and some adults may like what others would consider \"children songs.\" It's all relative and case by case. If something isn't bad, you can't use ike to describe it without framing it as such. ike can mean complex and simple just as easily as pona can.","ilo":"The semantic space of twana contains things that are used towards a goal. It’s easy to say that everything can be used. Likewise if something is being used or can commonly be used, it is easy to call it an twana. If I am using a hammer to hammer a nail into the wall, that is an twana. If i am using a psychological method to calm myself down when i’m stressed, that can be an twana as well. Without much context, twana can refer to things that are commonly used as tools. With the context of it being used for something, though, anything can be an twana. It turns actions into machines as a modifier, like in kiuktwanã (aeroplane / fly-machine). twanãsta would refer to smaller-scale tools, like a bee's wings are kiuktwanãsta.","insa":"ĉika talks about things inside of things. Commonly, this is used to describe a location. The location inside of a car is ĉika. It can also be used to describe objects that are inside of things. Someone's organs are ĉika. ĉika doesn't need to be contained completely, it can just mean \"in between.\" A book in the middle of a bookshelf is ĉika. The space between two city buildings is ĉika. It can be used more abstractly too. When compared to a head, a mind is ĉika. In the context of good and bad, ĉika can be neutral. When compared to hot and cold, ĉika can be lukewarm. If anything is being framed as inside of something else, it falls under the semantic space of ĉika.","jaki":"gade talks about unpleasant sensory experiences. This can be any of the senses, internal or external. This could be bad smells, repulsive flavors, gross images, ear-shattering noises, and horrible textures. But it could also be internal sensory experiences such as nausea. gade can be used to refer to other things that aren't usually sensory, and it should be. But be careful, because using gade will frame something through a sensory lens. If someone is acting bad, such as bullying or harassing someone else, you can describe their actions as gade, but doing so makes their actions framed as unpleasant in a sensory way. can also refer to a monkey, donkey, even gorilla in some contexts.","jan":"usage of hon differs a lot between groups of speakers, but many speakers use it broadly to refer to any sentient creature (or more accurately, \"sapient,\" with human intelligence). But this can break down when you consider what sentience is and where we draw lines between ourselves and nature.","jelo":"mhuru refers to yellows, oranges, and sometimes yellowish greens. I would use mhuru to talk about any shade of cadmium yellow.","jo":"ao is the act of holding, carrying, possessing, owning, or broadly having. The english word \"have\" tends to be pretty broad, and ao is no different. Some speakers will only use ao if an object is in someone's hand or they're holding it. Others will use ao for something as abstract as a word having sounds in it or a language having words in it. for some speakers, if I'm borrowing your book, you don't ao it anymore, I do, even if you own it. For other speakers, in that situation both you and I ao the book at the same time in different ways. When you use ao, you're drawing a metaphor between someone's relationship with an object and a world in which they're holding it in their hands. some people like to stretch this metaphor much farther than others. See Grammar:14 for more information. One more thing: 'wua au so ryoteiji' (They have / had him here) would mean something like '~They carried him here.' But do NOT use the romantic form unless you want to imply something wildly different - 'wua annyu so ryoteiji' means '~They had sex with him here'","kala":"Any creature that swims habitually is a kala. This can include anything from fish to whales to seals. The most important aspect of a kala is its relation to water. kala tend to either live in the water or spend a good portion of their time in it. Some speakers extend this usage a bit and let it refer to anything that is in water, like a human swimmer or a pool noodle. Sometimes, toki ponists will describe the act of showering as kala. This usage is often interpreted as somewhat funny, but it is commonly understood. If it isn't, it's easy to clarify.","kalama":"waka is often used as a generic word for gibberish or random sounds, like 'fuyume soa fofu nihi watadà waka!' (what he is saying is only gibberish). other than that, it can be used to signal communication, like a 'wakatwana' (communication device) is used to refer to a cellphone. fofttwana (speaking device), though, is not a communication device, but it could be something like a speaker. also, do not use 'waka' to mean hello or as a generic way of saying hi.","kama":"kama (yara in Tawa) is a strong metaphor in toki pona. To arrive at a location and to arrive at a state of being are the same concept in toki pona. This means that yara can refer to arriving home to eat dinner, arriving at school, or the moment you become an teiya because an evil prescriptivist wizard cursed you for using too many aŝi ganáán. This of course describes yara's use as a preverb, in which its meaning is close to \"become.\" This can imply the start, body, or end of this process. Use yaranq to describe the reverse of the process. Examples: 'so ni yaraén teiyal' (he is becoming a reptile, 'su ni yaraén jizunlla' (I am coming to your place), 'ŝi yaralji, reoppu: suo yara wanílme korru zu' (in the future, I will be the one who kills you). It is better to use yara in some cases than tawa, such as if you are already at someone's place, use yara. It can also roughly be the equivalent of -ise in English, like in 'taheteyarã' (electronise / digitise). It can be used like this too, like 'gadeyarã,' which would mean to disgust-ise or make/become (something) disgusting.","kasi":"miyo is any number of types of plants. big plants like trees are miyo, and small plants like weeds are too! anything largely in the category of \"plant\" is a miyo.","ken":"ken is all about abilities. These could be inherent abilities, like the ability to fly, walk, or swim. These could also be external, like permission to use the bathroom. If I can blow bubbles with bubble gum because I'm not around anyone who I don't want to annoy, that ability is a ken. Unlike some languages, toki pona has a single word that contains all abilities. ken can also refer to a probability or a possibility. The throughline here is almost saying that an event is able to occur, but that doesn't mean it necessarily will or won't. These ideas of possibility and ability are two sides of the same coin.","kepeken":"un is using. For example, \"mi unu kitekilen\" can be \"I use a thing,\" and \"sua katsu asa kitekiun \" can mean \"I build a house using a thing.\" when used as a noun, it can refer to a specific instance of using something or usage in general. For example, \"unil no kitekiryą zunin nihi iinqsubeką\" \"this thing's usage by you is completely bad (wrong).\" Many speakers consider using the other word for path / method for this scenario, though.","kijetesantakalu":"kijetesantakalu is a beloved april fool's joke coined by Sonja Lang in 2009. The whole point is to have one word that represents a uselessly specific set of objects. At the time, kijetesantakalu could only refer to procyonids (raccoons and other very similar animals). In 2021, nano pushed for the semantic space to be widened enough to include ferrets, and this push was so successful that nowadays kijetesantakalu is used to describe all musteloids (weasels, otters, minks, red pandas, wolverines, skunks, badgers, etc).","kili":"kili are fruits and vegetables, i.e. any part of a plant that is edible. These could be fresh. An apple is kili. These could be fermented. Kimchi and pickled onions are kili. These could be preserved through canning. Strawberry jam and dried mango are kili. This could even be a sauce with a primary vegetable component: basil pesto is kili, gazpacho is kili, five minced onions are kili. kili can refer to wheat seeds or other grains that haven't been ground up yet, but flour and bread don't fit well into kili's semantic space.","kin":"wa is in almost all usage close to \"also.\" wa is almost always used as a modifier. Instead of modifying the semantic space of the word it follows, it clarifies the relationship between that word and other ideas that could occupy the same position in the sentence. So if it modifies a subject, it means there are other things that do the same action. If it modifies a verb, it means there are other actions done by the same thing. If it modifies an object, it means that there are other things the action is done to.","kiwen":"taka are things whose form resists changing. This often talks about a hard physical material or object, like a rock or wood or crystal. It can describe something's material, so a chair made out of a hard material could be taka. It is additionally possible to talk about nonphysical things using taka. As a verb, it can refer to strengthening.","ko":"a kara is a powdery or semisolid substance. It is usually dry (use karaĉibu/karachibu for a goo or sludge). However, apart from this, it refers to drugs and medication, like cocaine, but its scope is a bit broader than that: anything psychoactive or bioactive is a kara; therefore, MDMA, meth, ecstasy are kara but so are levetiracetam, paracetamol, and montelukast sodium. it can be used like this 'à, soa kara suõ!' (he drugged me!).","kon":"kiuko covers a very wide range of ideas that are loosely related to each other through the concept of being known, but not seen. You'll often hear people use the phrase \"unseen agent\" to describe kiuko. I've divided this semantic space into three parts: spirits, meaning, and gas. toki pona connects these concepts by giving them all the same word, but this throughline is only a metaphor. In my opinion, these are three distinct senses, not one meaning. It can also mean to fly and jump. So if a bird is flying, you would say 'omukla kiuku' (the bird flies), and if you want to describe a man jumping, you would say 'honla kiukku' (the man jumps). so kiuko -> air; kiuku -> fly; kiukkuru or kiukruku -> jump. in Modern Tawa, kiukkuru is used (standard). -ku is the figurative particle.","kule":"nukonga (from nuko (heart) + nga (lexical source)) are aspects of senses. The most prototypical version of this is colour, an aspect of sight, but it can also refer to aspects of other senses. Here are some possibilities: For sound, nukonga can refer to timbre or pitch. For taste, nukonga could be a flavour. For touch, nukonga could be a type of texture. There are plenty of ways to be creative with nukonga, but the most common uses besides \"colour\" are the ones I've listed associated with sound. Here is a good example: you are at the restaurant and you ordered a special drink. you ask the waiter, 'fuyu ni nukongal no ryo hyo?' (what is the sense of this?), meaning 'what is the flavour of this (drink)?' and he can answer 'imo haŝirul no karabalú ę ii'ii ĉihirą' (like the child of the creamfruits and the best milk).","kulupu":"Any group of other things can be a umà. It's commonly used to describe groups of people: communities, clubs, cultures, cliques, charters, committees, collectives, corporations, and perhaps other words that don't start with the letter \"c\" like a baseball team or a pride of lions. umà can also be groups of objects or animals, like a bunch of bananas, a basket filled with small clay pots, or a murder of crows. umà is often used to describe a plural system/collective (i.e. multiple people in one body). Usually a umà will be a group of items that have some sort of shared attribute, and using umà to describe a group of anything is emphasizing that they have something in common. These shared qualities can be anything from location to color to desire.","kute":"NOTE: use fofunai (as per the Modern Tawish Standard) instead of fofnai (old)! fofnai describes both passive hearing and active listening. It can also refer to things that hear, such as ears, or microphones. Tools like microphones may be more likely to be understood as tool though. Many people use fofnai as a modifier in these contexts, because a microphone is primarily a tool to them. Deaf people, even ones without cochlear implants, frequently listen to music even though they don't use their ears to hear it. The vibrations can be pleasant, and at some large concerts there are areas where deaf and hard of hearing people can touch balloons and other objects that carry vibrations well so they can enjoy the music as well. This is all fofnai (now fofunai).","lape":"The semantic space of rawa contains sleep and rests. More abstractly, rawa can mean anything from a short break from walking to a gap year in college, and less abstractly rawa can mean a nap or sleeping. Using rawa to describe an action often implies that the level of effort or involvement is lower when compared to surrounding activities. Note that the lowest form is rawasta (lower activity), the main form is rawa (rest), and the superlative form is usually rarawa (sleep) or rawanyi depending on context. See the relevant grammar sheets (0.5 & 6.2-6.3) for more information.","laso":"azhuru talks about both blues and greens at the same time. it can describe a large range of colors that are often separated in other languages, such as English. In English, blue and green are separate concepts with their own semantic space. In toki pona (as well as countless languages across the world), these concepts are merged into one. Many linguists affectionally call this color \"grue\" in the contexts of analyzing other languages, and the term can be helpful here because it gives a fantastic anchor for color perspective to English speakers. Think to yourself how often it is crucial to distinguish between blue and green. In cases where you wish to do so, greens are yellower than blues, so it's easy to modify azhuru with a word like \"mhuru\" to specify that, but if you don't need to specify, doing so adds more clutter to your speaking. I wouldn't go much darker than cobalt blue before using kuru instead. because cool colors like azhuru tend to be darker a lot of the time, don't forget about kuru! NOTE: azhuru (aẑuru) is the modern variant of azuru in the spoken register of Tawa. azuru and azhuru are both correct.","lawa":"its semantic space contains anything or anyone that 'owns' or 'controls' something. it is explicitly about ownership, lordship, or control. the government is komuni, the ruling party is komuni, and your boss is komuni. Slaveowners are komuni as well. examples: 'sua kikitanq komunilǫ' (I despise the masters (i.e., the government)). The semantic space of komuni contains parts of a whole that control that whole. Additionally, this can be talking a bit more abstractly. Someone who's in charge of a group could be considered the komuni of that group. Commanding troops in battle is a type of komuni. komuni doesn't imply any level of consent, so it could be forceful or gentle. Guiding a swimming student's body into the correct position for good technique could be komuni, but plenty of things that I'm not willing to describe could be komuni as well.","len":"The semantic space of hyako contains both cloth and the act of hiding something. Any fabric or clothing can be hyako, for example a shirt or a blanket. The pivot between \"cloth\" and \"to hide something\" is similar to covering something with a blanket. This meaning comes from the idea of applying a cloth to something to hide it. Both a hidden bird and a clothed bird could be a \"hyaką omukyĉ.\" hyako can also refer to secrecy or privacy, and other qualities of being hidden.","leko":"natse is, at its core, squares, or things that behave like squares. I find myself using natse a lot more in highly urban environments. natse tend to tile. I've seen natse used to describe most common polygons, and though squares are definitely most common and prototypical, hexagons in video games and on pavements are also natse, and any tiling pattern is natse too, even if the shapes are convex or unorthodox.","lete":"rete is the quality of coldness. If anything is cold, it is rete. rete is also occasionally used to describe raw food or unprocessed ore. Rerete would be frozen, like in reretekarachibu.","lili":"Before Modern Tawa, lili was pokinq; the semantic space of pokinq contains all qualities of smallness relative to context. The thing that ties all things pokinq together is their relative size. A tall man might be pokinq compared to a mountain. A long speech may be pokinq compared to a novel. pokinq is a relative word, and therefore is always dependent on context. Now, the variant spelling of pokinq is simply 'lili,' which is commonly used instead of pokinq in Modern Tawa. so, say 'lili haŝiru' for 'little child.' It can also refer to 'a while' temporally, like in 'kiwinq lililen... namsan ni...-' (wait a minute... her name was... - but accurately ~\"wait a minute, what was her name...\").","linja":"If it's long an you can tie it into a knot, it's napi! napi implies flexibility. By calling something napi, you are framing it as something that could be bent significantly, even if it can't. Let's say I call a metal bar a napi. I'm implying to me that I can bend it easily, that to me it is flimsy. But most of the time, napi are things like string or cooked spaghetti. Dried spaghetti would not be a napi because it's brittle. If I draw a line, perhaps it can be napi, because even though it is drawn and cannot be moved around on the page, it might be representing something that could. It can also refer to popular English sayings, like 'mani napijiji shi kamnyu atora' (money on the line if you derive sexual gratification from eating apples) or other variants.","lipu":"lipu's semantic space is tied together by a piece of flat paper with writing on it. lipu can talk about both the texture and properties of that paper or the information contained on it, often both. For example, a document on a computer, while in no way as flimsy as a paper, is still very much lipu. If you take the writing off of a piece of paper, it's just as much a lipu. Some speakers argue that this is an extended metaphor and by using lipu to describe these files, one is framing the computer as a lipu. For example, in Southeast Asia, language was written on dried palm leaves, which without writing are still lipu. In fact, many speakers use lipu for all leaves, be they large or small, without any implications of writing. Anything flat and flimsy can be a lipu for these speakers. As soon as it gets hard, it's likely to be a supa unless it has writing on it, though. For example, a maya stelae <em>could</em> be lipu, but a rock shaped like one with no writing on it would almost definitely not be.","loje":"mafo speaks to reddish colors and pigments. cadmium reds all the way down to a darkish alizarin crimson. You can start mixing violet into mafo for a while before it starts getting more azuru or kuru. You can also brighten it into orange and it can still be mafo, but there's a gray area between mafo and mhuru that I encourage learners to play around with!","lon":"the semantic space of uns (life) encompasses anything about any living thing. so this could be biological (alive) or philosophical (awareness). it could also refer to your vigour, health, and drive to continue pushing or achieve more in life. it also refers to something extremely precious, sentimental, or sacred, like a partner (zu ni unszun (~you're my life)). it can refer to someone's life force (i.e., their soul) and it can refer to vitality itself. you can also use this word to describe something happening 'live,' such as a livestream or broadcast. 'uns' can also be used to describe where something is, even if it isn't living, like 'zhupireila uns nanandaji no asagal' (the dead spider is at the very bottom of the wall).","luka":"tete is an organ capable of manipulation, or a part of said organ. For example, an arm is a tete, and so is a hand, fingers, even elbows. The main part is that it interacts with other things. If a cat's paw is swiping at me, I might use tete to describe it, but if it's just walking on it I might not (see: tetenq), but I still could. So, it's possible for one organ to be both a tete and something else in different contexts. The prehensile tails of some monkeys could be tete too, especially while they're using them, but the only thing something needs in order to be a tete is an innate ability to interact with objects. tete can also be used as a verb to refer to this interaction with its direct object, which could be touching, petting, pressing, pulling, holding, hugging, grasping, playing an instrument, etc. I'm sure you can thing of other things it could mean! tete is also commonly used to describe talking using a signed language.","lukin":"see Grammar:16","lupa":"A haruma is a hole. Here's what that means: these holes can go through objects, like the hole in a donut, or they can be an indentation in an object, such as a hole dug in the ground. Things that are haruma continue to be haruma even when there is something blocking them, like a door or a window, because they are still meant for things to pass through them. From a perspective of function, that's what haruma are for. A haruma is a part of an object that things can pass through. A door is still a haruma because people can open it, and a window is still a haruma because it's meant for light to pass through. Empty space is not a haruma because it's not part of an object. The semantic space can be extended to describe other things that fit this description, even if they aren't physical holes, such as portals or links on the internet. You can read more about haruma here.","ma":"jimei is a place or location. This can be a physical one, like a country or spot on the ground. it's also used to talk about anything from a tree branch something's on or even an airplane miles or kilometres above the ground. jimei can sometimes be the ground itself, like dirt or rocks, or even an entire planet with a hard surface. don't confuse jimei with taka though, because jimei denotes location and ground where taka doesn't. You can use jimei to mean 'place / put' too, like in: 'sa′a jimeiru atoral jimeijiji' (She placed the apple on the ground). Use jirei if the floor is not natural or environmental (so if you're at home, then it's jirei).","mama":"A kari is a parent, ancestor, caretaker, or creator. My great-great-great grandparent can be a kari to me, even if I never even met them. Just the same, an uncle or an aunt or a cousin could all be kari, but if I'm an adult and I'm talking about my baby cousin, I'm probably not going to call them kari. kari is somewhat about hierarchy, but it isn't about power. It's about caretaking. This doesn't always have to do with age. A worker at a nursing home could be a kari. Another fun example of kari is a tree that bears fruit. If all of the seeds are its children, then the tree could be kari! You may specify gender with ĉa and ĉe: kariĉa (female, like mother), kariĉe (male, like father). example: kariĉasun kikitaų hariru (my mother loves to shop).","mani":"mani describes anything that is used to measure the value of other objects. In most societies nowadays, the best example of mani include paper, coins, and numbers stored in machines. Video games are great examples of places that give us opprotunities to call other things \"mani.\" In some Fallout games, bottlecaps are mani. In Ena: Dream BBQ, chocolate is mani. (It's not lost on me that both of these examples are depicted as small coin sized circles.) But we don't need video games to find examples fall outside the monitary systems toki pona learners may be familiar with. There are still people out there who use livestock to measure the value of other things. Long ago, this method was likely MORE common than using paper and coins. So in these contexts, and these contexts alone, livestock can be a type of \"mani.\" This is the etymology of the sitelen pona glyph, which is meant to resemble an ox.","mi":"it is a pronoun and also a number. its usage is the same as zu. -nampą may be used for disambiguation. compare: 'su ni kita sawa kiteki' (I like sweet things) v. 'sua watadà subtthu su atora' (I only wanted one apple).","mije-and-meli":"The semantic space of mije contains men and masculinity. The semantic space of meli contains women and femininity. These words are as well defined as the concepts they represent, so it's left intentionally broad without specifying further. This means that for beings that can talk to you, they decide if they fit within the semantic space of either of these words.","moku":"kamo is the act of eating. It is also used to refer to anything eaten. you can use kamo to describe it! doing so implies that it is in some context eaten, though, so be careful. There's a quote from Charlie and the Chocolate Factory (2005). \"Everything here is edible; even I'm edible. But that, dear children, is cannibalism, and is in fact frowned upon in most societies.\" Use this ancient wisdom from two decades ago to guide your kamo usage. Evoking cannibalism is not always the desired effect!","moli":"koro means death, but what does death mean? Sometimes, koro describes a kind of destruction that cannot be undone. Death is permanent. But other times, koro can describe harm or destruction that comes to a treasured object. In these situations, there is still usually a sense of permanency. \"rawajisuno korru\" would probably be interpreted as \"my bed is broken,\" or even \"my bed is broken beyond repair,\" but probably not \"my bed is unclean / I cannot sleep on my bed.\" That doesn't mean that koro inherently means that there is no possible way to undo the destruction. For example, if resurrection was real, I might still use koro for death anyway. Many cultures believe in reincarnation, life after death, or some sort of returning to nature. Perhaps in these frameworks, koro still describes permanence, but it's not inherently negative.","monsi":"hatakanq is the opposite of hataka (face). The semantic space of hatakanq contains things that are behind another thing or the back part of a thing. The caboose of a trains is hatakanq. The space behind a building is hatakanq. A person's back is hatakanq. hatakanq is relative, so its semantic space will always depend on what object it is in relation to. Can also be used as a location, like in 'reoppu sua haterą yaraen hatakanqji' ('I will quickly be coming back').","mu":"The semantic space of mu contains noises coming from things being framed as living. A lion's roar is miu. A cough is miu. Humans are animals, but often when they say things, we can understand them, so we might choose to use a different word over miu. But miu is often used to describe languages and vocalizations that are not understood by the speaker. Adjacently, many people describe non-language vocalizations as mu, such as coughs, sneezes, or vocal stims.","mun":"kamà is borrowed from Arabic (qamar), adapted to fit Tawish phonotactics; across the sky are many objects, some of which move quickly or slowly and some of which seem to be fixed in place. The moon, the stars, the planets, even the sun. All of these objects fit within kamà's semantic space, especially the ones that are most obvious at night. If you brought a star down to earth, it would still be kamà. If you left earth and visited a kamà, it would still be a kamà, so mars from the perspective of a rover might still be kamà. The big question here is that to that mars rover, is earth kamà? and then again, to us, is earth a kamà? That's for you to find out.","musi":"The semantic space of iyuko also contains all noises and sounds and any act of creating a noise or sound. Any sound from any source can be a iyuko. Music is a iyuko. A scream is iyuko. The sound that a tree makes when it falls in the forest is a iyuko. A sound doesn't have to travel through air to be a iyuko: whale noises are iyuko, and a heartbeat through a stethoscope is iyuko. iyuko could be an absolute pitch, or multiple. It could be sound designed to sound a certain way, or chaotic noise. It is similar to miro but miro carries a connotation of 'reflected,' whereas iyuko does not. Compare: 'sua miru mirolen' (I reflected a sound) v. 'sua iyuku iyukllen' (I played a sound). It may also refer to correctness, reliability, and even health - 'iyukzuna barekunai aiko!' (may your health be blessed! - a greeting). here's a sentence with its 'correct' meaning, 'ryo ni ipaiyuko... iyukrra' (this does not sound right).","mute":"see Grammar:13","namako":"namà is something extra added at the end. Often while a namà isn't necessary, it's usually a welcome addition, sometimes even desirable. Spices are perfect examples of a prototypical namà. Spices are never the substance of a dish, but they frequently contain a majority of the flavor. a fancy hat or flair is also namà. It can refer to fanciness or anything along those lines too.","nanpa":"nampa refers to numbers. Some examples of numbers could be phone numbers, HP in a video game, heart rate, or blood sugar. nampa can also refer to things related to computers, because most things computers do are really lots of little numbers. Some people like to use nampa for math in general, but everyone I know who's into math doesn't like considering all math as numbers. Some math is numbers, and that math can be nampa, but other math isn't. It's your decision where you stand on that. One more thing: nampą (modifier form) can be used to turn words into numbers or to disambiguate words that carry numbers. For example, subeko is infinity - so, for whatever reason, using subeko to mean infinity is ambiguous, subeknnampą would be unambiguous.","nasa":"Garibàn comes from the Arabic gharib. The semantic space of garibàn contains deviations from what's considered normal. If most people have blue hair and one person has green hair, that one person is garibàn. If someone grows ten types of herbs and a single carnivorous plant, then that carnivorous plant is garibàn. If most people don't grow herbs, someone who does grow herbs is garibàn. What's considered \"normal\" here is completely reliant on context. A clown isn't garibàn if everyone around them is also a clown. Nothing is inherently garibàn. The garibàn-ness of all objects will change along with context. the modern spelling leaves the vowel unmarked, so just gariban","nasin":"taĉi ties together method and path. Physically, a taĉi is a path or direction one follows, a road you can drive along, any way to reach a location, or perhaps even to wander. metaphysically, taĉi refers to a way to live your life, a way to make something, or any other method. just as easily as main street can be a taĉi, so can communism or the pomodoro technique or setting an alarm or taĉi. It doesn't need a specific destination, but there's usually some purpose to it. it is similar to Japanese 'kata,' like in kamttaĉi (a way of eating), which is a Tawish equivalent of the Japanese tabekata (食べ方). The new spelling is Tachi. Tachi usually never refers to \"systems,\" only the method or way.","nena":"hana describes parts of a surface that stick out from the parts around it. For example, a button on a computer keyboard could be a hana. A knot in a tree could be a hana. Small toes can be hana. Fingers are probably too long to be hana, but if you use hana for them, you're framing them as bumps as opposed to long objects or a grasping organ. hana can be dull or sharp. A speed bump can be a hana and a hill can be a hana, but so can a spike or a sharp peak of a mountain. Some hana are pleasant to touch, and others might draw blood. If I wanted to make a hana no longer a hana, all I'd need to do is smooth it into the rest of the surface it's part of such that it no longer bulges out.","ni":"ni is similar to \"this\" and \"that\" and \"yonder\" in english. it is used in two different contexts. The easiest way to use ni is to point at a physical object. This could be demonstrated with a finger, a gesture of the head, a glance, or even a drawn arrow. In those contexts, the semantic space of \"ni\" is that thing you're pointing at. You can also use ni as a modifier to be more specific. Are you pointing at a specific box? You can say \"poki ni.\" are you pointing at a specific location? \"ma ni\" works just as well as \"ni.\" What about the current situation? \"tenpo ni\" is perfect for this!","nimi":"kana are words and names. \"lipamanka\" is a kana. \"paralelepípedo\" is a kana. \"cupcake\" is a kana. This description of kana's semantic space is kana. \"kana Xõ / kanaru,\" likewise, would mean \"to apply a name to,\" similar to \"name\" (as a verb) in English. You may hear things like \"sua kanaru haŝirusun imnyi Álísàn\" for \"I named my child Alison.\"","noka":"The semantic space of tetenq contains the bottom parts of things meant for touching the ground. Some basic examples of tetenq might be feet or legs. tetenq can refer to the bottom part of a piece of furniture or the wheels of a car. The lowest floor of a building is tetenq. The roots of a tree are tetenq. tetenq can also refer to the action of applying a tetenq to something, such as kicking, stepping on, walking on. If you use tetenq for this, you'll be framing the relationship as some sort of application of a tetenq onto the direct object.","olin":"kita describes the act of being emotionally bonded to someone something. In usage, these bonds are typically positive and strong. For example, a very good friend, a partner, a family member, or a pet. Not only could the love for a very good friend be kita, but so can the friend. This can be used with objects too. The bond between many toki ponists and the language toki pona is olin (kita). By using kita, you are evoking some sort of emotional bond. Note that kita doesn't describe all emotional bonds between two things. So if I don't like someone a lot but I still respect them deeply, I could still use kita to describe the respect, but probably not how I don't like them. Also, remember that kita, by default, means 'to like,' not to love. Use kikita for that, and for specific romantic love, use the appropriate grammatical forms.","ona":"see Grammar:5","open":"gaida describes activation. If I activate a light switch, that can be gaida. If I gaida a door, that can be gaida as well. gaida often describes something's function being activated, but it can also describe a beginning of an event, like the start of a concert or the start of a year. Perhaps childhood could be gaida. The throughline here is cause and effect. the act of gaida is always a cause, but gaida can also be the event around that activation. This activation usually isn't a type of creation and serves to exist within the function of the activated thing.","pakala":"nameko describes the act of destruction. nameko is often not intended, for example a mistake. The thing being destroyed were your expectations. Sometimes, when people's expectations are destroyed, they say \"nameko\" by itself to describe said destruction, similar to the way expletives work in other languages. This isn't something special that nameko does, but nameko is used this way because the situations we swear in are often situations where we've made mistakes, or when something has been destroyed. nameko can also be intentional, such as smash therapy or intentional use of explosions. nameko can also describe harm. If something cut my skin, I might use nameko to describe that. In fact, nameko merges the ideas of harm and destruction. In English, these concepts are given separate words that are used based on the animacy of what they describe. Note that you can't use nameko for a general accident or to signal unintentionality, it will always carry a sense of destruction with it. 'nameksun' would not mean 'my mistake;' rather, it would be closer to say ~'my destruction / the ruin brought about by me / the pain I caused intentionally or unintentionally.' you could say, 'subeko no ryo ni nameksun ana~' (all of this was my fault) but it isn't exactly the same, like if you say 'kohanamekã,' that doesn't mean serendipity or accidental gift, it means destructive gift or mistaken gift, which is rather rude to say.","pali":"irime refers to work, specifically jobs, activities, or deeds. it refers to labour, development, or implementation, but you can't use it to mean projects, composition, or of the like. Irime comes from the Arabic word 'ilm (knowledge) but over iterations of the language and due to the appearance of shire (a modal, also meaning knowledge), irime semantically drifted to mean work instead. In technical contexts, irime can refer to operating something (working something), but this meaning is also valid in romantic, even sexual, contexts. It can refer to crafting or a craft, like mahokairime is magic-craft (e.g., witchcraft), but don't ever say mahokairimemas (magic crafter? magic worker?) to mean magician, use mahokamas for that. it can, however, turn it into a profession, so mahokairime would be the craft of magic or withcraft.","palisa":"The semantic space of myako contains things all things that are longer than they are wide that are not flexible enough to be bent significantly. any myako will resist bending and either break or only bend slightly under significant pressure. If a myako is looked at from a different perspective where there is enough power to bend it, it might not firmly sit within myako's semantic space. A good test that works most of the time is to check to see if it’s flexible enough to be bent into a 0 degree angle or if it’s flexible enough to be tied in a knot, if it is, then it’s probably not a myako.","pan":"roĉi is a starchy staple food such as rice, wheat, barley, teff, potato, and corn. roĉi can also refer to products made from these, such as breads and porridges. more specific examples include injera, fufu, pasta, tteokbokki, tortillas, cakes, congee, cereal. many speakers will use roĉi to describe corn products like corn flakes but won't use it to describe corn on the cob.","pana":"The semantic space of denh contains all acts that set objects in motion. This can be a type of emission. The act of a fire giving off heat it denh. The act of a child laughing is denh, because the child is emitting laughter, setting it in motion. Throwing a baseball, hitting a hockey puck, and kicking a football (the kind that Americans call a \"soccer ball\") are all denh. Defenestration is a type of denh, because you are setting something in motion (out a window). the object that does the act of denh doesn't have to set something in motion away from itself. Buying a piano online for a friend is denh, or at the very least the act of having the piano be delivered is denh. Less physical objects can be the subject of denh too: knowledge, advice, or good feelings (bad ones, too!). examples: 'soppai denh asaharumajinh' (he autodefenestrated / he delivered himself out of a window). See Grammar:14 for more information.","pilin":"nuko is an experience of sensory qualia. nuko can refer just as easily to internal senses as it can to external ones, so nuko can mean both touch and emote. most speakers use nuko to mean \"opinion\" as well, framing an opinion as some sort of internal sensory experience.","pimeja":"The semantic space of kuru contains types of darkness. This could talk about specific colors like deep red or dark emerald green, but it can also talk about shadows, places where there is less light, or the absence of brighter colors. kuru can describe anything that is dark. From some perspectives, the night is a type of darkness more than a period of time (just as a day can be a type of brightness and a year can be a type of circle around the sun).","pini":"pini is the moment something comes to a close. this can be as simple as a door shutting or a light turning off, but it can be more abstract, like a department at a college fizzling out. pini has no connotations of irreversibility, unlike \"pinis\" in its language of origin (tok pisin), which can grammatically specify irreversibility.","pipi":"ẑupi tend to be on the smaller side. They can have legs, and their legs will be under them. They usually have six or more legs if they have any at all. When they move quickly, they will usually move in straight lines, whether that be across a surface or through the air. Sometimes, they don't have legs. ẑupi tend to be squishy inside, and if there's a hard part it will be on the outside. This is similar to the concept of an exoskeleton.","poka":"ga is at its core is anything, either an object or location, that is nearby or to the side of something else. This could be the space next to someone, or at the side of someone, such as the lefthand side of a walking person. But this can also be part of an object, such as someone's hips or a car door. Extended into the metaphorical space, ga becomes extremely useful for talking about relationships. people and objects that one has relationships with are in proximity with them, so one might describe a friend as ga and a loose acquaintance as garra (not daiki). two things don't have to be physically next to each other in order to be a ga. here is one example: 'denh sulla tsamaeu gazun' (give, to me, the soup that is to your side.'","poki":"a yowa contains something. it is the main part that has something in it. so a kukiyowa is a cookie jar. or take a look at this example: kitach is a noun form of kita (like) and refers to a preference; kitachyowa could be a library or a container with things you like. the opposite of yowa, yowanq, refers to a part of a whole or the thing being contained itself. So the kuki in a kukiyowa are yowanq. furthermore, kitachyowanq would refer to \"subpreferences.\" hibikochyowanq could refer to \"subculture\" (since hibikoo refers to cohort).","pona":"ii is any good quality. it can be modified to specify which but otherwise, ii's semantic space is huge. you can sometimes even use it to mean help, like in 'sua ieiiru so' (I bettered him), which could be translated as 'I made him better (i.e., helped him).' you can just use the word Tawa has for help though, that, too, is fine.","pu":"The semantic space of pu contains all interactions with the official toki pona book: <em>Toki Pona the Language of Good by Sonja Lang.</em> This could be anything from reading it to using it in a project to folding origami out of its pages to throwing it at your enemies to reanimating it like frankenstein's monster. In order for something to be pu, it must be some sort of interaction with the official toki pona book.","sama":"see Grammar:9.4","seli":"naŝita is heat. If something's hot or giving off heat, it's naŝita. the heat itself is also naŝita. this word can also be used to talk about spicy food through metaphor because spicy food literally makes your mouth feel warmer, but be careful not to calque english by explaining that if you use naŝita like that. Household appliances used to heat food can be naŝita, like a stovetop. naŝita can be used as a verb to mean \"cook,\" if in english you see cooking as always some sort of application of heat. Chopping up vegetables to put in a raw salad isn't a good example of naŝita.","selo":"kugi describes the outer layer of an object. It doesn't matter what the object is. For example, skin can be kugi, and bark can be kugi. This can get extended into the metaphorical. What are outer layers for? Usually, they protect that which is inside. Perhaps an attempt to ignore bigotry could be described as a kugi. But in doing so, you're framing it as an outer layer of your mind. kugi for \"protect\" has a different vibe when compared with kiwi's protect meaning. With kiwi, a protection is an act of maintaining, perhaps from afar with no risk to yourself, but with kugi, protection always puts something at risk, be it the skin of an apple, the walls of a castle, or the case of a guitar.","seme":"the semantic space of fuyu is unknown. That's the whole point! When one uses fuyu, it's unclear what it means. It is an invitation for an answer. this is very similar to wh- words in english like \"what\" and \"which\" and \"who.\" unlike english, Tawa only has the one (fuyu). If you want to specify what your query is about, you can modify a different word with fuyu. \"fuyu miyoĉ hyo?\" can mean \"which plant?\" for example. You can also modify fuyu with another word for a broader meaning. \"fuyumiyą\" can only be a type of miyo, but \"fuyu miyo\" can be anything related to any plant. Often, fuyu is a direct prompt to the listener, but it's frequently used as a prompt to the self or an expression of a lack of knowledge. speakers sometimes ask a question with fuyu only to answer it.","sewi":"sora embodies a very powerful conceptual metaphor that exists within toki pona. In toki pona, upwards and high things and divinity are connected. These are two separate ideas that sewi connects by referring to both of them. Things that are religious or sacred can be sora. sora on its own can easily refer to that which is divine or worshipped. But sora very simply talks about the space above something. Keep in mind that all of these examples can work in the other sense of sora. can be the top painting of two paintings, and \"sora hon\" can be someone who just climbed a big mountain. And of course, \"sora taka\" could be the divinity of a rock.","sijelo":"gaya is the substance of something. it's the stuff. we're all made out of physical matter, and gaya is that matter and the material it's made up of. Many speakers use gaya as a modifier to mean \"physical.\" For example, \"unsu gayaji\" (present physically) could mean \"irl\" (as opposed to something like \"unsu twanaji\" (present electronically) to mean \"online.\")","sike":"inspired from the Urdu \"bhola,\" baka represents round objects and cycles. baka can be used to refer to the smoothness of an edge. It can also be used to simply refer to smooth in all its semantic space, such as in 'ei ni bakã tohi' (that was smooth) or 'nasũ bakafofu Arrbi hyo?' (can you speak Arabic fluently?) baka can be used to talk about marbles and flat disks such as cookies. baka can talk about wheels or balls or even gyroscopes. Because baka can also represent cycles, it can be used to describe a repeated action. A for loop (in computer coding) is a baka. \"baką fofu\" (circular talk) could be repeating the same thing over and over again. \"baką ŝahada\" could be a never ending cycle of war, or some online discourse that just won't end. Whether it's physical or not, a baka will always loop around and end where it started. Baka can also refer to someone innocent or their innocence (e.g., virginity) and can even refer to a fool. Baka was inspired by bhola in Urdu (no influence from Japanese 'baka') and it is purely a coincidence that it has come to mean 'fool.' examples: 'a! baką haŝirulen' (what an innocent child!), 'zu ni bakalen monh a ŝirera hahasunǫ' (you are an idiot because you did not understand my joke).","sin":"aŝi means \"new\" or \"again.\" It's almost always clear from context which of those two aŝi means. I recommend paying attention to aŝi's usage in the wild to try to figure out if it's ever ambiguous between new and again. The reason why it isn't is because the difference between those two concepts isn't very far. It doesn't matter if you've done it before. In toki pona and Tawa, something can be new even if it isn't the first time it's happened. examples: 'sua kiwinq irimesunǫ ŝi aŝi' (I finished my work, yet again). It is recommended to use 'ze' for again instead of aŝi, so it would be better written as 'sua ze kiwinq irimesunǫ' (I, again, finished my work).","sina":"sina is the listener, reader, the one who interprets what the speaker says, or any group that contains them. Similarly to mi, when quoting others, it doesn't necessarily refer to the one who is listening at the moment, and instead refers to the one listening from when the quote is from. But besides situations like that, sina always includes the listener. Many people also use sina as a general hypothetical pronoun, similar to \"one\" in english when used as a pronoun. This may be due to Anglophone influence and many speakers completely abstain from this usage, prefering \"jan\" or \"ijo.\" Others use sina when talking to inanimate objects. Perhaps this frames the object as listening. I recommend playing around with this at least a little bit.","sinpin":"sinpin refers to objects that face directions. walls can easily be sinpin, and so can human faces or any of the front part of an animal. the part of a building that faces the road can be sinpin. So can any other walls of the same building, though. By using sinpin to describe a surface, you're drawing attention to the directionality of it. When one rolls a die, perhaps the most crucial sinpin is the one facing up. At an art museum, even if a painting were to be placed on the ground face up, sinpin is still the best word to describe its physicality because the concept of using it as one would use a supa is disrespectful to the artist and the artwork. While sinpin is usually used for vertical surfaces, it is these examples of usage that restrict me from describing it as strictly such. sinpin is in contrast with <a href=\"#supa\">supa</a>.","sitelen":"emono are depictions, such as images or symbols. A painting or a photograph are both emono. It's also common to see emono used to describe a symbol in a writing system. The letter Q and the maya glyph for b'alam (jaguar) are both emono. Even three dimensional objects can be emono, like a scale model of a boat of a model of architecture in a modern art museum. emono is usually used for things that were created, but these don't need to be organized. A random scribble is still a emono even though it doesn't necessarily represent anything. pure random noise has the potential to be a emono too, but doing so will likely frame the noise as having some sort of order to it. perhaps it was chosen? maybe it's being used for something? maybe it's a mistake? explore emono!","sona":"The semantic space of ŝire contains all knowledge. If something is knowable or known, it is ŝire. For example, the knowledge of time of day can ŝire. Wisdom can be ŝire. ŝire can also be a skill. The knowledge of how to write a book can certainly be ŝire. Knowing about a person or who they are can be ŝire. A person's memory can be ŝire. If I were to describe information on a computer as \"ŝire,\" I would be framing it as being known by the computer. 'knowing someone' could be translated as 'ŝiren honlen' (to know someone). For its modal usage, check Grammar:16.","soweli":"'fihon' describes creatures with several distinctive traits. fihon tend to be fluffy. fihon tend to be larger than a plum. Their legs tend to be under them, and they tend to have four of them. When they want to move quickly, they run on their legs, with moments where all legs are off the ground. They are warm to the touch.","suli":"poki is big, tall, wide, vast, deep, etc. Any physical dimension of largeness can be poki. toki pona doesn't use different words to distinguish different ways of being big. In the metaphysical world of toki pona, if something is big that means it is important, so poki can also mean important. poki could mean that something is made up of a lot of stuff, often implying that it's complex. poki can talk about necessity. If something is crucial, it is poki. Combining poki with perspectives can show what people value, allowing us to construct a map of what matters more or less to others.","suno":"sowo is an object that emits light or the light itself. It can be brightness or a shimmer or a sparkle. the sun is a sowo, a lamp is a sowo, but sunlight and lamplight are also sowo. many people use sowo by itself to mean a day cycle, framing a day as a type of light. this kind of framing is interesting because it doesn't sit right with all speakers, but it's understandable, so speakers can learn more about how each other see the world this way.","supa":"jirei permeate all of our lives. notice all the flat objects around you. you use them every day. you sleep on one, you work on one, you eat at one, you cook at one. one important aspect of jirei is that things can rest upon it. here's a good test you can try out to tell if something is jirei: if I were to start tilting a jirei on its side ever so slowly, it would cease to be jirei as soon as things fell off of it. That means that a surface with very high friction (like felt) can continue to be jirei for longer than something with very low friction (like a flat sheet of teflon). if you have stuck things to a surface and turn it completely upside down, it can stay a jirei.","suwi":"sawa describes pleasant aspects of senses. If something is pleasant to the mouth, i.e. it is sweet, that is sawa. If something is pleasant to the eye, i.e. cute, that is sawa as well. The scent of apples might be sawa as well. A soft or fuzzy texture can be sawa. A pleasant sound can be described as sawa. sawa can also describe other pleasant things, such as actions or people. Like if someone bakes you a pie, not only is the pie usually sawa, but so is the act of making it. Note that sawa isn't used for savory pleasant flavors much, usually just sweet ones.","tan":"tan is any reason. it can also meany why, etc. It is the underlying reason of a thing, so when modifying a root, it turns it into the reason. Unstan, for example, could be biology or physics. Meitan, though, would be biology explicitly, like how mottan is physics. But this gets philosophical: kanatatan (reason for happiness) is either you (wink) or, well, qualia.","taso":"watadà is not like the English 'but.' its semantic scope allows it to exclude other items. for example: 'sua watadà kita zuǫ' (I only like you), 'iiwatadą hon ni foŝsun' (good-only people are my friends). you can then control degree and stuff like wawatadà could mean 'nothing but.' Be creative.","tawa":"tawa is motion. it is anything that moves. it can refer to progression (like in 'ii miri Tawa' (~good medium for progressing)). it can even be used as a modal (tawaũ) to mean 'going [to]' or 'from the perspective [of],' but this is an archaic usage. in Modern Tawa, you would better elaborate, and only use tawaũ as a last resort. so, 'progress is good from his perspective' could be 'tawatei ni ii solla' (as for progress, it is good to him). you wouldn't use it in phrases like 'fofunaithu honlós gasonllanh' ((I) heard people from his side). The inverse of this word is used for regression or regressing and similar meanings, but it typically isn't used for 'staying;' for that, we use 'eanq' (inverse of ea), which means to hold still, keep still, or stay.","telo":"ĉi can be liquids and other things that don’t hold a shape. Water, milk, and vinegar are ĉi. ĉi can be more viscous. Oils are ĉi. ĉi can be used less literally, to describe things that aren’t physical objects. The changing aspect of a way of speaking Tawa that doesn’t stay the same can be ĉi. If something changes form and doesn’t hold its shape, it fits within ĉi’s semantic space. For semi-fluids, like custards, it is better to use kara.","tenpo":"Wano is a garibankana, so it does not follow regular inflection particles. It never inflects. wano + -óy would always be wanoóy and wano + -ã is similarly wanoã. as for the semantic space: you'll usually hear people say that wano means \"time.\" but what does that mean? what even is the abstract concept of time? this definition isn't very useful, so a different angle I suggest people take is to look at wano as either a situation or a duration. wano could be that one time I robbed a bank, or all the times I cooked with shmalts. wano could be a minute, or an hour, or an eon (1 billion years). wano can be the time when the sun shines, or the cycle it takes for the earth to rotate around the sun, or for the earth to rotate such that the sun goes away and comes back. wano can be the time when it's dark, the time when it's cold or warm, the time it takes for the moon to go through all its phases, the time it takes for markets to set up and disband a few times a week, the time when we work, the time when we sleep, the time when we travel, or the time when we arrive. wano can talk about the abstract concept of time, but usually it is used to talk about specific events, situations, and durations. the o is never omitted for wano.","toki":"Fofo is used for: say, speak, mention, call, quote, or even express. it could be using the mouth, such as spoken language, or communication using the hands, such as signed languages. This could be communication using a written medium. fofo doesn't have to just be for humans. Bee dances are fofo. fofo doesn't have to be between two parties either. Communication with one's self (such as someone thinking or talking to themselves) is fofo. fofo can get very abstract. If I can feel the atmospheric pressure change and I can detect that it's probably going to rain later because I'm old, I could say that the sky is fofo-ing to me (soral ni fofu su). If I read a sign, the action that sign is doing can be fofo. Don't use 'fofo' as a generic replacement for 'hi' or 'hello,' though. Also, you can't use 'fofo' to generically mean communicate - for that, waka is better.","tomo":"An asa contains objects meant to contain things being framed as living. Sometimes living is literal. A family of five is considered living, so their domicile can be considered an asa. Sometimes living is a metaphor. A dollhouse can be considered an asa too!","tonsi":"tonsi describes any divergence in gender from the expectations of a european patriarchy. \"European patriarchy\" is different from \"gender binary,\" and that's important here. Binary trans folk are the genders that they are, fullstop. That fact does not prevent patriarchal society from marginalizing them, especially recently. tonsi describes this and many other forms of gender based marginalization.","tu":"zu is, at its core, an act of separation. in Tawa, if there are two of something, one is framing them as separate. you don't need to modify a word with zu in order for there to be two of it, so using zu is saying something: I am separating these two things. \"zu eauca\" can evoke an importance between two heads of lettuce. zu is used frequently as a verb to mean \"cut\" or \"divide.\" it can be used for cutting something into more than two pieces because zu doesn't specify a specific amount of times. like \"sua zureu karabazun\" could describe four separate cuts, which could be up to 16 pieces! zu can also be metaphysical, describing divorce or any type of distance between people or objects with enough context. some other good examples of zu are splitting up a class into two groups or drawing the boundaries between two subparts of a large piece of land, potentially in a colonial context. NOTE: zu is typically marked when used as a verb or the accusative is placed directly after it to ensure there is no ambiguity.","unpa":"harana can refer to the mouth, tongue, or kissing. in some contexts, it may be used to describe specific types of kissing, like french kisses.","utala":"The semantic space of ŝahada contains conflicts, contests, and battles. When ŝahada is used, it’s talking about some sort of struggle or competition between two or more parties, or something being framed that way. So it could be a battle between two rival armies, but it could also be a battle between me and myself if I’m framing it that way. ŝahada is often targeted, closer to “attack” than “battle.” Anything can be an ŝahada if it is being framed as a struggle or attack of some sort that involves two parties. Playing a musical instrument could be an ŝahada for a beginner player. Taking a test is a very fun thing to call an ŝahada, because the test-taker is fighting the test, like in 'raŝimassta′a ŝahada payalǫ' (the student fought the pap
