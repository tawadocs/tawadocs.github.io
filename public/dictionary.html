er). martyr also fits in the scope, like in 'soa ŝahadathu irimesonji' (he gave his life for his work (i.e., he died a martyr amidst his work - metaphorical, not literal martyrdom; however, if the person really is dead, could be literal)).","walo":"ohira is any bright color like white, pink, light blue, etc. it can also refer to milk.","wan":"It is best to think about wan as first and foremost some type of union. other objects are coming together into one whole. That kind of motion is core to the word \"wan.\" the number meaning is secondary. wan is used frequently to mean combine, marry, mix, overlap, etc. using wan as a modifier can indeed mean that there is only one of something, but it's always good to think about it as a single unified whole. it can also mean specific, like in 'wan tan,' which can mean 'one reason' or 'specific reason' depending on the context! Wanq (the opposite of wan) can refer to final, last, plural, or negative. So, you'd say 'wanqwanoji' (in the end times) or 'ryo ni ru wanq à ya!' (make this your last! / enough! stop! too much!).","waso":"ngoshi are creatures. they almost always have wings, and when they want to move quickly they use those wings to propel them forward. They frequently have feathers. They have two legs that they use to walk on land. ngoshi usually lay eggs and often (but not always) sing. many speakers use waso (ngoshi) to refer to things like planes that aren't living creatures, which has been especially common in my experience with toki pona meetups, where the flight itself and the plane are both called ngoshi. This usage is controversial though. ngoshi can be used to refer to birds that don't fly or use their wings to fly, such as ostriches, kiwi birds, or penguins, and doing so shows the way you split up the animal kingdom. there are quite a few speakers (including myself) who don't use waso (ngoshi) for these creatures, and that shows the way we split up the animal kingdom too. This semantic space is based off a pilot study I conducted with a sample size of 117. I will publish the results in a paper if enough people bother me.","wawa":"moto is qualities of power and strength. A very strong person is moto. The strength required to talk to new people one has never met before is moto. moto focuses less on the ability or possibility itself and more on the power and motivation behind it. If something is enabled, it is moto. For example, if a lightbulb has been turned on, it becomes moto. moto is used frequently to refer to energy itself, both in an abstract sense (such as spoons or motivation) and in a physical sense, such as electricity or force. Many people aren't moto until they drink their morning coffee. The coffee makes them moto.","weka":"fiyui describes distance. It is similar to other location words in that it can describe a place, but instead of describing a specific relation to proximity, it describes the lack thereof. Hence, fiyui describes a place that is not nearby. This could be outside a house or simply outside of reality. It can describe the act of disappearing or vanishing. Transitively, it can mean the act of removal or stealing. fiyui can also be more passive as an action, such as ignoring, just as easily as it can be an active action like getting rid of something.","wile":"The semantic space of subo contains all desires. A desire to eat is a subo. A desire to be near others is a subo. These desires can be influenced by external forces: a desire to do tedious chores motivated by the prospect of negative consequences is a subo. By using subo to describe something, it's being framed as a type of desire. For example, if I normally don't want to tidy up my workspace but I feel obligated to anyway, if I used subo to describe that feeling of obligation, I'd be describing it as some sort of desire. This can be used for anything, no matter how animate. Speakers frame non-living objects as having desires very frequently. P.S. see Grammar:16 on more information regarding subo.","foŝo":"foŝo is a versatile and gender-neutral word that functions similarly to the English slang 'bro' or 'blud.' its semantic scope encompasses any individual with whom one has an understanding. 'sa ni foŝssun' (she is my 'foŝo') or 'sua watadą kiwinqthu zuǫ monh zu ni foŝssun' (I only stopped you because you are my 'foŝo').","yupekosi":"it refers to anything absurd, from haha (laugh) + kari (make). it literal means 'laugh-produce'.","test":"test","jasima":"miro carries a connotation of 'reflected,' whereas iyuko does not. Compare: 'sua miru mirolen' (I reflected a sound) v. 'sua iyuku iyukllen' (I played a sound). Miro can be used to describe mirrors or resounding. it can be used to describe reflections or reverberations. it is anything that echoes. it can also be used in the sense of mirroring (duplicating) or copying, just as a mirror 'copies' you. it can also refer to döppelgangers or mirror images. it can also mean a place full of sound. it can also describe an idea, message, or reaction spreading widely and strongly. it also has an internal meaning: something deeply affects people or 'rings' emotionally (e.g., 'her words mirrored/resounded with(in) the audience). sometimes, it can also mean undeniably loud, like a 'hakunqmimirã' (loudest lie) would be a lie that's really hard (maybe even impossible) to deny. if a name or event 'resounds' or 'echoes' throughout the world or a place, it can describe fame (locally or globally) too.","tenpo suno":"kó, in normal usage, refers to a day, like 'ryą kó' (lit. 'this day,' meaning 'today') or be kó ('tomorrow'). otherwise, it can describe any incident, event, or occurrence: 'na′a fofura itappu koren kóąl' ('we do not talk about the killing incident'). it can refer to both yesterday and tomorrow in causal speech, like 'sua subų kamu ẑi kó' (we should eat tomorrow/yesterday).","iyuko":"The semantic space of iyuko also contains all noises and sounds and any act of creating a noise or sound. Any sound from any source can be a iyuko. Music is a iyuko. A scream is iyuko. The sound that a tree makes when it falls in the forest is a iyuko. A sound doesn't have to travel through air to be a iyuko: whale noises are iyuko, and a heartbeat through a stethoscope is iyuko. iyuko could be an absolute pitch, or multiple. It could be sound designed to sound a certain way, or chaotic noise. It is similar to miro but miro carries a connotation of 'reflected,' whereas iyuko does not. Compare: 'sua miru mirolen' (I reflected a sound) v. 'sua iyuku iyukllen' (I played a sound).","kokosila":"This word refers to any 'face' - it can be the face of Earth or the face of a person. As a verb, it can mean to 'face' something (i.e., to change position so that your face is looking at something) or to 'fondle' something, often vulgar. hataka refers to objects that face directions. walls can easily be hataka, and so can human faces or any of the front part of an animal. the part of a building that faces the road can be hataka. So can any other walls of the same building, though. By using hataka to describe a surface, you're drawing attention to the directionality of it. When one rolls a die, perhaps the most crucial hataka is the one facing up. At an art museum, even if a painting were to be placed on the ground face up, hataka is still the best word to describe its physicality because the concept of using it as one would use a jirei is disrespectful to the artist and the artwork. While hataka is usually used for vertical surfaces, it is these examples of usage that restrict me from describing it as strictly such. hataka is in contrast with jirei. It can mean façade or front too, like in 'ryą baka kamjiomuką nihi noku imo hatakal jistappu meth kova' ('This innocent chicken restaurant feels like a front for a methamphetamine laboratory').","tenpo pimeja ni":"koryąnq or ryą konq are also acceptable","len noka":"rongo refers to footwear","meso":"miri means average, moderate, or medium, but it can also refer to agencies or means of doing something. so, miri kamu can mean 'average eating' or 'the medium of eating' (e.g., mastication). ii miri Tawa, the name of the language, means 'the good medium of going forward' (i.e., progressing). It can also mean amongst or middle, like in 'tawa mirilla' (go to the middle) or 'tawa mirilla no wu' (go to the middle of them / go stand amongst them).","atora":"to apple or to do with doing apples [e.g., \"to throw an apple\" as in (to apple someone)] (indicated by context), apples, as in the red, but sometimes green, juicy fruit, used to describe something or someone like an apple or its features; examples: 'hatakazun ni atorą mafo!' (your face is apple red), 'kamen atoralen ẑi kokyą misu haushonlàjijinh' (eating an apple every day keeps the doctor away).","misikeke":"haus is jokingly inspired by the show House M.D., the main character of which is a doctor. the semantic space of haus refers to anything related to doctors. it is most commonly used in the noun compound haus'hon (medicine person; i.e., doctor). some examples: 'haŝirula kitanq haus'honlǫ' (the child dislikes the doctor). using just 'haus' for doctors in contexts where it is understood is fine, though, and even recommended. ngomho is the proper term for drugs or medication, recreational or not, so use ngomho over haus. Haus is the term you'd use for medicine as a practice or anything doctor-y. Like treatment of patients, maybe.","kamonq":"kamonq is the opposite of kamo. it describes anything literally inedible and, in some cases, toxic or harmful consumable items. take 'toppu: sua ipappu riwakarrame fuyuǫ soa kamtthu; wu ni nasą lemppu kamtteinq kitei' (I don't know what he ate. It was probably something inedible) - here, 'kamtteinq kitei' (inedible thing) could mean something that could cause food poisoning, as it is implied whatever he ate caused something to happen to him (e.g., he got sick). you may also use it as a verb: sua kamtthunq (I puked).","monsuta":"hvai is a word that encompasses anything that is scary. specifically, it refers to the devil. 'hvaisona kiwių ukaju so ẑi kóryą wa' (his monsters keep on haunting him till this very day). it may also refer to warnings, like 'kikita zuõ hvailyet' (love you for the scare / warning), though you can specify this if you really wanted: hvait (negative; scare), hvaióy (positive; scared for a reason, warning, warned)","itagi":"an idea (itagi) encompasses anything that may be actualisable or probable - practically or theoretically. a civilisation on Mars is an itagi and intergalactic travel is also an itagi. but a Euclidean three-dimensional cube in 1D is not an itagi, then it is an itaginq.","mo":"See Grammar:9.3","monh":"it functions as the opposite of mo, so in comparatives like: 'asaryą ni ieii mo zun' (this house is better than his), monh will reverse that comparison: 'asaryą ni ieii monh zun' (this house is not better / worse than his). other than that, it can function as instead of, because, or now: 'sua kamtthu monh zua fofu sulla \"ke kiwinq\" hyo??' (I was eating, now you tell me to stop?!), where as without 'monh,' it would simply mean 'I was eating until you told me to stop.' also, 'na′a nasu tawa monh watadà fuén rraĉ hya?' (can we go instead of just doing nothing?).","ea":"archaic movement marking particle (see Grammar:14.2.5). better to use tawa or yara now, but ea might sometimes be necessary (eanq for stay, natseeã for cart or trolley...)","jàna":"to reach heaven or paradise, especially by dying a martyr, reaching heaven; something that is like heaven or an act that induces a heavenly feeling","nigo":"cat or fluffy, usually domesticated, animals.","raha":"a straight (i.e., plain) green and lush field, though it does not have to be green and lush; lonely, desolate, isolated, alone; plains. can also mean heterosexual, vertical, or upright, and can be applied to horizontal things as well. slanted or lopsided things qualify as long as they are 180 degrees on their line.","katu":"gender-neutral term, encompasses anything that is a 'private part' or 'genital.' katouĉa for vagina, katouĉe for penis, and katoujinyi for breasts (boobs).","paya":"a paya is anything paper-like. this could be aluminium sheets, polyethylene fibre, or even stone paper. it can also be used to refer to exams: 'raŝimasstal ni naŝįrra fu paya irime' (the student couldn't do exam study (i.e., study for his exams)). it may also refer to experiments, like 'payanan ni kuenanai' (our test failed) or 'na′a nasų paya yarapokinqtwana-004 ga kó!' (we can test future gadget 004 next day / tomorrow!). it may also refer to studying, like 'sua anisų payaru payalúyet' (I must study for the exams). It can also turn roots into fields: 'kamàpaya' (astronomy, the study of stars)","pamya":"anything that is related to writing, scripts, or orthography is pamya. Egyptian hieroglyphic tablets are pamya and so are google docs. It can also be used as a verb: 'sua pamyathu subeko no payalúyet'","bareku":"it is to bless or to do with blessing [someone or something] (indicated by context) or blessing, as in God's favour and protection. this is commonly used as a greeting: 'o bareku fuka!' (be blessed!).","ẑamu":"a word for any deity.","komuni":"its semantic space contains anything or anyone that 'owns' or 'controls' something. It is different from riwaka in that it is explicitly about ownership, lordship, or control. the government is komuni, the ruling party is komuni, and your boss is komuni. Slaveowners are komuni as well. examples: 'sua kikitanq komunilǫ' (I despise the masters (i.e., the government)).","serebo":"directly loaned from Russian 'SEREBRO' (yes, it was inspired by the band!), it refers to anything silver or similarly precious. for example, a serebą hon could be a silvery person or a person made out of silver. and serebą riwakanapi (silver head hair) refer to the colour of the head of an old man.","paŝa":"used for sibling or similar familial relations. it can be used for cousin too but there are better ways to say cousin.","jan sama":"used for sibling or similar familial relations. it can be used for cousin too but there are better ways to say cousin. use paŝaĉe for brother or paŝaĉa for sister.","ma sewi":"to reach heaven or paradise, especially by dying a martyr, reaching heaven; something that is like heaven or an act that induces a heavenly feeling. paradise.","pakala a":"directly loaned from Cebuano (yawa) comparing a thing or person to horribleness. comparable to damn. e.g., someone hit you, you would say yawa as damn (e.g., fk,sht); denotes surprise. a thing that is damnable or shitty. it is a universal curse word. you can use it for bad luck too, like unlucky or unfortunate events.","awen (preverb)":"anything to do with defence or protection. can refer to condoms as well because of this. Maoru is also a garibankana (strange word). It is not an o-root but it behaves like one. so, you never say 'ke maoru suõ!' (save me! / help me!), you actually say 'ke mauru su!' (save me! / help me!). For the romantic form, it is manyuru. So, always use mauru (save.V.PLAT) and manyuru (save.V.ROM) for the verbal platonic and romantic forms respectively.","unpa ike":"raka is often used to describe something forcible or nonconsensual, like rape. it is not used for statutory rape. for that, simply use haŝiruhategą (child sex / intercourse with a minor). raka can be used to describe unwanted acts, like 'sa′a raka su jippu fu irimesan' (she raped me by making her do her work). raka is an extremely offensive word and an intense curse word. it cannot be said lightly or casually, ever. use it like it means 'rape' at all times.","ba":"any fruit that is mushy, sweet, or soft.","pona sewi":"it is to bless or to do with blessing [someone or something] (indicated by context) or blessing, as in God's favour and protection. this is commonly used as a greeting: 'o bareku fuka!' (be blessed!).","wasoweli":"an animal with the qualities of both fihon and omoko","usawi":"anything that is not easily explainable by science or is hard to understand or comprehend","unu":"anything in the purplish shades, like lavender, violet, etc.","teje":"anything related to the right or on the right side, including the right on the political compass.","teje ala":"anything related to the left or on the left side, including the left on the political compass.","taki":"something that is sticky or magnetic, like bonds, or referring to attraction. refers to any force that brings two things together or keeps them together, like a clip, as well.","puwa":"something that can be compressed and will try to go back to its original shape. anything that is soft, squishy, fluffy, or that is cute, especially to touch.","powe ala":"anything that is real or true. from Arabic 'haqq.' its use is very similar to haqq in Arabic as well but beyond the Arabic usage, it can also mean good faith, openness, straightforwardness, to reveal, and to be serious / not trick or befool.","powe":"the opposite of haku","pika":"it is anything conductive or electric, which can include anything from pikachu (the pokémon) to a charged balloon.","pake":"to hinder is its semantic space - it denotes hindering, interrupting, stopping, or even ceasing. so ceasing to exist is faugi and a criminal's apprehension is faugi. your phone turning off is also faugi.","owe":"it is anything dystopian, like kafkaesque or even orwellian. humorously, it can be used in casual contexts, like describing one's parents as 'fapeto' is an extreme, humorous, and satirical exaggeration. fapeto is also about consent and innocence - someone scamming a person by deceiving him is fapeto and someone forcing a person to unwillingly give him money is also fapeto.","konwe":"the opposite of koro, which is all about death.","kapesi":"from Arabic bunni. it can also refer to tea, specifically browner or beiger teas. Bunista could refer to less brown or green teas. Buninq would be the opposite of a tea or brown, grey, beige, so do avoid using that for non-tea or non-brown tea.","kiki":"anything that is not smooth","kamalawala":"from the Arabic khuruj(an). it has a connotation of sacrilege if done against a just ruler. apart from that, it is used to describe anarchy, including anarchism as an ideology, revolt, and rebellions. anything against the status quo is a curujan.","jami":"positive sensory experiences, including that of yumminess. waoinq is used for negative sensory experiences.","isipin":"anything regarding cognitive faculties is riwaka. so thought, imagination, decision-making, planning, and even understanding in some contexts are all riwaka.","apeja":"anything about 'singling out' or 'targeting' is kedésu, which includes dishonouring, disgracing, or even guilt as a noun. for example: 'suo noyuku kedésubu' (I feel guilty) can be used to describe feelings of shame or guilt.","ilo selo":"borrowed from the Japanese 'futa' (ふた), it encompasses any specialised 'thing' that provides covering. technically, even houses qualify, as they 'cover' something. but it is much better to use other words for that. also, it can be used to describe individuals with ambiguous gender characteristics; however, it is not limited to intersex.","mije sama":"foŝo is a versatile and gender-neutral word that functions similarly to the English slang 'bro' or 'blud.' its semantic scope encompasses any individual with whom one has an understanding. 'sa ni foŝssun' (she is my 'foŝo') or 'sua watadą kiwinqthu zuǫ monh zu ni foŝssun' (I only stopped you because you are my 'foŝo').","jan sona":"kanojo, loaned from the Japanese pronoun 彼女, is one of the most productive roots. it literally refers to 'someone you know.' you can better define this relationship with particles: kanojnya (girlfriend), kanojnye (boyfriend)... and so on. by default, the level of 'knowing' is not specified, but superlatives and diminutives can specify that; e.g., kanojssta (someone I just started to know / barely know) and kanojnyi (someone I know the best / have known for my life). So that means kanojnyinya could be wife (or kanojnyanyi) and kanojnyinye (or kanojnyenyi) could be husband, though just using kanojnyi (spouse) suffices. See Grammar:2 & Grammar:6.","jan pi sona mute":"onokoi was derived a priori in Kawakanamagana and is borrowed from there. unlike kanojo, it implies that the person is better known or more known relatively. it's like using friend or partner. onokoi is also used for people who are famous, like onokoinyi (a most known person), like in 'Hyu Lórri ikuhi ni onokoinyi' (Hugh Laurie is a famous person). you can also use onokoinyiáán as a lexical source for famous, like in 'onokoinyiáán kitei' (famous item). of course, there are other ways to show 'famous.'","telo jaki jelo":"used to describe anything pee-related. it specifically refers to metabolic waste, so it can be used to describe cellular metabolites (since they are, technically, the 'pee' of the cells) or the act of peeing. please never use this to describe yellow-coloured liquids in general, like juice, because that's disgusting - unless you're trying to be all poetic by referring to the metabolites found in mango which dictate its flavour. but otherwise, it is likely to be misunderstood as, well, pee. the root can also be specified as artificial, like jitekorei, which can refer to synthesis (not biosynthesis), byproducts, and so on :). it is highly contextual!","ko jaki kapesi":"the semantic opposite of jiteko (pee, excretion, metabolite, metabolism). jitekonq can refer to egestion, defaecation, faeces, and even chemotherapy drugs called antimetabolites. it can also refer to the parent or precursor compounds pre-metabolism (for example, the jitekonq of dicoumarol would be 4-hydroxycoumarin in fungal biosynthesis!). it can also refer to anabiosis, which is when metabolism has effectively stopped or been halted, or that it is extremely slow. it may also refer to gut ileus or paresis! a very versatile form of jiteko.","anpa, lili, weka":"kuenau's semantic space covers the space of losing in English; however, it can also be used to mean 'set free' or 'release' if the act is intentional. like, 'sua nasume soa kuenaą' (I let him free / loose). you can also use it to describe failures, like 'sua kuenathu payasunji' (I lost in my exams). also note that if you wrote 'sua kuenathu payasun' (I lost my exams), it would imply you were unable to find the exam itself or something along those lines. kuenao is different from nanda in that nanda requires extra particles or disambiguation to mean lose and does not usually mean 'loose,' whereas kuenao can simply be used itself to mean both lose and loose.","pan, seli":"kova is like roĉi in that it can mean bread, pastry, or cake; however, it is unlike roĉi in that it also covers anything related to making anything that is meant to be used in some way. it does not carry a food connotation - for that, use kamhai (kamo+hai, see Grammar:0.6). though, a kovajitei does often carry a food connotation. a meth lab is kova, a restaurant's kitchen is kova (not the restaurant itself), a kitchen is kova, your stove, microwave, and ovens are all kova, and textile factories are also... kova! also, unlike naŝita, it can cover any form of cooking: making a salad by chopping up veggies is actually an act of kova, where you are the kovamas (manufacturer)... though calling yourself a kovamas for making a shoddy salad sounds quite over-the-top to me! Kovastamas would be better, which literally means \"least manufacturer\" (i.e., non-professional producer? imagination is the limit).","sijelo pakala":"mahwa's semantic space encompasses anything that is malfunctional; i.e., anything in a state or operating in a state that deviates from that which is nominal or its normal. an unusually dim lightbulb is mahwa and so is someone with a hemiplegic gait. Mahwa can also refer to prodromes like prodromal hyposmia in Parkinson's disease. you can also use it playfully to describe people who are chronically online (tahete mahwa). it is generally offensive if used in contexts like 'zu ni mahwa' (you are ill), but if you guys have an understanding, go wild!","pilin pona":"anything that is a positive feeling related to happiness - if you have a good feeling about 2026, then it is a kanata year for you.","ante, ala":"des is a relic from the first Taqqic language (Old Taqqa). in Old Taqqa, des was the equivalent of -nq. so, you'd say 'kita des' (dislike) instead of 'kitanq.' however, it has persisted in the lexicon and its semantic space has grown. it does function as a semantic inverser still, so saying 'hon des' (animal) works, but it is mostly archaic. instead, use des for its other meanings! it encompasses anything that is the opposite or reverse of something else. you thought you could play games all week and study the last day and pass your exams, but you failed? then that is a des. you can also use des to humourously describe opposite values, like 'miku des' would be the opposite of miku (Zatsune Miku, evil Miku). it is pronounced [des] or [deːs].","ma ale":"Hiroga was borrowed from the Old Taqqic 'hiroga,' meaning 'to span,' used even in sexual contexts. The Tawish word is no different: hiroga means almost all the things it meant in Old Taqqic. here, its semantic space covers anything spreading or spanning something. it can also refer to the world, like the Earth specifically, or any object, existence, or plane that 'envelops' or 'spans' something else. Earth is a planet, so its spherical in nature; therefore, the existential plane 'spans' it metaphorically. you don't actually need to remember all of the complicated jargon - you can only memorise the meanings and still be good to go :)! you can also use hiroga to mean 'get on all fours' (usually sexual), but i'm not going to give an example sentence for that! it can also mean crawl, like 'haŝirula hirogathu' (the child crawled). it can also refer to anything pan-, like pansexuality, pan-nationalism, pan-Asianism, etc. it also covers the semantic space of 'pan' in English, which are usually shallower objects, like frying pans. you shouldn't use hiroga for bowls, cups, or pots. though some frying pans can be surprisingly deep, as long as they are meant for cooking and are not a pot, they are a hiroga. use hiroganq for its opposites, like a pot or bowl (hiroganq).","laja":"Koha is a direct loanword from te reo Māori (from New Zealand). A lot of its meanings are from Māori! koha is a very versatile word, meaning anything from something deprecated, superseded, or defunct to being hospitable for your guests. In technical contexts, koha refers to something deprecated, superseded, or defunct (i.e., legacy), but outside of those contexts, it usually shouldn't ever mean that. it refers to any act or thing that is given with social, emotional, or cultural meaning, across time or relationship, voluntarily or normatively, material or symbolic. if any value fits that, it is koha. Koha is always positive, so if you want to avenge your friend, that is your koha to your friend. Avenging someone is a gift for them, it is also your obligation to them (due to your relationship with them), and it might even be a cultural obligation; e.g., 'ryą ni kohasun yéppu zu\" (this is my gift to you). wills, bequests, endowments, favours, rites... all koha. 'sua subu kohalen zullanh' (I want a gift (i.e., favour) from you). there's also superlatives and dimunitives: curing cancer is kohanyi (ultimate gift) and picking up random litter is kohasta (the least one can do).","kipisi":"Taken from the Arabic word fajr, which is the time precisely at which light from the Sun splits the sky apart, faja's semantic space covers any concept of dawn or splitting (metaphorically and literally). it can also be used to describe anything lighting up, like 'hatakasana faja ẑi sua fofu salla kohaita' ('Her face lit up when I told her about the gift'). literally, you can use the word faja too, 'faja ni ẑi fuyu hyo?' ('at which time will dawn occur?'). and metaphorically, you might call a man 'fają hon' (lit. ~dawned person) if his face suggests he's undergoing some grand epiphany. in some contexts, it can mean 'sear,' both metaphorically and literally, like in 'Sánitaizà'ikula fajaru kuginamekąson.' (the sanitiser seared his broken skin) or 'hajira takala fajaru soralnin.' (the angelic rock (comet) seared through the sky (burning intensely). you can also use it romantically, like 'sa′a fajanyu ganáánsanlúun nuksun' (she seared my heart with her words). you can use context or further disambiguation to specify if the searing was good or bad. NOTE: fajà is the correct form (à is marked).","tawa wawa, tawa suli":"hatero describes any energy-intense or swift movement and locomotion. so, running a lap is hatero. it can also refer to the operation of things, such as the status quo itself. so, 'kiteila hateren nihi ii hyo?' (are things going well / is everything running smoothly?). apart from this, it can describe a sequence or series of events, like 'suo hatertei no yawa wanolen!' (I had a series of unfortunate events / I underwent a run of unlucky times). you may also use it to describe anything flowy or 'runny,' like a runny nose (hanahaterą)! it can also turn a root into a system or lineage or technical series; e.g., \"Javaskwuipt'haterãlú\" (the Javascript ecosystem). It must always have at least one plural article - definiteness does not matter - to function this way.","tawa, tawa noka":"haeko is technically a variant of hateronq. you should be saying 'sua hateru ę sa′a haterunq' (I run and she walks), not 'sua hateru ę sa′a haeku.' the only difference is that the semantic inverse of hateronq would mean: ~abandon, stop, disarray, (single) unit, abstain, ignore, fizzle, neglect, give up, and, of course, walk. the semantic inverse of haeko (haekonq), though, means: ~tighten up, work up, worry, fret, (emotionally) unravel, even misguide, and, of course, run. so, the distinction only exists due to the other semantic meanings, not due to the core act. In Modern Tawa, haeko is used to casually describe walking and anything similar. even though 'nq' makes words like haeko redundant, Modern Tawa optimises for ease of use over unrealistic simplicity. 'nq' is still very commonly used in Modern Tawa, though! 'haeko' also means learn and it means teach as haek(o/u)nai. So 'tawa ni ielilių haeku' (lit. \"tawa is so easy to walk\") could mean 'tawa is so easy to learn.' For teach, you would say 'tawa ni ielilių haekunai' (tawa is so easy to (suffer the) walking (of); i.e., so easy to teach). you can also use haeko in the sense of 'walking something/someone,' like 'sua haekuthu nigonq' (I walked a dog). If you want to say 'I taught a dog,' try 'sua haekunaithu nigonq.' If you want to use 'learn,' then a proper way is 'sua haeku nigitanq' (I learnt (about) a dog / I walked (about) a dog) - which can mean to circumambulate a dog or learn about a dog. To specify that you mean 'learn,' just use the sufferer particle: 'suo haekuthu nigitanq' (I learnt about a dog).","pake, lili e ken":"anything about 'taming' anything is tabete. Tabete simply refers to a chain. this chain could be metaphorical or literal, like a taka tabete (hard chain). torture, subjugation, and keeping people docile - these are also tabete. Kidnapping is tabete or tying someone up is also tabete. It is quite a dark word when used this way. Tabete can mean 'teach' but only in the indoctrination or culturing sense. It is a secondary meaning. For teach, use 'raŝi'.","kiwen ala, ko, suwi":"ritaru refers to anything that's soft. this could be in the tactile, structural, sound, visual, emotional, temperature, social or moral, or even the temperature domain! a comfortable temperature is ritaru, a couch you can always sink into is ritaru, and the food you eat when you're stressed is ritaru. Someone who speaks in a low register and is nice - they are ritaru. Someone who is also weak or does not handle some stuff well is ritaru. A fragile system or structure, like a glass window, is also ritaru. The opposite of ritaru is not exactly taka, as ritarunq would encompass many other things that taka usually doesn't, similar to how takanq isn't exactly ritaru. Peace is also ritaru, since peace is comfortable. you can also use it to describe chocolates or chocolatey things, like a ritaru sawa (soft sweet) is white or milk chocolate. Taka sawa? Probably dark chocolate. It can also refer to 'piece,' like in 'sua nasų au ritarul no kekàryą hya?' (may I have a piece of this cake?).","pali lili, wawa lili":"this word is deceptively massive semantically. Whilst it might just mean 'easy' (irimeryą ni iedami! - this project is so easy (to do)), it spans multiple domains. It can refer to compliance, resistance, friction, difficulty, stakes, risk, calmness, morality, low complexity or high clarity, and so much more. for example, a 'dami honĉa' (easy woman) could refer to low sexual selectivity. a 'dami haŝiru' could refer to lower behavioural resistance or rebelliousness. A 'dami twana' can refer to a user-friendly gadget. For something calm, gentle, or relaxed - use ritaru, not dami. 'dami kó' (easy day) would emphasise that the day was easy to get through, and it is usually relative in this meaning. If all of your days are stressful but today was a little less stressful? It's a dami kó, but not necessarily a ritaru kó (soft, gentle, or peaceful day). It can also refer to bluntness - 'ke damią fofu sulla' (tell (it) to me bluntly / directly!). it can also mean light - dami gaya (easy body) could be a lightweight body or matter. it may also refer to low friction, like 'rerete ĉi ni iedami!' (frozen water (ice) is quite frictionless). related to this, it may refer to compliance, like 'haril ni ruthu damiun' (the deal was made without much resistance (from the other party)).","toki musi":"it refers to anything funny and can be used as another way to say smile, like in 'zua ipaniru haha hyo?' (do you find this funny?), which could be an example of a teacher scolding a student.","skibidi":"The semantic space of iyuko also contains all noises and sounds and any act of creating a noise or sound. Any sound from any source can be a iyuko. Music is a iyuko. A scream is iyuko. The sound that a tree makes when it falls in the forest is a iyuko. A sound doesn't have to travel through air to be a iyuko: whale noises are iyuko, and a heartbeat through a stethoscope is iyuko. iyuko could be an absolute pitch, or multiple. It could be sound designed to sound a certain way, or chaotic noise. It is similar to miro but miro carries a connotation of 'reflected,' whereas iyuko does not. Compare: 'sua miru mirolen' (I reflected a sound) v. 'sua iyuku iyukllen' (I played a sound).","lukin pona, waka":"ainàwa is a highly social word and very contextual. it captures anything smile-related. so, for example, showing your teeth (to the dentist or saying 'cheese' in a photo both count) is ainàwa. the sparkle or shine in your eyes or dimples are also ainàwa. softly exhaling or your voice pitch rising slightly? Ainàwa. cheering is ainàwa too and so is being empathetic. cunning or 'secret amusement' are also ainàwa. inner satisfaction or satisfaction in general is also ainàwa. Completion or release specifically related to this is also ainàwa, so the vacation you get after working full-time for weeks without break would be ainàwa. To release a captive or prisoner would also be ainàwa, like in 'komunilúa ainàwanai hontabeteąlwun' (the government / masters have released the people they kept tied up). It's one of the most beautiful Tawish words - use it as much as you want <3","hon sewi":"hajira is another extremely beautiful word! it was inspired by haji from Arabic, referring to a Muslim who has performed pilgrimage. Over iterations of Tawa, haji was distorted a little and turned into what it is now - hajira!! - referring to anything saintly or sacred. It can be used for anything awe-inspiring, ethereal, 'otherworldly,' or angelic. A singer's voice can be hajira, a spouse could be hajira, and shooting stars are hajira! e.g., 'sua subuthume a au subeko no manil Hirogalji ẑi a niruthu hajiraryą popoki taka′a fajaru soralnin!' (I wish that I got all the money in the world when I saw this huge (and) angelic rock searing through the sky).","pakala, pakala pilin":"aiŝi (from an Indian/Pakistani (~aish or something) slang for hurt) refers to any wound, scar, or injury. usually it isn't severe, unlike aiaiŝi or other variants which would refer to deep wounds or higher (or highest) injuries like heartbreak, such as 'sa′a ieaiaiŝinyi lilinuksunǫ' (~she really tore apart my fragile heart - but this translation is not even close to the depth of the sentence). Do use aiaiŝi to refer to severe injuries and aiŝinyi for permanent injuries like traumatic brain injuries (TBI). it can also refer to betrayal ('soa aiŝi suǫ monh a kuenau irimetei' - he betrayed me by leaving the workplace / by leaving work / because he left work). It may be used for humiliation too, like 'soa aiŝi wuǫ monh a fofu hyakteiwunita' (he humiliated them by speaking about their secrets). in slang terms, it can also mean 'burn' like when someone is 'roasted.' Don't use it to literally mean burn, though. you have other words for that!","toki pi insa":"it can refer to anything hidden or classified. anything unknown to people is a narana. that means that the devious activities of Ea-Nasir that we don't know about are also narana (naranal irimelós no Ea-Naŝir'iku (the ominous/mysterious activities of Ea-Nasir). though you should actually say 'narana irimelú no Ea-Naŝir'iku ni ieainàwat! (the secretive activities of Ea-Nasir were quite devious). military secrets, CIA files - also narana. It is not a selective word, though you can definitely disambiguate with context or grammar.","telo lejo":"esàce is a very violent word. it captures the essence of violent pain. esàcesta is a more friendly form of esàce and the most commonly used one too. esàce can refer to anything between a kick in-between your legs to having a large rod inserted into a lower orifice and out of an upper orifice. it is a word you don't use casually, it is a word you feel, and viscerally so. it's a shock word. for example, 'aiu esàcesta appu ĉiru sujiji' (white-hot pain poured over me). it can refer to blood too. Esàceááf or other source-derivations can refer to bone marrow or even nociceptors as they are the source of blood or pain! p.s. use the modern spelling esace without marking the vowel","seli suli":"aiu refers to anything fiery. it refer to the mythological Phoenix and to the Minecraft blaze (yes, literally!). you can further use particles and context to mess around with the meaning - are you referring to hellfire? or are you referring to enlightenment, as in the light of fire taking over darkness? it can refer to ambition, drive, maybe even libido as aiunyĉ! a shooting star could be referred to as an kamàaiuą (a comet ablaze / fiery celestial body). it can also be used for pain, like 'ĉikajistason ni esàceru esàcestaaiuąun' (his lower body (e.g., stomach) violently torqued with white-hot pain).","sike insa, insa":"this refers to your guts or gastrointestinal tract specifically. it doesn't refer to the digestive system itself, but ngosubeką (entire guts) could. ngopnyi (highest guts) or ngopsta (lowest guts) could refer to the upper organs of the digestive system (oesophagus, pancreas, liver) and the lower organs (colon, intestine) respectively. Ngophai could refer to digestion and then you could stack particles like ngopnyihai, which could refer to blood sugar control, insulin, etc. be creative!","insa sijelo":"Sumatà refers to the liver specifically but the main reason sumatà is used is due to its beautiful semantic space. It can be used to refer the innermost essence of anything - the soul. it can even be used to refer to the subconscious mind or the seat of your emotions. it can refer to someone very near and dear to you, like in 'ta sumatà onokoi!' - (oy) dear friend!) - and also in 'zu ni ritarul no sumatàsun' (you are a piece of my liver), which is a very intimate and endearing sentence. you may also use it like 'ŝahadalú ni au poki sumatàlós' (the soldiers have big livers) to talk about their courage and bravery. Also note that a sumatàitagi (liver-idea) would probably refer to a dream or something your subconscious thought(?). As a modifier in the sumatã or sumatàbu form, it turns any root into a quality or state, like \"honsumatã,\" which means humanity/humanness, or \"honsumatàbu,\" which would refer to humanoidness or humanishness. Unssamatã is vitality itself.","pilin ike, ike":"Directly loaned from tagalog, it can be mildly vulgar, but it refers to anything annoying or anything that is a nuisance. For example, someone who calls \"tawa\" a frying pan on Discord is bwiŝí. the bwiŝít form is usually stronger or more negative than just saying bwiŝí. bwiŝíóy would be explicitly playfully annoying or teasing.","sewi, jan sewi":"a word for any deity.","tenpo pimeja":"you can use it to refer to any night or tonight or even yesterday night! if disambiguation is needed, just use the appropriate temporal particle :D (ẑista konq (before night, the night before this day))","waso, waso moku":"omoko are specifically birds meant to be eaten and are also usually white meat, though not always.","ko pi pona moku":"anything psychoactive or bioactive is a hingo. so a prodrug (though inactive but becomes active) is also hingo, but you could disambiguate with particles or context to distinguish prodrug vs. drug. MDMA, meth, ecstasy are hingo but so are levetiracetam, paracetamol, and montelukast sodium.","lanpan":"can be cute like 'sa′a daka suõ monh fofu kiteilenita' (she stole me to talk about something) or literal 'foshsun ni bakalen dakanin kiteilúsunõ' (my friend is a dumb idiot for stealing my stuff). Btw, here 'baka' is more playful than it is serious. If you want to be serious, you could say nigonq (dog) or something. It covers the semantic space of grab and borrow in English, but usually the borrowing isn't consensual or something one can't easily reject (unless you use dakaóy). You can use dakat for a fully negative connotation (harassment, grip, cop a feel - consent not implied) or dakaóy for a positive one (hold, borrow - consent implied).","pana e X tawa Y":"in Tawa, senodo's semantic space covers anything from sending a text to banishing. its verbal form is senodzu. when agglutinating with -i, it turns into senoji/í/ĩ/. for example, in 'sua senodzu koha zulla' (I sent the gift to you), senodo is in the verbal form (senodzu). you can use it to also convey that you made someone enter a state, like 'soa senodzu kakanatanqji sa' (~he sent her into a depressive spiral) or 'kariĉala senodzu haŝirusan rawaji' (the mother sent her child into sleep). In the previous contexts, senodo always has a sort of 'wrestle' connotation - that it wasn't easy to do the task. or that the task wasn't done gracefully. Senodzu rawaji ((to) send into sleep) sounds like forcing someone to sleep and senodzu kakanatanqji ((to) send down a depressive spiral) sounds very emotionally disturbing. Use senodot or senodóy for connotation control, like 'kariĉala senodut haŝirusan rawaji' (the mother sent her child into sleep) is explicitly negative, but if you used senodóyu, then it would be positive or more peaceful (like lulling a child into sleep). you can also use it to mean banish, exile, signal, or broadcast! it may also refer to plunging (senodzunanda (sent down)).","o kama, o ike, pona e":"'ai' is the universal word for help. shouting it will signal an emergency or something serious! say 'ai fuka' for a request (optional) or 'ai aiko' for a demand. both 'ai aiko' and 'ai fuka' are non-immediate. you may also say 'ke ai' which is ruder but also signals more immediacy, so if you need help with homework, 'ke ai' would be too urgent. use 'ai fuka' for that. use 'ai aiaiko' for an urgent demand or 'ai fufuka' for an urgent request. and you may use 'ai sai' for an intimate or personal and polite request and 'ai ana' to signal warmth, appeal, or emotion. other than this, you can use it to mean help (as in help your sleep), assist (as in you should assist her), improve (as in we improved / helped with the building), support (as in help me up / support me up), aid (as in aid / help yourself or maybe something like ~'take the medicine to aid yourself'), and even prevent (as in nothing will help now / nothing will help (to) stop her). Using 'aiũ kiwinq' (help to stop) is just as correct as 'aikiwinq' (see Grammar:0.18.1).","tomo lili, tomo kipisi":"makeba is a word that defines the relationship between an object and the void surrounding it. It captures anything related to an occupiable space. Any partitioned area within a structure is makeba. This includes a bedroom, a prison cell, or a small alcove. The specific \"square footage\" or the physical floor you stand on is makeba. the silence between two musical notes or the pause between two people speaking is makeba. It is the \"room\" in time. If you stand too close to someone and make them uncomfortable, you are \"violating their makeba.Having the \"room\" in your heart to forgive someone or the mental \"leeway\" to handle a stressful situation is makeba. If you are overwhelmed and have no more patience, you have \"run out of makeba.\" The extra space at the edge of a page (margins), the spare change in your pocket, or the 10-minute buffer you leave before a meeting are all makeba. It represents the \"safety net\" of space or time that prevents a collision or a mistake. The \"feeling\" of a place, whether it feels cramped or airy, is its makeba. A person who can \"read the room\" (understand the social mood) is someone who \"sees the makeba\" And, if you see two people indulging in PDA, they probably need to 'get a makeba!' (ke de makebalen - get a room). you can also use it as a verb (could mean 'encompass' since that's what rooms (makebalós) do: they encompass stuff) or other word types.","kalama musi":"the word utari can be broken down into uta (歌, sing) + -ri (AFFIRM). in Takan languages, it meant 'indeed, sing!' or 'affirmative sing.' the term was so common that it turned into a single word (utari), especially after the polarity particles drifted phonologically (ra->rra, ri->rri). So utari was originally uta (a loan from Japanese). Utari refers to any melody, music, or rhythmic piece. A moraically timed language (such as Tawa itself) is actually an utarigana (~singing language). Utari can refer to pleasant sounds metaphorically too - so if you've built some device and you turn it on and it buzzes to life, to you that's an utarimirã (melodious reverberation) - even if others find it unpleasant. it can also refer to chirping, chirring, and other rhythmic animal sounds (they don't necessarily have to be 'sung'). so a ngoshi will utari and so will an azhuruzhupi (green insect; e.g., grasshopper, cicada, etc.). utari can also refer to breaking confidentiality or disseminating information. a suspect utarien (singing) to the police is incriminating himself and a therapist discussing cases with strangers might be breaking confidentiality. though it doesn't always have a negative connotation. utarióy specifically would have a positive connotation. it can also refer to crooning, yodelling, serenading, and reciting. the recitation of holy texts is also utari. celebrating or praising is also utari (zua utarithu asalsubekãita ana... iilyã hya? - you sang all about the house, right? is it (really that) good?). as a noun, utari can refer to poetry, romantic songs, etc. (romantic/platonic distinction done by particles themselves).","nimi, jan X":"nama simply means 'name.' it refers to ownership or association (in the name of...), fame or reputation (to make a name...), blame or credit (in the name of justice...), names as concepts (the name of freedom). it can refer to identity, designation, and title. so your identity (e.g., Michael the surgeon) is your nama. your 'memory' or legacy is also your nama, as in 'leaving a name.' so if were remembered as Michael the Warrior, that is your nama. it can refer to authority, which is the same as ownership or association, like 'in the name of X.' and finally, you can use nama to mean 'drop a name' to convey showing association. if random guys drop the name of some influential guy, then they are namasenoden (name-dropping). It can also refer to entitle and all similar meanings, especially in the namanai form.","nasa, ike, sona ala":"this is an extremely harsh and vulgar term. never say it casually. use baka instead, which is playful and lighthearted. it is borrowed from Visaya directly.","uta e X, moku":"kachi is a universal word for nibbling or biting. by default, it is an extremely playful and affectionate word (e.g., 'yad kachi suõ!' (so bite me!)). you can of course use particles to disambiguate. kachi can refer to something like a little, romantic nibble (lili kachi or kachinyu) to a dog digging into your skin and tearing off your flesh (esàcekachi, kakachi, kakachinyi, kachinyi, kachit(?)... etc.).","kama sona, kama lukin":"at its core, anana refers to the convergence of more than one 'things' at a point. its similar to meet in English and 会う (au) in Japanese. it can also mean OK, appropriate, or good, and is often used as 'OK,' like 'anana, shirethu' (okay, (I) understood). as a modifier or in compounds, it means appropriate, like 'ananakamu' (meetly eating / to eat in a germane manner / appropriate behaviour for eating) or 'su ni ananarra irimeryãlla' (I am not meet for this task / I am not a good pick for this task). it can also mean confront, like in 'zul ni anana zhi lili wano' (the two / couple are about to meet in a little bit). metaphorically, it can mean to experience, like 'su ni iejiryã anana korteiõ!' (I was this close to meeting death!). and finally, in its most simple meaning, it just means... meet: 'unssun ni kiwiũ yaraen sowtei imo subeknampa sowlós zhi anana saõ' (my life started to become as luminous as infinite Suns when I met her).","kulupu mama":"hakashi refers to the totality of your kin. by default, it only references immediate family (siblings and parents, sometimes the subject's children). however, forms like hahakashi refer to extended family. subeko no hakashi (all the families) refers to kin as a whole or the entirety of your relatives.","lukin, kama sona":"yume is a basic literacy word. a yumehon is literate and a yuyumehon is extremely aware and intelligent. other than this, yume can refer to works, literature, and tales or stories, like 'Yumel no Halan ni ii yumelen tohi!' (The story of Harlan was a good read/work!). Yume also refers to silent reading (yumeiyukãnq - soundless reading). Yume can also refer to fortune-telling pseudoscience, like 'yumen tete' (reading hands / to read a palm). It also refers to loading something or reading it, especially in technical contexts: 'twanala kuenaũ yume ribul' (the device failed to read the book). it can also refer to pronunciation, like in 'yumen ryõ ni iinq!' ((you are) reading this incorrectly / badly!). it also refers to analysis, both literal and metaphorical: 'yumezun hya?' (your read? / your take? / your analysis?) and 'ke yume makebal à!' (Oh, (will you) read the room, (man)!).","kute, nena kute":"the semantic space of osara is huge. though it superficially just refers to external ears (osarajinh) or inner ears (osaraji), it can refer to anything between vertigo to attention to detection to skill and to even calling! Osara can mean to ignore, like turning a deaf ear, especially in darkly funny or sardonic contexts (e.g., 'osarasun ni kiwinq' (my ears are shut / can't hear you / don't care what you say)). it can also mean to obey or heed, like 'su ni watadà osaraen!' (I am giving my utmost attention). it can also refer to anything pleasant to the ear, like music! it can also refer to gossip or rumours (as osarat or in constructions where it would be implied). it also refers to equilibrium and balance, both technically and non-technically. a balanced chemical equation is osara and so is a reaction in equilibrium. a steady gait is osara. a sufficient diet may be osara. And balancing a deck of cards to form a tower is... osara! As bakaosara or in implied constructions, it can refer to vertigo or dizziness, though osaranq may also be able to be used for that(?). It also refers to stuff similar to ears, metaphorically and literally. the 'ear' of an electronic (taheteosara) is its microphone. and a rough sketch of an ear is osarabu (ear-ish). It can also refer to calling and detection, which may also be used for animal mating rituals. out of this, it refers to simple calling (fu osara shi anisji - (give me a) ~holler if in need) or referring (ke osararra suõ imnyi lilihashiru! (don't call me little boy!); p.s. this sentence is more angry than playful due to usage of ke and some other stuff). Finally, it refers to detect, as in 'sua osara... iinqõ' (I detect evil.)","jo wawa":"para refers to all kinds of endurance, tolerance, and support. metaphorically, this extends to the sense of giving birth or procreation and to literal patients (a person being treated). it also can refer to patience, like in 'ke au paramyãnq!' (have some patience!). it can also refer to a literal bear - the animal - or bear-like animals. it can also refer to large or heavy men as well as cumbersomeness, like a 'paratwana' would be a large or unwieldy tool. it can also refer to bad-mannered people who are impolite, like 'so ni paratei' (he is bad-mannered), though using it in this sense is derogatory and often borderline vulgar. it is not a curse, though. it can also refer to carrying, like 'nasũ para paratei' ((you) can carry the weight). it can be used sexually (e.g., hunk) sometimes.","utala sin, kamalawala":"hangara refers to anything related to rebellion or opposition - a conceptual opposite of kiwi; however, the two are different: hangara can't refer to ceasing activity whereas kiwinq can't refer to suffering through something. the FOR and OPP cases are similar to hangara - cf. 'sua hangara sapo' (I fight for her / I defend her) vs. 'sua hangara sabo' (I fight against her / I counter her / I defy her). if you omit these particles: 'sua hangara sa' (I oppose/defy/reject/fight her - context makes it clear if you're fighting with, against, or for her, given that the cases are not marked). If compounded or used as a modifier, it can refer to consent, like in 'hangarahategã' (nonconsensual sexual intercourse - here, the implication is that the sexual intercourse was not done happily or fully willingly; sex that occurred without will or was forced is raka). For its other meanings, like subdue, manipulate, force, etc., you should pair it with the actualiser 'fu' - so 'fu hangara' would mean (to (do)) subdue/manipulate, etc.","pakala lili, weka e selo":"himae is a wonderful word that has been loaned from the tagalog 'himáy,' which is a specific context-dependent word that refers to mutilating a carcass into convenient or bite-sized servings, like the deboning of a fish. In Tawa, it has a similar meaning; however, it is much more broad. So if you say 'soa himae karabalõ suyet' (he tore the creamfruit for me), then that would convey 'he peeled off the skin / cut the creamfruit for me.' It can be used for fish, like 'soa himae samilóõ' (he shreds the fish), which means to simply debone or prepare for eating. metaphorically, himae's domain extends to preparation for anything, like 'sua himaeku payalla' (lit. I tore apart for the paper) would be understood as 'I prepared for my exams.'","monsuta, ijo ike":"oao at its core refers to anything that is not safe. so life is technically oao, since every day is chaotic with a good chance of resulting in a esacekortei. however, it is context-dependent. so a shady person? oao. tetanospasmin, chlorine, serial killers, and cliffs are all oao - one blocks your airways, one suffocates your machinery on a cellular level, one wraps you up in plastic then stabs you in the heart, and the last one never wanted to kill you :). Oao can be life threatening (oanyi) or minor (oasta).","pakala, pakala lili":"from a nakigoo covers unintentionality at its core. from a Freudian slip to finding a itako covers unintentionality at its core. from a Freudian slip to finding a nakigoo covers unintentionality at its core. from a Freudian slip to finding a itako covers unintentionality at its core. from a Freudian slip to finding a $20 bill on the ground to a DNA mutation causing nearly unbreakable bones - itako covers all your needs for unintentional. Itako can conceptually cover some of the scope of yawanq (the inverse of yawa) but yawa is a curse and itako is not. Itakonq would be the proper word for the opposite of itako, referring to intentional acts or planned contingencies. You can use itako for mistakes, like 'itaksun' (my fault). You can use it for coincidences, bad (itakot) or good (itakóy), and even for serendipitous things, like an unintentional gift (kohaitakóyã or just kohaitakã).0 bill on the ground to a DNA mutation causing nearly unbreakable bones - nakigoo covers all your needs for unintentional. nakigoo can conceptually cover some of the scope of yawanq (the inverse of yawa) but yawa is a curse and nakigoo is not. nakigonq would be the proper word for the opposite of nakigoo, referring to intentional acts or planned contingencies. You can use nakigoo for mistakes, like 'nakigosun' (my fault). You can use it for coincidences, bad (nakigot) or good (nakigóy), and even for serendipitous things, like an unintentional gift (kohanakigóyã or just kohanakigoã). Nakigoo is a garibankana (formerly 'garibanganaan;' strange word), which means that it follows irregular inflection patterns. Since it ends in a double vowel (oo), the last 'o' only takes the particle, which is why nakigoo + -ã is nakigoã. For the connotation particles, it does not follow this rule, so negative form is nakigot and positive is nakigóy.0 bill on the ground to a DNA mutation causing nearly unbreakable bones - itako covers all your needs for unintentional. Itako can conceptually cover some of the scope of yawanq (the inverse of yawa) but yawa is a curse and itako is not. Itakonq would be the proper word for the opposite of itako, referring to intentional acts or planned contingencies. You can use itako for mistakes, like 'itaksun' (my fault). You can use it for coincidences, bad (itakot) or good (itakóy), and even for serendipitous things, like an unintentional gift (kohaitakóyã or just kohaitakã).0 bill on the ground to a DNA mutation causing nearly unbreakable bones - nakigoo covers all your needs for unintentional. nakigoo can conceptually cover some of the scope of yawanq (the inverse of yawa) but yawa is a curse and nakigoo is not. nakigonq would be the proper word for the opposite of nakigoo, referring to intentional acts or planned contingencies. You can use nakigoo for mistakes, like 'nakigosun' (my fault). You can use it for coincidences, bad (nakigot) or good (nakigóy), and even for serendipitous things, like an unintentional gift (kohanakigóyã or just kohanakigoã). Nakigoo is a garibankana (formerly 'garibanganaan;' strange word), which means that it follows irregular inflection patterns. Since it ends in a double vowel (oo), the last 'o' only takes the particle, which is why nakigoo + -ã is nakigoã. For the connotation particles, it does not follow this rule, so negative form is nakigot and positive is nakigóy. Also, in the nakigot form, it can become a modifier like nakigãt, not nakigotã - always nakigãt.0 bill on the ground to a DNA mutation causing nearly unbreakable bones - nakigoo covers all your needs for unintentional. nakigoo can conceptually cover some of the scope of yawanq (the inverse of yawa) but yawa is a curse and nakigoo is not. nakigonq would be the proper word for the opposite of nakigoo, referring to intentional acts or planned contingencies. You can use nakigoo for mistakes, like 'nakigosun' (my fault). You can use it for coincidences, bad (nakigot) or good (nakigóy), and even for serendipitous things, like an unintentional gift (kohanakigóyã or just kohanakigoã). You can also use it like this: 'iiryã ni nakigoã' (this is surprisingly good). Nakigoo is a garibankana (formerly 'garibanganaan;' strange word), which means that it follows irregular inflection patterns. Since it ends in a double vowel (oo), the last 'o' only takes the particle, which is why nakigoo + -ã is nakigoã. For the connotation particles, it does not follow this rule, so negative form is nakigot and positive is nakigóy. Also, in the nakigot form, it can become a modifier like nakigãt, not nakigotã - always nakigãt.","sitelen musi, musi":"mono's very soul refers to any creative undertaking. this could be artistry, composition, or songwriting. but its semantic space extends to metaphorical meanings too, such as calming or settling ('to structure' something can be thought of as 'calming' or 'organising' a person). it can also refer to a trigger (sensitive phrases, words, etc.), triggering, or initiating a situation, like 'monen harilen' (~creating (an opportunity for) a deal), 'monen montei' (~creating opportunity), or 'monen lilishahada' (~creating a conflict). you can also use it to refer to the makeup or contents of something - 'monteil no Sojium-Clorraed ni, yaad, sojium ẽ clorraed' (the makeup of sodium chloride is, well/so, sodium and chloride) or 'sa ni montei no samatal no hajiranyil no zhamu' (she is made from the essence of the greatest angel of God - quite romantic!).","pali suli, pali":"itsukoo means 'to send something outward from a source' in its root meaning. this could be a project, which is built from an origin (an idea), a plan, an enterprise, or it could be casting (like projecting an image), protruding (a bulge), or even estimating or predicting (annual projection). It could also be to attribute your feelings to someone else, which is psychological projection. It can also refer to your outward persona or how you express yourself socially or compose yourself to others. It can refer to staging (presenting something as X), both positively and negatively. It can refer to mathematical projection, like 'map a cube onto the paper.' itsukoo can also be sexual, referring to erections, boners, or the moments before penetration. it can refer to extrapolations, like 'we extrapolate that...' itsukoo can even be used in cast's other meanings - to cast in a mould (e.g., casting metals) or a movie's cast (the characters). It can refer to recording or calculating, to throw with force, or to 'cast' spells (itsuken mahoka - casting magic). it can refer to registration, like in terms of 'registering votes.' It can refer to directing your eyes or the direction of your eyes, like 'cast down one's eyes.' it can refer to the form or appearance of something, like someone's features or complexion. so a masculine girl's cast is, well, itsukoche (male appearance). It can also refer to a slight squint. it can also refer to allocation, like allocating roles or characters in a film's cast. it can also refer to medical casts used to treat broken bones or any sort of material that takes on a shape. Itsukoo is a garibankana. It does not follow normal inflection patterns in that for any non-vowel-initial particle, the 'o is not omitted. Itsukoo + sun is itsukosun but itsuko + en is itsuken.","nasin lawa":"hibikoo refers to court (in all the English senses) and cohort both, as well as cultures. It can refer to courts of laws, courtrooms, taking someone to court, or a group of people with shared characteristics, such as a demographic, for example. It can refer to being romantically involved with someone or intending to be romantically involved with someone. It can refer to 'attracting a mate' - this term can be used for both animals and humans. It can refer to designated play spaces, like a tennis court. It can also refer to court-martials. It can also refer to courting favours, publicity, or disasters. Hibikoo is a garibankana. Since it ends in the double vowel oo, it does not accept consonant-initial particles to go right after 'k' - i.e., hibikã, hibiku is fine, but hibiksun is not, it would be hibikosun.","jan pi pilin ike":"the root SHIFUMO embodies a central concept (like “perversion” or “deviation”) but can morph to fit different grammatical roles. for example, the same shifumo root can be a noun (“the shifum(n) of desire”), a verb (“to shifum(v) someone”), or an adjective (“an impulse-shifum(mod/prop)”). it captures can be playful, formal, taboo, humorous, or shocking, all at once, and its tone shifts depending on context. grammatical particles, like -t or -óy as well as nych, (y)ch, nyu, and (r)u all play a major role. it is a single conceptual unit that embodies sexual deviance, taboo, manipulation, humor, obsession, and moral shock, and can be used flexibly across any grammatical or stylistic context. Pornographic materials, like porn itself, is innately shifumo (perverted). You can call degenerates or sickos shifumo too but it is or can be a pretty heavy and loaded word. In its platonic or nonsexual meanings, it refers to antisocial people, such as psychopaths, sociopaths, and of the like. Other than this, it refers to having a really high libido, sex drive, or being generally horny. It can also refer to extreme content or taboo sexual actions, like incest. Lechers are also shifumo. The word is often used playfully though! But be careful.","tawa sike":"Azayasta is simply used for dragging, swinging, or tossing, but the root azaya is an extremely precise word. It refers to completely being helplessly overtaken by an omnipresent force that plays you like a mannequin, making you dance, or swinging you around as if the force were spinning a coat hangar on its digit. it can refer to trauma, loss of control, but also be used as one of the strongest metaphors in Tawa, like romantically (her voice made me dance in motions I thought I was never capable of) or philosophically (time helplessly swings me around). With grammatical particles, this root can be modified so much and used for so much.","toki open, toki sona":"tetoka is a garibankana, so it doesn't follow the usual inflection patterns. That means the verbal forms will be tetsuka (platonic) and tetyuka (romantic). For modifier forms: tetãka (modifier) or tetabu (property) are used. It refers to narration, storytelling, recounting, and remarking, when the actor speaks regarding himself. When tetoka identifies the relationship of the actor to patient, then it can mean interview, propose, or even passing (on) a message. like in 'soa subume sua tetsuka hvaison' (He wanted me to pass on his warning). Its interview meaning can be seen here: 'Tethuka komunilnin' ((I) was interviewed by the police). Use the emotional form (teqeka) for remembrance, like in 'teqeka wanoõ zhi au nigol' (remember that time when I had a cat?).","kama jo, wile":"nemu is about deciding, choosing, or selecting a thing. It can be to resolve (it's decided!), to judge (stop assuming what I like! / stop judging me!), to choose or pick (I choose freedom over security), to elect or designate (Gellar is the chosen one), to morally choose (choose kindness), to make a strategic, informed, or probabilistic decision (AI chooses the worst move / choose the safest route)","ijo nanpa":"this refers to the most basic, elementary, or primordial unit of anything. The fundamentals of goodness can be translated as \"shilu no iisumatã\" (satisfaction of a thing's nature / the primordial unit for goodness). Shí can also refer to stuff like plant seeds, sperm, and even the elements from the periodic table. like, metaphorically, you could call the noble gases or metals hajirashí (benevolent elements) or maybe hangararrashí (non-fighting-back elements / non-rebellious elements).","uta, uta lili":"harana can refer to the mouth, tongue, or kissing. in some contexts, it may be used to describe specific types of kissing, like french kisses, especially when in the romantic form. Haranango would be used for mouth and harananga for tongue."};

            function handleToggle(event, word, tokiPona) {
                event.stopPropagation();
                const btn = event.currentTarget;
                const container =
                    btn.closest(".entry") || btn.closest("#modal");
                const titleEl =
                    container.querySelector(".word-title") ||
                    container.querySelector(".static-title");

                const isToki = btn.classList.toggle("is-toki");
                titleEl.classList.add("is-shifting");

                setTimeout(() => {
                    btn.innerHTML = isToki
                        ? "<span>Toki Pona</span>"
                        : "<span>Tawa</span>";
                    titleEl.textContent = isToki ? tokiPona : word;

                    if (isToki) titleEl.classList.add("title-toki");
                    else titleEl.classList.remove("title-toki");

                    titleEl.classList.remove("is-shifting");
                }, 150);
            }

            const isCompound = (word) => word.trim().includes(" ");

            const compoundSort = (a, b) => {
                const aComp = isCompound(a.word);
                const bComp = isCompound(b.word);
                if (aComp && !bComp) return 1;
                if (!aComp && bComp) return -1;
                return a.word.localeCompare(b.word);
            };

            function searchDictionary(query) {
                const q = query.toLowerCase();
                if (!q) return [...DICTIONARY].sort(compoundSort);

                let results = DICTIONARY.filter((entry) => {
                    const wordMatch = entry.word.toLowerCase().includes(q);
                    const defMatch = entry.definitions.some((d) =>
                        d.text.toLowerCase().includes(q),
                    );
                    const ssMatch = SEMANTIC_SPACE[entry.id]
                        ?.toLowerCase()
                        .includes(q);
                    return wordMatch || defMatch || ssMatch;
                });

                return results.sort((a, b) => {
                    const wordA = a.word.toLowerCase();
                    const wordB = b.word.toLowerCase();

                    // Priority 1: Exact matches
                    if (wordA === q && wordB !== q) return -1;
                    if (wordB === q && wordA !== q) return 1;

                    // Priority 2: Starts with
                    if (wordA.startsWith(q) && !wordB.startsWith(q)) return -1;
                    if (wordB.startsWith(q) && !wordA.startsWith(q)) return 1;

                    return compoundSort(a, b);
                });
            }

            function renderResults(query = "") {
                const results = searchDictionary(query);
                document.getElementById("results").innerHTML = results
                    .map(
                        (entry) => `
    <div class="entry" onclick="openModal('${entry.word}')">
      <div class="lang-toggle" onclick="handleToggle(event, '${entry.word}', '${entry.id}')">
        <span>Tawa</span>
      </div>
      <div class="word-title">${entry.word}</div>
      <div class="def-preview">${entry.definitions.map((d) => d.text).join(", ")}</div>
    </div>
  `,
                    )
                    .join("");
            }

            function openModal(word) {
                const entry = DICTIONARY.find((e) => e.word === word);
                if (!entry) return;

                const defString = entry.definitions
                    .map((d) => d.text)
                    .join(", ");
                const ssText = SEMANTIC_SPACE[entry.id] || "";

                const modalContent = document.getElementById("modal-content");
                modalContent.innerHTML = `
    <div class="lang-toggle" onclick="handleToggle(event, '${entry.word}', '${entry.id}')">
      <span>Tawa</span>
    </div>
    <div class="static-title">${entry.word}</div>

    <div class="id-container">
      <span class="id-label">Toki Pona</span>
      <div class="static-id">${entry.id}</div>
    </div>

    <div class="static-defs-div">${defString}</div>
    <div class="modal-divider"></div>
    <div class="semantic-title">Semantic space</div>
    <div class="static-defs-div" style="color: var(--text-muted); font-size: 1.1rem;">${ssText}</div>
  `;

                const overlay = document.getElementById("modal-overlay");
                overlay.style.display = "block";
                void overlay.offsetWidth;
                overlay.classList.add("active");

                document.getElementById("modal").scrollTop = 0;
                document.body.style.overflow = "hidden";
            }

            function closeModal() {
                const overlay = document.getElementById("modal-overlay");
                overlay.classList.remove("active");
                document.body.style.overflow = "";
                setTimeout(() => {
                    overlay.style.display = "none";
                }, 400);
            }

            document
                .getElementById("search")
                .addEventListener("input", (e) =>
                    renderResults(e.target.value),
                );

            // Initial load
            renderResults();
        </script>
    </body>
</html>
