        <script>

            const DICTIONARY = [{"word":"agona","id":"toki ante","definitions":[{"text":"dialect","frequency":100}]},{"word":"arenko","id":"rest-1","definitions":[{"text":"rest of","frequency":100},{"text":"others","frequency":100},{"text":"different","frequency":100}]},{"word":"bopu","id":"mama telo","definitions":[{"text":"boob","frequency":100},{"text":"breast","frequency":100},{"text":"tit","frequency":100},{"text":"lactate","frequency":100},{"text":"milk (producing) organ","frequency":100}]},{"word":"epiku","id":"epiku","definitions":[{"text":"epic","frequency":100},{"text":"amazing","frequency":100},{"text":"damn","frequency":100}]},{"word":"gana","id":"toki, toki ante","definitions":[{"text":"language","frequency":100},{"text":"way of speaking","frequency":100},{"text":"linguistics","frequency":100},{"text":"grammar","frequency":100}]},{"word":"hyongu","id":"seme","definitions":[{"text":"question","frequency":100},{"text":"interrogation","frequency":100},{"text":"interrogative","frequency":100}]},{"word":"keko","id":"cake-1","definitions":[{"text":"cake","frequency":100}]},{"word":"kusu","id":"curse-1","definitions":[{"text":"pussy","frequency":100},{"text":"cunt","frequency":100},{"text":"fuck","frequency":100},{"text":"bitch","frequency":100}]},{"word":"kwosu","id":"cross-1","definitions":[{"text":"cross","frequency":100},{"text":"Christian cross","frequency":100}]},{"word":"maraca","id":"unpa e mi, musi e sijelo mi","definitions":[{"text":"please (X)","frequency":100},{"text":"engage in sensual pleasure","frequency":100},{"text":"sensory enjoyment","frequency":100},{"text":"soothe","frequency":100},{"text":"make (feel) warm","frequency":100},{"text":"ecstatic","frequency":100},{"text":"orgasmic","frequency":100}]},{"word":"mazetoven","id":"congrats-1","definitions":[{"text":"congratulations","frequency":100},{"text":"good luck","frequency":100},{"text":"well done","frequency":100},{"text":"beautifully executed","frequency":100}]},{"word":"mimi","id":"mama, mama meli","definitions":[{"text":"mother","frequency":100}]},{"word":"muzumu","id":"museum.loan-1","definitions":[{"text":"museum","frequency":100}]},{"word":"sorama","id":"sewi telo","definitions":[{"text":"precipitation","frequency":100},{"text":"rain","frequency":100}]},{"word":"tara","id":"pakala e telo, kama tan poki","definitions":[{"text":"spill","frequency":100},{"text":"overflow","frequency":100},{"text":"leak","frequency":100},{"text":"flaw in boundary","frequency":100},{"text":"vent","frequency":100},{"text":"grumble","frequency":100},{"text":"genuine","frequency":100},{"text":"cannot help (X)","frequency":100},{"text":"(let) slip","frequency":100}]},{"word":"tomoe","id":"fox-1","definitions":[{"text":"fox","frequency":100},{"text":"clever","frequency":100},{"text":"intelligent","frequency":100},{"text":"wisdom","frequency":100},{"text":"deceit","frequency":100},{"text":"long life","frequency":100},{"text":"handsome","frequency":100},{"text":"trustworthy","frequency":100},{"text":"reliable","frequency":100},{"text":"façade","frequency":100},{"text":"silently","frequency":100},{"text":"stealthily","frequency":100}]},{"word":"yige","id":"mijomi","definitions":[{"text":"gay","frequency":100},{"text":"homosexual","frequency":100},{"text":"not straight","frequency":100},{"text":"lesbian","frequency":100}]},{"word":"yoe","id":"excl-1","definitions":[{"text":"good god","frequency":100},{"text":"jesus","frequency":100},{"text":"good grief","frequency":100},{"text":"jeez","frequency":100},{"text":"dang","frequency":100}]},{"word":"yookai","id":"spirit-1","definitions":[{"text":"spirit","frequency":100},{"text":"essential being","frequency":100}]},{"word":"zhamu","id":"sewi, jan sewi","definitions":[{"text":"God","frequency":100},{"text":"deity","frequency":100}]}];

            const SEMANTIC_SPACE = {"mijomi":"it refers to anyone that is not heterosexual at its core. commonly used for gay / lesbian etc.","unpa e mi, musi e sijelo mi":"borrowed directly from Gyakyyi, which loaned it from older Takan languages. The word's origin was in Kawakanamagana, which loaned it from Greek, in which it meant to masturbate. Maraca in Modern Tawa simply refers to any act of pleasure or pleasing something or oneself. It could be physical, sensory pleasure, such as warm baths, or it could be emotional pleasure, derived through touch or song. When made romantic, as in maracanyu, it carries a sexual connotation. Since it is not mandatory for maraca to carry -(r)u or -nyu, often times, the context disambiguates if maraca is being used romantically or platonically. Explicitly marking it romantic, though, as in maracanyu / maracat, makes it sexual too. When sexual, it is a pretty vulgar word, referring to sexual stimulation, masturbation, or fondling one's genitals (touching oneself). It can refer to orgasms too (~maracanyata) or ecstatic feelings (~maracata). In the lower forms, such as maracasta, it can refer to self-care or doing something to feel better. Like, 'Kamteikikitãsun ni o maracastanai' (~my favourite food soothed me a little). Maracat would be soothing with an ulterior motive and maracaoy would be soothing positively - esp. in the context of people-pleasing and as such. Do note that maracat can also be used for sexual pleasure, as in \"Kim Jong Uun ni maracanaitmas no komuni\" (Kim Jong Un is master of goon). (maracanait = masturbate, preferred form (as opposed to maracatnai)).","epiku":"refers to anything epic!","pakala e telo, kama tan poki":"it refers to anything from emotional slips (when you can't help but smile and it shows, as it is genuine, even though you don't want it to) to literal liquid spills, like in the idiomatic expression 'chisuno taranai' (my water has been spilled). It can imply agency in chisuna taranai (my water has been spilled (due to me)) or when paired with 'ni,' the focus could be on the state (of being spilled) itself. Tara can also refer to leaking something private, such as secrets, or flaws in boundaries. This 'flaw' can be literal (a bottle with a little hole) or more abstract (a relationship without proper privacy). Note: tara is not in the core lexicon because this can technically be boiled down to a core word.","mama telo":"bopu is a word used to describe anything short of a breast. as a verb, it can refer to lactation, and as a noun, it refers to any milk-producing organ in a living thing, including udders and tits. It's not inherently a vulgar word but it can be if used casually or randomly. It also describes bouncy, breast-like, or saggy things (daminq bopu) depending on context, though this essentially like saying 'that looks like a saggy breast' - probably not something you'd use in normal daily conversation, unless you want to be called a shifumo.","sewi telo":"Sorama is a newer term, as opposed to Sorachi. Soramaru would be to rain, whereas formally or poetically it is 'sorala chiru' (the sky waters). These are the other -ma weathers: reretema (hail), retema (cold weather), nashitama (heatwaves, hot weather), kiukoma (windy, turbulent), bakama (tornado), chimama (tsunami), sowma (sunny), meiyama (cloudy), reteshima (snowy), damima (mild, clear, temperate), kamama (low visibility, dark, foggy), mamama (stormy), tahetema (thunderstorm), pokichima (typhoon/hurricane), rereteshima (blizzard), sosowma (drought), reretemama (severe, intense, big hail). Do note that each can further derive even more roots with derivational particles: tahetemaoy (nice thunderstorm), tahetemat (unpleasant thunderstorm), mamamata (happy storm / a storm of happy emotion), etc. And, of course, you would use soramangu for \"weather\" itself.","toki, toki ante":"Gana refers to language. Ganairime would be linguistics, Ganaumashí could be sociolinguistics, Ganashí would be a phoneme. Ganangutsu is... well, a mystery. So depending on context, ganangutsu would refer to a specific theory of the root of language. Ganasumatà would be the essence of language - a unique human method of communication via thoughts and symbols. And so on. Gana comes from the Kawakanamagana word for 'language.' In many contexts, gana can also refer to grammar (like gana ribu - grammar book), though you can use 'ganatachi' or ganatachitei for grammar.","toki ante":"loaned from the Takan languages, agona refers to a dialect. It is a different way of speaking. Agonanya would be a gynolect (female genderlect) and agonanye would be androlect (male genderlect). The derivation is similar, so you can derive many technical concepts with this.","sewi, jan sewi":"General filler word. It doesn't refer to God Himself but, rather, any deity that is like God. It's a tame, mild word. Zhamu is also used in poetic constructions, such as 'janà no zhamunya' (goddess from heaven (romantic)). It's also used in the formal greeting 'are zhamua barekunai zuõ' (may God bless you, where 'are' marks the wish / hope (may - optative)). The word 'gopo' is rarely used as a replacement by speakers that have trouble pronouncing zhamu.","seme":"either hya or hyo can be paired with -ngu to mean interrogative. When turned into a verb, like hyungu, then it means to question.","pan, pan laso, pan loje":"Used for all bread-related roots. Jireipan refers to naan, napipan refers to baguettes, etc. One irregular term is 'napii-samipan,' literally meaning 'long fish bread,' but it refers to croissants.","mama, mama meli":"Used for \"mother.\" Can modify other nouns like mimii mama (Mother nature).","excl-1":"an exclamation. It expresses surprise or shock, like \"Yoe! Yoete zu ni bobo?!\" Yoete is the connective form, marking the following clause with surprise. 'zu ni so no ng i, wou yoe?!' (you're him, (oh my god)!).","curse-1":"loaned from 'qus,' it is an extremely vulgar curse. Even using it with friends would be highly inappropriate.","museum.loan-1":"Museum, loaned from English.","cake-1":"loanword.","rest-1":"Used for 'rest of' or 'others.' Like 'arenki hon' means 'the rest of the people / the remaining people / the other people.' It is a casual contraction of arenekui.","cross-1":"refers to the Christian cross (usually). Otherwise, can refer to cross-like objects.","fox-1":"Tomoe refers to foxes. They are intelligent, sometimes sly and cunning, animals that live long lives. It is a garibankana, so the 'e' ending is swapped for the appropriate affix. In the noun and accusative form, it is tomōe, in the modifier form, it is tomoi, and as an adverb modifier it is tomoinu. Someone who is like a tomoe is likely healthy but also clever. Tomota would be negative (deceitful), tomooi refers to a positive connotation, so an intelligent, handsome, or healthy individual. Tomota can also describe façades - beautiful from the outside, but a different story inside; e.g., 'irimeson ni watada tomotare ue' (his work is merely a façade (facade) inside / all fluff no substance / deceitful). Tomotare is usually used for façade. Tomooire refers to the opposite - a non-façade, if you will, something that is how it looks. If it's beautiful outside, it's healthy inside. So a delicious pizza might be tomooire. But... you probably wouldn't use this for pizza. You'd use it like: 'rra, reoeanate tomooire woui newōe!' (no, we will be going to a store that gives exactly what it promises / will be going to a store that is reliable / will be going to a trustworthy store). To describe a spiritually healthy person: \"nukore ga tomooii ue\" (his inner heart is still like a fox (spiritually well)). For physical unwellness, you'd make other comparisons: \"hyakoson ga mahwai ue\" (his clothes are unwell / he is not hygienic). Someone who is echitomota (post-fox) is a wise / elder fox, as he has learnt. A tomota (deceitful/immature fox) is immature / unwise as a person. It can also show stealth: \"so a tomoinu hateru usehon do\" (he stealthily ran through the group of people). A direct antonym to the tomoe would be angtomoe (foxless / fox-spiritless). It refers to someone who may have studied everything on a textbook but still gets fooled by a simple scam. To put one into a façade / trick someone is tomotajeru. A tomōho (lit. \"fox-spoon\" but refers to the tail of the fox) is the most sensitive or revealling feature of the person, like a flaw in a flawless façade or a slip of the tongue. \"Niru tomōhōe\" (I see your fox's tail) means 'I know exactly what you are trying to do, and it won't fly!').","spirit-1":"Yōkai refers to spirits and 'beings of the essence,' but it is more of a conversational term, as Tawish culture only recognises God at the top with no one else like Him. It is also used metaphorically to mean 'spirit' as in alcohol or liquids that evapourate fast. It can refer to good odours and ointments as yodaekai (formal spirit). It is a garibankana, so all affixes are inserted into the double oo slot (yOOkai). So yōkai + ta = yotakai; yōkai + oi = yooikai, etc.","congrats-1":"Loaned from \"Mazeltov / Mazel tov,\" the Jewish expression. Mazetoven is used to express 'well done! / greatly executed! / that's amazing!' so after the end of a good prank call, you'd exclaimed 'mazetoven a!' or 'mazetoven!'"};

            function handleToggle(event, word, tokiPona) {
                event.stopPropagation();
                const btn = event.currentTarget;
                const container =
                    btn.closest(".entry") || btn.closest("#modal");
                const titleEl =
                    container.querySelector(".word-title") ||
                    container.querySelector(".static-title");

                const isToki = btn.classList.toggle("is-toki");
                titleEl.classList.add("is-shifting");

                setTimeout(() => {
                    btn.innerHTML = isToki
                        ? "<span>Toki Pona</span>"
                        : "<span>Tawa</span>";
                    titleEl.textContent = isToki ? tokiPona : word;

                    if (isToki) titleEl.classList.add("title-toki");
                    else titleEl.classList.remove("title-toki");

                    titleEl.classList.remove("is-shifting");
                }, 150);
            }

            const isCompound = (word) => word.trim().includes(" ");

            const compoundSort = (a, b) => {
                const aComp = isCompound(a.word);
                const bComp = isCompound(b.word);
                if (aComp && !bComp) return 1;
                if (!aComp && bComp) return -1;
                return a.word.localeCompare(b.word);
            };

            function searchDictionary(query) {
                const q = query.toLowerCase();
                if (!q) return [...DICTIONARY].sort(compoundSort);

                let results = DICTIONARY.filter((entry) => {
                    const wordMatch = entry.word.toLowerCase().includes(q);
                    const defMatch = entry.definitions.some((d) =>
                        d.text.toLowerCase().includes(q),
                    );
                    const ssMatch = SEMANTIC_SPACE[entry.id]
                        ?.toLowerCase()
                        .includes(q);
                    return wordMatch || defMatch || ssMatch;
                });

                return results.sort((a, b) => {
                    const wordA = a.word.toLowerCase();
                    const wordB = b.word.toLowerCase();

                    // Priority 1: Exact matches
                    if (wordA === q && wordB !== q) return -1;
                    if (wordB === q && wordA !== q) return 1;

                    // Priority 2: Starts with
                    if (wordA.startsWith(q) && !wordB.startsWith(q)) return -1;
                    if (wordB.startsWith(q) && !wordA.startsWith(q)) return 1;

                    return compoundSort(a, b);
                });
            }

            function renderResults(query = "") {
                const results = searchDictionary(query);
                document.getElementById("results").innerHTML = results
                    .map(
                        (entry) => `
    <div class="entry" onclick="openModal('${entry.word}')">
      <div class="lang-toggle" onclick="handleToggle(event, '${entry.word}', '${entry.id}')">
        <span>Tawa</span>
      </div>
      <div class="word-title">${entry.word}</div>
      <div class="def-preview">${entry.definitions.map((d) => d.text).join(", ")}</div>
    </div>
  `,
                    )
                    .join("");
            }

            function openModal(word) {
                const entry = DICTIONARY.find((e) => e.word === word);
                if (!entry) return;

                const defString = entry.definitions
                    .map((d) => d.text)
                    .join(", ");
                const ssText = SEMANTIC_SPACE[entry.id] || "";

                const modalContent = document.getElementById("modal-content");
                modalContent.innerHTML = `
    <div class="lang-toggle" onclick="handleToggle(event, '${entry.word}', '${entry.id}')">
      <span>Tawa</span>
    </div>
    <div class="static-title">${entry.word}</div>

    <div class="id-container">
      <span class="id-label">Toki Pona</span>
      <div class="static-id">${entry.id}</div>
    </div>

    <div class="static-defs-div">${defString}</div>
    <div class="modal-divider"></div>
    <div class="semantic-title">Semantic space</div>
    <div class="static-defs-div" style="color: var(--text-muted); font-size: 1.1rem;">${ssText}</div>
  `;

                const overlay = document.getElementById("modal-overlay");
                overlay.style.display = "block";
                void overlay.offsetWidth;
                overlay.classList.add("active");

                document.getElementById("modal").scrollTop = 0;
                document.body.style.overflow = "hidden";
            }

            function closeModal() {
                const overlay = document.getElementById("modal-overlay");
                overlay.classList.remove("active");
                document.body.style.overflow = "";
                setTimeout(() => {
                    overlay.style.display = "none";
                }, 400);
            }

            document
                .getElementById("search")
                .addEventListener("input", (e) =>
                    renderResults(e.target.value),
                );

            // Initial load
            renderResults();
        </script>
    </body>
</html>
