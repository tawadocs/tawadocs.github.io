* is a desiderative, but its purpose goes beyond simple desire\n* It marks a deep, emotional longing for something specifically\n* See the difference between a non-desiderative and a desiderative sentence:\n\t* *su ni niruatai foshsun* -> `1SG TOP see.V.PLAT-DES friend.1SG.POSS`\n\t\t* \"I miss my friend\"\n\t* *su ni niru foshsun* -> `1SG TOP see.V.PLAT friend.1SG.POSS`\n\t\t* \"I see my friend\"\n\n### 8.3.5 Interrogatives\n* *hya* and *hyo* are both used for interrogatives\n* *hya* is used for open-ended questions, whereas *hyo* is used for simple polar questions\n* But both have collapsed into a general interrogative particle *hya*\n* *hyo* may still be used if it is necessary to mark the non-polarity of the question (like asking someone if they're feeling good with a *hyo* in order to show that they need to explain why or why not, though these types of constructions are rare!)\n* Examples:\n\t* *ryo ni fuyu hyo?* -> `this TOP what OPEN.Q`\n\t\t* \"What is this? (demanding an answer beyond simple negation or affirmation, or picking from a list)\"\n\t\t\t* lit. \"As for this, (it is) what?\"\n\t* *zua iitei hya?* -> `2SG-AGT good Q`\n\t\t* \"Are you good? (demanding affirmation or negation)\"\n\n### 8.3.6 Optative\n* *are* is used for marking optatives\n* Examples:\n\t* *are sua au asa* -> `OPT 1SG-AGT HAVE.V.PLAT house`\n\t\t* \"(I) wish that I had a home\"\n\t* *so are sua kamtthu samil* -> `3SG.M OPT 1SG-AGT eat.PFV.V.PLAT fish-DEF`\n\t\t* \"He wished that I ate the fish\"\n\n### 8.3.7 Requests\n* *sai* is used for highly intimate request in an affectionate way\n* *fuka* is more detached than *sai*\n* It's used for simple, but very polite, requests\n* It's used for strangers or when you want to request for something, but not in an intimate or affectionate way\n* Examples:\n\t* *a kamu suyét sai* -> `AGT eat.V.PLAT 1SG-BEN AFFEC.REQ`\n\t\t* \"(Will you) eat for me, please\"\n\t* *a mha kamu fuka* -> `AGT PRF eat.V.PLAT REQ`\n\t\t* \"Eat already, please!\"\n\n### 8.3.8 Affectionate ending\n* *ana* is used to end a statement or anything affectionately\n* Examples:\n\t* *su ni kita zuǫ ana* -> `1SG TOP like 2SG-OBJ AFFEC`\n\t\t* \"I like you, you know?\"\n\t\t* \"I like you, okay?\"\n\n### 8.3.9 Assertion\n* To assert or emphasise something, *ya* is used:\n\t* *su ni kita zuõ ya′ana* -> `1SG TOP like 2SG-ACC ASSERT-AFFEC`\n\t\t* \"I like you, make no mistake, okay?\"\n* It would also be used in a sentence like \"you were fun, really fun...\"\n","9 Clauses.md":"## 9.1 Particle table\n| Particle | IPA   | Gloss       |\n| -------- | ----- | ----------- |\n| eu       | `eu`  | REL.COP     |\n| me       | `me`  | REL         |\n| ę        | `ẽ`  | and         |\n| nwa      | `nʷa` | but         |\n| ato      | `ato` | or          |\n| mo       | `mo`  | then / than |\n| imo      | `imo` | SIM         |\n\n## 9.2 Relative clauses\n* *me* and *eu* are used for relative clauses\n* *eu* is used when describing a stative or equative, but *me* is used when describing an identity\n* Example:\n\t* *honĉalme nirutthu honĉalme samila kamu hon* -> `person-F.PLAT-DEF-REL see.V.PLAT-PFV.V.PLAT person-F.PLAT-DEF-REL fish-DEF-AGT eat.V.PLAT person`\n\t\t* \"The girl that saw the girl that saw the fish eat a person\"\n\t* *honĉaleu korrumasnigą* -> `person-F.PLAT-REL.COP kill.V.PLAT-AG-cat.MOD`\n\t\t* \"The girl that is a cat killer\"\n* *me* can also be used to relativise:\n\t* *tanílme haterén sallanh euhi sa ni iinqą, iinqą korrumas* -> `reason-DEF-REL run.NMLZ 3SG.F-ABL REL.COP-BACK 3SG.F TOP bad-MOD bad-MOD kill.V.PLAT-AG`\n\t\t* ~\"The reason we are running away from her is that she is a bad, bad murderer\"\n\n## 9.3 Connecting clauses\n* Clauses may be connected with *so*, *ato*, *nwa*, or *ę*\n* *ę* is a simple additive, much like \"and\", but if used in the context of a verb, the overt object are not attached to the verb\n* *ę* also marks simultaneity, unlike *nwa*\n* *nwa* is like an additive, but it also flips polarity\n* *ato* is used for linking alternatives, just like *or*\n* *mo* is a connective particle; as *monh*, it denotes contrastiveness, but, as *mo*, it can denote either sequentiality (like *then* or *so* in English) or comparativeness (like *than* in English)\n* Examples:\n\t* *sua kikita samiǫ ę tsàma* -> `1SG-AGT love fish-ACC and soup`\n\t\t* \"I love fish and soup\"\n\t* *sua kikita samiǫ nwa tsàma* -> `1SG-AGT love fish-ACC but soup`\n\t\t* \"I love fish but not soup\"\n\t* *sua korru sa ato so hya?* -> `1SG-AGT kill.V.PLAT 3SG.F or 3SG.M Q`\n\t\t* \"Should I kill her or him?\"\n\t* *mo mo, sua kamu samil* -> `then then 1SG-AGT eat.V.PLAT fish-DEF`\n\t\t* \"But, I'm eating fish\"\n\t* *sua kamu samil, mo zua fofu 'ke kiwinq'* -> `1SG-AGT eat.V.PLAT fish-DEF then 2SG-AGT speak.V.PLAT 'IMP stop'`\n\t\t* \"I was eating fish until you said: 'stop'\"\n\t* *sua kamu tsàma mo hateronq asazunlla* -> `1SG-AGT eat.V.PLAT soup then walk house-2SG.POSS-ALL`\n\t\t* \"I will have some soup and then walk to your house\"\n\t* *samil ni iepoki mo samilén* -> `fish-DEF TOP AUG-big than fish-INDEF`\n\t\t* \"This fish is bigger than the other fishes\"\n* The semantically inversed form *monh* [mon̼] of *mo* (from *mo* + *-(nh)*) is used like \"because\" in English\n* Examples:\n\t* *a kitasta atoralós monh iekita eauca imo karabal* -> `AGT like-DIM.SUP apple-INDEF.PL because AUG-like fruit SIM creamfruit-DEF`\n\t\t* \"I barely like apples because I prefer fruits like the creamfruits (bananas, mangoes, strawberries, and kiwis)\"\n\n## 9.4 Similatives\n* Use *imo* in the sense of \"for example,\" \"such as,\" or \"like\"\n\t* *zua nasų kamu canúnh imo wano* -> `2SG-AGT can.VLNK eat.V.PLAT chain-ABESS SIM time`\n\t\t* \"You can eat without (a) chain, like time\"\n\t\t* ~\"You can eat freely without any restrictions, like time\"\n* You can stack grammatical particles on *imo* to yield other particles:\n\t* *imssta* -> attenuative (`ATT`)\n\t\t* *su ni imssta zu* -> `1SG TOP ATT 2SG`\n\t\t\t* \"I'm barely like you\"\n\t* *imonh* -> dissimilative (`unlike`)\n\t\t* *zua imonh karaba monh a toinqą* -> `2SG-AGT unlike creamfruit because AGT bitter-MOD`\n\t\t\t* \"You aren't like creamfruits, because you are (quite) bitter\"\n\t* *im* -> inequative (`INEQ`)\n\t\t* *sua im zu* -> `1SG-AGT INEQ 2SG`\n\t\t\t* \"I'm absolutely nothing like you\"\n\t* *imnyi* -> equative (`EQ`)\n\t\t* *su ni imnyi karabalú - óltoi!* -> `1SG TOP EQ creamfruit-DEF.PL EXCESS-sweet`\n\t\t\t* \"I'm a creamfruit - way too sweet!\"\n* The *imimo* form implies 'just like,' just one notch below equation\n\t* yes, it can mean equation, but its usually not interpreted that way, as you have *imnyi* for that\n","10 Vocatives.md":"## 10.1 Usage\n| Particle | IPA   | Gloss |\n| -------- | ----- | ----- |\n| ta       | `ta`  | VOC   |\n| iku      | `iku` | PERS  |\n* *ta* is a vocative\n* It's like *oi*, *hey*, or *ey* in English\n\t* e.g., *ta! fuen ni fuyu no?* -> \"oy! what are you doing?\"\n* *iku* is similar to a vocative, but simply marks a referent as a human or person\n* *iku* always attaches as a complement to the complex mentioning the person\n* Examples:\n\t* *ta Émíli'iku! zua au kamtteil hya?* -> `VOC emily-PERS 2SG-AGT HAVE.V.PLAT eat.PROD-DEF Q`\n\t\t* \"Hey, Emily! Do you have the food?\"\n\t* *sua kikita Lusi'ikuǫ* -> `1SG-AGT SUPR.like lucy-PERS-ACC`\n\t\t* \"I love Lucy\"\n","11 Polarity.md":"## 11.1 Affirmation and negation\n| Particle | IPA  | Function             |\n| -------- | ---- | -------------------- |\n| rri      | `ɾi` | Used for affirmation |\n| rra      | `ɾa` | Used for negation    |\n* Both are suffixes but can be used in discourse as free particles\n* Examples:\n\t* *sua kamurra* -> `1SG-AGT eat.V.PLAT-NEG`\n\t\t* \"I did not eat\"\n\t* *sa′a korrurra sǫ* -> `3SG.F-AGT kill.V.PLAT-NEG 3SG.M.ACC`\n\t\t* \"She did not kill him\"\n\t* *rra, zu ni hakunqfofmmasyĉ* -> `NEG 2SG TOP falsehood-speak.AG-MOD-N.PLAT`\n\t\t* \"No, you're just another liar\"\n","12 Demonstratives.md":"## 12.1 Usage of demonstratives\n| Gloss    | Type     | Demonstrative | IPA   | Function                                                    |\n| -------- | -------- | ------------- | ----- | ----------------------------------------------------------- |\n| DEM.PROX | Proximal | byo           | `bʲo` | For something near the speaker                              |\n| DEM.MED  | Medial   | ryo           | `ɺʲu` | For something far from the speaker or close to the listener |\n| DEM.DIST | Distal   | lyo           | `ʎo`  | For something far from both the speaker and listener        |\n* These demonstratives above are in their base forms\n* They are often not used in their base forms and are used in their modifier forms:\n\t* *ryą*, *byą*, and *lyą*\n* Here's how to decide when and when not to use the modifier form:\n\t* use it:\n\t\t* if the demonstrative, as a thing or event, needs to be equated with something\n\t* don't use it:\n\t\t* if the demonstrative is marking general position\n* Some examples to help you understand:\n\t* *asaryą* -> `house-this.PROX.MOD`\n\t\t* \"**This** house\"\n\t* *ryo ni asaĉ* -> `this.PROX TOP house-N.PLAT`\n\t\t* \"**This is** a house\"\n* Simply:\n\t* *ryo* -> **there/this** in English\n\t* *byo* -> **here** in English\n\t* *lyo* -> **that/(over) there** in English\n\n## 12.2 Deixis\n* The same demonstratives can be used for temporal or spatial reference\n* Just use *ji* for spatial reference and *zhi* for temporal reference\n\t* **SPATIAL**:\n\t\t* *ryãji* -> there\n\t\t* *byãji* -> here (close to listener)\n\t\t* *lyãji* -> that over there (far from speaker and listener)\n\t* **TEMPORAL**:\n\t\t* *ryãzhi* -> then / back then / that time\n\t\t* *byãzhi* -> now / this time\n\t\t* *lyãzhi* -> long ago\n\n## 12.3 Degree\n* ryo, byo, and lyo can also be used for degree:\n\t* *iiryą hya?* -> `good-DEM.PROX.MOD Q`\n\t\t* \"(this) good?\"\n\t* *iibyą hya?* -> `good-DEM.MED.MOD Q`\n\t\t* \"(that) good?\"\n\t* *iilyą* -> `good-DEM.DIST.MOD Q`\n\t\t* \"(really that) good?\"\n* *lyą* is the most emphatic, with an added 'really' / 'super' nuance\n","13 Determiners.md":"## 13.1 Articles\n| Article | IPA     | Gloss    |\n| ------- | ------- | -------- |\n| l(à)   | `l(ə)`  | DEF      |\n| lén    | `lɛn`   | INDEF    |\n| lö(s)  | `lɔ(s)` | INDEF.PL |\n| lü     | `lʊ`    | DEF.PL   |\n* *l* and *lén* are definite and indefinite articles\n* The definite article has the following forms:\n\t* *-là*: consonant-final roots, no morpheme stacking\n\t\t* e.g., *hon* + *-l* -> *honlà* (the person)\n\t* *-íl*: only when multiple morphemes are used and it has to appear after a consonant\n\t\t* e.g., *kiuko* + *ii* + *nq* *l* -> *kiukiinqíl*\n\t* *-l*: regular form\n\t\t* e.g., *kiuko* + *ii* + *l* -> *kiukiil*\n\t\t* or *kiuko* + *l* -> *kiukol*\n* Examples:\n\t* *honléna niru su* -> `person-INDEF-AGT see.V.PLAT 1SG`\n\t\t* \"A person sees me\"\n\t* *sua kamu samilén* -> `1SG-AGT eat.V.PLAT fish-INDEF`\n\t\t* \"I eat any (kind of) fish\"\n\n### 13.1.1 Plurality\n* The plural articles serve two functions: mark definiteness and plurality, as there is no overt plural marker\n* If *lós* appears before another marker, then the *s* is omitted, unless the marker starts with *ó*\n* Examples:\n\t* *honlós* -> `person-INDEF.PL`\n\t\t* \"A / any people\"\n\t* *hateru honlólla* -> `run.V.PLAT person-INDEF.PL-ALL`\n\t\t* \"Run to a / any people / person\"\n\t* *samilú* -> `fish-DEF.PL`\n\t\t* \"The / those fishes\"\n\t* *samilós* -> `fish-INDEF.PL`\n\t\t* \"A / any fishes\"\n\n## 13.2 Determiners\n| Determiner | IPA   | Gloss |\n| ---------- | ----- | ----- |\n| myo        | `mʲo` | QNT   |\n| rra        | `ɾa`  | NEG   |\n* These are the base forms\n* They are often used in their modifier form with *-ą*, other than 'rra'\n* Examples:\n\t* *nigol* -> `cat-DEF`\n\t\t* \"the cat\"\n\t* *niglós* -> `cat-INDEF.PL`\n\t\t* \"cats\"\n\t* *nigorra* -> `cat-NEG.MOD`\n\t\t* no cat\n\t* *nigmyą* -> `cat-QNT.MOD`\n\t\t* many cats\n\t\t* *myo no niglú* is also fine for 'many of the cats'\n* To say *any* as in \"anything\" or \"anyone,\" use:\n\t* *fuyulos* -> anything\n\t\t* `what-INDEF.PL`\n\t* *talos* -> anyone\n\t\t* `PERS-INDEF.PL`\n\t* *jilos* -> anywhere\n\t\t* `LOC-INDEF.PL`\n\t* *zhilos* -> anytime / anyday\n\t\t* `TEMP-INDEF.PL`\n* To say *any* as in *any game*, just use:\n\t* *subeko*\n\t\t* e.g., *hahasubekã* -> all games\n\t\t* or *subeko no haha*\n\t\t* or *subekych hahaitahi*\n\t\t\t* note: *-hi* can be omitted but is usually used to show that *hahaitahi* is directly relational to *subekych* and nothing else\n\t\t\t* if there was a compatible verb in the sentence, it might be parsed with the verb, as cases normally are\n* For *some*, you have *-ita* or even *-myonq*:\n\t* *fuyuita* / *fuyumyãnq*... etc.\n\t* same for other particles\n","14 Relationals.md":"## 14.1 Temporal relationals\n| Relational | IPA     | Function                      | Gloss |\n| ---------- | ------- | ----------------------------- | ----- |\n| **mha**    | `m̥͡ma` | *Completed / already*         | PRF   |\n| **ha**     | `ha`    | *Incipient / about to happen* | INCP  |\n| **be**     | `be`    | *Imminent / soon*             | PROX  |\n| **ze**     | `ze`    | *Recurrent / repeated*        | ITER  |\n| **wari**   | `waɺi`  | *Frequent / a lot, often*     | HAB   |\n| **he**     | `he`    | *Recent / just occurred*      | RECP  |\n| **ho**     | `ho`    | *Delayed / not yet*           | REPL  |\n| **źi**    | `ʑi`    | *When / during*               | TEMP  |\n* They're free particles and usually go before or after the verb\n* You may also use *nihi (X)* where *(X)* is your temporal relational:\n\t* *sua kamu saún samiǫ nihi wari* -> `1SG-AGT eat.V.PLAT 3SG.F-COM fish-ACC TOP-BACK FREQ`\n\t\t* \"As for my eating fish with her, (it happens) a lot\"\n\t\t* ~\"I eat fish with her a lot\"\n* Examples:\n\t* *A ha kamu* -> `AGT INCP eat.V.PLAT`\n\t\t* \"(I am) about to eat\"\n\t* *A be kamu* -> `AGT IMM eat.V.PLAT`\n\t\t* \"(I will) eat soon\"\n\t* *A he kamu* -> `AGT JUS eat.V.PLAT`\n\t\t* \"(I) just ate\"\n\t* *A ho kamu* -> `AGT PEND eat.V.PLAT`\n\t\t* \"(I have) not yet eaten\"\n\t* *A mya kamu* -> `AGT PRF eat.V.PLAT`\n\t\t* \"(I have) already eaten\"\n\t* *A ze kamu* -> `AGT ITER eat.V.PLAT`\n\t\t* \"(I have) eaten again\"\n\t* *A ho jiteku* -> `AGT PEND pee.V.PLAT`\n\t\t* \"(I) have not yet peed\"\n\t* *A ze jiteku* -> `AGT ITER pee.V.PLAT`\n\t\t* \"(I) peed again\"\n\t* *Hona wari jiteku* -> `person-AGT FREQ pee.V.PLAT`\n\t\t* \"People pee a lot\"\n\t* *Hona wari fofu* -> `person-AGT FREQ speak.V.PLAT`\n\t\t* \"People often speak\"\n* Temporal relationals can be used in tandem with aspectual particles\n* Examples:\n\t* *sora′a wari ĉiiro* -> `sky-AGT FREQ water-PRSV`\n\t\t* \"It still keeps frequently raining\"\n\n### 14.1.1 Temporal contextual relational\n* This particle is used to introduce temporal context\n* It has these forms:\n\t* *ẑinyi* -> `TEMP-AUG.SUP`\n\t\t* \"after\"\n\t* *ẑista* -> `TEMP-DIM.SUP`\n\t\t* \"before\"\n\t* *ieẑi* -> `AUG-TEMP`\n\t\t* \"circa / near / around\"\n\t* *ienhẑi* -> `DIM-TEMP`\n\t\t* \"not near / not around\"\n\t* *ólẑi* -> `EXCESS-TEMP`\n\t\t* \"way later / much later / much after\"\n\t* *ólonhźi* -> `DEFIC-TEMP`\n\t\t* \"way before / much before\"\n* In NSKT:\n\t* *Byolyo* can be used to mean 'sometimes / here and there'\n\t* e.g.,\n\t\t* *byolyo naiwai, byolyo naiwaṋi*\n\t\t\t* 'sometimes, (we are) happy, and sometimes (we are) sad'\n\n## 14.2 Dynamic relationals\n| Relational | IPA  | Function                                     | Gloss |\n| ---------- | ---- | -------------------------------------------- | ----- |\n| ao         | `ao` | To possess, exist with, or have              | HAVE  |\n| ro         | `ɺo` | To cause, create, or make                    | CAUS  |\n| de         | `de` | To receive                                   | REC   |\n| fu         | `ɸu` | To make potential real or bring about change | ACT   |\n| ea         | `ea` | To move or go                                | MOV   |\n* When modifying verbs, their modal form, like *ru* or *eaų* will be used (as in *rų ralanq* (\"made to stay awake\"))\n\n### 14.2.1 Existential relational\n* The existential relational, *ao*, denotes 'existing with,' or in plain English, 'having'\n* In constructions like \"X has Y,\" the verbal form *au* is used\n\t* *sua au ĉi* -> `1SG-AGT HAVE.V.PLAT water`\n\t\t* \"I have water\"\n\t* *sua au sami* -> `1SG-AGT HAVE.V.PLAT fish`\n\t\t* \"I have fish\"\n\n### 14.2.2 Causation\n* Causation is marked by *ro*\n* *ro* covers the scope of *make*, *create* and *cause* in English\n* Its verbal form is *ru*\n* Examples:\n\t* *sua ru kamu* -> `1SG-AGT CAUS.V.PLAT food`\n\t\t* \"I make food\"\n\t* *Pól'ikua ruthu kortteisan* -> `paul-PERS-AGT CAUS.V.PLAT-PFV.V.PLAT kill.PROD-3SG.F.POSS`\n\t\t* \"Paul was the reason she died\" / \"Paul caused her death\"\n\n#### 14.2.2.1 Causal\n* Use *ronai* for something in causal terms\n* *ronai* means something like \"to be (made)\"\n* Format:\n\t* `SUBJ-a rųnai X(verb)` -> \"Subject is made to do X\"\n\t* `SUBJ-a ronai X(noun)` -> \"Subject is made to be X\"\n\t* `SUBJ TOP rųnai X(verb)` -> \"As for subject, it is made to do X\"\n\t* `SUBJ TOP ronai X(noun)` -> \"As for subject, it is X\"\n* Examples:\n\t* *sua rųnai kamu* -> `1SG-AGT CAUS.VLNK-IV eat`\n\t\t* \"I am made to eat\"\n\t* *sua ronai hakariĉ* -> `1SG-AGT CAUS-IV absurd-N.PLAT`\n\t\t* \"I am made a fool\"\n\n### 14.2.3 Receiving\n* *de* is the versatile marker used for giving-receiving relations\n* By default, it covers the scope of the English words *get*, *understand*, and *receive*\n* Use *deku* or *dekunh* for specifying if the \"getting\" is metaphorical (e.g., understanding) or literal (e.g., physically receiving)\n* Most of the times, *deku* or *dekunh* are not necessary; context is enough\n* Examples:\n\t* *sua de zuǫ* -> `1SG-AGT REC 2SG-ACC`\n\t\t* \"I get you\"\n\t* *sua dethu mirozun* -> `1SG-AGT REC-PFV.V.PLAT mirror-2SG.POSS`\n\t\t* \"I got your mirror\"\n\t* *sua dereu nayét sami* -> `1SG-AGT REC-IPFV.V.PLAT 1PL-BEN fish`\n\t\t* \"I will get fish for us\"\n* *denai* may be used to mean *give*:\n\t* *sua denaireu zulla asal* -> `1SG-AGT REC-IV-IPFV.V.PLAT 2SG-DAT house-DEF`\n\t\t* \"I will give you the house\"\n* *denh* (`REC-G.INV` but preferred gloss is `GET`) may be used to mean *get*:\n\t* *sua denhreu nayét asapopokiąl!* -> `1SG-AGT GET-IPFV.V.PLAT 1PL-BEN house-SUPR.big-MOD-DEF`\n\t\t* \"I will get us the biggest house!\"\n\n### 14.2.4 Realisation\n* The actualiser, *fu*, is used to denote making change real\n* It's like \"do\" in English\n* Examples:\n\t* *sua fureu irimesun* -> `1SG-AGT ACT-IPFV.V.PLAT work-1SG.POSS`\n\t\t* \"I will do my work\"\n\t* *sua futhu emonol* -> `1SG-AGT ACT-PFV.V.PLAT picture-DEF`\n\t\t* \"I finished the picture\"\n\t\t* \"I did the picture\"\n\t\t* \"I worked on the picture\"\n* Also, you can't use it in constructions like \"I finished my food\":\n\t* *sua futhu kamssun* -> `1SG-AGT ACT-PFV.V.PLAT food.1SG.POSS`\n\t\t* \"I did my food\"\n\t\t* \"I worked on my food\"\n* In that sentence, *fu* is unable to convey enough information to form a meaningful sentence\n* It can also add an 'actually' or 'even' nuance when used like this:\n\t* *fuppu, zu ni iinq* -> actually, you're bad\n\t* *zu ni iinq fuhi* -> you're bad, actually\n\t* *fu irimeru* -> actually (do) work\n\t* *soa fu shireru* -> even he knows / he does know\n\n### 14.2.5 Movement\n* *ea* simply marks movement\n* Examples:\n\t* *sua ea asalla* -> `1SG-AGT MOV house-ALL`\n\t\t* \"I go to the house\"\n\t* *sua roreome sa′a ea asasunlla* -> `1SG-AGT CAUS-IPFV.REL 3SG.F-AGT MOV house-1SG.POSS-ALL`\n\t\t* \"I will have her come over to my house\"\n\t\t* \"I will have her at my house\"\n* For the latter example, this alternative construction is also valid:\n\t* *sua aureu sa ea asasunlla* -> `1SG-AGT HAVE.V.PLAT-IPFV.V.PLAT 3SG MOV house-1SG.POSS-ALL`\n\t\t* \"I will have her come to my home\"\n","15 Discourse.md":"## 15.1 Discourse particles\n| Particle | IPA   | Gloss         |\n| -------- | ----- | ------------- |\n| yád     | `jæd` | so            |\n| mo       | `mo`  | then          |\n| ám      | `æm`  | INTERJ        |\n| áni     | `æɲi` | ST.TOP.ANAPH  |\n| áa      | `æa`  | ADV.AGT.ANAPH |\n* **NOTE:** depending on context, *mo* can mean \"than\" too; *mo mo* means \"but\"\n* Examples:\n\t* *yád, zua fofnnaito koronaisanita hya?* -> `so 2SG-AGT hear-PFV kill-IV-3SG.F.POSS-PRTV Q`\n\t\t* \"So, did you hear about her death?\"\n\t* *sua kamu mo kamu mo kamu ę mo... kamuthu ielénĉ* -> `1SG-AGT eat.V.PLAT then eat.V.PLAT then eat.V.PLAT and then eat.V.PLAT-PFV.V.PLAT AUG-INDEF-N.PLAT`\n\t\t* \"I ate then ate then ate and then... ate some more\"\n\t* *mo mo sua kitanyu zu* -> `but 1SG-AGT like-V.ROM 2SG`\n\t\t* \"But, I love you\"\n\t* *ám, sua fofuthu fuyu hyo..?* -> `INTERJ 1SG-AGT speak.V.PLAT-PFV.V.PLAT what OPEN.Q`\n\t\t* \"Um, what was I saying?\"\n\n## 15.2 Phrases\n* Some idiomatic expressions include:\n\t* *a de ĉisun aiko!* -> `AGT REC water-1SG.POSS IMP`\n\t\t* \"Take my water!\"\n\t\t* meaning: \"no way / hold up / wait\"\n\t\t* marks attention, a potential change in stance, and even disbelief\n\t* *yád, ĉisuno tara* -> `so water-1SG.POSS-AGT spill`\n\t\t* \"Well, my water has been spilled\"\n\t\t* meaning: \"I'm done / I give up\"\n\t\t* marks resignation or defeat\n\t* *mha kiwinq tetezun* -> `PRF stop hand-2SG.POSS`\n\t\t* \"Just stop your hand\"\n\t\t* meaning: \"wait a second / calm down\"\n\t\t* marks patience\n\t* *kamureu ĉizun* -> `eat.V.PLAT-IPFV.V.PLAT water-2SG.POSS`\n\t\t* \"Will drink your water\"\n\t\t* meaning: \"to trust someone / to be ready to do something with someone\"\n\t\t* marks trust and readiness\n\n## 15.3 Anaphoric discourse particles\n* *áa* is used for subject-oriented anaphoric constructions where new context is needed, and where there may be an adversative mood needed\n* *áni* is used for topic-oriented anaphoric constructions where new context has to be in a state equated with the original predicate\n* Examples (difference of *áa* vs. *áni*):\n\t* *sua kamuto. áa sorala ĉiru* -> `1SG-AGT eat-PFV ADV.AGT.ANAPH sky-DEF-AGT water-V.PLAT`\n\t\t* lit. \"I ate. I did so even though the sky waters\"\n\t\t* ~\"I ate even though it rained\"\n\t* *sua kamuto. áni sorala ĉiru* -> `1SG-AGT eat-PFV ST.TOP.ANAPH sky-DEF-AGT water-V.PLAT`\n\t\t* lit. \"I ate. I did so whilst it rained for me\"\n\t\t\t* this is in a literal sense\n\t\t\t* *\"it rained for me\"* here literally indicates that the speaker only experienced the rain and that the others did not\n\t\t* ~\"I ate as it rained, but only for me\"\n* A more relevant use of *áni* is illustrated in this short dialogue:\n\t* A: *yád honlúa haterén ę haterén iyukryąllanh, ę su ni watada oĉikathu ryojią...*\n\t\t* `so person-DEF.PL-AGT run.NMLZ and run.NMLZ sound.this.PROX.MOD-ABL and 1SG TOP only stand-PFV.V.PLAT this.PROX-LOC-MOD`\n\t\t\t* \"so the people ran and ran, away from this sound, and I just stood there...\"\n\t* B: *zua watada oĉikathu hya?!*\n\t\t* `2SG-AGT only stand-PFV.V.PLAT Q`\n\t\t\t* \"you just stood there?!\"\n\t* A: *áni iyukryąa iyukurra*\n\t\t* `ST.TOP.ANAPH sound.this.PROX.MOD-AGT sound.V.PLAT-NEG`\n\t\t\t* \"I did so whilst this sound did not play for me\"\n* An explanation of the dialogue:\n\t* *A* saw people running due to a sound, but he stood there\n\t* *B* asks him why\n\t* *A* explains that he never heard the sound\n","16 Modals and conditions.md":"## 16.1 Modals\n### 16.1.1 Base forms\n| Particle | IPA     | English equivalent        | Gloss  |\n| -------- | ------- | ------------------------- | ------ |\n| subo     | `subo`  | *want, desire*            | desire |\n| aniso    | `aɲiso` | *need, require, must*     | need   |\n| naso     | `naso`  | *can, be able to*         | can    |\n| ako      | `ako`   | *manage, succeed*         | manage |\n| mero     | `meɺo`  | *attempt, try*            | try    |\n| ŝire    | `ɕiɺe`  | *know how to, understand* | know   |\n\n### 16.1.2 Verb forms\n| Particle | IPA     | English equivalent                               | Gloss         |\n| -------- | ------- | ------------------------------------------------ | ------------- |\n| subu     | `subu`  | *want, desire*                                   | desire.V.PLAT |\n| anisu    | `aɲisu` | *need, require*                                  | need.V.PLAT   |\n| nasu     | `nasu`  | *let, allow, permit, see to it*                  | can.V.PLAT    |\n| aku      | `aku`   | *be able to, make something work, succeed, come* | manage.V.PLAT |\n| meru     | `meɺu`  | *give it a go, have a try*                       | try.V.PLAT    |\n| ŝire    | `ɕiɺe`  | *know, understand*                               | know          |\n* Examples:\n\t* *ri, sua subu ĉil* -> `AFF 1SG-AGT want.ACC water-DEF`\n\t\t* \"Yes, I want the water\"\n\t* *sua nasume sa′a kamu ĉiitalnan?* -> `1SG-AGT can.V.PLAT-REL 3SG.F-AGT eat.V.PLAT water-PRTV-DEF-1PL.POSS`\n\t\t* \"I'll let her have some of the water of ours\"\n\t* *sua merreu samizunlyą* -> `1SG-AGT try.IPFV.V.PLAT fish-2SG.POSS-that.DIST.MOD`\n\t\t* \"I'll try that fish of yours\"\n\t* *sua ŝire zuǫ hya?* -> `1SG-AGT know 2SG.ACC Q`\n\t\t* \"Do I know you?\"\n\t* *sua anisu zu* -> `1SG-AGT need.V.PLAT 2SG`\n\t\t* \"I need you\"\n\t* *sua subnyu sa* -> `1SG-AGT desire.V.ROM 3SG.F`\n\t\t* \"I want her\"\n\n### 16.1.3 Modal forms\n| Modal forms | Particle | IPA                       | Gloss       |\n| ----------- | -------- | ------------------------- | ----------- |\n| subų        | `subũ`  | *want, desire*            | desire.VLNK |\n| anisų       | `aɲisũ` | *need, require*           | need.VLNK   |\n| nasų        | `nasũ`  | *can, be able to*         | can.VLNK    |\n| akų         | `akũ`   | *manage, succeed*         | manage.VLNK |\n| merų        | `meɺũ`  | *attempt, try*            | try.VLNK    |\n| ŝireų      | `ɕiɺeũ` | *know how to, understand* | know-VLNK   |\n* Examples:\n\t* *sua ŝireų fu katsueąlénǫ* -> `1SG-AGT know-VLNK ACT structure-MOV.MOD-INDEF-ACC`\n\t\t* ~\"I know how to drive a car\"\n\t\t* ~\"I know my way around a car\"\n\n### 16.1.4 Object forms\n| Modal forms | Particle | IPA                                  | Gloss      |\n| ----------- | -------- | ------------------------------------ | ---------- |\n| subǫ        | `subõ`  | *desire, want*                       | desire.ACC |\n| anisǫ       | `aɲisõ` | *need, urge, requirement, necessity* | need.ACC   |\n| nasǫ        | `nasõ`  | *ability, permission, allowance*     | can.ACC    |\n| akǫ         | `akõ`   | *success, management*                | manage.ACC |\n| merǫ        | `meɺõ`  | *try, attempt, have a go*            | try.ACC    |\n| ŝireǫ      | `ɕiɺeõ` | *knowledge, understanding, wisdom*   | know-ACC   |\n\n### 16.1.5 Product forms\n| Modal forms | Particle  | IPA                                | Gloss       |\n| ----------- | --------- | ---------------------------------- | ----------- |\n| subttei     | `subtei`  | *dream, longing, desire*           | desire.PROD |\n| anisttei    | `aɲistei` | *necessity*                        | need.PROD   |\n| nasttei     | `nastei`  | *possibility, ability*             | can.PROD    |\n| akttei      | `aktei`   | *achievement, victory, fulfilment* | manage.PROD |\n| merotei     | `meɺotei` | *effort, attempt, venture, try*    | try-PROD    |\n| ŝiretei    | `ɕiɺetei` | *knowledge, wisdom*                | know-PROD   |\n\n### 16.1.6 Modal usage\n* Examples:\n\t* *rume honléna noyuku ii nihi subtteisun* -> `CAUS.V.PLAT-REL person-INDEF-AGT heart.V.PLAT good TOP-BACK desire.PROD-1SG.POSS`\n\t\t* \"Making someone feel good is my dream\"\n\n## 16.2 Conditionality\n| Particle | IPA     | Gloss      |\n| -------- | ------- | ---------- |\n| ŝi      | `ɕi`    | COND       |\n| į        | `ĩ`    | IRR.VLNK   |\n| iyu      | `iju`   | IRR.V.ROM  |\n| icu      | `ikʰu`  | IRR.V.PLAT |\n| mhu      | `m̥͡mu` | IRR.N.ROM  |\n| mho      | `m̥͡mo` | IRR.N.PLAT |\n| pén     | `pɛn`   | IRR.NMLZ   |\n* *mhu* and *mho* are rarely used, as they are often replaced by *pén* or their respective verbal forms *iyu* and *icu*\n\n### 16.2.1 Irreal modals\n| Particle | IPA      | English equivalent                     | Gloss             |\n| -------- | -------- | -------------------------------------- | ----------------- |\n| subį     | `subĩ`  | *should*                               | `desire.IRR.VLNK` |\n| aniŝį   | `aɲiɕĩ` | *should have, should need, would need* | `need.IRR.VLNK`   |\n| naŝį    | `naɕĩ`  | *could*                                | `can.IRR.VLNK`    |\n| akį      | `akĩ`   | *would be able to*                     | `manage.IRR.VLNK` |\n| merį     | `meɺĩ`  | *might*                                | `try.IRR.VLNK`    |\n| ŝireį   | `ɕiɺeĩ` | *would know how to, would understand*  | `know.IRR.VLNK`   |\n* Examples:\n\t* *sua subį kamu* -> `1SG-AGT desire.IRR.VLNK eat`\n\t\t* \"I should eat\"\n\t* *sua merį akų kamu samilsan* -> `1SG-AGT try.IRR.VLNK manage.VLNK eat.V.PLAT fish-DEF-3SG.F.POSS`\n\t\t* ~\"I could try to eat that fish she prepared\"\n\n### 16.2.2 Conditionality\n* Use *ŝi* for expressing conditionality\n* It's just like the English 'if'\n* Examples:\n\t* *sua kamiicu ŝi soa denhthu kamtteilnan!* -> `1SG-AGT eat.IRR.V.PLAT COND 3SG.M-AGT GET-PFV.V.PLAT eat.PROD-DEF-1PL.POSS`\n\t\t* \"I would eat if he got our food!\"\n\t* *yád, soa niriicu su ŝi a hatero soienín* -> `so 3SG.M-AGT see.IRR.V.PLAT 1SG COND AGT run 3SG.M-AUG-PER`\n\t\t* \"Well, he would see me if I run past him\"\n* It also adds context like this:\n\t* *ŝi yaralji, su ni yara ǫppu: wanílų korru zu* -> `COND coming-DEF-LOC 1SG TOP become ACC-INDEP one-DEF-VLNK kill.V.PLAT 2SG`\n\t\t* \"In the future, I will be the one to kill you\"\n\n### 16.2.3 Usage of other irreal particles\n* The *iyu* particle is just the romantic equivalent of *icu*\n\t* *sua kitaiyu sa ŝi sa′a kitapaiĉiiyu su* -> `1SG-AGT like-IRR.V.ROM 3SG.F COND 3SG.F-AGT like-RECP-PFV.IRR.V.ROM 1SG`\n\t\t* \"I would love her only if she had loved me back\"\n\n### 16.2.4 Temporally marked irreal markers\n* For temporally marked irreal markers, just prepend *ù-* before the aspect or temporal marking\n* So, \"I would have eaten\" would be something like:\n\t* *sua kamùthu* -> `1SG-AGT eat.IRR-PFV.V.PLAT`\n* Romantic or platonic markers would go last and *iyu* or *icu* wouldn't be used\n","17 Old case system.md":"## 17.1 Particle table\n| Particle | IPA     | Gloss     | NOTE                            |\n| -------- | ------- | --------- | ------------------------------- |\n| lla      | `lːa`   | DAT / ALL | -                               |\n| yé(t)   | `jɛ(t)` | BEN       | -                               |\n| ǫ        | `õ`    | ACC       | -                               |\n| ji       | `dʑi`   | LOC       | -                               |\n| po       | `po`    | FOR       | -                               |\n| bo       | `bo`    | -         | Irregular inversed form of *po* |\n| ita      | `ita`   | PRTV      | -                               |\n| un       | `ʊn`    | COM       | -                               |\n| nin      | `nɪn`   | PER       | -                               |\n\n## 17.2 Datives, allatives, and benefactives\n* Examples:\n\t* *a ke hatero asalla* -> `AGT IMP run house-ALL`\n\t\t* \"Run to the house\"\n\t* *a ke senodzu emonol kariĉasunlla* -> `AGT IMP send.V.PLAT picture-DEF MAKE-F.PLAT-1SG.POSS-DAT`\n\t\t* \"Send the picture to my mother\"\n\t* *a kamu suyét samil sai* -> `AGT eat.V.PLAT 1SG-BEN fish-DEF AFFEC.REQ`\n\t\t* \"Please eat the fish for me\"\n\t\t* lit. \"Please eat the fish for my benefit\"\n\n## 17.3 Ablatives, and malefactives\n* Examples:\n\t* *a ke hateru asallanh* -> `AGT IMP run.V.PLAT house-ABL`\n\t\t* \"Run (away) from the house\"\n\t* *a ke senodzu emonol kariĉasunllanh* -> `AGT IMP send.V.PLAT picture-DEF mother-1SG.POSS-ABL`\n\t\t* \"Send the picture away from my mother\"\n\t\t* ~\"Take away the picture from my mother\"\n\t* *a kamu suyenh sai* -> `AGT eat.V.PLAT 1SG-MAL AFFEC.REQ`\n\t\t* ~\"Please eat the fish to hurt me\"\n\t\t* lit. \"Please eat the fish for my detriment\"\n\n## 17.4 Accusatives\n* Used for **non-o-final roots**\n\t* *sua kita zuǫ* -> `1SG-AGT like 2SG-ACC`\n\t\t* \"I like you\"\n* **o-final roots** drop their **-o** and change to **-u**\n\t* *sua senodzu zulla emonol hya?* -> `1SG-AGT send.V.PLAT 2SG-DAT picture-DEF Q`\n\t\t* \"Should I send the picture to you?\"\n\n## 17.5 Locatives\n### 17.5.1 Simple location\n* Examples:\n\t* *su ni asaji* -> `1SG TOP house-LOC`\n\t\t* lit. \"(As for me), I am in house\"\n\t\t* ~\"I am at the house\"\n\t* *su ni asajinh* -> `1SG TOP house-OUT`\n\t\t* \"I am out of the house\"\n\n### 17.5.2 Approximative location\n* You may alter the degree of location with *ie*, *ieź*, or *öl*:\n\t* *ieji* -> near; *iejinh* -> not near / away\n\t* *jiji* -> right over; *jijinh* -> far away\n\t* *ólji* -> too close; *óljinh* -> too far\n* With *nyi* and *sta*:\n\t* *jinyi* -> above\n\t* *jista* -> below\n* Examples:\n\t* *ribul ni asalénieji* -> `book-DEF TOP house-NEAR`\n\t\t* \"The book is near a house\"\n\t* *ribul ni asaléniejinh* -> `book-DEF TOP house-AWAY`\n\t\t* ~\"The book is not near a house\"\n\t\t* ~\"The book is away from a house\"\n\t* *kanojnyasun ni suóljinh* -> `partner.F.ROM-1SG.POSS TOP 1SG-EXCESS-FAR`\n\t\t* lit. \"As for my girlfriend, she is too distant from me\"\n\t\t* ~\"My girlfriend is way too distant from me\"\n* These particles can also be used in comparatives:\n\t* *noyukssan ni soieji mo su* -> `heart.3SG.F.POSS TOP 3SG.M-NEAR than 1SG`\n\t\t* lit. \"As for her heart, he is closer (to it) than me\"\n\t\t* ~\"He is nearer to her heart than me\"\n\n### 17.5.3 Verbal locatives\n* These require the object to be accusative or for the verb to be in its accusative form\n* Examples:\n\t* *zua hateru asalji hya?* -> `2SG-AGT run.V.PLAT house-DEF-LOC Q`\n\t\t* \"Will you run into the house?\"\n\t* *a ke hateru asaljinh* -> `AGT IMP run.V.PLAT house-DEF-ELA`\n\t\t* \"Run out of the house\"\n\n## 17.6 Supportives and counter-supportives\n### 17.6.1 Stance\n* Examples:\n\t* *sa ni sopo* -> `3SG.F TOP 3SG.M-FOR`\n\t\t* ~\"She is for him\"\n\t\t* ~\"She is for his favour\"\n\t\t* ~\"She is in favour of him\"\n\t* *sa ni sobo* -> `3SG.F TOP 3SG.M-CNTR`\n\t\t* ~\"She is against him\"\n* These can be used in spatial contexts too:\n\t* *su ni asapo* -> `1SG TOP house-BES`\n\t\t* ~\"I am alongside the house\"\n\t* *su ni asabo* -> `1SG TOP house-OPP`\n\t\t* ~\"I am against the house\"\n\t\t* ~\"I am opposite to the house\"\n* If disambiguation is needed, append *-ji* accordingly:\n\t* *su ni asapjji*\n\t* *su ni asabjji*\n\n### 17.6.3 Terminatives and laterals\n* Examples:\n\t* *sua hateru asabjji* -> `1SG-AGT run.V.PLAT house-TERM`\n\t\t* ~\"I run up until the house\"\n\t\t* ~\"I run until the house\"\n\t* *sua hateru asapjji* -> `1SG-AGT run.V.PLAT house-LAT`\n\t\t* ~\"I run along the house\"\n\t\t* ~\"I run beside the house\"\n\n## 17.7 Comitative and instrumental\n* Examples:\n\t* *sua hateru foŝssunún nihi iią* -> `1SG-AGT run.V.PLAT friend.1SG.POSS-COM TOP-BACK good-MOD`\n\t\t* \"Me running with my friend is good\"\n\t* *zua kamu samiǫ naún hya?* -> `2SG-AGT eat.V.PLAT fish-ACC 1PL-COM Q`\n\t\t* \"Will you eat fish with us?\"\n\t* *a kenh kamu samilǫ tetezunún!* -> `AGT PROHIB eat.V.PLAT fish-DEF-ACC hand-2SG.POSS-INSTR`\n\t\t* \"Don't eat the fish with your hands!\"\n\n### 17.7.1 Abessive\n* The abessive case comes from the comitative case's inversed form *únh* (from *ún* + *-nh*)\n* Examples:\n\t* *zu ni honkitaúnhą* -> `2SG TOP person-like-ABESS-MOD`\n\t\t* lit. \"As for you, you are incapable of liking\"\n\t\t* ~\"You are a cold person\"\n\t\t* can mean different things depending on context\n\t* *na ni maniúnh* -> `1PL TOP money-ABESS`\n\t\t* lit. \"As for us, we are without money\"\n\t\t* ~\"We have no money\"\n\n## 17.8 Perlatives\n* **NOTE:** The inversed form of *nín* is *nính*\n\n### 17.8.1 Simple perlative\n* Examples:\n\t* *rumala hateru biraknnín* -> `light-DEF-AGT run.V.PLAT curtain.PER`\n\t\t* lit. \"Light runs through the curtain\"\n\t\t* ~\"Light shined through the curtains\"\n\t* *sua hateru asanín* -> `1SG-AGT run.V.PLAT house-PER`\n\t\t* \"I run through the house\"\n* In its approximative form *ienín*, it functions similarly to the English \"past / by\":\n\t* *sua hateru asaienín* -> `1SG-AGT run.V.PLAT house-AUG-PER`\n\t\t* \"I run past the house\"\n\t\t* \"I run by the house\"\n\n### 17.8.2 Avoidative\n* Examples:\n\t* *sua hatero asanính* -> `1SG-AGT run.V.PLAT house-AVOID`\n\t\t* \"I run, avoiding the house\"\n\t* *ruma′a hateru biraknnính* -> `light-AGT run.V.PLAT curtain.AVOID`\n\t\t* \"Light shines, avoiding the curtains\"\n\t\t* more idiomatically: \"Light shines everywhere except the curtains\"\n\n### 17.8.3 Mediative\n* Examples:\n\t* *a ke fofu su sonín!* -> `AGT IMP speak.V.PLAT 1SG 3SG.M-MED`\n\t\t* \"Speak to me via him!\"\n\n### 17.8.4 Causal or reason\n* Examples:\n\t* *so′o korrunai sunín* -> `3SG.M-SUFF kill.V.PLAT-IV 1SG-CAUSAL`\n\t\t* \"He is dead because of me\"\n\t* *su ni kanataĉ sonín* -> `1SG TOP sad-N.PLAT 3SG.M-CAUSAL`\n\t\t* \"I am sad because of him\"\n\n## 17.9 Partitive\n### 17.9.1 Partial or indefinite quantities or verbs\n* Examples (quantities):\n\t* *sua kamrreu chiitaryą* -> `1SG-AGT eat.IPFV.V.PLAT water-PRTV-this-MOD`\n\t\t* \"I will drink some of this water\"\n\t* *honita′a kita suǫ* -> `person-PRTV-AGT like 1SG-ACC`\n\t\t* \"Some (of the) people like me\"\n* Examples (verbs):\n\t* *sua senojitaru emonol* -> `1SG-AGT send.PRTV-V picture-DEF`\n\t\t* \"I am not done sending the picture\"\n\t\t* \"I have not yet finished sending the picture\"\n\t\t* \"The picture has not yet been sent\"\n\n### 17.9.3 Whole quantities or verbs\n* Examples (quantities):\n\t* *sua kamtthu samiitanhíl* -> `1SG-AGT eat.PFV.V.PLAT fish-WHOL-DEF`\n\t\t* \"I ate the whole fish\"\n* Examples (verbs):\n\t* *sua kamuitanh samil* -> `1SG-AGT eat.V.PLAT-WHOL fish-DEF`\n\t\t* \"I have completed eating the fish\"\n\t\t* \"I have eaten the fish\"\n\n### 17.9.4 Aboutness\n* Use *ita* for this\n* Examples:\n\t* *sua kitanyu saita iinyil hyo?* -> `1SG-AGT like-V.ROM 3SG.F-PRTV good-AUG.SUP-DEF OPEN.Q`\n\t\t* \"What do you love the most about her?\"\n\t\t\t* here, *saita* is used because the question is specific or evaluative and asking about an aspect of something\n* It can also mean 'to circumambulate' or go around in some contexts:\n\t* *sua haekuthu asalita* -> `1SG-AGT walk.V.PLAT-PFV.V.PLAT house-DEF-PRTV`\n\t\t* \"I walked around a house\"\n\t\t* ~\"I walked about a house\"\n\t\t* \"I learnt about a house\"\n* You can disambiguate by using *o* (SUFF, sufferer particle) instead of *a* to specify learning:\n\t* *suo haekuthu asalita* (I learnt about a house)\n","18 Modern Tawish case system.md":"## 18.1 Extended case usage\n| Case   | Semantic space                                                                                                                                                     |\n| ------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| -lla   | recipient or destination; ultimately, it is the **purpose** and **target** of any act                                                                              |\n| -llanh | **source** or **origin**; the giver as opposed to recipient or the starting point as opposed to destination                                                        |\n| -ye(t) | anything done for one's **gain** or **benefit** (e.g., running *for* your body's health)                                                                           |\n| -yenh  | anything done to one's detriment (e.g., stealing food *for* your coworker's detriment)                                                                             |\n| -õ    | the direct object                                                                                                                                                  |\n| -ji    | any state of **being**; being **at** or **inside** a coordinate                                                                                                    |\n| -jinh  | being **out of** or **away** from any state or coordinate; exclusion from a state or coordinate                                                                    |\n| -po    | positioned **beside** or **alongside** a thing; being **in favour** or **supporting**                                                                              |\n| -bo    | positioned **opposite** or **facing** something; resting **against** or using a thing as **support**; being **against** or acting as **substitute** (*instead of*) |\n| -ita   | a **piece** or **some** of a thing; *aboutness* or an *incomplete action*                                                                                          |\n| -itanh | the **entirety** of a thing; *completion* of an action; *total embodiment* of a thing                                                                              |\n| -un    | **accompaniment**, **using** a tool; **emotional companionship** or an *internal state that you carry*                                                             |\n| -unh   | **lacking** or **being without** (a thing)                                                                                                                         |\n| -nin   | movement **through** any space or medium; **mediation** (*via*) or **causality** (*because of*); temporospatial movement                                           |\n| -ninh  | **missing** or **avoiding** a point; **exclusion** or *except for*                                                                                                 |\n* most of the cases or usages for cases listed in **Grammar:17** do not fully cover each domain of the case\n* this table will explain the semantic range of each case\n\n### 18.1.1 -nin and -un\n* difference between **-nin** and **-un**:\n\t* *un* refers to a direct extension or connection\n\t\t* *ke kamurra teteun* -> you're holding the tool (hands), it is a part of your body\n\t\t* the tool (your hands) is your partner in eating and assists you\n\t* *nin* refers to a conduit or middleman through which you actualise your intentions\n\t\t* *ke kamurra tetenin* -> you're using the hands to achieve the goal of eating\n\t\t* the tool (your hands) is just an instrument that you're using to eat\n\t* the latter sounds more detached than the former and might even hint at ulterior motives ('using the hand to complete the goal which is to allow food to enter the mouth')\n\t* so unless there is some ulterior motive or that detachedness is intentional, just use *un* for all 'via' tasks\n\t* however, don't use *un* in all situations; for example, when you ask a man to help you talk to a friend, you aren't equals and you two probably don't have the same goal - so use *nin*\n\t* but if you two are talking to the friend together or he is assisting you talk to the friend, then you could make a good argument for using *un*\n* *-nin* has additional meanings that *-un* doesn't, so in some contexts, it might be essential, such as:\n\t* *haha konin mo mo maku konqnin* -> `laugh day-PER then then cry day-INV-PER`\n\t\t* \"Laugh (in glee) through the day, but weep through the night\"\n* note that *-nin* is always more visceral or strong, so in powerful metaphors like \"having your heart tears mine apart with happiness I can't handle,\" using *-nin* is the correct choice\n\t* although *-nin* sounds cold and detached, here it adds to the gory metaphor, making the sentence elevated and beautiful\n\n### 18.1.2 Benefactives and malefactives\n* they can be used in this way too:\n\t* *irimethu twanayet* -> `work-PFV.V.PLAT device-BEN`\n\t\t* \"(I) worked for the device\"\n\t\t* use this if you want to say that you fixed the device\n\t\t* it's especially useful if the device is a special or intimate project for the speaker\n\t* *irimethu twanayenh* -> `work-PFV.V.PLAT device-MAL`\n\t\t* \"(I) worked to the device's detriment\"\n\t\t* this implies that you dislike the device or that you're work is actively hostile to the device\n\t\t* it can also imply sabotage\n\n### 18.1.3 Total semantic scope of locative class\n| Case       | Semantic space                                                                                                                                                                                                                                                                                                                                                            |\n| ---------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **ji**     | anything located in or contained in something; going into, enter; in, at; state of being; being 'in' any state; headspace; membership, participation; fashion, trend; included, counted; skill (good at, bad at); rate or measurement (at 60BPM); state during activity; targeted or directed action; appearance or form (in pieces, in crystals); lock in                |\n| **jinh**   | being out of or away from; going out of, exiting; not in, not at; a state of being one isn't in; exhausted, depleted; revealled, exposed; extinguished, inactive; (removed) from participation; not included, not counted; fall out                                                                                                                                       |\n| **jiji**   | exactly at, absolutely at; most at, perfectly in; the absolute truth or bullseye in terms of location or headspace, dead on; precisely (at); interaction point (knock at the door)                                                                                                                                                                                        |\n| **jijinh** | nowhere near, way off, completely missing it; not even close; anything but (it/that)                                                                                                                                                                                                                                                                                      |\n| **jinyi**  | above, over, on; positioned above; applied to a target; directed effort towards; active engagement; turned 'on' or online; topical focus; schedule, occurrence (the party is on); dependency, support, codependent; progress, continuation; responsibility; stick on                                                                                                      |\n| **jista**  | below, under, beneath, off; positioned below; action directed away; removed form a target; 'off' or offline; ranked below; siphon (off); take (off), cancellation, discontinuation, reduction or discount (30% off), incorrectness (feels off); detach, remove; come off                                                                                                  |\n| **ieji**   | close; interaction is easy or intermediate; (at a) short distance; association, affiliation (close to him), rank, hierarchical closeness (near the top), proximity (near the department); approximation (nearly the best), almost; close to a limit or boundary (near disaster); low cognitive distance (keep it near your mind, bring near your attention); soon (to be) |\n| **iejinh** | outside the zone of easy interaction; not close; away; increase distance from reference (take away, move away); not present (he is away); difficult to access (help is not near); removed from implication or connection (step away, drift away, fade away)                                                                                                               |\n| **olji**   | distance is lower than a comfortable or safe threshold; crossing boundaries, entering personal space; too close for comfort; insufficient difference (too similar / too close); proximity that risked crossing into failure or harm; clingyness or attachment (she is too close)                                                                                          |\n| **oljinh** | distance is higher than a comfortable or manageable threshold; beyond an expected or needed position; too removed from involvement or connection (he went too far in isolating himself); threshold violation (opposite end of a safety or acceptability boundary (e.g., experiment gone too far)); detachment, isolation (he is too distant)                              |\n* the locative class of particles (ji, jinh, jiji, jinyi, jijinyi, etc.) and their semantic space\n* yes, they can take on any word form (jiru, oljinhru, oljiru, iejinhtei, jistanych)\n* and no, it is not as scary as it looks\n* here are some sentence examples:\n\t* *bakalojinh* -> `circle-INDEF.PL.LOC-G.INV`\n\t\t* ~\"(I am) out of balls\"\n\t* *nuksanoljinh* -> `heart.3SG.F.POSS-EXCESS-LOC-G.INV`\n\t\t* ~\"(He is) too distant from her heart\"\n\t* *ei ni ieji à!* -> `ANAPH TOP AUG-LOC INTERJ`\n\t\t* ~\"(Phew), that was close!\"\n\t* *haekurra jistateijinyi fuka* -> `walk.V.PLAT-NEG LOC-DIM.SUP-PROD-LOC-AUG.SUP`\n\t\t* ~\"Please do not walk on the floor\"\n* note that *llanh* and *lla* can also be used in this sense:\n\t* **I have gotten bored FROM (llanh) you**\n\t\t* here, *I* is getting bored *FROM you*\n\t* **I have gotten bored TO (lla) you**\n\t\t* here, *I* feels boring *TO you*\n\n## 18.2 Modern semantic spaces\n| Case   | Semantic domain                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            |\n| ------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| -lla   | go to X (drive **to** London); progress towards X (from 5 PM **to** 9 PM; 6.7 metres **to** the border); do X to Y (made love **to** her; gave the book **to** Sarah); connect or join (fasten the USB **to** the port); facing (**to** the wall); perspective (**to** me, this is nice; **to** up here, the cars seem broken)                                                                                                                                                                             |\n| -llanh | source (**from** a friend); origin (**from** 5 PM to 9 PM; **from** bad to worse); disconnect or unjoin ((*un*)fasten the USB **from** the port); heritage (Maki is **from** Brazil); beginning (open **from** 3 AM); indefinite start (**from** 3 PM, I won't be nice); X from (allergic **from**; banned or barred **from**; protect **from**; disallowed **from**; released **from**; made **from** / transformed **from**); distance (away **from** the stove); causal (shiver **from**; run **from**) |\n| -ye(t) | do to help X; reason for X (go **for** a spin); usage of X (this house is **for** living in); motive of X (why something happened - he is famous **for** his singing); give X to get Y (pay $10 **for** the shirt); fixedness (key **for** the door; solution **for** the issue); opinion (this climate isn't right **for** me; I speak **for** the entire team); for (feel sad **for** you; wait **for** me; responsible **for**) / X **for** Y                                                           |\n| -yenh  | do to X's detriment (eat **for hurting** him); reason not for X (go **not for** a spin);                                                                                                                                                                                                                                                                                                                                                                                                                   |\n| -ji    | (final) destination for verbs of motion (go **in/to** school); location of existence (pudding **in** the fridge); time (**at** 3 o'clock); recipient or target (give **to** a friend)                                                                                                                                                                                                                                                                                                                      |\n| -un    | where an activity happens (studying **at** her home); the instrument used (going **by** train); composition (made **by/of** steel)                                                                                                                                                                                                                                                                                                                                                                         |\n| -nin   | through (**through** X; **via** X; **through** the night; **through** the house; **through** the crosswalk)                                                                                                                                                                                                                                                                                                                                                                                                |\n| -ninh  | around, bypass, skirt (**around** the house); stopped by, against, into (without passing through); moving into and stopping; over, across (without depth), upon (fly **over** the house)                                                                                                                                                                                                                                                                                                                   |\n| -po    | stance (**for** him); along (**along(side)** the house; run **along/beside** the house)                                                                                                                                                                                                                                                                                                                                                                                                                    |\n| -bo    | against stance (**against** him); against (**against/opposite (to)** the house); terminative (**up until** the house)                                                                                                                                                                                                                                                                                                                                                                                      |\n* These are the extra or additional meanings cases carry\n* The semantic spaces of cases are huge\n* Do note that a lot of cases are omitted or not distinguished in Modern Tawa\n\n## 18.3 Case system in the Modern Tawish Register\n| Case      | Modern / simplified domain                                                                                                             |\n| --------- | -------------------------------------------------------------------------------------------------------------------------------------- |\n| **õ**    | direct object; traversal or route of motion; point of detachment                                                                       |\n| **ji**    | indirect object; location of existence; destination or final arrival point; time; goal of a movement; passive or causative             |\n| **un**    | instrument or means; location of action; material or composition; cause or reason; limit                                               |\n| **lla**   | heading (towards); progression                                                                                                         |\n| **llanh** | temporospatial starting point or origin; source of material; source of information / giving                                            |\n| **mo**    | comitative; additive; quotation or boundary of thought or sound;  comparison; temporal (and spatial) sequentiality; contrasting linker |\n\n### 18.3.1 Explanation and definition\n* Multiple cases have lost distinction in the Modern Tawish spoken register:\n\t* **õ**\n\t\t* direct object\n\t\t\t* read the *book*\n\t\t* traversal or route of *motion*\n\t\t\t* flew (through) the *sky*\n\t\t\t* walked (along) the *street*\n\t\t* point of detachment\n\t\t\t* graduate (from) *university*\n\t\t\t* step (off) the *bus*\n\t* **ji**\n\t\t* indirect object\n\t\t\t* give a gift **to** a friend\n\t\t* location of existence\n\t\t\t* keys are **on** the table\n\t\t* destination or final arrival point\n\t\t\t* we are **at** the station\n\t\t\t* we drove **to** London\n\t\t* time\n\t\t\t* writing this sentence **at** 2:42 AM\n\t\t* goal of a movement\n\t\t\t* went **out to** shop\n\t\t* passive or causative\n\t\t\t* the boss made the employee write the report\n\t\t\t\t* *komunil ni komuninqjia monu tetõkal*\n\t\t\t\t* \"the boss **made** the employee write the report\"\n\t* **un**\n\t\t* instrument or means\n\t\t\t* wrote the letter **in** pen\n\t\t\t* ate **with** a spoon\n\t\t* location of action\n\t\t\t* danced **at** the club\n\t\t* material or composition\n\t\t\t* made **of / by / with** wood\n\t\t* cause or reason\n\t\t\t* the game was cancelled **due to** rain\n\t\t* limit (time/quantity/scope)\n\t\t\t* this shirt is cheap **for** its high quality\n\t\t\t* finished it **in** three days\n\t* **lla**\n\t\t* heading (towards)\n\t\t\t* heading **towards** the mountains\n\t\t\t\t* p.s., here, the focus is on 'active direction,' not the destination, unlike *ji*\n\t\t* progression\n\t\t\t* going **to / progressing** towards London\n\t* **llanh**\n\t\t* spatial starting point\n\t\t\t* I came here **from** Canada\n\t\t* temporal origin\n\t\t\t* I started **from** almost 11 to 12 o'clock\n\t\t* source of material\n\t\t\t* wine **from** grapes\n\t\t\t\t* p.s., here, it is about transformation or change itself; in *un*, the original material was wood, but with *llanh*, the original material has changed (grapes to wine, seed to plant, etc.)\n\t\t* source of information / giving\n\t\t\t* heard about it **from** her\n\t* **mo**\n\t\t* comitative\n\t\t\t* I never argue **with** my sister\n\t\t* as an additive\n\t\t\t* apples **and** oranges\n\t\t* quotation or boundary of a thought or sound\n\t\t\t* the bell rang **with** a ding\n\t\t\t* he said **that** he would come tonight\n\t\t* comparison\n\t\t\t* bigger **than** him\n\t\t* temporal sequence or sequentiality\n\t\t\t* ate **then** went to talk to him\n\t\t* contrasting linker\n\t\t\t* **but** I'm eating\n\t\t\t* you can do it **but** only if you pay first\n\n### 18.3.2 Usage\n* In poetry, formal works, or technical descriptions, the official Tawish case system is utilised\n* In primarily *spoken* Tawa, the case system used in the **Modern Tawish spoken register** will be used\n* The simple case system allows for easy conversation without needing many particles\n* In conversation, the formal case system can be used, of course, but usually it shouldn't be necessary\n\n## 18.4 Other cases\n* For other case-like particles, please see:\n\t* *Tawish standard*, **0:0.16** -> on the actor *-a* (A) and undergoer *-o* (U) particles\n\t* *Tawish standard*, **0:0.21** -> on the genitive *no* (GEN)\n","19 Naming system.md":"## 19.1 Basic naming conventions\n* Lineage is prioritised in naming\n* The basic format is:\n\t* `[Family name] + [Given name] no [Father's name]`\n\t* you may continue adding *no*'s to specify grandfather and so on\n* Example:\n\t* Given name: Hajira (Angel)\n\t* Family name: Sumatà (Courageous)\n\t* Father's name: Aiu (Fire/flame/ambition)\n\t* Constructed:\n\t\t* **Sumatà Hajira no Aiu** -> Hajira Sumatà, daughter of Aiu\n\n## 19.2 Usage of names\n* Always use **GIVEN NAME + hon'iku** (person-PERS) for strangers:\n\t* *Sumatàhon'iku*\n* Children never refer to parents by their first name and also use the hon'iku construction\n* Younger siblings usually never refer to older siblings by their first name but can drop hon'iku or 'iku\n* Parents usually refer to themselves by their title, so *karicha* (mommy), not *su* (me) when talking to their progeny\n* Spouse, partners, or best friends can use first names\n\n## 19.3 Usage of hon'iku and 'iku\n* Use *iku* if using a proper noun, especially a Tawish word as a name:\n\t* *Hajira* (angelic) + *'iku* -> **hajira'iku** (angel, as a name)\n* In many contexts, omitting is okay; however, for strangers or out of formality, it is necessary, as 'iku often carries a hidden connotation of respect (like saying sir or madame)\n* Use *hon* after a family name to refer to your parent, older sibling, etc.\n\t* *Samatàhon* or *Samatàhon'iku*\n* For first names, *hon* is never used; however, *'iku* is depending on context, ambiguity, and all the aforementioned things\n","20 Common word particles.md":"## 20.1 Common grammaticalised particles\n| Word      | Usage                                        | Grammatical usage                                                                    |\n| --------- | -------------------------------------------- | ------------------------------------------------------------------------------------ |\n| **hwo**   | *liver, intense courage*                     | **unshwã** / **uns'hwã** (vitality)                                                |\n| **two**   | *device, tool*                               | **kiuktwãsta** ((~insect) wings)                                                    |\n| **hato**  | *run, persist, series*                       | **unshatã** / **uns'hatã** (the system of life)                                    |\n| **yaro**  | *become, come*                               | **taheteyarã** (digitise, electronise)                                              |\n| **tachi** | *way, manner, method*                        | **kamutachi** (manner of eating / way of eating); **irimetachi hyo?** (how to work?) |\n| **irime** | *job, work, craft*                           | **mahokarime** (witchcraft)                                                          |\n| **tan**   | *why, reason, because of, source*            | **meitan** (biology)                                                                 |\n| **wa**    | *too, also*                                  | **zu wa kita atoraõ** (you also like apples)                                        |\n| **shí**  | *primordial unit, particle, particulate*     | **riwakashí** (neurone, concept, symbol)                                            |\n| **miri**  | *middle, medium, moderate, amongst, (~core)* | **arenemiritas** (interchangeable)                                                   |\n* These four particles are very important in grammar\n* Without them, a large chunk of semantic expression is lost:\n\t* *iinq kamutachi* -> bad manners of eating (e.g., chewing loudly)\n\t* *twana'hatã* -> the device/tool ecosystem\n\t* *mahokairime* -> witchcraft\n\t* *meitan* -> biology\n\t* *tabetetwã* -> electroshock weapons, restraint chairs, torture weapons\n\t* *esacetwã*\n\t\t* no direct translation, but think Jigsaw or Saw traps, probably (even) worse\n\t* *gayashí*\n\t\t* atoms, atomic particles\n\t* *damiyarã*\n\t\t* simplify, make easier\n\t* *honhwa*\n\t\t* humanity, humanness\n\t* *arenemiritas*\n\t\t* amongst that which has the potential (to) change\n\t\t* ~interchangeable\n\n### 20.1.1 usage of *wa*\n* *wa* takes the role of *-a* or *ni*, but not *-o*:\n\t* *su wa kamu* -> I also eat / I am eating too\n\t* *su wa ii* -> I am also good / I'm good too\n\t* *sa**o** wa korru* / *sao korru wa* -> She was killed as well\n\t\t* here, *o* wasn't dropped\n* it **can** work similarly to a domain of the Japanese 'mo'\n\n## 20.2 When to and not to use them\n* Don't literally use it for building every root\n* For that, you can use the Tawish Kanji borrowings or technical/extended lexicons\n* These are often used in poetry or to describe concepts which are hard to\n* For example:\n\t* *Zu ni damitansun* -> `2SG TOP light-reason-1SG.POSS`\n\t\t* \"You are the reason why (my life is so) light.\"\n\n## 20.3 Standard update\n* According to the v3.1.3 update of the Modern Tawish Standard, the following particles are used instead of their older counterparts:\n\t* **sumata** -> **hwo**\n\t\t* *honhwã*\n\t* **mono** -> **shí**\n\t\t* *gayashí*\n\t* **twana** -> **two**\n\t\t* *tabetetwã*\n\t* **hatero** -> **hato**\n\t\t* *unshatã* / *uns'hatã*\n\t* **yara** -> **yaro**\n\t\t* *taheteyarã*\n* Note that the **′o-roots** should take the appropriate particle\n* *hwo* aspirates if:\n\t* *...to* + *hwo*\n\t\t* *thwo*\n\t* *...ko* + *hwo*\n\t\t* *cwo*\n"}; 

function loadList() {
    const query = document.getElementById('doc-search').value.toLowerCase();
    const listEl = document.getElementById('doc-list');
    
    // Filter logic based on the local DOCS_DATA object
    const files = Object.keys(DOCS_DATA).filter(f => {
        const content = DOCS_DATA[f].toLowerCase();
        return f.toLowerCase().includes(query) || content.includes(query);
    });
    
    listEl.innerHTML = files.map(f => `
        <li class="doc-item" onclick="loadDoc('${f.replace(/'/g, "\\'")}', this)">
            ${f.replace('.md', '')}
        </li>
    `).join('');
}

function loadDoc(filename, element) {
    document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('active'));
    if (element) element.classList.add('active');
    
    const text = DOCS_DATA[filename];
    if (text) {
        document.getElementById('view').innerHTML = marked.parse(text);
        document.getElementById('content-area').scrollTo(0,0);
    }
}

// Kickstart the page
window.onload = loadList;
</script>
