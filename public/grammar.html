C hand-2SG.POSS-INSTR`\n\t\t* \"Don't eat the fish with your hands!\"\n\n### 17.7.1 Abessive\n* The abessive case comes from the comitative case's inversed form *únh* (from *ún* + *-nh*)\n* Examples:\n\t* *zu ni honkitaúnhą* -> `2SG TOP person-like-ABESS-MOD`\n\t\t* lit. \"As for you, you are incapable of liking\"\n\t\t* ~\"You are a cold person\"\n\t\t* can mean different things depending on context\n\t* *na ni maniúnh* -> `1PL TOP money-ABESS`\n\t\t* lit. \"As for us, we are without money\"\n\t\t* ~\"We have no money\"\n\n## 17.8 Perlatives\n* **NOTE:** The inversed form of *nín* is *nính*\n\n### 17.8.1 Simple perlative\n* Examples:\n\t* *rumala hateru biraknnín* -> `light-DEF-AGT run.V.PLAT curtain.PER`\n\t\t* lit. \"Light runs through the curtain\"\n\t\t* ~\"Light shined through the curtains\"\n\t* *sua hateru asanín* -> `1SG-AGT run.V.PLAT house-PER`\n\t\t* \"I run through the house\"\n* In its approximative form *ienín*, it functions similarly to the English \"past / by\":\n\t* *sua hateru asaienín* -> `1SG-AGT run.V.PLAT house-AUG-PER`\n\t\t* \"I run past the house\"\n\t\t* \"I run by the house\"\n\n### 17.8.2 Avoidative\n* Examples:\n\t* *sua hatero asanính* -> `1SG-AGT run.V.PLAT house-AVOID`\n\t\t* \"I run, avoiding the house\"\n\t* *ruma′a hateru biraknnính* -> `light-AGT run.V.PLAT curtain.AVOID`\n\t\t* \"Light shines, avoiding the curtains\"\n\t\t* more idiomatically: \"Light shines everywhere except the curtains\"\n\n### 17.8.3 Mediative\n* Examples:\n\t* *a ke fofu su sonín!* -> `AGT IMP speak.V.PLAT 1SG 3SG.M-MED`\n\t\t* \"Speak to me via him!\"\n\n### 17.8.4 Causal or reason\n* Examples:\n\t* *so′o korrunai sunín* -> `3SG.M-SUFF kill.V.PLAT-IV 1SG-CAUSAL`\n\t\t* \"He is dead because of me\"\n\t* *su ni kanataĉ sonín* -> `1SG TOP sad-N.PLAT 3SG.M-CAUSAL`\n\t\t* \"I am sad because of him\"\n\n## 17.9 Partitive\n### 17.9.1 Partial or indefinite quantities or verbs\n* Examples (quantities):\n\t* *sua kamrreu chiitaryą* -> `1SG-AGT eat.IPFV.V.PLAT water-PRTV-this-MOD`\n\t\t* \"I will drink some of this water\"\n\t* *honita′a kita suǫ* -> `person-PRTV-AGT like 1SG-ACC`\n\t\t* \"Some (of the) people like me\"\n* Examples (verbs):\n\t* *sua senojitaru emonol* -> `1SG-AGT send.PRTV-V picture-DEF`\n\t\t* \"I am not done sending the picture\"\n\t\t* \"I have not yet finished sending the picture\"\n\t\t* \"The picture has not yet been sent\"\n\n### 17.9.3 Whole quantities or verbs\n* Examples (quantities):\n\t* *sua kamtthu samiitanhíl* -> `1SG-AGT eat.PFV.V.PLAT fish-WHOL-DEF`\n\t\t* \"I ate the whole fish\"\n* Examples (verbs):\n\t* *sua kamuitanh samil* -> `1SG-AGT eat.V.PLAT-WHOL fish-DEF`\n\t\t* \"I have completed eating the fish\"\n\t\t* \"I have eaten the fish\"\n\n### 17.9.4 Aboutness\n* Use *ita* for this\n* Examples:\n\t* *sua kitanyu saita iinyil hyo?* -> `1SG-AGT like-V.ROM 3SG.F-PRTV good-AUG.SUP-DEF OPEN.Q`\n\t\t* \"What do you love the most about her?\"\n\t\t\t* here, *saita* is used because the question is specific or evaluative and asking about an aspect of something\n* It can also mean 'to circumambulate' or go around in some contexts:\n\t* *sua haekuthu asalita* -> `1SG-AGT walk.V.PLAT-PFV.V.PLAT house-DEF-PRTV`\n\t\t* \"I walked around a house\"\n\t\t* ~\"I walked about a house\"\n\t\t* \"I learnt about a house\"\n* You can disambiguate by using *o* (SUFF, sufferer particle) instead of *a* to specify learning:\n\t* *suo haekuthu asalita* (I learnt about a house)\n"}; 

function loadList() {
    const query = document.getElementById('doc-search').value.toLowerCase();
    const listEl = document.getElementById('doc-list');
    
    // Filter logic based on the local DOCS_DATA object
    const files = Object.keys(DOCS_DATA).filter(f => {
        const content = DOCS_DATA[f].toLowerCase();
        return f.toLowerCase().includes(query) || content.includes(query);
    });
    
    listEl.innerHTML = files.map(f => `
        <li class="doc-item" onclick="loadDoc('${f.replace(/'/g, "\\'")}', this)">
            ${f.replace('.md', '')}
        </li>
    `).join('');
}

function loadDoc(filename, element) {
    document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('active'));
    if (element) element.classList.add('active');
    
    const text = DOCS_DATA[filename];
    if (text) {
        document.getElementById('view').innerHTML = marked.parse(text);
        document.getElementById('content-area').scrollTo(0,0);
    }
}

// Kickstart the page
window.onload = loadList;
</script>
