const DOCS_DATA = {"0 Tawish standard.md":"## 0.1 O-roots\n* *o-roots* (′o-kana) refer to any root that ends in the vowel o\n* waoi is not an o-root, but jiteko is.\n* o-roots are special in that they have a few rules that must be followed\n\n### 0.1.1 Inflection\n* only words or particles ending in *′o* (′o-kana / ′o-shí) inflect\n* so **sowo** changes to **sowu** (verb) but **ainàwa** can't inflect and takes **ainàwaru**\n* **ao** would be nominalised as **aen**\n* but this doesn't mean they accept every single sound\n* the following sounds don't usually cause omission of the **′o** ending:\n\t* mh [m̥͡m]\n\t* h(i~ĩ~í) [çi çĩ çɪ]\n\t* hy [ç͡j]\n* this is also why *mero+mho+hi* is *meromhohi* and not something cursed like *mermhhi*\n* non-nasal consonant clusters are usually not allowed:\n\t* *fofo* + *tei* -> *fofotei* (not foftei)\n\n#### 0.1.1.1 Type prominence\n* type prominence refers to a Tawish grammar concept where the final grammatical particle, if it ends in **′o**, can carry particles that modify what comes before it:\n\t* *kamo* + *reo* -> *kamreo*\n\t\t* this could mean food (that will), (will) eat, or anything along those lines\n\t\t* however, this turns into a verb when *reo* inflects to *reu*:\n\t\t\t* *kamreu* -> will eat\n* type prominence is also the term used for deciding which particle goes at the end of a root:\n\t* *niglanq kachi niglõ* -> `cat.DEF-A-INV bite cat.DEF-ACC`\n\t\t* \"The dog bit the cat\"\n\t* *niganq kachi nigõ* -> `cat.A-INV bite cat.ACC`\n\t\t* \"The dog bit the cat\"\n* cases almost always go at the very end and other particles go before\n* if order (apart from cases, which go to the end) ever varies, its usually due to the speaker's natural flow or for rhythmic or poetic purposes\n* the relativiser and relative copular are the most prominent in the language and beat even cases:\n\t* *teqeka asalõme...* -> `recount.EMO house-DEF-ACC-REL`\n\t\t* \"Remember the house that...\"\n\n### 0.1.2 Garibankana\n* usually refers to roots that contain two *o*'s:\n\t* *wanoo*\n\t* *itsukoo*\n\t* *hibikoo*\n\t* *nakigoo*\n\t* *maooru*\n\t* *tetooka*\n* these don't inflect normally\n* wherever the double *o* is, that is their site of inflection\n* so, *wanoo* would inflect like:\n\t* *wanoã*\n\t* *wanothu*\n* or *nakigoo*:\n\t* *nakigoã*\n\t* *nakigot*\n\t* *nakigóy*\n\t\t* vowel simplification, even though oóy [oɔj] is technically fine\n* but *tetooka* would inflect like:\n\t* *teqeka*\n\t\t* cluster simplification, even though **tqe** [tc͡çe] is technically fine\n\t* *tetsuka*\n\t* *tetãka*\n* or *maooru*:\n\t* *mauru*\n\t* *manyuru*\n\t* *mãru*\n\t\t* vowel simplification occurred here too\n\n#### 0.1.2.1 Writing garibankana\n* write them as verbosely as possible in formal writing:\n\t* *manyuru*\n\t* *tetqeka*\n\t* *nakigoóy*\n* even though they are pronounced *teqeka* or *nakigóy*\n* do note that the vowel is unmarked on *(ó)y* so it would be *nakigooy*\n\n### 0.1.3 Grammatical particle inflection\n* particles like *reo*, *to*, and other ′o-shí do inflect:\n\t* *reo* + *tei* -> *retei*\n\t* *reo* + *ru* -> *reu*\n* but they don't follow normal inflection rules\n* for example, **tu** is **tsu** but *to* + *-ru* isn't toru or tsu, it's **thu**\n* if you ever need to inflect a grammatical root, remember:\n\t* as much of it must be preserved (reu is closer to reo than reru)\n\t* the o does not always need to be omitted (ryo)\n\t* banned syllables are not allowed, use accepted alternatives (so to+ru->thu and to+ĩ->thĩ)\n\t\t* do not use tsu or chi (standard alternatives) as they are alien when compared to an aspirated *t*, which sounds closest to *to*\n\t\t* it, however, does not follow for romantic forms:\n\t\t\t* *chyu* (PFV.V.ROM)\n* though if its a demonstrative like ryo or ends with yo, then ryji-type constructions are fine, though ryjiã would be wrong (ryãji is correct)\n\t* still, *ryotei* or *ryoji* is the standard\n\n### 0.1.4 ′o-preservation\n* sometimes, inflection results in liquid clashes (#1.1.4.1):\n\t* for example, let's say you're forced to make *mirla*\n\t* but when liquids like r and l clash, the o is preserved, so mirola\n\t* if there is a word, say samil, and you must add rra to it, then either:\n\t\t* move the definite article: samirral\n\t\t\t* or *ilppu samirra*\n\t\t* move the negative: rra samil\n\t\t* use the linker: samil ce rra\n\t\t* omit the article: samirra\n* note that even though *samilrra* or *mirla* are still possible due to the epenthensis rule, avoiding such is preferred\n\n### 0.1.5 Inversers\n* inversers don't inflect (so kamo+nq=kamonq)\n\n#### 0.1.4.1 Liquid clashes\n* liquid clashes [ɺl lɺ ɺɾ ɾɺ ʎl ʎɺ] are banned\n\t* [ɺʎ] or [lʎ] *could be* fine, though\n\n## 0.2 Cluster-vowel simplification\n* this only occurs in speech\n* these clusters simplify:\n\t* *oó* -> *ó*\n\t* *tq* -> *q*\n\n## 0.3 To use *ea* or to not use *ea*\n* *ea* is a movement particle\n* as a modifier, it just signals 'this thing can move'\n* it is better to use it this way, like in natseeã (moving block / cube), which could be a trolley or cart\n* *tawa natse* would be less self-explanatory\n\n## 0.4 Numbering\n* stack to add up numbers, like:\n\t* wuwuwan (7, from 3+3+1)\n* for multisyllabic words (more than one syllables), reduplicate the initial syllable\n\t* tete -> tetete (10)\n\t* antaka -> anantaka (20)\n\t* sora -> sosora (100)\n* these pronouns can be used as numbers:\n\t* wu (3SG) = 3\n\t* zu (2SG) = 2\n\t* su (1SG) = 1\n* these words can be used as numbers:\n\t* kuenao (lose) = zero\n\t* tete (hands) = 5\n\t* antaka = 10\n\t* mych (many) = 20\n\t* sora (sky) = 100\n\t* subeko (all) = infinity\n* though using numbers from other languages, such as English, is fine too in many contexts\n* use *pa* to subtract:\n\t* *sora pa anantaka* = 80 (100-20)\n\n## 0.5 Reduplication\n* reduplication is a casual or less formal and emphatic way to turn a word into its superlative form:\n\t* ii (good) -> ii'ii (best)\n* *nyi* is more 'loaded' and also carries an **augmentative connotation**:\n\t* ii (good) -> iinyi (unrivalled, matchless, supreme, nonpareil, crème de la crème, pinacle)\n\t* so *samiryã ni iinyi* -> \"this fish is so much better\" or \"this fish is the best\"\n* it isn't that reduplication is weaker per se; rather, reduplication is less grand - so *ii'ii* can mean crème de la crème but it isn't the first thing that comes to a listener's mind when one utilises reduplication\n* note that reduplication refers to doubling the initial CV or VC or VV unit:\n\t* ***ku**ru* -> **kuku**ru\n\t* **ii** -> **ii**'**ii**\n\t* ***ka**nojo* -> **kaka**nojo\n\t* ***az(h)**uru* -> **azaz(h)**uru\n* for words like *ii*, the reduplicated sequence should be separated with a simple *'* - so **iiii** is written as *ii'ii*\n* Do note that reduplication is the only instance where *'* or *′* is not pronounced as a glottal stop, apart from usage as a separator, like in *'iku*\n\n## 0.6 Positive and negative connotation\n* *-t* and *-óy* specify if a word is negative or not\n* take the case of *ainàwa* - it can mean glee or cunning both\n* to disambiguate, you use **ainàwat** for cunning or devious and **ainàwaóy** for empathetic\n* the vowel on *óy* is actually unmarked:\n\t* **ainawaoy**\n\t* **hibikooy**\n\n## 0.7 Pronunciation of hi\n* *hi* is always pronounced [çi], even though some texts use [j̊i]\n\n## 0.8 Product (tei) vs. noun particles\n* in Modern Tawa, *tei* and noun particles *(y)ch* and *nych* aren't very different\n* *tei* is a relic from older languages, like Takan or early Tawish languages, which distinguished contextual products (*tei*) and denotational products (*gami*)\n* so, does this mean they are interchangeable? it would not be *inherently* wrong to use them interchangeably; however, due to grammatical quirks, you cannot use them interchangeably\n\n### 0.8.1 When to use *tei* and when not to\n* use tei if you want broader semantic space and contextual alteration:\n\t* kamtei is food or something edible, but it will refer specifically to pizza during pizza parties or all the food on the table in a buffet\n* use *(y)ch* if you want to simply mark something as a noun:\n\t* kamych will be anything edible or any food item, so it can refer to deserts, even during a pizza party\n* use *nych* for the obvious romantic connotation:\n\t* *kamnych* could be a sexual or romantic euphemism - context, creativity, and imagination are the limits\n\n## 0.9 The antiproduct particle\n* it is not correct to say that the antiproduct particle *hai* is just the opposite of *tei*\n* *tei* derives meaning contextually: kamtei can be pizza during pizza parties\n* though hai **can** derive contextual meaning, it works primarily to derive **how** one acts on something\n* for example:\n\t* *chi* -> liquid, flow\n\t* *chitei* -> usually water in many contexts, could be juice, though\n* but let's say you want to refer to the action of drinking - we can't use chiru for that, since:\n\t* chiru -> to water, to flow, etc\n* chiru would never mean 'drink' or 'sip'\n* for this reason, the antiproduct verbal particle exists (hai):\n\t* *chihai* -> to drink, to sip, to slurp, (to swallow)\n* chihai **can** mean 'to swallow' (as it is quite contextual, like tei) because one doesn't really eat a liquid, they let the liquid pass freely down\n* take this example of *rete*:\n\t* *retetei* / *retech* -> ice\n\t* *retehai* -> to freeze\n\t* *reteru* -> to cool\n* and *nashita*:\n\t* *nashitatei* / *nashitach* -> fire, warmth, heat\n\t* *nashitahai* -> burn, ignite, to breathe (fire), kindle, start a fire\n\t* *nashitaru* -> to heat, to cook\n* let's see them in sentences:\n\t* *Duragin'ikua nashitahai* -> `dragon-PERS-A warm-ANTIPROD.V`\n\t\t* \"The dragon breathed fire\"\n\t* *Honlena nashitahai* -> `person-INDEF-A warm-ANTIPROD.V`\n\t\t* \"A person started the fire\"\n\t* *Chinq ni nashitahai* -> `fire TOP warm-ANTIPROD.V`\n\t\t* \"The fire was ignited\"\n\t* *Sa ni retehaithu zhi sua fofu sa karichesanita ẽ ii'iinq harison* -> `3SG.F TOP cold-ANTIPROD.V-PFV.V.PLAT TEMP 1SG-A speak.V.PLAT 3SG.F parent-M.PLAT-3SG.F.POSS-PRTV and SUPR.bad deal-3SG.M.POSS`\n\t\t* \"She froze (like ice) when I told her about the worst of her father's exchanges/trades\"\n* and let's finally see what would happen if we just used *(r)u*:\n\t* *chinq ni nashitaru* -> `fire TOP warm-V.PLAT`\n\t\t* \"The fire heats / burns\"\n\t* *Duragin'ikua nashitaru* -> `dragon-PERS-AGT warm-V.PLAT`\n\t\t* \"The dragon heats (up) / warms\"\n\t* *Sa ni retethu...* -> `3SG.F TOP cold-PFV.V.PLAT`\n\t\t* \"She froze (something) / she cooled\"\n* the antiproduct particle is context-sensitive - chihai can mean rinse if you say it in a public shower but it can mean 'drink' in a private domicile (e.g., 'Jèsei'ikua subũ chihai chiõ asahyakãsonji' (~Jesse wants to drink water in his private domicile)).\n* **NOTE: using older Tawish standard for writing these translations; please confirm with newer notes!**\n\n### 0.9.1 A better explanation of the antiproduct particle\n* think of the antiproduct particle as a verbaliser; however, instead of verbalising a noun, it engages with a noun in the way it canonically functions in any way\n\t* the canonical function of water is, well, to drink it\n\t* that is why chihai means to drink water; however, if you're talking about showering, chihai could actually mean rinse\n\t* context would disambiguate anyway, though:\n\t\t* *sua subũ chihai gagadenq chi umhi* -> `1SG-A desire.VLNK water-ANTIPROD.V SUP~dirty-INV water COM-BACK`\n\t\t\t* \"I want to clean myself with water\" (i.e., shower, rinse, since you can't 'drink' yourself with water)\n* the antiproduct particle is used to turn a root into a verb that can express the canonical action associated with it (as a phenomenon):\n\t* *koro* + *hai* -> to avoid death / to stay alive / kill / die / reap\n\t\t* *su ni korruhai!* -> `1SG TOP kill.V.PLAT-ANTIPROD.V`\n\t\t\t* \"I am staying alive / avoiding death\"\n\t\t* *sua korruhai sa* -> `1SG-A kill.V.PLAT-ANTIPROD.V 3SG`\n\t\t\t* \"I killed her\" (?) depends on context, plus don't use the antiproduct particle in these cases, even if it is **'technically'** correct!\n\t\t\t* as you're about to learn, *korruhai* would feel like saying 'the act that forcibly led to or of forcing the irreversible cessation of all vital functions in a living organism'\n* here is a simple rule: before using the antiproduct particle, ask yourself:\n\t1. what do you do to this noun?\n\t2. what does this noun do to you?\n* let's take the noun 'rice' (rochi) and answer #1 and #2:\n\t* you cook and eat this noun\n\t* it fulfills you and helps with fibre\n* so:\n\t* rochihai -> to cook rice / prepare rice\n\t* rochihainai -> to gain fibre by eating rice / the process of preparing rice\n* it might be hard to grok initially, but once you understand the core concept, it should be as easy as counting on your fingers\n* I'll do it with another noun\n\t* let's use 'asa,' which can mean 'house:'\n\t\t* you eat, sleep, cook, work, and relax here\n\t\t* this noun protects you\n\t* so:\n\t\t* asahai -> to live at a specific place (i.e., home)\n\t\t* asahainai -> to be protected by a specific place (i.e., home)\n* and yes, **hainai** is not the same as **naihai**:\n\t* rochinaihai -> to experience eating rice / to eat rice in a specific way (e.g., slowly or fast)\n* and if you use **hai** on an explicit or default verb, then it describes the canonical way to operate on the verb/event itself:\n\t* hateruhai (`run.V.PLAT-ANTIPROD.V`)\n\t\t* so, what do you think is the canonical way to operate on running? it could be described as a fast alternating gait cycle, where one leg is on the ground (stance) and the other in the air (aerial), working in coordination with the opposite arm to maintain balance\n\t\t* now, you could use this to describe stuff like cycling, especially swift cycling\n\t\t* the implications are limited only by your imagination!\n* so do use **hai** (`ANTIPROD.V`) with care!\n\n## 0.10 The person particle\n* the person particle (PERS) is not really a 'person' particle\n* it is used for any non-Tawish word, including loans like Duragin (dragon)\n\n## 0.11 Independentising and backshifting\n* *ppu* lets any bound morpheme become an unbound one and affect anything coming after it:\n\t* *itappu korteisan* -> `PRTV-INDEP kill.PROD-3SG.F.POSS`\n\t\t* \"About her death / murder\"\n\t* *korteisan itahi* -> `kill.PROD-3SG.F.POSS PRTV-BACK`\n\t\t* \"About her death / murder\"\n* on aspect, it would be **rehi / reppu**\n* the *il* form of the definite article is used if INDEP or BACK needs to be attached to it, like *ilppu* or *ilhi*\n* see the relevant grammar sheet *Grammar:3* for more information.\n\n## 0.12 Modifiers\n* modifiers are derivational particles\n* o-roots must inflect to the modifier's ending\n* otherwise, do not use modifiers generally:\n\t* *hari jitei* -> exchange place (e.g., trading area, market), though haritei alone can work for this\n\t* *ii hon* -> good person\n* if you must disambiguate, a modifier is recommended:\n\t* *asa ni naranã* -> the house is mysterious\n* see Grammar:2 for more information\n\n## 0.13 To use *ea* or to not use *ea*\n* *ea* is a movement particle\n* as a modifier, it just signals 'this thing can move'\n* it is better to use it this way, like in natseeã (moving block / cube), which could be a trolley or cart\n* *tawa natse* would be less self-explanatory\n\n## 0.14 Phrasal modification\n* instead of inflection or aggressively modifying roots, make use of *-hi* or *-ppu*\n* *-ppu* lets any root or particle modify everything that comes after, and *-hi* before:\n\t* *reppu nuku kanata shi na′a tawa jinqõ* -> `IPFV.INDEP heart.V.PLAT happy COND 1PL-A go LOC-INV-ACC`\n\t\t* \"(I) will feel happy if we go out\"\n\t\t* note:\n\t\t\t* *ji* + *-nq* + *-õ* automatically specifies *ji* as a noun\n\t\t\t* *-nq* is used for roots (as opposed to *-nh* for grammatical particles), so *jinq* actually, whilst also inversing, turns *ji* into a noun\n\t\t\t* the accusative *-õ* is the biggest hint in the end\n* this works with modals too:\n\t* _su ni iinq hon meromhohi, mo mo korrumasrra!_ -> `1SG TOP good-INV person try.IRR.N.PLAT.BACK then then kill.V.PLAT-AG-NEG`\n\t- \"I might be a bad person, but I am (certainly not) a killer!\"\n    - _mo mo_ has a tendency to create strong contrastives, so 'certainly not' is automatic here\n\n## 0.15 Compounding\n* Tawa loves compounding, so do make extensive use of it!\n* for example, verbs are frequently compounded:\n\t* *kiukennanda* -> `fly.NMLZ-down`\n\t\t* \"flying down\"\n\t* *senodzunanda* -> `send.V.PLAT-down`\n\t\t* \"to send down\"\n* see these two sentences, for example:\n\t* *honmyã ni senodzunanda Grránd-Cányín'ikullanh* -> `person-QNT.MOD TOP send.V.PLAT-down grand-canyon-PERS-ABL`\n\t\t* \"Many people plunge off the Grand Canyon\"\n\t* *zhupil ni hateruthunandanq asagalnin* -> `spider-DEF TOP run.V.PLAT-PFV.V.PLAT-down-INV house-side-DEF-PER`\n\t\t* \"The spider ran up the wall\"\n* so always use compounding for modification whenever possible; the particles -ã and -bu aren't meant to take on these roles\n* haterunandã would be to 'run downingly' and haterunandabu is even worse, meaning 'to run downishingly'\n\t* if you want to say that their running was 'down' in some manner, go wild\n\t* and if you want to say it was approximately down or had a property of down, sure, -bu works\n\t* but otherwise, use compounding!\n\n### 0.15.1 Spoken register\n* in the modern Tawish spoken register, you try to keep words as simple as possible\n* so instead of:\n\t* **kitakamenkanata** `like-eat.NMLZ-happy`\n\t\t* 'like to eat happily'\n* just say either one of these three:\n\t* **kitaũ kanatakamu**\n\t\t* simplest; `like-VLNK happy-eat.V.PLAT`\n\t* **kitaũ kanatakamu**\n\t\t* usually never used; `like-VLNK happy-eat.V.PLAT`\n\t* **kitaũ kamukanatã**\n\t\t* archaic; `like-VLNK eat.V.PLAT-happy.MOD`\n* note that total compounding, like **kitakamenkanata** or similar forms in other words is often utilised in poetry\n* or in short speech, one can quickly say **a kitakamu hya?** `AGT like-eat.V.PLAT Q` to convey 'do you like to eat?'\n* so, when you speak in Tawa, always think:\n\t* is compounding simpler?\n\t* is it easier to parse and understand?\n\t* is it shorter and faster to say?\n* and then accordingly construct your sentences.\n\n### 0.15.2 ′O-root compounding\n* if the root you're compounding is an ′o-root, then the ending changes to the appropriate modifier particle and is placed after the word meant to be modified\n* here are some examples:\n\t* **utari** (sing) + **miro** (reflect)\n\t\t* **utarimirã** (melodious reverberations)\n\t* **kiteki** (thing) + **kamo** (food)\n\t\t* **kiteikambu** (a sort of edible item, a foodish item, an item with (some or any) property of food\n\n## 0.16 Actor and undergoer\n* Tawa uses two main particles for marking the subject:\n\t* **-a** -> actor particle, glossed `A`\n\t\t* focuses the agent, doer, or actor\n\t* **-o** -> undergoer particle, glossed `U`\n\t\t* focuses the sufferer, undergoer, or patient\n* Use *a* to mark the doer of an action:\n\t* *kamuthu hya?* `eat.V.PLAT-PFV.V.PLAT Q` -> \"Have (you) eaten?\"\n\t* *sua hateruthu* `1SG-A run.V.PLAT-PFV.V.PLAT` -> \"I ran\"\n* Use *o* to mark an entity being affected by something:\n\t* *sao koru* `3SG.F-U kill.V.PLAT` -> \"She was killed\"\n* The *a* `A` particle only marks the doer; however, it does not necessitate that a verb must follow; instead, any word type can follow, and the sentence is parsed depending on the word type:\n\t* *sua iitei* `1SG-A good-PROD` -> \"I am good\"\n* Compare these sentences:\n\t* *sao koru* `3SG.F-U kill.V.PLAT` -> \"She was killed\"\n\t* *sao korunai* `3SG.F-U kill.V.PLAT-IV` -> \"She died\"\n\t* *sa′a korunai* `3SG.F-A kill.V.PLAT-IV` -> \"She died\"\n\t* *sa ni korunai* `3SG.F TOP kill.V.PLAT-IV` -> \"She is / has dead / died\"\n* You might be confused: don't they all mean the same thing?\n\t* **sao koru**\n\t\t* the focus is on the death 'inflicted' upon her\n\t\t* a killer is implied (could be a disease poetically)\n\t\t* *koru* is transitive\n\t\t\t* \"she is killed\"\n\t* **sao korunai**\n\t\t* the focus is on her as the undergoer of death; no killer is implied\n\t\t* *korunai* is intransitive\n\t\t* `{UNDERGOER}o {VERB}nai` constructions are always used to place focus on the undergoer\n\t\t\t* \"she dies\"\n\t* **sa′a korunai**\n\t\t* the focus is on her as the agent of death here\n\t\t* so this automatically implicates her in her dying\n\t\t* `{ACTOR}a {VERB}nai` constructions are always used to place the focus on the agent\n\t\t\t* \"she deliberately died\"\n\t\t\t* \"her death was her fault\"\n\t\t\t* \"she chose to die\"\n\t\t\t* \"she killed herself\"\n\t* **sa ni korunai**\n\t\t* the topic particle changes the meaning here a little\n\t\t* the focus is on the death itself or the state itself\n\t\t\t* \"(as for her), she (is) dead\"\n\t\t\t* \"she is currently dead\"\n\t\t\t* \"she isn't alive\"\n* Let's look at some other examples:\n\t* *sua harinai samiõ hariasalji* -> `1SG-A trade-IV fish-ACC trade-house-DEF-LOC`\n\t\t* ~\"I purchase fish at the market\"\n\t* *sua kachi samiõ* -> `1SG-A bite fish-ACC`\n\t\t* ~\"I bite the fish\"\n\t* *suo kachinai samilnin* -> `1SG-U bite-IV fish-DEF-PER`\n\t\t* ~\"I am bitten by the fish\"\n\t\t* here, the focus is on you; a natural response would be to inquire about where the fish bit you\n\t* *suo kachi samiõ* -> `1SG-U bite fish-ACC`\n\t\t* ~\"I undergo eating the fish\"\n\t\t* here, the focus is the 'eating' inflicted upon you; by default, this does not carry any hints of 'force' or 'unwillingness,' but a natural response after saying this would be **ii hya?** ((was it) good?)\n\t* *sua kachinai samilnin* -> `1SG-A bite-IV fish-DEF-PER`\n\t\t* ~\"It is my fault that the fish bit me\"\n\t\t* here, the focus is on you as the agent who brought about your being bit by the fish\n\t* *sua kachi samilõ* -> `1SG-A bite fish-DEF-ACC`\n\t\t* ~\"I bite the fish\"\n\t\t* plain old construction\n\t* *su ni kachi samilõ* -> `1SG TOP bite fish-DEF-ACC`\n\t\t* \"(As for me), I bite the fish\"\n\t\t* here, 'su' (1SG) becomes less relevant as opposed to 'sua' (1SG-AGT), where it is important\n* As a rule of thumb:\n\t* use **-a** for most verbs or active constructions, where the subject revolves around the sentence\n\t* use **ni** for statives or introducing information that is secondary to the thing you really want to talk about\n* Take notice:\n\t* **sua kikitanyu zu** -> `1SG-A SUP~like-V.ROM 2SG`\n\t\t* ~\"I love you\"\n\t\t* more about your love, less about them\n\t* **(su ni) kikitanyu zu** -> `1SG TOP SUP~like-V.ROM 2SG`\n\t\t* ~\"(I) love you\"\n\t\t* more about them and how much *they* are loved\n\t* since the language is pro-drop by default, *ni* constructions are often automatic if you drop the pronoun:\n\t\t* **kikitanyu zu** -> automatically becomes about them and how much they are loved\n* However, this isn't absolute, as stative- or copular-like constructions usually prefer *ni*\n\n## 0.17 Pronoun omission\n* in most contexts, complete omission of the pronoun is fine\n* just say *kamuthu* ('ate') and it'll be understood as 'I ate'\n* if it ever becomes ambiguous if the person you're referring to is an undergoer or actor, just use the particle **u** or **a** respectively without needing to specify the pronoun\n\n### 0.17.1 Anaphoric pronoun\n* the anaphoric pronoun is simply a way to repeat an entire phrase, sentence, or predicate\n* for example:\n\t* *kamuthu samil hya?* -> `eat.V.PLAT-PFV.V.PLAT fish-DEF Q`\n\t\t* \"(Did you) eat the fish?\"\n\t\t* a speaker can respond to this with:\n\t\t\t* *eirrireu* -> `ANAPH-AFFIRM-IPFV.V.PLAT`\n\t\t\t\t* \"Yes, (I) will (eat it)\"\n\t\t\t* *eirrareu* -> `ANAPH-NEG-IPFV.V.PLAT`\n\t\t\t\t* \"No, (I) won't (eat it)\"\n\t\t\t* *eirri* -> `ANAPH-AFFIRM`\n\t\t\t\t* \"Yes, (I have eaten it)\"\n\n### 0.17.2 Dummy pronoun\n* *wu* can be used as a dummy pronoun, like the English **it**; however, this kind of usage is highly discouraged against and is not frequent in the Modern Tawish spoken register\n* for example:\n\t* *wu ni ii* -> `3SG TOP good`\n\t\t* ~\"It is good\"\n\t* would have the potential to confuse listeners\n\t* instead, be more verbose, descriptive, or make use of the proper demonstrative\n* in Modern Tawa, **wu** is commonly used for 'they/them' (in English)\n\n## 0.18 Case binding\n* case binding refers to when case particles are used as unbound morphemes\n* this happens in sentences like:\n\t* *bunisun ni ji hyo?* -> `tea-1SG.POSS TOP LOC OPEN.Q`\n\t\t* lit. \"(As for) my tea, (it) is where?\"\n\t\t* ~\"Where is my tea?\"\n\n### 0.18.1 Question construction\n* **basic**\n\t* *fuyu wan hyo?* -> which one?\n\t\t* *zua subu fuyu atora hyo?* -> `2SG-A desire.V.PLAT what apple OPEN.Q`\n\t\t\t* \"What / which apple do you want?\"\n\t* *fuyu asa hyo?* -> what house?\n\t\t* *teqeka asalõeu miriji no wutachilú hyo?* -> `recount.EMO house-DEF-ACC-REL.COP middle-LOC GEN three-road-DEF.PL OPEN.Q`\n\t\t\t* \"(Do you) remember the house standing where the three roads meet?\"\n\t* *tan hyo?* -> why?\n\t* *tachi hyo?* -> how?\n\t* *fuyu hyo?* -> what?\n\t* *ji hyo?* -> where?\n\t* *un hyo?* -> with (whom, what)?\n\t* *nin hyo?* -> through (whom, what)?\n\t\t* archaic form\n\t\t* use *un* unless you want to sound over-the-top (it's like saying **'I must make use of the sophisticated plumbing fixture designed for the disposal of human bodily waste to relieve myself'** instead of **'I gotta poop.'**)\n\n## 0.19 Vowel devoicing\n* when an ′o-root combines with a particle, such as in the case of *fofotei*, the vowel *o* is devoiced:\n\t* *fofo* + *-tei* -> *fofotei* [ɸoɸo̥tei]\n\t* *nuko* + *-sun* -> *nukosun* [nuko̥sʊn]\n* this only happens in case of **′o-preservation** when it cannot be omitted due to consonant cluster restrictions\n\n### 0.19.1 Epenthensis\n* epenthensis occurs when a non-nasal consonant cluster is forced, like in *ainàwatfofotei* (~clever quotes / sayings)\n* it is the insertion of a devoiced schwa:\n\t* *ainàwa* + *-t* + *fofo* + *-tei*\n\t\t* *ainàwatfofotei* -> [ainəwatə̥ɸoɸo̥tei]\n\t* *ainàwa* + *-t* + *-sta*\n\t\t* *ainàwatstafofotei* -> [ainəwatə̥sə̥taɸoɸo̥tei]\n* epenthensis also occurs during liquid clashes:\n\t* *sami* + *-l*  + *-rra*\n\t\t* *samilrra* -> [samilə̥ɾa]\n* epenthensis also occurs in constructions like:\n\t* *subuthu* -> `desire-PFV.V.PLAT` (wanted)\n\t\t* here, **subuthu** is actually like *sub(à)thu* in pronunciation\n\t\t* it is pronounced [subə̥tʰu]\n\t\t* it is written *subuthu* because the older Modern Tawish Standard had different grammatical rules\n\t\t* this is due to pure diachrony\n\t\t* this happens with all similar cases, like *hateruthu* [hateɺə̥tʰu]\n\n## 0.20 Vowel marking\n* in casual writing, vowels are usually left unmarked\n* so:\n\t* *samilos*\n\t* *ainawa*\n\t* *samilu*\n* ... is fine\n* they are only marked when ambiguous\n\n## 0.21 Usage of the genitive\n* the genitive *no* is used to show belonging or possession:\n\t* *pashache no onokoi no pashacha...* -> `sibling-M.ROM GEN friend GEN sibling.F.ROM`\n\t\t* \"The brother's friend's sister...\"\n* the order is essentially the same as **Urdu** or **Japanese**:\n\t* *bhai ke dost ki behen* -> `brother GEN.M friend GEN.F sister`\n\t\t* \"The brother's friend's sister...\"\n* its semantic space is almost the same as 'of' in English:\n\t* *zhamu no asa* -> `god GEN house`\n\t\t* \"House of God\"\n\t* *asa no zhamu* -> `house GEN god`\n\t\t* \"God of House(s)\"\n* you can also use it for composition (both literally and metaphorically), like:\n\t* *serebotei no hon* -> `silver-PROD GEN person`\n\t\t* ~\"Man of steel\"\n\t\t* \"Man of silver\"\n\n### 0.21.1 Case replacement\n* *no* is very good at replacing cases or complex descriptions:\n\t* *ngoshi ni yaranai asalla no nanda* -> `bird TOP come-IV house-ALL GEN down`\n\t\t* lit. \"The bird came to the down of the house\"\n\t\t* \"The bird came to the house's porch / floor\"\n\t* *sua au tetenq no tete* -> `1SG-A HAVE.V.PLAT hand-INV GEN hand`\n\t\t* lit. \"I have foot of hand\"\n\t\t* ~\"My hands are where my feet are\"\n\t\t* ~\"I have feet for hands\"\n\t* *zua au atora no riwakango* -> `2SG-A HAVE.V.PLAT apple GEN think-SRC.WHOLE`\n\t\t* lit. \"You have apple of brain\"\n\t\t* ~\"You have an apple for a brain\"\n\t\t\t* **p.s.** this is a vulgar expression, better translated as 'you have tits for a brain'\n\t\t\t* it can refer to creepiness, pervertedness, or extreme idiocy\n\n### 0.21.2 Nominaliser or causal final\n* in the Modern registers (Ashi Tawa and Koyeah Tawa), it can nominalise:\n\t* *dakareu mafol no ya* -> `steal-IPFV.V.PLAT red-DEF NM ASSERT`\n\t\t* \"Going to / will take the red one\"\n\t* *pokil no ya* -> `big-DEF NM ASSERT`\n\t\t* \"The big one\"\n* even *fuyu no* (what (one) / what thing / which) is fine\n\t* *fuyu no hyo?* -> `what NM OPEN.Q`\n\t\t* \"Which one? What (thing)?\"\n* it can also strengthen assertion or add a 'stop asking me anymore' nuance:\n\t* *unsa yaranai ni tachiryãl no ya* -> `life-A come-IV TOP way-DEM.MED.MOD-DEF NM ASSERT`\n\t\t* lit. \"This is the way (that) life unfolds / comes\"\n\t\t* ~\"It is how it is - life just unfolds like that\"\n\n## 0.22 New question system\n* the Modern Tawish question system does not use *hya* (polar question) or *hyo* (non-polar question) markers\n* instead, it uses the genitive *no* for this\n\n### 0.22.1 Basic questions\n* *ii no?* -> `good Q`\n\t* \"(Are you) good?\"\n* *kamthu no?* -> `eat.PFV.V.PLAT Q`\n\t* \"(Have you) eaten?\"\n* *yara byõ no?* -> `come DEM.PROX.ACC Q`\n\t* \"(Can you) come here?\"\n\n### 0.22.2 Mood questions\n* combine *no* with a **mood** particle to derive special question statements:\n\t* *hateru akeno?* -> `run.V.PLAT IMP-Q`\n\t* *hateru keno?* -> `run.V.PLAT IMP-Q`\n\t\t* same harshness as \"(Can you) run (already)?!\"\n\t\t* don't say to strangers\n\t\t* p.s., **keno** is a variant (it uses a form of **ake**, which is **ke**; it's the same)\n\t* *hateru aikono* -> `run.V.PLAT IMP.Q`\n\t\t* \"(Could you) run?\"\n\t\t* a command wrapped as a question\n\t\t* the most polite way to ask or command\n\t* *hateren areno?* -> `run.V.PLAT OPT.Q`\n\t\t* \"(Might you, mayhap) run?\"\n\t\t* or *niru wu areno?* -> `see.V.PLAT 3SG OPT.Q`\n\t\t\t* \"(Would that I might) see them?\"\n\t\t\t* \"(Could it be that I should) see them?\"\n\t\t\t* \"(May I wish) to see them?\"\n\t\t* an optative question\n\t\t* it's like asking a question about a wish or potential reality\n\t* *subũ fu ei natai?* -> `desire.VLNK ACT ANAPH Q.DES`\n\t\t* \"(Do you have the desire to) want to do this?\"\n\t\t* \"(Is your soul currently leaning towards) doing this?\"\n\t\t* a desiderative question\n\t\t* it's about appetite or the internal emotional longing to do something\n\t\t* in the *natai* form, it is not as strong as the formal or poetic forms:\n\t\t\t* **hya′atai** -> e.g., \"do your heartstrings swing towards this?\"\n\t\t\t* **hyatai** -> e.g., \"tell me about your missing them\"\n\t* *mha lyõ ipano?* -> `PRF DEM.DIST.ACC EPIST-Q`\n\t\t* \"(Must he be) there already?\"\n\t\t* \"(Might he be) already there?\"\n\t\t* the strongest form is **ipipano**\n\t\t\t* *mha lyõ ipipano?* -> must he be there already?\n\t\t* and the weakest is **ipastano**\n\t\t\t* *mha lyõ ipastano* -> is he there already? / might he be there already?\n\t\t* you can also use evidentials:\n\t\t\t* *ipaniro no* -> e.g., ~did you see it with your own eyes?\n\t\t\t* but this isn't one particle, it's two working together\n\n## 0.23 Mood stacking\n* you can use multiple moods in a sentence:\n\t* *are* + *atai* -> \"wish for an emotional longing\"\n\t\t* **su ni ze are niruatai sa** -> `1SG TOP ITER OPT see.V.PLAT-DES 3SG.F`\n\t\t\t* \"I wish that I could miss her again\"\n\t\t* **su ni ze areatai kamu** -> `1SG TOP ITER OPT-DES eat.V.PLAT`\n\t\t\t* \"I wish that my soul starts leaning towards eating again\"\n\t\t\t* can describe times where you want to enjoy food but are sick or don't want to eat\n\t\t\t\t* it may be inherently contradictory, but humans say conflicting things all the time!\n\t* *are ieii suji, anasai?* -> `OPT AUG-good 1SG-DAT AFFEC-AFFEC.REQ`\n\t\t* \"(I) wish that you were better to me, (you know?)\"\n\t\t* this is an incredibly heart-breaking sentence\n\t\t* **anasai** and **are** both work here to set the scene for deeply intimate and personal wish to a person\n* and in a similar fashion, you may stack other moods\n* do note that **moodstacking** and **mood questions** are usually never used in spoken Tawa or the Modern Tawish register\n* these are highly formal, literary, or poetic forms\n\n## 0.24 Pronoun ambiguity\n* The English sentence \"Paul told John about his brother,\" it isn't clear who's brother without much context\n* in Tawa, you can resolve this by:\n\t* **Jon ni fofu *Pol'ikuji pashachesonita*** -> `john TOP speak.V.PLAT paul-PERS-DAT sibling-M.PLAT-3SG.M.POSS-PRTV`\n\t\t* \"(As for) John, (he) told Paul about his (Paul's) brother\"\n\t\t\t* since **John** is topicalised, it is natural to assume that Paul's brother is being talked about\n\t* **Pol'ikuo fofu *Jonun pashachesonita*** -> `paul-PERS-U speak.V.PLAT john-COM sibling-M.PLAT-3SG.M.POSS-PRTV`\n\t\t* \"Paul (undergoes) telling by John about his brother\"\n\t\t\t* since Paul is now being told by John about his brother, it is naturally assumed that John's brother is the one Paul's being told about\n\t* notice: when John and brother are near each other, it is understood as John's brother, and when Paul and brother are near each other, it is understood as Paul's brother\n\n## 0.25 Explanation of *ni*\n* *ni* at its core isn't much different than saying \"as for (X)...\" in English or *wa* (は) in Japanese:\n\t* *su ni atoraõ kita* -> `1SG TOP apple-ACC like`\n\t\t* \"As for me, (I) like apples\"\n\t* *so ni kitanqũ kamu atora* -> `3SG.M TOP like-INV-VLNK eat.V.PLAT apple`\n\t\t* \"As for him, (he) hates (to) eat / eating apples\"\n\t\t* (!) *p.s.* see the difference between **a / o / ni** in terms of marking the subject in **0.16**\n* However, it can be used similarly to a copular (one of the most common uses):\n\t* *su ni Miku'iku* -> `1SG TOP miku-PERS`\n\t\t* \"As for me, I am Miku\"\n\t* *su ni ii à!* -> `1SG TOP good INTERJ`\n\t\t* \"As for me, I am good!\"\n\n### 0.25.1 Topicalisation\n* *ni* topicalises anything, including entire clauses and sentences:\n\t* *Atoraolmyã, kitaũ kamu ni iinq...* -> `apple-EXCESS-QNT.MOD like-VLNK eat.V.PLAT TOP good-INV`\n\t\t* ~\"It's bad that I eat so many apples\"\n\t\t* lit. \"As for my liking to eat too many apples, it is bad\"\n\n### 0.25.2 Context\n* *ni* allows you to add as much context as you want regarding a specific topic:\n\t* *So ni sua kikitanq. Ni ieiinq - daka kiteisunõ, kamu kamteisunõ... ni yawanigãnq* -> `3SG.M TOP 1SG-A SUP~like-INV | TOP AUG-good-INV | steal thing-1SG.POSS-ACC eat.V.PLAT food.PROD-1SG.POSS-ACC | TOP demon-cat.MOD-INV`\n\t\t* ~\"I hate him. He's so bad - he steals my things, eats my food... he's just a dog who brings misfortune (to me)\"\n\t\t* p.s. **yawanigãnq** is a severe curse, almost to the level of slurs in English\n\t* *Ni sua riwakame kiteisubekã byieji ni, yad, yawã* -> `TOP 1SG-A think-REL thing-all.MOD DEM.PROX.AUG-LOC TOP so demon.MOD`\n\t\t* \"(As for me), I think that everything near / around here (~these parts) is f!%ked.\"\n\n### 0.25.3 Compared to *a*\n* *a* marks the actor\n* If used with an incompatible word type (e.g., adjective), it marks the subject\n* It's about 'identification'\n* Notice and compare:\n\t* *Nigo ni meiya* -> `cat TOP fluffy`\n\t\t* \"As for cats, **they are cute**\"\n\t* *Niga meiyã* -> `cat-A fluffy.MOD`\n\t\t* \"**It is the cats** that are cute\"\n\t\t* the little nuance is that specifically the cats are cute\n\t\t\t* e.g., if your friend was showing you pictures of his pets, you'd say this over *nigo ni meiya*, as that implies the cats are cute only generally speaking\n\n### 0.25.4 Contrast and softening\n* In Modern Tawa, you can use *ni* for contrasts too:\n\t* *So ni ii, sa ni rra* -> `3SG.M TOP good 3SG.F TOP NEG`\n\t\t* \"He is good, (but) she is not\"\n* It implies an unspoken **but**, like here:\n\t* *Chi ni a chihai* -> `water TOP A water-ANTIPROD.V`\n\t\t* \"As for water, I'll drink it\"\n\t\t\t* however, let's say a friend offers you a meal\n\t\t\t* you say the aforementioned sentence\n\t\t\t* in that circumstance, you are essentially saying 'I'll drink water at the very least,' or that you don't want all of the meal\n* If *ni* is at the end of a sentence, it can soften a sentence:\n\t* *Zuõ, kikita ni!* -> `2SG-ACC SUP~like TOP`\n\t\t* \"You, (I) love (know it personally)!\"\n\t* *Kikita zuõ ni* -> `SUP~like 2SG-ACC TOP`\n\t\t* \"(I) love you, (really, you know?)\"\n\t* if anything apart from applicable and compatible moods (e.g., **ana, sai**) comes after *ni*, then the grammar could or would break\n\n## 0.25 Some cultural notes\n### 0.25.1 Mood\n* use the formal *hyo* and *hya* particles when asking strangers or anyone you don't know well\n\t* it is generally rude to use *no?* like that\n* using the *ake* imperative (sentence-initial) is very rude\n\t* the *aiko* (sentence-final) form is used, especially for strangers\n\n### 0.25.2 Genderlectical particles\n* *ni* is not used by men at the end of sentences\n\t* men would use *ana*\n\t* using *ni* is highly derogatory, especially towards women, if done by a man\n* men use the *anafuka* (`AFFEC-REQ`) construction for intimate or personal requests, whereas women use *sai* (`AFFEC.REQ`)\n\t* a man's usage of *sai* is (quite) creepy\n\n### 0.25.3 Certain words\n* words like *maku* and *esace* are severe and induce shock\n* always use the diminutive forms (*makusta* and *esacesta* respectively) for general, everyday usage, like 'cry' or 'bleed / hurt'\n* in their base form:\n\t* *maku* is weeping from severe, heartwrenching, gut-twisting sorrow\n\t* *esace* encodes the feeling of twisting one's balls 360 degrees and then again 2 times\n* also, non-shock words like *kowaisoho* are to be used carefully\n\t* *kowaisoho* means \"snake\" and it is fine to use it for snakes\n\t* but using it for food is a direct and derogatory insult to the maker of the food or the food itself\n\t\t* in Tawa, food is highly respected, as it is what keeps you alive\n\t* if you are served food that looks long, calling it *kowaisohã* is like calling it a 'turd'\n\t\t* this would hurt the feelings of the maker and would be like screaming every ethnic slur in a group of ethnically diverse individuals if others hear you\n\n### 0.25.4 Romantic-platonic distinctions\n* in Ashi Tawa, *-(r)u* is often used as a general verb\n* it has kind of lost some nuance, so if you say *-(r)u* for anything non-romantic, that's fine\n* for genuine romantic verbs, though, like *love*, you must use **nyu**\n\t* this is non-negotiable\n\t* when you mean something as romantic, mark that root, verb or noun or not, as romantic\n* however, referring to or using romantic verbs or nouns for something that isn't romantic is either creepy, perverted, or crass, or rude:\n\t* using *kamnyu* for eating an apple is perverted and gross\n\t* using *kitanyu* for a friend is rude and also could even hurt their feelings (if you aren't romantically involved)\n\t\t* apart from being rude, this is also a major lie\n\t\t* if not romantically involved, the person who said *kitanyu* will be viewed as perverted or a liar, or worse, both\n\n## 0.26 The valency inverser\n* the valency inverser *-nai* is deceptive in name\n* it may inverse valency (active<->passive) but... it's very sneaky - it does many things\n* look at this sentence, for example:\n\t* *Harinai baitaõ* -> `exchange-IV fruit-PRTV-ACC`\n\t\t* wtf?! how is the passive verb *harinai* (from **hari**, 'to exchange / strike a deal') taking a DIRECT OBJECT?\n* to understand this, stop viewing *-nai* as a simple, static valency inverser\n* Instead, view it as an **argument reductor**:\n\t* *Hari asananõ asasambo* -> `exchange house-1PL.POSS-ACC house-3SG.F.POSS.OPP`\n\t\t* \"I exchanged our house for her house\"\n\t\t\t* see? here, the verb *hari* takes more than one argument\n\t* *Harinai asananõ asasambo*\n\t\t* \"I bought our house instead of her house\"\n\t\t\t* here, *harinai* just means buy, it can't take another argument\n\t\t\t* therefore, \"*asasambo*\" just refers to the other option you ignored\n* this usage is even more prominent with the use of *yara*:\n\t* *Soa yararranai byolla no?* -> `3SG.M-A come-NEG-IV DEM.PROX-ALL Q`\n\t\t* ~\"Didn't he come here?\"\n\t\t\t* **yara** is an ambitransitive verb, since it changes valency depending on argument without needing *nai*:\n\t\t\t\t* *yaraũ shire saita* -> `come-VLNK know 3SG.F-PRTV`\n\t\t\t\t\t* \"Come to know about her\"\n\t\t\t\t\t* ~\"Learn about her\"\n\t\t\t\t* *yaraen hashiru no mahokamas* -> `come-NMLZ child GEN magic-AG`\n\t\t\t\t\t* ~\"(I) am becoming a child's magician / party magician\"\n\t\t\t\t* *mo mo, suo yaraeru ii!* -> `but 1SG-U come-CONT good`\n\t\t\t\t\t* ~\"But, I am being good\"\n\t\t\t\t\t* lit. \"But, I am undergoing coming to good\"\n\t\t\t* this is why **yaranai** is often the standard for 'come' in its normal, intransitive form:\n\t\t\t\t* *Yaranai byolla aiko!* -> `come-IV DEM.PROX-ALL IMP`\n\t\t\t\t\t* ~\"Come here, (now)!\"\n* and also its use in *shire(nai)*:\n\t* using `-nai` decouples the knowledge from the process\n\t* it reduces the verb to a pure, isolated state of possession\n\t\t* *ake shire ryõ!* -> `IMP know DEM.MED.ACC`\n\t\t\t* \"Know this!\"\n\t\t\t\t* as a command, *shire* is an active verb, meaning something like 'do know X'\n\t\t\t\t* you can say *ake shirenai ryõ* but it's clunky for no good reason, since it's like telling someone 'I command you to undergo eating' - what? how do you even command someone to undergo something\n\t\t* *sua shirenai sõ* -> `1SG-A know-MID 3SG.M.ACC`\n\t\t\t* \"I know him\"\n\t\t\t\t* here, *shirenai* is attributing the knowledge of *sõ* (him) to *su* (you)\n\t* so, you'd usually use *shirenai*\n\t* some snippets use *shire* but that is incorrect, since this is the proper Ashi Tawa standard\n* one more thing:\n\t* *-nai* also marks verbs that don't take objects\n\t* for example, take this sentence:\n\t\t* *Kamuthunai hya?* -> `eat.V-PFV.V.PLAT Q`\n\t\t\t* \"Have you eaten?\"\n\t* here, *kamuthu* takes no objects, and since *kamuthu* is strongly transitive, *-nai* reduces an argument; therefore, *kamuthunai* (to have eaten) is used\n\t* even though *kamuthu hya?* is actually grammatically allowed and permissible, the (preferable and) **more formal or polite** construction is *kamuthunai*\n\n## 0.27 Dictionary inaccuracies\n* some sentence examples in the dictionary's semantic space may be incorrect\n* if unsure, try to reconstruct them yourself or translate them from Japanese, since Tawa is closer to Japanese than it is to most other languages\n","1 Roots.md":"## 1.1 Structure\n* Word order is SVO\n* Modifiers go before the root\n* Syllable structure is simply CVC with little to no restrictions\n* **Root** words must be (C)V(N)\n","2 Derivation.md":"## 2.1 Social connotation\n| Particle | IPA     | Gloss    |\n| -------- | ------- | -------- |\n| nya      | `nʲa`   | F.ROM    |\n| nye      | `nʲe`   | M.ROM    |\n| ĉa      | `tɕa`   | F.PLAT   |\n| ĉe      | `tɕe`   | M.PLAT   |\n| óí     | `ɔj~ɔɪ` | POSITIVE |\n| t        | `t`     | NEGATIVE |\n| rei      | `ɺei`   | INANIM   |\n| mei      | `mei`   | ANIM     |\n| qe       | `c͡çe`  | EMO      |\n* *kanojnya* `partner.F.ROM`: girlfriend\n* *kanojnye* `partner.M.ROM`: boyfriend\n* *kanojĉa* `partner.F.PLAT`: female friend (platonic)\n* *kanojĉe* `partner.M.PLAT`: male friend (platonic)\n* *kanojóy* `partner.POSITIVE`: assistant, helper\n* *kanojot* `partner-NEGATIVE`: accomplice\n* *kanojorei* `partner-INANIM`: deceased partner, soulless partner\n* *kanojmei* `partner.ANIM`: lively/enthusiastic partner, alive partner\n* *kanojqe* `partner.EMO`\n\t* highly context dependent; roughly means the 'emotion' or 'feeling' you get from your partner\n* *-qe* can also be used in the sense of:\n\t* *kamteiqe* `eat.PROD.EMO`: the feeling one gets from food\n\t* or simply *kamqe* `eat.EMO`: the feeling one gets from eating\n\t\t* and these may mean 'taste,' like here:\n\t\t\t* *kamqel no kekàsun hyo?* `eat.EMO-DEF GEN cake-1SG.POSS OPEN.Q`\n\t\t\t\t* lit. \"The taste of my cake?\"\n\t\t\t\t* ~\"How did my cake taste?\"\n* NOTE: *rei* and *mei* can also imply naturalisticness and artificialness!\n\n## 2.2 Semantic particles\n| Particle | IPA       | Gloss  |\n| -------- | --------- | ------ |\n| ku       | `[ku]`    | FIG    |\n| kunh     | `[kun̼]`  | LIT    |\n| ŝite    | `[ɕite]`  | EV.REL |\n| mas      | `[mas]`   | AG     |\n| taĉi    | `[taĉi]` | path   |\n| nampa    | `[nampa]` | number |\n* *ku* and *kunh* discriminate figurative and literal statements:\n\t* *deku zuǫ* `REC-FIG 2SG-OBJ`: I get you (fig.)\n\t\t* here, it means that the speaker emotionally understands the listener\n\t* *dekunh zuǫ* `REC-LIT 2SG-OBJ`: I get you (lit.)\n\t\t* here, it means the speaker has 'physically' or 'literally' received or got this person\n\t\t* it is often a euphemism for sexual intercourse\n* *ŝite* is often dropped in favour of *ẑi* in casual speech; however, it is important in formal conversation, as it adds explicit spatial context, whereas *ẑi* can be ambiguous in that it is used for temporospatial constructions as a whole:\n\t* *asaŝite ĉiĉ* `house-EV.REL water-N.PLAT`: the house (where water is / where there is water)\n\t* *asaŝite sao korrunai* `house-EV.REL 3SG.F-SUFF kill.V.PLAT-IV`: the house where she died\n* it is also simpler than using *ŝi*:\n\t* *asa ŝi ĉiji* -> 'the house in the context of the water's location'\n\t* *asa ŝi korteisan* -> 'the house in the context of her death / murder'\n* *mas* turns any word into an agentive:\n\t* *kamumas* `eat.V.PLAT-AG`: eater (e.g., connoisseur, food critic, gourmet, etc.)\n\t* *rumas* `CAUS.V.PLAT-AG`: causer (e.g., one who caused something)\n\t\t* in a sentence: *so ni rumasíl no iinqsubeką* `3SG.M TOP CAUS.V.PLAT-AG-DEF GEN good-INV-COLL.MOD`\n\t\t\t* \"He is the one who causes all bad things (to happen)\"\n* *taĉi* is a modifier form of *taĉi* (a realisable thing), used primarily to turn a word into a theory, worldview, or ideology:\n\t* *umataĉi* `community-idea`: a community ideology or theory (e.g., communitarianism, communism, etc.), often used to refer to communism\n\t* *honĉataĉi* `person-F.PLAT-idea`: a woman's ideology or theory (e.g., feminism)\n* *nampa* is similar to *taĉi* in that it is a modifier form of *nampa* (number, amount); it is used to turn a word, often a grammatical particle, into a number:\n\t* *nampa zu / zunampa* `number 2SG / 2SG-number`: two / second\n\t* there is no restriction or strict rules regarding *nampa*'s use, other than that it should be understandable by context\n\t\t* e.g., if a group associates *nanda* (lose) with 'zero,' then *nandanampa* means 0 (for them, as other groups might not associate *nanda* with zero)\n\n## 2.3 Explanation\n* These affixes are not necessary or essential to use\n* Often times, context does the trick\n* They are, however, used when disambiguation is needed or in extravagant, ceremonial, or poetic texts\n* The only affixes that will most commonly be utilised are *-nya*, *-nye*, *-ĉa*, *-ĉe*, *-mas*, *-taĉi*, and *-nampa*.\n\n\n## 2.4 Source-based derivation\n| Base form | IPA   | Gloss     |\n| --------- | ----- | --------- |\n| ngo       | `ŋo`  | SRC.WHOLE |\n| nga       | `ŋa`  | SRC.PART  |\n| ngu       | `ŋu`  | SRC.LEX   |\n| (a)shí   | `əɕɪ` | UNIT      |\n* These particles help with deriving the source of a word\n* They are irregular particles and don't inflect, even if it's an o-root\n* Kamo + ngo -> kamongo (**only**), never kamngo\n* The word for thinking is riwaka and it can also mean brain\n* If you want to explicitly say the brain, you could say:\n\t* *riwakango*\n* Or you could specify exactly which part:\n\t* *riwakanga* (the frontal lobe ~ prefrontal cortex, since that's where thinking occurs)\n* And you may use another word for another brain part:\n\t* *tawakomuninga* (cerebellum ~ basal ganglia)\n\t\t* tawakomuni -> the master of movement\n\t\t* tawakomuninga, therefore, refers to the parts of the brain that primarily control psychomotor coordination\n* The particles are insensitive to valency\n* Korongo (the Angel of Death or Grim Reaper) is not different from **koronaingo** - koronaingo is actually a very redundant construction\n\n### 2.4.1 Primordial or unit particle\n* *-nga* or *-(a)shí* is used for marking or deriving the specific part of a source or the primordial unit or particle respectively\n* Examples:\n\t* *riwakanga* -> `think-SRC.PART`\n\t\t* ~\"frontal lobe, prefrontal cortex, etc.\"\n\t* *riwakashí* -> `think-UNIT`\n\t\t* ~\"neurone, brain matter; concept, symbol, or prototype\"\n\t\t\t* note: **concept, symbol,** and **prototype** here are the 'units' of thought\n\t* *tanshí* -> `source-UNIT`\n\t\t* ~\"atoms\"\n\n### 2.4.2 Lexical source\n* *-ngu* is used for lexical sources\n* This simply refers to the parent category of any root\n* So, mafongu would be 'reddish', since the parent category of 'mafo' (red) is, well, reddish colours\n\t* it would refer to intense, emotional, angry, or 'reddish' colours, as opposed to azhurungu, which are cooler colours like grue\n\n## 2.5 Derivation from bare Tanji\n* From the bare Tanji, which are Tawish kanji radical borrowings, you can derive nouns or contextual products with *-(y)ch* or *-tei* respectively:\n\t* *emetei* -> wing\n\t* *kiukotwana no emetei* -> blades of a fan / propeller / air machine\n\t* *matei* -> flowing water, three drops of water\n\t* *katei* -> rice, rice paddy\n\t* *urutei* -> body, physique\n","3 Basic syntax.md":"## 3.1 Particle table\n| Particle | IPA   | Gloss | Note                                         |\n| -------- | ----- | ----- | -------------------------------------------- |\n| ni       | `ɲi`  | TOP   | New information considered comment           |\n| a        | `a`   | AGT   | Marks the subject as a doer                  |\n| o        | `o`   | SUFF  | Marks the entity being affected              |\n| ǫ        | `õ`  | ACC   | Marks the direct object                      |\n| ppu      | `pːu` | INDEP | Turns a bound particle into a free one       |\n| hi       | `j̊i` | BACK  | Lets the previous clause act as one unit     |\n| nq       | `ɴ`   | INV   | Reverses the semantic content of a word      |\n| nh       | `n̼`  | G.INV | Reverses the semantic function of a particle |\n| nai      | `nai` | IV    | Reverses valency                             |\n| pai      | `pai` | RECP  | Marks reciprocal actions                     |\n\n## 3.2 Accusatives, agents, and sufferers\n* Use *ǫ* to mark accusative for words functioning as verbs that have not been marked verbs:\n\t* *sua kita zuǫ* `1SG-AGT like 2SG-ACC` -> \"I like you\"\n* However, omit *ǫ* if the word is already in its verb form (e.g., *o-words* that accept *(r)u* to turn into an innate verb):\n\t* *sua kamu sami* `1SG-AGT eat.V.PLAT fish` -> \"I eat fish\"\n\t\t* *kamu* is formed from *kamo* + *-(r)u* -> *kamu*\n\t\t* this is only for words that end in *o*; other words, unless they are naturally semantically non-verbs and must be verbalised, never take *-(r)u*\n* See 0:0.19 and relevant sections for information regarding actor/agent and sufferer/patient particles\n\n## 3.3 Independentiser and backshift\n* *-ppu* and *-hi* are similar but not interchangeable particles\n* *-hi* lets a preceding phrase or clause act as one unit, like a variable, and *-ppu* turns a bound morpheme into an unbound one\n* Here is how *-hi* would be used:\n\t* *sua kita zuǫ nihi iią nayét* `1SG-AGT like 2SG-ACC TOP-BACK good-MOD 1PL-BEN`\n\t\t* here, the topic particle *ni* takes *-hi* to let the preceding clause *sua kita zuǫ* act as one unit\n\t\t* this allows *ni* to topicalise an entire sentence and comment on it with *iią nayét* (good for our benefit)\n\t\t* together, it may roughly be translated as: \"My liking you is beneficial for us\"\n* Now, let's take a look at the usage of *-ppu*:\n\t* *llappu asal no riwakatei* `ALL-INDEP house-DEF GEN think-PROD`\n\t\t* \"Towards the house of thought\"\n\t\t* here, *-ppu* lets *-lla* affect the sentence that comes after it\n\t* *ipappu sua kitarra riburyą* `EPIST-INDEP 1SG-AGT like-NEG book-this.PROX.MOD`\n\t\t* \"I guess I do not like this book\"\n\t\t* here, *-ppu* lets the bare evidential *-ipa* act as a standalone particle, indicating uncertainty or belief by default\n* Because using *-hi* in such contexts would require the listener to consciously track the sentence beforehand, *-ppu* is used, and vice versa\n\n## 3.4 Reversers or inversers\n* There are three inversers:\n\t* *nq*, *nh*, and *nai*\n* *nq* turns a word into its antonym, *nh* turns a grammatical particle into its opposite, and *nai* reverses the valency of a verb\n* Examples:\n\t* *nigonq* `dog` -> *nigo* means 'cat,' but *nigonq* means 'dog'\n\t* *llanh* `ABL` -> *lla* is the DAT/ALL case, but *llanh* is ABL\n\t* *korrunai* `die` -> *korru* is a verbal form of *koro* that means 'kill;' *korrunai* means 'die'\n\n## 3.5 Reciprocality\n* *pai* is used to denote reciprocals\n* It usually attaches to *-o* but in those cases, *-o* is omitted and the form *-ppai* is used, like in *suppai* (*su* + *-o* + *-pai*)\n* Here are two examples; in one, it is agentive, and the other sufferer:\n\t* *suppai kamu* -> `1SG-SUFF.RECP eat.V.PLAT`\n\t\t* \"I eat myself\"\n\t* *suapai kamu* -> `1SG-AGT-RECP eat.V.PLAT`\n\t\t* \"I eat by myself\"\n\t\t* \"I eat with myself\"\n* The latter sentence carries a lonely undertone whereas the former is autocannibalistic\n* *pai* is also used in reflexive constructions:\n\t* *suppai jiteku* -> `1SG-SUFF.RECP pee.V.PLAT`\n\t\t* \"I pee myself\"\n\t* compare with:\n\t\t* *suapai jiteku* -> `1SG-AGT-RECP pee.V.PLAT`\n\t\t\t* \"I pee with myself\"\n\t\t\t* \"I pee by myself\"\n\t\t\t* or less commonly \"I pee to (e.g., on) myself\"\n\n## 3.6 Topic\n* *ni* is the quintessential topic particle\n* Since Tawa lacks an English-style copular particle, such as *is*, *ni* is extremely important\n* Its usage is almost identical to the Japanese **wa** (は, ha)\n* Examples:\n\t* *honmafąl ni iią* -> `person-red.MOD TOP good`\n\t\t* \"(As for) the red man, (he is) good\"\n","4 Modifiers.md":"## 4.1 Particles\n| Particle | IPA   | Gloss |\n| -------- | ----- | ----- |\n| ą        | `ã`  | MOD   |\n| no       | `no`  | GEN   |\n| bu       | `bu`  | PROP  |\n| tas      | `tas` | POT   |\n* *ą* is a simple modifier; it is a universal particle\n* modifier order is free; however, when modifiers are chained, you must emphasise modifiers by placing the most emphasised ones closer to the word\n* *bu* is a formal modifier and not a universal particle; whenever possible, *ą* **must** be used instead of *bu*\n* It is an archaic particle that denotes property\n* These two sentences will attempt to differentiate between *ą* and *bu*:\n\t* *asaĉibu* `house-water-PROP` -> \"a slippery, wet, or watery house\"\n\t* *asaĉią* `house-water-MOD` -> \"a water house\"\n\t\t* it may mean 'a home made of water' or 'a slippery, wet, or water home' depending on context\n\t\t* since context is often enough, *-bu* is not usually used\n* *tas* is particle indicating potential:\n\t* *sa au iitaŝíl* `3SG.F HAVE.V.PLAT good-POT-DEF`\n\t\t* \"She has the potential for good / she has good potential\"\n\t* *kikitatas honlén* `SUPR.like-POT person-INDEF`\n\t\t* \"A / any loveable person\"\n\n## 4.2 When to and not to use modifiers\n* Use a modifier if:\n\t* something is being modified\n\t\t* *honmafą* - red person\n\t\t* *kamuhaterą* - eating fast\n* Do not use a modifier if:\n\t* nouns are being compounded:\n\t\t* *soraĉi* - sky-water (rain)\n\t\t* *mafaĉi* - red-water (blood)\n\t* multiple words work together to aid semantics:\n\t\t* *watadà zu* - only you\n\t\t* *ii hon* - good person\n\t\t* *watadà hateru* - only run (and don't do something else)\n* Here are some examples of when and when not to use modifiers:\n\t* *napiteiya* - snake (literally line-reptile); no modifier needed, as it is a noun compound\n\t* *poki kamu* - modifier needed: *pokią kamu* or *kamupokią* (to eat a lot)\n\t* *ii hon* - good person, modifier not needed\n\t* *poki hon* - big person, modifier not needed\n\t* *watadà subo* - only desire, modifier not needed\n* Also, if a word ends in -o, then it must be marked as a modifier, regardless:\n\t* *mafą hon* or *honmafą* - red person\n* Let's see what happens if we did add modifiers to that which did not need them:\n\t* *honiią* - a person of goodness, similar to saying *honme fu iiǫ* (person that does good)\n* To better understand this, think of modifiers as **derivative particles**, not just 'adjectives' or 'adverbs:'\n\t* *hatero* can mean 'fast, run, quick, swift, hurry, chase:'\n\t\t* *kamu hateru* (eat run, literally a compound meaning 'to eat and run')\n\t\t* *kamuhaterą* (eat fast, since *haterą* is now a modifier)\n* Now, a question: will it be:\n\t* *haterutas taĉirei* or *haterutasą taĉirei* to say 'runnable route'\n* If you answered the former, you would be correct\n\t* though the latter is not wrong per se, it is unnecessary\n\t* *haterutas* already implies modification due to *-tas* (potentiality)\n\t* furthermore, modifiers are a sort of derivational particle - here, haterutas does not need to be derived into an adjective form\n\t* also, if you used the construction *haterątas taĉirei*, then that would mean \"a path that can be fast\" or \"fastable path\" (context would be needed!)\n\n## 4.3 Order\n* Emphasis was explained already - place the most notable or emphasised adjectives closer to the word - but for words ending in o, always glue the most notable root to the word as a suffix:\n\t* *sawa honmafą* -> sweet, red person\n\t\t* this person is red, which is most notable, not how nice he is, because humans can be nice but they usually aren't red!\n\t* *mafą sawa hon* -> red, sweet person\n\t\t* here, his niceness is the most notable or emphasised, not his redness - maybe we already know he's a Martian?\n","5 Pronouns.md":"## 5.1 Table\n| Pronominal | IPA  | English equivalent | Gloss |\n| ---------- | ---- | ------------------ | ----- |\n| *su*       | `su` | I                  | 1SG   |\n| *sa*       | `sa` | she                | 3SG.F |\n| *so*       | `so` | he                 | 3SG.M |\n| *wu*       | `ʋu` | it                 | 3SG   |\n| *na*       | `na` | we                 | 1PL   |\n| *zu*       | `zu` | you                | 2SG   |\n| *za*       | `za` | you (pl.)          | 2PL   |\n| *ei*       | `ei` | that (proposition) | ANAPH |\n* Note that each, when functioning as a prefix, denotes number:\n\t* *su* -> ~mono-\n\t* *zu* -> ~bi/di-\n\t* *wu* -> ~tri-\n\n## 5.2 Genitives\n* Genitives are simply marked by appending *-n* [n̻] to the regular pronominal:\n\t* *kamzun* `food.2SG.POSS` -> \"Your food\"\n\t* *kamsun* `food.1SG.POSS` -> \"My food\"\n\t* *asasan* `house-3SG.F.POSS` -> \"Her house\"\n\n## 5.3 Different forms\n* Pronominal possession markers take a *t/d* form if the word ends in the same sequence:\n\t* *Dasun* + *-sun* -> *dasuntsun*\n\t* *Dazun* + *-zun* -> *dasundzun*\n* Pronunciation is self-explanatory\n\n## 5.4 Dropping\n* Pronominals can be dropped\n* Examples:\n\t* *A kamu ya?* -> `AGT eat.V.PLAT Q`\n\t\t* \"(Are you going to) eat?\"\n\n## 5.6 Anaphoric pronoun\n* *ei* is an anaphoric pronoun\n* It simply refers to a situation, event, or proposition\n* Examples:\n\t* *A kamu samil hya?* -> `AGT eat.V.PLAT fish-DEF Q`\n\t\t* \"(Are you going to) eat the fish?\"\n\t* *Sua ei* -> `1SG-AGT ANAPH`\n\t\t* \"I will eat it\"\n* If omitting the whole predicate causes too much ambiguity, then you may repeat it:\n\t* *A kamu sami ya?*\n\t* *Sua kamureu ei*\n\t\t* note: *kamureu* `eat.V.PLAT-IPFV.V.PLAT` is *kamo* + *(r)u* + *reo* + *(r)u*\n\n## 5.7 Dummy pronoun\n* *wu* can function as an expletive, like the English 'it'\n* However, it must never be used this way unless absolutely necessary\n* Other methods of constructing a sentence without using *wu* as an expletive are most preferred\n","6 Degree.md":"## 6.1 Particles\n| Particle | IPA   | Gloss   |\n| -------- | ----- | ------- |\n| nyi      | `nʲi` | AUG.SUP |\n| sta      | `sta` | DIM.SUP |\n| ie       | `ie`  | AUG     |\n| ól      | `ɔl`  | EXCESS  |\n\n## 6.2 Intensification and diminution\n* Order often does not matter\n* Reduplication marks superlatives; here is how it would be done on example roots:\n\t* kuru -> kukuru (e.g., vanta black)\n\t* ii -> ii'ii (e.g., best)\n\t* kanata -> kakanata (e.g., euphoria)\n\t* azuru -> azazuru (e.g., most blue/teal/green)\n* So, reduplication is repeating the initial CV or VC unit, like azuru -> azazuru or kuru -> kukuru\n* If the word is something like **ii** (good), then divide the vowels with a simple *'* (separates morae and is not pronounced as a glottal stop in this case; so **ii'ii** is ['iː.iː])\n* Reduplication and the *nyi* suffix are not interchangeable:\n\t* use reduplication for words that are:\n\t\t* short\n\t\t* monosyllabic\n\t\t* already inflected\n\t\t* taking affixes\n\t* use *nyi* for:\n\t\t* a formal, grand, or emphatic effect\n\t\t* standalone, longer words\n* Let's look at examples of when to and when not to use *nyi* and reduplication:\n\t* *ii* -> ii'ii, never iinyi\n\t* *koha* -> kokoha or kohanyi, both work, but depend on context: kohanyi for the cure of cancer is better than kokoha\n\t* *kanojo*\n\t\t* use *kakanojo* to describe someone you know fairly well, like a (best) friend in kakanojsun (my friend)\n\t\t* use *kanojnyi* to describe someone you know extremely well, like a spouse in kanojnyanyisun (my wife)\n* In the examples, reduplication isn't less strong than *nyi* per se; it's that *nyi* is more emphatic or loaded, so *kanojnyi* naturally carries a soulmate undertone, whereas *kakanojo* is better for really good friends\n* Examples:\n\t* *sa ni kanojstanyasun* -> `3SG.F TOP partner.DIM.SUP-F.ROM-1SG.POSS`\n\t\t* \"She is someone I just started dating\"\n\t* *sa ni kanojnyi* -> `3SG.F TOP partner.AUG.SUP`\n\t\t* \"She is my spouse\"\n\t* *raraŝimas* -> `SUP~teach-AG-AUG.SUP`\n\t\t* \"Full(-time) professor, guru\"\n\t* *raŝinyimas* -> `teach-AG.SUP-AG`\n\t\t* \"Guider, leader, idol, mentour, torch bearer\"\n\t* *raŝimassta* -> `teach-AG-DIM.SUP`\n\t\t* \"Student, learner\"\n\n## 6.3 Augmentatives, excessives, and comparatives\n* By default, *ie* and *ól* function as augmentatives and excessives\n* However, with context, they may be used as comparatives\n* Examples (non-comparative):\n\t* *samiryą ni ieii!* -> `fish-this-MOD TOP AUG-good`\n\t\t* \"This fish is pretty good!\"\n\t* *samiryą ni ii′ii!* -> `fish-this-MOD TOP SUPR-good`\n\t\t* \"This fish is really good!\" / \"This fish is the best!\"\n\t* *samiryą ni nanaŝita!* -> `fish-this-MOD TOP SUPR-warm`\n\t\t* \"This fish is extremely warm!\"\n\t\t* ~\"This fish is too hot!\"\n\t* *samiryą ni ólnaŝita* -> `fish-this-MOD TOP EXCESS-warm`\n\t\t* \"This fish is overwhelmingly scorching, boiling hot\"\n* Examples (comparative):\n\t* *asasun ni iepoki mo asazun* -> `house-1SG.POSS TOP AUG-big than house-2SG.POSS`\n\t\t* \"My house is bigger than yours\"\n\t* *mirol ni ólpoki mo ovsàki* -> `mirror-DEF TOP EXCESS-big than door`\n\t\t* \"The mirror is too big for the door\"\n","7 Nouns and verbs.md":"## 7.1 Particle table\n| Particle | IPA     | Gloss      |\n| -------- | ------- | ---------- |\n| tei      | `tei`   | PROD       |\n| hai      | `hai`   | ANTIPROD.V |\n| (y)ĉ    | `(j)tɕ` | N.PLAT     |\n| nyĉ     | `ɲtɕ`   | N.ROM      |\n| (r)u     | `(ɺ)u`  | V.PLAT     |\n| nyu      | `nʲu`   | V.ROM      |\n| én      | `ɛn`    | NMLZ       |\n| ų        | `ũ`    | VLNK       |\n| ce       | `kʰe`   | LINK       |\n* Tawa generally used to use *v'* (ṽ) for compound; however, Modern Tawa has dropped this particle:\n\t* *soraĉi* -> `sky-water`\n\t\t* \"Sky water (i.e., rain)\"\n\t* *kamĉkitvááf* -> `food-N.PLAT-like.SRC.WHOLE.FIG`\n\t\t* lit. \"food-feeling\"\n\t\t* ~\"taste\"\n* If noun-compounding has to be marked (it usually doesn't), then use *ce*:\n\t* *sora ce ĉi* -> `sky LINK water`\n* *ų* is used to let other verbs modify verbs but not for adverbs\n* Adverbs still use *ą*, like *riwakakikitą* (to think lovingly)\n* Note: nominalised verbs can be \"owned:\"\n\t* *so no fuenlos* -> `3SG.F GEN ACT-NMLZ-INDEF.PL`\n\t\t* \"Doings of his\"\n\t* *fuenzun* -> `ACT-NMLZ-2SG.POSS`\n\t\t* \"Your doings\"\n* *nyu* and *en* always combine to form **nyen** (`ROM.NMLZ`)\n* the *′o* isn't omitted if it results in illegal clustering and in some cases, just the *yu* form is used\n* examples:\n\t* *sowo* -> *sownyu* (no need for *yu*)\n\t* *ainàwa* -> *ainàwanyu*\n\t* *kamo* -> *kamnyu*\n\t* *miyo* -> *miyyu*\n\t* *miro* -> *miryu*\n\t* *nigo* -> *nigyu*\n\t* *ryo* -> *ryyu*\n\t* *hatero* -> *hateryu*\n\t* *iyuko* -> *iyukyu*\n\t* *jiteko* -> *jitekyu*\n\t* *kó* -> *konyu*\n\t* *mono* -> *monnyu*\n\t* *ngopo* -> *ngopyu*\n\n## 7.2 Products\n* *tei* turns any root into its product, but it is context-dependent\n* So, *kamtei* (`eat.PROD`) is food but might be pizza in, for example, a pizza party\n* *ru* is often redundant but sometimes good for disambiguation, like in contexts where a root that is commonly used as a noun is used as a verb\n* *yĉ* takes the form *ĉ* before vowels and nasals other than the bilabial nasal (e.g. in *ĉiĉ* or *honĉ*)\n\t* note: use the *yĉ* form for bilabial nasals\n\t* e.g., **kamo** + **(y)ĉ** -> **kamyĉ**\n* Examples:\n\t* *sua kikitaų riwaka* -> `1SG-AGT SUPR-like-VLNK think`\n\t\t* \"I love to think\"\n\t* *kanojyĉ* -> `partner.PLAT`\n\t\t* \"friend (platonic)\"\n\t* *kanojnyĉ* -> `partner.ROM`\n\t\t* \"partner (romantic)\"\n\t* *sua subu zu* -> `1SG-AGT want.V.PLAT 2SG`\n\t\t* \"I want you\"\n\t\t\t* more platonic or detached; maybe as a friend\n\t* *sua subnyu zu* -> `1SG-AGT want.V.ROM 2SG`\n\t\t* \"I want you\"\n\t\t\t* here, it's explicitly affectionate and intimate\n* Note that *(y)ĉ* (platonic) can also be used to turn something into its formal equivalent and *nyĉ* (romantic) can be used to turn something into its informal equivalent:\n\t* *jiĉ* -> `LOC-N.PLAT`\n\t\t* \"a place (formal)\"\n\t* *jinyĉ* -> `LOC-N.ROM`\n\t\t* \"a romantic place (e.g., a restaurant for dates)\"\n* Though a **date** does not have to be informal, it is informal according to the grammar of the language\n* Also since the grammatical inverser *nh* is never used in cases like *(y)ĉ* and *nyĉ* (separate endings), it, therefore, does not change *(y)ĉ* to function as *nyĉ*; its role is different:\n\t* *jiĉ* -> `LOC-N.PLAT`\n\t\t* \"A platonic place (formal; e.g., clubs)\"\n\t* *jiĉnh* -> `LOC-N.PLAT-INV`\n\t\t* \"A platonic place (informal; e.g., a speakeasy, subversive venue, etc.)\"\n\t* *jinyĉ* -> `LOC-N.ROM`\n\t\t* \"A romantic place (informal; e.g., intimate café)\"\n\t* *jinyĉnh* -> `LOC-N.ROM-INV`\n\t\t* \"A romantic place (formal; e.g., formal dinner)\"\n\n## 7.3 Verb compounding\n* Verbs can be compounded as well:\n\t* *kamu hateru* (eat run, meaning 'to eat and run')\n\t* *rawaru fofu* (sleep talk)\n* But the primary action must come first, so:\n\t* *hateru kamu*\n\t* *fofu rawaru*\n* ... are both disallowed, as one cannot 'talk' first and 'sleep' second, which is why, even in English, it is 'sleep-talk,' not 'talk-sleep'\n\n## 7.4 Parents\n* *hai* marks a parent; i.e., the opposite of tei\n* For example:\n\t* *ĉihai* would be drink or sip, as opposed to ĉiĉ itself, which is any liquid as a noun\n\t* ĉitei would be the product of the action, so **what** one drinks (e.g., water) would be ĉitei (e.g., water)\n\t* but ĉihai is the opposite of that, so **how** one acts for that (e.g., you drink liquid) would be ĉihai (e.g., drink)\n\n## 7.5 Better section on the nominaliser\n* The nominalizer **-en** (IPA: /ɛn/) is a descendant of the **Takan** auxiliary for \"to do the act that which is [verb]\"\n* It is the mandatory bridge for turning any verbal root into a grammatical noun capable of taking particles like the topic marker **ni** *and as such*\n* For example:\n\t* *kita ni ii* -> `like TOP good`\n\t\t* this implies that the 'love' of like is good, not that the action of liking people or exhibiting it is\n\t* *kitaen ni ii* -> `like-NMLZ TOP good`\n\t\t* \"To like / liking is good\"\n* *en* also has a tendency to be poetic or intense, especially in stative constructions:\n\t* *unsen pokiunsji* -> `live-NMLZ big-life-LOC`\n\t\t* lit. \"Living in a big life\"\n\t\t* ~\"Being tall / being rich / etc.\"\n* Nominalised verbs can also be possessed to describe the possessor:\n\t* *so no fuenlos* -> `3SG.F GEN ACT-NMLZ-INDEF.PL`\n\t\t* \"Doings of hers / her various deeds or acts\"\n","8 TAM.md":"## 8.1 Tense\n* Tawa has no tense, only aspect\n\n## 8.2 Aspect\n### 8.2.1 Particle table\n|            | Particle | IPA   | Gloss |\n| ---------- | -------- | ----- | ----- |\n| **Suffix** | to       | `to`  | PFV   |\n| **Suffix** | eru      | `eɺu` | CONT  |\n| **Suffix** | iro      | `iɺo` | PRSV  |\n| **Suffix** | reo      | `ɺeo` | IPFV  |\n* Aspect can be marked on the agent (to denote its state) and on the verb (to denote its time of occurrence)\n* Examples:\n\t* *sua kamuthu* -> `1SG-AGT eat.V.PLAT-PFV.V.PLAT`\n\t\t* \"I ate\"\n\t* *sua kamueru* -> `1SG-AGT eat-CONT`\n\t\t* \"I am eating\"\n\t* *sua kamuiro* -> `1SG-AGT eat-PRSV`\n\t\t* \"I am still eating\"\n\t* *sua kamureo* -> `1SG-AGT eat-IPFV`\n\t\t* \"I will eat\"\n\n### 8.2.1 Extended aspect\n|            | Particle | IPA    | Gloss          | English equivalent                                         |\n| ---------- | -------- | ------ | -------------- | ---------------------------------------------------------- |\n| **Suffix** | naku     | `nəku` | `PST.PROG`     | *was (happening)*                                          |\n| **Suffix** | naga     | `nəga` | `PST.HAB`      | *used to*                                                  |\n| **Suffix** | saru     | `saɺu` | `PRF.STAT`     | *(will) have been / (would) have been / has (always) been* |\n| **Suffix** | reta     | `ɺeta` | `RESL`         | *completed with a lasting result / have (done)*            |\n| **Suffix** | fura     | `ɸuɺa` | `FUT.RESL`     | *to be completed with a lasting result / will have (done)* |\n| **Suffix** | rasu     | `ɺasu` | `PRST`         | *remains*                                                  |\n| **Suffix** | nata     | `nəta` | `FUT.CONT`     | *will keep*                                                |\n| **Suffix** | shibu    | `ɕibu` | `DUR.PRSV`     | *have kept*                                                |\n| **Suffix** | iva      | `iʋa`  | `FUT.PFV.PROG` | *will have been*                                           |\n| **Suffix** | rewa     | `ɺewa` | `FUT.PFV`      | *will have*                                                |\n* Usually aren't necessary, but can be used\n* Also reserved for poetry or formal texts\n\n#### 8.2.1.1 Usage\n* *naku* (~was happening)\n\t* it can refer to basic interruption:\n\t\t* *soramarunaku* -> `rain-V.PLAT-PST.PROG`\n\t\t\t* \"It was raining (when something else happened)\"\n\t* and nostalgic-adjacent states, without contrast:\n\t\t* *hajirãnaku* -> `angel.MOD-PST.PROG`\n\t\t\t* \"It was beautiful/angelic (back then / in that moment)\"\n* *naga* (~used to)\n\t* denotes a lost skill or habit:\n\t\t* *so ni haterunaga* -> `3SG.M TOP run.V.PLAT-PST.HAB`\n\t\t\t* \"He used to run (every day) back then\"\n\t* nostalgic, former states, with contrast:\n\t\t* *hajirãnaga* -> `angel.MOD-PST.HAB`\n\t\t\t* \"It used to beautiful/angelic (in those days, but it isn't anymore)\"\n* *saru* (~has always been)\n\t* describes eternal states:\n\t\t* *sowusaru* -> `shine.V.PLAT-PERF.RES`\n\t\t\t* \"It has (always) been shining (and still is)\"\n\t* and completed changes:\n\t\t* *gaidanaisaru* -> `open-MID-PERF.RES`\n\t\t\t* \"It has opened (and now shows everything it holds)\"\n\t\t* *urukunaisaru* -> `stand-MID-PERF.RES`\n\t\t\t* \"It has stood (and now stands at its height)\"\n\t\t* *miyahajirã sownyunaisaru* -> `plant.A-angel.MOD shine.V.ROM-MID-PERF.RES`\n\t\t\t* \"The awe-inspiring plant has bloomed/shined (and it is now in full bloom)\"\n* *reta* (~ended up)\n\t* resultative; denotes the resultative state\n\t* similar to *to* (PFV); however, it can denote **(1) regret**, **(2) total completion**, or a **(3) lack of control**\n\t* to distinguish between the three, the speaker's tone and context matters a lot\n\t* *-t* (*retat*, negative) or *-óí* (*retóí*, positive) can be used as well but they are often dropped as tone and context are often enough:\n\t\t* *rawareta* -> `sleep-RESL`\n\t\t\t* ~\"I couldn't help but sleep\"\n\t\t\t* ~\"I drifted off unintentionally\"\n\t\t* *makustareta* -> `cry-DIM.SUP-RESL`\n\t\t\t* ~\"I ended up crying\"\n\t\t* *kamureta kamteisunitanh* -> `eat.V-RESL food.PROD-1SG.POSS-PRTV-G.INV`\n\t\t\t* ~\"I completely finished all of my food (the whole of my food)\"\n\t* you can use it for mistakes, accidents, or regrets like this; in such constructions, it is almost the equivalent of the English 'oops' or similar:\n\t\t* *Teqekarrareta* -> `recount<EMO>-NEG-RESL`\n\t\t\t* ~\"Oh crap, (I) don't remember\"\n\t\t\t* ~\"(I'm) sorry... I don't remember\"\n\t\t* *Kamureta... kamteisan* -> `eat.V-RESL food.PROD-3SG.F.POSS`\n\t\t\t* ~\"(I'm) guilty of eating her food\"\n\t\t\t* ~\"Well... (I) kinda ate her food\"\n\t\t\t* ~\"I accidentally ate her food\"\n\t\t\t* ~\"(I'm) sorry, (because I) ate her food\"\n\t* you can use *retóí* or *retoi/retamg* (in Koyeah Tawa) (positive connotation) for a 'thankfully' effect\n\t\t* *retamg* is used for a simple 'thankfully ended up' effect, whereas *retoi* is used for a 'even though I regret it, I did it for a positive reason / it ended up being positive' nuance\n* *fura* (~to be done)\n\t* a future accomplishment\n\t\t* *sowufura* -> `shine.V.PLAT-FUT.RESL`\n\t\t\t* ~\"Will (finally) have shined (and stay shining)\"\n\t* a lasting result\n\t\t* *fiyuifura* -> `remove-FUT.RESL`\n\t\t\t* ~\"(It) will be removed with a lasting result\"\n* *rasu* (~remains)\n\t* to simply remain in a state (**-rasen** for the (explicit) nominalised form)\n\t\t* *sowrasen* -> `shine.PERS.NMLZ`\n\t\t\t* ~\"It remains shining\"\n\t\t* *sowurasu* -> `shine.V.PLAT-PERS`\n\t\t\t* ~\"It still / persists (to) shine / remains shining\"\n\t* to denote uninterruption:\n\t\t* *fofwasen* -> `speak.PERS.NMLZ`\n\t\t\t* ~\"(They are) still talking (even though it's late)\"\n\t\t\t\t* note: *wasen* is a variant of *rasen* used when the root ends in a consonant like *f-* which cannot cluster with *-r* (so *fr* turns into *fw*, hence *fofwasen*)\n* *nata* (~will keep)\n\t* to continue in the future:\n\t\t* *sowunata* -> `shine.V.PLAT-FUT.CONT`\n\t\t\t* ~\"It shall continue to shine\"\n\t* sticking with something:\n\t\t* *fofunata* -> `speak.V.PLAT-FUT.CONT`\n\t\t\t* ~\"They'll keep talking (on and on / anyway)\"\n* *iva* (~will have been)\n\t* future completion:\n\t\t* *eaiva* -> `MOV-FUT.PROG`\n\t\t\t* ~\"(I) will have have been going (by the time you arrive)\"\n\t\t* *sowuiva* -> `shine.V.PLAT-FUT.PROG`\n\t\t\t* ~\"It will have been shining\"\n* *rewa* (~will have)\n\t* perfective future:\n\t\t* *earewa* -> `MOV-FUT.PFV`\n\t\t\t* ~\"I will have gone (by the time you arrive)\"\n\t\t* *sowuchiva* -> `shine.V.PLAT-FUT.PFV`\n\t\t\t* ~\"It will have shined (and finished, (by then))\"\n* *shibu* (~have kept / maintained)\n\t* deliberate or intentional:\n\t\t* *sowushibu(t/óí)* -> `shine.V.PLAT-CONT.PRSV-(NEGATIVE/POSITIVE)`\n\t\t\t* ~\"(It) has kept shining (intentionally / deliberately)\"\n\t\t\t\t* if the intention or deliberate act was negative, you could use *shibut*, and if it was positive, you could use *shibóí*\n\t\t\t\t* without the connotation particles *-t* or *-óí*, it often does not carry intentionality\n\t* maintenance:\n\t\t* *teqekashibu* -> `recount<EMO>-CONT.PRSV`\n\t\t\t* lit. \"(I) have continued to remember\"\n\t\t\t* ~\"I have kept it in my heart / I have maintained this memory\"\n* **NOTE**\n\t* in NSKT, *shibu* is *shibo* / *she*\n\t\t* in the connector form:\n\t\t\t* *sheru* (verb)\n\t\t\t* *shibyu* (romantic verb)\n\t\t\t* *shemanai*\n\t\t\t* *shetasu*\n\t\t\t* *shemasu*\n\t\t\t* *shehamasu*\n\t\t\t* *shehatasu*\n\t\t* with *nai*:\n\t\t\t* *shibai*\n\n## 8.3 Mood\n### 8.3.1 Particle table\n| Placement                | Gloss     | Particle | IPA    | Function                                                             |\n| ------------------------ | --------- | -------- | ------ | -------------------------------------------------------------------- |\n| `EPIST-evidence`         | EPIST     | ipa      | `ipa`  | Marks epistemic stance                                               |\n| `ke V`                   | IMP       | ke       | `ke`   | Marks an imperative (e.g., *ke kamu!* (eat!)); informal, can be rude |\n| `V aiko`                 | IMP       | aiko     | `aiko` | Marks an imperative (e.g., *kamu aiko!* (eat!)); formal              |\n| `AGT-atai`               | DES       | atai     | `atai` | Expresses inner want, longing, emotional drive toward an action      |\n| `question ya`            | Q         | hyo      | `çʲa`  | Marks a polar interrogative                                          |\n| `open-ended question yo` | OPEN.Q    | hya      | `çʲo`  | Marks an open-ended question                                         |\n| `OPT-AGT`                | OPT       | are      | `aɺe`  | Marks hope, wish, or regret                                          |\n| `statement sai`          | AFFEC.REQ | sai      | `sai`  | Marks a polite request, often affectionate, personal, and intimate   |\n| `statement fuka`         | REQ       | fuka     | `ɸuka` | Marks a request (e.g., *hateru fuka* (please run!))                  |\n| `statement ana`          | AFFEC     | ana      | `ana`  | Marks warmth, appeal, or connection; affective and personal          |\n| `statement ya`           | ASSERT    | ya       | `ja`   | Asserting or emphasising                                             |\n\n### 8.3.2 Evidentiality\n* *ipa* is a bare evidential\n* In its default form *ipappu* it reflects the speaker's uncertainty or belief\n* But when a source is added after *ipa*, say, *riwaka* (think), then the epistemic source is more clearly marked\n* So, *ipariwaka* would be marking *riwaka* (thinking / thought / mind) as the source, meaning that the information came from your mind or thinking\n* Examples:\n\t* *ipappu sua kamuto* -> `EPIST-INDEP 1SG-AGT eat-PFV`\n\t\t* \"I guess I ate\"\n\t\t* \"I think I ate\"\n\t\t* \"I believe I ate\"\n\t* *ipaniru zua kamrreu sami* -> `EPIST-see 2SG-AGT eat.IPFV.ACC fish`\n\t\t* \"It seems that you will eat fish\"\n\t\t* \"It looks like that you will eat fish\"\n\t\t* \"By looking at you and your mannerisms, (I believe) that you'll be eating fish\"\n\t* *sa ni ipariwaka su ni iinqą* -> `3SG.F-AGT TOP EPIST-think 1SG-AGT good-INV-MOD`\n\t\t* \"She deduced that I was bad\"\n\t\t* \"She rationally came to the conclusion that I was bad\"\n\n### 8.3.3 Imperatives\n* *ke* and *aiko* are both used for imperatives\n* *ke* is harsher and may be ruder\n* Examples:\n\t* *ke kamu* -> `IMP eat`\n\t\t* \"Eat!\"\n\t* *kamu aiko* -> `eat IMP`\n\t\t* \"Eat!\"\n\n### 8.3.4 Desiderative\n* *atai
