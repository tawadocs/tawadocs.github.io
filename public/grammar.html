const DOCS_DATA = {"0 Tawish standard.md":"## 0.1 Standardisation\n* the grammar sheets 1-17 mix standard and nonstandard grammar; i.e., the grammars of Southern and Modern Tawa\n* this sheet will explain each standard grammar rule, as the sheets may be inconsistent and could fuel confusion\n\n## 0.2 O-roots\n* *o-roots* (′o-ganáán) refer to any root that ends in the vowel o\n* waoi is not an o-root, but jiteko is.\n* o-roots are special in that they have a few rules that must be followed\n\n### 0.2.1 Inflection\n* all o-roots inflect and replace their o with a particle\n\t* kamo + tei -> kamtei\n\t* kamo + (r)u -> kamu\n* in the case of verbal or noun particles, most o-roots inflect:\n\t* reo + (r)u -> reu\n\t\t* p.s. it should be reru according to (r)u's rules, but reo is a special case where it only turns into reu, not reru\n\t* wan + (r)u -> wanu\n* but some special o-roots, called garibànganáán (strange words), never inflect:\n\t* wano + (r)u -> wanoru\n\t* *wano* is also even weirder in that it doesn't even omit the *o* for *ą* (MOD) - which almost every other word does!\n\t\t* *wano* + *ą* = wanoą (time-MOD)\n* luckily, there aren't many garibànganáán, so this rule shouldn't make it harder to learn Tawa\n* also, special nasals replace nasal-final words:\n\t* hon + nq -> honq [hɔɴ] - never honnq [honɴ] or anything\n\n#### 0.2.1.1 Same types\n* never inflect if the type changes:\n\t* kamo + reo as kamreo is fine\n\t* but kamo + reu as kamreu (or even worse, kamoreu) is absolutely not\n\t\t* *kamo* must be the same type as *reu*, which is a platonic verb, so it would be *kamureu*\n\n#### 0.2.1.2 Grammatical particles\n* grammatical o-roots inflect differently:\n\t* reo + (r)u -> reu\n\t* to + (r)u -> thu\n\t* iro + (r)u -> irru\n\t* reo + tei -> reotei\n\t* to + tei -> totei\n\t* iro + tei -> irotei\n* if you ever need to inflect a grammatical root, remember:\n\t* as much of it must be preserved (reu is closer to reo than reru)\n\t* the o does not always need to be omitted (retei is alien compared to reotei, so the o is not omitted)\n\t* banned syllables are not allowed, use accepted alternatives (so to+ru->thu and to+į->thį)\n\t\t* do not use tsu or ĉi (standard alternatives) as they are alien when compared to an aspirated *t*, which sounds closest to *to*\n* though if its a demonstrative like ryo or ends with yo, then ryji-type constructions are fine, though ryjią would be wrong (ryąji is correct) \n\n#### 0.2.1.3 Preserving the ′o\n* Sometimes, inflection results in borderline unpronounceable clusters:\n\t* miro + l should be mirl, not miril (according to definite article rules)\n\t* but when liquids like r and l clash, the o is either preserved or added\n\t* if there is a word, say samil, and you must add rra to it, then either:\n\t\t* move the definite article: samirral\n\t\t\t* or *ilppu samirra*\n\t\t* move the negative: rra samil\n\t\t* use the linker: samil ce rra\n\n#### 0.2.1.4 -bjji and -pjji\n* according to ′o-omission rules, -bo + -ji should be -bji, not -bjji, and the same goes for -po + -ji (pji, not pjji)\n* however, these two grammatical particles don't follow this rule, so pjji and bjji are the official forms\n\n## 0.3 Marking\n* see Morphophonemics:4, though do note that Morphophonemics may also not be standardised; trust only this document\n\n## 0.4 Liquid clusters\n* liquid clashes [ɺl lɺ, ɺɾ, ɾɺ ʎl ʎɺ] are banned\n\t* [ɺʎ] or [lʎ] *could be* fine, though\n\n## 0.5 Product (tei) vs. noun particles\n* in Modern Tawa, *tei* and noun particles *(y)ĉ* and *nyĉ* aren't very different\n* *tei* is a relic from older languages, like Takan or early Tawish languages, which distinguished contextual products (*tei*) and denotational products (*gami*)\n* so, does this mean they are interchangeable? it would not be *inherently* wrong to use them interchangeably; however, due to grammatical quirks, you cannot use them interchangeably\n\n### 0.5.1 When to use *tei* and when not to\n* use tei if you want broader semantic space and contextual alteration:\n\t* kamtei is food or something edible, but it will refer specifically to pizza during pizza parties or all the food on the table in a buffet\n* use *(y)ĉ* if you want to simply mark something as a noun:\n\t* kamĉ will be anything edible or any food item, so it can refer to deserts, even during a pizza party\n* use *nyĉ* for the obvious romantic connotation:\n\t* *kamnyĉ* could be a sexual or romantic euphemism - context, creativity, and imagination are the limits\n\n## 0.6 The antiproduct particle\n* it is not correct to say that the antiproduct particle *hai* is just the opposite of *tei*\n* *tei* derives meaning contextually: kamtei can be pizza during pizza parties\n* though hai **can** derive contextual meaning, it works primarily to derive **how** one acts on something\n* for example:\n\t* *ĉi* -> liquid, flow\n\t* *ĉitei* -> usually water in many contexts, could be juice, though\n* but let's say you want to refer to the action of drinking - we can't use ĉiru for that, since:\n\t* ĉiru -> to water, to flow, etc\n* ĉiru would never mean 'drink' or 'sip'\n* for this reason, the antiproduct verbal particle exists (hai):\n\t* *ĉihai* -> to drink, to sip, to slurp, (to swallow)\n* ĉihai **can** mean 'to swallow' (as it is quite contextual, like tei) because one doesn't really eat a liquid, they let the liquid pass freely down\n* take this example of *rete*:\n\t* *retetei* / *reteĉ* -> ice\n\t* *retehai* -> to freeze\n\t* *reteru* -> to cool\n* and *naŝita*:\n\t* *naŝitatei* / *naŝitaĉ* -> fire, warmth, heat\n\t* *naŝitahai* -> burn, ignite, to breathe (fire), kindle, start a fire\n\t* *naŝitaru* -> to heat, to cook\n* let's see them in sentences:\n\t* *Duragin'ikua naŝitahai* -> `dragon-PERS-AGT warm-ANTIPROD.V`\n\t\t* \"The dragon breathed fire\"\n\t* *Honlena naŝitahai* -> `person-INDEF-AGT warm-ANTIPROD.V`\n\t\t* \"A person started the fire\"\n\t* *Ĉinq ni naŝitahai* -> `fire TOP warm-ANTIPROD.V`\n\t\t* \"The fire was ignited\"\n\t* *Sa ni retehaithu ẑi sua fofu sa kariĉesanita ę ii'iinq harison* -> `3SG.F TOP cold-ANTIPROD.V-PFV.V.PLAT TEMP 1SG-AGT speak.V.PLAT 3SG.F parent-M.PLAT-3SG.F.POSS-PRTV and SUPR.bad deal-3SG.M.POSS`\n\t\t* \"She froze (like ice) when I told her about the worst of her father's exchanges/trades\"\n* and let's finally see what would happen if we just used *(r)u*:\n\t* *ĉinq ni naŝitaru* -> `fire TOP warm-V.PLAT`\n\t\t* \"The fire heats / burns\"\n\t* *Duragin'ikua naŝitaru* -> `dragon-PERS-AGT warm-V.PLAT`\n\t\t* \"The dragon heats (up) / warms\"\n\t* *Sa ni retethu...* -> `3SG.F TOP cold-PFV.V.PLAT`\n\t\t* \"She froze (something) / she cooled\"\n* the antiproduct particle is context-sensitive - ĉihai can mean rinse if you say it in a public shower but it can mean 'drink' in a private domicile (e.g., 'Jèsei'ikua subų ĉihai ĉiǫ asahyakąsonji' (~Jesse wants to drink water in his private domicile)).\n\n### 0.6.1 A better explanation of the antiproduct particle\n* think of the antiproduct particle as a verbaliser; however, instead of verbalising a noun, it engages with a noun in the way it canonically functions in any way\n\t* the canonical function of water is, well, to drink it\n\t* that is why ĉihai means to drink water; however, if you're talking about showering, ĉihai could actually mean rinse\n\t* context would disambiguate anyway, though:\n\t\t* *sua subų ĉihai gagadenq ĉi umhi* -> `1SG-AGT desire.VLNK water-ANTIPROD.V SUP~dirty-INV water COM-BACK`\n\t\t\t* \"I want to clean myself with water\" (i.e., shower, rinse, since you can't 'drink' yourself with water)\n* the antiproduct particle is used to turn a root into a verb that can express the canonical action associated with it (as a phenomenon):\n\t* *koro* + *hai* -> to avoid death / to stay alive / kill / die / reap\n\t\t* *su ni korruhai!* -> `1SG TOP kill.V.PLAT-ANTIPROD.V`\n\t\t\t* \"I am staying alive / avoiding death\"\n\t\t* *sua korruhai sa* -> `1SG-AGT kill.V.PLAT-ANTIPROD.V 3SG`\n\t\t\t* \"I killed her\" (?) depends on context, plus don't use the antiproduct particle in these cases, even if it is **'technically'** correct!\n\t\t\t* as you're about to learn, *korruhai* would feel like saying 'the act that forcibly led to or of forcing the irreversible cessation of all vital functions in a living organism'\n* here is a simple rule: before using the antiproduct particle, ask yourself:\n\t1. what do you do to this noun?\n\t2. what does this noun do to you?\n* let's take the noun 'rice' (roĉi) and answer #1 and #2:\n\t* you cook and eat this noun\n\t* it fulfills you and helps with fibre\n* so:\n\t* roĉihai -> to cook rice / prepare rice\n\t* roĉihainai -> to gain fibre by eating rice / the process of preparing rice\n* it might be hard to grok initially, but once you understand the core concept, it should be as easy as counting on your fingers\n* I'll do it with another noun\n\t* let's use 'asa,' which can mean 'house:'\n\t\t* you eat, sleep, cook, work, and relax here\n\t\t* this noun protects you\n\t* so:\n\t\t* asahai -> to live at a specific place (i.e., home)\n\t\t* asahainai -> to be protected by a specific place (i.e., home)\n* and yes, **hainai** is not the same as **naihai**:\n\t* roĉinaihai -> to experience eating rice / to eat rice in a specific way (e.g., slowly or fast)\n* and if you use **hai** on an explicit or default verb, then it describes the canonical way to operate on the verb/event itself:\n\t* hateruhai (`run.V.PLAT-ANTIPROD.V`)\n\t\t* so, what do you think is the canonical way to operate on running? it could be described as a fast alternating gait cycle, where one leg is on the ground (stance) and the other in the air (aerial), working in coordination with the opposite arm to maintain balance\n\t\t* now, you could use this to describe stuff like cycling, especially swift cycling\n\t\t* the implications are limited only by your imagination!\n* so do use **hai** (`ANTIPROD.V`) with care!\n\n## 0.7 The person particle\n* the person particle (PERS) is not really a 'person' particle\n* it is used for any non-Tawish word, including loans like Duragin (dragon)\n\n## 0.8 Independentising and backshifting\n* *ppu* lets any bound morpheme become an unbound one and affect anything coming after it:\n\t* *itappu korteisan* -> `PRTV-INDEP kill.PROD-3SG.F.POSS`\n\t\t* \"About her death / murder\"\n\t* *korteisan itahi* -> `kill.PROD-3SG.F.POSS PRTV-BACK`\n\t\t* \"About her death / murder\"\n* On aspect, they also do not replace o, like *reoppu* or *reohi*\n* The *il* form of the definite article is used if INDEP or BACK needs to be attached to it, like *ilppu* or *ilhi*\n* See the relevant grammar sheet *Grammar:3* for more information.\n\n## 0.9 Modifiers\n* modifiers are derivational particles\n* o-roots must inflect to the modifier's ending\n* otherwise, do not use modifiers generally:\n\t* *hari jitei* -> exchange place (e.g., trading area, market), though haritei alone can work for this\n\t* *ii hon* -> good person\n* if you must disambiguate, a modifier is recommended:\n\t* *ryą kiwinq wanoharią* -> past week (lit. \"this finished business time\")\n* see Grammar:2 for more information\n\n## 0.10 To use *ea* or to not use *ea*\n* *ea* is a movement particle\n* as a modifier, it just signals 'this thing can move'\n* it is better to use it this way, like in natseeą (moving block / cube), which could be a trolley or cart\n* *tawa natse* would be less self-explanatory\n\n## 0.11 Inverser inflection\n* inversers (nh and nq) don't inflect:\n\t* kamo + nq -> kamonq\n\t* to + nh -> tonh\n* ... and so on.\n\n## 0.12 Numbering\n* stack to add up numbers, like:\n\t* wuwuwan (7, from 3+3+1)\n* for multisyllabic words (more than one syllables), reduplicate the initial syllable\n\t* tete -> tetete (10)\n\t* antaka -> anantaka (20)\n\t* sora -> sosora (100)\n* these pronouns can be used as numbers:\n\t* wu (3SG) = 3\n\t* zu (2SG) = 2\n\t* su (1SG) = 1\n* these words can be used as numbers:\n\t* kuenao (lose) = zero\n\t* tete (hands) = 5\n\t* antaka = 10\n\t* myĉ (many) = 20\n\t* sora (sky) = 100\n\t* subeko (all) = infinity\n* though using numbers from other languages, such as English, is fine too in many contexts\n\n## 0.13 Reduplication\n* see Grammar:6.2\n* reduplication is a casual or less formal and emphatic way to turn a word into its superlative form:\n\t* ii (good) -> ii'ii (best)\n* *nyi* is more 'loaded:'\n\t* ii (good) -> iinyi (unrivalled, matchless, supreme, nonpareil, crème de la crème, pinacle)\n* It isn't that reduplication is weaker per se; rather, reduplication is less grand - so *ii'ii* can mean crème de la crème but it isn't the first thing that comes to a listener's mind when one utilises reduplication\n* Note that reduplication refers to doubling the initial CV or VC or VV unit:\n\t* ***ku**ru* -> **kuku**ru\n\t* **ii** -> **ii**'**ii**\n\t* ***ka**nojo* -> **kaka**nojo\n\t* ***az**uru* -> **azaz**uru\n* For words like *ii*, the reduplicated sequence should be separated with a simple *'* - so **iiii** is written as *ii'ii*\n* Do note that reduplication is the only instance where *'* or *′* is not pronounced as a glottal stop\n\n## 0.14 Nasalised labiodental approximant\n* Modern Tawa fully lost this sound :(\n* it no longer appears anywhere\n\n## 0.15 Positive/negative connotation\n* though *-t* and *-óy* particles are not often used in Modern Tawa, they can be essential sometimes\n* take the case of *ainàwa* - it can mean glee or cunning both\n* to disambiguate, you use **ainàwat** for cunning or devious and **ainàwaóy** for empathetic\n\n## 0.16 Orthography\n* refer to the Orthography Reference for updates on this\n\n## 0.17 Using modals as phrasal modifiers\n* modals can be used as phrasal modifiers\n* they can also modify words\n* you must use a noun form\n* here is an example using *mermho* `['me.ɺ.m̥͡mo]`\n\t* *su ni iinq hon mermhhi, mo mo korrumasrra!* -> `1SG TOP good-INV person try.IRR.N.PLAT.BACK then then kill.V.PLAT-AG-NEG`\n\t\t* \"I might be a bad person, but I am (certainly not) a killer!\"\n\t\t\t* *mo mo* has a tendency to create strong contrastives, so 'certainly not' is automatic here\n* do note that **meromho, meromhhi,** and **mermhohi** are fine\n\n## 0.18 Compounding\n* Tawa loves compounding, so do make extensive use of it!\n* for example, verbs are frequently compounded:\n\t* *kiukennanda* -> `fly.NMLZ-down`\n\t\t* \"flying down\"\n\t* *senodzunanda* -> `send.V.PLAT-down`\n\t\t* \"to send down\"\n* see these two sentences, for example:\n\t* *honmyã ni senodzunanda Grránd-Cányín'ikullanh* -> `person-QNT.MOD TOP send.V.PLAT-down grand-canyon-PERS-ABL`\n\t\t* \"Many people plunge off the Grand Canyon\"\n\t* *zhupil ni hateruthunandanq asagalnin* -> `spider-DEF TOP run.V.PLAT-PFV.V.PLAT-down-INV house-side-DEF-PER`\n\t\t* \"The spider ran up the wall\"\n* so always use compounding for modification whenever possible; the particles -ã and -bu aren't meant to take on these roles\n* haterunandã would be to 'run downingly' and haterunandabu is even worse, meaning 'to run downishingly'\n\t* if you want to say that their running was 'down' in some manner, go wild\n\t* and if you want to say it was approximately down or had a property of down, sure, -bu works\n\t* but otherwise, use compounding!\n\n### 0.18.1 Spoken register\n* in the modern Tawish spoken register, you try to keep words as simple as possible\n* so instead of:\n\t* **kitakamenkanata** `like-eat.NMLZ-happy`\n\t\t* 'like to eat happily'\n* just say either one of these three:\n\t* **kitaũ kanata kamu**\n\t\t* simplest; `like-VLNK happy eat.V.PLAT`\n\t* **kitaũ kanatakamu**\n\t\t* usually never used; `like-VLNK happy-eat.V.PLAT`\n\t* **kitaũ kamukanatã**\n\t\t* archaic; `like-VLNK eat.V.PLAT-happy.MOD`\n* note that total compounding, like **kitakamenkanata** or similar forms in other words is often utilised in poetry\n* or in short speech, one can quickly say **a kitakamu hya?** `AGT like-eat.V.PLAT Q` to convey 'do you like to eat?'\n* so, when you speak in Tawa, always think:\n\t* is compounding simpler?\n\t* is it easier to parse and understand?\n\t* is it shorter and faster to say?\n* and then accordingly construct your sentences.\n\n## 0.19 Dictionary inaccuracies\n* some sentence examples in the dictionary's semantic space may be incorrect\n* if unsure, try to reconstruct them yourself or translate them from Japanese, since Tawa is closer to Japanese than it is to most other languages\n","1 Roots.md":"## 1.1 Structure\n* Word order is SVO\n* Modifiers go before the root\n* Syllable structure is simply CVC with little to no restrictions\n* **Root** words must be (C)V(N)\n","2 Derivation.md":"## 2.1 Social connotation\n| Particle | IPA    | Gloss    |\n| -------- | ------ | -------- |\n| nya      | `nʲa`  | F.ROM    |\n| nye      | `nʲe`  | M.ROM    |\n| ĉa      | `tɕa`  | F.PLAT   |\n| ĉe      | `tɕe`  | M.PLAT   |\n| óy      | `ɔj`   | POSITIVE |\n| t        | `t`    | NEGATIVE |\n| rei      | `ɺei`  | INANIM   |\n| mei      | `mei`  | ANIM     |\n| qe       | `c͡çe` | EMO      |\n* *kanojnya* `partner.F.ROM`: girlfriend\n* *kanojnye* `partner.M.ROM`: boyfriend\n* *kanojĉa* `partner.F.PLAT`: female friend (platonic)\n* *kanojĉe* `partner.M.PLAT`: male friend (platonic)\n* *kanojóy* `partner.POSITIVE`: assistant, helper\n* *kanojot* `partner-NEGATIVE`: accomplice\n* *kanojorei* `partner-INANIM`: deceased partner, soulless partner\n* *kanojmei* `partner.ANIM`: lively/enthusiastic partner, alive partner\n* *kanojqe* `partner.EMO`\n\t* highly context dependent; roughly means the 'emotion' or 'feeling' you get from your partner\n* *-qe* can also be used in the sense of:\n\t* *kamteiqe* `eat.PROD.EMO`: the feeling one gets from food\n\t* or simply *kamqe* `eat.EMO`: the feeling one gets from eating\n\t\t* and these may mean 'taste,' like here:\n\t\t\t* *kamqel no kekàsun hyo?* `eat.EMO-DEF GEN cake-1SG.POSS OPEN.Q`\n\t\t\t\t* lit. \"The taste of my cake?\"\n\t\t\t\t* ~\"How did my cake taste?\"\n* NOTE: *rei* and *mei* can also imply naturalisticness and artificialness!\n\n## 2.2 Semantic particles\n| Particle | IPA       | Gloss  |\n| -------- | --------- | ------ |\n| ku       | `[ku]`    | FIG    |\n| kunh     | `[kun̼]`  | LIT    |\n| ŝite    | `[ɕite]`  | EV.REL |\n| mas      | `[mas]`   | AG     |\n| taĉi    | `[taĉi]` | path   |\n| nampa    | `[nampa]` | number |\n* *ku* and *kunh* discriminate figurative and literal statements:\n\t* *deku zuǫ* `REC-FIG 2SG-OBJ`: I get you (fig.)\n\t\t* here, it means that the speaker emotionally understands the listener\n\t* *dekunh zuǫ* `REC-LIT 2SG-OBJ`: I get you (lit.)\n\t\t* here, it means the speaker has 'physically' or 'literally' received or got this person\n\t\t* it is often a euphemism for sexual intercourse\n* *ŝite* is often dropped in favour of *ẑi* in casual speech; however, it is important in formal conversation, as it adds explicit spatial context, whereas *ẑi* can be ambiguous in that it is used for temporospatial constructions as a whole:\n\t* *asaŝite ĉiĉ* `house-EV.REL water-N.PLAT`: the house (where water is / where there is water)\n\t* *asaŝite sao korrunai* `house-EV.REL 3SG.F-SUFF kill.V.PLAT-IV`: the house where she died\n* it is also simpler than using *ŝi*:\n\t* *asa ŝi ĉiji* -> 'the house in the context of the water's location'\n\t* *asa ŝi korteisan* -> 'the house in the context of her death / murder'\n* *mas* turns any word into an agentive:\n\t* *kamumas* `eat.V.PLAT-AG`: eater (e.g., connoisseur, food critic, gourmet, etc.)\n\t* *rumas* `CAUS.V.PLAT-AG`: causer (e.g., one who caused something)\n\t\t* in a sentence: *so ni rumasíl no iinqsubeką* `3SG.M TOP CAUS.V.PLAT-AG-DEF GEN good-INV-COLL.MOD`\n\t\t\t* \"He is the one who causes all bad things (to happen)\"\n* *taĉi* is a modifier form of *taĉi* (a realisable thing), used primarily to turn a word into a theory, worldview, or ideology:\n\t* *umataĉi* `community-idea`: a community ideology or theory (e.g., communitarianism, communism, etc.), often used to refer to communism\n\t* *honĉataĉi* `person-F.PLAT-idea`: a woman's ideology or theory (e.g., feminism)\n* *nampa* is similar to *taĉi* in that it is a modifier form of *nampa* (number, amount); it is used to turn a word, often a grammatical particle, into a number:\n\t* *nampa zu / zunampa* `number 2SG / 2SG-number`: two / second\n\t* there is no restriction or strict rules regarding *nampa*'s use, other than that it should be understandable by context\n\t\t* e.g., if a group associates *nanda* (lose) with 'zero,' then *nandanampa* means 0 (for them, as other groups might not associate *nanda* with zero)\n\n## 2.3 Explanation\n* These affixes are not necessary or essential to use\n* Often times, context does the trick\n* They are, however, used when disambiguation is needed or in extravagant, ceremonial, or poetic texts\n* The only affixes that will most commonly be utilised are *-nya*, *-nye*, *-ĉa*, *-ĉe*, *-mas*, *-taĉi*, and *-nampa*.\n\n\n## 2.4 Source-based derivation\n| Base form | IPA    | Gloss     |\n| --------- | ------ | --------- |\n| ááf     | `æːɸ`  | SRC.WHOLE |\n| áác     | `æːkʰ` | SRC.PART  |\n| áán     | `æːn`  | SRC.LEX   |\n* When this particle attaches to a root, it triggers a vowel change to the last vowel, turning it into its peripheral counterpart\n\t* for example:\n\t\t* *kita* (like) + *-v(VV)f* -> *kitvááf* (heart)\n* The last vowel of the root it attaches to is replaced with a *-v* and after the *v* that same vowel is added again but doubled in its peripheral form\n* If a root does not end in a vowel, their base forms *-áác* and *-ááf* are used:\n\t* *honáác*\n\t* *honááf*\n\n### 2.4.1 Usage\n* Both of these particles are used to derive a source from out of a root\n* Depending on the particle used, that source is either the fine active part in use or the source as a whole\n\t* e.g., *kitváác* can mean cardiac muscle or parts of the heart, or it can mean the specific emotion (e.g., longing, attachment, etc.) itself depending on the context\n* So, for example, the source of eating is our mouth as a whole, but the fine active parts involved are mostly the teeth, and depending on context, the throat\n* These particles can also be used metaphorically, like the source of our liking is not the brain but rather our heart\n* Valency does not matter:\n\t* *fofvóóf* (*fofo* + *-ááf*) -> `speak.SRC.WHOLE`\n\t\t* \"mouth ~ tongue ~ voice box\"\n\t* *fofnnavííf* (*fofo* + *nai* + *-ááf*) -> `speak-IV.SRC.WHOLE`\n\t\t* \"mouth ~ tongue ~ voice box\"\n\n### 2.4.3 Lexical source\n* *áán* is used for lexical source\n* It does not trigger a *-v-* to be attached and the last vowel be placed after this *v*\n* The format for *áán* is **VVn** where **VV** is the peripheral form of the final long-vowel in a root\n* In the root *mafo*, for example, the last vowel is *o*\n* In its peripheral long-form, this would be *öö*\n* *mafo* + **VVn** (*-áán*) yields *mafóón*\n* *mafo* means \"red\"\n* The lexical source of red is \"colour,\" so *mafóón* simply means colour\n\n### 2.4.4 Labiodentalisation\n* When a source is derived this way, the consonant sound is labiodentalised:\n\t* *riwakvááf* -> [ɺiwakᶹæːɸ]\n\n### 2.4.4 Specifying figurativeness\n* The particles *ku* and *kunh* can be used:\n\t* *kitvááfku* -> heart (i.e., seat of emotions, feelings)\n\t* *kitvááfkunh* -> heart (i.e., the physical organ)\n* However, these are usually not needed, as context is often enough\n","3 Basic syntax.md":"## 3.1 Particle table\n| Particle | IPA   | Gloss | Note                                         |\n| -------- | ----- | ----- | -------------------------------------------- |\n| ni       | `ɲi`  | TOP   | New information considered comment           |\n| a        | `a`   | AGT   | Marks the subject as a doer                  |\n| o        | `o`   | SUFF  | Marks the entity being affected              |\n| ǫ        | `õ`  | ACC   | Marks the direct object                      |\n| ppu      | `pːu` | INDEP | Turns a bound particle into a free one       |\n| hi       | `j̊i` | BACK  | Lets the previous clause act as one unit     |\n| nq       | `ɴ`   | INV   | Reverses the semantic content of a word      |\n| nh       | `n̼`  | G.INV | Reverses the semantic function of a particle |\n| nai      | `nai` | IV    | Reverses valency                             |\n| pai      | `pai` | RECP  | Marks reciprocal actions                     |\n\n## 3.2 Accusatives, agents, and sufferers\n* Use *ǫ* to mark accusative for words functioning as verbs that have not been marked verbs:\n\t* *sua kita zuǫ* `1SG-AGT like 2SG-ACC` -> \"I like you\"\n* However, omit *ǫ* if the word is already in its verb form (e.g., *o-words* that accept *(r)u* to turn into an innate verb):\n\t* *sua kamu sami* `1SG-AGT eat.V.PLAT fish` -> \"I eat fish\"\n\t\t* *kamu* is formed from *kamo* + *-(r)u* -> *kamu*\n\t\t* this is only for words that end in *o*; other words, unless they are naturally semantically non-verbs and must be verbalised, never take *-(r)u*\n* Use *a* to mark the doer of an action or as an implicit pronoun:\n\t* *a kamthu hya?* `AGT eat.PFV.V.PLAT Q` -> \"Have you eaten?\"\n\t* *sua haterthu* `1SG-AGT run.PFV.V.PLAT` -> \"I ran\"\n* Use *o* to mark an entity being affected by something:\n\t* *sao korru* `3SG.F-SUFF kill.V.PLAT` -> \"She was killed\"\n* The *a* `AGT` particle only marks the doer; however, it does not necessitate that a verb must follow; instead, any word type can follow, and the sentence is parsed depending on the word type:\n\t* *sua iitei* `1SG-AGT good-PROD` -> \"I am good\"\n\n## 3.3 Independentiser and backshift\n* *-ppu* and *-hi* are similar but not interchangeable particles\n* *-hi* lets a preceding phrase or clause act as one unit, like a variable, and *-ppu* turns a bound morpheme into an unbound one\n* Here is how *-hi* would be used:\n\t* *sua kita zuǫ nihi iią nayét* `1SG-AGT like 2SG-ACC TOP-BACK good-MOD 1PL-BEN`\n\t\t* here, the topic particle *ni* takes *-hi* to let the preceding clause *sua kita zuǫ* act as one unit\n\t\t* this allows *ni* to topicalise an entire sentence and comment on it with *iią nayét* (good for our benefit)\n\t\t* together, it may roughly be translated as: \"My liking you is beneficial for us\"\n* Now, let's take a look at the usage of *-ppu*:\n\t* *llappu asal no riwakatei* `ALL-INDEP house-DEF GEN think-PROD`\n\t\t* \"Towards the house of thought\"\n\t\t* here, *-ppu* lets *-lla* affect the sentence that comes after it\n\t* *ipappu sua kitarra riburyą* `EPIST-INDEP 1SG-AGT like-NEG book-this.PROX.MOD`\n\t\t* \"I guess I do not like this book\"\n\t\t* here, *-ppu* lets the bare evidential *-ipa* act as a standalone particle, indicating uncertainty or belief by default\n* Because using *-hi* in such contexts would require the listener to consciously track the sentence beforehand, *-ppu* is used, and vice versa\n\n## 3.4 Reversers or inversers\n* There are three inversers:\n\t* *nq*, *nh*, and *nai*\n* *nq* turns a word into its antonym, *nh* turns a grammatical particle into its opposite, and *nai* reverses the valency of a verb\n* Examples:\n\t* *nigonq* `dog` -> *nigo* means 'cat,' but *nigonq* means 'dog'\n\t* *llanh* `ABL` -> *lla* is the DAT/ALL case, but *llanh* is ABL\n\t* *korrunai* `die` -> *korru* is a verbal form of *koro* that means 'kill;' *korrunai* means 'die'\n\n## 3.5 Reciprocality\n* *pai* is used to denote reciprocals\n* It usually attaches to *-o* but in those cases, *-o* is omitted and the form *-ppai* is used, like in *suppai* (*su* + *-o* + *-pai*)\n* Here are two examples; in one, it is agentive, and the other sufferer:\n\t* *suppai kamu* -> `1SG-SUFF.RECP eat.V.PLAT`\n\t\t* \"I eat myself\"\n\t* *suapai kamu* -> `1SG-AGT-RECP eat.V.PLAT`\n\t\t* \"I eat by myself\"\n\t\t* \"I eat with myself\"\n* The latter sentence carries a lonely undertone whereas the former is autocannibalistic\n* *pai* is also used in reflexive constructions:\n\t* *suppai jiteku* -> `1SG-SUFF.RECP pee.V.PLAT`\n\t\t* \"I pee myself\"\n\t* compare with:\n\t\t* *suapai jiteku* -> `1SG-AGT-RECP pee.V.PLAT`\n\t\t\t* \"I pee with myself\"\n\t\t\t* \"I pee by myself\"\n\t\t\t* or less commonly \"I pee to (e.g., on) myself\"\n\n## 3.6 Topic\n* *ni* is the quintessential topic particle\n* Since Tawa lacks an English-style copular particle, such as *is*, *ni* is extremely important\n* Its usage is almost identical to the Japanese **wa** (は, ha)\n* Examples:\n\t* *honmafąl ni iią* -> `person-red.MOD TOP good`\n\t\t* \"(As for) the red man, (he is) good\"\n","4 Modifiers.md":"## 4.1 Particles\n| Particle | IPA   | Gloss |\n| -------- | ----- | ----- |\n| ą        | `ã`  | MOD   |\n| no       | `no`  | GEN   |\n| bu       | `bu`  | PROP  |\n| tas      | `tas` | POT   |\n* *ą* is a simple modifier; it is a universal particle\n* modifier order is free; however, when modifiers are chained, you must emphasise modifiers by placing the most emphasised ones closer to the word\n* *bu* is a formal modifier and not a universal particle; whenever possible, *ą* **must** be used instead of *bu*\n* It is an archaic particle that denotes property\n* These two sentences will attempt to differentiate between *ą* and *bu*:\n\t* *asaĉibu* `house-water-PROP` -> \"a slippery, wet, or watery house\"\n\t* *asaĉią* `house-water-MOD` -> \"a water house\"\n\t\t* it may mean 'a home made of water' or 'a slippery, wet, or water home' depending on context\n\t\t* since context is often enough, *-bu* is not usually used\n* *tas* is particle indicating potential:\n\t* *sa au iitaŝíl* `3SG.F HAVE.V.PLAT good-POT-DEF`\n\t\t* \"She has the potential for good / she has good potential\"\n\t* *kikitatas honlén* `SUPR.like-POT person-INDEF`\n\t\t* \"A / any loveable person\"\n\n## 4.2 When to and not to use modifiers\n* Use a modifier if:\n\t* something is being modified\n\t\t* *honmafą* - red person\n\t\t* *kamuhaterą* - eating fast\n* Do not use a modifier if:\n\t* nouns are being compounded:\n\t\t* *soraĉi* - sky-water (rain)\n\t\t* *mafaĉi* - red-water (blood)\n\t* multiple words work together to aid semantics:\n\t\t* *watadà zu* - only you\n\t\t* *ii hon* - good person\n\t\t* *watadà hateru* - only run (and don't do something else)\n* Here are some examples of when and when not to use modifiers:\n\t* *napiteiya* - snake (literally line-reptile); no modifier needed, as it is a noun compound\n\t* *poki kamu* - modifier needed: *pokią kamu* or *kamupokią* (to eat a lot)\n\t* *ii hon* - good person, modifier not needed\n\t* *poki hon* - big person, modifier not needed\n\t* *watadà subo* - only desire, modifier not needed\n* Also, if a word ends in -o, then it must be marked as a modifier, regardless:\n\t* *mafą hon* or *honmafą* - red person\n* Let's see what happens if we did add modifiers to that which did not need them:\n\t* *honiią* - a person of goodness, similar to saying *honme fu iiǫ* (person that does good)\n* To better understand this, think of modifiers as **derivative particles**, not just 'adjectives' or 'adverbs:'\n\t* *hatero* can mean 'fast, run, quick, swift, hurry, chase:'\n\t\t* *kamu hateru* (eat run, literally a compound meaning 'to eat and run')\n\t\t* *kamuhaterą* (eat fast, since *haterą* is now a modifier)\n* Now, a question: will it be:\n\t* *haterutas taĉirei* or *haterutasą taĉirei* to say 'runnable route'\n* If you answered the former, you would be correct\n\t* though the latter is not wrong per se, it is unnecessary\n\t* *haterutas* already implies modification due to *-tas* (potentiality)\n\t* furthermore, modifiers are a sort of derivational particle - here, haterutas does not need to be derived into an adjective form\n\t* also, if you used the construction *haterątas taĉirei*, then that would mean \"a path that can be fast\" or \"fastable path\" (context would be needed!)\n\n## 4.3 Order\n* Emphasis was explained already - place the most notable or emphasised adjectives closer to the word - but for words ending in o, always glue the most notable root to the word as a suffix:\n\t* *sawa honmafą* -> sweet, red person\n\t\t* this person is red, which is most notable, not how nice he is, because humans can be nice but they usually aren't red!\n\t* *mafą sawa hon* -> red, sweet person\n\t\t* here, his niceness is the most notable or emphasised, not his redness - maybe we already know he's a Martian?\n","5 Pronouns.md":"## 5.1 Table\n| Pronominal | IPA  | English equivalent | Gloss |\n| ---------- | ---- | ------------------ | ----- |\n| *su*       | `su` | I                  | 1SG   |\n| *sa*       | `sa` | she                | 3SG.F |\n| *so*       | `so` | he                 | 3SG.M |\n| *wu*       | `ʋu` | it                 | 3SG   |\n| *na*       | `na` | we                 | 1PL   |\n| *zu*       | `zu` | you                | 2SG   |\n| *za*       | `za` | you (pl.)          | 2PL   |\n| *ei*       | `ei` | that (proposition) | ANAPH |\n\n## 5.2 Genitives\n* Genitives are simply marked by appending *-n* [n̻] to the regular pronominal:\n\t* *kamzun* `food.2SG.POSS` -> \"Your food\"\n\t* *kamsun* `food.1SG.POSS` -> \"My food\"\n\t* *asasan* `house-3SG.F.POSS` -> \"Her house\"\n\n## 5.3 Different forms\n* Pronominal possession markers take a *t/d* form if the word ends in the same sequence:\n\t* *Dasun* + *-sun* -> *dasuntsun*\n\t* *Dazun* + *-zun* -> *dasundzun*\n* Pronunciation is self-explanatory\n\n## 5.4 Dropping\n* Pronominals can be dropped\n* Examples:\n\t* *A kamu ya?* -> `AGT eat.V.PLAT Q`\n\t\t* \"(Are you going to) eat?\"\n\n## 5.6 Anaphoric pronoun\n* *ei* is an anaphoric pronoun\n* It simply refers to a situation, event, or proposition\n* Examples:\n\t* *A kamu samil hya?* -> `AGT eat.V.PLAT fish-DEF Q`\n\t\t* \"(Are you going to) eat the fish?\"\n\t* *Sua ei* -> `1SG-AGT ANAPH`\n\t\t* \"I will eat it\"\n* If omitting the whole predicate causes too much ambiguity, then you may repeat it:\n\t* *A kamu sami ya?*\n\t* *Sua kamureu ei*\n\t\t* note: *kamureu* `eat.V.PLAT-IPFV.V.PLAT` is *kamo* + *(r)u* + *reo* + *(r)u*\n\n## 5.7 Dummy pronoun\n* *wu* can function as an expletive, like the English 'it'\n* However, it must never be used this way unless absolutely necessary\n* Other methods of constructing a sentence without using *wu* as an expletive are most preferred\n","6 Degree.md":"## 6.1 Particles\n| Particle | IPA   | Gloss   |\n| -------- | ----- | ------- |\n| nyi      | `nʲi` | AUG.SUP |\n| sta      | `sta` | DIM.SUP |\n| ie       | `ie`  | AUG     |\n| ól      | `ɔl`  | EXCESS  |\n\n## 6.2 Intensification and diminution\n* Order often does not matter\n* Reduplication marks superlatives; here is how it would be done on example roots:\n\t* kuru -> kukuru (e.g., vanta black)\n\t* ii -> ii'ii (e.g., best)\n\t* kanata -> kakanata (e.g., euphoria)\n\t* azuru -> azazuru (e.g., most blue/teal/green)\n* So, reduplication is repeating the initial CV or VC unit, like azuru -> azazuru or kuru -> kukuru\n* If the word is something like **ii** (good), then divide the vowels with a simple *'* (separates morae and is not pronounced as a glottal stop in this case; so **ii'ii** is ['iː.iː])\n* Reduplication and the *nyi* suffix are not interchangeable:\n\t* use reduplication for words that are:\n\t\t* short\n\t\t* monosyllabic\n\t\t* already inflected\n\t\t* taking affixes\n\t* use *nyi* for:\n\t\t* a formal, grand, or emphatic effect\n\t\t* standalone, longer words\n* Let's look at examples of when to and when not to use *nyi* and reduplication:\n\t* *ii* -> ii'ii, never iinyi\n\t* *koha* -> kokoha or kohanyi, both work, but depend on context: kohanyi for the cure of cancer is better than kokoha\n\t* *kanojo*\n\t\t* use *kakanojo* to describe someone you know fairly well, like a (best) friend in kakanojsun (my friend)\n\t\t* use *kanojnyi* to describe someone you know extremely well, like a spouse in kanojnyanyisun (my wife)\n* In the examples, reduplication isn't less strong than *nyi* per se; it's that *nyi* is more emphatic or loaded, so *kanojnyi* naturally carries a soulmate undertone, whereas *kakanojo* is better for really good friends\n* Examples:\n\t* *sa ni kanojstanyasun* -> `3SG.F TOP partner.DIM.SUP-F.ROM-1SG.POSS`\n\t\t* \"She is someone I just started dating\"\n\t* *sa ni kanojnyi* -> `3SG.F TOP partner.AUG.SUP`\n\t\t* \"She is my spouse\"\n\t* *raraŝimas* -> `SUP~teach-AG-AUG.SUP`\n\t\t* \"Full(-time) professor, guru\"\n\t* *raŝinyimas* -> `teach-AG.SUP-AG`\n\t\t* \"Guider, leader, idol, mentour, torch bearer\"\n\t* *raŝimassta* -> `teach-AG-DIM.SUP`\n\t\t* \"Student, learner\"\n\n## 6.3 Augmentatives, excessives, and comparatives\n* By default, *ie* and *ól* function as augmentatives and excessives\n* However, with context, they may be used as comparatives\n* Examples (non-comparative):\n\t* *samiryą ni ieii!* -> `fish-this-MOD TOP AUG-good`\n\t\t* \"This fish is pretty good!\"\n\t* *samiryą ni ii′ii!* -> `fish-this-MOD TOP SUPR-good`\n\t\t* \"This fish is really good!\" / \"This fish is the best!\"\n\t* *samiryą ni nanaŝita!* -> `fish-this-MOD TOP SUPR-warm`\n\t\t* \"This fish is extremely warm!\"\n\t\t* ~\"This fish is too hot!\"\n\t* *samiryą ni ólnaŝita* -> `fish-this-MOD TOP EXCESS-warm`\n\t\t* \"This fish is overwhelmingly scorching, boiling hot\"\n* Examples (comparative):\n\t* *asasun ni iepoki mo asazun* -> `house-1SG.POSS TOP AUG-big than house-2SG.POSS`\n\t\t* \"My house is bigger than yours\"\n\t* *mirol ni ólpoki mo ovsàki* -> `mirror-DEF TOP EXCESS-big than door`\n\t\t* \"The mirror is too big for the door\"\n","7 Nouns and verbs.md":"## 7.1 Particle table\n| Particle | IPA     | Gloss      |\n| -------- | ------- | ---------- |\n| tei      | `tei`   | PROD       |\n| hai      | `hai`   | ANTIPROD.V |\n| (y)ĉ    | `(j)tɕ` | N.PLAT     |\n| nyĉ     | `ɲtɕ`   | N.ROM      |\n| (r)u     | `(ɺ)u`  | V.PLAT     |\n| nyu      | `nʲu`   | V.ROM      |\n| én      | `ɛn`    | NMLZ       |\n| ų        | `ũ`    | VLNK       |\n| ce       | `kʰe`   | LINK       |\n* Tawa generally used to use *v'* (ṽ) for compound; however, Modern Tawa has dropped this particle:\n\t* *soraĉi* -> `sky-water`\n\t\t* \"Sky water (i.e., rain)\"\n\t* *kamĉkitvááf* -> `food-N.PLAT-like.SRC.WHOLE.FIG`\n\t\t* lit. \"food-feeling\"\n\t\t* ~\"taste\"\n* If noun-compounding has to be marked (it usually doesn't), then use *ce*:\n\t* *sora ce ĉi* -> `sky LINK water`\n* *ų* is used to let other verbs modify verbs but not for adverbs\n* Adverbs still use *ą*, like *riwakakikitą* (to think lovingly)\n\n## 7.2 Products\n* *tei* turns any root into its product, but it is context-dependent\n* So, *kamtei* (`eat.PROD`) is food but might be pizza in, for example, a pizza party\n* *ru* is often redundant but sometimes good for disambiguation, like in contexts where a root that is commonly used as a noun is used as a verb\n* *yĉ* takes the form *ĉ* before vowels and nasals other than the bilabial nasal (e.g. in *ĉiĉ* or *honĉ*)\n\t* note: use the *yĉ* form for bilabial nasals\n\t* e.g., **kamo** + **(y)ĉ** -> **kamyĉ**\n* Examples:\n\t* *sua kikitaų riwaka* -> `1SG-AGT SUPR-like-VLNK think`\n\t\t* \"I love to think\"\n\t* *kanojyĉ* -> `partner.PLAT`\n\t\t* \"friend (platonic)\"\n\t* *kanojnyĉ* -> `partner.ROM`\n\t\t* \"partner (romantic)\"\n\t* *sua subu zu* -> `1SG-AGT want.V.PLAT 2SG`\n\t\t* \"I want you\"\n\t\t\t* more platonic or detached; maybe as a friend\n\t* *sua subnyu zu* -> `1SG-AGT want.V.ROM 2SG`\n\t\t* \"I want you\"\n\t\t\t* here, it's explicitly affectionate and intimate\n* Note that *(y)ĉ* (platonic) can also be used to turn something into its formal equivalent and *nyĉ* (romantic) can be used to turn something into its informal equivalent:\n\t* *jiĉ* -> `LOC-N.PLAT`\n\t\t* \"a place (formal)\"\n\t* *jinyĉ* -> `LOC-N.ROM`\n\t\t* \"a romantic place (e.g., a restaurant for dates)\"\n* Though a **date** does not have to be informal, it is informal according to the grammar of the language\n* Also since the grammatical inverser *nh* is never used in cases like *(y)ĉ* and *nyĉ* (separate endings), it, therefore, does not change *(y)ĉ* to function as *nyĉ*; its role is different:\n\t* *jiĉ* -> `LOC-N.PLAT`\n\t\t* \"A platonic place (formal; e.g., clubs)\"\n\t* *jiĉnh* -> `LOC-N.PLAT-INV`\n\t\t* \"A platonic place (informal; e.g., a speakeasy, subversive venue, etc.)\"\n\t* *jinyĉ* -> `LOC-N.ROM`\n\t\t* \"A romantic place (informal; e.g., intimate café)\"\n\t* *jinyĉnh* -> `LOC-N.ROM-INV`\n\t\t* \"A romantic place (formal; e.g., formal dinner)\"\n\n## 7.3 Verb compounding\n* Verbs can be compounded as well:\n\t* *kamu hateru* (eat run, meaning 'to eat and run')\n\t* *rawaru fofu* (sleep talk)\n* But the primary action must come first, so:\n\t* *hateru kamu*\n\t* *fofu rawaru*\n* ... are both disallowed, as one cannot 'talk' first and 'sleep' second, which is why, even in English, it is 'sleep-talk,' not 'talk-sleep'\n\n## 7.4 Parents\n* *hai* marks a parent; i.e., the opposite of tei\n* For example:\n\t* *ĉihai* would be drink or sip, as opposed to ĉiĉ itself, which is any liquid as a noun\n\t* ĉitei would be the product of the action, so **what** one drinks (e.g., water) would be ĉitei (e.g., water)\n\t* but ĉihai is the opposite of that, so **how** one acts for that (e.g., you drink liquid) would be ĉihai (e.g., drink)\n","8 TAM.md":"## 8.1 Tense\n* Tawa has no tense, only aspect\n\n## 8.2 Aspect\n### 8.2.1 Particle table\n|            | Particle | IPA   | Gloss |\n| ---------- | -------- | ----- | ----- |\n| **Suffix** | to       | `to`  | PFV   |\n| **Suffix** | eru      | `eɺu` | CONT  |\n| **Suffix** | iro      | `iɺo` | PRSV  |\n| **Suffix** | reo      | `ɺeo` | IPFV  |\n* Aspect can be marked on the agent (to denote its state) and on the verb (to denote its time of occurrence)\n* Examples:\n\t* *sua kamuthu* -> `1SG-AGT eat.V.PLAT-PFV.V.PLAT`\n\t\t* \"I ate\"\n\t* *sua kamueru* -> `1SG-AGT eat-CONT`\n\t\t* \"I am eating\"\n\t* *sua kamuiro* -> `1SG-AGT eat-PRSV`\n\t\t* \"I am still eating\"\n\t* *sua kamureo* -> `1SG-AGT eat-IPFV`\n\t\t* \"I will eat\"\n\n### 8.2.1 Extended aspect\n|            | Particle | IPA       | Gloss         | English equivalent                                         |\n| ---------- | -------- | --------- | ------------- | ---------------------------------------------------------- |\n| **Suffix** | teru     | `teɺu`    | PFV.CONT      | *(will) have been / (would) have been / has (always) been* |\n| **Suffix** | reteru   | `ɺeteɺu`  | IPFV.PFV.CONT | *will have been*                                           |\n| **Suffix** | teruiro  | `teruiɺo` | PRSV.PFV.CONT | *have kept*                                                |\n| **Suffix** | eruto    | `eɺuto`   | CONT.PFV      | *was (happening)*                                          |\n| **Suffix** | ĉiro    | `tɕiɺo`   | PFV.PRSV      | *completed with a lasting result / have (done)*            |\n| **Suffix** | reiro    | `ɺeiɺo`   | IPFV.PRSV     | *to be completed with a lasting result / will have (done)* |\n| **Suffix** | ireru    | `iɺeɺu`   | PRSV.CONT     | *remains*                                                  |\n| **Suffix** | ĉireru  | `tɕiɺeɺu` | PFV.PRSV.CONT | *used to*                                                  |\n| **Suffix** | reeru    | `ɺeːɺu`   | IPFV.CONT     | *will keep*                                                |\n* Not used in normal or casual speech\n* Archaic forms, only for formal texts\n* Only use if necessary\n\n## 8.3 Mood\n### 8.3.1 Particle table\n| Placement                | Gloss     | Particle | IPA    | Function                                                             |\n| ------------------------ | --------- | -------- | ------ | -------------------------------------------------------------------- |\n| `EPIST-evidence`         | EPIST     | ipa      | `ipa`  | Marks epistemic stance                                               |\n| `ke V`                   | IMP       | ke       | `ke`   | Marks an imperative (e.g., *ke kamu!* (eat!)); informal, can be rude |\n| `V aiko`                 | IMP       | aiko     | `aiko` | Marks an imperative (e.g., *kamu aiko!* (eat!)); formal              |\n| `AGT-atai`               | DES       | atai     | `atai` | Expresses inner want, longing, emotional drive toward an action      |\n| `question ya`            | Q         | hyo      | `çʲa`  | Marks a polar interrogative                                          |\n| `open-ended question yo` | OPEN.Q    | hya      | `çʲo`  | Marks an open-ended question                                         |\n| `OPT-AGT`                | OPT       | are      | `aɺe`  | Marks hope, wish, or regret                                          |\n| `statement sai`          | AFFEC.REQ | sai      | `sai`  | Marks a polite request, often affectionate, personal, and intimate   |\n| `statement fuka`         | REQ       | fuka     | `ɸuka` | Marks a request (e.g., *hateru fuka* (please run!))                  |\n| `statement ana`          | AFFEC     | ana      | `ana`  | Marks warmth, appeal, or connection; affective and personal          |\n\n### 8.3.2 Evidentiality\n* *ipa* is a bare evidential\n* In its default form *ipappu* it reflects the speaker's uncertainty or belief\n* But when a source is added after *ipa*, say, *riwaka* (think), then the epistemic source is more clearly marked\n* So, *ipariwaka* would be marking *riwaka* (thinking / thought / mind) as the source, meaning that the information came from your mind or thinking\n* Examples:\n\t* *ipappu sua kamuto* -> `EPIST-INDEP 1SG-AGT eat-PFV`\n\t\t* \"I guess I ate\"\n\t\t* \"I think I ate\"\n\t\t* \"I believe I ate\"\n\t* *ipaniru zua kamrreu sami* -> `EPIST-see 2SG-AGT eat.IPFV.ACC fish`\n\t\t* \"It seems that you will eat fish\"\n\t\t* \"It looks like that you will eat fish\"\n\t\t* \"By looking at you and your mannerisms, (I believe) that you'll be eating fish\"\n\t* *sa ni ipariwaka su ni iinqą* -> `3SG.F-AGT TOP EPIST-think 1SG-AGT good-INV-MOD`\n\t\t* \"She deduced that I was bad\"\n\t\t* \"She rationally came to the conclusion that I was bad\"\n\n### 8.3.3 Imperatives\n* *ke* and *aiko* are both used for imperatives\n* *ke* is harsher and may be ruder\n* Examples:\n\t* *ke kamu* -> `IMP eat`\n\t\t* \"Eat!\"\n\t* *kamu aiko* -> `eat IMP`\n\t\t* \"Eat!\"\n\n### 8.3.4 Desiderative\n* *atai* is a desiderative, but its purpose goes beyond simple desire\n* It marks a deep, emotional longing for something specifically\n* See the difference between a non-desiderative and a desiderative sentence:\n\t* *su ni niruatai foŝssun* -> `1SG TOP see-DES friend.1SG.POSS`\n\t\t* \"I miss my friend\"\n\n### 8.3.5 Interrogatives\n* *hya* and *hyo* are both used for interrogatives\n* *hya* is used for open-ended questions, whereas *hyo* is used for simple polar questions\n* But both have collapsed into a general interrogative particle *hya*\n* *hyo* may still be used if it is necessary to mark the non-polarity of the question (like asking someone if they're feeling good with a *hyo* in order to show that they need to explain why or why not, though these types of constructions are rare!)\n* Examples:\n\t* *ryo ni fuyu hyo?* -> `this TOP what OPEN.Q`\n\t\t* \"What is this? (demanding an answer beyond simple negation or affirmation, or picking from a list)\"\n\t\t\t* lit. \"As for this, (it is) what?\"\n\t* *zua iitei hya?* -> `2SG-AGT good Q`\n\t\t* \"Are you good? (demanding affirmation or negation)\"\n\n### 8.3.6 Optative\n* *are* is used for marking optatives\n* Examples:\n\t* *areme sua au asa* -> `OPT-REL 1SG-AGT HAVE.V.PLAT house`\n\t\t* \"(I) wish that I had a home\"\n\t* *so areme sua kamtthu samil* -> `3SG.M OPT-REL 1SG-AGT eat.PFV.V.PLAT fish-DEF`\n\t\t* \"He wished that I ate the fish\"\n\n### 8.3.7 Requests\n* *sai* is used for highly intimate request in an affectionate way\n* *fuka* is more detached than *sai*\n* It's used for simple, but very polite, requests\n* It's used for strangers or when you want to request for something, but not in an intimate or affectionate way\n* Examples:\n\t* *a kamu suyét sai* -> `AGT eat.V.PLAT 1SG-BEN AFFEC.REQ`\n\t\t* \"(Will you) eat for me, please\"\n\t* *a mha kamu fuka* -> `AGT PRF eat.V.PLAT REQ`\n\t\t* \"Eat already, please!\"\n\n### 8.3.8 Affectionate ending\n* *ana* is used to end a statement or anything affectionately\n* Examples:\n\t* *su ni kita zuǫ ana* -> `1SG TOP like 2SG-OBJ AFFEC`\n\t\t* \"I like you, you know?\"\n\t\t* \"I like you, okay?\"\n","9 Clauses.md":"## 9.1 Particle table\n| Particle | IPA    | Gloss       |\n| -------- | ------ | ----------- |\n| eu       | `eu`   | REL.COP     |\n| me       | `me`   | REL         |\n| ę        | `ẽ`   | and         |\n| nwa      | `nʷa`  | but         |\n| ato      | `ato`  | or          |\n| mo       | `mo`   | then / than |\n| imo      | `imo`  | SIM         |\n\n## 9.2 Relative clauses\n* *me* and *eu* are used for relative clauses\n* *eu* is used when describing a stative or equative, but *me* is used when describing an identity\n* Example:\n\t* *honĉalme nirutthu honĉalme samila kamu hon* -> `person-F.PLAT-DEF-REL see.V.PLAT-PFV.V.PLAT person-F.PLAT-DEF-REL fish-DEF-AGT eat.V.PLAT person`\n\t\t* \"The girl that saw the girl that saw the fish eat a person\"\n\t* *honĉaleu korrumasnigą* -> `person-F.PLAT-REL.COP kill.V.PLAT-AG-cat.MOD`\n\t\t* \"The girl that is a cat killer\"\n* *me* can also be used to relativise:\n\t* *tanílme haterén sallanh euhi sa ni iinqą, iinqą korrumas* -> `reason-DEF-REL run.NMLZ 3SG.F-ABL REL.COP-BACK 3SG.F TOP bad-MOD bad-MOD kill.V.PLAT-AG`\n\t\t* ~\"The reason we are running away from her is that she is a bad, bad murderer\"\n\n## 9.3 Connecting clauses\n* Clauses may be connected with *so*, *ato*, *nwa*, or *ę*\n* *ę* is a simple additive, much like \"and\", but if used in the context of a verb, the overt object are not attached to the verb\n* *ę* also marks simultaneity, unlike *nwa*\n* *nwa* is like an additive, but it also flips polarity\n* *ato* is used for linking alternatives, just like *or*\n* *mo* is a connective particle; as *monh*, it denotes contrastiveness, but, as *mo*, it can denote either sequentiality (like *then* or *so* in English) or comparativeness (like *than* in English)\n* Examples:\n\t* *sua kikita samiǫ ę tsàma* -> `1SG-AGT love fish-ACC and soup`\n\t\t* \"I love fish and soup\"\n\t* *sua kikita samiǫ nwa tsàma* -> `1SG-AGT love fish-ACC but soup`\n\t\t* \"I love fish but not soup\"\n\t* *sua korru sa ato so hya?* -> `1SG-AGT kill.V.PLAT 3SG.F or 3SG.M Q`\n\t\t* \"Should I kill her or him?\"\n\t* *mo mo, sua kamu samil* -> `then then 1SG-AGT eat.V.PLAT fish-DEF`\n\t\t* \"But, I'm eating fish\"\n\t* *sua kamu samil, mo zua fofu 'ke kiwinq'* -> `1SG-AGT eat.V.PLAT fish-DEF then 2SG-AGT speak.V.PLAT 'IMP stop'`\n\t\t* \"I was eating fish until you said: 'stop'\"\n\t* *sua kamu tsàma mo hateronq asazunlla* -> `1SG-AGT eat.V.PLAT soup then walk house-2SG.POSS-ALL`\n\t\t* \"I will have some soup and then walk to your house\"\n\t* *samil ni iepoki mo samilén* -> `fish-DEF TOP AUG-big than fish-INDEF`\n\t\t* \"This fish is bigger than the other fishes\"\n* The semantically inversed form *monh* [mon̼] of *mo* (from *mo* + *-(nh)*) is used like \"because\" in English\n* Examples:\n\t* *a kitasta atoralós monh iekita eauca imo karabal* -> `AGT like-DIM.SUP apple-INDEF.PL because AUG-like fruit SIM creamfruit-DEF`\n\t\t* \"I barely like apples because I prefer fruits like the creamfruits (bananas, mangoes, strawberries, and kiwis)\"\n\n## 9.4 Similatives\n* Use *imo* in the sense of \"for example,\" \"such as,\" or \"like\"\n\t* *zua nasų kamu canúnh imo wano* -> `2SG-AGT can.VLNK eat.V.PLAT chain-ABESS SIM time`\n\t\t* \"You can eat without (a) chain, like time\"\n\t\t* ~\"You can eat freely without any restrictions, like time\"\n* You can stack grammatical particles on *imo* to yield other particles:\n\t* *imssta* -> attenuative (`ATT`)\n\t\t* *su ni imssta zu* -> `1SG TOP ATT 2SG`\n\t\t\t* \"I'm barely like you\"\n\t* *imonh* -> dissimilative (`unlike`)\n\t\t* *zua imonh karaba monh a toinqą* -> `2SG-AGT unlike creamfruit because AGT bitter-MOD`\n\t\t\t* \"You aren't like creamfruits, because you are (quite) bitter\"\n\t* *im* -> inequative (`INEQ`)\n\t\t* *sua im zu* -> `1SG-AGT INEQ 2SG`\n\t\t\t* \"I'm absolutely nothing like you\"\n\t* *imnyi* -> equative (`EQ`)\n\t\t* *su ni imnyi karabalú - óltoi!* -> `1SG TOP EQ creamfruit-DEF.PL EXCESS-sweet`\n\t\t\t* \"I'm a creamfruit - way too sweet!\"\n","10 Vocatives.md":"## 10.1 Usage\n| Particle | IPA   | Gloss |\n| -------- | ----- | ----- |\n| ta       | `ta`  | VOC   |\n| iku      | `iku` | PERS  |\n* *ta* is a vocative\n* It's like *oi*, *hey*, or *ey* in English\n* *iku* is similar to a vocative, but simply marks a referent as a human or person\n* *iku* always attaches as a complement to the complex mentioning the person\n* Examples:\n\t* *ta Émíli'iku! zua au kamtteil hya?* -> `VOC emily-PERS 2SG-AGT HAVE.V.PLAT eat.PROD-DEF Q`\n\t\t* \"Hey, Emily! Do you have the food?\"\n\t* *sua kikita Lusi'ikuǫ* -> `1SG-AGT SUPR.like lucy-PERS-ACC`\n\t\t* \"I love Lucy\"\n","11 Polarity.md":"## 11.1 Affirmation and negation\n| Particle | IPA  | Function             |\n| -------- | ---- | -------------------- |\n| rri      | `ɾi` | Used for affirmation |\n| rra      | `ɾa` | Used for negation    |\n* Both are suffixes but can be used in discourse as free particles\n* Examples:\n\t* *sua kamurra* -> `1SG-AGT eat.V.PLAT-NEG`\n\t\t* \"I did not eat\"\n\t* *sa′a korrurra sǫ* -> `3SG.F-AGT kill.V.PLAT-NEG 3SG.M.ACC`\n\t\t* \"She did not kill him\"\n\t* *rra, zu ni hakunqfofmmasyĉ* -> `NEG 2SG TOP falsehood-speak.AG-MOD-N.PLAT`\n\t\t* \"No, you're just another liar\"\n","12 Demonstratives.md":"## 12.1 Usage of demonstratives\n| Gloss    | Type     | Demonstrative | IPA   | Function                                                    |\n| -------- | -------- | ------------- | ----- | ----------------------------------------------------------- |\n| DEM.PROX | Proximal | byo           | `bʲo` | For something near the speaker                              |\n| DEM.MED  | Medial   | ryo           | `ɺʲu` | For something far from the speaker or close to the listener |\n| DEM.DIST | Distal   | lyo           | `ʎo`  | For something far from both the speaker and listener        |\n* These demonstratives above are in their base forms\n* They are often not used in their base forms and are used in their modifier forms:\n\t* *ryą*, *byą*, and *lyą*\n* Here's how to decide when and when not to use the modifier form:\n\t* use it:\n\t\t* if the demonstrative, as a thing or event, needs to be equated with something\n\t* don't use it:\n\t\t* if the demonstrative is marking general position\n* Some examples to help you understand:\n\t* *asaryą* -> `house-this.PROX.MOD`\n\t\t* \"**This** house\"\n\t* *ryo ni asaĉ* -> `this.PROX TOP house-N.PLAT`\n\t\t* \"**This is** a house\"\n* Simply:\n\t* *ryo* -> **there/this** in English\n\t* *byo* -> **here** in English\n\t* *lyo* -> **that/(over) there** in English\n\n## 12.2 Deixis\n* The same demonstratives can be used for temporal or spatial reference\n* Just use *jią* for spatial reference and *ẑią* for temporal reference\n\t* **SPATIAL**:\n\t\t* *ryojią* -> there\n\t\t* *byojią* -> here (close to listener)\n\t\t* *lyojią* -> that over there (far from speaker and listener)\n\t* **TEMPORAL**:\n\t\t* *ryoẑią* -> then / back then / that time\n\t\t* *byoẑią* -> now / this time\n\t\t* *lyoẑią* -> long ago\n","13 Determiners.md":"## 13.1 Articles\n| Article | IPA     | Gloss    |\n| ------- | ------- | -------- |\n| l(à)   | `l(ə)`  | DEF      |\n| lén    | `lɛn`   | INDEF    |\n| lö(s)  | `lɔ(s)` | INDEF.PL |\n| lü     | `lʊ`    | DEF.PL   |\n* *l* and *lén* are definite and indefinite articles\n* The definite article has the following forms:\n\t* *-là*: consonant-final roots, no morpheme stacking\n\t\t* e.g., *hon* + *-l* -> *honlà* (the person)\n\t* *-íl*: only when multiple morphemes are used and it has to appear after a consonant\n\t\t* e.g., *kiuko* + *ii* + *nq* *l* -> *kiukiinqíl*\n\t* *-l*: regular form\n\t\t* e.g., *kiuko* + *ii* + *l* -> *kiukiil*\n\t\t* or *kiuko* + *l* -> *kiukol*\n* Examples:\n\t* *honléna niru su* -> `person-INDEF-AGT see.V.PLAT 1SG`\n\t\t* \"A person sees me\"\n\t* *sua kamu samilén* -> `1SG-AGT eat.V.PLAT fish-INDEF`\n\t\t* \"I eat any (kind of) fish\"\n\n### 13.1.1 Plurality\n* The plural articles serve two functions: mark definiteness and plurality, as there is no overt plural marker\n* If *lós* appears before another marker, then the *s* is omitted, unless the marker starts with *ó*\n* Examples:\n\t* *honlós* -> `person-INDEF.PL`\n\t\t* \"A / any people\"\n\t* *hateru honlólla* -> `run.V.PLAT person-INDEF.PL-ALL`\n\t\t* \"Run to a / any people / person\"\n\t* *samilú* -> `fish-DEF.PL`\n\t\t* \"The / those fishes\"\n\t* *samilós* -> `fish-INDEF.PL`\n\t\t* \"A / any fishes\"\n\n## 13.2 Determiners\n| Determiner | IPA     | Gloss |\n| ---------- | ------- | ----- |\n| myo        | `m̥͡mo` | QNT   |\n| rra        | `ɺa`    | NEG   |\n* These are the base forms\n* They are often used in their modifier form with *-ą*, other than 'rra'\n* Examples:\n\t* *nigol* -> `cat-DEF`\n\t\t* \"the cat\"\n\t* *niglós* -> `cat-INDEF.PL`\n\t\t* \"any / some cats\"\n\t* *nigorra* -> `cat-NEG.MOD`\n\t\t* no cat\n\t* *nigmyą* -> `cat-QNT.MOD`\n\t\t* many cats\n\t\t* *myo no niglú* is also fine for 'many of the cats'\n","14 Relationals.md":"## 14.1 Temporal relationals\n| Relational | IPA     | Function                      | Gloss |\n| ---------- | ------- | ----------------------------- | ----- |\n| **mha**    | `m̥͡ma` | *Completed / already*         | PRF   |\n| **ha**     | `ha`    | *Incipient / about to happen* | INCP  |\n| **be**     | `be`    | *Imminent / soon*             | IMM   |\n| **ze**     | `ze`    | *Recurrent / repeated*        | ITER  |\n| **wari**   | `waɺi`  | *Frequent / a lot, often*     | FREQ  |\n| **he**     | `he`    | *Recent / just occurred*      | JUS   |\n| **ho**     | `ho`    | *Delayed / not yet*           | PEND  |\n| **źi**    | `ʑi`    | *When / during*               | TEMP  |\n* They're free particles and usually go before or after the verb\n* You may also use *nihi (X)* where *(X)* is your temporal relational:\n\t* *sua kamu saún samiǫ nihi wari* -> `1SG-AGT eat.V.PLAT 3SG.F-COM fish-ACC TOP-BACK FREQ`\n\t\t* \"As for my eating fish with her, (it happens) a lot\"\n\t\t* ~\"I eat fish with her a lot\"\n* Examples:\n\t* *A ha kamu* -> `AGT INCP eat.V.PLAT`\n\t\t* \"(I am) about to eat\"\n\t* *A be kamu* -> `AGT IMM eat.V.PLAT`\n\t\t* \"(I will) eat soon\"\n\t* *A he kamu* -> `AGT JUS eat.V.PLAT`\n\t\t* \"(I) just ate\"\n\t* *A ho kamu* -> `AGT PEND eat.V.PLAT`\n\t\t* \"(I have) not yet eaten\"\n\t* *A mya kamu* -> `AGT PRF eat.V.PLAT`\n\t\t* \"(I have) already eaten\"\n\t* *A ze kamu* -> `AGT ITER eat.V.PLAT`\n\t\t* \"(I have) eaten again\"\n\t* *A ho jiteku* -> `AGT PEND pee.V.PLAT`\n\t\t* \"(I) have not yet peed\"\n\t* *A ze jiteku* -> `AGT ITER pee.V.PLAT`\n\t\t* \"(I) peed again\"\n\t* *Hona wari jiteku* -> `person-AGT FREQ pee.V.PLAT`\n\t\t* \"People pee a lot\"\n\t* *Hona wari fofu* -> `person-AGT FREQ speak.V.PLAT`\n\t\t* \"People often speak\"\n* Temporal relationals can be used in tandem with aspectual particles\n* Examples:\n\t* *sora′a wari ĉiiro* -> `sky-AGT FREQ water-PRSV`\n\t\t* \"It still keeps frequently raining\"\n\n### 14.1.1 Temporal contextual relational\n* This particle is used to introduce temporal context\n* It has these forms:\n\t* *ẑinyi* -> `TEMP-AUG.SUP`\n\t\t* \"after\"\n\t* *ẑista* -> `TEMP-DIM.SUP`\n\t\t* \"before\"\n\t* *ieẑi* -> `AUG-TEMP`\n\t\t* \"circa / near / around\"\n\t* *ienhẑi* -> `DIM-TEMP`\n\t\t* \"not near / not around\"\n\t* *ólẑi* -> `EXCESS-TEMP`\n\t\t* \"way later / much later / much after\"\n\t* *ólonhźi* -> `DEFIC-TEMP`\n\t\t* \"way before / much before\"\n\n## 14.2 Dynamic relationals\n| Relational | IPA  | Function                                     | Gloss |\n| ---------- | ---- | -------------------------------------------- | ----- |\n| ao         | `ao` | To possess, exist with, or have              | HAVE  |\n| ro         | `ɺo` | To cause, create, or make                    | CAUS  |\n| de         | `de` | To receive                                   | REC   |\n| fu         | `ɸu` | To make potential real or bring about change | ACT   |\n| ea         | `ea` | To move or go                                | MOV   |\n* When modifying verbs, their modal form, like *ru* or *eaų* will be used (as in *rų ralanq* (\"made to stay awake\"))\n\n### 14.2.1 Existential relational\n* The existential relational, *ao*, denotes 'existing with,' or in plain English, 'having'\n* In constructions like \"X has Y,\" the verbal form *au* is used\n\t* *sua au ĉi* -> `1SG-AGT HAVE.V.PLAT water`\n\t\t* \"I have water\"\n\t* *sua au sami* -> `1SG-AGT HAVE.V.PLAT fish`\n\t\t* \"I have fish\"\n\n### 14.2.2 Causation\n* Causation is marked by *ro*\n* *ro* covers the scope of *make*, *create* and *cause* in English\n* Its verbal form is *ru*\n* Examples:\n\t* *sua ru kamu* -> `1SG-AGT CAUS.V.PLAT food`\n\t\t* \"I make food\"\n\t* *Pól'ikua ruthu kortteisan* -> `paul-PERS-AGT CAUS.V.PLAT-PFV.V.PLAT kill.PROD-3SG.F.POSS`\n\t\t* \"Paul was the reason she died\" / \"Paul caused her death\"\n\n#### 14.2.2.1 Causal\n* Use *ronai* for something in causal terms\n* *ronai* means something like \"to be (made)\"\n* Format:\n\t* `SUBJ-a rųnai X(verb)` -> \"Subject is made to do X\"\n\t* `SUBJ-a ronai X(noun)` -> \"Subject is made to be X\"\n\t* `SUBJ TOP rųnai X(verb)` -> \"As for subject, it is made to do X\"\n\t* `SUBJ TOP ronai X(noun)` -> \"As for subject, it is X\"\n* Examples:\n\t* *sua rųnai kamu* -> `1SG-AGT CAUS.VLNK-IV eat`\n\t\t* \"I am made to eat\"\n\t* *sua ronai hakariĉ* -> `1SG-AGT CAUS-IV absurd-N.PLAT`\n\t\t* \"I am made a fool\"\n\n### 14.2.3 Receiving\n* *de* is the versatile marker used for giving-receiving relations\n* By default, it covers the scope of the English words *get*, *understand*, and *receive*\n* Use *deku* or *dekunh* for specifying if the \"getting\" is metaphorical (e.g., understanding) or literal (e.g., physically receiving)\n* Most of the times, *deku* or *dekunh* are not necessary; context is enough\n* Examples:\n\t* *sua de zuǫ* -> `1SG-AGT REC 2SG-ACC`\n\t\t* \"I get you\"\n\t* *sua dethu mirozun* -> `1SG-AGT REC-PFV.V.PLAT mirror-2SG.POSS`\n\t\t* \"I got your mirror\"\n\t* *sua dereu nayét sami* -> `1SG-AGT REC-IPFV.V.PLAT 1PL-BEN fish`\n\t\t* \"I will get fish for us\"\n* *denai* may be used to mean *give*:\n\t* *sua denaireu zulla asal* -> `1SG-AGT REC-IV-IPFV.V.PLAT 2SG-DAT house-DEF`\n\t\t* \"I will give you the house\"\n* *denh* (`REC-G.INV` but preferred gloss is `GET`) may be used to mean *get*:\n\t* *sua denhreu nayét asapopokiąl!* -> `1SG-AGT GET-IPFV.V.PLAT 1PL-BEN house-SUPR.big-MOD-DEF`\n\t\t* \"I will get us the biggest house!\"\n\n### 14.2.4 Realisation\n* The actualiser, *fu*, is used to denote making change real\n* It's like \"do\" in English\n* Examples:\n\t* *sua fureu irimesun* -> `1SG-AGT ACT-IPFV.V.PLAT work-1SG.POSS`\n\t\t* \"I will do my work\"\n\t* *sua futhu emonol* -> `1SG-AGT ACT-PFV.V.PLAT picture-DEF`\n\t\t* \"I finished the picture\"\n\t\t* \"I did the picture\"\n\t\t* \"I worked on the picture\"\n* Also, you can't use it in constructions like \"I finished my food\":\n\t* *sua futhu kamssun* -> `1SG-AGT ACT-PFV.V.PLAT food.1SG.POSS`\n\t\t* \"I did my food\"\n\t\t* \"I worked on my food\"\n* In that sentence, *fu* is unable to convey enough information to form a meaningful sentence\n\n### 14.2.5 Movement\n* *ea* simply marks movement\n* Examples:\n\t* *sua ea asalla* -> `1SG-AGT MOV house-ALL`\n\t\t* \"I go to the house\"\n\t* *sua roreome sa′a ea asasunlla* -> `1SG-AGT CAUS-IPFV.REL 3SG.F-AGT MOV house-1SG.POSS-ALL`\n\t\t* \"I will have her come over to my house\"\n\t\t* \"I will have her at my house\"\n* For the latter example, this alternative construction is also valid:\n\t* *sua aureu sa ea asasunlla* -> `1SG-AGT HAVE.V.PLAT-IPFV.V.PLAT 3SG MOV house-1SG.POSS-ALL`\n\t\t* \"I will have her come to my home\"\n","15 Discourse.md":"## 15.1 Discourse particles\n| Particle | IPA   | Gloss         |\n| -------- | ----- | ------------- |\n| yád     | `jæd` | so            |\n| mo       | `mo`  | then          |\n| ám      | `æm`  | INTERJ        |\n| áni     | `æɲi` | ST.TOP.ANAPH  |\n| áa      | `æa`  | ADV.AGT.ANAPH |\n* **NOTE:** depending on context, *mo* can mean \"than\" too; *mo mo* means \"but\"\n* Examples:\n\t* *yád, zua fofnnaito koronaisanita hya?* -> `so 2SG-AGT hear-PFV kill-IV-3SG.F.POSS-PRTV Q`\n\t\t* \"So, did you hear about her death?\"\n\t* *sua kamu mo kamu mo kamu ę mo... kamuthu ielénĉ* -> `1SG-AGT eat.V.PLAT then eat.V.PLAT then eat.V.PLAT and then eat.V.PLAT-PFV.V.PLAT AUG-INDEF-N.PLAT`\n\t\t* \"I ate then ate then ate and then... ate some more\"\n\t* *mo mo sua kitanyu zu* -> `but 1SG-AGT like-V.ROM 2SG`\n\t\t* \"But, I love you\"\n\t* *ám, sua fofuthu fuyu hyo..?* -> `INTERJ 1SG-AGT speak.V.PLAT-PFV.V.PLAT what OPEN.Q`\n\t\t* \"Um, what was I saying?\"\n\n## 15.2 Phrases\n* Some idiomatic expressions include:\n\t* *a de ĉisun aiko!* -> `AGT REC water-1SG.POSS IMP`\n\t\t* \"Take my water!\"\n\t\t* meaning: \"no way / hold up / wait\"\n\t\t* marks attention, a potential change in stance, and even disbelief\n\t* *yád, ĉisuno tara* -> `so water-1SG.POSS-AGT spill`\n\t\t* \"Well, my water has been spilled\"\n\t\t* meaning: \"I'm done / I give up\"\n\t\t* marks resignation or defeat\n\t* *mha kiwinq tetezun* -> `PRF stop hand-2SG.POSS`\n\t\t* \"Just stop your hand\"\n\t\t* meaning: \"wait a second / calm down\"\n\t\t* marks patience\n\t* *kamureu ĉizun* -> `eat.V.PLAT-IPFV.V.PLAT water-2SG.POSS`\n\t\t* \"Will drink your water\"\n\t\t* meaning: \"to trust someone / to be ready to do something with someone\"\n\t\t* marks trust and readiness\n\n## 15.3 Anaphoric discourse particles\n* *áa* is used for subject-oriented anaphoric constructions where new context is needed, and where there may be an adversative mood needed\n* *áni* is used for topic-oriented anaphoric constructions where new context has to be in a state equated with the original predicate\n* Examples (difference of *áa* vs. *áni*):\n\t* *sua kamuto. áa sorala ĉiru* -> `1SG-AGT eat-PFV ADV.AGT.ANAPH sky-DEF-AGT water-V.PLAT`\n\t\t* lit. \"I ate. I did so even though the sky waters\"\n\t\t* ~\"I ate even though it rained\"\n\t* *sua kamuto. áni sorala ĉiru* -> `1SG-AGT eat-PFV ST.TOP.ANAPH sky-DEF-AGT water-V.PLAT`\n\t\t* lit. \"I ate. I did so whilst it rained for me\"\n\t\t\t* this is in a literal sense\n\t\t\t* *\"it rained for me\"* here literally indicates that the speaker only experienced the rain and that the others did not\n\t\t* ~\"I ate as it rained, but only for me\"\n* A more relevant use of *áni* is illustrated in this short dialogue:\n\t* A: *yád honlúa haterén ę haterén iyukryąllanh, ę su ni watada oĉikathu ryojią...*\n\t\t* `so person-DEF.PL-AGT run.NMLZ and run.NMLZ sound.this.PROX.MOD-ABL and 1SG TOP only stand-PFV.V.PLAT this.PROX-LOC-MOD`\n\t\t\t* \"so the people ran and ran, away from this sound, and I just stood there...\"\n\t* B: *zua watada oĉikathu hya?!*\n\t\t* `2SG-AGT only stand-PFV.V.PLAT Q`\n\t\t\t* \"you just stood there?!\"\n\t* A: *áni iyukryąa iyukurra*\n\t\t* `ST.TOP.ANAPH sound.this.PROX.MOD-AGT sound.V.PLAT-NEG`\n\t\t\t* \"I did so whilst this sound did not play for me\"\n* An explanation of the dialogue:\n\t* *A* saw people running due to a sound, but he stood there\n\t* *B* asks him why\n\t* *A* explains that he never heard the sound\n","16 Modals and conditions.md":"## 16.1 Modals\n### 16.1.1 Base forms\n| Particle | IPA     | English equivalent        | Gloss  |\n| -------- | ------- | ------------------------- | ------ |\n| subo     | `subo`  | *want, desire*            | desire |\n| aniso    | `aɲiso` | *need, require, must*     | need   |\n| naso     | `naso`  | *can, be able to*         | can    |\n| ako      | `ako`   | *manage, succeed*         | manage |\n| mero     | `meɺo`  | *attempt, try*            | try    |\n| ŝire    | `ɕiɺe`  | *know how to, understand* | know   |\n\n### 16.1.2 Verb forms\n| Particle | IPA     | English equivalent                               | Gloss         |\n| -------- | ------- | ------------------------------------------------ | ------------- |\n| subu     | `subu`  | *want, desire*                                   | desire.V.PLAT |\n| anisu    | `aɲisu` | *need, require*                                  | need.V.PLAT   |\n| nasu     | `nasu`  | *let, allow, permit, see to it*                  | can.V.PLAT    |\n| aku      | `aku`   | *be able to, make something work, succeed, come* | manage.V.PLAT |\n| meru     | `meɺu`  | *give it a go, have a try*                       | try.V.PLAT    |\n| ŝire    | `ɕiɺe`  | *know, understand*                               | know          |\n* Examples:\n\t* *ri, sua subu ĉil* -> `AFF 1SG-AGT want.ACC water-DEF`\n\t\t* \"Yes, I want the water\"\n\t* *sua nasume sa′a kamu ĉiitalnan?* -> `1SG-AGT can.V.PLAT-REL 3SG.F-AGT eat.V.PLAT water-PRTV-DEF-1PL.POSS`\n\t\t* \"I'll let her have some of the water of ours\"\n\t* *sua merreu samizunlyą* -> `1SG-AGT try.IPFV.V.PLAT fish-2SG.POSS-that.DIST.MOD`\n\t\t* \"I'll try that fish of yours\"\n\t* *sua ŝire zuǫ hya?* -> `1SG-AGT know 2SG.ACC Q`\n\t\t* \"Do I know you?\"\n\t* *sua anisu zu* -> `1SG-AGT need.V.PLAT 2SG`\n\t\t* \"I need you\"\n\t* *sua subnyu sa* -> `1SG-AGT desire.V.ROM 3SG.F`\n\t\t* \"I want her\"\n\n### 16.1.3 Modal forms\n| Modal forms | Particle | IPA                       | Gloss       |\n| ----------- | -------- | ------------------------- | ----------- |\n| subų        | `subũ`  | *want, desire*            | desire.VLNK |\n| anisų       | `aɲisũ` | *need, require*           | need.VLNK   |\n| nasų        | `nasũ`  | *can, be able to*         | can.VLNK    |\n| akų         | `akũ`   | *manage, succeed*         | manage.VLNK |\n| merų        | `meɺũ`  | *attempt, try*            | try.VLNK    |\n| ŝireų      | `ɕiɺeũ` | *know how to, understand* | know-VLNK   |\n* Examples:\n\t* *sua ŝireų fu katsueąlénǫ* -> `1SG-AGT know-VLNK ACT structure-MOV.MOD-INDEF-ACC`\n\t\t* ~\"I know how to drive a car\"\n\t\t* ~\"I know my way around a car\"\n\n### 16.1.4 Object forms\n| Modal forms | Particle | IPA                                  | Gloss      |\n| ----------- | -------- | ------------------------------------ | ---------- |\n| subǫ        | `subõ`  | *desire, want*                       | desire.ACC |\n| anisǫ       | `aɲisõ` | *need, urge, requirement, necessity* | need.ACC   |\n| nasǫ        | `nasõ`  | *ability, permission, allowance*     | can.ACC    |\n| akǫ         | `akõ`   | *success, management*                | manage.ACC |\n| merǫ        | `meɺõ`  | *try, attempt, have a go*            | try.ACC    |\n| ŝireǫ      | `ɕiɺeõ` | *knowledge, understanding, wisdom*   | know-ACC   |\n\n### 16.1.5 Product forms\n| Modal forms | Particle  | IPA                                | Gloss       |\n| ----------- | --------- | ---------------------------------- | ----------- |\n| subttei     | `subtei`  | *dream, longing, desire*           | desire.PROD |\n| anisttei    | `aɲistei` | *necessity*                        | need.PROD   |\n| nasttei     | `nastei`  | *possibility, ability*             | can.PROD    |\n| akttei      | `aktei`   | *achievement, victory, fulfilment* | manage.PROD |\n| merotei     | `meɺotei` | *effort, attempt, venture, try*    | try-PROD    |\n| ŝiretei    | `ɕiɺetei` | *knowledge, wisdom*                | know-PROD   |\n\n### 16.1.6 Modal usage\n* Examples:\n\t* *rume honléna noyuku ii nihi subtteisun* -> `CAUS.V.PLAT-REL person-INDEF-AGT heart.V.PLAT good TOP-BACK desire.PROD-1SG.POSS`\n\t\t* \"Making someone feel good is my dream\"\n\n## 16.2 Conditionality\n| Particle | IPA     | Gloss      |\n| -------- | ------- | ---------- |\n| ŝi      | `ɕi`    | COND       |\n| į        | `ĩ`    | IRR.VLNK   |\n| iyu      | `iju`   | IRR.V.ROM  |\n| icu      | `ikʰu`  | IRR.V.PLAT |\n| mhu      | `m̥͡mu` | IRR.N.ROM  |\n| mho      | `m̥͡mo` | IRR.N.PLAT |\n| pén     | `pɛn`   | IRR.NMLZ   |\n* *mhu* and *mho* are rarely used, as they are often replaced by *pén* or their respective verbal forms *iyu* and *icu*\n\n### 16.2.1 Irreal modals\n| Particle | IPA      | English equivalent                     | Gloss             |\n| -------- | -------- | -------------------------------------- | ----------------- |\n| subį     | `subĩ`  | *should*                               | `desire.IRR.VLNK` |\n| aniŝį   | `aɲiɕĩ` | *should have, should need, would need* | `need.IRR.VLNK`   |\n| naŝį    | `naɕĩ`  | *could*                                | `can.IRR.VLNK`    |\n| akį      | `akĩ`   | *would be able to*                     | `manage.IRR.VLNK` |\n| merį     | `meɺĩ`  | *might*                                | `try.IRR.VLNK`    |\n| ŝireį   | `ɕiɺeĩ` | *would know how to, would understand*  | `know.IRR.VLNK`   |\n* Examples:\n\t* *sua subį kamu* -> `1SG-AGT desire.IRR.VLNK eat`\n\t\t* \"I should eat\"\n\t* *sua merį akų kamu samilsan* -> `1SG-AGT try.IRR.VLNK manage.VLNK eat.V.PLAT fish-DEF-3SG.F.POSS`\n\t\t* ~\"I could try to eat that fish she prepared\"\n\n### 16.2.2 Conditionality\n* Use *ŝi* for expressing conditionality\n* It's just like the English 'if'\n* Examples:\n\t* *sua kamiicu ŝi soa denhthu kamtteilnan!* -> `1SG-AGT eat.IRR.V.PLAT COND 3SG.M-AGT GET-PFV.V.PLAT eat.PROD-DEF-1PL.POSS`\n\t\t* \"I would eat if he got our food!\"\n\t* *yád, soa niriicu su ŝi a hatero soienín* -> `so 3SG.M-AGT see.IRR.V.PLAT 1SG COND AGT run 3SG.M-AUG-PER`\n\t\t* \"Well, he would see me if I run past him\"\n* It also adds context like this:\n\t* *ŝi yaralji, su ni yara ǫppu: wanílų korru zu* -> `COND coming-DEF-LOC 1SG TOP become ACC-INDEP one-DEF-VLNK kill.V.PLAT 2SG`\n\t\t* \"In the future, I will be the one to kill you\"\n\n### 16.2.3 Usage of other irreal particles\n* The *iyu* particle is just the romantic equivalent of *icu*\n\t* *sua kitaiyu sa ŝi sa′a kitapaiĉiiyu su* -> `1SG-AGT like-IRR.V.ROM 3SG.F COND 3SG.F-AGT like-RECP-PFV.IRR.V.ROM 1SG`\n\t\t* \"I would love her only if she had loved me back\"\n\n### 16.2.4 Temporally marked irreal markers\n* For temporally marked irreal markers, just prepend *ù-* before the aspect or temporal marking\n* So, \"I would have eaten\" would be something like:\n\t* *sua kamùthu* -> `1SG-AGT eat.IRR-PFV.V.PLAT`\n* Romantic or platonic markers would go last and *iyu* or *icu* wouldn't be used\n","17 Cases.md":"## 17.1 Particle table\n| Particle | IPA     | Gloss     | NOTE                            |\n| -------- | ------- | --------- | ------------------------------- |\n| lla      | `lːa`   | DAT / ALL | -                               |\n| yé(t)   | `jɛ(t)` | BEN       | -                               |\n| ǫ        | `õ`    | ACC       | -                               |\n| ji       | `dʑi`   | LOC       | -                               |\n| po       | `po`    | FOR       | -                               |\n| bo       | `bo`    | -         | Irregular inversed form of *po* |\n| ita      | `ita`   | PRTV      | -                               |\n| un       | `ʊn`    | COM       | -                               |\n| nin      | `nɪn`   | PER       | -                               |\n\n## 17.2 Datives, allatives, and benefactives\n* Examples:\n\t* *a ke hatero asalla* -> `AGT IMP run house-ALL`\n\t\t* \"Run to the house\"\n\t* *a ke senodzu emonol kariĉasunlla* -> `AGT IMP send.V.PLAT picture-DEF MAKE-F.PLAT-1SG.POSS-DAT`\n\t\t* \"Send the picture to my mother\"\n\t* *a kamu suyét samil sai* -> `AGT eat.V.PLAT 1SG-BEN fish-DEF AFFEC.REQ`\n\t\t* \"Please eat the fish for me\"\n\t\t* lit. \"Please eat the fish for my benefit\"\n\n## 17.3 Ablatives, and malefactives\n* Examples:\n\t* *a ke hateru asallanh* -> `AGT IMP run.V.PLAT house-ABL`\n\t\t* \"Run (away) from the house\"\n\t* *a ke senodzu emonol kariĉasunllanh* -> `AGT IMP send.V.PLAT picture-DEF mother-1SG.POSS-ABL`\n\t\t* \"Send the picture away from my mother\"\n\t\t* ~\"Take away the picture from my mother\"\n\t* *a kamu suyenh sai* -> `AGT eat.V.PLAT 1SG-MAL AFFEC.REQ`\n\t\t* ~\"Please eat the fish to hurt me\"\n\t\t* lit. \"Please eat the fish for my detriment\"\n\n## 17.4 Accusatives\n* Used for **non-o-final roots**\n\t* *sua kita zuǫ* -> `1SG-AGT like 2SG-ACC`\n\t\t* \"I like you\"\n* **o-final roots** drop their **-o** and change to **-u**\n\t* *sua senodzu zulla emonol hya?* -> `1SG-AGT send.V.PLAT 2SG-DAT picture-DEF Q`\n\t\t* \"Should I send the picture to you?\"\n\n## 17.5 Locatives\n### 17.5.1 Simple location\n* Examples:\n\t* *su ni asaji* -> `1SG TOP house-LOC`\n\t\t* lit. \"(As for me), I am in house\"\n\t\t* ~\"I am at the house\"\n\t* *su ni asajinh* -> `1SG TOP house-OUT`\n\t\t* \"I am out of the house\"\n\n### 17.5.2 Approximative location\n* You may alter the degree of location with *ie*, *ieź*, or *öl*:\n\t* *ieji* -> near; *iejinh* -> not near / away\n\t* *jiji* -> right over; *jijinh* -> far away\n\t* *ólji* -> too close; *óljinh* -> too far\n* With *nyi* and *sta*:\n\t* *jinyi* -> above\n\t* *jista* -> below\n* Examples:\n\t* *ribul ni asalénieji* -> `book-DEF TOP house-NEAR`\n\t\t* \"The book is near a house\"\n\t* *ribul ni asaléniejinh* -> `book-DEF TOP house-AWAY`\n\t\t* ~\"The book is not near a house\"\n\t\t* ~\"The book is away from a house\"\n\t* *kanojnyasun ni suóljinh* -> `partner.F.ROM-1SG.POSS TOP 1SG-EXCESS-FAR`\n\t\t* lit. \"As for my girlfriend, she is too distant from me\"\n\t\t* ~\"My girlfriend is way too distant from me\"\n* These particles can also be used in comparatives:\n\t* *noyukssan ni soieji mo su* -> `heart.3SG.F.POSS TOP 3SG.M-NEAR than 1SG`\n\t\t* lit. \"As for her heart, he is closer (to it) than me\"\n\t\t* ~\"He is nearer to her heart than me\"\n\n### 17.5.3 Verbal locatives\n* These require the object to be accusative or for the verb to be in its accusative form\n* Examples:\n\t* *zua hateru asalji hya?* -> `2SG-AGT run.V.PLAT house-DEF-LOC Q`\n\t\t* \"Will you run into the house?\"\n\t* *a ke hateru asaljinh* -> `AGT IMP run.V.PLAT house-DEF-ELA`\n\t\t* \"Run out of the house\"\n\n## 17.6 Supportives and counter-supportives\n### 17.6.1 Stance\n* Examples:\n\t* *sa ni sopo* -> `3SG.F TOP 3SG.M-FOR`\n\t\t* ~\"She is for him\"\n\t\t* ~\"She is for his favour\"\n\t\t* ~\"She is in favour of him\"\n\t* *sa ni sobo* -> `3SG.F TOP 3SG.M-CNTR`\n\t\t* ~\"She is against him\"\n* These can be used in spatial contexts too:\n\t* *su ni asapo* -> `1SG TOP house-BES`\n\t\t* ~\"I am alongside the house\"\n\t* *su ni asabo* -> `1SG TOP house-OPP`\n\t\t* ~\"I am against the house\"\n\t\t* ~\"I am opposite to the house\"\n* If disambiguation is needed, append *-ji* accordingly:\n\t* *su ni asapjji*\n\t* *su ni asabjji*\n\n### 17.6.3 Terminatives and laterals\n* Examples:\n\t* *sua hateru asabjji* -> `1SG-AGT run.V.PLAT house-TERM`\n\t\t* ~\"I run up until the house\"\n\t\t* ~\"I run until the house\"\n\t* *sua hateru asapjji* -> `1SG-AGT run.V.PLAT house-LAT`\n\t\t* ~\"I run along the house\"\n\t\t* ~\"I run beside the house\"\n\n## 17.7 Comitative and instrumental\n* Examples:\n\t* *sua hateru foŝssunún nihi iią* -> `1SG-AGT run.V.PLAT friend.1SG.POSS-COM TOP-BACK good-MOD`\n\t\t* \"Me running with my friend is good\"\n\t* *zua kamu samiǫ naún hya?* -> `2SG-AGT eat.V.PLAT fish-ACC 1PL-COM Q`\n\t\t* \"Will you eat fish with us?\"\n\t* *a kenh kamu samilǫ tetezunún!* -> `AGT PROHIB eat.V.PLAT fish-DEF-AC
