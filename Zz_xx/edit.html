<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ganáán ribu | Tawa Lexicon</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --card-bg: #0f0f12;
    --card-hover: #16161a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #6366f1; 
    --accent-glow: rgba(99, 102, 241, 0.2);
    --toki-yellow: #facc15;
    --toki-glow: rgba(250, 204, 21, 0.2);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.15);
    --sidebar-bg: #0a0a0c;
  }
  
  /* Global Scrollbar Reset - Removed the total 'display: none' to allow functionality */
  * { box-sizing: border-box; }
  
  body { 
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% -20%, #1e1e2e 0%, #050505 80%);
    color: var(--text-main);
    margin: 0; padding: 0;
    line-height: 1.6;
    min-height: 100vh;
    /* Hide scrollbar for home page but keep scrolling active */
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  body::-webkit-scrollbar { display: none; }

  .container { max-width: 1000px; margin: 0 auto; padding: 4rem 2rem; }

  header { 
    display: flex; justify-content: space-between; align-items: center; 
    margin-bottom: 4rem;
  }

  .logo-group { display: flex; gap: 1.5rem; align-items: center; }
  .logo-link { text-decoration: none; transition: transform 0.2s ease; cursor: pointer; user-select: none; }
  .logo-link:hover { transform: translateY(-1px); }
  h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; color: white; margin: 0; }
  h1 span { color: var(--accent); }

  #search { 
    display: block; width: 100%; max-width: 600px; margin: 0 auto 4rem;
    padding: 1.2rem 1.5rem; background: rgba(255,255,255,0.03); 
    border: 1px solid var(--border); backdrop-filter: blur(10px);
    border-radius: 16px; color: white; outline: none; font-size: 1.1rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

  .entry { 
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 1.5rem; cursor: pointer;
    transition: all 0.3s ease; position: relative;
  }
  .entry:hover { transform: translateY(-5px); background: var(--card-hover); border-color: var(--border-hover); box-shadow: 0 12px 24px rgba(0,0,0,0.3); }

  .lang-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 12px; border-radius: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted);
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    margin-bottom: 1.2rem; cursor: pointer !important;
    user-select: none; min-width: 100px;
  }
  
  .lang-toggle:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); color: white; }

  .lang-toggle.is-toki {
    background: var(--toki-yellow); color: #000; border-color: var(--toki-yellow);
    box-shadow: 0 4px 15px var(--toki-glow);
  }

  .word-title, .editable-title { 
    font-size: 1.5rem; font-weight: 700; color: white; margin-bottom: 0.5rem; 
    letter-spacing: -0.02em; transition: opacity 0.2s ease, transform 0.2s ease, color 0.3s ease;
  }
  
  .is-shifting { opacity: 0; transform: translateY(2px); }
  .title-toki { color: var(--toki-yellow) !important; }

  .def-preview { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; pointer-events: none; }

  /* Modal Fixes */
  #modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
    z-index: 1000; opacity: 0; visibility: hidden;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #modal-overlay.active { opacity: 1; visibility: visible; }

  #modal {
    position: fixed; right: 0; top: 0; background: var(--sidebar-bg); 
    width: 100%; max-width: 520px; height: 100vh;
    padding: 4rem 3rem; border-left: 1px solid var(--border);
    box-shadow: -20px 0 60px rgba(0,0,0,0.8);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    /* SCROLL FIXES HERE */
    overflow-y: auto; 
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  
  /* Custom scrollbar for the modal sidebar */
  #modal::-webkit-scrollbar { width: 6px; }
  #modal::-webkit-scrollbar-track { background: transparent; }
  #modal::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 10px; }

  #modal-overlay.active #modal { transform: translateX(0); }

  .modal-close { position: absolute; top: 2rem; right: 2.5rem; cursor: pointer; color: var(--text-muted); font-size: 1.5rem; transition: 0.2s; user-select: none; z-index: 10; }
  .modal-close:hover { color: white; transform: rotate(90deg); }
  
  .editable-title { 
    font-size: 3.5rem; font-weight: 800; border: none; background: transparent; 
    outline: none; width: 100%; letter-spacing: -0.05em; font-family: inherit;
    margin-bottom: 0rem;
  }

  .id-container { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
  .id-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--toki-yellow); opacity: 0.8; letter-spacing: 0.05em; }
  .editable-id {
    background: rgba(250, 204, 21, 0.05); border: 1px solid rgba(250, 204, 21, 0.2);
    border-radius: 6px; padding: 4px 10px; color: var(--toki-yellow); font-family: inherit;
    font-size: 0.9rem; font-weight: 600; outline: none; width: auto; min-width: 150px;
    transition: 0.2s;
  }
  .editable-id:focus { background: rgba(250, 204, 21, 0.1); border-color: var(--toki-yellow); }

  .editable-defs-div { font-size: 1.2rem; line-height: 1.8; color: var(--text-main); padding: 0.5rem 0 1rem 0; outline: none; width: 100%; cursor: text; }

  .semantic-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin: 3rem 0 1rem 0; font-weight: 700; opacity: 0.8; }
  .modal-divider { height: 1px; background: var(--border); margin: 2rem 0; }
  
  .actions { 
    margin-top: 3rem; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding-bottom: 2rem; /* Ensure space at the bottom when scrolled */
  }
  
  .btn-save { background: white; color: black; border: none; padding: 0.8rem 1.8rem; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-save:hover { background: var(--accent); color: white; transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-glow); }
  
  .btn-delete { color: #ef4444; background: transparent; border: none; font-weight: 600; cursor: pointer; opacity: 0.6; }

  .btn-add { background: var(--accent); color: white; border: none; padding: 0.7rem 1.4rem; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px var(--accent-glow); }
  .btn-add:hover { transform: translateY(-2px); filter: brightness(1.1); }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-group">
      <a onclick="goHome()" class="logo-link"><h1>ganáán <span>ribu</span></h1></a>
      <a href="index.html" class="logo-link"><h1>ii miri <span>Tawa</span></h1></a>
    </div>
    <button class="btn-add" onclick="openNewWordModal()">+ New Entry</button>
  </header>

  <input type="text" id="search" placeholder="Search the lexicon..." autocomplete="off" />
  
  <div id="results"></div>
</div>

<div id="modal-overlay" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <span class="modal-close" onclick="closeModal()">×</span>
    <div id="modal-content"></div>
  </div>
</div>

<script>
let currentDictionary = [];
let semanticSpaces = {};

async function loadSemanticSpaces() {
  try {
    const res = await fetch('/ss.html');
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    doc.querySelectorAll('summary[id]').forEach(summary => {
      const p = summary.nextElementSibling;
      if (p && p.tagName.toLowerCase() === 'p') semanticSpaces[summary.id] = p.textContent.trim();
    });
  } catch (e) { console.error("Failed to load ss.html", e); }
}

function goHome() {
  document.getElementById('search').value = '';
  closeModal();
  loadWords('');
}

function handleToggle(event, word) {
  event.stopPropagation();
  const btn = event.currentTarget;
  const container = btn.closest('.entry') || btn.closest('#modal');
  const titleEl = container.querySelector('.word-title') || container.querySelector('.editable-title');
  
  const idInput = container.querySelector('#edit-id');
  const tokiPona = idInput ? idInput.value : btn.getAttribute('data-toki');

  const isToki = btn.classList.toggle('is-toki');
  
  titleEl.classList.add('is-shifting');
  
  setTimeout(() => {
    btn.innerHTML = isToki ? '<span>Toki Pona</span>' : '<span>Tawa</span>';
    
    if (titleEl.tagName === 'INPUT') {
        titleEl.value = isToki ? tokiPona : word;
    } else {
        titleEl.textContent = isToki ? tokiPona : word;
    }

    if (isToki) titleEl.classList.add('title-toki');
    else titleEl.classList.remove('title-toki');
    
    titleEl.classList.remove('is-shifting');
  }, 150);
}

async function loadWords(query = '') {
  try {
    const res = await fetch(`/search?q=${query}`);
    currentDictionary = await res.json();
  } catch (e) { console.error("Failed to load words", e); }
  
  document.getElementById('results').innerHTML = currentDictionary.map(entry => `
    <div class="entry" onclick="openModal('${entry.word}')">
      <div class="lang-toggle" data-toki="${entry.id}" onclick="handleToggle(event, '${entry.word}')">
        <span>Tawa</span>
      </div>
      <div class="word-title">${entry.word}</div>
      <div class="def-preview">${entry.definitions.map(d => d.text).join(', ')}</div>
    </div>
  `).join('');
}

function openModal(word) {
  const entry = currentDictionary.find(e => e.word === word) || { word: '', id: '', definitions: [] };
  const defString = entry.definitions.map(d => d.text).join(', ');
  const ssText = (entry.id && semanticSpaces[entry.id]) ? semanticSpaces[entry.id] : "";
  
  const modalContent = document.getElementById('modal-content');
  modalContent.innerHTML = `
    <div class="lang-toggle" onclick="handleToggle(event, '${entry.word}')">
      <span>Tawa</span>
    </div>
    <input type="text" id="edit-word" class="editable-title" value="${entry.word}" placeholder="word" spellcheck="false">
    
    <div class="id-container">
      <span class="id-label">Toki Pona</span>
      <input type="text" id="edit-id" class="editable-id" value="${entry.id}" placeholder="e.g. kijetesantakalu" spellcheck="false">
    </div>

    <div id="edit-defs" class="editable-defs-div" contenteditable="true" placeholder="Definitions...">${defString}</div>
    <div class="modal-divider"></div>
    <div class="semantic-title">Semantic space</div>
    <div id="edit-ss" class="editable-defs-div" contenteditable="true" style="color: var(--text-muted); font-size: 1.1rem;">${ssText}</div>
    <div class="actions">
      <button onclick="deleteWord('${word}')" class="btn-delete">Delete Entry</button>
      <button class="btn-save" onclick="saveWord('${word}')">Save changes</button>
    </div>
  `;

  const overlay = document.getElementById('modal-overlay');
  overlay.style.display = 'block'; 
  void overlay.offsetWidth; 
  overlay.classList.add('active');
  
  // Reset modal scroll position to top when opening
  document.getElementById('modal').scrollTop = 0;
  // Prevent body scroll when modal is open
  document.body.style.overflow = 'hidden';
}

function openNewWordModal() { openModal('_new'); }

function closeModal() { 
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('active');
  document.body.style.overflow = ''; // Restore body scroll
  setTimeout(() => { overlay.style.display = 'none'; }, 400); 
}

async function saveWord(originalWord) {
  const newWord = document.getElementById('edit-word').value.trim();
  const entryId = document.getElementById('edit-id').value.trim();
  const defString = document.getElementById('edit-defs').textContent;
  const ssText = document.getElementById('edit-ss').textContent;
  
  if (!newWord || !entryId) return;

  const defs = defString.split(',')
    .map(text => ({ text: text.trim(), frequency: 100 }))
    .filter(d => d.text);

  try {
    await fetch(`/word/${originalWord}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word: newWord, id: entryId, definitions: defs })
    });

    if (ssText && ssText.trim() !== "") {
      await fetch(`/semantic-space/${entryId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: ssText })
      });
      semanticSpaces[entryId] = ssText;
    }
  } catch (e) { console.error("Failed to save", e); }
  
  closeModal();
  loadWords(document.getElementById('search').value);
}

async function deleteWord(word) {
  if (word === '_new') return closeModal();
  if (!confirm(`Permanently remove "${word}"?`)) return;
  try { await fetch(`/word/${word}`, { method: 'DELETE' }); } catch (e) {}
  closeModal();
  loadWords();
}

document.getElementById('search').addEventListener('input', (e) => loadWords(e.target.value));
loadSemanticSpaces().then(() => loadWords());
</script>
</body>
</html>
