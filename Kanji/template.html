<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tawish Kanji | View Mode</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #06080e;
                --card: #10141f;
                --accent: #4f46e5;
            }
            body {
                background: radial-gradient(
                    circle at 50% 0%,
                    #161b2e 0%,
                    #06080e 100%
                );
                color: #e2e8f0;
                font-family: "Plus Jakarta Sans", sans-serif;
                min-height: 100vh;
                overflow-x: hidden;
            }
            .kanji-card {
                background: var(--card);
                border: 1px solid rgba(255, 255, 255, 0.03);
                transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
                cursor: pointer;
            }
            .kanji-card:hover {
                transform: translateY(-4px);
                border-color: rgba(129, 140, 248, 0.3);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            }
            #sidebar {
                box-shadow: -20px 0 50px -10px rgba(0, 0, 0, 0.5);
                background: rgba(16, 20, 31, 0.98);
                backdrop-filter: blur(20px);
                border-l: 1px solid rgba(255, 255, 255, 0.05);
            }
            .usage-box {
                background: rgba(79, 70, 229, 0.1);
                border: 1px solid rgba(79, 70, 229, 0.2);
            }
        </style>
    </head>
    <body class="p-6 md:p-10">
        <div id="overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300" onclick="closeSidebar()"></div>
        
        <div id="sidebar" class="fixed top-0 right-0 h-full w-full max-w-lg z-50 translate-x-full transition-transform duration-500 ease-out flex flex-col">
            <div class="p-8 flex justify-end">
                <button onclick="closeSidebar()" class="text-slate-500 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="sidebar-content" class="px-10 pb-10 overflow-y-auto"></div>
        </div>

        <div class="max-w-[1700px] mx-auto">
            <header class="grid grid-cols-1 md:grid-cols-3 items-center mb-16 gap-6">
                <div class="flex justify-start">
                    <a href="/" class="group flex items-center gap-2 text-slate-500 hover:text-white transition-all">
                        <div class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center group-hover:border-indigo-500/50 group-hover:bg-indigo-500/10 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                        </div>
                        <span class="text-xs font-bold uppercase tracking-widest">Back</span>
                    </a>
                </div>
                <div class="flex items-center justify-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <span class="text-white font-bold text-xl">漢</span>
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tighter text-white">
                        Tawish<span class="text-indigo-400"> KANJI</span>
                    </h1>
                </div>
                <div class="flex justify-end">
                    <div class="relative w-full max-w-xs">
                        <input
                            type="text"
                            id="search"
                            placeholder="Search meanings, romaji, kanji..."
                            oninput="renderGrid()"
                            class="w-full bg-[#10141f] border border-white/5 rounded-full px-6 py-3 text-sm outline-none focus:border-indigo-500/50 transition-all text-white"
                        />
                    </div>
                </div>
            </header>
            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
        </div>

        <script>
            // JSON DATA INJECTED HERE
            const kanjiData = [];

            function openSidebar(id) {
                const item = kanjiData.find(k => k.ID === id);
                if (!item) return;

                const content = document.getElementById("sidebar-content");
                content.innerHTML = `
                    <div class="flex flex-col gap-6">
                        <div class="text-7xl text-white font-light">${item.Radical}</div>
                        <div>
                            <div class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-1">${item.Readings.Romaji}</div>
                            <div class="text-2xl font-bold text-white">${item.Definitions.join(", ")}</div>
                        </div>
                        ${item.Usage ? `
                        <div class="mt-4">
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Usage</div>
                            <div class="usage-box p-5 rounded-2xl text-sm leading-relaxed text-indigo-100/80">
                                ${item.Usage}
                            </div>
                        </div>` : ''}
                        <div class="grid grid-cols-2 gap-4 mt-4">
                            <div class="bg-white/5 p-4 rounded-xl">
                                <div class="text-[10px] text-slate-500 uppercase font-bold">Reading</div>
                                <div class="text-white">${item.Readings.Japanese}</div>
                            </div>
                            <div class="bg-white/5 p-4 rounded-xl">
                                <div class="text-[10px] text-slate-500 uppercase font-bold">Strokes</div>
                                <div class="text-white">${item.Strokes}</div>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById("sidebar").classList.remove("translate-x-full");
                document.getElementById("overlay").classList.remove("opacity-0", "pointer-events-none");
            }

            function closeSidebar() {
                document.getElementById("sidebar").classList.add("translate-x-full");
                document.getElementById("overlay").classList.add("opacity-0", "pointer-events-none");
            }

            function renderGrid() {
                const q = document.getElementById("search").value.toLowerCase();
                const grid = document.getElementById("grid");

                const filtered = kanjiData.filter((k) => {
                    return (
                        k.Radical.includes(q) ||
                        (k.Alias || "").toLowerCase().includes(q) ||
                        (k.Readings.Romaji || "").toLowerCase().includes(q) ||
                        (k.Readings.Japanese || "").toLowerCase().includes(q) ||
                        k.Definitions.some((d) => d.toLowerCase().includes(q))
                    );
                });

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 font-medium">No results found for "${q}"</div>`;
                    return;
                }

                grid.innerHTML = filtered
                    .map(
                        (item) => `
                    <div class="kanji-card rounded-3xl p-8 flex flex-col" onclick="openSidebar('${item.ID}')">
                        <div class="flex items-baseline gap-3 mb-8">
                            <div class="text-4xl font-light text-white">${item.Radical}</div>
                            <div class="text-sm font-medium text-slate-500 uppercase tracking-widest">${item.Readings.Romaji}</div>
                        </div>
                        <div class="text-indigo-400 font-bold text-sm mb-2 truncate">
                            ${item.Alias || item.Readings.Japanese}
                        </div>
                        <div class="text-white font-semibold text-lg leading-tight mb-4 flex-grow">
                            ${item.Definitions.join(", ")}
                        </div>
                    </div>
                `,
                    )
                    .join("");
            }

            renderGrid();
        </script>
    </body>
</html>
